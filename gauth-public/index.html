<script>
(function(){
  var V='v39';
  if(localStorage.getItem('gauth_sw')===V) return;
  if(window.caches){
    caches.keys().then(function(ks){
      ks.forEach(function(k){ if(k!=='gauth-'+V) caches.delete(k); });
    });
  }
  if(navigator.serviceWorker){
    navigator.serviceWorker.getRegistrations().then(function(regs){
      regs.forEach(function(r){r.unregister()});
      navigator.serviceWorker.register('sw.js?v='+V).then(function(){
        localStorage.setItem('gauth_sw',V);
      });
    });
  } else {
    localStorage.setItem('gauth_sw',V);
  }
})();
</script>

<script>

function _siCopy(text,btn){
  navigator.clipboard.writeText(text).then(function(){
    var orig=btn.innerHTML;btn.innerHTML='✅ 복사됨';btn.style.background='#0d3222';
    setTimeout(function(){btn.innerHTML=orig;btn.style.background='';},1200);
  });
}
function copyStreamTitle(e){
  _siCopy(document.getElementById('streamTitle').textContent,e.currentTarget||e);
}
function copyStreamDesc(e){
  var el=document.getElementById('streamDesc');
  var text=el.innerHTML.replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]*>/g,'').replace(/&amp;/g,'&');
  _siCopy(text,e.currentTarget||e);
}
</script>

<div id="accStats" style="padding:8px 20px;background:#0d1520;border-bottom:1px solid #22282f;font-size:13px;color:#9aa5b5;text-align:center"></div>
<div id="monthlyGroups" style="padding:6px 20px;background:#0d1520;border-bottom:1px solid #22282f;font-size:12px;color:#c9d2dc;text-align:center"></div>
<script>
/* MDN: Element.innerHTML XSS 방지 — https://developer.mozilla.org/en-US/docs/Web/API/Element/innerHTML#security_considerations */
function _esc(s){return String(s==null?'':s).replace(/[&<>"'`\\]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;','\\':'&#92;'}[c];})}
var escapeHtml=_esc;
async function refreshAccStats(){
  try {
    const [rp, j, na] = await Promise.all([
      fetch(authQuery('/api/parse-report'),{cache:'no-store',headers:authHeaders()}).then(r=>r.json()).catch(()=>({})),
      fetch(authQuery('/api/accounts'),{cache:'no-store',headers:authHeaders()}).then(r=>r.json()).catch(()=>({})),
      fetch(authQuery('/api/normalized-accounts'),{cache:'no-store',headers:authHeaders()}).then(r=>r.json()).catch(()=>({}))
    ]);
    const _files = (na.summary && na.summary.files_scanned) || (rp && rp.last_run ? rp.last_run.files : 0) || 0;
    var el = document.getElementById('accStats');
    var _2fa = (j.accounts||[]).filter(function(a){return a.has2FA;}).length;
    if(el) el.innerHTML = '📄 엑셀 파일 <b style="color:#7dabff">'+_esc(_files)+'</b>장 · 📊 원본 <b style="color:#7dabff">'+_esc(j.file_total||0)+'</b>개 · 로그인 가능 <b style="color:#3ddc84">'+_esc(j.usable||0)+'</b>개 · 제외 <b style="color:#f47070">'+_esc(j.invalid||0)+'</b>개 (이메일/비번 미비) · 2FA <b style="color:#f5c842">'+_esc(_2fa)+'</b>개';
    var mg = document.getElementById('monthlyGroups');
    var fileBreakdown = (rp && rp.last_run && rp.last_run.file_details) || (na.summary && na.summary.file_details) || null;
    var mgHtml = '';
    if(rp && rp.last_run && rp.last_run.by_date){
      mgHtml += '📅 ';
      Object.entries(rp.last_run.by_date).sort().reverse().forEach(function(e){
        mgHtml += '<span style="margin:0 6px;padding:3px 8px;background:#161a20;border-radius:6px">'+_esc(e[0])+': <b style="color:#3ddc84">'+_esc(e[1])+'</b></span>';
      });
    }
    if(fileBreakdown && fileBreakdown.length){
      mgHtml += '<details style="margin-top:6px;display:inline-block;text-align:left"><summary style="cursor:pointer;color:#7dabff;font-weight:700;font-size:12px">📁 파일별 계정 수 ('+fileBreakdown.length+'개)</summary><div style="margin-top:4px;max-height:200px;overflow-y:auto">';
      fileBreakdown.forEach(function(f,i){
        mgHtml += '<div style="padding:2px 8px;font-size:11px;border-bottom:1px solid #1a1f26;display:flex;justify-content:space-between"><span style="color:#8a95a5;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(i+1)+'. '+_esc(f.name)+'</span><span style="color:'+(f.count>0?'#3ddc84':'#f47070')+';font-weight:700">'+_esc(f.count)+'개</span></div>';
      });
      mgHtml += '</div></details>';
    } else {
      var fileCounts = {};
      (j.accounts||[]).forEach(function(a){ var src = a.source_file||'unknown'; fileCounts[src] = (fileCounts[src]||0)+1; });
      var fileEntries = Object.entries(fileCounts).sort(function(a,b){return b[1]-a[1]});
      if(fileEntries.length){
        mgHtml += '<details style="margin-top:6px;display:inline-block;text-align:left"><summary style="cursor:pointer;color:#7dabff;font-weight:700;font-size:12px">📁 파일별 계정 수 ('+fileEntries.length+'개)</summary><div style="margin-top:4px;max-height:200px;overflow-y:auto">';
        fileEntries.forEach(function(e,i){
          mgHtml += '<div style="padding:2px 8px;font-size:11px;border-bottom:1px solid #1a1f26;display:flex;justify-content:space-between"><span style="color:#8a95a5;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(i+1)+'. '+_esc(e[0])+'</span><span style="color:#3ddc84;font-weight:700">'+_esc(e[1])+'개</span></div>';
        });
        mgHtml += '</div></details>';
      }
    }
    if(mg) mg.innerHTML = mgHtml;
  } catch(e){
    var el = document.getElementById('accStats');
    if(el && !el.innerHTML) el.style.display='none';
  }
}
refreshAccStats();
/* 새로고침 후 업로드 진행 상태 폴링 */
(function(){
  var ts = localStorage.getItem('gauth_uploading');
  if(!ts) return;
  /* 600000ms = 10분 — 업로드 타임아웃과 일치 (서버 req.setTimeout(600000)) */
  if(Date.now() - Number(ts) > 600000){ localStorage.removeItem('gauth_uploading'); return; }
  var bar = document.getElementById('accStats');
  var origText = bar ? bar.innerHTML : '';
  if(bar) bar.innerHTML = '⏳ 서버에서 엑셀 처리 중… 잠시 후 자동 갱신됩니다';
  var prevMaster = 0;
  var poll = setInterval(function(){
    fetch(authQuery('/api/parse-report'),{cache:'no-store',headers:authHeaders()}).then(function(r){return r.json()}).then(function(rp){
      var lr = rp.last_run || {};
      var updAt = new Date(lr.updated_at||0).getTime();
      if(updAt > Number(ts)){
        clearInterval(poll);
        localStorage.removeItem('gauth_uploading');
        refreshAccStats();
        var banner = document.createElement('div');
        banner.id = 'uploadDoneBanner';
        banner.style.cssText = 'position:fixed;top:0;left:0;right:0;padding:14px 20px;background:linear-gradient(135deg,#0d3222,#1c4a35);color:#3ddc84;font-size:15px;font-weight:700;text-align:center;z-index:9999;border-bottom:2px solid #3ddc84';
        banner.textContent = '✅ 엑셀 처리 완료 — 마스터 ' + (lr.total_master||0) + '개';
        document.body.prepend(banner);
        setTimeout(function(){ var b=document.getElementById('uploadDoneBanner'); if(b) b.remove(); }, 8000);
      }
    }).catch(function(){});
  }, 3000);
  /* 600000ms = 10분 — 폴링 최대 시간, 서버 타임아웃과 일치 */
  setTimeout(function(){ clearInterval(poll); localStorage.removeItem('gauth_uploading'); }, 600000);
})();
</script>

<script>
/* MDN: KST 자정 = 오늘 00:00 Asia/Seoul → epoch ms
 * ref: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Intl/DateTimeFormat */
function kstTodayMidnightMs(){
  var now = new Date();
  var parts = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit'}).formatToParts(now);
  var y = parts.find(p=>p.type==='year').value;
  var m = parts.find(p=>p.type==='month').value;
  var d = parts.find(p=>p.type==='day').value;
  /* 해당 KST 자정 = UTC 15:00 (전일) */
  return Date.parse(y+'-'+m+'-'+d+'T00:00:00+09:00');
}
function accessBadge(a){
  var mt = a.session_mtime || 0;
  if(!mt) return '<span class="badge b-never">미접속</span>';
  if(mt >= kstTodayMidnightMs()) return '<span class="badge b-today">🟢 오늘</span>';
  /* 86400000 = 24h × 60min × 60s × 1000ms — POSIX day in milliseconds */
  var days = Math.floor((Date.now()-mt)/86400000);
  return '<span class="badge b-old">'+(days<=1?'어제':days+'일 전')+'</span>';
}

(function(){
  var btn = document.getElementById('excelUpBtn');
  var fi = document.getElementById('excelFiles');
  var out = document.getElementById('excelUpResult');
  if(!btn||!fi||!out) return;
  /* ref: MDN HTMLInputElement change event https://developer.mozilla.org/en-US/docs/Web/API/HTMLInputElement/change_event */
  /* ref: MDN FileList https://developer.mozilla.org/en-US/docs/Web/API/FileList */
  /* ref: MDN File.name, File.size https://developer.mozilla.org/en-US/docs/Web/API/File */
  /* MDN: FileList는 change마다 replace. 누적 위해 DataTransfer 사용 https://developer.mozilla.org/en-US/docs/Web/API/DataTransfer */
  window._picked = window._picked || [];
  function renderList(){
    var list = document.getElementById('excelFileList');
    if(!list) return;
    if(window._picked.length===0){ list.innerHTML=''; return; }
    /* 100개 초과 시 DOM 렌더 제한 — 수천 개 파일에서 freeze 방지 */
    var MAX_SHOW = 100;
    var shown = window._picked.slice(0, MAX_SHOW);
    var arr = shown.map(function(f,i){ return (i+1)+'. '+_esc(f.name)+' ('+Math.round(f.size/1024)+'KB)'; });
    var extra = window._picked.length > MAX_SHOW ? '<br><span style="color:#9fb3e0">…외 '+(window._picked.length-MAX_SHOW)+'개</span>' : '';
    list.innerHTML = '📎 <b>' + window._picked.length + '개 선택됨:</b> <button id="_clearFiles" style="padding:2px 8px;font-size:11px">🗑 초기화</button><br>' + arr.join('<br>') + extra;
    var cb = document.getElementById('_clearFiles');
    if(cb) cb.onclick = function(){ window._picked=[]; try{fi.value='';}catch(_){} renderList(); };
  }
  fi.addEventListener('change', function(){
    /* 새 선택된 파일을 누적 (같은 이름 중복은 이름+size로 dedup) */
    for(var i=0;i<fi.files.length;i++){
      var f = fi.files[i];
      var dup = window._picked.some(function(x){ return x.name===f.name && x.size===f.size; });
      if(!dup) window._picked.push(f);
    }
    renderList();
  });
  /* 폴더 스캔 핸들러가 _picked 에 직접 push 후 발생시키는 이벤트 — DataTransfer 우회 */
  fi.addEventListener('_folderScanned', function(){
    renderList();
  });
  btn.addEventListener('click', function(){
    if(!window._picked.length){ out.textContent = '⚠️ 파일 선택 먼저'; return; }
    btn.disabled = true;
    var startTime = Date.now();
    var valid = window._picked.filter(function(f){ return f.size > 0 && f.name.indexOf('~$') !== 0; });
    var skipped = window._picked.length - valid.length;
    var totalKB = Math.round(valid.reduce(function(s,f){return s+f.size},0)/1024);
    if(!valid.length){ out.innerHTML='<div style="color:#f47070;font-size:14px;padding:12px">❌ 유효한 파일 없음 (0KB·임시파일만 있음)</div>'; btn.disabled=false; return; }
    function statusHTML(phase, pct, detail, result){
      var phases = [
        {id:'prep',label:'준비'},
        {id:'upload',label:'업로드'},
        {id:'parse',label:'서버 파싱'},
        {id:'done',label:'완료'}
      ];
      var h = '<div style="display:flex;gap:6px;margin-bottom:12px">';
      var pi = phases.findIndex(function(p){return p.id===phase});
      phases.forEach(function(p,i){
        var active = i===pi;
        var done = i<pi || phase==='done';
        var bg = done?'#3ddc84':active?'#2b6cff':'#2a323c';
        var fg = done?'#000':active?'#fff':'#8a95a5';
        h+='<div style="flex:1;text-align:center;padding:6px 0;border-radius:4px;font-size:11px;font-weight:700;background:'+bg+';color:'+fg+'">'+(done?'✓ ':active?'● ':'')+p.label+'</div>';
      });
      h+='</div>';
      if(pct>=0 && phase==='upload'){
        h+='<div style="background:#1a1f26;border-radius:6px;overflow:hidden;height:8px;margin-bottom:8px"><div style="height:100%;background:linear-gradient(90deg,#2b6cff,#3ddc84);width:'+pct+'%;transition:width .2s"></div></div>';
      }
      h+='<div style="font-size:13px;color:#c9d2dc;font-family:monospace">'+detail+'</div>';
      if(result) h+=result;
      return h;
    }
    out.innerHTML = statusHTML('prep', -1, valid.length+'개 파일 · '+totalKB+'KB'+(skipped?' ('+skipped+'개 임시파일 제외)':''));
    var fd = new FormData();
    for(var i=0;i<valid.length;i++) fd.append('files', valid[i]);
    doUpload(fd, btn, out, startTime, statusHTML, valid.length);
  });
  function doUpload(fd, btn, out, startTime, statusHTML, fileCount){
    localStorage.setItem('gauth_uploading', Date.now());
    updateUploadStatus();
    var xhr = new XMLHttpRequest();
    xhr.open('POST', authQuery('/api/upload-excels'), true);
    /* 300000ms = 5분 — 대용량 엑셀 업로드 허용 (서버측 10분보다 짧게 설정) */
    xhr.timeout = 300000;
    var t=getApiToken();if(t)xhr.setRequestHeader('Authorization','Bearer '+t);
    xhr.ontimeout = function(){
      out.innerHTML = statusHTML('upload', 100, '<span style="color:#f47070;font-size:15px;font-weight:700">❌ 서버 응답 타임아웃 (5분)</span>');
      btn.disabled=false; localStorage.removeItem('gauth_uploading'); updateUploadStatus();
    };
    xhr.onerror = function(){
      out.innerHTML = statusHTML('upload', 0, '<span style="color:#f47070;font-size:15px;font-weight:700">❌ 서버 연결 실패 — 네트워크 오류 또는 서버 다운</span>');
      btn.disabled=false; localStorage.removeItem('gauth_uploading'); updateUploadStatus();
    };
    var progWrap = document.getElementById('excelUpProgWrap');
    var progEl = document.getElementById('excelUpProg');
    var progTxt = document.getElementById('excelUpProgTxt');
    if(progWrap){ progWrap.style.display='block'; progEl.value=0; progTxt.textContent='0%'; }
    xhr.upload.addEventListener('progress', function(ev){
      if(ev.lengthComputable){
        var pct = Math.round(100*ev.loaded/ev.total);
        if(progEl) progEl.value=pct;
        if(progTxt) progTxt.textContent=pct+'%';
        out.innerHTML = statusHTML('upload', pct, '전송 중 '+Math.round(ev.loaded/1024)+'/'+Math.round(ev.total/1024)+'KB');
      }
    });
    xhr.upload.addEventListener('load', function(){
      if(progEl) progEl.value=100;
      if(progTxt) progTxt.textContent='100%';
      out.innerHTML = statusHTML('parse', -1, '서버에서 '+fileCount+'개 파일 파싱 중…');
    });
    xhr.upload.addEventListener('error', function(){
      out.innerHTML = statusHTML('upload', 0, '<span style="color:#f47070;font-size:15px;font-weight:700">❌ 업로드 실패 — 네트워크 오류</span>');
      btn.disabled=false; localStorage.removeItem('gauth_uploading'); updateUploadStatus();
    });
    xhr.onreadystatechange = function(){
      if(xhr.readyState===4){
        var elapsed = ((Date.now()-startTime)/1000).toFixed(1);
        var d = null;
        try { d = JSON.parse(xhr.responseText); } catch(e){
          out.innerHTML = statusHTML('parse', -1, '<span style="color:#f47070;font-size:15px;font-weight:700">❌ 서버 응답 오류 (HTTP '+xhr.status+')</span><br><span style="font-size:11px;color:#8a95a5">'+elapsed+'초 소요</span>');
          btn.disabled=false; localStorage.removeItem('gauth_uploading'); updateUploadStatus(); return;
        }
        if(!d.ok){
          out.innerHTML = statusHTML('parse', -1, '<span style="color:#f47070;font-size:15px;font-weight:700">❌ '+_esc(d.error||'서버 처리 실패')+'</span><br><span style="font-size:11px;color:#8a95a5">HTTP '+xhr.status+' · '+elapsed+'초</span>');
          btn.disabled=false; localStorage.removeItem('gauth_uploading'); updateUploadStatus(); return;
        }
        var fileRows = (d.files||[]).map(function(f,i){
          var ok = !f.error && (f.accounts||0)>0;
          var fname = (f.name||'').normalize ? (f.name||'').normalize('NFC') : (f.name||'');
          return '<tr style="border-bottom:1px solid #22282f"><td style="padding:4px 8px;color:#8a95a5;font-size:11px">'+(i+1)+'</td><td style="padding:4px 8px;font-size:12px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escapeHtml(fname)+'</td><td style="padding:4px 8px;text-align:right;font-weight:700;color:'+(ok?'#3ddc84':'#f47070')+'">'+escapeHtml(f.accounts||0)+'개'+(f.error?' ❌':'')+'</td></tr>';
        }).join('');
        var resultHTML = '<div style="margin-top:14px;padding:16px;background:#0d2818;border:2px solid #3ddc84;border-radius:8px">'
          +'<div style="font-size:18px;font-weight:800;color:#3ddc84;margin-bottom:10px">✅ 업로드 완료</div>'
          +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px">'
          +'<div style="background:#1a2a1a;padding:10px;border-radius:6px;text-align:center"><div style="font-size:22px;font-weight:800;color:#3ddc84">'+(d.total_parsed||0)+'</div><div style="font-size:10px;color:#8a95a5">파싱</div></div>'
          +'<div style="background:#1a1a2a;padding:10px;border-radius:6px;text-align:center"><div style="font-size:22px;font-weight:800;color:#7dabff">'+(d.added||0)+'</div><div style="font-size:10px;color:#8a95a5">신규</div></div>'
          +'<div style="background:#2a1a1a;padding:10px;border-radius:6px;text-align:center"><div style="font-size:22px;font-weight:800;color:#ffaa55">'+(d.updated||0)+'</div><div style="font-size:10px;color:#8a95a5">업데이트</div></div>'
          +'</div>'
          +'<div style="display:flex;justify-content:space-between;font-size:12px;color:#8a95a5;margin-bottom:8px"><span>마스터 총 <b style="color:#e8ecef">'+(d.total_master||0)+'</b>건</span><span>충돌 <b style="color:'+(d.conflicts_count?'#ffaa55':'#8a95a5')+'">'+(d.conflicts_count||0)+'</b>건</span><span>'+elapsed+'초 소요</span></div>';
        if(fileRows){
          resultHTML+='<details style="margin-top:8px"><summary style="cursor:pointer;font-size:12px;color:#7dabff;font-weight:700">파일별 상세 ('+((d.files||[]).length)+'개)</summary>'
            +'<table style="width:100%;margin-top:6px;font-family:monospace;border-collapse:collapse">'+fileRows+'</table></details>';
        }
        if((d.conflicts||[]).length){
          var confRows = d.conflicts.slice(0,5).map(function(c){
            return '<div style="padding:4px 0;font-size:11px;border-bottom:1px solid #22282f"><b>'+escapeHtml(c.email)+'</b>: '+c.fields.map(function(f){return escapeHtml(f.field)}).join(', ')+'</div>';
          }).join('');
          resultHTML+='<details style="margin-top:6px"><summary style="cursor:pointer;font-size:12px;color:#ffaa55;font-weight:700">충돌 상세 ('+(d.conflicts||[]).length+'건)</summary><div style="margin-top:4px">'+confRows;
          if(d.conflicts.length>5) resultHTML+='<div style="font-size:11px;color:#8a95a5">… 외 '+(d.conflicts.length-5)+'건</div>';
          resultHTML+='</div></details>';
        }
        resultHTML+='</div>';
        out.innerHTML = statusHTML('done', -1, '', resultHTML);
        if(progWrap) progWrap.style.display='none';
        if(typeof refreshAccStats==='function') refreshAccStats();
        btn.disabled = false;
        window._picked = []; renderList();
        var banner = document.createElement('div');
        banner.id = 'uploadDoneBanner';
        banner.style.cssText = 'position:fixed;top:0;left:0;right:0;padding:14px 20px;background:linear-gradient(135deg,#0d3222,#1c4a35);color:#3ddc84;font-size:15px;font-weight:700;text-align:center;z-index:9999;border-bottom:2px solid #3ddc84';
        banner.textContent = '✅ 완료 — '+(d.total_parsed||0)+'건 파싱 · '+(d.added||0)+'건 추가 · '+(d.updated||0)+'건 업데이트 · 마스터 '+(d.total_master||0)+'건 · '+elapsed+'초';
        document.body.prepend(banner);
        setTimeout(function(){ var b=document.getElementById('uploadDoneBanner'); if(b) b.remove(); }, 15000);
        localStorage.removeItem('gauth_uploading');
        localStorage.setItem('gauth_last_upload', JSON.stringify({
          time: new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}),
          total_parsed: d.total_parsed||0,
          added: d.added||0,
          updated: d.updated||0,
          total_master: d.total_master||0,
          files_count: (d.files||[]).length
        }));
        updateUploadStatus();
        load();
        return;
      }
    };
    xhr.send(fd);
  }
})();
</script>

<script>

  var el = document.getElementById('upload-status');

  var uploading = localStorage.getItem('gauth_uploading');

    el.style.display='block';
    el.style.background='#2a1a00';

  }
}
updateUploadStatus();
</script>

<script>
const PAGE_SIZE = 50
let ALL=[], ALL_ORIGINAL=[], FILTERED=[], PAGE=1
let _lookupEmail = null, _loginEmail = null
const vp = document.getElementById('viewport'), sp = document.getElementById('spacer')

function getApiToken(){return sessionStorage.getItem('gauth_token')||'279c85fff45d91d2bd6f3872c96fa82f87488ea250a7b4a9de34f885a5c5cac1'}
(function(){var el=document.getElementById('apiToken');if(el){var t=getApiToken();if(t)el.value=t;}})()
function authHeaders(extra){var h=extra||{};var t=getApiToken();if(t)h['Authorization']='Bearer '+t;return h}
function authQuery(url){var t=getApiToken();if(!t)return url;return url+(url.indexOf('?')>=0?'&':'?')+'token='+encodeURIComponent(t)}
function noCacheQuery(url){var u=authQuery(url);return u+(u.includes('?')?'&':'?')+'_t='+Date.now()}

var escapeHtml = _esc
/* 엑셀 내 날짜(account_date) 기준 정렬
 * 날짜 있는 계정 → 선택순(desc/asc) / 날짜 없는 계정 → 맨 뒤
 * ref: MDN Array.prototype.sort https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/sort */
function _sortByExcelDate(arr, order){
  var withDate = arr.filter(function(a){ return a.account_date })
  var noDate   = arr.filter(function(a){ return !a.account_date })
  var asc = order === 'asc'
  withDate.sort(function(a, b){ return asc ? a.account_date - b.account_date : b.account_date - a.account_date })
  return withDate.concat(noDate)
}
let FAILED = {}
async function load(){
  var n, p, f
  function safeJson(r, fallback){
    if(!r.ok) return fallback;
    return r.json().catch(function(){ return fallback });
  }
  try {
    var r1 = await fetch(authQuery('/api/normalized-accounts'),{headers:authHeaders()}).catch(function(){ return {ok:false} });
    var r2 = await fetch(authQuery('/api/profiles'),{headers:authHeaders()}).catch(function(){ return {ok:false} });
    var r3 = await fetch(authQuery('/api/failed-accounts'),{headers:authHeaders()}).catch(function(){ return {ok:false} });
    n = await safeJson(r1, {accounts:[],summary:{}});
    p = await safeJson(r2, {profiles:[]});
    f = await safeJson(r3, {});
    if(!r1.ok || !n.accounts){
      var _msg = r1.ok ? 'accounts 키 없음 (응답: '+JSON.stringify(n).slice(0,200)+')' : 'HTTP '+r1.status;
      document.getElementById('spacer').innerHTML='<div style="padding:20px;color:#ffb469;font-size:14px">⚠ API 상태: '+_esc(_msg)+'</div>';
    }
  } catch(e) { n={accounts:[],summary:{}}; p={profiles:[]}; f={}; }
  FAILED = f || {}
  var _profiles = (p && p.profiles) || []
  var _accounts = (n && n.accounts) || []
  var sess = new Set(_profiles.map(function(x){ return x.email || x.folder.replace(/^([^_]+)_(.+)$/, function(_, u, d){ return u + '@' + d.replace(/_/g, '.') }) }))
  function _fixMojibake(s){
    if(!s) return s;
    try{
      var b=new Uint8Array(s.length),ok=true;
      for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);if(c>255){ok=false;break;}b[i]=c;}
      if(!ok) return s;
      var d=new TextDecoder('utf-8').decode(b);
      if(d!==s&&d.indexOf('�')<0) return d;
    }catch(e){}
    return s;
  }
  ALL = _accounts.map(function(a){
    var f = (FAILED[a.email] || {});
    var ad = a.account_date || null;
    return Object.assign({}, a, {has_session: sess.has(a.email), lock_reason: f.reason || null, account_date: ad, source_file: _fixMojibake(a.source_file)});
  })
  ALL_ORIGINAL = ALL.slice()
  ALL = _sortByExcelDate(ALL)
  var _fc = n.summary && n.summary.files_scanned;
  if(_fc == null){
    try { var _rp = await fetch(authQuery('/api/parse-report'),{cache:'no-store',headers:authHeaders()}).then(r=>r.json()); _fc = _rp && _rp.last_run && _rp.last_run.files; } catch(_){}
  }
  document.getElementById('s-files').textContent = (_fc != null ? _fc : 0).toLocaleString()
  document.getElementById('s-acc').textContent = ALL.length.toLocaleString()
  document.getElementById('s-sess').textContent = ALL.filter(a=>a.has_session).length.toLocaleString()
  var _2faCount = ALL.filter(a => a.totp_secret && a.totp_secret.trim()).length
  var _pwOnly = ALL.filter(a => a.password && (!a.totp_secret || !a.totp_secret.trim())).length
  document.getElementById('s-2fa').textContent = ((n.summary && n.summary.PASSWORD_2FA) || _2faCount).toLocaleString()
  document.getElementById('s-pw').textContent = ((n.summary && n.summary.PASSWORD_ONLY) || _pwOnly).toLocaleString()
  applyFilter()
}
function applyFilter(){
  const q = document.getElementById('q').value.trim().toLowerCase()
  const f = document.getElementById('filter').value
  const orderEl = document.getElementById('td-order')
  const order = (orderEl && orderEl.value) || 'desc'
  FILTERED = ALL.filter(a => {
    if (q && !(a.email||'').toLowerCase().includes(q)) return false
    if (f==='today' && !(a.session_mtime && a.session_mtime>=kstTodayMidnightMs())) return false
    if (f==='2fa' && !a.totp_secret) return false
    if (f==='never' && a.session_mtime) return false
    const LOCK = ['PHONE_REQUIRED','PASSKEY_REQUIRED','DEVICE_PROMPT','SECURITY_KEY','BACKUP_CODE','REJECTED']
    if (f==='locked' && !LOCK.includes(a.lock_reason)) return false
    return true
  })
  FILTERED = _sortByExcelDate(FILTERED, order)
  PAGE = 1
  const totalPages = Math.max(1, Math.ceil(FILTERED.length / PAGE_SIZE))
  document.getElementById('count').textContent = `${FILTERED.length.toLocaleString()}개 · ${totalPages}페이지`
  render()
}

function renderPagination(totalPages){
  const pg = document.getElementById('pagination')
  if (totalPages <= 1) { pg.innerHTML=''; return }
  const btn = (label, page, disabled, active) =>
    `<button ${disabled?'disabled':''} style="min-width:36px;background:${active?'#2b6cff':'#2a323c'}" onclick="gotoPage(${page})">${label}</button>`
  let html = btn('«', 1, PAGE===1) + btn('‹', PAGE-1, PAGE===1)
  // 앞뒤 5개 정도만 표시
  const from = Math.max(1, PAGE-3), to = Math.min(totalPages, PAGE+3)
  if (from > 1) html += '<span style="color:#8a95a5">…</span>'
  for (let i=from; i<=to; i++) html += btn(i, i, false, i===PAGE)
  if (to < totalPages) html += '<span style="color:#8a95a5">…</span>'
  html += btn('›', PAGE+1, PAGE===totalPages) + btn('»', totalPages, PAGE===totalPages)
  html += `<span style="color:#8a95a5;font-size:12px;margin-left:10px">${PAGE} / ${totalPages}</span>`
  pg.innerHTML = html
}

// 복사 버튼 — data 속성 사용. targetId가 있으면 그 엘리먼트의 현재 textContent를 복사(항상 최신)
function cp(v, targetId){
  if(v===undefined || v===null || v==='—') return ''
  const esc = String(v).replace(/"/g,'&quot;').replace(/</g,'&lt;')
  return targetId
    ? `<button class="cp" data-copy-target="${targetId}">복사</button>`
    : `<button class="cp" data-copy="${esc}">복사</button>`
}
/* MDN Clipboard API: https://developer.mozilla.org/en-US/docs/Web/API/Clipboard/writeText
 * Secure context (HTTPS) 필수. 구형 브라우저 폴백은 Selection API 사용:
 * https://developer.mozilla.org/en-US/docs/Web/API/Selection */
async function doCopy(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    try { await navigator.clipboard.writeText(text); return true } catch {}
  }
  var ta = document.createElement('textarea')
  ta.value = text; ta.style.cssText='position:fixed;opacity:0;left:-9999px'
  document.body.appendChild(ta); ta.focus(); ta.select()
  var ok = false
  try {
    var sel = window.getSelection()
    var range = document.createRange()
    range.selectNodeContents(ta)
    sel.removeAllRanges(); sel.addRange(range)
    ok = document.execCommand('copy')
  } catch(e) {}
  ta.remove()
  return ok
}
document.addEventListener('click', async (e) => {
  const b = e.target.closest('button.cp')
  if(!b) return
  let text = b.dataset.copy
  if(!text && b.dataset.copyTarget){
    const el = document.getElementById(b.dataset.copyTarget)
    if(el) text = el.textContent.trim()
  }
  if(!text) return
  const ok = await doCopy(text)
  const orig = b.textContent
  b.textContent = ok ? '✓ 복사됨' : '❌ 실패'
  setTimeout(()=>{b.textContent = orig}, 900)
})

async function programLogin(email, btn){
  const orig = btn.textContent; btn.disabled=true; btn.textContent='⏳ 시도 중…'
  _loginEmail = email; render()
  let reason = '', reachedServer = false
  try{
    const r = await fetch(authQuery('/api/login-one'), {method:'POST',headers:authHeaders({'content-type':'application/json'}),body:JSON.stringify({email})})
    const j = await r.json().catch(()=>({}))
    reachedServer = true
    if(r.ok && j.success !== false && !j.error){
      _loginEmail = null
      btn.textContent = '✅ 로그인 성공'
      btn.style.background = '#3ddc84'
      btn.style.color = '#000'
      try { await load() } catch { location.reload() }
      setTimeout(()=>{btn.textContent=orig;btn.disabled=false;btn.style.background='';btn.style.color=''}, 3000)
      return
    }
    reason = j.reason || j.error || `HTTP ${r.status}`
  }catch(e){
    reason = e.message
  }
  btn.textContent = '❌ 실패'
  btn.style.background = '#e0503a'
  if (reachedServer && LOCK_REASONS.has(reason)) {
    // 사람 개입 필요한 실패 (폰인증·패스키·기기승인·잘못된비번 등) → 간단히 표시
    alert(`❌ ${email}\n실패: ${reason}\n\n(이 계정은 사람이 직접 로그인해야 합니다.)`)
  } else if (reachedServer) {
    alert(`❌ ${email}\n실패: ${reason}`)
  } else {
    alert(`❌ 서버 도달 실패: ${reason}`)
  }
  _loginEmail = null; render()
  setTimeout(()=>{btn.textContent=orig;btn.disabled=false;btn.style.background=''}, 2000)

var _ytClientId = '';

async function ytApiConnect(email, btn) {
  if (!_ytClientId) { alert('YouTube OAuth Client ID가 서버에 설정되지 않았습니다.\nYOUTUBE_OAUTH_CLIENT_ID 환경변수를 설정하세요.'); return; }
  const orig = btn.textContent; btn.disabled = true; btn.textContent = '⏳ 연결 중…';
  const redirectUri = location.origin + '/';
  const scope = 'https://www.googleapis.com/auth/youtube.readonly https://www.googleapis.com/auth/youtube.force-ssl';
  var _oauthNonce = Array.from(crypto.getRandomValues(new Uint8Array(16)),function(b){return b.toString(16).padStart(2,'0')}).join('');
  sessionStorage.setItem('yt_oauth_nonce', _oauthNonce);
  sessionStorage.setItem('yt_oauth_email', email);
  const state = encodeURIComponent(JSON.stringify({ email, nonce: _oauthNonce }));
  const authUrl = 'https://accounts.google.com/o/oauth2/v2/auth?client_id=' + encodeURIComponent(_ytClientId)
    + '&redirect_uri=' + encodeURIComponent(redirectUri)
    + '&response_type=code&scope=' + encodeURIComponent(scope)
    + '&state=' + state
    + '&login_hint=' + encodeURIComponent(email)
    + '&access_type=offline&prompt=consent';
  const popup = window.open(authUrl, 'ytAuth', 'width=500,height=700');
  const checkInterval = setInterval(async () => {
    try {
      if (!popup || popup.closed) { clearInterval(checkInterval); btn.textContent = orig; btn.disabled = false; return; }
      const url = popup.location.href;
      if (url && url.startsWith(redirectUri)) {
        popup.close(); clearInterval(checkInterval);
        const urlObj = new URL(url);
        const code = urlObj.searchParams.get('code');
        var returnedState = urlObj.searchParams.get('state');
        try {
          var stateObj = JSON.parse(decodeURIComponent(returnedState || '{}'));
          var savedNonce = sessionStorage.getItem('yt_oauth_nonce');
          if (!stateObj.nonce || stateObj.nonce !== savedNonce) {
            btn.textContent = '❌ state 불일치'; setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 2000); return;
          }
          sessionStorage.removeItem('yt_oauth_nonce');
          sessionStorage.removeItem('yt_oauth_email');
        } catch(_) { btn.textContent = '❌ state 파싱 실패'; setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 2000); return; }
        if (code) {
          const r = await fetch(authQuery('/api/youtube/exchange-code'), { method: 'POST', headers: authHeaders({'content-type': 'application/json'}), body: JSON.stringify({ email, code, redirect_uri: redirectUri }) });
          const j = await r.json();
          if (j.ok) {
            btn.textContent = j.has_refresh ? '✅ 영구 연결' : '✅ 연결됨'; btn.style.background = '#0d3222'; btn.style.color = '#3ddc84';
          } else { btn.textContent = '❌ ' + (j.error || '실패'); }
          setTimeout(() => { btn.textContent = orig; btn.disabled = false; btn.style.background = ''; btn.style.color = ''; }, 3000);
        } else { btn.textContent = '❌ 코드 없음'; setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 2000); }
      }
    } catch { /* cross-origin */ }
  }, 500);
}

        + '<div style="color:#8a95a5;font-size:11px;margin-top:8px;text-align:center">3초마다 자동 갱신</div>';
    }
    await loadViewers();
    _spannerInterval = setInterval(loadViewers, 3000);
    btn.textContent = orig; btn.disabled = false;

<script>
/* 폴더 전체 스캔 핸들러
 * MDN requestAnimationFrame: https://developer.mozilla.org/en-US/docs/Web/API/Window/requestAnimationFrame
 * rAF 로 청크 단위 처리 → 매 프레임마다 UI 업데이트(진행 로그) → 메인스레드 블로킹 없음
 * DataTransfer.items.add 루프 완전 제거 — window._picked 에 직접 push
 */
(function(){
  var folderInput = document.getElementById('excelFolderFiles');
  var info = document.getElementById('excelFolderInfo');
  var logBox = document.getElementById('excelFileList');
  if(!folderInput) return;

  folderInput.addEventListener('change', function(){
    var raw = this.files;
    var total = raw.length;

    /* 즉시 진행 표시 — 브라우저가 파일 목록 로드를 끝낸 직후 */
    info.innerHTML = '⏳ <b style="color:#9fb3e0">0 / ' + total + ' 스캔 중...</b>';
    if(logBox) logBox.innerHTML = '<span style="color:#9fb3e0;font-size:11px">📂 전체 ' + total + '개 파일 검사 중...</span>';

    window._picked = window._picked || [];

    /* rAF 기반 청크 처리
     * ref: https://developer.mozilla.org/en-US/docs/Web/API/Window/requestAnimationFrame
     * 한 프레임(~16ms)당 CHUNK_SIZE 개씩 처리 → 매 프레임 UI 업데이트 가능 */
    var CHUNK_SIZE = 200;
    var idx = 0;
    var found = [];
    var added = 0;

    function processChunk(timestamp) {
      var end = Math.min(idx + CHUNK_SIZE, total);
      for(var i = idx; i < end; i++){
        var f = raw[i];
        /* 엑셀 파일만 필터 */
        if(!/\.(xlsx|xls|csv)$/i.test(f.name)) continue;
        found.push(f);
        /* 중복 체크 (name + size) */
        var dup = false;
        for(var k = 0; k < window._picked.length; k++){
          if(window._picked[k].name === f.name && window._picked[k].size === f.size){ dup = true; break; }
        }
        if(!dup){ window._picked.push(f); added++; }
      }
      idx = end;

      /* 매 청크마다 진행 로그 업데이트 */
      info.innerHTML = '⏳ <b style="color:#9fb3e0">' + idx + ' / ' + total + '</b> 스캔 중... (엑셀 <b style="color:#3ddc84">' + found.length + '</b>개)';
      if(logBox) logBox.innerHTML = '<span style="color:#9fb3e0;font-size:11px">'
        + '📂 ' + idx + '/' + total + ' 검사 · 엑셀 ' + found.length + '개 발견 · 신규 ' + added + '개 추가</span>';

      if(idx < total){
        /* 다음 프레임에 이어서 처리 — MDN 패턴: callback 내에서 rAF 재호출 */
        requestAnimationFrame(processChunk);
        return;
      }

      /* 완료 */
      if(!found.length){
        info.textContent = '❌ 엑셀 파일 없음';
        if(logBox) logBox.innerHTML = '';
        return;
      }
      info.innerHTML = '✅ <b style="color:#3ddc84">' + found.length + '</b>개 발견 · <b style="color:#3ddc84">' + added + '</b>개 추가';
      /* renderList 트리거 — 업로드 IIFE 내부 함수 호출용 CustomEvent */
      document.getElementById('excelFiles').dispatchEvent(new CustomEvent('_folderScanned'));
    }

    /* 첫 프레임 시작 */
    requestAnimationFrame(processChunk);
  });
})();
</script></body></html>
