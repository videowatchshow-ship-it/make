async function totp(secret) {
  const base32chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  const s = secret.toUpperCase().replace(/[^A-Z2-7]/g,'');
  let bits = 0, val = 0;
  const bytes = [];
  for (const c of s) {
    const idx = base32chars.indexOf(c);
    if (idx < 0) continue;
    val = (val << 5) | idx;
    bits += 5;
    if (bits >= 8) { bits -= 8; bytes.push((val >> bits) & 0xff); }
  }
  const key = await crypto.subtle.importKey('raw', new Uint8Array(bytes), {name:'HMAC',hash:'SHA-1'}, false, ['sign']);
  const step = Math.floor(Date.now() / 1000 / 30);
  const msg = new Uint8Array(8);
  let s2 = step;
  for (let i = 7; i >= 0; i--) { msg[i] = s2 & 0xff; s2 = Math.floor(s2 / 256); }
  const sig = new Uint8Array(await crypto.subtle.sign('HMAC', key, msg));
  const offset = sig[19] & 0xf;
  const code = ((sig[offset] & 0x7f) << 24 | sig[offset+1] << 16 | sig[offset+2] << 8 | sig[offset+3]) % 1000000;
  return String(code).padStart(6, '0');
}
