<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<base href="/photo/">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>가로01</title>
<meta name="description" content="라이브뷰" />
<link rel="stylesheet" type="text/css" href="include/live_style.css">
<style type="text/css">
body{margin:0;padding:0;background:#000}
.full_box{position:relative;top:0;left:0;width:100vw;height:100vh;display:flex;align-items:flex-start}
.container{position:relative;display:flex;justify-content:space-between;top:0;left:0;width:1920px;height:315px;z-index:2}
.board_box{position:relative;display:flex;align-items:center;justify-content:center;width:1467px;height:315px;background-color:#000000;overflow:hidden}
.board_box::before{content:"";width:100%;height:700%;position:absolute}
.board_box::after{content:"";width:1447px;height:295px;position:absolute;border-radius:0px;display:flex;justify-content:center;align-items:center;box-shadow:inset 16px 16px 16px #0000008c;overflow:hidden}
.board_A{position:relative;width:481px;height:295px;background-color:#000000;overflow:hidden;z-index:100}
.board_A_iframe{position:absolute;width:1300px;height:1248px;top:-840px;left:1px}
.board_A_iframe iframe{transform:scale(1.2,1.2);transform-origin:top left}
.board_B{position:relative;display:flex;width:966px;height:298px;overflow:hidden;margin:5px 5px 5px 0px;z-index:100}
.board_B_iframe{position:absolute;width:1300px;height:1248px;top:-840px;left:-536px}
.board_B_iframe iframe{transform:scale(1.2,1.2);transform-origin:top left}
.next_road{background:#000;position:absolute;top:315px;left:0px;display:flex;width:662px;height:70px;margin:0px;border-radius:0px 30px 30px 0px;overflow:hidden}
.next_road_pbimg{position:absolute;top:0px;left:0px;display:flex;width:662px;height:70px;z-index:10}
.board_view_nextboxP iframe{transform:scale(3.0,3.0);transform-origin:top left}
.board_view_nextboxP{position:absolute;display:flex;width:200px;height:60px;overflow:hidden;top:5px;left:130px}
.board_view_nextbox_iframeP{position:absolute;display:flex;width:1000px;height:1700px;top:-1970px;left:-835px}
.board_view_nextboxB iframe{transform:scale(3,3);transform-origin:top left}
.board_view_nextboxB{position:absolute;display:flex;width:200px;height:60px;overflow:hidden;top:5px;left:450px}
.board_view_nextbox_iframeB{position:absolute;display:flex;width:1000px;height:1700px;top:-1970px;left:-280px}
.bottom_text_box{position:absolute;left:0px;bottom:0px;display:flex;width:100%;min-height:45px;height:2vw;justify-content:space-around;align-items:center;color:white;font-size:1.5vw;font-family:'S-CoreDream-5Medium';overflow:hidden;background-color:rgba(9,9,9,0.5)}
.bottom_text_box:empty{display:none}
.text_box_text01{padding:0vw 2vh;color:#FFEB46;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.text_box_text02{padding:0vw 2vh;color:#FEBEBE;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.text_box_text03{padding:0vw 2vh;color:#FF9DFF;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.text_box_text04{padding:0vw 2vh;color:#AAFA82;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner{display:flex;justify-content:center;align-items:center;width:100%;height:315px;overflow:hidden;background-color:#000;border-right:#000 solid 10px;z-index:50}
.banner_box{height:295px;width:100%}
.banner_box img{height:295px;width:100%}
.ktime{position:absolute;top:8px;right:20px;color:#fff;font-size:22px;font-family:monospace;z-index:200;background:rgba(0,0,0,.5);padding:2px 10px;border-radius:6px;display:none}
/* 싱지/뉴싱지 (자체 출목표 렌더) */
.bgl-wrap{display:none;width:1447px;height:295px;background:#000;overflow:auto;align-items:center;justify-content:flex-start;padding:0 10px}
.bgl-table{border-collapse:collapse;table-layout:fixed}
.bgl-table td{width:44px;height:44px;border:1px solid #222;padding:2px;vertical-align:middle;text-align:center}
.bgl-p,.bgl-b{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;margin:auto}
.bgl-p{background:#1a237e;border:3px solid #5c6bc0}.bgl-b{background:#7f0000;border:3px solid #e53935}
.bgl-p i.pp{position:absolute;width:11px;height:11px;border-radius:50%;top:0;right:0;background:#ef5350;border:1px solid #fff}
.bgl-b i.bp{position:absolute;width:11px;height:11px;border-radius:50%;top:0;right:0;background:#5c6bc0;border:1px solid #fff}
.bgl-p i.bp{position:absolute;width:11px;height:11px;border-radius:50%;bottom:0;left:0;background:#5c6bc0;border:1px solid #fff}
.bgl-b i.pp{position:absolute;width:11px;height:11px;border-radius:50%;bottom:0;left:0;background:#ef5350;border:1px solid #fff}
.bgl-p s,.bgl-b s{position:absolute;bottom:-9px;right:-4px;text-decoration:none;font-size:11px;color:#4caf50;font-weight:bold;line-height:1}
#bgl-room{position:absolute;top:6px;left:14px;color:#ffd54f;font-size:16px;font-weight:bold;z-index:200}
.next_road_pbimg{pointer-events:none}
.next_road_pbimg .nl{position:absolute;top:14px;height:42px;line-height:42px;color:#fff;font:italic bold 30px Arial,sans-serif;letter-spacing:-1px;white-space:nowrap}
.next_road_pbimg .nl i{display:inline-block;width:26px;height:26px;border-radius:50%;vertical-align:middle;margin-left:6px;border:2px solid #fff;box-sizing:border-box}
.next_road_pbimg .nl i.p{background:#1f5fbf}.next_road_pbimg .nl i.b{background:#d61a1a}
.next_road_pbimg .pill{position:absolute;top:1px;width:208px;height:68px;border:3px solid #fff;border-radius:34px;box-sizing:border-box}
.board_view_nextboxP,.board_view_nextboxB{border-radius:30px}

/* Next 신호: 그림장 iframe 확대 크롭 대신 페이지에서 직접 선명하게 렌더 (대안=테두리 원, 소로=채운 원, 소강=대각선) */
.nx{display:flex!important;align-items:center;justify-content:center;gap:22px;background:#009E94;border-radius:30px}
.nx i{display:block;width:30px;height:30px;box-sizing:border-box}
.nx i.dayan{border-radius:50%;border:5px solid}
.nx i.xiaolu{border-radius:50%}
.nx i.xiaoqiang{width:10px;height:36px;border-radius:5px;transform:rotate(40deg)}
.nx i.red.dayan{border-color:#e02020} .nx i.blue.dayan{border-color:#1f5fbf}
.nx i.red.xiaolu,.nx i.red.xiaoqiang{background:#e02020} .nx i.blue.xiaolu,.nx i.blue.xiaoqiang{background:#1f5fbf}
.nx i.no_find{visibility:hidden}
</style>
</head>
<body>
<div class="full_box">
  <div class="container">
    <div class="board_box" id="board_box">
      <div class="board_A" data-xtd><div class="board_A_iframe"><iframe class="lz" width="100%" height="100%" scrolling="no" frameborder="0"></iframe></div></div>
      <div class="board_B" data-xtd><div class="board_B_iframe"><iframe class="lz" width="100%" height="100%" scrolling="no" frameborder="0"></iframe></div></div>
      <div class="bgl-wrap" id="bgl-wrap"><div class="bgl-road"></div></div>
      <div id="bgl-room"></div>
    </div>
  </div>
  <div class="banner"><div class="banner_box"><img id="banner_w" src="images/Live_width_01_banner.gif" height="100%" alt=""></div></div>
  <div class="next_road" data-xtd>
    <div class="next_road_pbimg"><span class="nl" style="left:14px"><em>Next</em><i class="p"></i></span><span class="pill" style="left:126px"></span><span class="nl" style="left:336px"><em>Next</em><i class="b"></i></span><span class="pill" style="left:446px"></span></div>
    <div class="board_view_nextboxP nx" id="nx-p"></div>
    <div class="board_view_nextboxB nx" id="nx-b"></div>
  </div>
  <div class="ktime" id="ktime"></div>
  <div class="bottom_text_box" id="texts"></div>
</div>
<script src="bgl.js?v=5"></script>
<script src="luzhu.js?v=7"></script>
<script src="view.js?v=8"></script>
<script>window.__view && window.__view({ch: 'A'});</script>
</body>
</html>
