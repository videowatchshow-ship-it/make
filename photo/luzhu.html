<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PC</title>
<style>
/* === gs.xtd6688.com/luzhu/en/static/css/table_for_pc.css 그대로 (html 11px 기준) === */
html{font-size: 11px;}
*{ margin: 0 auto; padding: 0 auto; list-style: none;}
body{background-color: #070f29; margin: 0 auto; padding: 0 auto; position: relative;}
div{overflow: hidden;}
.top{width: 100%; height: 7.375rem;  background-image: url(luzhu_img/top_bg.png); background-repeat: repeat-x;}
.top_main{width: 118.1875rem; height: 100%; background-repeat: no-repeat; position: relative; text-align: center;}
.top_title{color: #7efafc; font-size: 2.25rem; padding-top: 1.2rem; cursor: pointer; }
.top_set{color: #7efafc; font-size:1.125rem; bottom: 0.5rem; right: 0.5rem; position: absolute; cursor: pointer;}
.main{width: 118.375rem;}
.main_top{width: 100%; height: 22.5rem; position: relative;margin-bottom: 0.5rem;}
.main_top_left{ position: relative; float: left; width:40.5rem; height: 100%; background-color: white}
.table_zhuzi_bg{position: absolute; left: 0rem; top: 0rem;  width: 100%; height: 100%; z-index: 1; border-top: 1px solid var(--line); border-left: 1px solid var(--line);}
.table_zhuzi_bg_td{float: left; width:3.54rem; height: 3.54rem; border-bottom: 0.09rem solid var(--line); border-right: 0.09rem solid var(--line);}
.jingshan_zhuzi{position: relative; width:118.1875rem; height: 100%;border-left: 0.0625rem solid var(--line2); background-color: transparent; z-index: 2;}
.jingshan_zhuzi > .content {width: 3.63rem; height: 3.63rem;}
.jingshan_zhuzi > .content > img{width: 3.63rem; height: 3.63rem;}
/* 특수 결과 배지 (싱지 원본 img_special 대응): 6²=럭키6 2장, 6³=럭키6 3장, 7=용7, 8=판다8 */
.jingshan_zhuzi > .content > .sp{position:absolute;right:0.05rem;bottom:0.05rem;min-width:1.5rem;height:1.5rem;line-height:1.5rem;padding:0 0.25rem;border-radius:0.75rem;font-size:1.05rem;font-weight:bold;text-align:center;color:#fff;background:#d4a017;border:0.09rem solid #fff;box-sizing:border-box;z-index:3}
.jingshan_zhuzi > .content > .sp7{background:#c0392b}
.jingshan_zhuzi > .content > .sp8{background:#1f5fbf}
.main_top_right{float: left; width:118.75rem; height:56.1875rem; margin-left: 0.125rem;  background-color: #011049; border: 0.0625rem solid var(--line2); position: relative;}
.main_top_right div{position: absolute;}
.main_bottom{width: 65.5%; height: 11rem; background-color: white; position: relative; margin-bottom: 0.5rem;}
.table_bg{position: absolute; width: 100%; height: 100%; left: 0rem; top: 0rem; z-index: 1; border-top: 1px solid var(--line); border-left: 1px solid var(--line);}
.table_bg_td{float: left; width: 1.733rem; height: 1.733rem; border-bottom: 0.09rem solid var(--line); border-right: 0.09rem solid var(--line);}
.jingshan_right{ position: absolute; left: 0rem; top: 0rem; width: 100%; height: 100%; z-index: 2; }
.jingshan_dalu{position: relative; width: 100%; height: 100%; }
.content{ position: absolute; clear: both; z-index: 1;}
.content_num{ text-align: left; position: absolute; clear: both; z-index: 2; margin-top: 2px; margin-left: 7px; font-size: 10px; color: #1c9a2a; font-weight: bold;}
.jingshan_dalu >.content img{ border: none; position: absolute; left: 0px; top: 0px; width: 1.823rem; height: 1.823rem; }
.jingshan_down{ position: relative; width: 100%; height: 50%; }
.jingshan_dayan{ position: relative; width: 49%; height: 100%; float: left; }
.jingshan_dayan >.content img{ border: none; position: absolute; left: 0px; top: 0px; width:0.9115rem; height:0.9115rem; }
.jingshan_xiaoqiang{ position: relative; width: 50.5%; height: 100%; float:right; }
.jingshan_xiaoqiang >.content img{ border: none; position: absolute; left: 0px; top: 0px; width:0.9115rem; height:0.9115rem; }
.jingshan_xiaolu{ position: relative; width: 49%; height: 100%; float: left; }
.jingshan_xiaolu >.content img{ border: none; position: absolute; left: 0px; top: 0px; width:0.9115rem; height:0.9115rem; }
.jingshan_sanxing{ position: relative; width: 50.5%; height: 100%; float: right; }
.jingshan_sanxing >.content img{ border: none; position: absolute; left: 0px; top: 0px; width:1.823rem; height:1.823rem; }
.wenlu_content{ width: 25%; float: left; cursor: pointer; text-align: left; height: 1.875rem; line-height: 1.875rem; color:#fff; font-size:1.1rem;}
.wenlu_content img{ width: 1rem; height: 1rem; line-height: 1.875rem; vertical-align: middle; margin-top: 0.5rem; display: inline-block; float: left; margin-left:0.5rem; }
.wenlu_button{ width: 80px; background-color: #e64340; text-align: center; }
#wenlu_show_red,#wenlu_show_blue{ width: 80px;}
/* 격자 색: 기본(성천지 파랑) / gold(싱지) */
:root{--line:#1c2bea;--line2:#2773e6}
body.gold{--line:#b8a06a;--line2:#b8a06a;background-color:#1a1206}
body.gold .main_top_right{background-color:#2b1d0e}
body.gold .main_top_left,body.gold .main_bottom{background-color:#f7f1e3}
/* 뉴싱지(fcj6) 벡터 그림장 — 원본 BtnZhuzi / Btn_BigRoad / Btn_BigEye / Btn_SmallRoad / Btn_YueYou 색·형태 */
.content i{position:absolute;left:9%;top:9%;width:82%;height:82%;border-radius:50%;box-sizing:border-box;display:block}
/* 珠子: 글자 없음. 기본(성천지) = 원본 이미지와 같은 테두리 원 (빨강/파랑/초록), gold(뉴싱지) = 원본 색 채운 원 */
.content i.vz{border:0.3rem solid;background:none}
.content i.vB{border-color:rgb(214,26,26)} .content i.vP{border-color:rgb(30,80,214)} .content i.vT{border-color:rgb(26,150,60)}
body.gold .content i.vz{border:0}
body.gold .content i.vB{background:rgb(156,0,0)} body.gold .content i.vP{background:rgb(0,3,160)} body.gold .content i.vT{background:rgb(0,94,0)}
.content i u{position:absolute;width:26%;height:26%;border-radius:50%;border:0.09rem solid #fff;box-sizing:border-box}
.content i u.zd{left:-4%;top:-4%;background:rgb(255,0,0)} .content i u.xd{right:-4%;bottom:-4%;background:rgb(13,118,224)}
.content i.vd{border:0.22rem solid} .content i.vd.r{border-color:rgb(255,0,0)} .content i.vd.b{border-color:rgb(13,118,224)}
.content i.vd u{width:40%;height:40%}
.content i.vy{border:0.14rem solid} .content i.vy.r{border-color:rgb(255,0,0)} .content i.vy.b{border-color:rgb(13,118,224)}
.content i.vx.r{background:rgb(255,0,0)} .content i.vx.b{background:rgb(13,118,224)}
.content i.vq{border-radius:0;background:none;left:46%;width:0.16rem;top:6%;height:88%;transform:rotate(45deg)} .content i.vq.r{background:rgb(255,0,0)} .content i.vq.b{background:rgb(13,118,224)}
.content i.vs.r{background:rgb(255,0,0)} .content i.vs.b{background:rgb(13,118,224)}
</style>
</head>
<body>
	<div class="top">
		<div class="top_main">
			<div class="top_title"></div>
		</div>
	</div>
	<div class="main">
			<div class="main_top_right">
				<div style="height: 92%;position: relative;"></div>
				<div style="width: 100%; height: 1.875rem; background-color: #009E94; text-align: right; margin-top: 0.5rem; position: relative;">
					<div style="position: relative;" class="wenlu_content wenlu_button">BANKER</div>
					<div style="position: relative;" class="wenlu_content" id="wenlu_show_red"></div>
					<div style="position: relative;" class="wenlu_content wenlu_button">PLAYER</div>
					<div style="position: relative;" class="wenlu_content" id="wenlu_show_blue"></div>
				</div>
			</div>
		<div class="main_top">
			<div class="main_top_left">
				<div class="table_zhuzi_bg"></div>
				<div class="jingshan_zhuzi"></div>
			</div>
		<div class="main_bottom">
			<div class="table_bg"></div>
			<div class="jingshan_right">
			    <div class="jingshan_dalu"></div>
			</div>
		</div>
		<div class="main_bottom">
			<div class="table_bg"></div>
			<div class="jingshan_right">
			    <div class="jingshan_down">
			        <div class="jingshan_dayan"></div>
			        <div class="jingshan_xiaoqiang"></div>
			    </div>
			    <div class="jingshan_down">
			        <div class="jingshan_xiaolu"></div>
			        <div class="jingshan_sanxing"></div>
			    </div>
			</div>
		</div>
		</div>
	</div>
<script>if (new URLSearchParams(location.search).get('theme') === 'gold') document.body.classList.add('gold');</script>
<script src="luzhu.js?v=3"></script>
</body>
</html>
