<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>ADMIN</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<style>
body{margin:0;padding:0;background-color:#062b5c}
ul,li{list-style:none;margin-top:0;margin-bottom:0}
a{text-decoration:none;color:white}
.navbar{display:flex;justify-content:center;align-items:center;background-color:#062b5c;color:cornsilk;padding-top:1rem}
.navbar_menu{display:flex;list-style:none;padding:0;flex-wrap:wrap;justify-content:center}
.navbar_menu li{padding:5px 20px;font-size:14px;font-weight:bold}
.navbar_menu>li:hover{background-color:turquoise;border-radius:5px}
.item-box{border:1px solid #dee2e6;border-radius:6px;padding:10px 12px;background:#fff}
.item-box-title{font-weight:bold}
.tableNumInfo{color:#fff;font-size:13px;line-height:1.7;text-align:center;padding-bottom:30px}
.ch-bar{color:#fff;text-align:center;font-size:13px;margin-bottom:10px}
.ch-bar select{display:inline-block;width:auto;font-size:13px;padding:2px 8px}
#msg{min-height:22px;text-align:center;font-size:13px;margin-top:8px}
.login-box{min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-form{background-color:#062b5c;border-radius:10px;padding:2rem;max-width:400px;width:100%}
.btn-login{background-color:turquoise;border:2px solid white;color:white;font-size:20px;letter-spacing:2px;padding:10px 20px;width:100%}
</style>
</head>
<body>

<div id="loginView" class="login-box" hidden>
  <div class="login-form">
    <h4 class="text-white text-center mb-4">ADMIN 로그인</h4>
    <input type="text" class="form-control mb-2" id="lid" placeholder="아이디" maxlength="12" autocomplete="off">
    <input type="password" class="form-control mb-3" id="lpw" placeholder="비밀번호" maxlength="20" autocomplete="off">
    <button class="btn btn-login" id="lbtn">LOGIN</button>
    <div id="lmsg" class="text-warning text-center mt-2" style="min-height:22px"></div>
  </div>
</div>

<div id="adminView" hidden>
<nav class="navbar">
  <ul class="navbar_menu">
    <li><a id="nav-home" href="select.html" target="_blank" title="홈페이지"><i class="bi bi-house-door-fill"></i></a></li>
    <li><a href="#" class="active">[ GAME ]</a></li>
    <li><a id="nav-url" href="select.html">[ URL ]</a></li>
    <li><a href="#" id="logout" title="로그아웃"><i class="bi bi-box-arrow-right"></i></a></li>
  </ul>
</nav>

<div class="container">
  <div class="ch-bar" id="chbar" hidden>관리 계정:
    <select class="form-select" id="chsel"></select>
  </div>
  <div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-8">
      <form id="f" class="bg-light p-4 rounded" onsubmit="return false">
        <h2 class="text-center mb-4">그림장 정보 수정</h2>

        <div class="mb-3 d-flex align-items-center"><div class="form-check me-2"><input type="checkbox" class="form-check-input" name="write_check01" value="Y"></div><input type="text" class="form-control" name="write_text01"></div>
        <div class="mb-3 d-flex align-items-center"><div class="form-check me-2"><input type="checkbox" class="form-check-input" name="write_check02" value="Y"></div><input type="text" class="form-control" name="write_text02"></div>
        <div class="mb-3 d-flex align-items-center"><div class="form-check me-2"><input type="checkbox" class="form-check-input" name="write_check03" value="Y"></div><input type="text" class="form-control" name="write_text03"></div>
        <div class="mb-3 d-flex align-items-center"><div class="form-check me-2"><input type="checkbox" class="form-check-input" name="write_check04" value="Y"></div><input type="text" class="form-control" name="write_text04"></div>

        <div class="mt-3 mb-3 item-box">
          <label class="form-label"><span class="item-box-title">카톡배너</span></label>
          <div>
            <div class="form-check form-check-inline"><input type="radio" class="form-check-input" name="kakao" value="Y" id="kakaoY"><label class="form-check-label" for="kakaoY">출력</label></div>
            <div class="form-check form-check-inline"><input type="radio" class="form-check-input" name="kakao" value="N" id="kakaoN"><label class="form-check-label" for="kakaoN">출력안함</label></div>
          </div>
        </div>

        <div class="mb-3 item-box">
          <label class="form-label"><span class="item-box-title">현재시간</span></label>
          <div>
            <div class="form-check form-check-inline"><input type="radio" class="form-check-input" name="ktime" value="Y" id="ktimeY"><label class="form-check-label" for="ktimeY">출력</label></div>
            <div class="form-check form-check-inline"><input type="radio" class="form-check-input" name="ktime" value="N" id="ktimeN"><label class="form-check-label" for="ktimeN">출력안함</label></div>
          </div>
        </div>

        <div class="mb-3 item-box">
          <label class="form-label"><span class="item-box-title">그림장 선택</span></label>
          <div>
            <div class="form-check form-check-inline"><input type="radio" class="form-check-input" name="url" value="zh" id="urlZh"><label class="form-check-label" for="urlZh">한자</label></div>
            <div class="form-check form-check-inline"><input type="radio" class="form-check-input" name="url" value="en" id="urlEn"><label class="form-check-label" for="urlEn">영문</label></div>
          </div>
        </div>

        <div class="mb-3 d-flex justify-content-between">
          <div style="width:48%">
            <label class="form-label"><span class="item-box-title"><span class="text-danger">채널A </span>번호</span></label>
            <input type="number" class="form-control" name="table_num" min="0" max="99" oninput="this.value=this.value.slice(0,2)">
          </div>
          <div style="width:48%">
            <label class="form-label"><span class="item-box-title"><span class="text-danger">채널B </span>번호</span></label>
            <input type="number" class="form-control" name="table2_num" min="0" max="99" oninput="this.value=this.value.slice(0,2)">
          </div>
        </div>

        <div class="mb-3 item-box">
          <label class="form-label d-flex flex-column flex-sm-row align-items-start align-items-sm-center gap-2">
            <span class="item-box-title">세로 그림장 배너(GIF / W625*H145)</span>
            <img id="prev-h" alt="세로 배너 미리보기" class="img-fluid" style="max-height:40px;cursor:pointer" hidden onclick="window.open(this.src,'bannerPopup','width=800,height=600')">
          </label>
          <input type="file" class="form-control" name="banner_img_height" accept="image/gif">
        </div>
        <div class="mb-3 item-box">
          <label class="form-label d-flex flex-column flex-sm-row align-items-start align-items-sm-center gap-2">
            <span class="item-box-title">가로 그림장 배너(GIF / W425*H270)</span>
            <img id="prev-w" alt="가로 배너 미리보기" class="img-fluid" style="max-height:40px;cursor:pointer" hidden onclick="window.open(this.src,'bannerPopup','width=800,height=600')">
          </label>
          <input type="file" class="form-control" name="banner_img_width" accept="image/gif">
        </div>

        <div class="text-center"><button type="button" class="btn btn-primary" id="save">수정하기</button></div>
        <div id="msg"></div>
      </form>
    </div>
  </div>
</div>

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6 tableNumInfo">
      실제 테이블 번호와 상이한 경우<br>21=10<br>17=87<br>19=89<br>55=31<br>66=32<br>77=33<br>88=34<br>99=35
    </div>
  </div>
</div>
</div>

<script>
(function(){
  const BASE = location.pathname.replace(/[^\/]*$/, '');
  const q = new URLSearchParams(location.search);
  let ch = q.get('ch') || '01';
  let auth = null;
  try { auth = JSON.parse(sessionStorage.getItem('adminAuth') || 'null'); } catch(_) {}

  const $ = s => document.querySelector(s);
  const f = $('#f');

  function showLogin(){ $('#loginView').hidden = false; $('#adminView').hidden = true; }
  function showAdmin(){ $('#loginView').hidden = true; $('#adminView').hidden = false; }

  $('#lbtn').addEventListener('click', async () => {
    const id = $('#lid').value.trim(), pw = $('#lpw').value;
    try {
      const r = await fetch(BASE + 'login_check.php', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id, passwd: pw})});
      const d = await r.json();
      if (!d.ok) { $('#lmsg').textContent = d.error || '로그인 실패'; return; }
      auth = {id, pw, role: d.role};
      sessionStorage.setItem('adminAuth', JSON.stringify(auth));
      if (d.role !== 'master') ch = id;
      start();
    } catch(_) { $('#lmsg').textContent = '서버 오류'; }
  });
  $('#lpw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#lbtn').click(); });
  $('#logout').addEventListener('click', e => { e.preventDefault(); sessionStorage.removeItem('adminAuth'); auth = null; showLogin(); });

  async function load(){
    const r = await fetch(`${BASE}api_settings.php?ch=${ch}&_=${Date.now()}`, {cache:'no-store'});
    const s = await r.json();
    for (const i of ['01','02','03','04']) {
      f.elements['write_check'+i].checked = s['write_check'+i] !== 'N';
      f.elements['write_text'+i].value = s['write_text'+i] || '';
    }
    f.elements['kakao'].value = s.kakao === 'Y' ? 'Y' : 'N';
    f.elements['ktime'].value = s.ktime === 'Y' ? 'Y' : 'N';
    f.elements['url'].value = s.url === 'zh' ? 'zh' : 'en';
    f.elements['table_num'].value = s.table_num || '';
    f.elements['table2_num'].value = s.table2_num || '';
    for (const [k, id] of [['banner_height','#prev-h'],['banner_width','#prev-w']]) {
      const img = $(id);
      if (s[k]) { img.src = BASE + s[k]; img.hidden = false; } else img.hidden = true;
    }
    $('#nav-home').href = BASE + 'CAH_1.html?ch=' + ch;
    $('#nav-url').href = BASE + 'select.html?ch=' + ch;
  }

  $('#save').addEventListener('click', async () => {
    const fd = new FormData(f);
    fd.set('ch', ch); fd.set('admin_id', auth.id); fd.set('admin_pw', auth.pw);
    $('#msg').textContent = '저장 중…'; $('#msg').className = 'text-secondary';
    try {
      const r = await fetch(BASE + 'write_up.php', {method:'POST', body: fd});
      const d = await r.json();
      if (d.ok) { $('#msg').textContent = '수정되었습니다.'; $('#msg').className = 'text-success'; f.elements['banner_img_height'].value=''; f.elements['banner_img_width'].value=''; load(); }
      else { $('#msg').textContent = d.error || '실패'; $('#msg').className = 'text-danger'; if (r.status === 401) showLogin(); }
    } catch(_) { $('#msg').textContent = '서버 오류'; $('#msg').className = 'text-danger'; }
  });

  function start(){
    if (!auth) return showLogin();
    showAdmin();
    if (auth.role === 'master') {
      const sel = $('#chsel'); sel.innerHTML = '';
      for (let i = 1; i <= 20; i++) { const v = String(i).padStart(2,'0'); const o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o); }
      sel.value = ch; $('#chbar').hidden = false;
      sel.onchange = () => { ch = sel.value; history.replaceState(null, '', '?ch=' + ch); load(); };
    } else { ch = auth.id; }
    load();
  }
  start();
})();
</script>
</body>
</html>
