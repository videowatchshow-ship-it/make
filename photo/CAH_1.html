<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<base href="/photo/">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>세로</title>
<meta name="description" content="라이브뷰" />
<link rel="stylesheet" type="text/css" href="include/live_style.css">
<style type="text/css">
body{margin:0;padding:0;background:#000}
.full_box{position:relative;top:0;left:0;width:100vw;height:100vh;display:flex;flex-direction:column;justify-content:flex-start}
.container{display:flex;width:1070px;overflow:hidden;border:solid 8px #26a5b7;position:relative}
.box_L{display:flex;flex-direction:column;justify-content:space-between;align-items:center}
.box_A{position:relative;display:flex;background-color:#ffffff;border-bottom:solid 8px #26a5b7;overflow:hidden}
.board_A{position:relative;width:440px;height:240px;background-color:#000000;overflow:hidden;border-right:solid 5px #26a5b7;z-index:100}
.board_A_iframe{position:absolute;width:1300px;height:1248px;top:-700px;left:1px}
.board_A_iframe iframe{transform:scale(1.0,1.0);transform-origin:top left}
.box_B{display:flex;flex-direction:column;width:625px;overflow:hidden;background-color:#FEBEBE}
.kakao_banner{display:flex;height:145px;overflow:hidden}
.kakao_banner img{width:100%;height:145px}
.next_road{background:#000;position:relative;display:flex;width:625px;height:95px;margin:auto 0 0 0;overflow:hidden}
.next_road_pbimg{position:absolute;top:0px;left:0px;display:flex;width:625px;height:95px;z-index:10}
.board_view_nextboxP iframe{transform:scale(3.0,3.0);transform-origin:top left}
.board_view_nextboxP{position:absolute;display:flex;width:200px;height:60px;overflow:hidden;top:15px;left:120px}
.board_view_nextbox_iframeP{position:absolute;display:flex;width:1000px;height:1700px;top:-1967px;left:-835px}
.board_view_nextboxB iframe{transform:scale(3,3);transform-origin:top left}
.board_view_nextboxB{position:absolute;display:flex;width:200px;height:60px;overflow:hidden;top:15px;left:418px}
.board_view_nextbox_iframeB{position:absolute;display:flex;width:1000px;height:1700px;top:-1967px;left:-280px}
.box_C{position:relative;width:1070px;height:310px;background-color:#ffffff;overflow:hidden;z-index:100}
.box_C_iframe{position:absolute;width:1300px;height:1248px;top:-875px;left:-558px;border-right:solid 0.5vw #26a5b7}
.box_C_iframe iframe{transform:scale(1.25,1.25);transform-origin:top left}
.box_R{display:flex;width:100%;background-color:#ffffff;border-left:solid 0.5vw #26a5b7;color:#000000;overflow:hidden}
.box_R img{height:556px;width:100%}
.bottom_text_box{position:absolute;bottom:0px;left:0px;display:flex;width:100vw;justify-content:space-around;align-items:center;color:white;font-size:38px;font-family:'S-CoreDream-5Medium';overflow:hidden;background-color:rgba(9,9,9,0.5)}
.bottom_text_box:empty{display:none}
.text_box_text01{padding:10px 20px;color:#FFEB46}.text_box_text02{padding:10px 20px;color:#FEBEBE}
.text_box_text03{padding:10px 20px;color:#FF9DFF}.text_box_text04{padding:10px 20px;color:#AAFA82}
.ktime{position:absolute;top:8px;right:20px;color:#fff;font-size:22px;font-family:monospace;z-index:200;background:rgba(0,0,0,.5);padding:2px 10px;border-radius:6px;display:none}
/* 싱지/뉴싱지 자체 렌더 */
.bgl-wrap{display:none;width:1070px;height:558px;background:#000;overflow:auto;align-items:center;justify-content:flex-start;padding:0 10px;position:absolute;top:0;left:0;z-index:300}
.bgl-table{border-collapse:collapse;table-layout:fixed}
.bgl-table td{width:60px;height:60px;border:1px solid #222;padding:2px;vertical-align:middle;text-align:center}
.bgl-p,.bgl-b{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;margin:auto}
.bgl-p{background:#1a237e;border:3px solid #5c6bc0}.bgl-b{background:#7f0000;border:3px solid #e53935}
.bgl-p i.pp{position:absolute;width:14px;height:14px;border-radius:50%;top:0;right:0;background:#ef5350;border:1px solid #fff}
.bgl-b i.bp{position:absolute;width:14px;height:14px;border-radius:50%;top:0;right:0;background:#5c6bc0;border:1px solid #fff}
.bgl-p i.bp{position:absolute;width:14px;height:14px;border-radius:50%;bottom:0;left:0;background:#5c6bc0;border:1px solid #fff}
.bgl-b i.pp{position:absolute;width:14px;height:14px;border-radius:50%;bottom:0;left:0;background:#ef5350;border:1px solid #fff}
.bgl-p s,.bgl-b s{position:absolute;bottom:-10px;right:-5px;text-decoration:none;font-size:13px;color:#4caf50;font-weight:bold;line-height:1}
#bgl-room{position:absolute;top:6px;left:14px;color:#ffd54f;font-size:18px;font-weight:bold;z-index:400}
.next_road_pbimg{pointer-events:none}
.next_road_pbimg .nl{position:absolute;top:22px;height:46px;line-height:46px;color:#fff;font:italic bold 34px Arial,sans-serif;letter-spacing:-1px;white-space:nowrap}
.next_road_pbimg .nl i{display:inline-block;width:30px;height:30px;border-radius:50%;vertical-align:middle;margin-left:6px;border:2px solid #fff;box-sizing:border-box}
.next_road_pbimg .nl i.p{background:#1f5fbf}.next_road_pbimg .nl i.b{background:#d61a1a}
.next_road_pbimg .pill{position:absolute;top:11px;width:208px;height:68px;border:3px solid #fff;border-radius:34px;box-sizing:border-box}
.board_view_nextboxP,.board_view_nextboxB{border-radius:30px}

/* Next 신호: 그림장 iframe 확대 크롭 대신 페이지에서 직접 선명하게 렌더 (대안=테두리 원, 소로=채운 원, 소강=대각선) */
.nx{display:flex!important;align-items:center;justify-content:center;gap:22px;background:#009E94;border-radius:30px}
.nx i{display:block;width:30px;height:30px;box-sizing:border-box}
.nx i.dayan{border-radius:50%;border:5px solid}
.nx i.xiaolu{border-radius:50%}
.nx i.xiaoqiang{width:10px;height:36px;border-radius:5px;transform:rotate(40deg)}
.nx i.red.dayan{border-color:#e02020} .nx i.blue.dayan{border-color:#1f5fbf}
.nx i.red.xiaolu,.nx i.red.xiaoqiang{background:#e02020} .nx i.blue.xiaolu,.nx i.blue.xiaoqiang{background:#1f5fbf}
.nx i.no_find{visibility:hidden}
.full_box{overflow:hidden}
.container{transform-origin:top left}
</style>
</head>
<body data-texts="2">
<div class="full_box">
  <div class="container">
    <div class="box_L">
      <div class="box_A">
        <div class="board_A" data-xtd><div class="board_A_iframe"><iframe class="lz" width="100%" height="100%" scrolling="no" frameborder="0"></iframe></div></div>
        <div class="box_B">
          <div class="kakao_banner" id="kakao_banner"><img id="banner_h" src="images/Live_height_banner_scj.gif" width="100%" alt=""></div>
          <div class="next_road" data-xtd>
            <div class="next_road_pbimg"><span class="nl" style="left:18px"><em>Next</em><i class="p"></i></span><span class="pill" style="left:116px"></span><span class="nl" style="left:333px"><em>Next</em><i class="b"></i></span><span class="pill" style="left:414px"></span></div>
            <div class="board_view_nextboxP nx" id="nx-p"></div>
            <div class="board_view_nextboxB nx" id="nx-b"></div>
          </div>
        </div>
      </div>
      <div class="box_C" data-xtd><div class="box_C_iframe"><iframe class="lz" width="100%" height="100%" scrolling="no" frameborder="0"></iframe></div></div>
    </div>
    <div class="box_R"><img src="images/h_side_banner.png" height="100%" alt=""></div>
    <div class="bgl-wrap" id="bgl-wrap"><div class="bgl-road"></div></div>
    <div id="bgl-room"></div>
  </div>
  <div class="ktime" id="ktime"></div>
  <div class="bottom_text_box" id="texts"></div>
</div>
<script src="bgl.js?v=4"></script>
<script src="luzhu.js?v=7"></script>
<script src="view.js?v=8"></script>
<script>window.__view && window.__view({ch: 'A'});</script>
<script>
(function fitScale(){ // 화면 폭이 1086px(1070+테두리) 보다 좁으면 그 비율로 전체 축소 → 잘림 없음
  function fit(){ var c=document.querySelector('.container'); if(!c) return; var w=c.offsetWidth||1086; var sc=Math.min(1, window.innerWidth / w); c.style.transform='scale('+sc+')'; }
  window.addEventListener('resize', fit); window.addEventListener('load', fit); fit();
})();
</script>
</body>
</html>
