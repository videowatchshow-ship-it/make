<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>세로3</title>
<meta name="description" content="라이브뷰 세로3 (포추나 원본 화면)" />
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
.wrap{position:relative;width:100vw;height:100vh}
iframe.src{position:absolute;inset:0;width:100%;height:100%;border:0}
#bgl-room{position:absolute;top:6px;left:12px;color:#ffd54f;font:bold 16px 'Malgun Gothic',sans-serif;z-index:5;background:rgba(0,0,0,.45);padding:2px 8px;border-radius:6px}
.bottom_text_box{position:absolute;bottom:0;left:0;display:flex;width:100vw;justify-content:space-around;align-items:center;color:#fff;font-size:30px;font-family:'S-CoreDream-5Medium';overflow:hidden;background:rgba(9,9,9,.5);z-index:5}
.bottom_text_box:empty{display:none}
.text_box_text01{padding:8px 16px;color:#FFEB46}.text_box_text02{padding:8px 16px;color:#FEBEBE}
.text_box_text03{padding:8px 16px;color:#FF9DFF}.text_box_text04{padding:8px 16px;color:#AAFA82}
.ktime{position:absolute;top:8px;right:20px;color:#fff;font-size:22px;font-family:monospace;z-index:5;background:rgba(0,0,0,.5);padding:2px 10px;border-radius:6px;display:none}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#888;font:15px 'Malgun Gothic',sans-serif;text-align:center;padding:20px}
</style>
</head>
<body data-mode="foduna">
<div class="wrap">
  <div class="msg" id="msg">테이블을 선택하세요 (select.html)</div>
  <iframe class="src" id="frame" allow="autoplay" hidden></iframe>
  <div id="bgl-room"></div>
  <div class="ktime" id="ktime"></div>
  <div class="bottom_text_box" id="texts"></div>
</div>
<script src="view.js?v=1"></script>
<script>window.__viewEmbed && window.__viewEmbed({mode:'foduna'});</script>
</body>
</html>
