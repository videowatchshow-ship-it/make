<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>보물섬 채널 현황</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d1117">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
  :root{
    --bg:#0d1117; --panel:#0f1620; --card:#161a20; --border:#22282f; --border2:#2a323c;
    --text:#e8ecef; --sub:#8a95a5; --accent:#7dabff; --accent2:#3ddc84; --warn:#ffb469; --pink:#ff8ad4;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 16px 60px}
  .wrap{width:100%;max-width:560px}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px;justify-content:center}
  .brand .logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:22px}
  .brand h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-0.5px}
  .brand .sub{color:var(--sub);font-size:12px;margin-top:2px}
  .install-bar{display:flex;justify-content:center;margin-bottom:20px}
  #install-btn{display:none;align-items:center;gap:8px;background:linear-gradient(135deg,var(--accent),#5a8dff);color:#0d1117;font-weight:800;border:none;border-radius:999px;padding:10px 20px;font-size:14px;cursor:pointer;box-shadow:0 4px 20px rgba(125,171,255,.35)}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .card-head .label{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--accent)}
  .card-head .actions{display:flex;gap:6px}
  .icon-btn{background:var(--card);border:1px solid var(--border2);color:var(--sub);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px}
  .icon-btn:hover{color:var(--text);border-color:var(--accent)}
  .site-row{background:var(--card);border:1px solid var(--border2);border-radius:10px;overflow:hidden}
  .site-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer;user-select:none}
  .site-head:hover{background:#1a1f27}
  .site-name{display:flex;align-items:center;gap:8px;font-size:14px}
  .site-name .ko{color:var(--sub);font-size:12px}
  .site-count{color:var(--accent2);font-weight:800;font-size:14px}
  .site-caret{color:var(--sub);margin-left:8px;transition:.2s}
  .site-row.open .site-caret{transform:rotate(90deg)}
  .site-body{display:none;border-top:1px solid var(--border2);padding:10px 14px 12px;background:#12171e}
  .site-row.open .site-body{display:block}
  .email-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text)}
  .email-list li{padding:5px 8px;border-radius:6px;background:#0d1218;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .email-list .status{font-size:10.5px;color:var(--sub);flex-shrink:0}
  .email-list .status.ok{color:var(--accent2)}
  .email-list .status.bad{color:#ff7676}
  .pager{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--sub)}
  .pager button{background:var(--card);border:1px solid var(--border2);color:var(--text);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
  .pager button:disabled{opacity:.35;cursor:not-allowed}
  .footer-note{text-align:center;color:var(--sub);font-size:11px;margin-top:24px;line-height:1.7}
  .footer-note b{color:var(--accent2)}
  .empty{color:var(--sub);font-size:13px;padding:8px 4px}
  nav{position:sticky;top:0;z-index:20;background:#111418;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;height:48px;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  nav::-webkit-scrollbar{display:none}
  nav a{color:var(--sub);text-decoration:none;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;white-space:nowrap;transition:background .15s,color .15s}
  nav a:hover{background:#1a1f27;color:var(--text)}
  nav a.active{background:#1e3a5f;color:var(--accent)}
</style>
</head>
<body>
<nav>
  <a href="/" class="active">🏠 보물섬</a>
  <a href="/accounts.html">📋 계정 상세</a>
  <a href="/login-issues.html">🚫 로그인 문제</a>
</nav>
<div class="wrap">

  <div class="brand">
    <div class="logo">🏝️</div>
    <div>
      <h1>보물섬 채널 현황</h1>
      <div class="sub">하위 사이트별 계정 현황 · 실시간</div>
    </div>
  </div>

  <div class="install-bar"><button id="install-btn">📲 앱으로 설치</button></div>

  <div class="card">
    <div class="card-head">
      <span class="label">📄 엑셀 업로드 (단일 파일)</span>
    </div>
    <form id="excel-form" style="display:flex;flex-direction:column;gap:10px">
      <input type="file" id="excel-file" name="file" accept=".xlsx,.xls,.csv" required
        style="background:var(--card);border:1px dashed var(--border2);border-radius:8px;padding:12px;color:var(--text);font-size:13px">
      <button type="submit" id="excel-submit"
        style="background:linear-gradient(135deg,var(--accent),#5a8dff);color:#0d1117;font-weight:800;border:none;border-radius:8px;padding:10px 14px;font-size:14px;cursor:pointer">
        업로드 (엑셀 1개만)
      </button>
      <div id="excel-status" style="font-size:12px;color:var(--sub);white-space:pre-wrap"></div>
    </form>
  </div>

  <div class="card">
    <div class="card-head">
      <span class="label">📦 하위 사이트별 계정</span>
      <div class="actions">
        <button class="icon-btn" id="refresh-subsites">🔄 새로고침</button>
      </div>
    </div>
    <div id="subsite-list" style="display:flex;flex-direction:column;gap:8px">불러오는 중…</div>
    <div id="total-line" style="text-align:right;color:var(--sub);font-size:11px;margin-top:10px"></div>
  </div>

  <div class="footer-note">gauth.cent-solution.online 계정 데이터를 함께 표시하는 전용 뷰입니다.<br>로그인/2FA/토큰 발급은 <b>gauth</b>에서만 처리됩니다.</div>
</div>

<script>
const SITE_META = {
  gain:      {emoji:'🟣', ko:'게인'},
  woodong:   {emoji:'🚕', ko:'우동'},
  sunbi:     {emoji:'📘', ko:'선비'},
  simmani:   {emoji:'🎬', ko:'심마니'},
  win:       {emoji:'🏆', ko:'윈'},
  aura:      {emoji:'✨', ko:'아우라'},
  bacad:     {emoji:'🎓', ko:'바캇'},
  camstouch: {emoji:'📷', ko:'캠스터치'},
  james:     {emoji:'👤', ko:'제임스'},
  misskim:   {emoji:'👩', ko:'미스김'},
  naman:     {emoji:'🧑', ko:'나만'},
  romi:      {emoji:'🐾', ko:'로미'},
  second:    {emoji:'2️⃣', ko:'세컨드'},
  soktv:     {emoji:'📺', ko:'속TV'},
  cham:      {emoji:'🐘', ko:'참'}
};
const PAGE_SIZE = 10;
const pageState = {};

function esc(s){ var d=document.createElement('div'); d.textContent=String(s==null?'':s); return d.innerHTML; }

function renderEmailPage(site, accounts){
  var page = pageState[site] || 0;
  var total = accounts.length;
  var totalPages = Math.max(1, Math.ceil(total/PAGE_SIZE));
  if(page >= totalPages) page = totalPages-1;
  if(page < 0) page = 0;
  pageState[site] = page;
  var start = page*PAGE_SIZE;
  var slice = accounts.slice(start, start+PAGE_SIZE);
  if(!slice.length) return '<div class="empty">계정 없음</div>';
  var items = slice.map(function(a){
    var email = a.email || a.gmail || a.id || '(unknown)';
    var st = (a.status || '').toString().toLowerCase();
    var stClass = st.indexOf('ok')>=0 || st.indexOf('active')>=0 || st.indexOf('live')>=0 ? 'ok'
                : st.indexOf('fail')>=0 || st.indexOf('block')>=0 || st.indexOf('bad')>=0 ? 'bad' : '';
    return '<li><span>'+esc(email)+'</span><span class="status '+stClass+'">'+esc(a.status||'')+'</span></li>';
  }).join('');
  var pager = '<div class="pager">'
    + '<button data-site="'+esc(site)+'" data-dir="-1" '+(page===0?'disabled':'')+'>◀ 이전</button>'
    + '<span>'+(start+1)+'–'+Math.min(start+PAGE_SIZE,total)+' / '+total+' (페이지 '+(page+1)+'/'+totalPages+')</span>'
    + '<button data-site="'+esc(site)+'" data-dir="1" '+(page>=totalPages-1?'disabled':'')+'>다음 ▶</button>'
    + '</div>';
  return '<ul class="email-list">'+items+'</ul>'+pager;
}

function renderSites(sites){
  var el = document.getElementById('subsite-list');
  if(!sites.length){ el.textContent='데이터 없음'; return; }
  el.innerHTML = sites.map(function(s){
    var meta = SITE_META[s.site] || {emoji:'📁', ko:''};
    var count = (s.accounts && s.accounts.length) || s.count || 0;
    return '<div class="site-row" data-site="'+esc(s.site)+'">'
      + '<div class="site-head">'
        + '<div class="site-name">'
          + '<span>'+meta.emoji+'</span>'
          + '<b>'+esc(s.site)+'</b>'
          + (meta.ko?'<span class="ko">('+meta.ko+')</span>':'')
        + '</div>'
        + '<div><span class="site-count">'+count+'개</span><span class="site-caret">▶</span></div>'
      + '</div>'
      + '<div class="site-body" data-body="'+esc(s.site)+'"></div>'
    + '</div>';
  }).join('');
  el.querySelectorAll('.site-row').forEach(function(row){
    var site = row.getAttribute('data-site');
    var head = row.querySelector('.site-head');
    var body = row.querySelector('.site-body');
    head.addEventListener('click', function(){
      var wasOpen = row.classList.contains('open');
      if(wasOpen){ row.classList.remove('open'); return; }
      row.classList.add('open');
      var siteObj = sites.find(function(x){return x.site===site;});
      body.innerHTML = renderEmailPage(site, siteObj.accounts||[]);
      wirePager(body, siteObj);
    });
  });
}

function wirePager(body, siteObj){
  body.querySelectorAll('.pager button').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var dir = parseInt(btn.getAttribute('data-dir'),10);
      var site = btn.getAttribute('data-site');
      pageState[site] = (pageState[site]||0) + dir;
      body.innerHTML = renderEmailPage(site, siteObj.accounts||[]);
      wirePager(body, siteObj);
    });
  });
}

async function loadSubsites(){
  var el = document.getElementById('subsite-list');
  var totalLine = document.getElementById('total-line');
  el.textContent = '불러오는 중…';
  totalLine.textContent = '';
  try{
    var r = await fetch('/api/subsite-accounts', {cache:'no-store'});
    if(!r.ok){
      var r2 = await fetch('/api/subsite-counts', {cache:'no-store'});
      var d2 = await r2.json();
      var sites2 = (d2.sites||[]).map(function(s){return {site:s.site, count:s.count, accounts:[]};});
      renderSites(sites2);
      totalLine.textContent = '총 '+(d2.total||0)+'개';
      return;
    }
    var d = await r.json();
    var sites = d.sites || [];
    renderSites(sites);
    var total = sites.reduce(function(a,s){return a + ((s.accounts&&s.accounts.length)||s.count||0);}, 0);
    totalLine.textContent = '총 '+total+'개';
  }catch(e){
    el.textContent = '불러오기 실패 ('+e.message+')';
  }
}
document.getElementById('refresh-subsites').addEventListener('click', loadSubsites);
loadSubsites();

// Excel upload (single file → gauth /api/excel/upload via jump vhost proxy)
document.getElementById('excel-form').addEventListener('submit', async function(e){
  e.preventDefault();
  var st = document.getElementById('excel-status');
  var btn = document.getElementById('excel-submit');
  var input = document.getElementById('excel-file');
  if(!input.files || !input.files[0]){ st.textContent='파일을 선택해주세요.'; return; }
  var file = input.files[0];
  st.textContent = '업로드 중: '+file.name+' ('+file.size+' bytes)';
  btn.disabled = true;
  try{
    var fd = new FormData();
    fd.append('file', file);
    var r = await fetch('/api/excel/upload', {method:'POST', body: fd, cache:'no-store'});
    var txt = await r.text();
    if(!r.ok){ st.textContent = '❌ 실패 ('+r.status+'): '+txt.slice(0,400); return; }
    st.textContent = '✅ 업로드 완료\n'+txt.slice(0,600);
    setTimeout(loadSubsites, 1500);
  }catch(err){
    st.textContent = '❌ 오류: '+err.message;
  }finally{
    btn.disabled = false;
  }
});

let deferredPrompt;
const installBtn = document.getElementById('install-btn');
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault(); deferredPrompt=e; installBtn.style.display='inline-flex';
});
installBtn.addEventListener('click', function(){
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.finally(function(){ deferredPrompt=null; installBtn.style.display='none'; });
});
window.addEventListener('appinstalled', function(){ installBtn.style.display='none'; });

if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(regs){
    regs.forEach(function(reg){ reg.unregister(); });
  });
}
if(window.caches && caches.keys){
  caches.keys().then(function(keys){ keys.forEach(function(k){ caches.delete(k); }); });
}
</script>
</body>
</html>
