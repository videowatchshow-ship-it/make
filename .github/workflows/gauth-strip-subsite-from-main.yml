name: gauth · undo overstrip + narrow subsite-only removal

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-strip-subsite.txt']

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore from bak.strip + narrow removal (subsite only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            F=/var/www/sites/gauth/public/index.html
            echo '=== 1. list bak.strip snapshots (before over-strip) ==='
            sudo ls -1t $F.bak.strip.* 2>/dev/null | head -5
            echo ''
            # pick oldest bak.strip — that was the state BEFORE the overstrip (had both lookup and subsite)
            OLDEST_STRIP=$(sudo ls -1r $F.bak.strip.* 2>/dev/null | head -1)
            if [ -z "$OLDEST_STRIP" ]; then
              echo 'no bak.strip found; falling back to any recent bak with lookup marker'
              for b in $(sudo ls -1t $F.bak.* 2>/dev/null); do
                if sudo grep -q '계정 정보 확인\|조회' "$b" 2>/dev/null; then
                  OLDEST_STRIP="$b"; break
                fi
              done
            fi
            echo "restoring from: $OLDEST_STRIP"
            sudo cp "$F" "$F.bak.overstrip.$(date +%s)"
            sudo cp "$OLDEST_STRIP" "$F"

            echo ''
            echo '=== 2. surgically remove subsite card by tight regex only ==='
            sudo python3 - <<'PYEOF'
            import re
            f = '/var/www/sites/gauth/public/index.html'
            s = open(f, encoding='utf-8').read()
            before = len(s)

            # Only strip: (a) any element with id containing 'subsite' or 'tab-subsite' or 'tab-master'
            # Match specific known ids used by subsite-only feature
            for id_pat in ('subsite-accounts-body', 'subsite-list', 'subsite-error', 'subsite-filter', 'subsite-total'):
                s = re.sub(r'<[^>]+id="'+id_pat+r'"[^>]*>.*?</[a-zA-Z]+>', '', s, flags=re.S)
            # Strip tab buttons that are subsite-only
            for id_pat in ('tab-subsite', 'tab-master'):
                s = re.sub(r'<button[^>]+id="'+id_pat+r'"[^>]*>[^<]*</button>\s*', '', s)
            # Strip only the card that contains 'subsite-list' or 'subsite-accounts-body' by looking for enclosing <div class="card">
            def strip_card_containing(text, needle):
                out = text
                for _ in range(5):
                    idx = out.find(needle)
                    if idx < 0: break
                    # find nearest preceding '<div class="card"'
                    m = None
                    for mm in re.finditer(r'<div[^>]*class="[^"]*card[^"]*"[^>]*>', out[:idx]):
                        m = mm
                    if not m: break
                    start = m.start()
                    i = m.end(); depth = 1; end = -1
                    while i < len(out):
                        if out.startswith('<div', i):
                            j = out.find('>', i)
                            if j < 0: break
                            if not out[i:j].endswith('/'): depth += 1
                            i = j+1; continue
                        if out.startswith('</div>', i):
                            depth -= 1; i += 6
                            if depth == 0: end = i; break
                            continue
                        i += 1
                    if end < 0: break
                    out = out[:start] + out[end:]
                return out
            # Only strip card if it clearly contains a subsite-* id (won't match lookup card)
            for needle in ('id="subsite-list"', 'id="subsite-accounts-body"'):
                s = strip_card_containing(s, needle)
            after = len(s)
            print(f'bytes removed: {before-after}')

            # keep nav link
            if 'id="nav-subsites"' not in s and '<body>' in s:
                nav = ('<a id="nav-subsites" href="/subsites.html" '
                       'style="position:fixed;top:12px;right:14px;z-index:9999;'
                       'background:#161a20;color:#7dabff;border:1px solid #22282f;'
                       'border-radius:999px;padding:6px 14px;font-size:12px;'
                       'text-decoration:none;font-weight:700;font-family:sans-serif">'
                       '📦 하위 계정 →</a>\n')
                s = s.replace('<body>', '<body>\n' + nav, 1)
            open(f, 'w', encoding='utf-8').write(s)
            PYEOF

            echo ''
            echo '=== 3. verify 조회 (lookup) survives + subsite removed ==='
            echo 'lookup markers present (조회/계정 정보 확인):'
            curl -s --max-time 10 https://gauth.cent-solution.online/ | grep -oE '계정 정보 확인|조회|/api/lookup' | sort -u | head -5
            echo ''
            echo 'subsite residual (should be empty):'
            curl -s --max-time 10 https://gauth.cent-solution.online/ | grep -oE 'subsite-list|subsite-accounts-body|하위 사이트별 계정' | sort -u
            echo ''
            echo 'main HTTPS:'
            curl -s -o /dev/null -w '%{http_code}\n' https://gauth.cent-solution.online/ --max-time 10
