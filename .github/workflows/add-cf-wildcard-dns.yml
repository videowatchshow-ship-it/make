name: Add Cloudflare wildcard DNS
on:
  workflow_dispatch:

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add wildcard A record via gauth server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 3m
          script: |
            CF_TOKEN=$(sudo grep -oP 'dns_cloudflare_api_token\s*=\s*\K\S+' /root/.secrets/cloudflare.ini 2>/dev/null)
            if [ -z "$CF_TOKEN" ]; then
              echo "ERROR: token not found"
              exit 1
            fi
            echo "Token found: ${CF_TOKEN:0:10}..."

            # Get zone list
            echo "=== Zones ==="
            curl -s -X GET "https://api.cloudflare.com/client/v4/zones?per_page=50" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" | python3 -c "
import sys,json
d=json.load(sys.stdin)
if not d.get('success'):
    print('FAIL:', d.get('errors'))
    sys.exit(1)
for z in d['result']:
    print(z['id'], z['name'])
"

            # Get zone ID for the domain
            ZONE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=xn--9d0bw2fjtyymch7de9d.info" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" | python3 -c "
import sys,json
d=json.load(sys.stdin)
if d.get('result'):
    print(d['result'][0]['id'])
else:
    print('')
")
            echo "Zone ID: $ZONE_ID"

            if [ -z "$ZONE_ID" ]; then
              echo "ERROR: zone not found"
              exit 1
            fi

            # Check if wildcard record already exists
            EXISTING=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=A&name=*.xn--9d0bw2fjtyymch7de9d.info" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" | python3 -c "
import sys,json
d=json.load(sys.stdin)
if d.get('result'):
    print(d['result'][0]['id'])
else:
    print('')
")

            if [ -n "$EXISTING" ]; then
              echo "Wildcard record already exists: $EXISTING — updating"
              RESULT=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$EXISTING" \
                -H "Authorization: Bearer $CF_TOKEN" \
                -H "Content-Type: application/json" \
                --data '{"type":"A","name":"*","content":"34.104.233.35","ttl":1,"proxied":true}')
            else
              echo "Creating new wildcard A record"
              RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
                -H "Authorization: Bearer $CF_TOKEN" \
                -H "Content-Type: application/json" \
                --data '{"type":"A","name":"*","content":"34.104.233.35","ttl":1,"proxied":true}')
            fi

            echo "=== Result ==="
            echo "$RESULT" | python3 -c "
import sys,json
d=json.load(sys.stdin)
if d.get('success'):
    r=d['result']
    print('SUCCESS:', r.get('name'), '->', r.get('content'), 'proxied='+str(r.get('proxied')))
else:
    print('FAIL:', d.get('errors'))
    sys.exit(1)
"
