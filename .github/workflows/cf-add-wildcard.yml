name: CF wildcard DNS add
on:
  push:
    branches: [ claude/auto-test-debugging-local-n0xjkg ]
    paths: [ .github/workflows/cf-add-wildcard.yml ]
  workflow_dispatch:

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Search all CF tokens on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 4m
          script: |
            echo "=== List /opt/claude-mem-sync structure ==="
            sudo find /opt/claude-mem-sync -type f 2>/dev/null | head -50

            echo ""
            echo "=== Search ALL cfut_ tokens everywhere ==="
            sudo grep -rhoP 'cfut_[A-Za-z0-9_-]{20,}' /opt/claude-mem-sync/ /root/ /home/ /etc/ 2>/dev/null | sort -u

            echo ""
            echo "=== Search for Global API Key (37-char hex) in known files ==="
            for f in /root/.secrets/* /opt/claude-mem-sync/proj1/* /opt/claude-mem-sync/proj1/**/* /root/.cloudflare 2>/dev/null; do
              [ -f "$f" ] || continue
              sudo grep -iP 'global|api.?key|email|X-Auth' "$f" 2>/dev/null | head -3 && echo "(in $f)"
            done

            echo ""
            echo "=== /root/.secrets/ contents ==="
            sudo ls -la /root/.secrets/ 2>/dev/null
            sudo cat /root/.secrets/cloudflare.ini 2>/dev/null

            echo ""
            echo "=== deploy-gauth.yml CF section (from server) ==="
            sudo grep -A5 -i 'cloudflare\|CF_TOKEN\|cf_zone\|ZONE_ID' /opt/gauth-full/.env 2>/dev/null || echo "no .env match"
            sudo grep -rhoP 'cfut_[A-Za-z0-9_-]{20,}' /opt/gauth-full/ 2>/dev/null | sort -u || echo "no cfut in gauth-full"

            echo ""
            echo "=== Check certbot renewal hooks for CF token ==="
            sudo grep -rhoP 'cfut_[A-Za-z0-9_-]{20,}' /etc/letsencrypt/ 2>/dev/null | sort -u || echo "none in letsencrypt"
            sudo find /etc/letsencrypt -name '*.ini' -exec sudo cat {} \; 2>/dev/null | grep -i cloudflare | head -5

            echo "=== DONE ==="
