name: CF wildcard DNS add
on:
  push:
    branches: [ claude/auto-test-debugging-local-n0xjkg ]
    paths: [ .github/workflows/cf-add-wildcard.yml ]
  workflow_dispatch:

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: GCP 인증
        id: gcp_auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: CF 와일드카드 A 레코드 추가
        if: always()
        env:
          GAUTH_HOST: ${{ secrets.GAUTH_HOST }}
          GAUTH_USER: ${{ secrets.GAUTH_USER }}
          GAUTH_SSH_KEY: ${{ secrets.GAUTH_SSH_KEY }}
        run: |
          install -m 600 /dev/null /tmp/id_gauth
          printf '%s\n' "$GAUTH_SSH_KEY" > /tmp/id_gauth
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o BatchMode=yes \
            -i /tmp/id_gauth "${GAUTH_USER}@${GAUTH_HOST}" bash << 'ENDSSH'
          ZONE_ID="7e5faed2d3d4d6da7aceb4ddde81a62b"
          IP="34.104.233.35"
          TOKEN=""

          echo "=== hostname ==="
          hostname; hostname -I 2>/dev/null || true

          echo "=== /root/.secrets/cloudflare.ini ==="
          sudo cat /root/.secrets/cloudflare.ini 2>/dev/null || echo "파일없음"

          TOKEN=$(sudo grep -oP 'dns_cloudflare_api_token\s*=\s*\K\S+' /root/.secrets/cloudflare.ini 2>/dev/null || true)
          if [ -z "$TOKEN" ]; then
            TOKEN=$(sudo grep -rhoP 'cfut_[A-Za-z0-9]{40,}' /var/www/sites/ /home/ /root/ /etc/ 2>/dev/null | sort -u | head -1 || true)
          fi

          if [ -z "$TOKEN" ]; then
            echo "ERROR: CF 토큰 못 찾음"
            exit 1
          fi

          echo "사용 토큰: ${TOKEN:0:25}..."

          VERIFY=$(curl -sS "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $TOKEN")
          echo "토큰 검증: $VERIFY"

          EXISTING=$(curl -sS "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=A&name=*" \
            -H "Authorization: Bearer $TOKEN")
          COUNT=$(echo "$EXISTING" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('result_info',{}).get('count',0))" 2>/dev/null || echo 0)

          if [ "$COUNT" -gt 0 ]; then
            echo "와일드카드 이미 존재"
            echo "$EXISTING" | python3 -c "import sys,json; [print(r['name'],r['content'],r['proxied']) for r in json.load(sys.stdin).get('result',{})]"
          else
            echo "생성 중..."
            RESULT=$(curl -sS -X POST \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"type\":\"A\",\"name\":\"*\",\"content\":\"$IP\",\"ttl\":1,\"proxied\":true}")
            echo "결과: $RESULT"
            echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print('SUCCESS' if d.get('success') else 'FAILED: '+str(d.get('errors')))"
          fi
          ENDSSH
          rm -f /tmp/id_gauth
