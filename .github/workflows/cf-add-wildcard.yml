name: CF wildcard DNS add
on:
  push:
    branches: [ claude/auto-test-debugging-local-n0xjkg ]
    paths: [ .github/workflows/cf-add-wildcard.yml ]
  workflow_dispatch:

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ZONE_ID: "7e5faed2d3d4d6da7aceb4ddde81a62b"
      IP: "34.104.233.35"
      CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      CF_TOKEN2: ${{ secrets.CF_API_TOKEN }}
    steps:
      - name: CF 와일드카드 A 레코드 추가
        run: |
          TOKEN="${CF_TOKEN:-${CF_TOKEN2:-}}"

          if [ -z "$TOKEN" ]; then
            echo "ERROR: CLOUDFLARE_TOKEN 및 CF_API_TOKEN 시크릿 못 찾음"
            exit 1
          fi

          echo "사용 토큰: ${TOKEN:0:25}..."

          VERIFY=$(curl -sS "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $TOKEN")
          echo "토큰 검증: $VERIFY"

          EXISTING=$(curl -sS \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=A&name=*" \
            -H "Authorization: Bearer $TOKEN")
          COUNT=$(echo "$EXISTING" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d.get('result_info',{}).get('count',0))" \
            2>/dev/null || echo 0)

          echo "COUNT=$COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "와일드카드 이미 존재:"
            echo "$EXISTING" | python3 -c \
              "import sys,json; [print(r['name'],r['content'],r['proxied']) for r in json.load(sys.stdin).get('result',[])]"
          else
            echo "생성 중..."
            RESULT=$(curl -sS -X POST \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"type\":\"A\",\"name\":\"*\",\"content\":\"$IP\",\"ttl\":1,\"proxied\":true}")
            echo "결과: $RESULT"
            echo "$RESULT" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print('SUCCESS' if d.get('success') else 'FAILED: '+str(d.get('errors')))"
          fi
