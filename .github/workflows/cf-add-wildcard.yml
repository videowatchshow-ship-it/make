name: CF wildcard DNS add
on:
  push:
    branches: [ claude/auto-test-debugging-local-n0xjkg ]
    paths: [ .github/workflows/cf-add-wildcard.yml ]
  workflow_dispatch:

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read CF creds from server + add wildcard A record
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 4m
          script: |
            set -e
            # Read token
            CF_TOKEN=$(sudo grep -oP 'dns_cloudflare_api_token\s*=\s*\K\S+' /root/.secrets/cloudflare.ini 2>/dev/null)
            if [ -z "$CF_TOKEN" ]; then
              echo "ERROR: token not found in /root/.secrets/cloudflare.ini"
              exit 1
            fi
            echo "Token found: ${CF_TOKEN:0:10}..."

            # Also check cent-solution-on-gcp.md for zone ID hint
            echo "=== cent-solution-on-gcp.md cloudflare lines ==="
            sudo grep -i "cloudflare\|zone\|cf_\|token" /opt/claude-mem-sync/proj1/cent-solution-on-gcp.md 2>/dev/null || echo "(not found)"

            # Get zone ID for xn--9d0bw2fjtyymch7de9d.info
            DOMAIN="xn--9d0bw2fjtyymch7de9d.info"
            ZONE_RESP=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=${DOMAIN}&status=active" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json")
            echo "Zone response: $ZONE_RESP"

            ZONE_ID=$(echo "$ZONE_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'] if d.get('result') else '')" 2>/dev/null)
            if [ -z "$ZONE_ID" ]; then
              echo "ERROR: zone ID not found for $DOMAIN"
              exit 1
            fi
            echo "Zone ID: $ZONE_ID"

            # Check existing wildcard record
            EXISTING=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?type=A&name=*.${DOMAIN}" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json")
            echo "Existing record: $EXISTING"

            RECORD_ID=$(echo "$EXISTING" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'] if d.get('result') else '')" 2>/dev/null)

            TARGET_IP="34.104.233.35"
            if [ -n "$RECORD_ID" ]; then
              echo "Updating existing record $RECORD_ID..."
              RESULT=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${RECORD_ID}" \
                -H "Authorization: Bearer ${CF_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"type\":\"A\",\"name\":\"*\",\"content\":\"${TARGET_IP}\",\"ttl\":1,\"proxied\":true}")
            else
              echo "Creating new wildcard A record..."
              RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
                -H "Authorization: Bearer ${CF_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"type\":\"A\",\"name\":\"*\",\"content\":\"${TARGET_IP}\",\"ttl\":1,\"proxied\":true}")
            fi

            echo "Result: $RESULT"
            SUCCESS=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('success',''))" 2>/dev/null)
            if [ "$SUCCESS" = "True" ]; then
              echo "SUCCESS: wildcard *.${DOMAIN} -> ${TARGET_IP} (proxied)"
            else
              echo "FAILED"
              exit 1
            fi
