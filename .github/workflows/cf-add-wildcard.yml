name: CF wildcard DNS add
on:
  push:
    branches: [ claude/auto-test-debugging-local-n0xjkg ]
    paths: [ .github/workflows/cf-add-wildcard.yml ]
  workflow_dispatch:

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add wildcard A record via Cloudflare API
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          echo "=== Check existing wildcard DNS records ==="
          curl -sS "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?type=A&name=*" \
            -H "Authorization: Bearer ${CF_TOKEN}" | python3 -m json.tool

          echo ""
          echo "=== Add wildcard * A record → 34.104.233.35 (proxied) ==="
          RESULT=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"type":"A","name":"*","content":"34.104.233.35","ttl":1,"proxied":true}')
          echo "$RESULT" | python3 -m json.tool

          SUCCESS=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('success',''))")
          echo "success=$SUCCESS"
          if [ "$SUCCESS" != "True" ]; then
            echo "FAILED — check errors above"
            exit 1
          fi
          echo "=== Wildcard DNS added successfully ==="
