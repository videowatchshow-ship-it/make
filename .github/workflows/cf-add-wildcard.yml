name: CF wildcard DNS add
on:
  push:
    branches: [ claude/auto-test-debugging-local-n0xjkg ]
    paths: [ .github/workflows/cf-add-wildcard.yml ]
  workflow_dispatch:

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH로 .env에서 토큰 추출 후 DNS 추가
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          script_stop: false
          timeout: 60s
          command_timeout: 240s
          script: |
            ZONE_ID="7e5faed2d3d4d6da7aceb4ddde81a62b"
            IP="34.104.233.35"
            TOKEN=""

            # gucci PHP는 parse_ini_file(__DIR__ . '/../../.env') 사용
            # __DIR__ = /var/www/sites/gucci/config → ../../.env = /var/www/sites/.env
            echo "=== .env 파일 탐색 ==="
            for f in \
              /var/www/sites/.env \
              /var/www/sites/gucci/.env \
              /var/www/.env \
              /var/www/sites/gucci/config/../../.env; do
              if [ -f "$f" ]; then
                echo "파일 발견: $f"
                cat "$f"
                T=$(grep -oP 'CLOUDFLARE_API_TOKEN\s*=\s*\K\S+' "$f" 2>/dev/null | head -1)
                [ -z "$T" ] && T=$(grep -oP 'cfut_[A-Za-z0-9]{40,}' "$f" 2>/dev/null | head -1)
                if [ -n "$T" ] && [ -z "$TOKEN" ]; then
                  TOKEN="$T"
                  echo "TOKEN found in $f"
                fi
              fi
            done

            # .env 파일 목록 출력
            echo "=== find .env 파일 목록 ==="
            find /var/www/ -maxdepth 5 -name ".env" -type f 2>/dev/null
            find /var/www/ -maxdepth 5 -name "*.env" -type f 2>/dev/null

            # 발견된 모든 .env 읽기
            if [ -z "$TOKEN" ]; then
              for f in $(find /var/www/ -maxdepth 5 -name ".env" -type f 2>/dev/null); do
                echo "=== $f ==="
                cat "$f"
                T=$(grep -oP 'CLOUDFLARE_API_TOKEN\s*=\s*\K\S+' "$f" 2>/dev/null | head -1)
                [ -z "$T" ] && T=$(grep -oP 'cfut_[A-Za-z0-9]{40,}' "$f" 2>/dev/null | head -1)
                if [ -n "$T" ] && [ -z "$TOKEN" ]; then
                  TOKEN="$T"
                  echo "TOKEN found in $f"
                fi
              done
            fi

            if [ -z "$TOKEN" ]; then
              echo "ERROR: .env에서 CF 토큰 못 찾음"
              exit 1
            fi

            echo "사용 토큰: ${TOKEN:0:25}..."

            # 토큰 권한 확인
            VERIFY=$(curl -sS "https://api.cloudflare.com/client/v4/user/tokens/verify" \
              -H "Authorization: Bearer $TOKEN")
            echo "토큰 상태: $(echo $VERIFY | head -c 400)"

            # 기존 와일드카드 확인
            EXISTING=$(curl -sS "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=A&name=*" \
              -H "Authorization: Bearer $TOKEN")
            COUNT=$(echo "$EXISTING" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('result_info',{}).get('count',0))" 2>/dev/null || echo 0)

            if [ "$COUNT" -gt 0 ]; then
              echo "와일드카드 이미 존재"
              echo "$EXISTING" | python3 -c "import sys,json; [print(r['name'],r['content'],r['proxied']) for r in json.load(sys.stdin).get('result',[])]"
            else
              echo "생성 중..."
              RESULT=$(curl -sS -X POST \
                "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                --data "{\"type\":\"A\",\"name\":\"*\",\"content\":\"$IP\",\"ttl\":1,\"proxied\":true}")
              echo "결과: $RESULT"
              echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print('SUCCESS' if d.get('success') else 'FAILED: '+str(d.get('errors')))"
            fi
