name: CF wildcard DNS add
on:
  push:
    branches: [ claude/auto-test-debugging-local-n0xjkg ]
    paths: [ .github/workflows/cf-add-wildcard.yml ]
  workflow_dispatch:

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Search chamgyo server for CF token then add wildcard DNS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 4m
          script: |
            ZONE_ID="7e5faed2d3d4d6da7aceb4ddde81a62b"

            echo "=== GCP Secret Manager ==="
            PROJECT=$(curl -sf -H "Metadata-Flavor: Google" \
              "http://metadata.google.internal/computeMetadata/v1/project/project-id" 2>/dev/null || echo "")
            echo "project=$PROJECT"
            if [ -n "$PROJECT" ]; then
              gcloud secrets list --project="$PROJECT" --format="value(name)" 2>/dev/null | while read s; do
                echo "secret: $s"
                V=$(gcloud secrets versions access latest --secret="$s" --project="$PROJECT" 2>/dev/null | head -c 200)
                echo "$V" | grep -iP 'cfut_|cloudflare|CF_TOKEN' && echo "  ^^ MATCH in $s" || true
              done
            fi

            echo ""
            echo "=== chamgyo site .env / config ==="
            sudo find /var/www/sites/chamgyo -name '*.env' -o -name '.env' -o -name '*.ini' -o -name '*.json' -o -name '*.conf' 2>/dev/null | while read f; do
              sudo grep -liP 'cfut_|cloudflare|CF_TOKEN' "$f" 2>/dev/null && sudo grep -hoP 'cfut_[A-Za-z0-9_-]{20,}' "$f" 2>/dev/null
            done

            echo ""
            echo "=== All cfut_ in /var/www/ and /opt/ (excl node_modules) ==="
            sudo grep -rhoP 'cfut_[A-Za-z0-9_-]{20,}' /var/www/ /opt/ \
              --include='*.env' --include='*.ini' --include='*.json' \
              --include='*.md' --include='*.txt' --include='*.conf' \
              --include='*.sh' --include='*.py' 2>/dev/null | sort -u

            echo ""
            echo "=== /root/ cfut_ (all files) ==="
            sudo grep -rhoP 'cfut_[A-Za-z0-9_-]{20,}' /root/ 2>/dev/null | sort -u

            echo ""
            echo "=== Try all found tokens ==="
            ALL_TOKENS=$(sudo grep -rhoP 'cfut_[A-Za-z0-9_-]{20,}' /root/ /var/www/ /opt/ /etc/letsencrypt/ 2>/dev/null | sort -u)
            for T in $ALL_TOKENS; do
              echo "--- ${T:0:20}... ---"
              R=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
                -H "Authorization: Bearer $T" \
                -H "Content-Type: application/json" \
                --data '{"type":"A","name":"*","content":"34.104.233.35","ttl":1,"proxied":true}')
              echo "$R" | python3 -c "import sys,json; d=json.load(sys.stdin); print('success:', d.get('success'), d.get('errors',[]))"
            done

            echo "=== DONE ==="
