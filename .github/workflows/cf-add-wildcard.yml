name: CF wildcard DNS add
on:
  push:
    branches: [ claude/auto-test-debugging-local-n0xjkg ]
    paths: [ .github/workflows/cf-add-wildcard.yml ]
  workflow_dispatch:

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find DNS-capable CF token + add wildcard A record
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 4m
          script: |
            set -e

            # Read the cloudflare-api-token.md file (Obsidian note with second token)
            echo "=== cloudflare-api-token.md ==="
            sudo cat /opt/claude-mem-sync/proj1/cloudflare-api-token.md 2>/dev/null || echo "(not found)"

            # Extract all cfut_ tokens from that file
            echo "=== All cfut_ tokens found ==="
            sudo grep -oP 'cfut_[A-Za-z0-9_-]{20,}' /opt/claude-mem-sync/proj1/cloudflare-api-token.md 2>/dev/null || echo "none in cloudflare-api-token.md"

            # Also check all proj1 files
            echo "=== All proj1 files with cfut_ ==="
            sudo grep -rlP 'cfut_[A-Za-z0-9_-]{20,}' /opt/claude-mem-sync/proj1/ 2>/dev/null | while read f; do
              echo "FILE: $f"
              sudo grep -oP 'cfut_[A-Za-z0-9_-]{20,}' "$f"
            done

            # Zone ID already known from previous run
            ZONE_ID="7e5faed2d3d4d6da7aceb4ddde81a62b"
            DOMAIN="xn--9d0bw2fjtyymch7de9d.info"
            TARGET_IP="34.104.233.35"

            # Try each token found
            ALL_TOKENS=$(sudo grep -rhoP 'cfut_[A-Za-z0-9_-]{20,}' /opt/claude-mem-sync/proj1/ /root/.secrets/ 2>/dev/null | sort -u)
            echo "=== Trying tokens ==="
            for TOK in $ALL_TOKENS; do
              echo "Trying: ${TOK:0:12}..."
              CHECK=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?type=A&name=*.${DOMAIN}" \
                -H "Authorization: Bearer ${TOK}" \
                -H "Content-Type: application/json")
              OK=$(echo "$CHECK" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('success',''))" 2>/dev/null)
              if [ "$OK" = "True" ]; then
                echo "Token works for DNS read!"
                RECORD_ID=$(echo "$CHECK" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'] if d.get('result') else '')" 2>/dev/null)
                if [ -n "$RECORD_ID" ]; then
                  RESULT=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${RECORD_ID}" \
                    -H "Authorization: Bearer ${TOK}" \
                    -H "Content-Type: application/json" \
                    -d "{\"type\":\"A\",\"name\":\"*\",\"content\":\"${TARGET_IP}\",\"ttl\":1,\"proxied\":true}")
                else
                  RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
                    -H "Authorization: Bearer ${TOK}" \
                    -H "Content-Type: application/json" \
                    -d "{\"type\":\"A\",\"name\":\"*\",\"content\":\"${TARGET_IP}\",\"ttl\":1,\"proxied\":true}")
                fi
                echo "Result: $RESULT"
                SUCCESS=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('success',''))" 2>/dev/null)
                if [ "$SUCCESS" = "True" ]; then
                  echo "SUCCESS: wildcard *.${DOMAIN} -> ${TARGET_IP} (proxied)"
                  exit 0
                fi
              else
                echo "  -> no DNS access"
              fi
            done
            echo "ERROR: no working token found"
            exit 1
