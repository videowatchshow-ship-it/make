name: CF wildcard DNS add
on:
  push:
    branches: [ claude/auto-test-debugging-local-n0xjkg ]
    paths: [ .github/workflows/cf-add-wildcard.yml ]
  workflow_dispatch:

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH로 서버 파일 읽고 토큰 추출 후 DNS 추가
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          script_stop: false
          timeout: 120s
          command_timeout: 180s
          script: |
            ZONE_ID="7e5faed2d3d4d6da7aceb4ddde81a62b"
            IP="34.104.233.35"

            TOKEN=""

            # 1) gucci CF config 파일에서 토큰 추출
            for f in \
              /var/www/sites/gucci/config/cloudflare-config.php \
              /var/www/sites/gucci/config/cloudflare-waf-config.php \
              /var/www/sites/gucci/config/cloudflare.php \
              /root/.secrets/cloudflare.ini; do
              if [ -f "$f" ]; then
                echo "=== $f ==="
                cat "$f" | head -60
                T=$(grep -oP 'cfut_[A-Za-z0-9]{40,}' "$f" 2>/dev/null | head -1)
                if [ -n "$T" ] && [ -z "$TOKEN" ]; then
                  TOKEN="$T"
                  echo "TOKEN found: ${TOKEN:0:20}..."
                fi
              fi
            done

            # 2) 전체 /var/www 탐색
            if [ -z "$TOKEN" ]; then
              echo "--- /var/www 전체 탐색 ---"
              ALL=$(grep -rhoP 'cfut_[A-Za-z0-9]{40,}' /var/www/ 2>/dev/null | sort -u)
              echo "$ALL" | head -10
              TOKEN=$(echo "$ALL" | head -1)
            fi

            # 3) /opt 탐색
            if [ -z "$TOKEN" ]; then
              echo "--- /opt 탐색 ---"
              ALL=$(grep -rhoP 'cfut_[A-Za-z0-9]{40,}' /opt/ 2>/dev/null | sort -u)
              echo "$ALL" | head -10
              TOKEN=$(echo "$ALL" | head -1)
            fi

            if [ -z "$TOKEN" ]; then
              echo "ERROR: 서버 전체에서 CF 토큰 못 찾음"
              exit 1
            fi

            echo "사용 토큰: ${TOKEN:0:25}..."

            # 4) 토큰 권한 확인
            VERIFY=$(curl -sS "https://api.cloudflare.com/client/v4/user/tokens/verify" \
              -H "Authorization: Bearer $TOKEN")
            echo "토큰 상태: $(echo $VERIFY | head -c 300)"

            # 5) 기존 와일드카드 확인
            EXISTING=$(curl -sS "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=A&name=*" \
              -H "Authorization: Bearer $TOKEN")
            echo "기존: $(echo $EXISTING | head -c 400)"

            COUNT=$(echo "$EXISTING" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('result_info',{}).get('count',0))" 2>/dev/null || echo 0)

            if [ "$COUNT" -gt 0 ]; then
              echo "이미 존재"
              echo "$EXISTING" | python3 -c "import sys,json; [print(r['name'],r['content'],r['proxied']) for r in json.load(sys.stdin).get('result',[])]"
            else
              echo "생성 중..."
              RESULT=$(curl -sS -X POST \
                "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                --data "{\"type\":\"A\",\"name\":\"*\",\"content\":\"$IP\",\"ttl\":1,\"proxied\":true}")
              echo "결과: $RESULT"
              echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print('SUCCESS' if d.get('success') else 'FAILED: '+str(d.get('errors')))"
            fi
