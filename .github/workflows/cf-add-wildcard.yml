name: CF wildcard DNS add
on:
  push:
    branches: [ claude/auto-test-debugging-local-n0xjkg ]
    paths: [ .github/workflows/cf-add-wildcard.yml ]
  workflow_dispatch:

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find CF token on server then add wildcard DNS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 4m
          script: |
            ZONE_ID="7e5faed2d3d4d6da7aceb4ddde81a62b"

            echo "=== /root/ cfut_ tokens (maxdepth 4) ==="
            TOKEN=$(sudo grep -rhoP 'cfut_[A-Za-z0-9_-]{20,}' /root/ --include='*.md' --include='*.txt' --include='*.ini' --include='*.json' --include='*.conf' --include='*.env' 2>/dev/null | sort -u | head -5)
            echo "found tokens: $TOKEN"

            echo ""
            echo "=== /root/ all files with cfut_ ==="
            sudo grep -rloP 'cfut_[A-Za-z0-9_-]{20,}' /root/ 2>/dev/null | head -10

            echo ""
            echo "=== /opt/ cfut_ tokens (excl node_modules, maxdepth 4) ==="
            sudo grep -rhoP 'cfut_[A-Za-z0-9_-]{20,}' /opt/ --include='*.md' --include='*.txt' --include='*.ini' --include='*.env' --include='*.json' 2>/dev/null | sort -u | head -5

            echo ""
            echo "=== Try existing token from cloudflare.ini ==="
            EXISTING=$(sudo grep -hoP 'cfut_[A-Za-z0-9_-]{20,}' /root/.secrets/cloudflare.ini 2>/dev/null)
            echo "existing token: $EXISTING"
            if [ -n "$EXISTING" ]; then
              echo "--- Verify token permissions ---"
              curl -sS "https://api.cloudflare.com/client/v4/user/tokens/verify" \
                -H "Authorization: Bearer $EXISTING" | python3 -c "import sys,json; d=json.load(sys.stdin); print('status:', d.get('result',{}).get('status',''), 'errors:', d.get('errors',[]))"
              echo "--- Try DNS add with existing token ---"
              R=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
                -H "Authorization: Bearer $EXISTING" \
                -H "Content-Type: application/json" \
                --data '{"type":"A","name":"*","content":"34.104.233.35","ttl":1,"proxied":true}')
              echo "$R" | python3 -c "import sys,json; d=json.load(sys.stdin); print('success:', d.get('success'), 'errors:', d.get('errors',[]))"
            fi

            echo "=== DONE ==="
