name: firebase provision webapp

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-fb-webapp.txt']

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Enable firebase, addFirebase, create webApp, read config
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 300s
          script: |
            PROJECT=quantum-bonus-455522-b4
            echo '=== 1. enable firebase management APIs ==='
            gcloud services enable firebase.googleapis.com identitytoolkit.googleapis.com --project=$PROJECT 2>&1 | tail -3 || true
            sleep 10
            TOKEN=$(gcloud auth print-access-token 2>/dev/null)
            H="-H \"Authorization: Bearer $TOKEN\" -H \"X-Goog-User-Project: $PROJECT\""

            echo ''
            echo '=== 2. addFirebase to project (idempotent) ==='
            curl -s -X POST "https://firebase.googleapis.com/v1beta1/projects/$PROJECT:addFirebase" -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $PROJECT" -H 'Content-Type: application/json' -d '{}' | head -c 400
            echo ''
            sleep 8

            echo ''
            echo '=== 3. list existing web apps ==='
            APPS=$(curl -s "https://firebase.googleapis.com/v1beta1/projects/$PROJECT/webApps" -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $PROJECT")
            echo "$APPS" | head -c 500
            echo ''
            APPID=$(echo "$APPS" | python3 -c "import sys,json; d=json.load(sys.stdin); apps=d.get('apps',[]); print(apps[0]['appId'] if apps else '')" 2>/dev/null)

            if [ -z "$APPID" ]; then
              echo '=== 3b. create web app ==='
              OP=$(curl -s -X POST "https://firebase.googleapis.com/v1beta1/projects/$PROJECT/webApps" -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $PROJECT" -H 'Content-Type: application/json' -d '{"displayName":"gauth-web"}')
              echo "$OP" | head -c 400
              echo ''
              sleep 12
              APPS=$(curl -s "https://firebase.googleapis.com/v1beta1/projects/$PROJECT/webApps" -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $PROJECT")
              APPID=$(echo "$APPS" | python3 -c "import sys,json; d=json.load(sys.stdin); apps=d.get('apps',[]); print(apps[0]['appId'] if apps else '')" 2>/dev/null)
            fi
            echo "appId: $APPID"

            echo ''
            echo '=== 4. web app config (apiKey, authDomain) ==='
            if [ -n "$APPID" ]; then
              curl -s "https://firebase.googleapis.com/v1beta1/projects/$PROJECT/webApps/$APPID/config" -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $PROJECT" | head -c 800
              echo ''
            fi

            echo ''
            echo '=== 5. re-list oauth-ish clients: check identitytoolkit config for any managed google client ==='
            curl -s "https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT/defaultSupportedIdpConfigs/google.com" -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $PROJECT" | head -c 400
            echo ''
            echo 'done'
