name: HAE - patch v7 CRLF-aware renderCards + refreshAllCodes
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hae-patch-backup-v7.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Patch with CRLF-aware string replacement
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 4m
          script: |
            sudo node << 'JSEOF'
            const fs = require('fs');
            const p = '/var/www/sites/hae/public/index.html';
            let html = fs.readFileSync(p, 'utf8');
            const before = html.length;
            let changes = 0;
            const CRLF = '\r\n';

            // Patch 2: renderCards — replace old line + next _em line
            const p2old = "var secret = a.twofa_secret || a.totp_secret; var backupCodes = a.backup_codes || ''" + CRLF + "    var _em = _esc(a.email)";
            const p2new = "var secret = a.twofa_secret || a.totp_secret" + CRLF + "    if(!secret && a.backup_codes) { var _bc2 = a.backup_codes.toUpperCase().replace(/[\\s\\-_=]/g,'').replace(/[^A-Z2-7]/g,''); if(_bc2.length>=16) secret=_bc2; }" + CRLF + "    var _em = _esc(a.email)";
            if (html.includes(p2old)) {
              html = html.replace(p2old, p2new);
              changes++;
              console.log('Patch 2: renderCards updated');
            } else {
              console.log('Patch 2 NOT matched');
              const idx = html.indexOf('var _em = _esc(a.email)');
              if (idx >= 0) console.log('P2 ctx:', JSON.stringify(html.substring(idx-80, idx+30)));
            }

            // Patch 3: refreshAllCodes — replace old line + next if(!secret) continue
            const p3old = "var secret = a.twofa_secret || a.totp_secret; var backupCodes = a.backup_codes || ''" + CRLF + "    if(!secret) continue";
            const p3new = "var secret = a.twofa_secret || a.totp_secret" + CRLF + "    if(!secret && a.backup_codes) { var _bcr = a.backup_codes.toUpperCase().replace(/[\\s\\-_=]/g,'').replace(/[^A-Z2-7]/g,''); if(_bcr.length>=16) secret=_bcr; }" + CRLF + "    if(!secret) continue";
            if (html.includes(p3old)) {
              html = html.replace(p3old, p3new);
              changes++;
              console.log('Patch 3: refreshAllCodes updated');
            } else {
              console.log('Patch 3 NOT matched');
              const idx2 = html.indexOf('if(!secret) continue');
              if (idx2 >= 0) console.log('P3 ctx:', JSON.stringify(html.substring(idx2-80, idx2+30)));
            }

            console.log('Total changes:', changes, '| size:', before, '->', html.length);
            if (changes > 0) {
              fs.writeFileSync(p, html);
              console.log('written');
            }
            JSEOF

            echo "=== verify backup_codes lines ==="
            sudo grep -n "backup_codes\|_bc\|backupCodes" /var/www/sites/hae/public/index.html | head -20

            sudo chown www-data:www-data /var/www/sites/hae/public/index.html
            for svc in hae site-hae; do
              sudo systemctl restart "$svc" 2>/dev/null && echo "restarted: $svc" && break
            done
            echo "DONE"
