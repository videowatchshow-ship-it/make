name: Rename naman → cha (차대리)
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths:
      - '.github/workflows/rename-naman-to-cha.yml'
      - '.github/scripts/rename-naman-to-cha.sh'

jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Cloudflare DNS create cha CNAME (BEFORE certbot)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          [ -z "$CF_TOKEN" ] && exit 0
          ZONE=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=cent-solution.online&status=active" \
            -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
            | grep -oP '"id"\s*:\s*"\K[a-f0-9]{32}' | head -1)
          [ -z "$ZONE" ] && exit 0
          EXISTS=$(curl -s "https://api.cloudflare.com/client/v4/zones/${ZONE}/dns_records?name=cha.cent-solution.online" \
            -H "Authorization: Bearer ${CF_TOKEN}" | grep -oP '"id"\s*:\s*"\K[a-f0-9]{32}' | head -1)
          if [ -n "$EXISTS" ]; then echo "cha DNS exists"; exit 0; fi
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE}/dns_records" \
            -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
            --data "{\"type\":\"CNAME\",\"name\":\"cha\",\"content\":\"cent-solution.online\",\"ttl\":1,\"proxied\":true}" \
            -o /dev/null -w "cha DNS create %{http_code}\n"
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          source: ".github/scripts/rename-naman-to-cha.sh"
          target: "/tmp/renamecha/"
          strip_components: 2
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 360s
          script: |
            sudo bash /tmp/renamecha/rename-naman-to-cha.sh
            rm -rf /tmp/renamecha
      - name: Cloudflare DNS delete naman + purge
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          [ -z "$CF_TOKEN" ] && exit 0
          ZONE=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=cent-solution.online&status=active" \
            -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
            | grep -oP '"id"\s*:\s*"\K[a-f0-9]{32}' | head -1)
          REC=$(curl -s "https://api.cloudflare.com/client/v4/zones/${ZONE}/dns_records?name=naman.cent-solution.online" \
            -H "Authorization: Bearer ${CF_TOKEN}" | grep -oP '"id"\s*:\s*"\K[a-f0-9]{32}' | head -1)
          if [ -n "$REC" ]; then
            curl -sS -X DELETE "https://api.cloudflare.com/client/v4/zones/${ZONE}/dns_records/${REC}" \
              -H "Authorization: Bearer ${CF_TOKEN}" -o /dev/null -w "delete naman DNS %{http_code}\n"
          fi
          curl -sS -o /dev/null -w "purge %{http_code}\n" -X POST \
            "https://api.cloudflare.com/client/v4/zones/${ZONE}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
