name: integration test suite

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-integration-test.txt']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Find token + 5 real logins
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 600s
          script: |
            B=http://localhost:4000
            echo '=== find how auth is checked (unauthorized) ==='
            sudo grep -nE "unauthorized|API_TOKEN|ADMIN_TOKEN|req.query.token|checkAuth|requireAuth|Bearer|x-api-token" /opt/gauth-full/rebrowser-login.js | head -20
            echo ''
            echo '=== token value from .env ==='
            TOK=$(sudo grep -oE '(API_TOKEN|ADMIN_TOKEN|AUTH_TOKEN|TOKEN)=[A-Za-z0-9_-]+' /opt/gauth-full/.env 2>/dev/null | head -1 | cut -d= -f2)
            echo "token length: ${#TOK}"
            echo ''
            echo '=== 5 REAL LOGINS with token (query + header) ==='
            for em in lethivan2023ht@gmail.com ngodangkhoa3985@gmail.com sikendarsikendar650@gmail.com mail.akashkumar.ak4211@gmail.com chhinsothearith31@gmail.com; do
              echo "--- $em ---"
              R=$(curl -s --max-time 120 -X POST "$B/api/login-one?token=$TOK" -H 'Content-Type: application/json' -H "x-api-token: $TOK" -H "Authorization: Bearer $TOK" -d "{\"email\":\"$em\"}")
              echo "$R" | head -c 500; echo ''
            done
            echo 'done'
