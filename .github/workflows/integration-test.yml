name: integration test suite

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-integration-test.txt']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Run endpoint + page + channel + 5 real login tests
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 600s
          script: |
            B=http://localhost:4000
            PASS=0; FAIL=0
            t(){ local name="$1"; local code="$2"; local want="$3"; if [ "$code" = "$want" ]; then PASS=$((PASS+1)); echo "PASS  $name ($code)"; else FAIL=$((FAIL+1)); echo "FAIL  $name (got $code want $want)"; fi; }

            echo '===== A. PUBLIC PAGES (HTTPS) ====='
            for pair in "gauth main|https://gauth.cent-solution.online/" "subsites|https://gauth.cent-solution.online/subsites.html" "jump|https://jump.cent-solution.online/" "cham|https://cham.cent-solution.online/"; do
              nm=${pair%%|*}; url=${pair#*|}; c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 12 "$url"); t "page:$nm" "$c" 200; done

            echo ''
            echo '===== B. API ENDPOINTS (localhost) ====='
            for pair in "subsite-accounts|/api/subsite-accounts" "subsite-counts|/api/subsite-counts" "auth-config|/api/auth/config" "auth-me|/api/auth/me" "account-status|/api/account-status"; do
              nm=${pair%%|*}; p=${pair#*|}; c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 12 "$B$p"); t "api:$nm" "$c" 200; done

            echo ''
            echo '===== C. CHANNEL-STATUS on 5 real DB channels ====='
            for u in 'https://www.youtube.com/@blackorwhite4371' 'https://www.youtube.com/channel/UCap3AC4d894Z14uLSY7gfvA' 'https://www.youtube.com/channel/UCDS2gSCzoUo1LpiXzOxgW5g' 'https://www.youtube.com/channel/UCtjLUPIBl3x2OIKnH_zM_kA' 'https://www.youtube.com/@the_tema_off4187'; do
              R=$(curl -s --max-time 25 "$B/api/youtube/channel-status?url=$u"); OK=$(echo "$R" | grep -o '"ok":true' | head -1); if [ -n "$OK" ]; then PASS=$((PASS+1)); echo "PASS  channel: $(echo $R | head -c 120)"; else FAIL=$((FAIL+1)); echo "FAIL  channel $u: $(echo $R|head -c 120)"; fi; done

            echo ''
            echo '===== D. login-one contract (grep) ====='
            sudo sed -n '855,880p' /opt/gauth-full/rebrowser-login.js

            echo ''
            echo '===== E. 5 REAL ACCOUNT LOGINS via /api/login-one ====='
            for em in lethivan2023ht@gmail.com ngodangkhoa3985@gmail.com sikendarsikendar650@gmail.com mail.akashkumar.ak4211@gmail.com chhinsothearith31@gmail.com; do
              echo "--- login: $em ---"
              R=$(curl -s --max-time 110 -X POST "$B/api/login-one" -H 'Content-Type: application/json' -d "{\"email\":\"$em\"}")
              echo "$R" | head -c 400; echo ''
              echo "$R" | grep -qE '"success":true|"ok":true|logged' && { PASS=$((PASS+1)); echo "PASS login $em"; } || { FAIL=$((FAIL+1)); echo "FAIL login $em"; }
            done

            echo ''
            echo "===== RESULT: PASS=$PASS FAIL=$FAIL ====="
