name: integration test suite

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-integration-test.txt']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Inspect auth code on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== 1. Auth routes in rebrowser-login.js ==="
            sudo grep -n 'auth\|currentUser\|loggedIn\|session\|cookie\|id_token\|google.auth\|verifyIdToken\|credential' /opt/gauth-full/rebrowser-login.js | head -60

            echo ""
            echo "=== 2. Full auth section (around auth/me) ==="
            sudo grep -n -B5 -A10 'auth/me\|auth/logout\|auth/config\|auth/login' /opt/gauth-full/rebrowser-login.js

            echo ""
            echo "=== 3. How currentUser is stored ==="
            sudo grep -n 'let current\|var current\|const current\|let logged\|let user\b\|Map(\|new Map\|sessions\[' /opt/gauth-full/rebrowser-login.js | head -20

            echo ""
            echo "=== 4. Google auth library usage ==="
            sudo grep -rn 'google-auth-library\|OAuth2Client\|verifyIdToken' /opt/gauth-full/*.js 2>/dev/null | head -20

            echo ""
            echo "=== 5. index.html auth section ==="
            sudo grep -n 'currentUser\|loggedInUser\|auth/me\|auth/logout\|handleCredentialResponse\|google.accounts.id' /var/www/sites/gauth/public/index.html | head -30

            echo ""
            echo "=== 6. Cookie/session middleware ==="
            sudo grep -n 'cookie\|express-session\|cookieParser\|req.session' /opt/gauth-full/rebrowser-login.js | head -20
