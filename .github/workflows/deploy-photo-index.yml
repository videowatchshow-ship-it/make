name: deploy-photo-index
on:
  push:
    paths:
      - '.github/workflows/deploy-photo-index.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_IP: "187.53.133.145"
      VPS_PASS_B64: "LWFhMGNLMDtibzJRNkxnMg=="
      CF_ZONE: "7e5faed2d3d4d6da7aceb4ddde81a62b"
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Deploy select.html as /photo/index.html
        run: |
          export SSHPASS=$(echo "$VPS_PASS_B64" | base64 -d)
          SSH="sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@$VPS_IP"
          BASE="/var/www/sites/chamgyo/public"

          echo "== Current /photo/index.html =="
          $SSH "cat $BASE/photo/index.html 2>/dev/null || echo 'NOT FOUND'"

          echo "== Current / index.html head =="
          $SSH "head -5 $BASE/index.html 2>/dev/null || echo 'NOT FOUND'"

          echo "== Deploy select.html as /photo/index.html =="
          $SSH "cp -f $BASE/index.html $BASE/photo/index.html && chown www-data:www-data $BASE/photo/index.html && chmod 755 $BASE/photo/index.html"

          echo "== Verify both =="
          $SSH "sha256sum $BASE/index.html $BASE/photo/index.html"
          $SSH "wc -c $BASE/index.html $BASE/photo/index.html"
          $SSH "head -6 $BASE/photo/index.html"

      - name: Purge CF cache
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' | jq .

      - name: Verify live
        run: |
          sleep 5
          DOMAIN="xn--9d0bw2fjtyymch7de9d.info"
          echo "== Root =="
          curl -sS -o /tmp/r1.html -w "HTTP %{http_code} | size %{size_download}\n" "https://$DOMAIN/"
          head -6 /tmp/r1.html
          echo ""
          echo "== /photo/ =="
          curl -sS -o /tmp/r2.html -w "HTTP %{http_code} | size %{size_download}\n" "https://$DOMAIN/photo/"
          head -6 /tmp/r2.html
          echo ""
          echo "== /photo/login.html =="
          curl -sS -o /tmp/r3.html -w "HTTP %{http_code} | size %{size_download}\n" "https://$DOMAIN/photo/login.html"
          head -3 /tmp/r3.html
          echo ""
          SHA1=$(sha256sum /tmp/r1.html | cut -d' ' -f1)
          SHA2=$(sha256sum /tmp/r2.html | cut -d' ' -f1)
          echo "SHA256 Root:  $SHA1"
          echo "SHA256 Photo: $SHA2"
          if [ "$SHA1" = "$SHA2" ]; then echo "MATCH OK - both pages identical"; else echo "MISMATCH"; fi
