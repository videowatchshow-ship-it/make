name: 계정 선택 방이 CAH/CAW/SNW 3뷰 모두 동일하게 뜨는지 실측

on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-verify-selection.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 240s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='bash -s' << "REMOTE"
            set +u
            P1="/var/www/sites/chamgyo/public/photo"

            HOST="https://xn--9d0bw2fjtyymch7de9d.info"
            # 로컬 apache 로 직접 요청 (외부 DNS/CF 우회, Host 헤더 지정)
            LOCAL="http://localhost"
            HOSTHDR="Host: xn--9d0bw2fjtyymch7de9d.info"

            echo "===== [1] 각 계정의 sel_<계정>.json 파일 실체 room_id ====="
            for U in aass0707 abc01 abc02 abc03 abc04 abc05 abc06 abc07 cent gain jay otuki tak; do
              F="$P1/data/sel_$U.json"
              [ -f "$F" ] && printf "  %-10s | %s\n" "$U" "$(sudo cat "$F")" || printf "  %-10s | MISSING\n" "$U"
            done

            echo ""
            echo "===== [2] api_selected_room.php?ch=<계정> 실제 응답 ====="
            for U in aass0707 abc01 cent gain jay otuki tak; do
              R=$(curl -sS -H "$HOSTHDR" "$LOCAL/photo/api_selected_room.php?ch=$U")
              printf "  %-10s | %s\n" "$U" "$R"
            done

            echo ""
            echo "===== [3] 3개 뷰(HTML) 각각 실제 GET 응답 코드 + 크기 (계정 cent 기준) ====="
            for VIEW in CAH_1 CAW_1 SNW_1; do
              CODE=$(curl -sS -o /tmp/v.html -w "%{http_code} %{size_download}" -H "$HOSTHDR" "$LOCAL/photo/$VIEW.html?ch=cent")
              echo "  $VIEW.html?ch=cent → HTTP $CODE"
            done

            echo ""
            echo "===== [4] 3개 뷰 HTML 안에 room_id 하드코딩 여부 ====="
            for VIEW in CAH_1 CAW_1 SNW_1; do
              echo "--- $VIEW.html ---"
              sudo grep -n "sel_\|selected_room\|api_selected\|room_id\|__ch\|ch=" "$P1/$VIEW.html" 2>/dev/null | head -8
            done

            echo ""
            echo "===== [5] 3개 뷰가 api_selected_room 을 호출하는지 스크립트 확인 ====="
            for VIEW in CAH_1 CAW_1 SNW_1; do
              CNT=$(sudo grep -c "api_selected_room" "$P1/$VIEW.html" 2>/dev/null)
              printf "  %-12s | api_selected_room 참조 %s회\n" "$VIEW" "$CNT"
            done

            echo ""
            echo "===== [6] 강제 테스트: cent 를 room 999 로 임시 변경 후 3뷰 확인 ====="
            ORIG=$(sudo cat "$P1/data/sel_cent.json")
            echo "  원래: $ORIG"
            sudo tee "$P1/data/sel_cent.json" > /dev/null << "SEL"
            {"room_id":999,"board":"CAH_1"}
            SEL
            sudo chown www-data:www-data "$P1/data/sel_cent.json"
            sleep 1
            echo "  임시 변경 후 api 응답:"
            R=$(curl -sS -H "$HOSTHDR" "$LOCAL/photo/api_selected_room.php?ch=cent")
            echo "    $R"
            if echo "$R" | grep -q "999"; then
              echo "  ✅ PASS: api 가 sel_cent.json 즉시 반영"
            else
              echo "  ❌ FAIL: api 가 999 반환 안함"
            fi

            echo "  원상복구:"
            echo "$ORIG" | sudo tee "$P1/data/sel_cent.json" > /dev/null
            sudo chown www-data:www-data "$P1/data/sel_cent.json"
            echo "    복구후: $(sudo cat "$P1/data/sel_cent.json")"

            echo ""
            echo "===== [7] 결론 매트릭스: 계정별 sel_.json room vs api 응답 vs 3뷰 ====="
            printf "  %-10s | %-8s | %-40s | %s\n" "계정" "sel파일" "api응답" "3뷰 HTTP"
            for U in cent tak gain aass0707 abc01; do
              SEL=$(sudo cat "$P1/data/sel_$U.json" 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get(\"room_id\"))" 2>/dev/null)
              API=$(curl -sS -H "$HOSTHDR" "$LOCAL/photo/api_selected_room.php?ch=$U" 2>/dev/null)
              CH=$(curl -sS -o /dev/null -w "%{http_code}" -H "$HOSTHDR" "$LOCAL/photo/CAH_1.html?ch=$U" 2>/dev/null)
              CW=$(curl -sS -o /dev/null -w "%{http_code}" -H "$HOSTHDR" "$LOCAL/photo/CAW_1.html?ch=$U" 2>/dev/null)
              SN=$(curl -sS -o /dev/null -w "%{http_code}" -H "$HOSTHDR" "$LOCAL/photo/SNW_1.html?ch=$U" 2>/dev/null)
              printf "  %-10s | %-8s | %-40s | CAH=%s CAW=%s SNW=%s\n" "$U" "$SEL" "$API" "$CH" "$CW" "$SN"
            done

            echo ""
            echo "===== DONE ====="
            REMOTE
