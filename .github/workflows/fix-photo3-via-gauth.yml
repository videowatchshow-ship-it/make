name: Fix photo3 via gauth SSH hop

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH to gauth then hop to chamgyo
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 120s
          script: |
            echo "===== Connected to gauth ====="
            hostname
            echo ""
            echo "===== Try SSH to chamgyo (34.104.233.35) ====="
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 videowatch_show@34.104.233.35 "echo CHAMGYO_CONNECTED && hostname" 2>&1 || echo "Direct SSH failed"
            echo ""
            echo "===== Try SSH to my-site-1 internal ====="
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 videowatch_show@my-site-1 "echo INTERNAL_CONNECTED && hostname" 2>&1 || echo "Internal SSH failed"
            echo ""
            echo "===== Check if same machine ====="
            P3="/var/www/sites/chamgyo/public/photo3"
            if [ -d "$P3" ]; then
              echo "SAME MACHINE - photo3 dir exists locally!"
              echo "===== Fixing CSS ====="
              CAH="$P3/CAH_1.html"
              if [ -f "$CAH" ]; then
                sudo cp "$CAH" "${CAH}.bak.$(date +%s)"
                sudo sed -i 's/body{height:auto !important/body{height:100vh !important/g' "$CAH"
                sudo sed -i 's/background:transparent !important/background:#000 !important/g' "$CAH"
                sudo sed -i 's/\.full_box{height:auto !important;min-height:0 !important/\.full_box{height:100vh !important;min-height:100vh !important/g' "$CAH"
                echo "CSS PATCHED"
                grep -o 'body{[^}]*}' "$CAH" | head -2
                grep -o '\.full_box{[^}]*}' "$CAH" | head -2
              else
                echo "CAH_1.html not found at $CAH"
                ls -la "$P3/" | head -20
              fi
              echo "===== Fix symlinks ====="
              cd "$P3"
              P2="/var/www/sites/chamgyo/public/photo2"
              P1="/var/www/sites/chamgyo/public/photo"
              for f in bgl.js dragon_fx.js; do
                [ ! -e "$f" ] && [ -e "$P2/$f" ] && sudo ln -sfn "$P2/$f" "$f" && echo "Linked $f" || echo "$f OK"
              done
              [ ! -e images ] && [ -d "$P2/images" ] && sudo ln -sfn "$P2/images" images && echo "Linked images/" || echo "images/ OK"
              [ ! -e data ] && sudo ln -sfn "$P2/data" data && echo "Linked data/" || echo "data/ OK"
              [ ! -e hot-patch.js ] && sudo ln -sfn "$P2/hot-patch.js" hot-patch.js && echo "Linked hot-patch.js" || echo "hot-patch.js OK"
              [ ! -e modules ] && sudo ln -sfn "$P2/modules" modules && echo "Linked modules/" || echo "modules/ OK"
              echo "===== Write .htaccess ====="
              printf 'Options +FollowSymLinks\n<IfModule mod_headers.c>\n  Header set Access-Control-Allow-Origin "*"\n  Header set Access-Control-Allow-Methods "GET, OPTIONS"\n</IfModule>\n<FilesMatch "\\.(json|php)$">\n  <IfModule mod_headers.c>\n    Header set Cache-Control "no-cache, no-store, must-revalidate"\n    Header set Pragma "no-cache"\n    Header set Expires "0"\n  </IfModule>\n</FilesMatch>\n' | sudo tee "$P3/.htaccess" > /dev/null
              echo ".htaccess written"
              echo "===== Reload Apache ====="
              sudo apachectl configtest 2>&1 || true
              sudo systemctl reload apache2 2>&1 || echo "reload failed"
              echo "===== Verify ====="
              for f in bgl.js dragon_fx.js images data modules hot-patch.js CAH_1.html; do
                [ -e "$P3/$f" ] && echo "OK: $f" || echo "MISSING: $f"
              done
              curl -sI "http://localhost/photo3/CAH_1.html?ch=tak" | head -3
              echo "CSS check:"
              grep -o 'body{[^}]*}' "$CAH" | head -1
              grep -o '\.full_box{[^}]*}' "$CAH" | head -1
            else
              echo "Different machine - photo3 not here"
              ls /var/www/ 2>/dev/null || echo "no /var/www"
              echo "===== Try gcloud ====="
              which gcloud 2>/dev/null && echo "gcloud found" || echo "no gcloud"
            fi
            echo "DONE"

      - name: Purge CF cache
        if: always()
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_TOKEN2: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          TOKEN="${CF_TOKEN:-$CF_TOKEN2}"
          if [ -n "$TOKEN" ]; then
            ZONE="${CF_ZONE:-7e5faed2d3d4d6da7aceb4ddde81a62b}"
            curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/purge_cache" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}' || echo "purge failed"
          fi

      - name: Verify endpoints
        if: always()
        run: |
          sleep 3
          BASE="https://xn--9d0bw2fjtyymch7de9d.info"
          curl -s "$BASE/photo3/CAH_1.html?ch=tak&_t=$(date +%s)" -o /tmp/verify.html
          echo "Size: $(wc -c < /tmp/verify.html)"
          echo "CSS body:"
          grep -o 'body{[^}]*}' /tmp/verify.html | head -1
          echo "CSS full_box:"
          grep -o '\.full_box{[^}]*}' /tmp/verify.html | head -1
