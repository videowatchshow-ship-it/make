name: 지금 이 순간 배너 실측 (사용자 원본 반영 여부)
on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-verify-now.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: CF 엣지 실측 (13개 URL)
        run: |
          DOM="xn--9d0bw2fjtyymch7de9d.info"
          EXPECT=67524
          OK=0
          FAIL=0
          echo "=== CF 엣지 실측 (원본 크기 ${EXPECT}B 이면 반영됨) ==="
          for U in "" aass0707 abc01 abc02 abc03 abc04 abc05 abc06 abc07 cent jay otuki tak; do
            if [ -z "$U" ]; then
              URL="https://$DOM/photo/images/Live_height_kakao.gif?t=$(date +%s%N)"
              LBL="공용"
            else
              URL="https://$DOM/photo/images/ch/$U/Live_height_kakao.gif?t=$(date +%s%N)"
              LBL="$U"
            fi
            R=$(curl -sS -I -H "Cache-Control: no-cache" "$URL" 2>&1)
            SZ=$(echo "$R" | grep -i "content-length" | awk '{print $2}' | tr -d '\r')
            CF=$(echo "$R" | grep -i "cf-cache-status" | awk '{print $2}' | tr -d '\r')
            if [ "$SZ" = "$EXPECT" ]; then
              echo "  ✅ $LBL: ${SZ}B cf=${CF}  (사용자 원본 OK)"
              OK=$((OK+1))
            else
              echo "  ❌ $LBL: ${SZ}B cf=${CF}"
              FAIL=$((FAIL+1))
            fi
          done
          echo ""
          echo "=== 결과: OK=$OK / FAIL=$FAIL ==="
