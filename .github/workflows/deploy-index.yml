name: Deploy gauth-public to server
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['gauth-public/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Upload files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          source: "gauth-public/*"
          target: "/tmp/gauth-deploy"
          strip_components: 1

      - name: Install, restart, purge cache
        uses: appleboy/ssh-action@v1.0.3
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 30s
          envs: CF_TOKEN,CF_ZONE
          script: |
            set -e
            SRC="/tmp/gauth-deploy"
            ls -la "$SRC"
            for DST in /var/www/sites/gauth/public /var/www/sites/gauth01/public; do
              if [ -d "$DST" ]; then
                sudo cp "$SRC"/* "$DST"/
                sudo chown -R www-data:www-data "$DST" 2>/dev/null || true
                echo "$DST done"
              fi
            done
            sudo systemctl restart gauth
            sleep 2
            sudo systemctl is-active gauth && echo "OK" || { echo "FAIL"; exit 1; }
            rm -rf "$SRC"

            # Cloudflare cache purge — GitHub secrets 또는 서버 로컬에서 토큰 탐색
            [ -z "$CF_TOKEN" ] && CF_TOKEN=$(grep -oP '(?:CLOUDFLARE_TOKEN|CF_TOKEN)=\K\S+' /etc/systemd/system/gauth.service 2>/dev/null | head -1)
            [ -z "$CF_TOKEN" ] && CF_TOKEN=$(grep -oP '(?:CLOUDFLARE_TOKEN|CF_TOKEN)=\K\S+' /opt/gauth-full/.env 2>/dev/null | head -1)
            [ -z "$CF_ZONE" ] && CF_ZONE=$(grep -oP '(?:CLOUDFLARE_ZONE_ID|CF_ZONE_ID)=\K\S+' /etc/systemd/system/gauth.service 2>/dev/null | head -1)
            [ -z "$CF_ZONE" ] && CF_ZONE=$(grep -oP '(?:CLOUDFLARE_ZONE_ID|CF_ZONE_ID)=\K\S+' /opt/gauth-full/.env 2>/dev/null | head -1)
            if [ -n "$CF_TOKEN" ] && [ -n "$CF_ZONE" ]; then
              curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
                -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
                --data '{"purge_everything":true}' | python3 -c "import json,sys;d=json.load(sys.stdin);print('purge:','ok' if d.get('success') else 'fail')" || true
            else
              echo "CF tokens not found — skip purge"
            fi
