name: Deploy gauth-public to server
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['gauth-public/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/gauth-frontend-backend-fixes-cg2icv

      - name: Upload files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          source: "gauth-public"
          target: "/tmp/gauth-deploy"
          strip_components: 1

      - name: Deploy frontend, replace parser, re-parse, restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 120s
          script: |
            set -e
            SRC="/tmp/gauth-deploy"
            ls -la "$SRC"

            # 1) Copy frontend files
            for DST in /var/www/sites/gauth/public /var/www/sites/gauth01/public; do
              if [ -d "$DST" ]; then
                sudo cp -r "$SRC"/* "$DST"/
                sudo chown -R www-data:www-data "$DST" 2>/dev/null || true
                echo "$DST done"
              fi
            done

            # 2) Replace parser with repo version (all fixes baked in)
            cd /opt/gauth-full
            cp upload_excels.js upload_excels.js.bak.$(date +%s)
            cp accounts_normalized.json accounts_normalized.json.bak.$(date +%s)
            sudo cp "$SRC/upload_excels.js" /opt/gauth-full/upload_excels.js
            echo "Parser replaced, size: $(wc -c < /opt/gauth-full/upload_excels.js)"
            grep -c 'mostlyKorean' /opt/gauth-full/upload_excels.js && echo "Has mostlyKorean: YES" || echo "Has mostlyKorean: NO"
            grep -c 'isGoogleBackupCode' /opt/gauth-full/upload_excels.js && echo "Has isGoogleBackupCode: YES" || echo "Has isGoogleBackupCode: NO"

            # 3) Clean up SCP temp
            rm -rf "$SRC"

            # 4) Restart services
            sudo a2enmod headers 2>/dev/null || true
            sudo systemctl restart gauth
            sudo systemctl reload apache2 2>/dev/null || sudo systemctl reload nginx 2>/dev/null || true

            # 5) Re-parse all Excel files (Node fs/path — nodejs.org/api/fs.html, nodejs.org/api/path.html)
            cat > /tmp/reparse.js << 'ENDOFSCRIPT'
            delete require.cache[require.resolve("/opt/gauth-full/upload_excels")];
            var p = require("/opt/gauth-full/upload_excels");
            var fs = require("fs");
            var path = require("path");
            var dir = "/opt/gauth-full/uploads_debug";
            var files = fs.readdirSync(dir).filter(function(f) { return f.endsWith(".xlsx") || f.endsWith(".xls"); });
            console.log("Parsing", files.length, "files...");
            var all = [];
            for (var i = 0; i < files.length; i++) {
              try {
                var nfcName = files[i].normalize('NFC');
                all = all.concat(p.parseExcelFile(path.join(dir, files[i]), nfcName));
              } catch (e) { console.log("ERR", files[i].substring(0,30), e.message); }
            }
            function dedupScore(a) {
              var s = 0;
              if (a.password && !/[ㄱ-힝]/.test(a.password)) s += 4;
              if (a.password) s += 2;
              if (a.totp_secret) s += 4;
              if (a.backup_codes) s += 2;
              if (a.recovery_email) s += 1;
              return s;
            }
            var map = new Map();
            for (var j = 0; j < all.length; j++) {
              var a = all[j];
              var key = a.email.toLowerCase().trim();
              var existing = map.get(key);
              if (!existing) { map.set(key, a); continue; }
              var scoreA = dedupScore(a), scoreE = dedupScore(existing);
              if (scoreA > scoreE || (scoreA === scoreE && (a.source_mtime || 0) > (existing.source_mtime || 0))) {
                if (!a.backup_codes && existing.backup_codes) a.backup_codes = existing.backup_codes;
                if (!a.totp_secret && existing.totp_secret) a.totp_secret = existing.totp_secret;
                if (!a.password && existing.password) a.password = existing.password;
                map.set(key, a);
              } else {
                if (!existing.backup_codes && a.backup_codes) existing.backup_codes = a.backup_codes;
                if (!existing.totp_secret && a.totp_secret) existing.totp_secret = a.totp_secret;
                if (!existing.password && a.password) existing.password = a.password;
              }
            }
            var deduped = Array.from(map.values());
            // Safety guard: Google backup-code groups (4×[a-z0-9]{4}+) leaked into totp_secret → move to backup_codes
            for (var di = 0; di < deduped.length; di++) {
              var da = deduped[di];
              if (!da.totp_secret) continue;
              var parts = String(da.totp_secret).trim().split(/\s+/);
              var validGroups = 0;
              for (var pi = 0; pi < parts.length; pi++) {
                if (/^[a-z0-9]{4}$/i.test(parts[pi])) validGroups++; else break;
              }
              if (validGroups >= 4) {
                if (!da.backup_codes) da.backup_codes = parts.slice(0, validGroups).join(' ');
                da.totp_secret = '';
              }
            }
            fs.writeFileSync("/opt/gauth-full/accounts_normalized.json", JSON.stringify(deduped, null, 2));
            console.log("Total:", all.length, "Deduped:", deduped.length);
            ENDOFSCRIPT

            cd /opt/gauth-full
            sudo node /tmp/reparse.js 2>&1
            sudo systemctl restart gauth
            sleep 2
            sudo systemctl is-active gauth && echo "gauth OK" || echo "gauth FAIL"
            rm -f /tmp/reparse.js

      - name: Purge Cloudflare cache
        if: always()
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_TOKEN secret not set"
            exit 0
          fi
          if [ -z "$CF_ZONE" ]; then
            echo "Auto-discovering zone ID..."
            CF_ZONE=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=cent-solution.online&status=active" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json" | grep -oP '"id"\s*:\s*"\K[a-f0-9]{32}' | head -1)
            if [ -z "$CF_ZONE" ]; then
              echo "::warning::Could not auto-discover zone ID"
              exit 0
            fi
            echo "Auto-discovered zone: ${CF_ZONE}"
          fi
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "purge HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then echo "purge: ok"; else echo "purge: fail (HTTP $STATUS)"; fi
