name: photo2 - force collector refresh + Cambodia Bin upstream probe

on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo2-force-refresh.yml'

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: "[1]" Trigger collectors (HTTP GET forces a fresh poll cycle)
        run: |
          set +e
          BASE="https://xn--9d0bw2fjtyymch7de9d.info"
          echo "===== 각 collector 강제 실행 (여러 후보 시도) ====="
          for path in \
              "photo2/collector_xtd.php" \
              "photo2/collector.php" \
              "photo2/collector_kambodia.php" \
              "photo2/collector_cambodia.php" \
              "photo2/collector_bin.php" \
              "photo2/collector_kbin.php" \
              "photo2/collector_camb.php" \
              "photo/collector_xtd.php" \
              "photo/collector.php" \
              "photo/collector_kambodia.php" \
              "photo/collector_cambodia.php" \
              "photo/collector_bin.php" \
              "photo/collector_kbin.php" \
              "photo/collector_all.php" \
              "photo/collect.php" \
              "photo2/cron.php" \
              "photo/cron.php" \
              "photo/refresh.php"; do
            OUT="/tmp/coll_$(echo "$path" | tr '/' '_')"
            CODE=$(curl -sS -o "$OUT" -w "%{http_code}" --max-time 60 "$BASE/$path?force=1&_t=$(date +%s)")
            SIZE=$(stat -c%s "$OUT" 2>/dev/null || echo 0)
            printf "%-50s HTTP %-4s (%sB)" "$path" "$CODE" "$SIZE"
            if [ "$CODE" = "200" ] && [ "$SIZE" -gt 0 ] && [ "$SIZE" -lt 2000 ]; then
              echo " → $(head -c 200 "$OUT" | tr '\n' ' ')"
            else
              echo ""
            fi
          done

      - name: "[2]" Wait 8s for cron/collector output to land
        run: sleep 8

      - name: "[3]" Re-check all 20 rooms after force-refresh
        run: |
          set +e
          mkdir -p out
          BASE="https://xn--9d0bw2fjtyymch7de9d.info/photo2"
          TS=$(date +%s)
          NOW=$(date +%s)

          echo "===== [after refresh] tables.json ====="
          curl -sS --max-time 15 "$BASE/data/tables.json?_t=$TS" -o out/tables.json -w "HTTP:%{http_code}\n"
          cat out/tables.json
          echo ""

          echo ""
          echo "===== [after refresh] 20 rooms age check ====="
          echo "server_now: $NOW"
          echo ""
          PAIRS="10:10 11:11 12:12 15:15 16:16 17:87 18:18 19:89 20:20 21:21 22:22 23:23 25:25 26:26 27:27 55:31 66:32 77:33 88:34 99:35"
          printf "%-6s %-6s %-6s %-8s %-8s %-8s %s\n" "label" "apiId" "http" "age_s" "nums_len" "ver" "tail"
          echo "-----------------------------------------------------------------------------------"
          for pair in $PAIRS; do
            LABEL="${pair%%:*}"
            APIID="${pair##*:}"
            CODE=$(curl -sS --max-time 15 -o "out/room_${LABEL}.json" -w "%{http_code}" "$BASE/data/room_${LABEL}.json?_t=$TS")
            if [ "$CODE" = "200" ] && [ -s "out/room_${LABEL}.json" ]; then
              LABEL_ENV="$LABEL" APIID_ENV="$APIID" CODE_ENV="$CODE" NOW_ENV="$NOW" FILE_ENV="out/room_${LABEL}.json" \
                python3 - <<'PYEOF'
          import json, os, sys
          label = os.environ['LABEL_ENV']
          apiid = os.environ['APIID_ENV']
          code = os.environ['CODE_ENV']
          now = int(os.environ['NOW_ENV'])
          path = os.environ['FILE_ENV']
          try:
              d = json.load(open(path))
          except Exception as e:
              print(f"{label:<6} {apiid:<6} {code:<6} PARSE_ERR {e}")
              sys.exit(0)
          t = d.get('t', 0)
          nums = d.get('nums', [])
          ver = d.get('ver', '-')
          api_id = d.get('apiId', '-')
          age = now - int(t) if t else -1
          if isinstance(nums, list):
              nlen = len(nums)
              tail = nums[-10:]
          else:
              nlen = '?'
              tail = '?'
          print(f"{label:<6} {apiid:<6} {code:<6} {age:<8} {str(nlen):<8} {str(ver):<8} apiId={api_id} tail={tail}")
          PYEOF
            else
              printf "%-6s %-6s %-6s MISSING\n" "$LABEL" "$APIID" "$CODE"
            fi
          done

      - name: "[4]" Cambodia Bin upstream probe — fcj.oqogyf.com per room_id
        run: |
          set +e
          echo "===== fcj.oqogyf.com per room_id (signal.js에서 발견된 URL) ====="
          for RID in 10 11 12 15 16 18 20 21 22 25 26 27 87 89 31 32 33 34 35 62 100 101 102 103 105 106 107 108 109 110 73; do
            CODE=$(curl -sS -o "/tmp/fcj_${RID}" -w "%{http_code}" --max-time 10 --connect-timeout 5 \
                    "https://fcj.oqogyf.com/?room_id=${RID}")
            SIZE=$(stat -c%s "/tmp/fcj_${RID}" 2>/dev/null || echo 0)
            printf "room_id=%-4s HTTP %-4s (%sB)" "$RID" "$CODE" "$SIZE"
            if [ "$CODE" = "200" ] && [ "$SIZE" -gt 0 ] && [ "$SIZE" -lt 500 ]; then
              echo " → $(head -c 200 "/tmp/fcj_${RID}" | tr '\n' ' ')"
            elif [ "$CODE" = "200" ] && [ "$SIZE" -ge 500 ]; then
              # look for baccarat markers
              HITS=$(grep -o -E 'nums|game|P0|B0|banker|player|room_id|table' "/tmp/fcj_${RID}" 2>/dev/null | head -5 | tr '\n' ' ')
              echo " → 200 large body, markers: $HITS"
            else
              echo ""
            fi
          done

      - name: "[5]" Try xjh.liveview2024.vip (다른 원본)
        run: |
          set +e
          echo "===== xjh.liveview2024.vip ====="
          for RID in 10 11 15 16 18 25 26 27 87 89; do
            CODE=$(curl -sS -o /tmp/xjh -w "%{http_code}" --max-time 8 --connect-timeout 5 \
                    "https://xjh.liveview2024.vip/?room_id=${RID}")
            SIZE=$(stat -c%s /tmp/xjh 2>/dev/null || echo 0)
            printf "room_id=%-4s HTTP %-4s (%sB)" "$RID" "$CODE" "$SIZE"
            [ "$SIZE" -gt 0 ] && [ "$SIZE" -lt 500 ] && echo " → $(head -c 150 /tmp/xjh | tr '\n' ' ')" || echo ""
          done

      - name: "[6]" Grep bundle.js more carefully for upstream host
        run: |
          set +e
          BASE="https://xn--9d0bw2fjtyymch7de9d.info/photo2"
          curl -sS "$BASE/modules/dist/bundle.js" -o /tmp/bundle.js --max-time 30
          curl -sS "$BASE/bgl.js" -o /tmp/bgl.js --max-time 30
          curl -sS "$BASE/dragon_fx.js" -o /tmp/dragon_fx.js --max-time 30
          curl -sS "$BASE/CAH_1.html" -o /tmp/CAH_1.html --max-time 30
          echo "===== bundle.js: URL hosts ====="
          grep -o -E 'https?://[a-z0-9.-]+' /tmp/bundle.js | sort -u | head -30
          echo ""
          echo "===== bgl.js: URL hosts + api paths ====="
          grep -o -E 'https?://[a-z0-9.-]+|/api[a-z_/]*\.php|room_id|kambodia|캄보디아' /tmp/bgl.js | sort -u | head -30
          echo ""
          echo "===== CAH_1.html: kambodia/캄보디아/table 관련 텍스트 ====="
          grep -n -E '캄보디아|kambodia|cambodia|bin|table.*=' /tmp/CAH_1.html | head -20

      - name: "[7]" Fetch write.php raw response (login redirect / partial HTML)
        run: |
          set +e
          BASE="https://xn--9d0bw2fjtyymch7de9d.info/photo2"
          curl -sSI --max-time 15 "$BASE/write.php" | head -20
          echo "--- body ---"
          curl -sS --max-time 15 "$BASE/write.php" -o /tmp/write.php.html
          wc -c /tmp/write.php.html
          echo "--- 캄보디아/table 관련 라인 ---"
          grep -n -E '캄보디아|kambodia|table.*=|room.*=|사쿠라|xtd|sinji' /tmp/write.php.html | head -30
          echo "--- last 60 lines ---"
          tail -60 /tmp/write.php.html
