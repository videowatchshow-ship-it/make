name: Create cham.cent-solution.online site with all matched gmails

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-cham.txt']

jobs:
  build-cham:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Ship URL list
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          source: ".github/smm-urls.txt"
          target: "/tmp"
          strip_components: 1
      - name: Build cham dir, seed accounts.json, DNS+vhost+SSL
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 180s
          script: |
            set -e
            CF_TOKEN="${{ secrets.CLOUDFLARE_TOKEN }}"
            ZONE="2601d4f4ab75c910f8d858ca036ff344"
            SERVER_IP=$(curl -s ifconfig.me)

            sudo mkdir -p /var/www/sites/cham/public
            sudo chown -R ${{ secrets.GAUTH_USER }}:${{ secrets.GAUTH_USER }} /var/www/sites/cham

            echo "=== 1. seed /var/www/sites/cham/accounts.json with ALL matched gmail.com accounts from master ==="
            sudo python3 - <<'PYEOF'
            import json, os, re, urllib.parse
            URLS_FILE="/tmp/smm-urls.txt"; MASTER="/opt/gauth-full/accounts_normalized.json"
            def norm(u):
                if not u: return ""
                u = urllib.parse.unquote(u.strip())
                u = re.sub(r'^https?://', '', u, flags=re.I).rstrip('/')
                u = re.sub(r'^www\.', '', u, flags=re.I)
                u = u.split('?')[0].split('|')[0]
                u = re.sub(r'/(videos|featured|about|shorts|streams|community)$', '', u, flags=re.I)
                return u.lower()
            wanted=set(); wh=set(); wc=set()
            for line in open(URLS_FILE):
                s=line.strip()
                if not s: continue
                n=norm(s); wanted.add(n)
                m=re.search(r'youtube\.com/@([^/]+)',n)
                if m: wh.add(m.group(1).lower())
                m=re.search(r'youtube\.com/channel/([^/|]+)',n)
                if m: wc.add(m.group(1).lower())
            def matches(y):
                n=norm(y)
                if not n: return False
                if n in wanted: return True
                m=re.search(r'youtube\.com/@([^/]+)',n)
                if m and m.group(1).lower() in wh: return True
                m=re.search(r'youtube\.com/channel/([^/|]+)',n)
                if m and m.group(1).lower() in wc: return True
                return False
            master=json.load(open(MASTER,encoding='utf-8'))
            arr=master if isinstance(master,list) else master.get('accounts',[])
            out=[]; seen=set()
            for a in arr:
                if not isinstance(a,dict): continue
                e=(a.get('email') or a.get('gmail') or '').strip().lower()
                if not e.endswith('@gmail.com'): continue
                if e in seen: continue
                y=a.get('youtube_url') or a.get('youtube') or a.get('channel_url') or ''
                if not matches(y): continue
                seen.add(e); out.append(a)
            with open('/var/www/sites/cham/accounts.json','w',encoding='utf-8') as fh:
                json.dump(out,fh,ensure_ascii=False,indent=2)
            print(f'wrote {len(out)} gmail accounts to /var/www/sites/cham/accounts.json')
            PYEOF

            echo ""
            echo "=== 2. Cloudflare DNS ensure cham record ==="
            EX=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?name=cham.cent-solution.online" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('result',[]);print(r[0]['id'] if r else '')")
            if [ -n "$EX" ]; then echo "DNS exists $EX"; else
              curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" -d '{"type":"A","name":"cham","content":"'"$SERVER_IP"'","ttl":1,"proxied":true}'
              echo " DNS created"
            fi

            sudo chown -R www-data:www-data /var/www/sites/cham

            echo ""
            echo "=== 3. write cham index.html (list all gmails, no editing) ==="
            sudo tee /var/www/sites/cham/public/index.html > /dev/null <<'HTMLEOF'
            <!doctype html><html lang="ko"><head><meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>참(cham) · SMM 매칭 지메일 전체 목록</title>
            <meta http-equiv="Cache-Control" content="no-store">
            <style>
              :root{--bg:#0d1117;--panel:#0f1620;--card:#161a20;--border:#2a323c;--text:#e8ecef;--sub:#8a95a5;--accent:#7dabff;--accent2:#3ddc84;--warn:#ffb469}
              body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",sans-serif;padding:24px 12px 60px;display:flex;justify-content:center}
              .wrap{width:100%;max-width:960px}
              h1{font-size:22px;margin:0 0 8px}
              .sub{color:var(--sub);font-size:12px;margin-bottom:18px}
              table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;font-size:13px}
              th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top;word-break:break-all}
              th{background:var(--card);color:var(--accent);font-weight:700;position:sticky;top:0}
              tr:last-child td{border-bottom:none}
              .email{color:var(--accent2);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
              .pw{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--warn)}
              .url a{color:var(--accent)}
              .count{color:var(--accent2);font-weight:800}
            </style></head><body><div class="wrap">
            <h1>🐘 참(cham) · SMM 매칭 지메일 전체</h1>
            <div class="sub">cham.cent-solution.online · 데이터: gauth 마스터 DB에서 SMM 주문 URL과 매칭된 gmail.com 계정 전량</div>
            <div style="margin:10px 0 14px">총 <span class="count" id="c">0</span>개</div>
            <table><thead><tr><th>#</th><th>이메일</th><th>비밀번호</th><th>TOTP</th><th>YouTube URL</th></tr></thead><tbody id="t"></tbody></table>
            </div><script>
            fetch('/api/accounts',{cache:'no-store'}).then(r=>r.json()).then(d=>{
              document.getElementById('c').textContent=d.length;
              const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
              document.getElementById('t').innerHTML=d.map((a,i)=>`<tr><td>${i+1}</td><td class=email>${esc(a.email||'')}</td><td class=pw>${esc(a.password||'')}</td><td class=pw>${esc(a.totp_secret||'')}</td><td class=url><a href="${esc(a.youtube_url||'#')}" target=_blank>${esc(a.youtube_url||'')}</a></td></tr>`).join('');
            }).catch(e=>{document.getElementById('t').innerHTML=`<tr><td colspan=5>불러오기 실패: ${e.message}</td></tr>`});
            </script></body></html>
            HTMLEOF

            echo ""
            echo "=== 4. wire /api/accounts (per-site cham) into gauth Express (proxied to :4000) ==="
            F=/opt/gauth-full/rebrowser-login.js
            sudo python3 - <<'PYEOF'
            f="/opt/gauth-full/rebrowser-login.js"
            src=open(f,'r',encoding='utf-8').read()
            if "/api/cham-accounts" in src:
              print('route already present, skip')
            else:
              marker="app.get('/api/subsite-counts'"
              idx=src.index(marker)
              route=("app.get('/api/cham-accounts', (_req, res) => {\n"
                     "  try { const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/var/www/sites/cham/accounts.json','utf8'));\n"
                     "    res.json(Array.isArray(d)?d:(d.accounts||[]));\n"
                     "  } catch(e) { res.status(500).json({error:e.message}); }\n"
                     "})\n")
              src=src[:idx]+route+src[idx:]
              open(f,'w',encoding='utf-8').write(src)
              print('route inserted')
            PYEOF
            sudo node -c /opt/gauth-full/rebrowser-login.js && sudo systemctl restart gauth
            sleep 2

            echo ""
            echo "=== 5. Apache vhost :80 (with proxy to gauth /api/cham-accounts as /api/accounts) ==="
            sudo tee /etc/apache2/sites-available/cham.conf > /dev/null <<'VHOSTEOF'
            <VirtualHost *:80>
                ServerName cham.cent-solution.online
                DocumentRoot /var/www/sites/cham/public
                <Directory /var/www/sites/cham/public>
                    AllowOverride All
                    Require all granted
                </Directory>
                <FilesMatch "\.(html|json|js)$">
                    Header always set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
                </FilesMatch>
                ProxyPreserveHost On
                ProxyPass /api/accounts http://127.0.0.1:4000/api/cham-accounts
                ProxyPassReverse /api/accounts http://127.0.0.1:4000/api/cham-accounts
                RewriteEngine On
                RewriteCond %{HTTPS} off
                RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
            </VirtualHost>
            VHOSTEOF
            sudo a2enmod proxy proxy_http headers rewrite 2>/dev/null || true
            sudo a2ensite cham.conf
            sudo apachectl configtest && sudo systemctl reload apache2

            echo ""
            echo "=== 6. issue Let's Encrypt cert via dns-cloudflare ==="
            sudo mkdir -p /root/.secrets
            echo "dns_cloudflare_api_token = $CF_TOKEN" | sudo tee /root/.secrets/cf-cham.ini > /dev/null
            sudo chmod 600 /root/.secrets/cf-cham.ini
            sudo certbot certonly -d cham.cent-solution.online --dns-cloudflare --dns-cloudflare-credentials /root/.secrets/cf-cham.ini --non-interactive --agree-tos -m admin@cent-solution.online || echo "certbot failed, continuing"
            sudo shred -u /root/.secrets/cf-cham.ini 2>/dev/null || sudo rm -f /root/.secrets/cf-cham.ini

            if [ -f /etc/letsencrypt/live/cham.cent-solution.online/fullchain.pem ]; then
              sudo tee /etc/apache2/sites-available/cham-le-ssl.conf > /dev/null <<'SSLEOF'
            <IfModule mod_ssl.c>
            <VirtualHost *:443>
                ServerName cham.cent-solution.online
                DocumentRoot /var/www/sites/cham/public
                <Directory /var/www/sites/cham/public>
                    AllowOverride All
                    Require all granted
                </Directory>
                <FilesMatch "\.(html|json|js)$">
                    Header always set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
                </FilesMatch>
                ProxyPreserveHost On
                ProxyPass /api/accounts http://127.0.0.1:4000/api/cham-accounts
                ProxyPassReverse /api/accounts http://127.0.0.1:4000/api/cham-accounts
                SSLCertificateFile /etc/letsencrypt/live/cham.cent-solution.online/fullchain.pem
                SSLCertificateKeyFile /etc/letsencrypt/live/cham.cent-solution.online/privkey.pem
                Include /etc/letsencrypt/options-ssl-apache.conf
            </VirtualHost>
            </IfModule>
            SSLEOF
              sudo a2enmod ssl 2>/dev/null || true
              sudo a2ensite cham-le-ssl.conf
              sudo apachectl configtest && sudo systemctl reload apache2
            fi

            echo ""
            echo "=== 7. verify ==="
            sleep 3
            curl -s -o /dev/null -w "cham https status: %{http_code}\n" https://cham.cent-solution.online/ --max-time 10
            echo "count: $(curl -s --max-time 10 https://cham.cent-solution.online/api/accounts | python3 -c 'import sys,json;print(len(json.load(sys.stdin)))')"
