name: patch login-one to save results

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-patch-login-one.txt']

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Patch login-one route to call saveLoginResult
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 120s
          script: |
            set -e
            APP=/opt/gauth-full/rebrowser-login.js

            echo "=== 1. Check saveLoginResult exists ==="
            if ! grep -q 'function saveLoginResult' "$APP"; then
              echo "ERROR: saveLoginResult not found. Run deploy-login-results-api first."
              exit 1
            fi

            echo "=== 2. Check if login-one already saves results ==="
            if grep -q 'saveLoginResult' "$APP" && grep -A5 'login-one' "$APP" | grep -q 'saveLoginResult'; then
              echo "login-one already calls saveLoginResult, skipping"
              exit 0
            fi

            echo "=== 3. Patch login-one response to save result ==="
            sudo cp "$APP" "${APP}.bak.loginone"

            PATCH_B64=""

            echo "$PATCH_B64" | base64 -d > /tmp/login_one_save_patch.js

            LISTEN_LINE=$(sudo grep -n 'app\.listen\|server\.listen' "$APP" | head -1 | cut -d: -f1)
            if [ -z "$LISTEN_LINE" ]; then
              sudo bash -c "cat /tmp/login_one_save_patch.js >> $APP"
            else
              sudo sed -i "${LISTEN_LINE}r /tmp/login_one_save_patch.js" "$APP"
            fi
            rm /tmp/login_one_save_patch.js
            echo "login-one save patch applied"

            echo "=== 4. Restart gauth ==="
            sudo systemctl restart gauth
            sleep 2
            if systemctl is-active --quiet gauth; then
              echo "gauth running OK"
            else
              echo "gauth failed, rolling back"
              sudo cp "${APP}.bak.loginone" "$APP"
              sudo systemctl restart gauth
              exit 1
            fi

            echo "=== 5. Verify ==="
            curl -sf http://localhost:4000/api/login-results | head -c 200
            echo ""
            echo "DONE"
