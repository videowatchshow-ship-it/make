name: 방 110 원본 vs 서버 정확한 API 비교 v2

on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-room110-mapping.yml'

jobs:
  compare2:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='bash -s' << "REMOTE"
            set +u
            P1="/var/www/sites/chamgyo/public/photo"

            echo "===== [원본 API - 정확한 방식] ====="
            API="https://xjh.liveview2024.vip"
            # 1. 방 110 최신 회차
            R1=$(curl -sS --max-time 8 \
              -H "Origin: https://fcj6.oqogyf.com" \
              -H "Referer: https://fcj6.oqogyf.com/" \
              "$API/api/pub/get_newly_issue?room_id=110")
            echo "  get_newly_issue?room_id=110:"
            echo "  $R1"
            echo ""

            # 2. 그 회차의 nums
            IID=$(echo "$R1" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('data',{}).get('id',''))" 2>/dev/null)
            VER=$(echo "$R1" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('data',{}).get('version',''))" 2>/dev/null)
            echo "  최신 회차 id: $IID · version: $VER"

            R2=$(curl -sS --max-time 8 \
              -H "Origin: https://fcj6.oqogyf.com" \
              -H "Referer: https://fcj6.oqogyf.com/" \
              "$API/api/pub/get_open_nums?issue_id=$IID")
            echo ""
            echo "  get_open_nums?issue_id=$IID:"
            echo "  $R2"

            echo ""
            echo "===== [서버 room_110.json] ====="
            SR=$(sudo cat "$P1/data/room_110.json")
            echo "  $SR"

            echo ""
            echo "===== [비교] ====="
            ORI_NUMS=$(echo "$R2" | python3 -c "import sys,json;d=json.load(sys.stdin);n=d.get('nums',[]);print(len(n),':',n)" 2>/dev/null)
            SRV_NUMS=$(echo "$SR" | python3 -c "import sys,json;d=json.load(sys.stdin);n=d.get('nums',[]);print(len(n),':',n)" 2>/dev/null)
            SRV_ID=$(echo "$SR" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('id'))" 2>/dev/null)
            SRV_VER=$(echo "$SR" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('ver'))" 2>/dev/null)
            echo "  원본 id:  $IID"
            echo "  서버 id:  $SRV_ID"
            echo "  원본 ver: $VER"
            echo "  서버 ver: $SRV_VER"
            echo ""
            echo "  원본 nums: $ORI_NUMS"
            echo "  서버 nums: $SRV_NUMS"
            echo ""
            [ "$IID" = "$SRV_ID" ] && echo "  ✅ 회차 id 일치" || echo "  ❌ 회차 id 다름 (서버 오래됨)"

            echo ""
            echo "===== [원본 P/B/T 카운트] ====="
            echo "$R2" | python3 -c "
            import sys, json
            d = json.load(sys.stdin)
            nums = d.get('nums', [])
            print(f'  원본 총 판수: {len(nums)}')
            print(f'  원본 데이터: {nums}')
            "

            echo ""
            echo "===== DONE ====="
            REMOTE
