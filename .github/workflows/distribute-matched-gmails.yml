name: Distribute matched gmails one-per-subsite

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-distribute.txt']

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ship URL list
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          source: ".github/smm-urls.txt"
          target: "/tmp"
          strip_components: 1
      - name: 1-per-subsite + leftover to cham
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 90s
          script: |
            sudo python3 - <<'PYEOF'
            import json, os, re, urllib.parse, time, shutil
            URLS_FILE = "/tmp/smm-urls.txt"
            BASE = "/var/www/sites"
            MASTER = "/opt/gauth-full/accounts_normalized.json"

            def norm(u):
                if not u: return ""
                u = urllib.parse.unquote(u.strip())
                u = re.sub(r'^https?://', '', u, flags=re.I).rstrip('/')
                u = re.sub(r'^www\.', '', u, flags=re.I)
                u = u.split('?')[0].split('|')[0]
                u = re.sub(r'/(videos|featured|about|shorts|streams|community)$', '', u, flags=re.I)
                return u.lower()

            wanted=set(); wh=set(); wc=set()
            for L in open(URLS_FILE):
                n = norm(L.strip())
                if not n: continue
                wanted.add(n)
                m = re.search(r'youtube\.com/@([^/]+)', n)
                if m: wh.add(m.group(1).lower())
                m = re.search(r'youtube\.com/channel/([^/|]+)', n)
                if m: wc.add(m.group(1).lower())
            def mm(y):
                n = norm(y)
                if not n: return False
                if n in wanted: return True
                m = re.search(r'youtube\.com/@([^/]+)', n)
                if m and m.group(1).lower() in wh: return True
                m = re.search(r'youtube\.com/channel/([^/|]+)', n)
                if m and m.group(1).lower() in wc: return True
                return False

            master = json.load(open(MASTER, encoding='utf-8'))
            marr = master if isinstance(master, list) else master.get('accounts', [])
            pool = []; seen=set()
            for a in marr:
                if not isinstance(a, dict): continue
                e = (a.get('email') or a.get('gmail') or '').strip().lower()
                if not e.endswith('@gmail.com'): continue
                if e in seen: continue
                if not mm(a.get('youtube_url') or a.get('youtube') or a.get('channel_url') or ''): continue
                seen.add(e); pool.append(a)
            print(f"pool: {len(pool)}")

            # list REAL sub-sites (exclude cham)
            REAL = []
            for name in sorted(os.listdir(BASE)):
                if name in ('gauth','cham'): continue
                p = os.path.join(BASE, name, 'accounts.json')
                if os.path.exists(p): REAL.append(name)
            print(f"sub-sites: {REAL}")

            ts = str(int(time.time()))

            # 1) each REAL site gets ONE unique gmail (not already there)
            present = {}
            for site in REAL:
                d = json.load(open(os.path.join(BASE, site, 'accounts.json'), encoding='utf-8'))
                arr = d if isinstance(d, list) else d.get('accounts', [])
                present[site] = set(((x.get('email') or x.get('gmail') or '').strip().lower()) for x in arr if isinstance(x, dict))

            assigned = {s: None for s in REAL}
            used = set()
            for site in REAL:
                for a in pool:
                    e = (a.get('email') or a.get('gmail') or '').strip().lower()
                    if e in used: continue
                    if e in present[site]: continue
                    assigned[site] = a; used.add(e); break

            # apply to each sub-site
            for site, a in assigned.items():
                if a is None: continue
                p = os.path.join(BASE, site, 'accounts.json')
                shutil.copy(p, p + f'.bak.{ts}')
                d = json.load(open(p, encoding='utf-8'))
                if isinstance(d, list): d.append(a); out = d
                else: d.setdefault('accounts', []).append(a); out = d
                with open(p, 'w', encoding='utf-8') as fh:
                    json.dump(out, fh, ensure_ascii=False, indent=2)
                print(f"  {site:<12} + {a.get('email')}")

            # 2) rest -> cham (replace)
            leftover = [a for a in pool if (a.get('email') or a.get('gmail') or '').strip().lower() not in used]
            CHAM = os.path.join(BASE, 'cham', 'accounts.json')
            if os.path.exists(CHAM):
                shutil.copy(CHAM, CHAM + f'.bak.{ts}')
            os.makedirs(os.path.dirname(CHAM), exist_ok=True)
            with open(CHAM, 'w', encoding='utf-8') as fh:
                json.dump(leftover, fh, ensure_ascii=False, indent=2)
            print(f"cham <- {len(leftover)} leftover accounts")
            for a in leftover:
                print(f"  cham + {a.get('email')}")
            PYEOF
