name: gauth - debug nasiroyibo 2fa fields
on:
  push:
    paths:
      - '.github/workflows/gauth-debug-nasiro.yml'

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dump all fields for nasiroyibo
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 4m
          script: |
            sudo node << 'NODESCRIPT'
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('/opt/gauth-full/accounts_normalized.json','utf8'));
            const arr = Array.isArray(data) ? data : (data.accounts || []);
            const acct = arr.find(a => (a.email||'').toLowerCase() === 'nasiroyibo@gmail.com');
            if (!acct) { console.log('NOT FOUND'); process.exit(1); }
            console.log(JSON.stringify(acct, null, 2));
            NODESCRIPT
