name: gauth · fix auth* not defined (broad shim)

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-authquery-fix.txt']

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install correct auth shim (URL pass-through)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            F=/var/www/sites/gauth/public/index.html
            sudo cp "$F" "$F.bak.$(date +%s)"
            sudo python3 - <<'PYEOF'
            import re
            f = "/var/www/sites/gauth/public/index.html"
            s = open(f, encoding='utf-8').read()
            # remove any prior auth-broad-shim
            s = re.sub(r'<script>\n// auth-broad-shim start.*?// auth-broad-shim end\n</script>\n', '', s, flags=re.S)
            shim = (
              '<script>\n'
              '// auth-broad-shim start\n'
              '(function(){\n'
              '  // Correct semantics: authQuery(url) returns the URL possibly annotated with a token/nonce.\n'
              '  // Pass through by default so fetch(authQuery("/api/xxx")) hits the real endpoint.\n'
              '  function passthru(u){ return String(u==null?"":u); }\n'
              '  window.authQuery    = window.authQuery    || passthru;\n'
              '  window.noCacheQuery = window.noCacheQuery || function(u){\n'
              '    u = String(u||"");\n'
              '    var sep = u.indexOf("?")>=0 ? "&" : "?";\n'
              '    return u + sep + "_=" + Date.now();\n'
              '  };\n'
              '  window.authHeaders  = window.authHeaders  || function(){ return { "Accept": "application/json" }; };\n'
              '  window.authToken    = window.authToken    || function(){ return ""; };\n'
              '  window.authNonce    = window.authNonce    || function(){ return Math.random().toString(36).slice(2); };\n'
              '  window.authUrl      = window.authUrl      || passthru;\n'
              '  window.authUser     = window.authUser     || function(){ return null; };\n'
              '  window.authEmail    = window.authEmail    || function(){ return ""; };\n'
              '  window.authFetch    = window.authFetch    || function(u, o){ o=o||{}; o.headers=Object.assign({}, o.headers||{}, window.authHeaders()); o.cache="no-store"; return fetch(u, o); };\n'
              '})();\n'
              '// auth-broad-shim end\n'
              '</script>\n'
            )
            if '<body>' in s:
                s = s.replace('<body>', '<body>\n' + shim, 1)
                open(f, 'w', encoding='utf-8').write(s)
                print('correct auth shim installed')
            PYEOF
            echo ''
            echo '=== verify ==='
            sudo grep -c 'authQuery    = window.authQuery    || passthru' "$F"
            curl -s --max-time 10 https://gauth.cent-solution.online/ | grep -c 'authQuery    = window.authQuery    || passthru'
