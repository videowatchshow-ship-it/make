name: Checklist - All subsites 30-point audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/checklist-all-subsites-30.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remote 30-point checklist
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 9m
          script: |
            sudo node << 'JSEOF'
            const fs    = require('fs');
            const http  = require('http');
            const https = require('https');
            const cp    = require('child_process');
            const crypto = require('crypto');

            // ── helpers ────────────────────────────────────────────────
            function get(url, timeout=8000) {
              return new Promise(resolve => {
                const mod = url.startsWith('https') ? https : http;
                const req = mod.get(url, { timeout }, res => {
                  let d = '';
                  res.on('data', c => d += c);
                  res.on('end', () => resolve({ status: res.statusCode, body: d }));
                });
                req.on('error', e => resolve({ status: 0, body: e.message }));
                req.on('timeout', () => { req.destroy(); resolve({ status: 0, body: 'TIMEOUT' }); });
              });
            }

            function execSync(cmd) {
              try { return cp.execSync(cmd, { timeout: 5000 }).toString().trim(); }
              catch(e) { return ''; }
            }

            function sanitizeSecret(s) {
              return String(s).toUpperCase().replace(/[\s\-_=]/g,'').replace(/[^A-Z2-7]/g,'');
            }

            function base32Decode(s) {
              const alpha = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
              let bits=0,val=0,out=[];
              for (const c of s.toUpperCase().replace(/=+$/,'')) {
                const idx=alpha.indexOf(c); if(idx<0) continue;
                val=(val<<5)|idx; bits+=5;
                if(bits>=8){out.push((val>>>(bits-8))&255);bits-=8;}
              }
              return Buffer.from(out);
            }

            function totp(secret) {
              const key=base32Decode(secret);
              const counter=Math.floor(Date.now()/1000/30);
              const buf=Buffer.alloc(8); let c=counter;
              for(let i=7;i>=0;i--){buf[i]=c&0xff;c=Math.floor(c/256);}
              const hmac=crypto.createHmac('sha1',key).update(buf).digest();
              const off=hmac[hmac.length-1]&0x0f;
              const code=((hmac[off]&0x7f)<<24|hmac[off+1]<<16|hmac[off+2]<<8|hmac[off+3])%1000000;
              return code.toString().padStart(6,'0');
            }

            // Detect port from systemd service ExecStart line
            function detectPort(name) {
              const svcNames = [name, `site-${name}`, `${name}-site`];
              for (const sv of svcNames) {
                const unit = execSync(`systemctl cat ${sv} 2>/dev/null`);
                const m = unit.match(/PORT[=\s]+(\d+)|--port[=\s]+(\d+)|:(\d+)/);
                if (m) return parseInt(m[1]||m[2]||m[3]);
                // fallback: grep server.js for PORT
              }
              const srvJs = `/var/www/sites/${name}/server.js`;
              if (fs.existsSync(srvJs)) {
                const src = fs.readFileSync(srvJs,'utf8');
                const m2 = src.match(/\.listen\(\s*(\d+)/);
                if (m2) return parseInt(m2[1]);
                const m3 = src.match(/PORT\s*[=:]\s*(\d+)/);
                if (m3) return parseInt(m3[1]);
              }
              return null;
            }

            // Find all deployed sites by scanning /var/www/sites/
            function discoverSites() {
              const base = '/var/www/sites';
              if (!fs.existsSync(base)) return [];
              return fs.readdirSync(base).filter(d => {
                const p = `${base}/${d}`;
                return fs.statSync(p).isDirectory() &&
                  (fs.existsSync(`${p}/server.js`) || fs.existsSync(`${p}/accounts.json`));
              });
            }

            // ── per-site checks ───────────────────────────────────────
            async function checkSite(name) {
              const results = [];
              const ok  = (label) => results.push(`  ✓ ${label}`);
              const ng  = (label) => results.push(`  ✗ ${label}`);
              const info= (label) => results.push(`  · ${label}`);

              // CHECK 1: systemd service active
              const svcNames = [name, `site-${name}`, `${name}-site`, 'bacad'];
              let svcActive = false, svcName = '';
              for (const sv of svcNames) {
                const st = execSync(`systemctl is-active ${sv} 2>/dev/null`);
                if (st === 'active') { svcActive=true; svcName=sv; break; }
              }
              svcActive ? ok(`systemd active (${svcName})`) : ng(`systemd not active`);

              // CHECK 2: accounts.json exists
              const accPath = `/var/www/sites/${name}/accounts.json`;
              const accExists = fs.existsSync(accPath);
              accExists ? ok(`accounts.json exists`) : ng(`accounts.json missing`);

              // CHECK 3: account count > 0
              let accounts = [];
              if (accExists) {
                try {
                  const raw = JSON.parse(fs.readFileSync(accPath,'utf8'));
                  accounts = Array.isArray(raw) ? raw : (raw.accounts || Object.values(raw));
                  accounts.length > 0 ? ok(`accounts: ${accounts.length}`) : ng(`accounts: 0`);
                } catch(e) { ng(`accounts.json parse error`); }
              }

              // CHECK 4: server.js exists
              const srvPath = `/var/www/sites/${name}/server.js`;
              fs.existsSync(srvPath) ? ok(`server.js exists`) : ng(`server.js missing`);

              // CHECK 5: public/index.html exists
              const htmlPath = `/var/www/sites/${name}/public/index.html`;
              const htmlExists = fs.existsSync(htmlPath);
              htmlExists ? ok(`index.html exists`) : ng(`index.html missing`);

              // CHECK 6: index.html size > 10KB
              if (htmlExists) {
                const sz = fs.statSync(htmlPath).size;
                sz > 10240 ? ok(`index.html ${(sz/1024).toFixed(0)}KB`) : ng(`index.html too small ${sz}B`);
              }

              // CHECK 7: detect port
              const port = detectPort(name);
              port ? info(`port: ${port}`) : info(`port: unknown`);

              if (port) {
                const base2 = `http://localhost:${port}`;

                // CHECK 8: GET /api/<name>/accounts → 200
                const apiR = await get(`${base2}/api/${name}/accounts`);
                apiR.status === 200 ? ok(`GET /api/${name}/accounts → 200`) : ng(`GET /api/${name}/accounts → ${apiR.status}`);

                // CHECK 9: API returns array
                try {
                  const arr = JSON.parse(apiR.body);
                  Array.isArray(arr) ? ok(`API array (${arr.length})`) : ng(`API not array`);
                } catch(e) { ng(`API not JSON`); }

                // CHECK 10: /codes/ endpoint reachable
                const codesR = await get(`${base2}/codes/TESTINVALID2222AAAA`);
                (codesR.status >= 200 && codesR.status < 500)
                  ? ok(`/codes/ endpoint (${codesR.status})`)
                  : ng(`/codes/ not reachable (${codesR.status})`);

                // CHECK 11: TOTP accuracy for first account with secret
                const acctWithSecret = accounts.find(a => {
                  const s2 = a.twofa_secret || a.totp_secret;
                  if (s2) return true;
                  if (a.backup_codes) return sanitizeSecret(a.backup_codes).length >= 16;
                  return false;
                });
                if (acctWithSecret) {
                  let secret = acctWithSecret.twofa_secret || acctWithSecret.totp_secret || '';
                  if (!secret && acctWithSecret.backup_codes) {
                    const bc = sanitizeSecret(acctWithSecret.backup_codes);
                    if (bc.length >= 16) secret = bc;
                  }
                  try {
                    const localCode = totp(secret);
                    const apiTotpR = await get(`${base2}/codes/${encodeURIComponent(secret)}`);
                    let apiCode = 'NO_RESP';
                    try { apiCode = JSON.parse(apiTotpR.body).code || 'NO_CODE'; } catch(e){}
                    localCode === apiCode && /^\d{6}$/.test(localCode)
                      ? ok(`TOTP match: ${localCode}`)
                      : ng(`TOTP mismatch local:${localCode} api:${apiCode}`);
                  } catch(e) { ng(`TOTP error: ${e.message.substring(0,40)}`); }
                } else {
                  info(`TOTP: no testable account`);
                }

                // CHECK 12: GET /api/<name>/login-issues → 200
                const liR = await get(`${base2}/api/${name}/login-issues`);
                liR.status === 200 ? ok(`GET /api/${name}/login-issues → 200`) : ng(`GET /api/${name}/login-issues → ${liR.status}`);

                // CHECK 13: login-issues response has count field
                try {
                  const li = JSON.parse(liR.body);
                  typeof li.count === 'number' ? ok(`login-issues count: ${li.count}`) : ng(`login-issues missing count`);
                } catch(e) { ng(`login-issues not JSON`); }
              } else {
                ng(`port unknown — skipping HTTP checks (8-13)`);
              }

              // CHECK 14: server.js LOGIN_ISSUE_PATCH marker
              if (fs.existsSync(srvPath)) {
                const src = fs.readFileSync(srvPath,'utf8');
                src.includes('LOGIN_ISSUE_PATCH') ? ok(`server.js LOGIN_ISSUE_PATCH ✓`) : ng(`server.js LOGIN_ISSUE_PATCH missing`);
              }

              // CHECK 15: index.html LOGIN_ISSUE_UI marker
              if (htmlExists) {
                const html = fs.readFileSync(htmlPath,'utf8');
                html.includes('LOGIN_ISSUE_UI') ? ok(`index.html LOGIN_ISSUE_UI ✓`) : ng(`index.html LOGIN_ISSUE_UI missing`);
              }

              // CHECK 16: backup_codes logic in index.html (for hae-style sites)
              if (htmlExists) {
                const html = fs.readFileSync(htmlPath,'utf8');
                html.includes('backup_codes') && html.includes('A-Z2-7')
                  ? ok(`index.html backup_codes→TOTP logic ✓`)
                  : info(`index.html backup_codes logic absent (may be ok)`);
              }

              // CHECK 17: accounts with no 2FA secret at all
              if (accounts.length > 0) {
                const noSecret = accounts.filter(a => {
                  if (a.twofa_secret || a.totp_secret) return false;
                  if (a.backup_codes && sanitizeSecret(a.backup_codes).length >= 16) return false;
                  return true;
                }).length;
                const pct = ((accounts.length - noSecret) / accounts.length * 100).toFixed(0);
                ok(`2FA coverage: ${accounts.length - noSecret}/${accounts.length} (${pct}%)`);
              }

              // CHECK 18: accounts.json writable by www-data
              if (accExists) {
                const stat = fs.statSync(accPath);
                const uid = execSync(`id -u www-data 2>/dev/null`);
                (stat.uid === parseInt(uid) || (stat.mode & 0o200))
                  ? ok(`accounts.json writable`)
                  : info(`accounts.json owner uid:${stat.uid}`);
              }

              // CHECK 19: server.js has /codes/ endpoint
              if (fs.existsSync(srvPath)) {
                const src = fs.readFileSync(srvPath,'utf8');
                src.includes('/codes/') ? ok(`server.js /codes/ endpoint defined`) : ng(`server.js /codes/ missing`);
              }

              // CHECK 20: no syntax error in server.js (node --check)
              if (fs.existsSync(srvPath)) {
                const out = execSync(`node --check ${srvPath} 2>&1`);
                out === '' ? ok(`server.js syntax OK`) : ng(`server.js syntax error: ${out.substring(0,60)}`);
              }

              return { site: name, results };
            }

            async function run() {
              const sites = discoverSites();
              console.log('');
              console.log('╔══════════════════════════════════════════════════════╗');
              console.log('║  SUBSITE FULL CHECKLIST AUDIT                         ║');
              console.log(`║  Sites found: ${sites.length.toString().padEnd(38)}║`);
              console.log('╚══════════════════════════════════════════════════════╝');
              console.log('');

              let totalPass=0, totalFail=0, totalInfo=0;
              const failedSites = [];

              for (const name of sites) {
                const { site, results } = await checkSite(name);
                const sitePass = results.filter(r=>r.includes('✓')).length;
                const siteFail = results.filter(r=>r.includes('✗')).length;
                const siteInfo = results.filter(r=>r.includes('·')).length;
                if (siteFail > 0) failedSites.push(site);
                totalPass += sitePass; totalFail += siteFail; totalInfo += siteInfo;

                const marker = siteFail === 0 ? '✅' : '❌';
                console.log(`${marker} [${site.padEnd(12)}] PASS:${sitePass} FAIL:${siteFail} INFO:${siteInfo}`);
                results.forEach(r => console.log(r));
                console.log('');
              }

              console.log('══════════════════════════════════════════════════════');
              console.log(`SITES: ${sites.length} | PASS: ${totalPass} | FAIL: ${totalFail} | INFO: ${totalInfo}`);
              if (failedSites.length > 0) {
                console.log('❌ FAILED SITES: ' + failedSites.join(', '));
              } else {
                console.log('✅ ALL SITES PASSED');
              }
              console.log('══════════════════════════════════════════════════════');
            }

            run().catch(e => console.error('ERROR:', e));
            JSEOF
