name: restart-gauth-v2
on:
  push:
    paths:
      - '.github/workflows/restart-gauth-v2.yml'

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_IP: "187.53.133.145"
      VPS_PASS_B64: "LWFhMGNLMDtibzJRNkxnMg=="
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Find gauth origin IP via CF API
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          echo "===== Find cent-solution.online zone ====="
          ZONES=$(curl -sS "https://api.cloudflare.com/client/v4/zones?name=cent-solution.online" \
            -H "Authorization: Bearer $CF_TOKEN")
          echo "$ZONES" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for z in d.get('result',[]):
            print(f\"Zone: {z['name']} ID: {z['id']} status: {z['status']}\")
          "
          ZONE_ID=$(echo "$ZONES" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          r=d.get('result',[])
          print(r[0]['id'] if r else '')
          ")
          echo "ZONE_ID=$ZONE_ID"

          if [ -n "$ZONE_ID" ]; then
            echo ""
            echo "===== DNS records ====="
            curl -sS "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CF_TOKEN" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for r in d.get('result',[]):
            print(f\"{r['type']:6} {r['name']:40} → {r['content']:20} proxied={r.get('proxied','?')}\")
          "
          fi

      - name: Try SSH to gauth from chamgyo VPS
        run: |
          export SSHPASS=$(echo "$VPS_PASS_B64" | base64 -d)
          SSH="sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@$VPS_IP"

          echo "===== Try reaching gauth from chamgyo ====="
          $SSH "curl -sS -o /dev/null -w 'gauth from chamgyo: HTTP %{http_code}\n' --max-time 10 https://gauth.cent-solution.online/ 2>&1 || echo 'FAILED from chamgyo too'"

          echo ""
          echo "===== Check if gauth IP reachable ====="
          $SSH "dig +short gauth.cent-solution.online 2>/dev/null || host gauth.cent-solution.online 2>/dev/null || echo 'no DNS tools'"

      - name: Direct SSH restart via GAUTH secrets
        env:
          GAUTH_HOST: ${{ secrets.GAUTH_HOST }}
          GAUTH_USER: ${{ secrets.GAUTH_USER }}
          GAUTH_SSH_KEY: ${{ secrets.GAUTH_SSH_KEY }}
        run: |
          if [ -z "$GAUTH_SSH_KEY" ]; then
            echo "GAUTH_SSH_KEY not set, skipping"
            exit 0
          fi

          echo "===== Trying direct SSH to gauth ====="
          echo "Host: $GAUTH_HOST"
          install -m 600 /dev/null /tmp/id_gauth
          printf '%s\n' "$GAUTH_SSH_KEY" > /tmp/id_gauth

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=60 -o BatchMode=yes \
            -i /tmp/id_gauth "${GAUTH_USER}@${GAUTH_HOST}" \
            "echo 'SSH OK'; uptime; sudo systemctl restart gauth; sleep 3; sudo systemctl status gauth --no-pager; sudo ss -tlnp | grep 4000" \
            2>&1 || echo "SSH FAILED (timeout or refused)"

          rm -f /tmp/id_gauth

      - name: Try restart via chamgyo hop
        run: |
          export SSHPASS=$(echo "$VPS_PASS_B64" | base64 -d)
          SSH="sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@$VPS_IP"

          echo "===== Install Hostinger CLI on chamgyo ====="
          $SSH "which pip3 && pip3 install --quiet hostinger-api 2>/dev/null || echo 'pip not available'"

          echo ""
          echo "===== Try curl to Hostinger API from chamgyo ====="
          $SSH "curl -sS -o /dev/null -w 'Hostinger API: HTTP %{http_code}\n' --max-time 10 https://developers.hostinger.com/api/vps/v1/virtual-machines -H 'Authorization: Bearer test' 2>&1 || echo 'HOSTINGER API UNREACHABLE'"

      - name: Verify gauth status
        run: |
          sleep 10
          echo "===== Final check ====="
          curl -sS -o /dev/null -w "gauth: HTTP %{http_code} | size %{size_download}\n" "https://gauth.cent-solution.online/" --max-time 15 2>&1 || echo "STILL DOWN"
          curl -sS -o /dev/null -w "API: HTTP %{http_code}\n" "https://gauth.cent-solution.online/photo/api_selected_room.php?ch=01" --max-time 15 2>&1 || echo "API STILL DOWN"
