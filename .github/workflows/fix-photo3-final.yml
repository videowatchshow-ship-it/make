name: Fix photo3 PRISM final

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Strip photo3 to match photo structure
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 180s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='
            CAH="/var/www/sites/chamgyo/public/photo3/CAH_1.html"
            REF="/var/www/sites/chamgyo/public/photo/CAH_1.html"

            sudo cp "$CAH" "${CAH}.bak.strip.$(date +%s)"

            echo "===== REMOVE non-essential scripts ====="
            sudo sed -i "/<script id=.chamgyo-mobile-fit-js.>/,/<\/script>/d" "$CAH"
            sudo sed -i "/<script id=.homoglyph-js.>/,/<\/script>/d" "$CAH"

            echo "===== REMOVE non-essential styles ====="
            sudo sed -i "/<style id=.photo-center-align.>/,/<\/style>/d" "$CAH"
            sudo sed -i "/<style id=.photo-no-miniview.>/,/<\/style>/d" "$CAH"
            sudo sed -i "/<style id=.chamgyo-mobile-fit.>/,/<\/style>/d" "$CAH"
            sudo sed -i "/<style id=.marquee-blur-css.>/,/<\/style>/d" "$CAH"
            sudo sed -i "/<style id=.anti-ocr-css.>/,/<\/style>/d" "$CAH"
            sudo sed -i "/<style id=.three-fix-css.>/,/<\/style>/d" "$CAH"

            echo "===== REMOVE bundle.js and hot-patch.js ====="
            sudo sed -i "/modules\/dist\/bundle\.js/d" "$CAH"
            sudo sed -i "/hot-patch\.js/d" "$CAH"

            echo "===== REMOVE zoom refs ====="
            sudo sed -i "/style\.zoom/d" "$CAH"

            echo "===== REMOVE photo-center-align comment ====="
            sudo sed -i "/photo-center-align removed/d" "$CAH"

            echo "===== FIX height auto ====="
            sudo sed -i "s/height: auto !important/height: 100vh !important/g" "$CAH"

            echo "===== CLEAN empty lines ====="
            sudo sed -i "/^$/N;/^\n$/d" "$CAH"

            echo "===== VERIFY ====="
            echo "--- scripts remaining ---"
            grep -n "<script" "$CAH" | head -15
            echo "--- styles remaining ---"
            grep -n "<style" "$CAH" | head -10
            echo "--- photo scripts (reference) ---"
            grep -n "<script" "$REF" | head -10
            echo "--- body CSS ---"
            grep -n "body{" "$CAH" | head -5
            echo "--- zoom ---"
            grep -c "zoom" "$CAH" || echo "0"
            echo "--- file size ---"
            wc -c "$CAH"
            wc -c "$REF"

            sudo apachectl configtest 2>&1
            sudo systemctl reload apache2 2>&1 || echo "reload failed"

            echo "--- curl test ---"
            curl -sI "http://localhost/photo3/CAH_1.html?ch=tak" | head -3
            curl -s "http://localhost/photo3/CAH_1.html?ch=tak" | wc -c
            echo "===== DONE ====="
            '

      - name: Verify external
        if: always()
        run: |
          sleep 5
          BODY=$(curl -s "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak&_t=$(date +%s)" 2>/dev/null)
          echo "Size: $(echo "$BODY" | wc -c)"
          echo "$BODY" | grep -o "body{[^}]*}" | head -3
          echo "$BODY" | grep -q "bundle\.js" && echo "FAIL: bundle.js" || echo "OK: no bundle.js"
          echo "$BODY" | grep -q "hot-patch" && echo "FAIL: hot-patch" || echo "OK: no hot-patch"
          echo "$BODY" | grep -q "zoom" && echo "FAIL: zoom" || echo "OK: no zoom"
          echo "$BODY" | grep -q "bgl\.js" && echo "OK: bgl.js present" || echo "FAIL: bgl.js missing"
          echo "$BODY" | grep -q "dragon_fx" && echo "OK: dragon_fx present" || echo "FAIL: dragon_fx missing"
          curl -so /dev/null -w "HTTP: %{http_code}\n" "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak" 2>/dev/null
