name: Fix photo3 PRISM final

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aggressive fix for PRISM WKWebView
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 180s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='
            CAH="/var/www/sites/chamgyo/public/photo3/CAH_1.html"
            REF="/var/www/sites/chamgyo/public/photo/CAH_1.html"

            echo "===== BACKUP ====="
            sudo cp "$CAH" "${CAH}.bak.aggressive.$(date +%s)"

            echo "===== REMOVE mobile-fit-js entirely ====="
            sudo sed -i "/<script id=.chamgyo-mobile-fit-js.>/,/<\/script>/d" "$CAH"

            echo "===== REMOVE photo-center-align if still exists ====="
            sudo sed -i "/<style id=.photo-center-align.>/,/<\/style>/d" "$CAH"

            echo "===== REMOVE photo-no-miniview style ====="
            sudo sed -i "/<style id=.photo-no-miniview.>/,/<\/style>/d" "$CAH"

            echo "===== FIX all height:auto to 100vh ====="
            sudo sed -i "s/height: auto !important/height: 100vh !important/g" "$CAH"

            echo "===== REMOVE any remaining zoom refs ====="
            sudo sed -i "/style\.zoom/d" "$CAH"

            echo "===== REMOVE all added style blocks after body tag ====="
            sudo sed -i "/photo-center-align removed/d" "$CAH"

            echo "===== VERIFY REMAINING STRUCTURE ====="
            echo "--- zoom refs ---"
            grep -cn "zoom" "$CAH"
            echo "--- display flex refs ---"
            grep -n "display.*flex" "$CAH" | head -10
            echo "--- body overrides ---"
            grep -n "body{" "$CAH" | head -5
            echo "--- full_box ---"
            grep -n "full_box" "$CAH" | grep "height" | head -5
            echo "--- scripts ---"
            grep -n "<script" "$CAH" | head -20
            echo "--- styles ---"
            grep -n "<style" "$CAH" | head -10
            echo "--- photo reference body ---"
            grep -n "body{" "$REF" | head -3
            echo "--- photo reference scripts ---"
            grep -n "<script" "$REF" | head -10

            echo "===== APACHE RELOAD ====="
            sudo apachectl configtest 2>&1
            sudo systemctl reload apache2 2>&1 || echo "reload failed"

            echo "===== CURL TEST ====="
            curl -sI "http://localhost/photo3/CAH_1.html?ch=tak" | head -5
            echo "---"
            curl -s "http://localhost/photo3/CAH_1.html?ch=tak" | grep -o "body{[^}]*}" | head -3
            echo "---"
            curl -s "http://localhost/photo3/CAH_1.html?ch=tak" | grep -c "zoom" || echo "0 zoom"
            echo "===== DONE ====="
            '

      - name: Verify external
        if: always()
        run: |
          sleep 5
          BODY=$(curl -s "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak&_t=$(date +%s)" 2>/dev/null)
          echo "Size: $(echo "$BODY" | wc -c)"
          echo "$BODY" | grep -o "body{[^}]*}" | head -3
          echo "$BODY" | grep -q "display: flex.*align-items: center" && echo "FAIL: flex" || echo "OK: no body flex"
          echo "$BODY" | grep -q "style\.zoom" && echo "FAIL: zoom" || echo "OK: no zoom"
          echo "$BODY" | grep -q "chamgyo-mobile-fit" && echo "FAIL: mobile-fit" || echo "OK: no mobile-fit"
          curl -so /dev/null -w "HTTP: %{http_code}\n" "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak" 2>/dev/null
