name: Fix photo3 htaccess independent

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose and fix photo3 ONLY
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 300s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='
            P3="/var/www/sites/chamgyo/public/photo3"
            P1="/var/www/sites/chamgyo/public/photo"

            echo "===== [A] photo3 디렉토리 전체 ====="
            ls -la "$P3/"

            echo "===== [B] photo3/.htaccess 현재 내용 ====="
            cat "$P3/.htaccess" 2>/dev/null || echo "(없음)"

            echo "===== [C] photo/.htaccess 현재 내용 (참고용) ====="
            cat "$P1/.htaccess" 2>/dev/null || echo "(없음)"

            echo "===== [D] photo3 심볼릭 링크 상태 ====="
            find "$P3" -maxdepth 1 -type l -exec ls -la {} \;

            echo "===== [E] photo3 CAH_1.html md5 ====="
            md5sum "$P3/CAH_1.html" 2>/dev/null

            echo "===== [F] photo CAH_1.html md5 ====="
            md5sum "$P1/CAH_1.html" 2>/dev/null

            echo "===== [G] photo3 응답 크기 + 헤더 (localhost) ====="
            curl -sI "http://localhost/photo3/CAH_1.html?ch=tak" 2>/dev/null

            echo "===== [H] photo 응답 크기 + 헤더 (localhost) ====="
            curl -sI "http://localhost/photo/CAH_1.html?ch=tak" 2>/dev/null

            echo "===== [I] photo3 응답 본문 크기 ====="
            curl -s "http://localhost/photo3/CAH_1.html?ch=tak" 2>/dev/null | wc -c

            echo "===== [J] photo 응답 본문 크기 ====="
            curl -s "http://localhost/photo/CAH_1.html?ch=tak" 2>/dev/null | wc -c

            echo "===== [K] photo3 응답 첫 5줄 ====="
            curl -s "http://localhost/photo3/CAH_1.html?ch=tak" 2>/dev/null | head -5

            echo "===== [L] photo 응답 첫 5줄 ====="
            curl -s "http://localhost/photo/CAH_1.html?ch=tak" 2>/dev/null | head -5

            echo "===== [M] photo3 응답 마지막 30줄 ====="
            curl -s "http://localhost/photo3/CAH_1.html?ch=tak" 2>/dev/null | tail -30

            echo "===== [N] photo 응답 마지막 30줄 ====="
            curl -s "http://localhost/photo/CAH_1.html?ch=tak" 2>/dev/null | tail -30

            echo "===== [O] photo3 body CSS 추출 ====="
            curl -s "http://localhost/photo3/CAH_1.html?ch=tak" 2>/dev/null | grep -o "body{[^}]*}" | head -5
            curl -s "http://localhost/photo3/CAH_1.html?ch=tak" 2>/dev/null | grep -o "body *{[^}]*}" | head -5

            echo "===== [P] photo body CSS 추출 ====="
            curl -s "http://localhost/photo/CAH_1.html?ch=tak" 2>/dev/null | grep -o "body{[^}]*}" | head -5
            curl -s "http://localhost/photo/CAH_1.html?ch=tak" 2>/dev/null | grep -o "body *{[^}]*}" | head -5

            echo "===== [Q] photo3 vs photo 응답 diff ====="
            diff <(curl -s "http://localhost/photo3/CAH_1.html?ch=tak" 2>/dev/null) <(curl -s "http://localhost/photo/CAH_1.html?ch=tak" 2>/dev/null) | head -50 || echo "IDENTICAL"

            echo "===== [R] Apache vhost 중 photo3 관련 설정 ====="
            sudo grep -rn "photo3\|photo2\|photo/" /etc/apache2/sites-enabled/ 2>/dev/null | head -20

            echo "===== [S] Apache 모듈 상태 ====="
            sudo apachectl -M 2>/dev/null | grep -i "headers\|rewrite\|expires\|php" | head -10

            echo "===== [T] PHP 처리 확인 (photo3 vs photo) ====="
            echo "photo3 content-type:"
            curl -sI "http://localhost/photo3/CAH_1.html?ch=tak" 2>/dev/null | grep -i content-type
            echo "photo content-type:"
            curl -sI "http://localhost/photo/CAH_1.html?ch=tak" 2>/dev/null | grep -i content-type

            echo "===== [U] photo3 bgl.js 접근 ====="
            curl -sI "http://localhost/photo3/bgl.js" 2>/dev/null | head -5

            echo "===== [V] photo3 dragon_fx.js 접근 ====="
            curl -sI "http://localhost/photo3/dragon_fx.js" 2>/dev/null | head -5

            echo "===== [W] photo3 data/sel_tak.json 접근 ====="
            curl -sI "http://localhost/photo3/data/sel_tak.json" 2>/dev/null | head -5

            echo "===== [X] photo3 write.php 접근 ====="
            curl -sI "http://localhost/photo3/write.php" 2>/dev/null | head -5

            echo "===== [Y] photo3 hot-patch.js 접근 ====="
            curl -sI "http://localhost/photo3/hot-patch.js" 2>/dev/null | head -5

            echo "===== [Z] photo3 modules/dist/bundle.js 접근 ====="
            curl -sI "http://localhost/photo3/modules/dist/bundle.js" 2>/dev/null | head -5

            echo "===== DONE ====="
            '

      - name: External verify
        if: always()
        run: |
          sleep 5
          echo "=== photo3 외부 헤더 ==="
          curl -sI "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak&_t=$(date +%s)" 2>/dev/null
          echo ""
          echo "=== photo 외부 헤더 ==="
          curl -sI "https://xn--9d0bw2fjtyymch7de9d.info/photo/CAH_1.html?ch=tak&_t=$(date +%s)" 2>/dev/null
          echo ""
          echo "=== photo3 외부 응답 크기 ==="
          curl -s "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak&_t=$(date +%s)" 2>/dev/null | wc -c
          echo "=== photo 외부 응답 크기 ==="
          curl -s "https://xn--9d0bw2fjtyymch7de9d.info/photo/CAH_1.html?ch=tak&_t=$(date +%s)" 2>/dev/null | wc -c
          echo ""
          echo "=== CORS 확인 ==="
          H=$(curl -sI "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak&_t=$(date +%s)" 2>/dev/null)
          echo "$H" | grep -i "access-control" && echo "FAIL" || echo "OK: CORS 없음"
          echo "$H" | grep -i "x-photo3" && echo "FAIL" || echo "OK: 커스텀헤더 없음"
          echo ""
          echo "=== photo3 vs photo 외부 응답 diff ==="
          diff <(curl -s "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak&_t=$(date +%s)" 2>/dev/null) <(curl -s "https://xn--9d0bw2fjtyymch7de9d.info/photo/CAH_1.html?ch=tak&_t=$(date +%s)" 2>/dev/null) | head -30 || echo "IDENTICAL"
