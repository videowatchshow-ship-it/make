name: Fix photo3 PRISM final

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy photo to photo3 exactly (no tak guard)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 180s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='
            P3="/var/www/sites/chamgyo/public/photo3"
            P1="/var/www/sites/chamgyo/public/photo"

            echo "===== COPY EVERYTHING FROM PHOTO ====="
            sudo cp "$P1/CAH_1.html" "$P3/CAH_1.html"
            sudo cp "$P1/bgl.js" "$P3/bgl.js"
            sudo cp "$P1/dragon_fx.js" "$P3/dragon_fx.js"
            sudo chown www-data:www-data "$P3/CAH_1.html" "$P3/bgl.js" "$P3/dragon_fx.js"

            echo "===== VERIFY IDENTICAL ====="
            md5sum "$P3/CAH_1.html" "$P1/CAH_1.html"
            md5sum "$P3/bgl.js" "$P1/bgl.js"
            md5sum "$P3/dragon_fx.js" "$P1/dragon_fx.js"
            diff "$P1/CAH_1.html" "$P3/CAH_1.html" && echo "FILES IDENTICAL" || echo "FILES DIFFER"

            echo "===== APACHE ====="
            sudo apachectl configtest 2>&1
            sudo systemctl reload apache2 2>&1 || echo "reload failed"

            echo "===== CURL TEST ====="
            curl -s "http://localhost/photo3/CAH_1.html?ch=tak" | wc -c
            curl -s "http://localhost/photo/CAH_1.html?ch=tak" | wc -c
            curl -s "http://localhost/photo3/CAH_1.html" | wc -c
            curl -s "http://localhost/photo/CAH_1.html" | wc -c
            echo "===== DONE ====="
            '

      - name: Purge Cloudflare cache for photo3
        run: |
          echo "=== Purging photo3 from Cloudflare cache ==="
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html","https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak","https://xn--9d0bw2fjtyymch7de9d.info/photo3/bgl.js","https://xn--9d0bw2fjtyymch7de9d.info/photo3/bgl.js?v=52","https://xn--9d0bw2fjtyymch7de9d.info/photo3/dragon_fx.js","https://xn--9d0bw2fjtyymch7de9d.info/photo3/dragon_fx.js?v=14"]}'
          echo ""
          echo "=== Purging everything ==="
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

      - name: Verify after purge
        if: always()
        run: |
          sleep 8
          P3=$(curl -s "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak&_t=$(date +%s)" 2>/dev/null)
          P1=$(curl -s "https://xn--9d0bw2fjtyymch7de9d.info/photo/CAH_1.html?ch=tak&_t=$(date +%s)" 2>/dev/null)
          echo "photo3 size: $(echo "$P3" | wc -c)"
          echo "photo size: $(echo "$P1" | wc -c)"
          echo "$P3" | grep -q "bgl\.js" && echo "OK: bgl.js" || echo "FAIL: no bgl.js"
          echo "$P3" | grep -q "dragon_fx" && echo "OK: dragon_fx" || echo "FAIL: no dragon_fx"
          curl -so /dev/null -w "photo3 HTTP: %{http_code}\n" "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak" 2>/dev/null
          curl -so /dev/null -w "photo HTTP: %{http_code}\n" "https://xn--9d0bw2fjtyymch7de9d.info/photo/CAH_1.html?ch=tak" 2>/dev/null
