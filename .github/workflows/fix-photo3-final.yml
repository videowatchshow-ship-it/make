name: Fix photo3 PRISM final

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose photo3 PRISM issue
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 180s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='
            P3="/var/www/sites/chamgyo/public/photo3"
            P1="/var/www/sites/chamgyo/public/photo"

            echo "===== [1] write.php content ====="
            cat "$P3/write.php"

            echo "===== [2] write.php output (curl) ====="
            curl -s "http://localhost/photo3/write.php"

            echo "===== [3] photo3 CAH_1.html first 20 lines ====="
            head -20 "$P3/CAH_1.html"

            echo "===== [4] photo CAH_1.html first 20 lines ====="
            head -20 "$P1/CAH_1.html"

            echo "===== [5] photo3 lines around body tag ====="
            grep -n "<body\|</body\|<script\|</script\|<head\|</head" "$P3/CAH_1.html"

            echo "===== [6] photo lines around body tag ====="
            grep -n "<body\|</body\|<script\|</script\|<head\|</head" "$P1/CAH_1.html"

            echo "===== [7] file sizes ====="
            wc -c "$P3/CAH_1.html" "$P1/CAH_1.html"
            md5sum "$P3/CAH_1.html" "$P1/CAH_1.html"

            echo "===== [8] photo3 curl WITHOUT ch=tak ====="
            curl -s "http://localhost/photo3/CAH_1.html" | head -5
            curl -s "http://localhost/photo3/CAH_1.html" | wc -c

            echo "===== [9] photo3 curl WITH ch=tak ====="
            curl -s "http://localhost/photo3/CAH_1.html?ch=tak" | head -5
            curl -s "http://localhost/photo3/CAH_1.html?ch=tak" | wc -c

            echo "===== [10] photo curl (no ch param) ====="
            curl -s "http://localhost/photo/CAH_1.html" | head -5
            curl -s "http://localhost/photo/CAH_1.html" | wc -c

            echo "===== [11] symlinks and data ====="
            ls -la "$P3/data" "$P3/bgl.js" "$P3/dragon_fx.js" 2>&1
            ls -la "$P1/data" "$P1/bgl.js" "$P1/dragon_fx.js" 2>&1

            echo "===== [12] photo write.php ====="
            cat "$P1/write.php" 2>/dev/null || echo "NO write.php in photo"

            echo "===== DONE ====="
            '

      - name: Verify external
        if: always()
        run: |
          sleep 5
          P3=$(curl -s "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak&_t=$(date +%s)" 2>/dev/null)
          P1=$(curl -s "https://xn--9d0bw2fjtyymch7de9d.info/photo/CAH_1.html?ch=tak&_t=$(date +%s)" 2>/dev/null)
          echo "photo3 size: $(echo "$P3" | wc -c)"
          echo "photo size: $(echo "$P1" | wc -c)"
          echo "$P3" | grep -q "photo3-tak-only" && echo "OK: tak guard" || echo "FAIL: no tak guard"
          echo "$P3" | grep -q "bgl\.js" && echo "OK: bgl.js" || echo "FAIL: no bgl.js"
          echo "$P3" | grep -q "dragon_fx" && echo "OK: dragon_fx" || echo "FAIL: no dragon_fx"
          curl -so /dev/null -w "photo3 HTTP: %{http_code}\n" "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak" 2>/dev/null
          curl -so /dev/null -w "photo HTTP: %{http_code}\n" "https://xn--9d0bw2fjtyymch7de9d.info/photo/CAH_1.html?ch=tak" 2>/dev/null
