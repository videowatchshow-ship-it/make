name: Fix photo3 htaccess independent

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deep photo3 path check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 300s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='
            P3="/var/www/sites/chamgyo/public/photo3"
            P1="/var/www/sites/chamgyo/public/photo"

            echo "===== [1] photo3/.user.ini ====="
            cat "$P3/.user.ini" 2>/dev/null || echo "(없음)"

            echo "===== [2] photo/.user.ini ====="
            cat "$P1/.user.ini" 2>/dev/null || echo "(없음)"

            echo "===== [3] photo3 CAH_1.html 전체 (raw 8KB) ====="
            cat "$P3/CAH_1.html"

            echo "===== [4] photo CAH_1.html 전체 (raw 8KB) ====="
            cat "$P1/CAH_1.html"

            echo "===== [5] photo3 bgl.js 첫 30줄 ====="
            head -30 "$P3/bgl.js"

            echo "===== [6] photo bgl.js 첫 30줄 ====="
            head -30 "$P1/bgl.js"

            echo "===== [7] photo3 경로 참조 grep ====="
            grep -n "photo3\|photo2\|/photo/" "$P3/CAH_1.html" || echo "경로 참조 없음"

            echo "===== [8] photo 경로 참조 grep ====="
            grep -n "photo3\|photo2\|/photo/" "$P1/CAH_1.html" || echo "경로 참조 없음"

            echo "===== [9] photo3 script src 경로 ====="
            grep -oi "src=[\"'"'"'][^\"'"'"']*[\"'"'"']" "$P3/CAH_1.html" | head -20

            echo "===== [10] photo script src 경로 ====="
            grep -oi "src=[\"'"'"'][^\"'"'"']*[\"'"'"']" "$P1/CAH_1.html" | head -20

            echo "===== [11] PHP error log photo3 관련 ====="
            sudo tail -50 /var/log/apache2/error.log 2>/dev/null | grep -i "photo3" | tail -10 || echo "없음"

            echo "===== [12] photo3 index.php 내용 ====="
            cat "$P3/index.php" 2>/dev/null || echo "(없음)"

            echo "===== [13] photo index.php 내용 ====="
            cat "$P1/index.php" 2>/dev/null || echo "(없음)"

            echo "===== [14] photo3 session_conf.php ====="
            cat "$P3/session_conf.php" 2>/dev/null || echo "(없음)"

            echo "===== [15] photo session_conf.php ====="
            cat "$P1/session_conf.php" 2>/dev/null || echo "(없음)"

            echo "===== [16] photo3 login.php 첫 20줄 ====="
            head -20 "$P3/login.php" 2>/dev/null || echo "(없음)"

            echo "===== [17] photo login.php 첫 20줄 ====="
            head -20 "$P1/login.php" 2>/dev/null || echo "(없음)"

            echo "===== [18] photo3 auth_check.php ====="
            cat "$P3/auth_check.php" 2>/dev/null || echo "(없음)"

            echo "===== [19] photo auth_check.php ====="
            cat "$P1/auth_check.php" 2>/dev/null || echo "(없음)"

            echo "===== [20] Cloudflare external - photo3 raw content check ====="
            curl -s "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak&_t=deepcheck" 2>/dev/null | md5sum

            echo "===== [21] Cloudflare external - photo raw content check ====="
            curl -s "https://xn--9d0bw2fjtyymch7de9d.info/photo/CAH_1.html?ch=tak&_t=deepcheck" 2>/dev/null | md5sum

            echo "===== [22] photo3 write.php 첫 30줄 (session guard?) ====="
            head -30 "$P3/write.php" 2>/dev/null

            echo "===== [23] photo write.php 첫 30줄 ====="
            head -30 "$P1/write.php" 2>/dev/null

            echo "===== [24] photo3 write.php bgl.js 버전 ====="
            grep -n "bgl.js" "$P3/write.php" | head -5

            echo "===== [25] photo write.php bgl.js 버전 ====="
            grep -n "bgl.js" "$P1/write.php" | head -5

            echo "===== DONE ====="
            '
