name: Fix photo3 PRISM final

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix remaining CSS issues for WKWebView
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 180s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='
            CAH="/var/www/sites/chamgyo/public/photo3/CAH_1.html"

            echo "===== BEFORE ====="
            grep -n "photo-center-align" "$CAH" | head -5
            grep -n "height: auto" "$CAH" | head -5
            grep -n "style.zoom" "$CAH" | head -5

            sudo cp "$CAH" "${CAH}.bak.final.$(date +%s)"

            echo "===== FIX 1: Remove photo-center-align style block ====="
            sudo sed -i "/<style id=.photo-center-align.>/,/<\/style>/d" "$CAH"

            echo "===== FIX 2: Fix full_box height auto to 100vh ====="
            sudo sed -i "s/height: auto !important/height: 100vh !important/g" "$CAH"

            echo "===== FIX 3: Replace zoom with transform scale ====="
            sudo sed -i "s|document\.body\.style\.zoom = ratio|document.body.style.transform=\"scale(\"+ratio+\")\";document.body.style.transformOrigin=\"0 0\";document.body.style.width=(100/ratio)+\"%\"|g" "$CAH"

            echo "===== AFTER ====="
            grep -n "photo-center-align" "$CAH" | head -3 || echo "center-align REMOVED"
            grep -n "height: auto" "$CAH" | head -3 || echo "height-auto FIXED"
            grep -n "style.zoom\|style.transform" "$CAH" | head -5
            grep -n "body{" "$CAH" | head -5
            grep -n "full_box" "$CAH" | grep "height" | head -5

            echo "===== APACHE RELOAD ====="
            sudo apachectl configtest 2>&1
            sudo systemctl reload apache2 2>&1 || echo "reload failed"

            echo "===== VERIFY ====="
            curl -sI "http://localhost/photo3/CAH_1.html?ch=tak" | head -5
            echo "---body---"
            curl -s "http://localhost/photo3/CAH_1.html?ch=tak" | grep -o "body{[^}]*}" | head -3
            echo "---flex-check---"
            curl -s "http://localhost/photo3/CAH_1.html?ch=tak" | grep -c "display: flex" || echo "0"
            echo "===== DONE ====="
            '

      - name: Verify external
        if: always()
        run: |
          sleep 5
          BODY=$(curl -s "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak&_t=$(date +%s)" 2>/dev/null)
          echo "Size: $(echo "$BODY" | wc -c)"
          echo "$BODY" | grep -o "body{[^}]*}" | head -3
          echo "$BODY" | grep -q "display: flex.*align-items: center" && echo "FAIL: flex" || echo "OK: flex removed"
          echo "$BODY" | grep -q "height: auto !important" && echo "FAIL: height auto" || echo "OK: height fixed"
          curl -so /dev/null -w "HTTP: %{http_code}\n" "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak" 2>/dev/null
