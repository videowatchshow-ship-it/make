name: Fix photo3 htaccess independent

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write photo3-specific htaccess
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 180s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='
            P3="/var/www/sites/chamgyo/public/photo3"

            echo "===== CURRENT photo3/.htaccess ====="
            cat "$P3/.htaccess"

            echo "===== BACKUP ====="
            sudo cp "$P3/.htaccess" "$P3/.htaccess.bak.$(date +%s)"

            echo "===== WRITE photo3-specific .htaccess ====="
            sudo tee "$P3/.htaccess" > /dev/null << '"'"'HTEOF'"'"'
            Options +FollowSymLinks

            <FilesMatch "^(CAW_[0-9]+|CAH_[0-9]+)\.html$">
              Header set Cache-Control "no-cache, no-store, must-revalidate"
              Header set Pragma "no-cache"
              Header set Expires "0"
            </FilesMatch>

            <FilesMatch "^bgl\.js$">
              Header set Cache-Control "no-cache, no-store, must-revalidate"
            </FilesMatch>

            <FilesMatch "^(api_selected_room|write_select_room|write)\.php$">
              Header set Cache-Control "no-cache, no-store, must-revalidate"
              Header set Pragma "no-cache"
              Header set Expires "0"
            </FilesMatch>
            HTEOF
            sudo chown www-data:www-data "$P3/.htaccess"
            sudo chmod 644 "$P3/.htaccess"

            echo "===== NEW photo3/.htaccess ====="
            cat "$P3/.htaccess"

            echo "===== APACHE RELOAD ====="
            sudo apachectl configtest 2>&1
            sudo systemctl reload apache2 2>&1

            echo "===== VERIFY ====="
            echo "--- photo3 headers ---"
            curl -sI "http://localhost/photo3/CAH_1.html?ch=tak" | head -20
            echo "--- photo headers ---"
            curl -sI "http://localhost/photo/CAH_1.html?ch=tak" | head -20
            echo "--- CORS check ---"
            curl -sI "http://localhost/photo3/CAH_1.html?ch=tak" | grep -i "access-control\|x-photo3" && echo "FAIL" || echo "OK: no extra headers"
            echo "--- symlink check ---"
            curl -sI "http://localhost/photo3/data/sel_tak.json" | head -3
            echo "===== DONE ====="
            '

      - name: Verify external
        if: always()
        run: |
          sleep 5
          echo "=== photo3 ==="
          curl -sI "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak&_t=$(date +%s)" 2>/dev/null
          echo ""
          echo "=== CORS gone? ==="
          H=$(curl -sI "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak&_t=$(date +%s)" 2>/dev/null)
          echo "$H" | grep -i "access-control" && echo "FAIL" || echo "OK"
          echo "$H" | grep -i "x-photo3" && echo "FAIL" || echo "OK"
