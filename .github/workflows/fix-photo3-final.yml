name: Fix photo3 htaccess to match photo

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace photo3 htaccess with photo htaccess
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 180s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='
            P3="/var/www/sites/chamgyo/public/photo3"
            P1="/var/www/sites/chamgyo/public/photo"

            echo "===== BEFORE ====="
            echo "--- photo3/.htaccess ---"
            cat "$P3/.htaccess"
            echo "--- photo/.htaccess ---"
            cat "$P1/.htaccess"

            echo "===== BACKUP photo3/.htaccess ====="
            sudo cp "$P3/.htaccess" "$P3/.htaccess.bak.$(date +%s)"

            echo "===== REPLACE photo3/.htaccess with photo/.htaccess ====="
            sudo cp "$P1/.htaccess" "$P3/.htaccess"
            sudo chown www-data:www-data "$P3/.htaccess"
            sudo chmod 644 "$P3/.htaccess"

            echo "===== AFTER ====="
            echo "--- photo3/.htaccess (now) ---"
            cat "$P3/.htaccess"
            echo "--- diff ---"
            diff "$P3/.htaccess" "$P1/.htaccess" && echo "IDENTICAL" || echo "DIFFER"

            echo "===== APACHE RELOAD ====="
            sudo apachectl configtest 2>&1
            sudo systemctl reload apache2 2>&1

            echo "===== VERIFY HEADERS ====="
            echo "--- photo3 ---"
            curl -sI "http://localhost/photo3/CAH_1.html?ch=tak" | head -20
            echo "--- photo ---"
            curl -sI "http://localhost/photo/CAH_1.html?ch=tak" | head -20

            echo "===== DONE ====="
            '

      - name: Verify external headers match
        if: always()
        run: |
          sleep 5
          echo "=== photo3 external headers ==="
          curl -sI "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak&_t=$(date +%s)" 2>/dev/null
          echo ""
          echo "=== photo external headers ==="
          curl -sI "https://xn--9d0bw2fjtyymch7de9d.info/photo/CAH_1.html?ch=tak&_t=$(date +%s)" 2>/dev/null
          echo ""
          echo "=== HEADER DIFF ==="
          diff <(curl -sI "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak&_t=$(date +%s)" 2>/dev/null | grep -iv "cf-ray\|report-to\|nel:\|date:\|last-modified\|alt-svc" | sort) <(curl -sI "https://xn--9d0bw2fjtyymch7de9d.info/photo/CAH_1.html?ch=tak&_t=$(date +%s)" 2>/dev/null | grep -iv "cf-ray\|report-to\|nel:\|date:\|last-modified\|alt-svc" | sort) && echo "HEADERS NOW IDENTICAL" || echo "HEADERS STILL DIFFER"
          echo ""
          echo "=== CORS CHECK (should be gone from photo3) ==="
          H=$(curl -sI "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak&_t=$(date +%s)" 2>/dev/null)
          echo "$H" | grep -i "access-control" && echo "FAIL: CORS still present" || echo "OK: No CORS headers"
          echo "$H" | grep -i "x-photo3-fix" && echo "FAIL: custom header still present" || echo "OK: No custom header"
