name: Fix photo3 gap - render replace

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace render function - remove DPR scaling
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 300s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='
            P3="/var/www/sites/chamgyo/public/photo3"
            P1="/var/www/sites/chamgyo/public/photo"

            echo "===== BEFORE ====="
            echo "photo3: $(wc -c < "$P3/CAH_1.html") bytes"
            grep -c "_dpr\|_fit\|devicePixelRatio" "$P3/CAH_1.html" || echo "0 matches"

            echo "===== BACKUP ====="
            sudo cp "$P3/CAH_1.html" "$P3/CAH_1.html.bak.gap.$(date +%s)"

            echo "===== FIX: Python render replacement ====="
            sudo python3 - "$P3/CAH_1.html" "$P1/CAH_1.html" << "PYEOF"
import re, sys

p3_path = sys.argv[1]
p1_path = sys.argv[2]

with open(p3_path, "r") as f:
    p3 = f.read()
with open(p1_path, "r") as f:
    p1 = f.read()

m1 = re.search(r"(function render\(nums\)\{nums=nums\|\|\[\].*?render\(\[\]\);BGL\.start\(render\);)", p1, re.DOTALL)
if not m1:
    print("ERROR: render not found in photo")
    sys.exit(1)
simple = m1.group(1)
print("photo render: %d chars" % len(simple))

m3 = re.search(r"function render\(nums\)\{nums=nums\|\|\[\].*?render\(\[\]\);BGL\.start\(render\);", p3, re.DOTALL)
if not m3:
    print("ERROR: render not found in photo3")
    sys.exit(1)
print("photo3 render: %d chars" % len(m3.group(0)))

if "_dpr" in m3.group(0):
    print("CONFIRMED: photo3 has DPR scaling code")
else:
    print("WARNING: no DPR code found")

result = p3[:m3.start()] + simple + p3[m3.end():]
print("Result: %d -> %d bytes" % (len(p3), len(result)))

with open(p3_path, "w") as f:
    f.write(result)
print("WRITTEN OK")
PYEOF

            sudo chown www-data:www-data "$P3/CAH_1.html"
            sudo chmod 644 "$P3/CAH_1.html"

            echo "===== AFTER ====="
            echo "photo3: $(wc -c < "$P3/CAH_1.html") bytes"
            echo "photo:  $(wc -c < "$P1/CAH_1.html") bytes"
            echo "--- DPR references (should be 0) ---"
            grep -c "_dpr\|_fit\|devicePixelRatio" "$P3/CAH_1.html" || echo "0 — OK"
            echo "--- render function check ---"
            grep -o "function render(nums){[^}]*" "$P3/CAH_1.html" | head -1 | cut -c1-120
            echo "--- drawBead call ---"
            grep -o "BGL.drawBead[^;]*" "$P3/CAH_1.html" | head -1
            echo "--- photo3 extras still present ---"
            grep -c "shfOverlay\|OneStoreMobilePop\|api_img_ver\|isolation:isolate" "$P3/CAH_1.html"

            echo "===== APACHE RELOAD ====="
            sudo apachectl configtest 2>&1
            sudo systemctl reload apache2 2>&1

            echo "===== VERIFY ====="
            curl -sI "http://localhost/photo3/CAH_1.html?ch=tak" | head -3
            echo "photo3 size: $(curl -s "http://localhost/photo3/CAH_1.html?ch=tak" | wc -c)"
            echo "photo size:  $(curl -s "http://localhost/photo/CAH_1.html?ch=tak" | wc -c)"
            echo "===== DONE ====="
            '

      - name: External verify
        if: always()
        run: |
          sleep 5
          echo "=== External ==="
          SZ=$(curl -s "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak&_t=$(date +%s)" 2>/dev/null | wc -c)
          echo "photo3 size: $SZ"
          BODY=$(curl -s "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak&_t=$(date +%s)" 2>/dev/null)
          echo "$BODY" | grep -c "_dpr\|_fit\|devicePixelRatio" && echo "FAIL: DPR still present" || echo "OK: DPR removed"
          echo "$BODY" | grep -c "shfOverlay\|OneStoreMobilePop" && echo "OK: photo3 extras present" || echo "WARN: photo3 extras missing"
          echo "$BODY" | grep -o "BGL.drawBead[^;]*" | head -1
          STATUS=$(curl -so /dev/null -w '%{http_code}' "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak" 2>/dev/null)
          echo "HTTP: $STATUS"
