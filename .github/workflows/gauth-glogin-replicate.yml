name: gauth · replicate .info google login (verbatim JS + node dispatcher)

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-glogin-replicate.txt']

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Add node dispatcher route + header button + load unified JS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 150s
          script: |
            set -e
            F=/var/www/sites/gauth/public/index.html
            EX=/opt/gauth-full/rebrowser-login.js
            CID='956283750273-do3ebgq60vbi585r62ffpk0cqts8l634.apps.googleusercontent.com'

            echo '=== 0. ensure unified JS present on server ==='
            sudo ls -la /var/www/sites/gauth/public/core/auth/google-auth-unified.js || echo MISSING

            echo ''
            echo '=== 1. remove my earlier custom gsi-widget, add header button + gsi lib + unified js ==='
            sudo cp "$F" "$F.bak.glogin.$(date +%s)"
            sudo python3 - <<'PYEOF'
            import re
            f='/var/www/sites/gauth/public/index.html'
            s=open(f,encoding='utf-8').read()
            # remove previous custom widget blocks
            s=re.sub(r'<!-- gsi-widget start -->.*?<!-- gsi-widget end -->\n','',s,flags=re.S)
            # remove prior copy of this block if re-running
            s=re.sub(r'<!-- ginfo-login start -->.*?<!-- ginfo-login end -->\n','',s,flags=re.S)
            block=(
              '<!-- ginfo-login start -->\n'
              '<div id="g-signin-btn" style="position:fixed;top:12px;right:14px;z-index:100000"></div>\n'
              '<script src="https://accounts.google.com/gsi/client" async defer></script>\n'
              '<script src="/core/auth/google-auth-unified.js?v=gauth1"></script>\n'
              '<!-- ginfo-login end -->\n'
            )
            if '<body>' in s:
                s=s.replace('<body>','<body>\n'+block,1)
            else:
                s=block+s
            open(f,'w',encoding='utf-8').write(s)
            print('header button + unified js injected')
            PYEOF

            echo ''
            echo '=== 2. add Node dispatcher route /api/auth/google-auth-api.php (matches unified JS contract) ==='
            sudo cp "$EX" "$EX.bak.glogin.$(date +%s)"
            sudo python3 - <<'PYEOF'
            f='/opt/gauth-full/rebrowser-login.js'
            s=open(f,encoding='utf-8').read()
            if "/api/auth/google-auth-api.php" in s:
                print('dispatcher present, skipping')
            else:
                marker="app.get('/api/subsite-counts'"
                idx=s.index(marker)
                route=r'''
            // === .info-style unified Google login dispatcher (verbatim JS contract) ===
            function _ga_cookies(h){ var o={}; (h||'').split(';').forEach(function(p){ var i=p.indexOf('='); if(i>0){ o[p.slice(0,i).trim()]=decodeURIComponent(p.slice(i+1).trim()); } }); return o; }
            function _ga_users_read(){ try { return JSON.parse(require('fs').readFileSync('/opt/gauth-full/google_users.json','utf8')); } catch(e){ return []; } }
            function _ga_users_write(u){ require('fs').writeFileSync('/opt/gauth-full/google_users.json', JSON.stringify(u,null,2)); }
            function _ga_verify(credential){
              return new Promise(function(resolve,reject){
                var https=require('https');
                var url='https://oauth2.googleapis.com/tokeninfo?id_token='+encodeURIComponent(credential);
                https.get(url,function(r){ var d=''; r.on('data',function(c){d+=c;}); r.on('end',function(){ try{ resolve(JSON.parse(d)); }catch(e){ reject(e); } }); }).on('error',reject);
              });
            }
            function _ga_body(req){
              return new Promise(function(resolve){
                if(req.body && typeof req.body==='object'){ resolve(req.body); return; }
                var d=''; req.on('data',function(c){d+=c;}); req.on('end',function(){ try{ resolve(JSON.parse(d||'{}')); }catch(e){ resolve({}); } });
              });
            }
            async function _ga_handler(req,res){
              try {
                var CID=process.env.GOOGLE_OAUTH_CLIENT_ID||'956283750273-do3ebgq60vbi585r62ffpk0cqts8l634.apps.googleusercontent.com';
                var action=(req.query && req.query.action)||'';
                var body={};
                if(req.method==='POST'){ body=await _ga_body(req); action=body.action||action; }
                var cookies=_ga_cookies(req.headers.cookie);
                var users=_ga_users_read();

                if(action==='check_login' || action==='me'){
                  var sub=cookies.gauth_uid;
                  var u=sub && users.find(function(x){return x.sub===sub;});
                  if(u){ return res.json({ logged_in:true, success:true, user:{ sub:u.sub, email:u.email, name:u.name, profile_picture_url:u.picture||'', is_admin:!!u.is_admin, real_name:u.real_name||'', phone:u.phone||'' } }); }
                  return res.json({ logged_in:false, success:true, user:null });
                }

                if(action==='logout'){
                  res.setHeader('Set-Cookie','gauth_uid=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax');
                  return res.json({ success:true });
                }

                if(action==='login'){
                  var credential=body.credential;
                  if(!credential) return res.status(400).json({ success:false, msg:'missing credential' });
                  var info=await _ga_verify(credential);
                  if(info.error||info.error_description) return res.status(401).json({ success:false, msg:'token invalid' });
                  if(info.aud!==CID) return res.status(401).json({ success:false, msg:'aud mismatch' });
                  if(info.iss!=='https://accounts.google.com'&&info.iss!=='accounts.google.com') return res.status(401).json({ success:false, msg:'iss invalid' });
                  var existing=users.find(function(x){return x.sub===info.sub;});
                  var need_profile=false;
                  if(!existing){
                    existing={ sub:info.sub, email:info.email, name:info.name||'', picture:info.picture||'', created_at:new Date().toISOString(), last_login:new Date().toISOString() };
                    users.push(existing); need_profile=true;
                  } else {
                    existing.last_login=new Date().toISOString();
                    if(info.picture) existing.picture=info.picture;
                    if(info.name) existing.name=info.name;
                    if(!existing.real_name || !existing.phone) need_profile=true;
                  }
                  _ga_users_write(users);
                  res.setHeader('Set-Cookie','gauth_uid='+encodeURIComponent(existing.sub)+'; Path=/; Max-Age=315360000; HttpOnly; Secure; SameSite=Lax');
                  return res.json({ success:true, need_profile:need_profile, csrf_token:existing.sub, user:{ sub:existing.sub, email:existing.email, name:existing.name, profile_picture_url:existing.picture||'', is_admin:!!existing.is_admin } });
                }

                if(action==='save_profile'){
                  var sub2=(body.csrf_token)||cookies.gauth_uid;
                  var u2=sub2 && users.find(function(x){return x.sub===sub2;});
                  if(!u2) return res.status(401).json({ success:false, msg:'not logged in' });
                  u2.real_name=body.real_name||u2.real_name||'';
                  u2.phone=body.phone||u2.phone||'';
                  u2.bank_name=body.bank_name||u2.bank_name||'';
                  u2.account_number=body.account_number||u2.account_number||'';
                  u2.rrn=body.rrn||u2.rrn||'';
                  if(body.nickname) u2.name=body.nickname;
                  _ga_users_write(users);
                  return res.json({ success:true, ok:true });
                }

                return res.status(400).json({ success:false, msg:'unknown action' });
              } catch(e){ return res.status(500).json({ success:false, msg:String(e&&e.message||e) }); }
            }
            app.get('/api/auth/google-auth-api.php', _ga_handler);
            app.post('/api/auth/google-auth-api.php', _ga_handler);
            '''
                s=s[:idx]+route+'\n'+s[idx:]
                open(f,'w',encoding='utf-8').write(s)
                print('dispatcher route inserted')
            PYEOF

            echo ''
            echo '=== 3. syntax + env + restart ==='
            sudo node -c "$EX" && echo 'syntax OK'
            sudo mkdir -p /etc/systemd/system/gauth.service.d
            printf '[Service]\nEnvironment="GOOGLE_OAUTH_CLIENT_ID=%s"\n' "$CID" | sudo tee /etc/systemd/system/gauth.service.d/google-oauth.conf > /dev/null
            sudo systemctl daemon-reload
            sudo systemctl restart gauth
            sleep 2
            sudo systemctl is-active gauth

            echo ''
            echo '=== 4. live tests ==='
            curl -s --max-time 10 'http://localhost:4000/api/auth/google-auth-api.php?action=check_login'
            echo ''
            curl -s -o /dev/null -w 'unified js: %{http_code}\n' https://gauth.cent-solution.online/core/auth/google-auth-unified.js --max-time 10
            curl -s -o /dev/null -w 'main: %{http_code}\n' https://gauth.cent-solution.online/ --max-time 10
            echo 'button present:'
            curl -s --max-time 10 https://gauth.cent-solution.online/ | grep -c 'g-signin-btn' || echo 0
