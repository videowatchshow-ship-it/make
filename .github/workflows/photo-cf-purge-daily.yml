name: 참교육카지노 Cloudflare 캐시 일일 자동 purge (매일 새벽 5시 태국시간)
on:
  workflow_dispatch:
  schedule:
    # 05:00 ICT (UTC+7) == 22:00 UTC (전날)
    - cron: '0 22 * * *'
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-cf-purge-daily.yml'
jobs:
  daily-purge:
    runs-on: ubuntu-latest
    steps:
      - name: zone id 조회 (공식 API: GET /zones?name=...)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          echo "===== https://developers.cloudflare.com/api/operations/zones-get 공식 패턴 ====="
          curl -sS -X GET "https://api.cloudflare.com/client/v4/zones?name=xn--9d0bw2fjtyymch7de9d.info" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -o zone_lookup.json
          cat zone_lookup.json
          echo ""
          python3 -c "
          import json
          with open('zone_lookup.json') as f:
              d = json.load(f)
          ok = d.get('success')
          result = d.get('result') or []
          print('success:', ok)
          print('zone_count:', len(result))
          if result:
              print('zone_id:', result[0]['id'])
          "

      - name: purge_cache 실행 (공식 API: POST /zones/{zone_id}/purge_cache)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          REAL_ZONE_ID=$(curl -sS -X GET "https://api.cloudflare.com/client/v4/zones?name=xn--9d0bw2fjtyymch7de9d.info" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result') or []; print(r[0]['id'] if r else '')")

          if [ -z "$REAL_ZONE_ID" ]; then
            echo "zone id 조회 실패 - CLOUDFLARE_TOKEN 또는 CLOUDFLARE_ZONE_ID 시크릿이 비어있거나 잘못됨. purge 스킵."
            exit 0
          fi

          echo "조회된 zone id: $REAL_ZONE_ID"
          echo "===== https://developers.cloudflare.com/api/operations/zone-cache-purge 공식 패턴 ====="
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$REAL_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
          echo ""

      - name: 실측 검증 (cf-cache-status)
        run: |
          sleep 10
          DOM="xn--9d0bw2fjtyymch7de9d.info"
          echo "===== purge 후 CAH_1.html 캐시 상태 실측 ====="
          curl -sS -o /dev/null -D - "https://$DOM/photo/CAH_1.html?ch=cent" \
            | grep -Ei "^HTTP|cf-cache-status|date"
