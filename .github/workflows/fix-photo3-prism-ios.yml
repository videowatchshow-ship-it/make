name: Fix photo3 PRISM iOS rendering

on:
  workflow_dispatch:

jobs:
  fix-gcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auth to GCP
        id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
        continue-on-error: true

      - name: Setup gcloud
        if: steps.gcp_auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy fix via gcloud SSH
        if: steps.gcp_auth.outcome == 'success'
        run: |
          gcloud compute ssh videowatch_show@my-site-1 \
            --zone=asia-northeast1-a \
            --project=quantum-bonus-455522-b4 \
            --ssh-flag="-o StrictHostKeyChecking=no" \
            --command="bash -s" < photo3/fix-photo3-server.sh

      - name: Deploy fix via SSH key (fallback)
        if: steps.gcp_auth.outcome != 'success'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 34.104.233.35
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 120s
          script_file: photo3/fix-photo3-server.sh

      - name: Purge Cloudflare cache
        if: always()
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          ZONE="${CF_ZONE:-7e5faed2d3d4d6da7aceb4ddde81a62b}"
          if [ -z "$CF_TOKEN" ]; then
            echo "::warning::No CLOUDFLARE_TOKEN secret. Skipping purge."
            exit 0
          fi
          echo "Purging all CF cache..."
          curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' || echo "purge failed"
          echo "Done"

      - name: Verify endpoints
        if: always()
        run: |
          sleep 5
          echo "=== Verifying photo3 endpoints ==="
          for path in "photo3/CAH_1.html?ch=tak" "photo3/data/sel_tak.json" "photo3/hot-patch.js" "photo/CAH_1.html?ch=tak"; do
            echo "--- $path ---"
            STATUS=$(curl -so /dev/null -w '%{http_code}' "https://xn--9d0bw2fjtyymch7de9d.info/$path" 2>/dev/null || echo "FAIL")
            echo "HTTP $STATUS"
          done
