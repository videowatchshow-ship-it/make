name: Fix minhketthucdiemoi27484 password
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fix password on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 30s
          script: |
            set -e
            FILE="/opt/gauth-full/accounts_normalized.json"
            sudo python3 << 'PYEOF'
import json
with open("/opt/gauth-full/accounts_normalized.json") as f:
    data = json.load(f)
accts = data if isinstance(data, list) else data.get("accounts", [])
fixed = False
for a in accts:
    if "minhketthucdiemoi27484" in (a.get("email","") or "").lower():
        print("BEFORE:", json.dumps(a, ensure_ascii=False))
        a["password"] = "Trong666888"
        if "Trong666888" in a.get("password_alts", []):
            a["password_alts"].remove("Trong666888")
        print("AFTER:", json.dumps(a, ensure_ascii=False))
        fixed = True
        break
if not fixed:
    print("NOT FOUND")
    exit(1)
out = data if not isinstance(data, list) else accts
with open("/opt/gauth-full/accounts_normalized.json", "w") as f:
    json.dump(out, f, ensure_ascii=False, indent=2)
print("SAVED")
PYEOF
            sudo systemctl restart gauth
            sleep 2
            sudo systemctl is-active gauth && echo "OK" || { echo "FAIL"; exit 1; }
