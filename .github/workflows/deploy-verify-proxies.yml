name: Deploy and run proxy verifier
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-verify-proxies.yml']

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy proxy verifier to server and run
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 12m
          script: |
            set -e
            cd /opt/gauth-full
            mkdir -p lib/providers/proxy

            BASE="https://raw.githubusercontent.com/videowatchshow-ship-it/make/main/gauth/lib/providers/proxy"
            curl -fsSL "$BASE/verify_proxies.js" -o lib/providers/proxy/verify_proxies.js
            curl -fsSL "$BASE/fetch_free.js"     -o lib/providers/proxy/fetch_free.js

            if ! node -e "require('socks')" 2>/dev/null; then
              npm install socks --save 2>&1 | tail -3
            else
              echo "socks: $(node -e "console.log(require('socks/package.json').version)")"
            fi

            echo "=== verify_proxies.js 실행 ==="
            node lib/providers/proxy/verify_proxies.js

            echo ""
            echo "=== proxy_pool.json 결과 ==="
            node -e "
              var d = JSON.parse(require('fs').readFileSync('proxy_pool.json','utf8'));
              console.log('updated_at:', d.updated_at);
              console.log('total:', d.total);
              console.log('verified:', d.verified);
              console.log('target:', d.target);
              (d.proxies||[]).slice(0,5).forEach(function(p){ console.log(' ', p.server); });
            "
