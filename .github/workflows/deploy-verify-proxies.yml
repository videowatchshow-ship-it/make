name: Deploy and run proxy verifier
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-verify-proxies.yml'
      - 'gauth/lib/providers/proxy/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install socks
        run: npm install socks

      - name: Run proxy verifier
        run: |
          cd gauth/lib/providers/proxy
          node verify_proxies.js

      - name: Show results
        run: |
          node -e "
            var d = JSON.parse(require('fs').readFileSync('gauth/proxy_pool.json','utf8'));
            console.log('updated_at:', d.updated_at);
            console.log('total:', d.total);
            console.log('verified:', d.verified);
            console.log('target:', d.target);
            (d.proxies||[]).slice(0,5).forEach(function(p){ console.log(' ', p.server); });
          "

      - name: Commit proxy_pool.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gauth/proxy_pool.json
          git diff --cached --quiet || git commit -m "chore: update proxy_pool.json [skip ci]"
          git push
