name: Deploy and run proxy verifier
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */1 * * *'

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        env:
          HOME: C:\actions-runner
          GIT_CONFIG_NOSYSTEM: "1"

      - name: Install socks if needed
        shell: powershell -ExecutionPolicy Bypass -File "{0}"
        run: |
          $ErrorActionPreference = 'Continue'
          $npmCmds = @("npm", "C:\Program Files\nodejs\npm.cmd", "C:\nodejs\npm.cmd")
          $npm = $null
          foreach ($cmd in $npmCmds) {
            try { & $cmd --version 2>$null | Out-Null; $npm = $cmd; break } catch {}
          }
          if (-not $npm) { Write-Host "npm not found, skip"; exit 0 }
          $ok = node -e "require('socks')" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Installing socks..."
            & $npm install socks --prefix . 2>&1 | ForEach-Object { Write-Host $_ }
          } else {
            Write-Host "socks already available"
          }

      - name: Run proxy verifier
        shell: powershell -ExecutionPolicy Bypass -File "{0}"
        run: |
          Set-Location "gauth/lib/providers/proxy"
          node verify_proxies.js

      - name: Copy proxy_pool.json to CVAmp servers
        shell: powershell -ExecutionPolicy Bypass -File "{0}"
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE "gauth\proxy_pool.json"
          foreach ($port in @(5000, 6001)) {
            $dir = "E:\CVAmp_$port"
            if (Test-Path $dir) {
              Copy-Item $src "$dir\proxy_pool.json" -Force
              Write-Host "Copied to $dir"
            }
          }

      - name: Show results
        shell: powershell
        run: |
          $d = Get-Content "gauth\proxy_pool.json" | ConvertFrom-Json
          Write-Host "updated_at: $($d.updated_at)"
          Write-Host "total: $($d.total)"
          Write-Host "verified: $($d.verified)"
          Write-Host "target: $($d.target)"
          $d.proxies | Select-Object -First 5 | ForEach-Object { Write-Host " $($_.server)" }
