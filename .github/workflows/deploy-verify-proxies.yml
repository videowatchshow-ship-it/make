name: Deploy and run proxy verifier
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */1 * * *'

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install socks if needed
        shell: powershell
        run: |
          if (!(Test-Path "node_modules/socks")) {
            npm install socks
          }

      - name: Run proxy verifier
        shell: powershell
        run: |
          cd gauth/lib/providers/proxy
          node verify_proxies.js

      - name: Copy proxy_pool.json to CVAmp servers
        shell: powershell
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE "gauth\proxy_pool.json"
          $ports = @(5000, 6001, 6002, 6003)
          foreach ($port in $ports) {
            $dir = "E:\CVAmp_$port"
            if (Test-Path $dir) {
              Copy-Item $src "$dir\proxy_pool.json" -Force
              Write-Host "Copied to $dir"
            }
          }

      - name: Show results
        shell: powershell
        run: |
          $d = Get-Content "gauth\proxy_pool.json" | ConvertFrom-Json
          Write-Host "updated_at: $($d.updated_at)"
          Write-Host "total: $($d.total)"
          Write-Host "verified: $($d.verified)"
          Write-Host "target: $($d.target)"
          $d.proxies | Select-Object -First 5 | ForEach-Object { Write-Host " $($_.server)" }
