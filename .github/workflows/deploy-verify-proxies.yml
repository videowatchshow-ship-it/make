name: Deploy and run proxy verifier
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-verify-proxies.yml'
      - 'gauth/lib/providers/proxy/**'
      - 'gauth/auto_deploy.js'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy proxy files via HTTP API
        run: |
          set -e
          BASE="https://gauth.cent-solution.online"
          TOKEN="${{ secrets.GAUTH_API_TOKEN }}"

          echo "=== 1. Deploy proxy files ==="
          DEPLOY=$(curl -fsSL -X POST "$BASE/api/deploy" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"branch":"main"}')
          echo "$DEPLOY"
          echo "$DEPLOY" | node -e "
            var d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            if(!d.ok) { console.error('deploy failed'); process.exit(1); }
            console.log('deployed:', d.deployed.join(', '));
          "

          echo ""
          echo "=== 2. Run proxy verifier ==="
          RUN=$(curl -fsSL -X POST "$BASE/api/run-verify-proxies" \
            -H "Authorization: Bearer $TOKEN")
          echo "$RUN"

          echo ""
          echo "=== 3. Wait 90s for verification ==="
          sleep 90

          echo ""
          echo "=== 4. Check proxy_pool.json ==="
          curl -fsSL "$BASE/api/proxy-pool-status" \
            -H "Authorization: Bearer $TOKEN" || echo "status endpoint not yet available"
