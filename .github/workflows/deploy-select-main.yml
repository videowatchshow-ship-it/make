name: deploy-select-as-main
on:
  push:
    paths:
      - '.github/workflows/deploy-select-main.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_IP: "187.53.133.145"
      VPS_PASS_B64: "LWFhMGNLMDtibzJRNkxnMg=="
      CF_ZONE: "7e5faed2d3d4d6da7aceb4ddde81a62b"
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Deploy select.html as main index
        run: |
          export SSHPASS=$(echo "$VPS_PASS_B64" | base64 -d)
          SSH="sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@$VPS_IP"

          # Write base64 content and decode on server
          $SSH "echo '' | base64 -d > /var/www/sites/chamgyo/public/index.html"

          echo "== Verify =="
          $SSH "sha256sum /var/www/sites/chamgyo/public/index.html"
          $SSH "wc -c /var/www/sites/chamgyo/public/index.html"
          $SSH "head -6 /var/www/sites/chamgyo/public/index.html"

      - name: Purge CF cache
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' | jq .

      - name: Verify live site
        run: |
          sleep 5
          echo "== Direct VPS =="
          curl -sS -o /tmp/resp.html -w "HTTP %{http_code} | size %{size_download}" \
            "http://187.53.133.145/" && echo
          head -6 /tmp/resp.html
          echo ""
          echo "== Via CF domain =="
          curl -sS -o /tmp/resp2.html -w "HTTP %{http_code} | size %{size_download} | cf-cache: " \
            -H "User-Agent: Mozilla/5.0" \
            "https://xn--9d0bw2fjtyymch7de9d.info/" && echo
          head -6 /tmp/resp2.html
          echo ""
          SHA_VPS=$(sha256sum /tmp/resp.html | cut -d' ' -f1)
          SHA_CF=$(sha256sum /tmp/resp2.html | cut -d' ' -f1)
          echo "SHA256 VPS: $SHA_VPS"
          echo "SHA256  CF: $SHA_CF"
          if [ "$SHA_VPS" = "$SHA_CF" ]; then echo "MATCH OK"; else echo "MISMATCH"; fi
