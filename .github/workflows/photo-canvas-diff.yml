name: 우리뷰 vs fcj6 원본 canvas 픽셀 대조 + bgl.js drawBig 소스

on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-canvas-diff.yml'

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 300s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='bash -s' << "REMOTE"
            set +u
            P1="/var/www/sites/chamgyo/public/photo"

            echo "===== [1] bgl.js parseAll · bigRoad · drawBig 함수 소스 (렌더 로직) ====="
            sudo awk "/parseAll\s*[:=]/,/^};|^\}\)/" "$P1/bgl.js" | head -50
            echo "---"
            sudo awk "/bigRoad\s*[:=]/,/^\}\s*[,;]?$/" "$P1/bgl.js" | head -80
            echo "---"
            sudo awk "/drawBig\s*[:=]/,/^\}\s*[,;]?$/" "$P1/bgl.js" | head -80

            echo ""
            echo "===== [2] 지금 room_110 데이터 ====="
            sudo cat "$P1/data/room_110.json"

            echo ""
            echo "===== [3] Chromium/Playwright/Puppeteer 유무 확인 ====="
            which chromium chromium-browser google-chrome 2>/dev/null
            ls -la /opt/pw-browsers/chromium 2>/dev/null
            npm -g list 2>/dev/null | grep -iE "playwright|puppeteer" | head -3
            # 없으면 설치
            if ! which chromium chromium-browser google-chrome > /dev/null 2>&1 && [ ! -f /opt/pw-browsers/chromium ]; then
              echo "  Chromium 없음 → apt 로 설치 시도"
              sudo apt-get install -y chromium-browser 2>&1 | tail -3
            fi

            echo ""
            echo "===== [4] Puppeteer 로 fcj6 원본 + 우리 뷰 스크린샷 ====="
            WORK=/tmp/canvasdiff
            sudo rm -rf "$WORK" && mkdir -p "$WORK" && cd "$WORK"

            # Puppeteer 스크립트 (Chromium 우선)
            CHROMIUM=""
            for C in /opt/pw-browsers/chromium /usr/bin/chromium /usr/bin/chromium-browser /usr/bin/google-chrome; do
              [ -x "$C" ] && CHROMIUM="$C" && break
            done
            echo "  선택된 브라우저: $CHROMIUM"

            if [ -z "$CHROMIUM" ]; then
              echo "  ❌ 브라우저 없음 · 스크린샷 스킵"
            else
              # 헤드리스로 fcj6 열어서 3초 대기 후 스크린샷
              "$CHROMIUM" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
                --window-size=1920,1080 \
                --virtual-time-budget=8000 \
                --screenshot=$WORK/fcj6_110.png \
                "https://fcj6.oqogyf.com/?room_id=110" 2>&1 | tail -3
              sleep 1
              ls -la "$WORK/fcj6_110.png" 2>/dev/null

              # 우리 뷰
              "$CHROMIUM" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
                --window-size=1920,1080 \
                --virtual-time-budget=8000 \
                --screenshot=$WORK/our_snw.png \
                "https://xn--9d0bw2fjtyymch7de9d.info/photo/SNW_1.html?ch=cent&t=$(date +%s)" 2>&1 | tail -3
              sleep 1
              ls -la "$WORK/our_snw.png" 2>/dev/null

              echo "  스크린샷 파일 정보:"
              for F in fcj6_110.png our_snw.png; do
                [ -f "$WORK/$F" ] && echo "    $F: $(stat -c %s "$WORK/$F")B"
              done
            fi

            echo ""
            echo "===== [5] 스크린샷 base64 (작으면 표시) ====="
            for F in fcj6_110.png our_snw.png; do
              if [ -f "$WORK/$F" ]; then
                SZ=$(stat -c %s "$WORK/$F")
                echo ""
                echo "  --- $F ($SZ B) ---"
                if [ "$SZ" -lt "200000" ]; then
                  base64 -w 0 "$WORK/$F" | head -c 3000
                  echo ""
                  echo "  (truncated after 3000 chars)"
                else
                  echo "  (너무 큼, base64 스킵)"
                fi
              fi
            done

            echo ""
            echo "===== DONE ====="
            REMOTE
