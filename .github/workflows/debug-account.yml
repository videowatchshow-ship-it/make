name: Debug account data

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fix TOTP and verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 30s
          script: |
            cd /opt/gauth-full
            cp accounts_normalized.json accounts_normalized.json.bak
            python3 -c "import json; f=open('accounts_normalized.json'); data=json.load(f); f.close(); accts=data if isinstance(data,list) else data.get('accounts',[]); [a.update({'totp_secret':'KGM2DHJ7ZMKNIRO4TCFDVIB3EB63XZL7'}) for a in accts if 'addisonfjmzjocytsopzob' in (a.get('email','') or '').lower()]; f=open('accounts_normalized.json','w'); json.dump(data,f,indent=2,ensure_ascii=False); f.close(); print('UPDATE DONE')"
            echo "=== verify ==="
            python3 -c "import json; data=json.load(open('accounts_normalized.json')); accts=data if isinstance(data,list) else data.get('accounts',[]); matches=[a for a in accts if 'addisonfjmzjocytsopzob' in (a.get('email','') or '').lower()]; print('totp_secret:', matches[0].get('totp_secret','???') if matches else 'NOT FOUND')"
            sudo systemctl restart gauth
            sleep 2
            sudo systemctl is-active gauth && echo "gauth: OK" || echo "gauth: FAIL"
