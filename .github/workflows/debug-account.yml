name: Debug account data
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check account on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 30s
          script: |
            echo "=== paisley8unp0t3qgfiat4m account data ==="
            python3 -c "import json; data=json.load(open('/opt/gauth-full/accounts_normalized.json')); accts=data if isinstance(data,list) else data.get('accounts',[]); matches=[a for a in accts if 'paisley8unp0t3qgfiat4m' in (a.get('email','') or '').lower()]; print(json.dumps(matches[0], indent=2, ensure_ascii=False) if matches else 'NOT FOUND')"
            echo ""
            echo "=== server time ==="
            date -u
