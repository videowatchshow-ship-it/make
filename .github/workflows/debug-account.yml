name: Debug account data
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check account on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 30s
          script: |
            echo "=== addisonfjmzjocytsopzob account data ==="
            python3 -c "
import json
with open('/opt/gauth-full/accounts_normalized.json') as f:
    data = json.load(f)
    accts = data if isinstance(data, list) else data.get('accounts', [])
for a in accts:
    if 'addisonfjmzjocytsopzob' in (a.get('email','') or '').lower():
        print(json.dumps(a, indent=2, ensure_ascii=False))
        break
else:
    print('NOT FOUND')
"
