name: gauth · swap app-password columns (broadened regex)

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-excel-fix.txt']

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Renormalize with broadened app-pw regex
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 120s
          script: |
            set -e
            DB=/opt/gauth-full/accounts_normalized.json
            TS=$(date +%s)
            sudo cp $DB $DB.bak.$TS

            sudo python3 - <<'PYEOF'
            import json, re
            DB = '/opt/gauth-full/accounts_normalized.json'
            d = json.load(open(DB, encoding='utf-8'))
            arr = d if isinstance(d, list) else d.get('accounts', [])

            # broadened: 4 or more groups of 4 lowercase alnum separated by whitespace
            APP_PW = re.compile(r'^([a-z0-9]{4}\s+){3,}[a-z0-9]{4}$', re.I)
            YT_URL = re.compile(r'(?:https?://)?(?:www\.|m\.)?(?:youtube\.com|youtu\.be)/', re.I)
            URL_ANY = re.compile(r'^https?://', re.I)
            KO_ONLY = re.compile(r'^[가-힣\s]+$')  # pure Korean = nickname

            swapped = 0; pw_fill = 0
            for a in arr:
                if not isinstance(a, dict): continue
                yurl = (a.get('youtube_url') or '').strip()
                pw   = (a.get('password') or '').strip()
                extras = a.get('extra') or []
                if isinstance(extras, str): extras = [extras]

                # Case 1: youtube_url is an app-password
                if APP_PW.match(yurl):
                    real_url = ''
                    for i, x in enumerate(extras):
                        if isinstance(x, str) and YT_URL.search(x):
                            real_url = x.strip(); extras.pop(i); break
                    if not real_url:
                        for i, x in enumerate(extras):
                            if isinstance(x, str) and URL_ANY.match(x.strip()):
                                real_url = x.strip(); extras.pop(i); break
                    if pw and (KO_ONLY.match(pw) or len(pw) <= 8):
                        a['nickname'] = pw
                        if pw not in extras: extras.append(pw)
                    a['password'] = yurl
                    a['youtube_url'] = real_url
                    a['extra'] = extras
                    swapped += 1
                    continue

                # Case 2: password is Korean nickname AND app-pw is somewhere in extras/password_alts
                if pw and KO_ONLY.match(pw):
                    pool = list(extras) + list(a.get('password_alts') or [])
                    ap = ''
                    for x in pool:
                        if isinstance(x, str) and APP_PW.match(x.strip()):
                            ap = x.strip(); break
                    if ap:
                        a['nickname'] = pw
                        a['password'] = ap
                        pw_fill += 1

            with open(DB, 'w', encoding='utf-8') as fh:
                json.dump(arr if isinstance(d, list) else {**d, 'accounts': arr}, fh, ensure_ascii=False, indent=2)
            print(f'swapped={swapped} pw_filled_from_alts={pw_fill} total={len(arr)}')

            # print hinashinde77 after
            h = [a for a in arr if isinstance(a,dict) and (a.get('email','').lower()=='hinashinde77@gmail.com')]
            print(json.dumps(h[:1], ensure_ascii=False, indent=2))
            PYEOF

            echo ''
            sudo systemctl restart gauth
            sleep 2
            sudo systemctl is-active gauth
