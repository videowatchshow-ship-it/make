name: gauth · fix mojibake + swap app-password/URL columns

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-excel-fix.txt']

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Renormalize DB + patch upload_excels.js
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 180s
          script: |
            set -e
            DB=/opt/gauth-full/accounts_normalized.json
            UP=/opt/gauth-full/upload_excels.js
            TS=$(date +%s)

            echo '=== 1. backup DB and script ==='
            sudo cp $DB $DB.bak.$TS
            sudo cp $UP $UP.bak.$TS

            echo ''
            echo '=== 2. renormalize DB in-place ==='
            sudo python3 - <<'PYEOF'
            import json, re
            DB = '/opt/gauth-full/accounts_normalized.json'
            d = json.load(open(DB, encoding='utf-8'))
            arr = d if isinstance(d, list) else d.get('accounts', [])

            # Google App Password: 4 groups of 4 lowercase alnum separated by spaces
            APP_PW = re.compile(r'^([a-z0-9]{4}\s){3}[a-z0-9]{4}$', re.I)
            YT_URL = re.compile(r'(?:https?://)?(?:www\.|m\.)?(?:youtube\.com|youtu\.be)/', re.I)
            URL_ANY = re.compile(r'^https?://', re.I)

            def fix_mojibake(s):
                if not s or not isinstance(s, str): return s
                # heuristic: contains characters typical for UTF-8-as-latin1 mojibake (Ã, ê, ì, Â, etc.)
                if any(ch in s for ch in ('Ã','Â','ê','ì','ë','í','î','Ë')):
                    try:
                        fixed = s.encode('latin1').decode('utf-8')
                        return fixed
                    except Exception:
                        return s
                return s

            swapped = 0; moj_fixed = 0
            for a in arr:
                if not isinstance(a, dict): continue
                # (a) fix source_file mojibake
                sf = a.get('source_file') or a.get('source') or ''
                nsf = fix_mojibake(sf)
                if nsf != sf:
                    a['source_file'] = nsf; moj_fixed += 1
                # (b) swap app-password into password, real URL out of extra
                yurl = (a.get('youtube_url') or '').strip()
                pw   = (a.get('password') or '').strip()
                extras = a.get('extra') or []
                if isinstance(extras, str): extras = [extras]
                # case 1: youtube_url is an app password
                if APP_PW.match(yurl):
                    # find real URL in extras
                    real_url = ''
                    for i, x in enumerate(extras):
                        if isinstance(x, str) and YT_URL.search(x):
                            real_url = x.strip()
                            extras.pop(i); break
                    if not real_url:
                        for i, x in enumerate(extras):
                            if isinstance(x, str) and URL_ANY.match(x.strip()):
                                real_url = x.strip(); extras.pop(i); break
                    # nickname might be current password
                    nickname = pw
                    a['nickname'] = nickname
                    a['password'] = yurl  # app password becomes password
                    a['youtube_url'] = real_url
                    if nickname: extras.append(nickname)
                    a['extra'] = extras
                    swapped += 1
                # case 2: password looks like an app password AND youtube_url is empty or bogus
                elif APP_PW.match(pw) and not YT_URL.search(yurl):
                    # ok, password already has app password. try to fill youtube_url from extras
                    for i, x in enumerate(extras):
                        if isinstance(x, str) and YT_URL.search(x):
                            a['youtube_url'] = x.strip(); extras.pop(i); break
                    a['extra'] = extras

            with open(DB, 'w', encoding='utf-8') as fh:
                json.dump(arr if isinstance(d, list) else {**d, 'accounts': arr}, fh, ensure_ascii=False, indent=2)
            print(f'renormalized: swapped={swapped} moj_fixed={moj_fixed} total={len(arr)}')
            PYEOF

            echo ''
            echo '=== 3. patch upload_excels.js filename encoding + app-pw column detect ==='
            sudo python3 - <<'PYEOF'
            import re, io
            f = '/opt/gauth-full/upload_excels.js'
            s = open(f, encoding='utf-8').read()
            # (a) filename latin1→utf8 fix at busboy file event
            if 'FILENAME_LATIN1_FIX' not in s:
                s = s.replace(
                  "const filename = (typeof info === 'string' ? info : (info && info.filename || 'unknown')).normalize('NFC');",
                  "// FILENAME_LATIN1_FIX\n"
                  "      let filename = (typeof info === 'string' ? info : (info && info.filename || 'unknown'));\n"
                  "      try { if (/[\\u00C0-\\u00FF]/.test(filename)) { const alt = Buffer.from(filename, 'latin1').toString('utf8'); if (alt && !/\\uFFFD/.test(alt)) filename = alt; } } catch(e){}\n"
                  "      filename = filename.normalize('NFC');",
                  1
                )
                print('filename latin1 fix inserted')
            else:
                print('filename fix already present')

            # (b) app-password heuristic: prefer 'xxxx xxxx xxxx xxxx' as password over youtube
            if 'APPPW_HEURISTIC' not in s:
                inject = (
                  "// APPPW_HEURISTIC — Google App Password: 4 groups of 4 lowercase alnum\n"
                  "function isAppPassword(s){ return /^([a-z0-9]{4}\\s){3}[a-z0-9]{4}$/i.test(String(s||'').trim()); }\n"
                )
                # place near top after isTotpLike definition
                idx = s.find('function isTotpLike')
                if idx > 0:
                    end = s.find('\n}', idx); end = s.find('\n', end+1)+1
                    s = s[:end] + '\n' + inject + s[end:]
                # in stacked extract, guard against putting app-pw into youtube slot
                s = s.replace(
                    "else if (isUrlLike(v) && !cur.youtube) { cur.youtube = v; }",
                    "else if (isUrlLike(v) && !cur.youtube) { cur.youtube = v; }\n    else if (isAppPassword(v) && !cur.password) { cur.password = v; }",
                    1
                )
                print('app-pw heuristic inserted')
            else:
                print('app-pw heuristic already present')

            open(f, 'w', encoding='utf-8').write(s)
            PYEOF

            echo ''
            echo '=== 4. syntax check + restart gauth ==='
            sudo node -c $UP && echo 'upload_excels.js syntax OK'
            sudo systemctl restart gauth
            sleep 2
            sudo systemctl is-active gauth

            echo ''
            echo '=== 5. verify: check hinashinde77 record after fix ==='
            sudo python3 -c "import json; d=json.load(open('$DB',encoding='utf-8')); arr=d if isinstance(d,list) else d.get('accounts',[]); h=[a for a in arr if isinstance(a,dict) and a.get('email','').lower()=='hinashinde77@gmail.com']; print(json.dumps(h[:1], ensure_ascii=False, indent=2))"
            echo ''
            echo '=== 6. verify filenames (should now be Korean, no mojibake) ==='
            sudo python3 -c "import json; d=json.load(open('$DB',encoding='utf-8')); arr=d if isinstance(d,list) else d.get('accounts',[]); ss=sorted({(a.get('source_file') or '') for a in arr if isinstance(a,dict)}); [print(x) for x in ss[:20]]"
