name: CF 토큰 이름 조회
on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-cf-credential-name-lookup.yml'
jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: 토큰 ID로 이름 조회 (GET /user/tokens/{id})
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          echo "===== GET /user/tokens/85075b697530722e044c618fdcb876b2 ====="
          curl -sS -X GET "https://api.cloudflare.com/client/v4/user/tokens/85075b697530722e044c618fdcb876b2" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" | python3 -m json.tool
          echo ""
          echo "===== GET /user/tokens (전체 목록 - 권한 있으면) ====="
          curl -sS -X GET "https://api.cloudflare.com/client/v4/user/tokens" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" | python3 -m json.tool
