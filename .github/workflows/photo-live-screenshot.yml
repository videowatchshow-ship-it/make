name: 실 서버 페이지 스크린샷 + 구조 확인 v2
on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-live-screenshot.yml'
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y >/dev/null 2>&1 && npm i -D playwright >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: 스크린샷 + 페이지 구조 확인
        timeout-minutes: 1
        run: |
          cat > shot.js << 'EOF'
          const { chromium } = require('playwright');
          (async () => {
            try {
              const browser = await chromium.launch();
              const page = await browser.newPage({ viewport: { width: 900, height: 900 } });
              await page.goto('https://xn--9d0bw2fjtyymch7de9d.info/photo/CAH_1.html', { waitUntil: 'domcontentloaded', timeout: 15000 });
              await page.waitForTimeout(2500);
              await page.screenshot({ path: 'full.png', fullPage: true });
              const html = await page.content();
              require('fs').writeFileSync('page.html', html);
              console.log('OK');
              await browser.close();
              process.exit(0);
            } catch (e) {
              console.error('ERR:', e.message);
              process.exit(1);
            }
          })();
          EOF
          timeout 50 node shot.js || echo "node 타임아웃 또는 에러"
          echo "===== 스크린샷 크기 ====="
          ls -la full.png 2>/dev/null || echo "스크린샷 없음"
          echo ""
          echo "===== canvas/svg 요소 검색 ====="
          grep -noE '<(svg|canvas)[^>]*(id|class)="[^"]*"[^>]*>' page.html 2>/dev/null | head -30 || echo "page.html 없음"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-screenshot
          path: full.png
          if-no-files-found: ignore
