name: 실 서버 페이지 스크린샷 (base64 로그 출력)
on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-live-screenshot.yml'
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y >/dev/null 2>&1 && npm i -D playwright >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: 스크린샷 떠서 base64로 로그 출력
        timeout-minutes: 1
        run: |
          cat > shot.js << 'EOF'
          const { chromium } = require('playwright');
          (async () => {
            try {
              const browser = await chromium.launch();
              const page = await browser.newPage({ viewport: { width: 900, height: 900 } });
              await page.goto('https://xn--9d0bw2fjtyymch7de9d.info/photo/CAH_1.html', { waitUntil: 'domcontentloaded', timeout: 15000 });
              await page.waitForTimeout(3000);
              await page.screenshot({ path: 'shot.jpg', type: 'jpeg', quality: 35 });
              await browser.close();
              process.exit(0);
            } catch (e) {
              console.error('ERR:', e.message);
              process.exit(1);
            }
          })();
          EOF
          timeout 50 node shot.js || echo "node 타임아웃 또는 에러"
          ls -la shot.jpg
          echo "=====BASE64_START====="
          base64 -w 0 shot.jpg
          echo ""
          echo "=====BASE64_END====="
