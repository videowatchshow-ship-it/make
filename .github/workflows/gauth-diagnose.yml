name: gauth diagnostics
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: diagnose accounts on server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "=== accounts_normalized.json stats ==="
            DATA=/opt/gauth-full/accounts_normalized.json
            if [ ! -f "$DATA" ]; then echo "DATA FILE NOT FOUND"; exit 1; fi

            node -e "
              const d = JSON.parse(require('fs').readFileSync('$DATA','utf8'));
              const accounts = Array.isArray(d) ? d : (d.accounts || []);
              console.log('Total accounts:', accounts.length);

              // source_file breakdown
              const byFile = {};
              for (const a of accounts) {
                const f = a.source_file || 'unknown';
                byFile[f] = (byFile[f] || 0) + 1;
              }
              const sorted = Object.entries(byFile).sort((a,b) => b[1] - a[1]);
              console.log('\n=== Source files (' + sorted.length + ') ===');
              for (const [f, c] of sorted) console.log('  ' + c + '\t' + f);

              // password_alts check
              const withAlts = accounts.filter(a => a.password_alts && a.password_alts.length > 0);
              console.log('\n=== password_alts ===');
              console.log('Accounts with password_alts:', withAlts.length);
              for (const a of withAlts.slice(0, 10)) {
                console.log('  ' + a.email + ': [' + a.password_alts.join(', ') + ']');
              }

              // duplicate email check
              const emailCount = {};
              for (const a of accounts) {
                const e = (a.email || '').toLowerCase();
                emailCount[e] = (emailCount[e] || 0) + 1;
              }
              const dupes = Object.entries(emailCount).filter(([,c]) => c > 1);
              console.log('\n=== Duplicate emails ===');
              console.log('Duplicates:', dupes.length);
              for (const [e, c] of dupes.slice(0, 20)) console.log('  ' + e + ': ' + c + 'x');

              // specific lookups
              const targets = ['gun.0659274610@gmail.com', 'a07729715678@gmail.com'];
              console.log('\n=== Target lookups ===');
              for (const t of targets) {
                const found = accounts.find(a => (a.email||'').toLowerCase() === t);
                if (found) {
                  console.log(t + ': FOUND');
                  console.log('  password: ' + (found.password || '(none)'));
                  console.log('  password_alts: ' + JSON.stringify(found.password_alts || []));
                  console.log('  totp_secret: ' + (found.totp_secret || '(none)'));
                  console.log('  recovery_email: ' + (found.recovery_email || '(none)'));
                  console.log('  source_file: ' + (found.source_file || '(none)'));
                  console.log('  extra: ' + JSON.stringify(found.extra || []));
                } else {
                  console.log(t + ': NOT FOUND');
                  // partial search
                  const partial = accounts.filter(a => (a.email||'').includes(t.split('@')[0]));
                  if (partial.length) {
                    console.log('  partial matches:');
                    for (const p of partial) console.log('    ' + p.email);
                  }
                }
              }

              // search for gun in any field
              console.log('\n=== Search: gun ===');
              const gunResults = accounts.filter(a => {
                const s = JSON.stringify(a).toLowerCase();
                return s.includes('gun.065') || s.includes('gun.0659');
              });
              console.log('Found:', gunResults.length);
              for (const a of gunResults.slice(0, 5)) {
                console.log('  ' + a.email + ' | pw:' + (a.password||'') + ' | src:' + (a.source_file||''));
              }

              // parse_fail.log
              const fs = require('fs');
              const failLog = '/opt/gauth-full/parse_fail.log';
              if (fs.existsSync(failLog)) {
                const lines = fs.readFileSync(failLog,'utf8').trim().split('\n').filter(Boolean);
                console.log('\n=== parse_fail.log (' + lines.length + ' lines) ===');
                for (const l of lines.slice(-20)) console.log('  ' + l);
              } else {
                console.log('\n=== parse_fail.log: not found ===');
              }
            "
