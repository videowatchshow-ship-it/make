name: photo/SNW_1,2 파랑 메신저 SKY82892 요소 제거 + T101 확인

on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo2-remove-chat.yml'

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: SNW_1/SNW_2 메신저 div 제거
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 300s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='bash -s' << "REMOTE"
            set -uo pipefail
            P1="/var/www/sites/chamgyo/public/photo"

            echo "===== [1] SNW_1.html 55~70줄 (메신저 div 컨텍스트) ====="
            sudo sed -n "55,70p" "$P1/SNW_1.html"

            echo ""
            echo "===== [2] SNW_1.html v[0-9]+ 표시자, 6 R T101 관련 grep ====="
            sudo grep -nE "v[0-9]+|hotv|version|ban_num|ban_wrap|badge|hotpatch|T[0-9]+" "$P1/SNW_1.html" 2>/dev/null | head -30

            echo ""
            echo "===== [3] 백업 + line 61 (메신저 div) 삭제 (SNW_1.html) ====="
            TS=$(date +%s)
            sudo cp "$P1/SNW_1.html" "$P1/SNW_1.html.bak.msg.$TS"
            sudo sed -i "/<div class=\"msg\">파랑 메신저/d" "$P1/SNW_1.html"
            echo "SNW_1.html 이후 grep:"
            sudo grep -n "메신저\|SKY82892" "$P1/SNW_1.html" | head -5 || echo "  (완전 제거됨)"

            echo ""
            echo "===== [4] SNW_2.html 도 같은 방식 ====="
            if [ -f "$P1/SNW_2.html" ]; then
              sudo cp "$P1/SNW_2.html" "$P1/SNW_2.html.bak.msg.$TS"
              sudo sed -i "/<div class=\"msg\">파랑 메신저/d" "$P1/SNW_2.html"
              echo "SNW_2.html 이후 grep:"
              sudo grep -n "메신저\|SKY82892" "$P1/SNW_2.html" | head -5 || echo "  (완전 제거됨)"
            fi

            echo ""
            echo "===== [5] NEWSJ.html / NUSJ0814.html 도 같은 방식 ====="
            for f in NEWSJ.html NUSJ0814.html; do
              if [ -f "$P1/$f" ]; then
                sudo cp "$P1/$f" "$P1/$f.bak.msg.$TS"
                sudo sed -i "/<div class=\"msg\">파랑 메신저/d" "$P1/$f"
                echo "$f 이후 grep:"
                sudo grep -n "메신저\|SKY82892" "$P1/$f" | head -3 || echo "  (완전 제거됨)"
              fi
            done

            echo ""
            echo "===== [6] AFTER — SNW_1.html에 메신저 흔적 남았나 ====="
            sudo grep -c "메신저\|SKY82892" "$P1/SNW_1.html" || echo "0"

            echo ""
            echo "===== [7] T101 / v[0-9]+ 표시자 검색 (모든 SNW 관련 파일) ====="
            for f in SNW_1.html SNW_2.html NEWSJ.html NUSJ0814.html; do
              [ -f "$P1/$f" ] || continue
              echo "--- $f ---"
              sudo grep -nE "'T'\+|T[0-9]{3}|version|v[0-9]+|ban_num[^-]|hotpatch" "$P1/$f" | head -10
            done

            echo ""
            echo "===== [8] Cloudflare purge (내부 서버에서는 못함, 여기서 skip) ====="

            echo ""
            echo "===== DONE ====="
            REMOTE

