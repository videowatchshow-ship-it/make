name: photo/SNW_1.html 채팅/메신저 요소 제거

on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo2-remove-chat.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: SNW_1.html 확인 + 채팅/메신저/T101 요소 제거
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 300s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='bash -s' << "REMOTE"
            set -uo pipefail
            P1="/var/www/sites/chamgyo/public/photo"

            echo "===== [1] SNW_1.html 존재 확인 ====="
            ls -la "$P1/SNW_1.html" 2>&1 | head -3
            wc -l "$P1/SNW_1.html" 2>&1

            echo ""
            echo "===== [2] SKY82892 / 메신저 / T101 / 파랑 grep ====="
            sudo grep -n -E "SKY82892|SKY[0-9]|메신저|T101|파랑|채팅|chat|messenger|signal_panel|tg-info|tg-id|mnv-hd" "$P1/SNW_1.html" 2>/dev/null | head -50

            echo ""
            echo "===== [3] SNW_1.html 하단 100줄 (채팅/버전 표시자 있을 자리) ====="
            sudo tail -100 "$P1/SNW_1.html"

            echo ""
            echo "===== [4] modules/dist/bundle.js에 SKY / 메신저 있나 ====="
            sudo grep -oE "SKY[0-9]+|메신저|T101|파랑[^\"'\`]{0,20}" "$P1/modules/dist/bundle.js" 2>/dev/null | sort -u | head -20
            echo "--- photo/hot-patch.js 안 ---"
            sudo cat "$P1/hot-patch.js"
            echo ""
            echo "--- photo/hot_patches.json 전체 ---"
            sudo cat "$P1/hot_patches.json"

            echo ""
            echo "===== [5] photo/ 전체 recursive grep - SKY82892 ====="
            sudo grep -rln "SKY82892" "$P1" 2>/dev/null | head -10
            sudo grep -rln "메신저" "$P1" 2>/dev/null | head -10
            sudo grep -rln "T101" "$P1" 2>/dev/null | head -10

            echo ""
            echo "===== DONE ====="
            REMOTE
