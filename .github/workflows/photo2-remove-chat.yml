name: photo2 - 채팅/메신저 요소 위치 찾기 v2 (모든 파일 sweep)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo2-remove-chat.yml'

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: 모든 photo2 파일 sweep - SKY82892 / 메신저 / T101 찾기
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 300s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='bash -s' << "REMOTE"
            set -uo pipefail
            P2="/var/www/sites/chamgyo/public/photo2"
            P1="/var/www/sites/chamgyo/public/photo"

            echo "===== [1] photo2/ 전체 파일에서 SKY 검색 (recursive) ====="
            sudo grep -rn "SKY82892" "$P2" 2>/dev/null | head -20
            echo "---"
            sudo grep -rn "SKY[0-9]" "$P2" --include="*.html" --include="*.js" --include="*.php" 2>/dev/null | head -30

            echo ""
            echo "===== [2] photo2/ 전체 파일에서 메신저 검색 ====="
            sudo grep -rn "메신저" "$P2" 2>/dev/null | head -20

            echo ""
            echo "===== [3] photo2/ 전체 파일에서 T101 검색 ====="
            sudo grep -rn "T101" "$P2" 2>/dev/null | head -20

            echo ""
            echo "===== [4] photo2/ 전체 파일에서 파랑 검색 ====="
            sudo grep -rn "파랑" "$P2" 2>/dev/null | head -20

            echo ""
            echo "===== [5] CAW_1~4.html 전체 script 라인 (chat/messenger 힌트) ====="
            for f in CAW_1.html CAW_2.html CAW_3.html CAW_4.html CBW_1.html CBW_2.html CBW_3.html CBW_4.html live.html; do
              if [ -f "$P2/$f" ]; then
                COUNT=$(sudo grep -ciE "메신저|SKY|T101|파랑|chat|채팅|messenger|signal_panel" "$P2/$f" 2>/dev/null)
                echo "$f: 매칭 $COUNT개"
                sudo grep -n -E "메신저|SKY[0-9]|T101|파랑" "$P2/$f" 2>/dev/null | head -10
              fi
            done

            echo ""
            echo "===== [6] photo/ 도 확인 (심볼릭 아니고 실체) ====="
            sudo grep -rn "SKY82892\|메신저\|T101" "$P1" --include="*.html" --include="*.js" --include="*.php" 2>/dev/null | head -20

            echo ""
            echo "===== [7] bundle.js 안에 SKY / T101 검색 ====="
            sudo grep -oE "SKY[0-9]+|T101|메신저" "$P2/modules/dist/bundle.js" 2>/dev/null | sort -u | head -20

            echo ""
            echo "===== [8] api_selected_room.php 반환 (sel_ 파일 기반, 방번호 표시 소스) ====="
            sudo cat "$P2/api_selected_room.php"

            echo ""
            echo "===== [9] hot_patches.json photo/ (photo2와 다를 수 있음) ====="
            sudo cat "$P1/hot_patches.json" 2>/dev/null || echo "MISSING"

            echo ""
            echo "===== [10] 라이브 상태 - api_live_status.php ====="
            sudo cat "$P2/api_live_status.php"

            echo ""
            echo "===== [11] 시그널 관련 hot_patches.json 확인 - photo3 도 ====="
            sudo find /var/www/sites/chamgyo -name "hot_patches.json" -exec sh -c '"'"'echo "--- $1 ---"; sudo cat "$1"'"'"' _ {} \; 2>/dev/null

            echo ""
            echo "===== DONE ====="
            REMOTE
