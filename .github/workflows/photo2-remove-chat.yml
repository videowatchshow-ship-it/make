name: photo2 - CAH_1.html 채팅/메신저/T101/v11 요소 제거

on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo2-remove-chat.yml'

jobs:
  find-and-remove:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 찾기 - "메신저", "SKY82892", "T101", "v11" 소스 위치 확인
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 300s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='
            set -uo pipefail
            P2="/var/www/sites/chamgyo/public/photo2"
            P1="/var/www/sites/chamgyo/public/photo"

            echo "===== [1] photo2/CAH_1.html에서 검색 (메신저/SKY/T101/v[0-9]+) ====="
            for kw in "메신저" "SKY82892" "SKY8" "T101" "signal_panel" "chat" "채팅" "messenger" "파랑"; do
              echo "--- keyword: $kw ---"
              sudo grep -n -E "$kw" "$P2/CAH_1.html" 2>/dev/null | head -20 || echo "(no match)"
            done

            echo ""
            echo "===== [2] photo2/signal.js + signal_common.js 확인 ====="
            for f in signal.js signal_common.js hot-patch.js; do
              echo "--- $f ---"
              sudo grep -n -E "메신저|SKY82892|T101|파랑|채팅|messenger" "$P2/$f" 2>/dev/null | head -10 || echo "(none)"
            done

            echo ""
            echo "===== [3] hot_patches.json 전체 (v[0-9]+가 hot patch 버전일 수 있음) ====="
            sudo cat "$P2/hot_patches.json"
            echo ""

            echo ""
            echo "===== [4] photo/CAH_1.html도 같은지 확인 ====="
            sudo grep -n -E "메신저|SKY82892|T101|파랑" "$P1/CAH_1.html" 2>/dev/null | head -20 || echo "(none)"

            echo ""
            echo "===== [5] modules/dist/bundle.js 검색 ====="
            sudo grep -oE "메신저[^"'"'"'`]{0,50}|SKY[0-9]+|T101|파랑[^"'"'"'`]{0,30}" "$P2/modules/dist/bundle.js" 2>/dev/null | sort -u | head -20 || echo "(none in bundle)"

            echo ""
            echo "===== [6] CAH_1.html signal_panel / mnv-hd / chat / tg-info 관련 블록 ====="
            sudo grep -n -E "signal_panel|mnv-hd|chat_|채팅|tg-info|tg-id|chat-|messenger" "$P2/CAH_1.html" 2>/dev/null | head -30

            echo ""
            echo "===== [7] preview_baccarat.html / live.html 도 확인 ====="
            for f in preview_baccarat.html live.html luzhu.html; do
              echo "--- $f ---"
              sudo grep -n -E "메신저|SKY82892|T101|파랑" "$P2/$f" 2>/dev/null | head -10 || echo "(none)"
            done
            '
