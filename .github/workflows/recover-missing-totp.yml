name: Recover missing TOTP from original Excel files
on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email to search for missing TOTP'
        required: false
        default: ''
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-recover-totp.txt']

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Recover TOTP from Excel and write back to accounts_normalized.json
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 180s
          script: |
            set -e
            cd /opt/gauth-full

            echo "=== TOTP 복구 v4: 비밀번호 오탐 완전 제거 + TOTP 유효성 검증 ==="
            node -e "
              const fs = require('fs');
              const path = require('path');
              const XLSX = require('xlsx');

              const data = JSON.parse(fs.readFileSync('accounts_normalized.json','utf8'));
              const arr = Array.isArray(data) ? data : (data.accounts || []);

              // Base32 정규화: 대문자 + Base32 문자만 남김
              function toBase32(s) {
                return String(s||'').toUpperCase().replace(/[^A-Z2-7]/g,'');
              }

              // 비밀번호와 TOTP가 같은지 (Base32 정규화 후 비교)
              function isPwSameAsTotp(pw, totp) {
                if (!pw || !totp) return false;
                // 직접 비교
                if (totp.toUpperCase() === pw.toUpperCase()) return true;
                // Base32 정규화 후 비교 (비밀번호에서 0189 등 제거한 것과 일치 여부)
                var b32pw = toBase32(pw);
                var b32totp = toBase32(totp);
                if (b32pw.length >= 12 && b32pw === b32totp) return true;
                return false;
              }

              // 0) 비밀번호를 TOTP로 잘못 넣은 것 제거 (확장된 비교)
              let cleaned = 0;
              for (const a of arr) {
                if (a.totp_secret && a.password) {
                  if (isPwSameAsTotp(a.password, a.totp_secret)) {
                    console.log('CLEAN bad totp (=password): ' + a.email + ' pw=' + a.password.slice(0,6) + '... totp=' + a.totp_secret.slice(0,6) + '...');
                    delete a.totp_secret;
                    cleaned++;
                  }
                }
              }
              if (cleaned) console.log(cleaned + '개 비밀번호=TOTP 오탐 제거');

              // 1) TOTP 없는 계정 인덱스 맵 + 비밀번호 맵
              const missingMap = new Map();
              const pwMap = new Map();
              for (let i = 0; i < arr.length; i++) {
                const a = arr[i];
                if (a.email && a.password && !a.totp_secret) {
                  const ne = normalizeEmail(a.email);
                  missingMap.set(ne, i);
                  pwMap.set(ne, a.password);
                }
              }
              console.log('TOTP 없는 계정: ' + missingMap.size + ' / 전체: ' + arr.length);
              if (!missingMap.size && !cleaned) { console.log('복구 불필요'); process.exit(0); }

              function normalizeEmail(s) {
                s = String(s||'').trim().toLowerCase();
                const parts = s.split('@');
                if (parts.length === 2) {
                  let local = parts[0];
                  const domain = parts[1];
                  if (domain === 'gmail.com' || domain === 'googlemail.com') {
                    local = local.replace(/\./g,'').split('+')[0];
                    return local + '@gmail.com';
                  }
                }
                return s;
              }

              function isBase32Like(s) {
                if (!s || s.length < 16) return false;
                const clean = s.replace(/[\s=-]/g,'');
                if (clean.length < 16 || clean.length > 64) return false;
                return /^[A-Z2-7]+$/i.test(clean);
              }

              function extractSecret(cell, password) {
                if (/^otpauth:\/\//i.test(cell)) {
                  const m = cell.match(/secret=([A-Z2-7]+)/i);
                  if (m) {
                    const s = m[1].toUpperCase();
                    if (password && isPwSameAsTotp(password, s)) return null;
                    return s;
                  }
                  return null;
                }
                // 비밀번호와 동일하면 스킵 (대소문자, Base32 정규화 모두 비교)
                if (password && isPwSameAsTotp(password, cell)) return null;
                const clean = cell.replace(/[\s=-]/g,'');
                if (isBase32Like(cell)) {
                  const upper = clean.toUpperCase();
                  if (password && isPwSameAsTotp(password, upper)) return null;
                  return upper;
                }
                return null;
              }

              // 2) extra[] 필드에서 먼저 복구
              let recoveredExtra = 0;
              for (const [ne, idx] of [...missingMap]) {
                const a = arr[idx];
                if (!a.extra || !a.extra.length) continue;
                for (const e of a.extra) {
                  const secret = extractSecret(String(e), a.password);
                  if (secret) {
                    a.totp_secret = secret;
                    missingMap.delete(ne);
                    recoveredExtra++;
                    break;
                  }
                }
              }
              console.log('extra[]에서 복구: ' + recoveredExtra);

              // 3) Excel 파일에서 복구
              const dirs = ['uploads', 'uploads/archive'];
              let recoveredExcel = 0;
              const recovered = [];

              for (const dir of dirs) {
                const fullDir = path.join('/opt/gauth-full', dir);
                if (!fs.existsSync(fullDir)) continue;
                const files = fs.readdirSync(fullDir).filter(f => /\.(xlsx?|csv)$/i.test(f));
                for (const file of files) {
                  try {
                    const wb = XLSX.readFile(path.join(fullDir, file));
                    for (const sn of wb.SheetNames) {
                      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, defval:'', raw:false});
                      for (let r = 0; r < rows.length; r++) {
                        const row = rows[r];
                        const cells = row.map(c => String(c||'').trim());
                        const emailCell = cells.find(c => c.includes('@') && /^[^@]+@[^@]+\.[^@]+$/.test(c));
                        if (!emailCell) continue;
                        const ne = normalizeEmail(emailCell);
                        if (!missingMap.has(ne)) continue;

                        const pw = pwMap.get(ne) || '';
                        let found = null;
                        for (const cell of cells) {
                          if (cell === emailCell) continue;
                          const secret = extractSecret(cell, pw);
                          if (secret) { found = secret; break; }
                        }
                        if (!found && r + 1 < rows.length) {
                          const nextRow = rows[r+1].map(c => String(c||'').trim());
                          const hasEmail = nextRow.some(c => c.includes('@') && /^[^@]+@[^@]+\.[^@]+$/.test(c));
                          if (!hasEmail) {
                            for (const cell of nextRow) {
                              const secret = extractSecret(cell, pw);
                              if (secret) { found = secret; break; }
                            }
                          }
                        }

                        if (found) {
                          const idx = missingMap.get(ne);
                          arr[idx].totp_secret = found;
                          recovered.push(ne + ' → ' + found.slice(0,6) + '...');
                          missingMap.delete(ne);
                          recoveredExcel++;
                        }
                      }
                    }
                  } catch(e) { /* skip unreadable */ }
                }
              }

              console.log('Excel에서 복구: ' + recoveredExcel);
              recovered.forEach(r => console.log('  ' + r));

              // 4) 최종 검증: 복구 후에도 비밀번호=TOTP인 것 다시 제거
              let postCleaned = 0;
              for (const a of arr) {
                if (a.totp_secret && a.password) {
                  if (isPwSameAsTotp(a.password, a.totp_secret)) {
                    console.log('POST-CLEAN: ' + a.email);
                    delete a.totp_secret;
                    postCleaned++;
                  }
                }
              }
              if (postCleaned) console.log('복구 후 추가 오탐 제거: ' + postCleaned);

              // 5) TOTP 유효성 검증 (0,1,8,9 포함 여부)
              let invalidTotp = 0;
              for (const a of arr) {
                if (a.totp_secret) {
                  const stripped = a.totp_secret.replace(/[^A-Z2-7]/gi,'');
                  if (stripped.length !== a.totp_secret.length) {
                    console.log('INVALID TOTP chars: ' + a.email + ' → ' + a.totp_secret.slice(0,10));
                    a.totp_secret = stripped.length >= 16 ? stripped : undefined;
                    if (!a.totp_secret) delete a.totp_secret;
                    invalidTotp++;
                  }
                }
              }
              if (invalidTotp) console.log('잘못된 TOTP 문자 수정: ' + invalidTotp);

              // 6) 저장
              const totalRecovered = recoveredExtra + recoveredExcel;
              const totalCleaned = cleaned + postCleaned + invalidTotp;
              if (totalRecovered > 0 || totalCleaned > 0) {
                const tmp = 'accounts_normalized.json.tmp.' + process.pid;
                fs.writeFileSync(tmp, JSON.stringify(arr, null, 2));
                fs.renameSync(tmp, 'accounts_normalized.json');
                console.log('');
                console.log('=== 오탐 제거: ' + totalCleaned + ' (사전=' + cleaned + ' 사후=' + postCleaned + ' 잘못된문자=' + invalidTotp + ') / 신규 복구: ' + totalRecovered + ' ===');
              } else {
                console.log('변경 없음');
              }

              // 7) 최종 상태
              const finalMissing = arr.filter(a => a.email && a.password && !a.totp_secret).length;
              const withTotp = arr.filter(a => a.totp_secret).length;
              console.log('최종: 전체=' + arr.length + ' TOTP=' + withTotp + ' 미복구=' + finalMissing);
            "

            echo ""
            echo "=== gauth 서비스 재시작 ==="
            sudo systemctl restart gauth
            sleep 2
            sudo systemctl is-active gauth && echo "gauth 정상 구동" || echo "gauth 재시작 실패"
