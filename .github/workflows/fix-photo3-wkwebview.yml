name: Fix photo3 WKWebView render

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix photo3 CSS overrides for WKWebView
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 180s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='
            P3="/var/www/sites/chamgyo/public/photo3"
            P1="/var/www/sites/chamgyo/public/photo"
            CAH="$P3/CAH_1.html"

            echo "===== BEFORE FIX ====="
            echo "--- body override ---"
            grep -n "body{height" "$CAH" | head -5
            echo "--- container/full_box center override ---"
            grep -n "margin-left: auto\|margin-right: auto\|align-items: center" "$CAH" | head -10
            echo "--- mobile fit script ---"
            sed -n "397,420p" "$CAH"

            echo "===== BACKUP ====="
            sudo cp "$CAH" "${CAH}.bak.wkwebview.$(date +%s)"

            echo "===== FIX 1: Remove body flex override, keep only background ====="
            sudo sed -i "s|body{height:100vh !important;display:flex !important;flex-direction:column !important;align-items:center !important;background:#000 !important}|body{margin:0 !important;padding:0 !important;background:#000 !important;overflow:hidden !important}|g" "$CAH"

            echo "===== FIX 2: Remove container/full_box centering overrides ====="
            sudo sed -i "s|\.container, \.full_box { margin-left: auto !important; margin-right: auto !important; }||g" "$CAH"
            sudo sed -i "s|\.full_box { align-items: center !important; }||g" "$CAH"

            echo "===== FIX 3: Remove full_box height override (original already has 100vh) ====="
            sudo sed -i "s|\.full_box{height:100vh !important;min-height:100vh !important;align-items:center !important}||g" "$CAH"

            echo "===== AFTER FIX ====="
            echo "--- body CSS ---"
            grep -n "body{" "$CAH" | head -5
            grep -n "body{" "$CAH" | grep -o "body{[^}]*}" | head -3
            echo "--- full_box CSS (original) ---"
            grep -n "full_box" "$CAH" | head -10
            echo "--- centering overrides (should be gone) ---"
            grep -n "margin-left: auto" "$CAH" | head -5 || echo "REMOVED OK"

            echo "===== FIX 4: Check mobile-fit-js for WKWebView issues ====="
            sed -n "397,420p" "$CAH"

            echo "===== APACHE RELOAD ====="
            sudo apachectl configtest 2>&1
            sudo systemctl reload apache2 2>&1 || echo "reload failed"

            echo "===== VERIFY ====="
            curl -sI "http://localhost/photo3/CAH_1.html?ch=tak" | head -5
            echo "---"
            curl -s "http://localhost/photo3/CAH_1.html?ch=tak" | grep -o "body{[^}]*}" | head -3
            echo "--- photo (reference) ---"
            curl -s "http://localhost/photo/CAH_1.html?ch=tak" | grep -o "body{[^}]*}" | head -3
            echo "===== DONE ====="
            '

      - name: Verify external
        if: always()
        run: |
          sleep 5
          echo "=== External check ==="
          BODY=$(curl -s "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak&_t=$(date +%s)" 2>/dev/null)
          echo "Size: $(echo "$BODY" | wc -c)"
          echo "body CSS:"
          echo "$BODY" | grep -o "body{[^}]*}" | head -3
          echo "full_box CSS:"
          echo "$BODY" | grep -o "full_box{[^}]*}" | head -3
          if echo "$BODY" | grep -q "display:flex.*align-items:center.*background:#000"; then
            echo "WARNING: Old flex override still present"
          else
            echo "OK: Flex override removed"
          fi
          if echo "$BODY" | grep -q "background:#000"; then
            echo "OK: Background black applied"
          fi
          STATUS=$(curl -so /dev/null -w '%{http_code}' "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak" 2>/dev/null)
          echo "HTTP: $STATUS"
