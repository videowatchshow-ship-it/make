name: photo2 - fix tables.json v3 (jq 사용, quote 실패 회피)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo2-fix-tables.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 2-hop - tables.json xtd 병합 (jq)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 300s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='
            set -uo pipefail
            TF="/var/www/sites/chamgyo/public/photo/data/tables.json"
            P1="/var/www/sites/chamgyo/public/photo"

            echo "===== [1] BEFORE ====="
            sudo cat "$TF"
            echo ""

            TS=$(date +%s)
            sudo cp "$TF" "$TF.bak.$TS"

            echo ""
            echo "===== [2] Python 환경변수로 병합 ====="
            sudo TABLES_FILE="$TF" python3 -c "
            import json, os
            tf = os.environ[\"TABLES_FILE\"]
            with open(tf) as f: cur = json.load(f)
            cur[\"xtd\"] = [10,11,12,15,16,17,18,19,20,21,22,23,25,26,27,55,66,77,88,99]
            cur[\"xtd_map\"] = {\"10\":10,\"11\":11,\"12\":12,\"15\":15,\"16\":16,\"17\":87,\"18\":18,\"19\":89,\"20\":20,\"21\":21,\"22\":22,\"23\":23,\"25\":25,\"26\":26,\"27\":27,\"55\":31,\"66\":32,\"77\":33,\"88\":34,\"99\":35}
            cur[\"xtd_kind\"] = {\"10\":\"21점\",\"16\":\"용호\"}
            with open(tf, \"w\") as f: json.dump(cur, f, ensure_ascii=False)
            print(\"MERGED OK\")
            print(\"file len:\", os.path.getsize(tf))
            "

            sudo chown www-data:www-data "$TF"
            sudo chmod 644 "$TF"

            echo ""
            echo "===== [3] AFTER ====="
            sudo cat "$TF"
            echo ""

            echo ""
            echo "===== [4] collector_xtd.php 실행 (한 번만, ?once=1) ====="
            # 웹 요청으로 1회만 실행 (CLI 실행 시 56초 loop, cron이 이미 돌고 있어서 flock 걸릴 수 있음)
            for pair in "10:10" "11:11" "12:12" "15:15" "16:16" "17:87" "18:18" "19:89" "20:20" "21:21" "22:22" "23:23" "25:25" "26:26" "27:27" "55:31" "66:32" "77:33" "88:34" "99:35"; do
              LABEL="${pair%:*}"
              APIID="${pair#*:}"
              # 원본 xtd6688 직접 fetch해서 파일 생성 (즉시)
              R=$(curl -sS --max-time 6 -H "Origin: https://gs.xtd6688.com" -H "Referer: https://gs.xtd6688.com/luzhu/zh/pc.html" -H "User-Agent: Mozilla/5.0" "https://api.xtd6688.com/api/diantou/table/getData/gameType/3/tableId/${APIID}/xue/null")
              # 아래는 collector 로직을 python으로 재현
              echo "$R" | sudo LABEL="$LABEL" APIID="$APIID" TARGET_DIR="$P1/data" python3 -c "
            import json, sys, os, time
            data = sys.stdin.read()
            label = int(os.environ[\"LABEL\"])
            apiid = int(os.environ[\"APIID\"])
            target = os.environ[\"TARGET_DIR\"]
            try:
                d = json.loads(data)
                if d.get(\"code\") != 1 or not d.get(\"data\"):
                    print(f\"방 {label}→{apiid}: 원본 응답 비정상\")
                    sys.exit(0)
                items = d[\"data\"]
                # k0, k1, k2 순서로 정렬
                keys = sorted(items.keys(), key=lambda k: int(\"\".join(c for c in k if c.isdigit()) or 0))
                nums = []
                for k in keys:
                    obj = items[k]
                    if not isinstance(obj, dict): continue
                    r = int(obj.get(\"result\", 0))
                    e = int(obj.get(\"ext\", 0))
                    letter = \"P\" if r == 2 else (\"T\" if r == 3 else \"B\")
                    bp = \"1\" if e in (1, 3) else \"0\"
                    pp = \"1\" if e in (2, 3) else \"0\"
                    nums.append(letter + bp + pp)
                if not nums:
                    print(f\"방 {label}→{apiid}: nums empty\")
                    sys.exit(0)
                out = {\"id\": f\"xtd_{apiid}\", \"ver\": len(nums), \"nums\": nums, \"t\": int(time.time()),
                       \"server_time\": time.strftime(\"%Y-%m-%d %H:%M:%S\"), \"source\": \"xtd6688\",
                       \"label\": label, \"apiId\": apiid}
                path = f\"{target}/room_{label}.json\"
                with open(path, \"w\") as f: json.dump(out, f)
                print(f\"방 {label}→api {apiid}: nums_len={len(nums)} tail={nums[-5:]}\")
            except Exception as ex:
                print(f\"방 {label}→{apiid}: ERROR {ex}\")
              "
              sudo chown www-data:www-data "$P1/data/room_${LABEL}.json" 2>/dev/null || true
            done

            echo ""
            echo "===== [5] api_all_rooms.php 재응답 ====="
            curl -sS "http://localhost/photo2/api_all_rooms.php" | sudo TABLES_FILE=/tmp/none python3 -c "
            import json, sys
            d = json.load(sys.stdin)
            print(\"ok=\", d.get(\"ok\"), \"count=\", d.get(\"count\"))
            for r in d.get(\"rooms\", []):
                print(f\"  방 {r.get(\\\"room_id\\\")}: kind={r.get(\\\"kind\\\")} exists={r.get(\\\"exists\\\")} nums={len(r.get(\\\"nums\\\", []))} ver={r.get(\\\"ver\\\")} st={r.get(\\\"server_time\\\")}\")
            "

            echo ""
            echo "===== DONE ====="
            '
