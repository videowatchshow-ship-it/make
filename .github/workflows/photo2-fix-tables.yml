name: photo2 - fix tables.json (xtd/xtd_map/xtd_kind 추가) v2

on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo2-fix-tables.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 2-hop - tables.json에 xtd 필드 병합 (Python)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 300s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='
            set -uo pipefail
            P1="/var/www/sites/chamgyo/public/photo"
            TF="$P1/data/tables.json"

            echo "===== [1] BEFORE tables.json ====="
            sudo cat "$TF"; echo ""

            TS=$(date +%s)
            sudo cp "$TF" "$TF.bak.$TS"

            echo ""
            echo "===== [2] Python으로 merge (xtd/xtd_map/xtd_kind 추가, sinji_new는 보존) ====="
            sudo python3 <<PYEOF
            import json
            tf = "'"$TF"'"
            cur = json.load(open(tf))
            cur["xtd"] = [10,11,12,15,16,17,18,19,20,21,22,23,25,26,27,55,66,77,88,99]
            cur["xtd_map"] = {"10":10,"11":11,"12":12,"15":15,"16":16,"17":87,"18":18,"19":89,"20":20,"21":21,"22":22,"23":23,"25":25,"26":26,"27":27,"55":31,"66":32,"77":33,"88":34,"99":35}
            cur["xtd_kind"] = {"10":"21점","16":"용호"}
            with open(tf,"w") as f:
                json.dump(cur, f, ensure_ascii=False)
            print("MERGED OK")
            PYEOF

            # 소유권 www-data 유지
            sudo chown www-data:www-data "$TF"
            sudo chmod 644 "$TF"

            echo ""
            echo "===== [3] AFTER tables.json ====="
            sudo cat "$TF"; echo ""

            echo ""
            echo "===== [4] collector_xtd.php 즉시 실행 (20방 전체 폴링) ====="
            cd "$P1"
            sudo -u www-data /usr/bin/php collector_xtd.php 2>&1 | head -20

            echo ""
            echo "===== [5] 3초 대기 후 20방 상태 확인 ====="
            sleep 3
            NOW=$(date +%s)
            echo "server_now: $NOW"
            for pair in "10:10" "11:11" "12:12" "15:15" "16:16" "17:87" "18:18" "19:89" "20:20" "21:21" "22:22" "23:23" "25:25" "26:26" "27:27" "55:31" "66:32" "77:33" "88:34" "99:35"; do
              LABEL="${pair%:*}"
              APIID="${pair#*:}"
              F="$P1/data/room_${LABEL}.json"
              if [ -f "$F" ]; then
                MT=$(stat -c %Y "$F")
                AGE=$((NOW - MT))
                SZ=$(stat -c %s "$F")
                NL=$(sudo python3 -c "import json;print(len(json.load(open(\"$F\")).get(\"nums\",[])))" 2>/dev/null || echo "?")
                printf "방 %-3s→api %-3s : age=%-6ss size=%-4sB nums_len=%s\n" "$LABEL" "$APIID" "$AGE" "$SZ" "$NL"
              else
                printf "방 %-3s→api %-3s : MISSING\n" "$LABEL" "$APIID"
              fi
            done

            echo ""
            echo "===== [6] api_all_rooms.php 재응답 ====="
            curl -sS "http://localhost/photo2/api_all_rooms.php" | sudo python3 -c "
            import json,sys
            d = json.load(sys.stdin)
            print(\"ok=\", d.get(\"ok\"), \"count=\", d.get(\"count\"))
            for r in d.get(\"rooms\",[])[:25]:
                print(\"  room_id=\", r.get(\"room_id\"), \"kind=\", r.get(\"kind\"), \"exists=\", r.get(\"exists\"), \"nums=\", len(r.get(\"nums\",[])), \"ver=\", r.get(\"ver\"), \"st=\", r.get(\"server_time\"))
            "

            echo ""
            echo "===== [7] 원본 xtd6688 API 응답 샘플 (방 17=87 확인) ====="
            curl -sS -H "Origin: https://gs.xtd6688.com" -H "Referer: https://gs.xtd6688.com/luzhu/zh/pc.html" -H "User-Agent: Mozilla/5.0" "https://api.xtd6688.com/api/diantou/table/getData/gameType/3/tableId/87/xue/null" | head -c 500
            echo ""
            echo ""
            echo "===== DONE ====="
            '
