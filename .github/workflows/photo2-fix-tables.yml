name: photo2 - fix tables.json (xtd/xtd_map/xtd_kind 추가) + discover_sinji_new 확인

on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo2-fix-tables.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 2-hop - discover_sinji_new.php 확인 + tables.json 병합 + collector 재실행
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 300s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='
            set -uo pipefail
            P1="/var/www/sites/chamgyo/public/photo"
            TF="$P1/data/tables.json"

            echo "===== [1] discover_sinji_new.php 소스 (tables.json 덮어쓰는지 확인) ====="
            cat "$P1/discover_sinji_new.php" 2>/dev/null | head -100 || echo "MISSING"

            echo ""
            echo "===== [2] collector.php 소스 (다른 collector 확인) ====="
            cat "$P1/collector.php"

            echo ""
            echo "===== [3] 현재 tables.json BEFORE ====="
            sudo cat "$TF"
            sudo ls -la "$TF"

            echo ""
            echo "===== [4] 백업 + tables.json에 xtd 필드 추가 (merge) ====="
            TS=$(date +%s)
            sudo cp "$TF" "$TF.bak.$TS"
            echo "backup: $TF.bak.$TS"

            sudo -u www-data /usr/bin/php -r "
            \$tf = '"$TF"';
            \$cur = json_decode(file_get_contents(\$tf), true) ?: [];
            \$cur['xtd'] = [10,11,12,15,16,17,18,19,20,21,22,23,25,26,27,55,66,77,88,99];
            \$cur['xtd_map'] = ['10'=>10,'11'=>11,'12'=>12,'15'=>15,'16'=>16,'17'=>87,'18'=>18,'19'=>89,'20'=>20,'21'=>21,'22'=>22,'23'=>23,'25'=>25,'26'=>26,'27'=>27,'55'=>31,'66'=>32,'77'=>33,'88'=>34,'99'=>35];
            \$cur['xtd_kind'] = ['10'=>'21점','16'=>'용호'];
            file_put_contents(\$tf, json_encode(\$cur, JSON_UNESCAPED_UNICODE));
            echo \"tables.json updated\\n\";
            echo file_get_contents(\$tf).\"\\n\";
            "

            echo ""
            echo "===== [5] AFTER tables.json ====="
            sudo cat "$TF"
            echo ""

            echo ""
            echo "===== [6] collector_xtd.php 즉시 강제 실행 (20방 다 폴링) ====="
            cd "$P1"
            sudo -u www-data /usr/bin/php collector_xtd.php 2>&1 | head -20
            echo ""

            echo ""
            echo "===== [7] 3초 대기 후 room_XX 상태 재확인 ====="
            sleep 3
            NOW=$(date +%s)
            echo "server_now: $NOW"
            for L in 10 11 12 15 16 17 18 19 20 21 22 23 25 26 27 55 66 77 88 99; do
              F="$P1/data/room_${L}.json"
              if [ -f "$F" ]; then
                MT=$(stat -c %Y "$F" 2>/dev/null)
                AGE=$((NOW - MT))
                SZ=$(stat -c %s "$F" 2>/dev/null)
                # nums length
                NL=$(sudo cat "$F" | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d.get(\"nums\",[])))" 2>/dev/null || echo "?")
                printf "room_%-4s : age=%-6ss  size=%-5sB  nums_len=%s\n" "$L" "$AGE" "$SZ" "$NL"
              else
                printf "room_%-4s : MISSING (xtd_map: %s)\n" "$L" "$L"
              fi
            done

            echo ""
            echo "===== [8] api_all_rooms.php 재응답 ====="
            curl -sS "http://localhost/photo2/api_all_rooms.php" | python3 -c "
            import json,sys
            d=json.load(sys.stdin)
            print(f\"ok={d.get(chr(39)+\"ok\"+chr(39))} count={d.get(chr(39)+\"count\"+chr(39))}\")
            for r in d.get(chr(39)+\"rooms\"+chr(39), [])[:25]:
                print(f\"  room_id={r.get(chr(39)+\"room_id\"+chr(39))} kind={r.get(chr(39)+\"kind\"+chr(39))} exists={r.get(chr(39)+\"exists\"+chr(39))} nums_len={len(r.get(chr(39)+\"nums\"+chr(39),[]))} ver={r.get(chr(39)+\"ver\"+chr(39))} t={r.get(chr(39)+\"server_time\"+chr(39))}\")
            " 2>&1 | head -30

            echo ""
            echo "===== DONE ====="
            '
