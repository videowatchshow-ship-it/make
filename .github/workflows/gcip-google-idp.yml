name: gcip enable google idp

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-gcip-google.txt']

jobs:
  idp:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Recreate google.com idp with .env client
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            PROJECT=quantum-bonus-455522-b4
            CID='956283750273-do3ebgq60vbi585r62ffpk0cqts8l634.apps.googleusercontent.com'
            SECRET=$(sudo grep -oiE 'GOCSPX-[A-Za-z0-9_-]{10,}' /opt/gauth-full/.env | head -1)
            TOKEN=$(gcloud auth print-access-token 2>/dev/null)
            BASE="https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT/defaultSupportedIdpConfigs"
            curl -s -X POST "$BASE?idpId=google.com" -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $PROJECT" -H 'Content-Type: application/json' -d "{\"enabled\":true,\"clientId\":\"$CID\",\"clientSecret\":\"$SECRET\"}" | head -c 400
            echo ''
            curl -s "$BASE/google.com" -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $PROJECT" | python3 -c "import sys,json; d=json.load(sys.stdin); print('enabled:',d.get('enabled'),'clientId:',d.get('clientId'))" 2>/dev/null || echo 'fail'
