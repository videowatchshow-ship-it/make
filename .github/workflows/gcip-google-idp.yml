name: gcip enable google idp

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-gcip-google.txt']

jobs:
  idp:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Enable google.com defaultSupportedIdpConfig
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 90s
          script: |
            PROJECT=quantum-bonus-455522-b4
            CID='956283750273-do3ebgq60vbi585r62ffpk0cqts8l634.apps.googleusercontent.com'
            SECRET=$(sudo grep -oiE 'GOCSPX-[A-Za-z0-9_-]{10,}' /opt/gauth-full/.env | head -1)
            echo "secret length: ${#SECRET}"
            TOKEN=$(gcloud auth print-access-token 2>/dev/null)

            echo '=== 1. list existing defaultSupportedIdpConfigs ==='
            curl -s "https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT/defaultSupportedIdpConfigs" -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $PROJECT" | head -c 500
            echo ''

            echo ''
            echo '=== 2. try CREATE google.com idp config ==='
            CREATE=$(curl -s -X POST "https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT/defaultSupportedIdpConfigs?idpId=google.com" \
              -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $PROJECT" -H 'Content-Type: application/json' \
              -d "{\"enabled\":true,\"clientId\":\"$CID\",\"clientSecret\":\"$SECRET\"}")
            echo "$CREATE" | head -c 800
            echo ''

            if echo "$CREATE" | grep -q 'ALREADY_EXISTS\|already exists'; then
              echo ''
              echo '=== 2b. exists -> PATCH update ==='
              curl -s -X PATCH "https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT/defaultSupportedIdpConfigs/google.com?updateMask=enabled,clientId,clientSecret" \
                -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $PROJECT" -H 'Content-Type: application/json' \
                -d "{\"enabled\":true,\"clientId\":\"$CID\",\"clientSecret\":\"$SECRET\"}" | head -c 800
              echo ''
            fi

            echo ''
            echo '=== 3. verify google.com idp enabled ==='
            curl -s "https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT/defaultSupportedIdpConfigs/google.com" -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $PROJECT" | python3 -c "import sys,json; d=json.load(sys.stdin); print('name:',d.get('name')); print('enabled:',d.get('enabled')); print('clientId:',d.get('clientId'))" 2>/dev/null || echo 'verify parse fail'
