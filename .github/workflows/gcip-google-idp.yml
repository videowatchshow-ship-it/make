name: gcip enable google idp

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-gcip-google.txt']

jobs:
  idp:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Switch google.com idp to Firebase-managed client
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 90s
          script: |
            PROJECT=quantum-bonus-455522-b4
            TOKEN=$(gcloud auth print-access-token 2>/dev/null)
            BASE="https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT/defaultSupportedIdpConfigs"

            echo '=== 1. try PATCH clear clientId/clientSecret (use managed) ==='
            curl -s -X PATCH "$BASE/google.com?updateMask=enabled,clientId,clientSecret" \
              -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $PROJECT" -H 'Content-Type: application/json' \
              -d '{"enabled":true,"clientId":"","clientSecret":""}' | head -c 600
            echo ''

            echo ''
            echo '=== 2. verify current state ==='
            curl -s "$BASE/google.com" -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $PROJECT" | python3 -c "import sys,json; d=json.load(sys.stdin); print('enabled:',d.get('enabled')); print('clientId:',repr(d.get('clientId')))" 2>/dev/null || echo 'parse fail'

            echo ''
            echo '=== 3. if clientId still set, DELETE then recreate enabled-only ==='
            CUR=$(curl -s "$BASE/google.com" -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $PROJECT")
            if echo "$CUR" | grep -q 'googleusercontent'; then
              echo 'still custom -> delete + recreate'
              curl -s -X DELETE "$BASE/google.com" -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $PROJECT" | head -c 200
              echo ''
              sleep 3
              curl -s -X POST "$BASE?idpId=google.com" -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $PROJECT" -H 'Content-Type: application/json' -d '{"enabled":true}' | head -c 600
              echo ''
            fi

            echo ''
            echo '=== 4. final verify ==='
            curl -s "$BASE/google.com" -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $PROJECT" | python3 -c "import sys,json; d=json.load(sys.stdin); print('enabled:',d.get('enabled')); print('clientId:',repr(d.get('clientId')))" 2>/dev/null || echo 'parse fail'
