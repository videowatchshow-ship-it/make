name: Test login without token
on:
  push:
    branches: ['claude/broadcast-ip-check-z57wox']
    paths: ['.github/workflows/test-login-noauth.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test login-one and subsite-accounts without token
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "=== 1. login-one without auth ==="
            curl -s -w "\nHTTP:%{http_code}" http://localhost:4000/api/login-one \
              -X POST -H "content-type: application/json" \
              -d '{"email":"test-does-not-exist@gmail.com"}'

            echo ""
            echo "=== 2. subsite-accounts without auth ==="
            RESP=$(curl -s -w "\nHTTP:%{http_code}" http://localhost:4000/api/subsite-accounts)
            echo "${RESP:0:800}"

            echo ""
            echo "=== 3. normalized-accounts without auth ==="
            RESP2=$(curl -s -w "\nHTTP:%{http_code}" http://localhost:4000/api/normalized-accounts)
            echo "${RESP2:0:300}"

            echo ""
            echo "=== 4. login-one with SIM5_TOKEN ==="
            SIM5=$(sudo grep -oP 'SIM5_TOKEN=\K.*' /opt/gauth-full/.env 2>/dev/null || echo "")
            if [ -n "$SIM5" ]; then
              curl -s -w "\nHTTP:%{http_code}" http://localhost:4000/api/login-one \
                -X POST -H "content-type: application/json" -H "Authorization: Bearer $SIM5" \
                -d '{"email":"test-does-not-exist@gmail.com"}'
            else
              echo "(no SIM5_TOKEN)"
            fi
