name: Test login with token
on:
  push:
    branches: ['claude/broadcast-ip-check-z57wox']
    paths: ['.github/workflows/test-login-noauth.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test login-one with GAUTH_API_TOKEN
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "=== 1. Check GAUTH_API_TOKEN exists ==="
            sudo grep 'GAUTH_API_TOKEN=' /opt/gauth-full/.env | sed 's/=.*/=***set***/'

            echo ""
            echo "=== 2. gauth service status ==="
            sudo systemctl is-active gauth && echo "RUNNING" || echo "NOT RUNNING"

            echo ""
            echo "=== 3. login-one WITH token ==="
            TOKEN=$(sudo grep -oP 'GAUTH_API_TOKEN=\K.*' /opt/gauth-full/.env)
            curl -s -w "\nHTTP:%{http_code}" http://localhost:4000/api/login-one \
              -X POST -H "content-type: application/json" \
              -H "Authorization: Bearer $TOKEN" \
              -d '{"email":"test-not-exist@gmail.com"}'

            echo ""
            echo "=== 4. login-one WITHOUT token ==="
            curl -s -w "\nHTTP:%{http_code}" http://localhost:4000/api/login-one \
              -X POST -H "content-type: application/json" \
              -d '{"email":"test-not-exist@gmail.com"}'

            echo ""
            echo "=== 5. Token value ==="
            echo "$TOKEN"
