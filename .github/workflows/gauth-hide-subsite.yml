name: gauth · hide subsite parts on main (safe, keep lookup+master)

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-hide-subsite.txt']

jobs:
  hide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inject null-guarded hide script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            F=/var/www/sites/gauth/public/index.html
            sudo cp "$F" "$F.bak.hide.$(date +%s)"
            sudo python3 - <<'PYEOF'
            import re
            f = '/var/www/sites/gauth/public/index.html'
            s = open(f, encoding='utf-8').read()
            s = re.sub(r'<!-- hide-subsite start -->.*?<!-- hide-subsite end -->\n', '', s, flags=re.S)
            block = (
              '<!-- hide-subsite start -->\n'
              '<style>#subsite-view{display:none !important}#subsite-counts{display:none !important}#tab-subsite{display:none !important}</style>\n'
              '<script>\n'
              'document.addEventListener("DOMContentLoaded", function(){\n'
              '  try {\n'
              '    var sv=document.getElementById("subsite-view"); if(sv) sv.style.display="none";\n'
              '    var sc=document.getElementById("subsite-counts"); if(sc) sc.style.display="none";\n'
              '    var st=document.getElementById("tab-subsite"); if(st) st.style.display="none";\n'
              '    var mv=document.getElementById("master-view"); if(mv) mv.style.display="block";\n'
              '    var mt=document.getElementById("tab-master"); if(mt && typeof mt.click==="function") mt.click();\n'
              '  } catch(e){}\n'
              '});\n'
              '</script>\n'
              '<!-- hide-subsite end -->\n'
            )
            if '</body>' in s:
                s = s.replace('</body>', block + '</body>', 1)
            else:
                s = s + block
            open(f, 'w', encoding='utf-8').write(s)
            print('hide-subsite block injected')
            PYEOF
            echo ''
            echo '=== verify ==='
            echo 'hide block present:'
            curl -s --max-time 10 https://gauth.cent-solution.online/ | grep -c 'hide-subsite start' || echo 0
            echo 'lookup (계정 정보 확인) still present:'
            curl -s --max-time 10 https://gauth.cent-solution.online/ | grep -c '계정 정보 확인' || echo 0
            echo 'main HTTPS:'
            curl -s -o /dev/null -w '%{http_code}\n' https://gauth.cent-solution.online/ --max-time 10
