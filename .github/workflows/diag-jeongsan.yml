name: Diagnose jeongsan page

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch bak-split + bak-win30 backups (원본 찾기)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 120s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='
            J="/var/www/sites/chamgyo/public/정산표"
            echo "===== ALL BAK FILES ====="
            sudo ls -la "$J/"*.bak* 2>&1 | head -40
            echo ""
            echo "===== BAK-SPLIT ====="
            echo "size: $(sudo wc -c < $J/index.html.bak-split-20260707-140834)"
            sudo cat "$J/index.html.bak-split-20260707-140834"
            echo ""
            echo "===== END BAK-SPLIT ====="
            echo ""
            echo "===== BAK-WIN30 ====="
            echo "size: $(sudo wc -c < $J/index.html.bak-win30-20260707-175118)"
            sudo cat "$J/index.html.bak-win30-20260707-175118"
            echo ""
            echo "===== END BAK-WIN30 ====="
            '
