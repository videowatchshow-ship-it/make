name: Diagnose jeongsan page

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current HTMLs (index / excel / udongka / 원장)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 120s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='
            for f in index.html excel.html udongka.html 원장.html; do
              echo "===== $f ====="
              echo "size: $(sudo wc -c < /var/www/sites/chamgyo/public/정산표/$f)"
              sudo cat "/var/www/sites/chamgyo/public/정산표/$f"
              echo ""
              echo "===== END $f ====="
              echo ""
            done
            '
