name: extract google login from info site

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-extract-glogin.txt']

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dump full unified auth JS + save to server for reuse
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            SITE='https://xn--9d0bw2fjtyymch7de9d.info'
            echo '=== save the unified auth JS onto gauth server ==='
            sudo mkdir -p /var/www/sites/gauth/public/core/auth
            curl -s --max-time 15 "$SITE/core/auth/google-auth-unified.js?v=20260712rrn" | sudo tee /var/www/sites/gauth/public/core/auth/google-auth-unified.js > /dev/null
            echo 'saved. size:'
            sudo wc -c /var/www/sites/gauth/public/core/auth/google-auth-unified.js
            echo ''
            echo '=== FULL JS CONTENT (for review) ==='
            sudo cat /var/www/sites/gauth/public/core/auth/google-auth-unified.js
