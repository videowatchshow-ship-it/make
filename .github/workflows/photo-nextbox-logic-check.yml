name: nextboxP nextboxB 채우는 JS 로직 확인 + 실측 렌더
on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-nextbox-logic-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: cAskP cAskB 그리는 JS 로직 추출
        run: |
          curl -sS -o /tmp/cah1.html "https://xn--9d0bw2fjtyymch7de9d.info/photo/CAH_1.html"
          BGLURL=$(grep -oE 'src="[^"]*bgl\.js[^"]*"' /tmp/cah1.html | head -1 | sed -E 's/src="([^"]*)"/\1/')
          curl -sS -o /tmp/bgl.js "https://xn--9d0bw2fjtyymch7de9d.info/photo/$BGLURL"

          echo "===== CAH_1.html 안의 cAskP/cAskB 관련 JS 라인 번호 ====="
          grep -n "cAskP\|cAskB" /tmp/cah1.html

          echo ""
          echo "===== cAskP 첫 등장 지점 앞뒤 60줄 (script 태그 내부일 가능성) ====="
          FIRSTLN=$(grep -n "cAskP" /tmp/cah1.html | grep -v "^[0-9]*:.*<canvas" | head -1 | cut -d: -f1)
          if [ -n "$FIRSTLN" ]; then
            START=$((FIRSTLN>20 ? FIRSTLN-20 : 1))
            END=$((FIRSTLN+80))
            sed -n "${START},${END}p" /tmp/cah1.html
          else
            echo "canvas 태그 외에는 cAskP 참조 없음 (외부 js 파일에 있을 가능성)"
          fi

          echo ""
          echo "===== bgl.js 안의 cAskP/cAskB 참조 ====="
          grep -n "cAskP\|cAskB" /tmp/bgl.js

          echo ""
          echo "===== CAH_1.html 안의 외부 script src 목록 ====="
          grep -oE '<script[^>]*src="[^"]*"' /tmp/cah1.html
