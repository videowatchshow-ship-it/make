name: BGL.wenlu / BGL.drawAsk 로직 + 실측 데이터 대조
on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-nextbox-logic-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: wenlu / drawAsk 함수 본문 + 현재 room 데이터
        run: |
          curl -sS -o /tmp/cah1.html "https://xn--9d0bw2fjtyymch7de9d.info/photo/CAH_1.html"
          BGLURL=$(grep -oE 'src="[^"]*bgl\.js[^"]*"' /tmp/cah1.html | head -1 | sed -E 's/src="([^"]*)"/\1/')
          curl -sS -o /tmp/bgl.js "https://xn--9d0bw2fjtyymch7de9d.info/photo/$BGLURL"

          echo "===== wenlu 함수 정의 위치 ====="
          grep -n "wenlu" /tmp/bgl.js || echo "wenlu 없음"

          echo ""
          echo "===== wenlu 함수 본문 (정의 지점부터 250자 단위로 다음 함수 전까지) ====="
          python3 -c "
import re
src = open('/tmp/bgl.js').read()
m = re.search(r'wenlu\s*[:=]\s*function[^{]*\{', src)
if not m:
    m = re.search(r'function\s+wenlu[^{]*\{', src)
if m:
    start = m.start()
    depth = 0
    i = m.end()-1
    while i < len(src):
        if src[i] == '{': depth += 1
        elif src[i] == '}':
            depth -= 1
            if depth == 0:
                break
        i += 1
    print(src[start:i+1][:3000])
else:
    print('wenlu 함수 본문 못찾음')
"

          echo ""
          echo "===== drawAsk 함수 본문 ====="
          python3 -c "
import re
src = open('/tmp/bgl.js').read()
m = re.search(r'drawAsk\s*[:=]\s*function[^{]*\{', src)
if not m:
    m = re.search(r'function\s+drawAsk[^{]*\{', src)
if m:
    start = m.start()
    depth = 0
    i = m.end()-1
    while i < len(src):
        if src[i] == '{': depth += 1
        elif src[i] == '}':
            depth -= 1
            if depth == 0:
                break
        i += 1
    print(src[start:i+1][:3000])
else:
    print('drawAsk 함수 본문 못찾음')
"

          echo ""
          echo "===== 현재 tak 계정 room 데이터 (nums 개수, 최근 5개) ====="
          curl -sS "https://xn--9d0bw2fjtyymch7de9d.info/photo/data/room_110.json" | python3 -c "
import sys,json
d=json.load(sys.stdin)
nums=d.get('nums',[])
print('id=',d.get('id'),'ver=',d.get('ver'),'count=',len(nums))
print('last10=',nums[-10:])
"
