name: 방 110 지금 데이터 즉시 확인

on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-current-110.yml'

jobs:
  now:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='sudo cat /var/www/sites/chamgyo/public/photo/data/room_110.json | python3 -c "
            import sys, json
            d = json.load(sys.stdin)
            n = d.get(\"nums\", [])
            print(f\"회차 id: {d.get(\\\"id\\\")}\")
            print(f\"ver: {d.get(\\\"ver\\\")}\")
            print(f\"server_time: {d.get(\\\"server_time\\\")}\")
            print(f\"판수: {len(n)}\")
            print(f\"시퀀스: {\\\" \\\".join(x[0] for x in n)}\")
            print(f\"P={sum(1 for x in n if x[0]==\\\"P\\\")} B={sum(1 for x in n if x[0]==\\\"B\\\")} T={sum(1 for x in n if x[0]==\\\"T\\\")}\")"'
