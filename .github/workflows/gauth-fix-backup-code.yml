name: gauth - fix backup code auto-login
on:
  push:
    paths:
      - '.github/workflows/gauth-fix-backup-code.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Patch rebrowser-login.js (backupCodes + LOCKED)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 4m
          script: |
            sudo cp /opt/gauth-full/rebrowser-login.js /opt/gauth-full/rebrowser-login.js.bak-bkfix
            sudo sed -i 's/rawData\.push({ email: a\.email, password: a\.password, twoFA: a\.totp_secret })/rawData.push({ email: a.email, password: a.password, twoFA: a.totp_secret, backupCodes: a.backup_codes || '\'''\'' })/' /opt/gauth-full/rebrowser-login.js
            sudo sed -i "s/'PHONE_REQUIRED','PASSKEY_REQUIRED','DEVICE_PROMPT','SECURITY_KEY','BACKUP_CODE','REJECTED'/'PHONE_REQUIRED','PASSKEY_REQUIRED','DEVICE_PROMPT','SECURITY_KEY','REJECTED'/" /opt/gauth-full/rebrowser-login.js
            echo "=== rebrowser-login.js 패치 확인 ==="
            sudo grep -n "backupCodes\|BACKUP_CODE\|LOCKED" /opt/gauth-full/rebrowser-login.js | head -8

      - name: Patch google.js (BACKUP_CODE handling)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 4m
          script: |
            sudo cp /opt/gauth-full/lib/login/google.js /opt/gauth-full/lib/login/google.js.bak-bkfix
            sudo python3 -c "
            import re, sys
            f = '/opt/gauth-full/lib/login/google.js'
            c = open(f).read()
            old = \"if (['PHONE_REQUIRED', 'DEVICE_PROMPT', 'SECURITY_KEY', 'PASSKEY_REQUIRED', 'BACKUP_CODE'].includes(cls.kind)) {\"
            if old not in c:
                print('PATCH FAIL: 패턴 없음')
                lines = c.split('\n')
                for i,l in enumerate(lines[648:668], 649):
                    print(f'{i}: {l}')
                sys.exit(1)
            new = '''if (cls.kind === 'BACKUP_CODE') {
              const rawCodes = (account.backupCodes || '').trim()
              if (!rawCodes) {
                broadcast({ type: 'log', message: '[' + account.email + '] BACKUP_CODE 요청됐으나 백업 코드 없음' })
                return { success: false, reason: 'BACKUP_CODE' }
              }
              const codes = rawCodes.split(/\\\\s+/).filter(Boolean)
              const code = codes[0].replace(/\\\\s/g, '')
              broadcast({ type: 'log', message: '[' + account.email + '] 백업 코드 입력: ' + code })
              try {
                const inputSel = 'input[type=\"text\"], input[type=\"tel\"], input[autocomplete=\"one-time-code\"]'
                await page.waitForSelector(inputSel, { timeout: 8000 })
                await page.click(inputSel)
                await page.fill(inputSel, code)
                await page.keyboard.press('Enter')
                await page.waitForTimeout(4000)
                const afterUrl = page.url()
                if (afterUrl && !afterUrl.includes('accounts.google.com/signin') && !afterUrl.includes('/challenge')) {
                  broadcast({ type: 'log', message: '[' + account.email + '] 백업 코드 로그인 성공' })
                  return { success: true }
                }
                broadcast({ type: 'log', message: '[' + account.email + '] 백업 코드 실패: ' + afterUrl })
                return { success: false, reason: 'BACKUP_CODE_FAILED' }
              } catch (e) {
                broadcast({ type: 'log', message: '[' + account.email + '] 백업 코드 오류: ' + e.message })
                return { success: false, reason: 'BACKUP_CODE_FAILED' }
              }
            } else if (['PHONE_REQUIRED', 'DEVICE_PROMPT', 'SECURITY_KEY', 'PASSKEY_REQUIRED'].includes(cls.kind)) {'''
            open(f, 'w').write(c.replace(old, new))
            print('google.js 패치 완료')
            "
            echo "=== google.js 패치 확인 ==="
            sudo sed -n '650,705p' /opt/gauth-full/lib/login/google.js

      - name: Clear BACKUP_CODE from failed list and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 2m
          script: |
            sudo python3 -c "
            import json, os
            p = '/opt/gauth-full/failed_accounts.json'
            if not os.path.exists(p):
                print('failed_accounts.json 없음')
            else:
                d = json.loads(open(p).read())
                removed = [e for e,i in d.items() if i.get('reason') == 'BACKUP_CODE']
                for e in removed: del d[e]
                open(p,'w').write(json.dumps(d, indent=2))
                print(f'BACKUP_CODE 항목 {len(removed)}개 제거: {removed[:5]}')
            "
            sudo systemctl restart gauth
            sleep 4
            sudo systemctl is-active gauth
            echo "=== 완료 ==="
