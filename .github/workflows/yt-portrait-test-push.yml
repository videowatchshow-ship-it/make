name: yt-portrait-test-push
on:
  workflow_dispatch:
    inputs:
      key1:
        description: 'YouTube stream key #1'
        required: true
      key2:
        description: 'YouTube stream key #2'
        required: true
      duration:
        description: 'seconds to push to each'
        required: false
        default: '60'

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Mask keys immediately
        run: |
          echo "::add-mask::${{ inputs.key1 }}"
          echo "::add-mask::${{ inputs.key2 }}"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Push synthetic 1080x1920 portrait test pattern to both keys in parallel
        env:
          K1: ${{ inputs.key1 }}
          K2: ${{ inputs.key2 }}
          DUR: ${{ inputs.duration }}
        run: |
          set +e
          FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf

          ffmpeg -y -f lavfi -i "testsrc2=size=1080x1920:rate=30" \
            -f lavfi -i "sine=frequency=440:sample_rate=44100" \
            -vf "drawtext=fontfile=${FONT}:text='CENTBEAM PORTRAIT TEST 1':fontcolor=white:fontsize=44:x=(w-text_w)/2:y=100:box=1:boxcolor=black@0.6,drawtext=fontfile=${FONT}:text='%{localtime}':fontcolor=yellow:fontsize=36:x=(w-text_w)/2:y=180:box=1:boxcolor=black@0.6" \
            -c:v libx264 -preset veryfast -pix_fmt yuv420p -b:v 4000k -maxrate 4000k -bufsize 8000k -g 60 \
            -c:a aac -b:a 128k -t "${DUR}" -f flv "rtmp://a.rtmp.youtube.com/live2/${K1}" \
            > /tmp/k1.log 2>&1 &
          PID1=$!

          ffmpeg -y -f lavfi -i "testsrc2=size=1080x1920:rate=30" \
            -f lavfi -i "sine=frequency=880:sample_rate=44100" \
            -vf "drawtext=fontfile=${FONT}:text='CENTBEAM PORTRAIT TEST 2':fontcolor=white:fontsize=44:x=(w-text_w)/2:y=100:box=1:boxcolor=black@0.6,drawtext=fontfile=${FONT}:text='%{localtime}':fontcolor=yellow:fontsize=36:x=(w-text_w)/2:y=180:box=1:boxcolor=black@0.6" \
            -c:v libx264 -preset veryfast -pix_fmt yuv420p -b:v 4000k -maxrate 4000k -bufsize 8000k -g 60 \
            -c:a aac -b:a 128k -t "${DUR}" -f flv "rtmp://a.rtmp.youtube.com/live2/${K2}" \
            > /tmp/k2.log 2>&1 &
          PID2=$!

          wait $PID1; R1=$?
          wait $PID2; R2=$?

          echo "================ KEY 1 result: exit=${R1} ================"
          tail -60 /tmp/k1.log
          echo "================ KEY 2 result: exit=${R2} ================"
          tail -60 /tmp/k2.log

          echo "R1=${R1}" >> "$GITHUB_ENV"
          echo "R2=${R2}" >> "$GITHUB_ENV"

      - name: Summary
        if: always()
        run: |
          echo "KEY1 exit=${R1:-unknown}  KEY2 exit=${R2:-unknown}"
          if [ "${R1:-1}" = "0" ]; then echo "✅ KEY1: ffmpeg가 duration 끝까지 정상 종료 — RTMP publish 성공(연결 유지됨)"; else echo "❌ KEY1: ffmpeg 비정상 종료 — 로그의 에러 확인 필요"; fi
          if [ "${R2:-1}" = "0" ]; then echo "✅ KEY2: ffmpeg가 duration 끝까지 정상 종료 — RTMP publish 성공(연결 유지됨)"; else echo "❌ KEY2: ffmpeg 비정상 종료 — 로그의 에러 확인 필요"; fi
