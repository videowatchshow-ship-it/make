name: gauth · switch to OLD client_id (do3ebgq60 — has gauth origin)

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-switch-old-cid.txt']

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Switch client_id to OLD client and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 120s
          script: |
            set -e
            OLD_CID="956283750273-do3ebgq60vbi585r62ffpk0cqts8l634.apps.googleusercontent.com"

            echo "=== 1. Update .env ==="
            ENV=/opt/gauth-full/.env
            if [ -f "$ENV" ]; then
              sudo sed -i "s|^GOOGLE_OAUTH_CLIENT_ID=.*|GOOGLE_OAUTH_CLIENT_ID=$OLD_CID|" "$ENV"
            else
              echo "GOOGLE_OAUTH_CLIENT_ID=$OLD_CID" | sudo tee "$ENV" > /dev/null
            fi
            echo ".env client_id:"
            grep GOOGLE_OAUTH_CLIENT_ID "$ENV"

            echo ""
            echo "=== 2. Update systemd env drop-in ==="
            sudo mkdir -p /etc/systemd/system/gauth.service.d
            sudo tee /etc/systemd/system/gauth.service.d/google-oauth.conf > /dev/null <<EOF
            [Service]
            Environment="GOOGLE_OAUTH_CLIENT_ID=$OLD_CID"
            EOF
            sudo systemctl daemon-reload

            echo ""
            echo "=== 3. Update index.html GSI widget client_id (if hardcoded) ==="
            F=/var/www/sites/gauth/public/index.html
            if grep -q '30t6q00h' "$F" 2>/dev/null; then
              sudo sed -i "s|956283750273-30t6q00h5idrl9olghtr1lm8bsum2tpq\.apps\.googleusercontent\.com|$OLD_CID|g" "$F"
              echo "index.html patched"
            else
              echo "index.html: no hardcoded new CID found (uses /api/auth/config, OK)"
            fi

            echo ""
            echo "=== 4. Restart gauth ==="
            sudo systemctl restart gauth
            sleep 2
            sudo systemctl is-active gauth

            echo ""
            echo "=== 5. Verify ==="
            echo "config endpoint:"
            curl -s --max-time 10 http://localhost:4000/api/auth/config
            echo ""
            echo "main page widget check:"
            curl -s --max-time 10 https://gauth.cent-solution.online/ | grep -o 'client_id:[^,}]*' | head -1 || echo "(uses /api/auth/config dynamically)"
            echo ""
            echo "DONE — client_id switched to OLD: $OLD_CID"
