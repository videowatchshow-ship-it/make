name: Start CVAmp Servers

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube URL'
        required: false
        default: ''

jobs:
  start:
    runs-on: self-hosted
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -File "{0}"
    steps:
      - name: Find working python (before killing anything)
        if: always()
        continue-on-error: true
        run: |
          # The already-running python processes prove a python with flask+psutil exists.
          # Grab its ExecutablePath BEFORE we kill them.
          $running = Get-CimInstance Win32_Process -Filter "Name='python.exe'" -ErrorAction SilentlyContinue |
            Where-Object { $_.ExecutablePath } |
            Select-Object -ExpandProperty ExecutablePath -Unique
          Write-Host "Running python executables:"
          $running | ForEach-Object { Write-Host "  $_" }

          $candidates = @()
          $candidates += $running
          $candidates += @(
            "E:\CVAmp_5000\venv\Scripts\python.exe",
            "E:\CVAmp_6001\venv\Scripts\python.exe",
            "C:\Python313\python.exe",
            "C:\Python312\python.exe",
            "C:\Python311\python.exe"
          )

          $found = $null
          foreach ($p in $candidates) {
            if ($p -and (Test-Path $p)) {
              & $p -c "import flask, psutil" 2>$null
              if ($LASTEXITCODE -eq 0) {
                Write-Host "WORKING python (flask+psutil): $p"
                $found = $p
                break
              } else {
                Write-Host "no flask/psutil: $p"
              }
            }
          }
          if (-not $found) {
            Write-Host "WARNING: no python with flask+psutil found; falling back to first running python"
            if ($running) { $found = @($running)[0] } else { $found = "C:\Python313\python.exe" }
          }
          Write-Host "SELECTED python: $found"
          echo "PYTHON_EXE=$found" >> $env:GITHUB_ENV

      - name: Stop existing python processes
        if: always()
        continue-on-error: true
        run: |
          Get-Process python -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

      - name: Fix CVAmp_6003 IndentationError
        if: always()
        continue-on-error: true
        run: |
          $path = "E:\CVAmp_6003\app.py"
          if (Test-Path $path) {
            $lines = Get-Content $path
            $out = [System.Collections.Generic.List[string]]::new()
            $skip = 0
            foreach ($line in $lines) {
              if ($skip -gt 0) { $skip--; continue }
              if ($line.TrimStart() -eq "try:") { $skip = 5; continue }
              $out.Add($line)
            }
            [System.IO.File]::WriteAllLines($path, $out, [System.Text.UTF8Encoding]::new($false))
            Write-Host "Fixed: $path"
          } else {
            Write-Host "File not found: $path"
          }

      - name: Start CVAmp_5000
        if: always()
        continue-on-error: true
        run: |
          $py = if ($env:PYTHON_EXE) { $env:PYTHON_EXE } else { "C:\Python313\python.exe" }
          Write-Host "Starting CVAmp_5000 with $py"
          New-Item -Force -ItemType Directory C:\temp | Out-Null
          Start-Process $py -ArgumentList "app.py" -WorkingDirectory "E:\CVAmp_5000" -RedirectStandardError "C:\temp\5000_err.log" -WindowStyle Hidden
          Start-Sleep -Seconds 3
          if (Test-Path C:\temp\5000_err.log) { Write-Host "5000 STDERR:"; Get-Content C:\temp\5000_err.log }

      - name: Start CVAmp_6001
        if: always()
        continue-on-error: true
        run: |
          $py = if ($env:PYTHON_EXE) { $env:PYTHON_EXE } else { "C:\Python313\python.exe" }
          Start-Process $py -ArgumentList "app.py" -WorkingDirectory "E:\CVAmp_6001" -RedirectStandardError "C:\temp\6001_err.log" -WindowStyle Hidden

      - name: Start CVAmp_6002
        if: always()
        continue-on-error: true
        run: |
          $py = if ($env:PYTHON_EXE) { $env:PYTHON_EXE } else { "C:\Python313\python.exe" }
          Start-Process $py -ArgumentList "app.py" -WorkingDirectory "E:\CVAmp_6002" -RedirectStandardError "C:\temp\6002_err.log" -WindowStyle Hidden

      - name: Start CVAmp_6003
        if: always()
        continue-on-error: true
        run: |
          $py = if ($env:PYTHON_EXE) { $env:PYTHON_EXE } else { "C:\Python313\python.exe" }
          Start-Process $py -ArgumentList "app.py" -WorkingDirectory "E:\CVAmp_6003" -RedirectStandardError "C:\temp\6003_err.log" -WindowStyle Hidden

      - name: Wait for servers
        if: always()
        continue-on-error: true
        run: Start-Sleep -Seconds 10

      - name: Check ports listening
        if: always()
        continue-on-error: true
        run: |
          Write-Host "=== Listening ports ==="
          netstat -an | Select-String "LISTENING" | Select-String ":5000|:6001|:6002|:6003"
          Write-Host "=== Python processes ==="
          Get-Process python -ErrorAction SilentlyContinue | Format-Table Id,CPU,WorkingSet
          Write-Host "=== STDERR logs ==="
          foreach ($p in @("6001","6002","6003")) {
            $log = "C:\temp\${p}_err.log"
            if (Test-Path $log) {
              $c = Get-Content $log -Raw
              if ($c) { Write-Host "--- $p STDERR ---"; Write-Host $c }
            }
          }

      - name: Call /api/start on all servers
        if: always()
        continue-on-error: true
        run: |
          $url = "${{ github.event.inputs.youtube_url }}"
          $ports = @(5000, 6001, 6002, 6003)
          foreach ($port in $ports) {
            try {
              $body = "{`"url`":`"$url`"}"
              Invoke-RestMethod -Uri "http://localhost:$port/api/start" -Method POST -Body $body -ContentType "application/json" -TimeoutSec 10
              Write-Host "Started port $port"
            } catch {
              Write-Host "Port ${port} failed"
            }
          }
