name: Start CVAmp Servers

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube URL'
        required: false
        default: ''

jobs:
  start:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Stop existing python processes
        shell: powershell
        continue-on-error: true
        run: |
          Get-Process python -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

      - name: Fix CVAmp_6003 IndentationError
        if: always()
        shell: powershell
        continue-on-error: true
        run: |
          $path = "E:\CVAmp_6003\app.py"
          if (Test-Path $path) {
            $lines = Get-Content $path
            $out = [System.Collections.Generic.List[string]]::new()
            $skip = 0
            foreach ($line in $lines) {
              if ($skip -gt 0) { $skip--; continue }
              if ($line.TrimStart() -eq "try:") { $skip = 5; continue }
              $out.Add($line)
            }
            [System.IO.File]::WriteAllLines($path, $out, [System.Text.UTF8Encoding]::new($false))
            Write-Host "Fixed: $path"
          } else {
            Write-Host "File not found: $path"
          }

      - name: Diagnose CVAmp_5000 startup
        if: always()
        shell: powershell
        continue-on-error: true
        run: |
          cd E:\CVAmp_5000
          $p = Start-Process python -ArgumentList "app.py" -WorkingDirectory "E:\CVAmp_5000" -RedirectStandardOutput "C:\temp\5000_out.log" -RedirectStandardError "C:\temp\5000_err.log" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 5
          Write-Host "=== STDOUT ==="
          if (Test-Path C:\temp\5000_out.log) { Get-Content C:\temp\5000_out.log }
          Write-Host "=== STDERR ==="
          if (Test-Path C:\temp\5000_err.log) { Get-Content C:\temp\5000_err.log }
          Write-Host "=== Process alive: $(-not $p.HasExited) ==="

      - name: Start CVAmp_5000
        if: always()
        shell: powershell
        continue-on-error: true
        run: |
          Start-Process python -ArgumentList "app.py" -WorkingDirectory "E:\CVAmp_5000" -WindowStyle Hidden

      - name: Start CVAmp_6001
        if: always()
        shell: powershell
        continue-on-error: true
        run: |
          Start-Process python -ArgumentList "app.py" -WorkingDirectory "E:\CVAmp_6001" -WindowStyle Hidden

      - name: Start CVAmp_6002
        if: always()
        shell: powershell
        continue-on-error: true
        run: |
          Start-Process python -ArgumentList "app.py" -WorkingDirectory "E:\CVAmp_6002" -WindowStyle Hidden

      - name: Start CVAmp_6003
        if: always()
        shell: powershell
        continue-on-error: true
        run: |
          Start-Process python -ArgumentList "app.py" -WorkingDirectory "E:\CVAmp_6003" -WindowStyle Hidden

      - name: Wait for servers
        if: always()
        shell: powershell
        continue-on-error: true
        run: Start-Sleep -Seconds 8

      - name: Check ports listening
        if: always()
        shell: powershell
        continue-on-error: true
        run: |
          Start-Sleep -Seconds 5
          Write-Host "=== Listening ports ==="
          netstat -an | Select-String "LISTENING" | Select-String ":5000|:6001|:6002|:6003"
          Write-Host "=== Python processes ==="
          Get-Process python -ErrorAction SilentlyContinue | Format-Table Id,CPU,WorkingSet

      - name: Call /api/start on all servers
        if: always()
        shell: powershell
        continue-on-error: true
        run: |
          $url = "${{ github.event.inputs.youtube_url }}"
          $ports = @(5000, 6001, 6002, 6003)
          foreach ($port in $ports) {
            try {
              $body = "{`"url`":`"$url`"}"
              Invoke-RestMethod -Uri "http://localhost:$port/api/start" -Method POST -Body $body -ContentType "application/json" -TimeoutSec 10
              Write-Host "Started port $port"
            } catch {
              Write-Host "Port $port: $_"
            }
          }
