name: Start CVAmp Servers

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube URL'
        required: false
        default: ''

jobs:
  start:
    runs-on: self-hosted
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -File "{0}"
    steps:
      - name: Find working python (search disk for one with psutil)
        if: always()
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'SilentlyContinue'

          # 1) Try to read the command line of already-running python procs (they have all deps).
          $fromRunning = @()
          try {
            $fromRunning = Get-CimInstance Win32_Process -Filter "Name='python.exe'" |
              ForEach-Object { $_.ExecutablePath; ($_.CommandLine -split '"')[1] } |
              Where-Object { $_ -and ($_ -like '*python*.exe') }
          } catch {}

          # 2) Search likely install roots for every python.exe on disk.
          $roots = @("E:\", "C:\Python313", "C:\Python312", "C:\Python311",
                     "C:\Program Files", "C:\Program Files (x86)",
                     "C:\Users", "D:\", "F:\", "G:\")
          $disk = @()
          foreach ($r in $roots) {
            if (Test-Path $r) {
              $disk += Get-ChildItem -Path $r -Filter python.exe -Recurse -Depth 5 -File 2>$null |
                       Select-Object -ExpandProperty FullName
            }
          }

          $candidates = @($fromRunning + $disk) | Where-Object { $_ } | Select-Object -Unique
          Write-Host "=== python.exe candidates found ==="
          $candidates | ForEach-Object { Write-Host "  $_" }

          # Test flask and psutil SEPARATELY for each python.
          # psutil is a C-extension (version-locked); flask is pure-python (portable via PYTHONPATH).
          $withBoth = $null
          $withPsutil = @()   # pythons that can import psutil
          $flaskDirs = @()    # site-packages dirs that contain flask (from pythons that have flask)
          foreach ($p in $candidates) {
            if (-not (Test-Path $p)) { continue }
            & $p -c "import psutil" 2>$null; $ps = ($LASTEXITCODE -eq 0)
            & $p -c "import flask"  2>$null; $fl = ($LASTEXITCODE -eq 0)
            Write-Host ("psutil={0} flask={1}  {2}" -f $ps, $fl, $p)
            if ($ps -and $fl -and -not $withBoth) { $withBoth = $p }
            if ($ps) { $withPsutil += $p }
            if ($fl) {
              $d = & $p -c "import os,flask; print(os.path.dirname(os.path.dirname(flask.__file__)))" 2>$null
              if ($d -and (Test-Path $d)) { $flaskDirs += $d }
            }
          }

          $found = $null
          if ($withBoth) {
            Write-Host "FOUND python with BOTH: $withBoth"
            $found = $withBoth
          }
          elseif ($withPsutil.Count -gt 0 -and $flaskDirs.Count -gt 0) {
            # Combine: python that has psutil + flask supplied via PYTHONPATH from another install.
            foreach ($pp in $withPsutil) {
              foreach ($fd in ($flaskDirs | Select-Object -Unique)) {
                $env:PYTHONPATH = $fd
                & $pp -c "import flask, psutil; print('COMBINE OK')" 2>$null
                if ($LASTEXITCODE -eq 0) {
                  Write-Host "COMBINE WORKS: python=$pp  flaskFrom=$fd"
                  $found = $pp
                  echo "PYTHONPATH=$fd" >> $env:GITHUB_ENV
                  break
                }
              }
              if ($found) { break }
            }
          }

          if (-not $found) {
            Write-Host "FATAL: could not assemble flask+psutil. psutilPythons=$($withPsutil.Count) flaskDirs=$($flaskDirs.Count)"
            $found = "C:\Python313\python.exe"
          }
          Write-Host "SELECTED python: $found"
          echo "PYTHON_EXE=$found" >> $env:GITHUB_ENV

      - name: Stop existing python processes
        if: always()
        continue-on-error: true
        run: |
          Get-Process python -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

      - name: Fix CVAmp_6003 IndentationError
        if: always()
        continue-on-error: true
        run: |
          $path = "E:\CVAmp_6003\app.py"
          if (Test-Path $path) {
            $lines = Get-Content $path
            $out = [System.Collections.Generic.List[string]]::new()
            $skip = 0
            foreach ($line in $lines) {
              if ($skip -gt 0) { $skip--; continue }
              if ($line.TrimStart() -eq "try:") { $skip = 5; continue }
              $out.Add($line)
            }
            [System.IO.File]::WriteAllLines($path, $out, [System.Text.UTF8Encoding]::new($false))
            Write-Host "Fixed: $path"
          } else {
            Write-Host "File not found: $path"
          }

      - name: Start CVAmp_5000
        if: always()
        continue-on-error: true
        run: |
          $py = if ($env:PYTHON_EXE) { $env:PYTHON_EXE } else { "C:\Python313\python.exe" }
          Write-Host "Starting CVAmp_5000 with $py"
          New-Item -Force -ItemType Directory C:\temp | Out-Null
          Start-Process $py -ArgumentList "app.py" -WorkingDirectory "E:\CVAmp_5000" -RedirectStandardError "C:\temp\5000_err.log" -WindowStyle Hidden
          Start-Sleep -Seconds 3
          if (Test-Path C:\temp\5000_err.log) { Write-Host "5000 STDERR:"; Get-Content C:\temp\5000_err.log }

      - name: Start CVAmp_6001
        if: always()
        continue-on-error: true
        run: |
          $py = if ($env:PYTHON_EXE) { $env:PYTHON_EXE } else { "C:\Python313\python.exe" }
          Start-Process $py -ArgumentList "app.py" -WorkingDirectory "E:\CVAmp_6001" -RedirectStandardError "C:\temp\6001_err.log" -WindowStyle Hidden

      - name: Start CVAmp_6002
        if: always()
        continue-on-error: true
        run: |
          $py = if ($env:PYTHON_EXE) { $env:PYTHON_EXE } else { "C:\Python313\python.exe" }
          Start-Process $py -ArgumentList "app.py" -WorkingDirectory "E:\CVAmp_6002" -RedirectStandardError "C:\temp\6002_err.log" -WindowStyle Hidden

      - name: Start CVAmp_6003
        if: always()
        continue-on-error: true
        run: |
          $py = if ($env:PYTHON_EXE) { $env:PYTHON_EXE } else { "C:\Python313\python.exe" }
          Start-Process $py -ArgumentList "app.py" -WorkingDirectory "E:\CVAmp_6003" -RedirectStandardError "C:\temp\6003_err.log" -WindowStyle Hidden

      - name: Wait for servers
        if: always()
        continue-on-error: true
        run: Start-Sleep -Seconds 10

      - name: Check ports listening
        if: always()
        continue-on-error: true
        run: |
          Write-Host "=== Listening ports ==="
          netstat -an | Select-String "LISTENING" | Select-String ":5000|:6001|:6002|:6003"
          Write-Host "=== Python processes ==="
          Get-Process python -ErrorAction SilentlyContinue | Format-Table Id,CPU,WorkingSet
          Write-Host "=== STDERR logs ==="
          foreach ($p in @("6001","6002","6003")) {
            $log = "C:\temp\${p}_err.log"
            if (Test-Path $log) {
              $c = Get-Content $log -Raw
              if ($c) { Write-Host "--- $p STDERR ---"; Write-Host $c }
            }
          }

      - name: Call /api/start on all servers
        if: always()
        continue-on-error: true
        run: |
          $url = "${{ github.event.inputs.youtube_url }}"
          $ports = @(5000, 6001, 6002, 6003)
          foreach ($port in $ports) {
            try {
              $body = "{`"url`":`"$url`"}"
              Invoke-RestMethod -Uri "http://localhost:$port/api/start" -Method POST -Body $body -ContentType "application/json" -TimeoutSec 10
              Write-Host "Started port $port"
            } catch {
              Write-Host "Port ${port} failed"
            }
          }
