name: Start CVAmp Servers

# NOTE: This runner (NT AUTHORITY\NETWORK SERVICE via C:\Python313) cannot itself
# run the CVAmp servers — they need playwright + a browser that only exist in the
# operator's own Python environment. So this workflow does NOT spawn servers.
# It is a dispatcher: it calls /api/start on whichever CVAmp servers are already
# running (started by the operator on the PC), forwarding the YouTube URL.

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube URL'
        required: false
        default: ''

jobs:
  start:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Check which servers are listening
        continue-on-error: true
        shell: powershell -ExecutionPolicy Bypass -File "{0}"
        run: |
          Write-Host "=== Listening CVAmp ports ==="
          netstat -an | Select-String "LISTENING" | Select-String ":5000|:6001|:6002|:6003"

      - name: Call /api/start on all running servers
        continue-on-error: true
        shell: powershell -ExecutionPolicy Bypass -File "{0}"
        run: |
          $url = "${{ github.event.inputs.youtube_url }}"
          $ports = @(5000, 6001, 6002, 6003)
          foreach ($port in $ports) {
            try {
              $body = "{`"url`":`"$url`"}"
              $r = Invoke-RestMethod -Uri "http://localhost:$port/api/start" -Method POST -Body $body -ContentType "application/json" -TimeoutSec 15
              Write-Host "port $port -> started ($r)"
            } catch {
              Write-Host "port $port -> not running (server must be started on the PC first)"
            }
          }

      - name: Done
        shell: powershell -ExecutionPolicy Bypass -File "{0}"
        run: Write-Host "dispatch complete"
