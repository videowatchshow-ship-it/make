name: Start CVAmp Servers

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube URL'
        required: false
        default: ''

jobs:
  start:
    runs-on: self-hosted
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -File "{0}"
    steps:
      - name: Stop existing python processes
        continue-on-error: true
        run: |
          Get-Process python -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

      - name: Fix CVAmp_6003 IndentationError
        if: always()
        continue-on-error: true
        run: |
          $path = "E:\CVAmp_6003\app.py"
          if (Test-Path $path) {
            $lines = Get-Content $path
            $out = [System.Collections.Generic.List[string]]::new()
            $skip = 0
            foreach ($line in $lines) {
              if ($skip -gt 0) { $skip--; continue }
              if ($line.TrimStart() -eq "try:") { $skip = 5; continue }
              $out.Add($line)
            }
            [System.IO.File]::WriteAllLines($path, $out, [System.Text.UTF8Encoding]::new($false))
            Write-Host "Fixed: $path"
          } else {
            Write-Host "File not found: $path"
          }

      - name: Diagnose environment
        if: always()
        continue-on-error: true
        run: |
          Write-Host "=== whoami ===" ; whoami
          Write-Host "=== python path ===" ; (Get-Command python -ErrorAction SilentlyContinue).Source
          Write-Host "=== venv exists ===" ; Test-Path "E:\CVAmp_5000\venv\Scripts\python.exe"
          Write-Host "=== CVAmp_5000 exists ===" ; Test-Path "E:\CVAmp_5000\app.py"
          Write-Host "=== E: drive ===" ; Get-PSDrive E -ErrorAction SilentlyContinue
          Write-Host "=== PATH ===" ; $env:PATH
          New-Item -Force -ItemType Directory C:\temp | Out-Null
          $venv = "E:\CVAmp_5000\venv\Scripts\python.exe"
          $py = if (Test-Path $venv) { $venv } else { (Get-Command python -ErrorAction SilentlyContinue).Source }
          if (-not $py) { Write-Host "ERROR: python not found!"; exit 0 }
          Write-Host "Using: $py"
          & $py -c "import flask; print('flask ok')" 2>&1 | Write-Host
          $p = Start-Process $py -ArgumentList "app.py" -WorkingDirectory "E:\CVAmp_5000" -RedirectStandardOutput "C:\temp\5000_out.log" -RedirectStandardError "C:\temp\5000_err.log" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 5
          Write-Host "Process alive: $(-not $p.HasExited)"
          if (Test-Path C:\temp\5000_out.log) { Write-Host "STDOUT:"; Get-Content C:\temp\5000_out.log }
          if (Test-Path C:\temp\5000_err.log) { Write-Host "STDERR:"; Get-Content C:\temp\5000_err.log }

      - name: Install dependencies for all servers
        if: always()
        continue-on-error: true
        run: |
          $py = "C:\Python313\python.exe"
          foreach ($dir in @("E:\CVAmp_5000","E:\CVAmp_6001","E:\CVAmp_6002","E:\CVAmp_6003")) {
            $req = "$dir\requirements.txt"
            if (Test-Path $req) {
              Write-Host "Installing $req"
              & $py -m pip install -r $req --quiet 2>&1 | Write-Host
            } else {
              Write-Host "No requirements.txt in $dir, installing flask only"
              & $py -m pip install flask --quiet 2>&1 | Write-Host
            }
          }

      - name: Start CVAmp_5000
        if: always()
        continue-on-error: true
        run: |
          $venv = "E:\CVAmp_5000\venv\Scripts\python.exe"
          $py = if (Test-Path $venv) { $venv } else { "C:\Python313\python.exe" }
          Start-Process $py -ArgumentList "app.py" -WorkingDirectory "E:\CVAmp_5000" -WindowStyle Hidden

      - name: Start CVAmp_6001
        if: always()
        continue-on-error: true
        run: |
          $venv = "E:\CVAmp_6001\venv\Scripts\python.exe"
          $py = if (Test-Path $venv) { $venv } else { "C:\Python313\python.exe" }
          Start-Process $py -ArgumentList "app.py" -WorkingDirectory "E:\CVAmp_6001" -WindowStyle Hidden

      - name: Start CVAmp_6002
        if: always()
        continue-on-error: true
        run: |
          $venv = "E:\CVAmp_6002\venv\Scripts\python.exe"
          $py = if (Test-Path $venv) { $venv } else { "C:\Python313\python.exe" }
          Start-Process $py -ArgumentList "app.py" -WorkingDirectory "E:\CVAmp_6002" -WindowStyle Hidden

      - name: Start CVAmp_6003
        if: always()
        continue-on-error: true
        run: |
          $venv = "E:\CVAmp_6003\venv\Scripts\python.exe"
          $py = if (Test-Path $venv) { $venv } else { "C:\Python313\python.exe" }
          Start-Process $py -ArgumentList "app.py" -WorkingDirectory "E:\CVAmp_6003" -WindowStyle Hidden

      - name: Wait for servers
        if: always()
        continue-on-error: true
        run: Start-Sleep -Seconds 10

      - name: Check ports listening
        if: always()
        continue-on-error: true
        run: |
          Write-Host "=== Listening ports ==="
          netstat -an | Select-String "LISTENING" | Select-String ":5000|:6001|:6002|:6003"
          Write-Host "=== Python processes ==="
          Get-Process python -ErrorAction SilentlyContinue | Format-Table Id,CPU,WorkingSet

      - name: Call /api/start on all servers
        if: always()
        continue-on-error: true
        run: |
          $url = "${{ github.event.inputs.youtube_url }}"
          $ports = @(5000, 6001, 6002, 6003)
          foreach ($port in $ports) {
            try {
              $body = "{`"url`":`"$url`"}"
              Invoke-RestMethod -Uri "http://localhost:$port/api/start" -Method POST -Body $body -ContentType "application/json" -TimeoutSec 10
              Write-Host "Started port $port"
            } catch {
              Write-Host "Port $port: $_"
            }
          }
