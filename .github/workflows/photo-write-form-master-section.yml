name: write.php 마스터(aass0707) 이미지 업로드 UI 섹션 확인
on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-write-form-master-section.yml'
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 120s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='bash -s' << "REMOTE"
            set +u
            P1="/var/www/sites/chamgyo/public/photo"

            echo "===== [1] write.php 총 라인수 ====="
            timeout 8 sudo wc -l "$P1/write.php" 2>&1

            echo ""
            echo "===== [2] write.php 안 마스터(aass0707/isMaster/__all__) 관련 부분 ====="
            timeout 8 sudo grep -n "aass0707\|isMaster\|__all__\|imgfile\|write_upload\|selectCh\|전체\|채널 선택\|ch=" "$P1/write.php" 2>&1 | head -60

            echo ""
            echo "===== [3] 이미지 업로드 form/input 관련 (write.php) ====="
            timeout 8 sudo grep -n "type=\"file\"\|enctype\|imgfile\|filename" "$P1/write.php" 2>&1 | head -30
            REMOTE
