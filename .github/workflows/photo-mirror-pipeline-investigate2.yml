name: photo2 미러 파이프라인 구조 확인 (경량, 미디어 트리 제외)
on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-mirror-pipeline-investigate2.yml'
jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 120s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='bash -s' << "REMOTE"
            set +u
            timeout 8 sudo cat /etc/cron.d/chamgyo-photo2 2>&1
            echo "-----"
            timeout 8 sudo cat /etc/cron.d/chamgyo-photo3-collector 2>&1
            echo "-----"
            timeout 8 sudo cat /etc/cron.d/chamgyo-sinji-new-collector 2>&1
            echo "-----"
            timeout 8 sudo cat /etc/cron.d/chamgyo-sinji-new-discover 2>&1
            echo "-----"
            timeout 8 sudo cat /etc/cron.d/chamgyo-disk-cleanup 2>&1

            echo ""
            echo "===== bin 디렉토리 스크립트 목록 ====="
            timeout 8 sudo find /var/www/sites/chamgyo/bin -maxdepth 1 -type f 2>&1

            echo ""
            echo "===== mirror 이름 포함 파일 (얕은 depth, 미디어 폴더 제외) ====="
            timeout 10 sudo find /var/www/sites/chamgyo -maxdepth 4 -iname "*mirror*" -not -path "*/images/*" -not -path "*/videos/*" 2>&1

            echo ""
            echo "===== photo/photo2/photo3 data, images 심볼릭 여부 ====="
            timeout 8 sudo stat /var/www/sites/chamgyo/public/photo/data 2>&1 | head -3
            timeout 8 sudo stat /var/www/sites/chamgyo/public/photo2/data 2>&1 | head -3
            timeout 8 sudo stat /var/www/sites/chamgyo/public/photo3/data 2>&1 | head -3
            timeout 8 sudo stat /var/www/sites/chamgyo/public/photo/images 2>&1 | head -3
            timeout 8 sudo stat /var/www/sites/chamgyo/public/photo2/images 2>&1 | head -3
            timeout 8 sudo stat /var/www/sites/chamgyo/public/photo3/images 2>&1 | head -3

            echo ""
            echo "===== CAH_1.html 계정 하드코딩 여부 (otuki/cent/jay/tak) ====="
            timeout 8 sudo grep -n "otuki\|cent\|jay\|tak" /var/www/sites/chamgyo/public/photo/CAH_1.html 2>&1 | head -20

            echo ""
            echo "===== write.php 내 photo2/photo3 분기 ====="
            timeout 8 sudo grep -n "photo2\|photo3" /var/www/sites/chamgyo/public/photo/write.php 2>&1 | head -30
            REMOTE
