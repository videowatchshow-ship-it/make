name: deploy-main-login

on:
  push:
    paths:
      - '.github/workflows/deploy-main-login.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Deploy login form as main index.html
        env:
          VPS_IP: "187.53.133.145"
          VPS_PASS_B64: "LWFhMGNLMDtibzJRNkxnMg=="
          HTML_B64: ""
        run: |
          export SSHPASS=$(echo "$VPS_PASS_B64" | base64 -d)
          SSH="sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@$VPS_IP"
          SCP="sshpass -e scp -o StrictHostKeyChecking=no"
          BASE="/var/www/sites/chamgyo/public"

          echo "$HTML_B64" | base64 -d > /tmp/main_index.html
          echo "== Generated HTML size =="
          wc -c /tmp/main_index.html

          $SCP /tmp/main_index.html "root@$VPS_IP:$BASE/index.html"
          $SSH "chown www-data:www-data $BASE/index.html && chmod 644 $BASE/index.html"

          echo "== Verify =="
          DOMAIN="xn--9d0bw2fjtyymch7de9d.info"
          curl -sS -o /dev/null -w 'HTTP Root: %{http_code} size=%{size_download}\n' "http://$VPS_IP/"
          curl -sS -o /dev/null -w 'HTTPS Root: %{http_code} size=%{size_download}\n' --max-time 30 "https://$DOMAIN/"
          curl -sS -o /dev/null -w 'HTTPS Login: %{http_code} size=%{size_download}\n' --max-time 30 "https://$DOMAIN/photo/login.html"
          echo "== DONE =="
