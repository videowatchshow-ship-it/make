name: Diagnose photo3 HTML source

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch photo3 CAH_1.html source
        run: |
          echo "===== photo3/CAH_1.html?ch=tak ====="
          curl -s 'https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak' > /tmp/photo3.html
          echo "Size: $(wc -c < /tmp/photo3.html) bytes"
          echo "Lines: $(wc -l < /tmp/photo3.html)"
          echo ""
          echo "===== FULL SOURCE ====="
          cat /tmp/photo3.html
          echo ""
          echo "===== END ====="

      - name: Fetch photo CAH_1.html source (working reference)
        run: |
          echo "===== photo/CAH_1.html?ch=tak ====="
          curl -s 'https://xn--9d0bw2fjtyymch7de9d.info/photo/CAH_1.html?ch=tak' > /tmp/photo.html
          echo "Size: $(wc -c < /tmp/photo.html) bytes"
          echo "Lines: $(wc -l < /tmp/photo.html)"
          echo ""
          echo "===== FULL SOURCE ====="
          cat /tmp/photo.html
          echo ""
          echo "===== END ====="

      - name: Response headers comparison
        run: |
          echo "===== photo3 headers ====="
          curl -sI 'https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak'
          echo ""
          echo "===== photo headers ====="
          curl -sI 'https://xn--9d0bw2fjtyymch7de9d.info/photo/CAH_1.html?ch=tak'
          echo ""
          echo "===== photo3/hot-patch.js ====="
          curl -sI 'https://xn--9d0bw2fjtyymch7de9d.info/photo3/hot-patch.js'
          echo ""
          echo "===== photo3/modules/dist/bundle.js ====="
          curl -sI 'https://xn--9d0bw2fjtyymch7de9d.info/photo3/modules/dist/bundle.js'
          echo ""
          echo "===== photo3/data/sel_tak.json ====="
          curl -sI 'https://xn--9d0bw2fjtyymch7de9d.info/photo3/data/sel_tak.json'

      - name: Diff photo vs photo3
        run: |
          echo "===== diff photo vs photo3 (first 200 lines) ====="
          diff <(head -200 /tmp/photo.html) <(head -200 /tmp/photo3.html) || true
          echo ""
          echo "===== photo3-only lines (tak guard etc) ====="
          grep -n 'tak\|photo3\|guard\|miniview\|center\|display.*none\|visibility.*hidden' /tmp/photo3.html || echo "no matches"

      - name: Test with iOS Safari UA
        run: |
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1'
          echo "===== iOS Safari UA test ====="
          curl -sI -A "$UA" 'https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak'
          echo ""
          echo "===== iOS Safari body size ====="
          curl -s -A "$UA" 'https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak' | wc -c
