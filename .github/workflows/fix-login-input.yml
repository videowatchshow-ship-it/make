name: fix-login-input
on:
  push:
    paths:
      - '.github/workflows/fix-login-input.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_IP: "187.53.133.145"
      VPS_PASS_B64: "LWFhMGNLMDtibzJRNkxnMg=="
      CF_ZONE: "7e5faed2d3d4d6da7aceb4ddde81a62b"
      LOGIN_B64: ""
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Deploy fixed login.html
        run: |
          export SSHPASS=$(echo "$VPS_PASS_B64" | base64 -d)
          SSH="sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@$VPS_IP"
          BASE="/var/www/sites/chamgyo/public"

          for dir in photo photo2 photo3; do
            echo "== Deploy to $dir =="
            $SSH "echo '$LOGIN_B64' | base64 -d > $BASE/$dir/login.html && chown www-data:www-data $BASE/$dir/login.html"
          done

          echo "== Verify =="
          $SSH "sha256sum $BASE/photo/login.html $BASE/photo2/login.html $BASE/photo3/login.html"
          $SSH "wc -c $BASE/photo/login.html"

      - name: Purge CF cache
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' | jq .

      - name: Verify live
        run: |
          sleep 5
          DOMAIN="xn--9d0bw2fjtyymch7de9d.info"
          curl -sS -o /tmp/login.html -w "HTTP %{http_code} | size %{size_download}\n" "https://$DOMAIN/photo/login.html"
          grep -c '<input' /tmp/login.html
          grep 'sessionStorage' /tmp/login.html && echo "STILL HAS SESSION STORAGE" || echo "OK - no auto redirect"
          sha256sum /tmp/login.html
