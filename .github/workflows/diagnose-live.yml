name: diagnose-live
on:
  push:
    paths:
      - '.github/workflows/diagnose-live.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_IP: "187.53.133.145"
      VPS_PASS_B64: "LWFhMGNLMDtibzJRNkxnMg=="
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Check all VPS files
        run: |
          export SSHPASS=$(echo "$VPS_PASS_B64" | base64 -d)
          SSH="sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@$VPS_IP"
          BASE="/var/www/sites/chamgyo/public"

          echo "===== CAH_1.html FULL ====="
          $SSH "cat $BASE/photo/CAH_1.html"

          echo ""
          echo "===== bgl.js FULL ====="
          $SSH "cat $BASE/photo/bgl.js"

          echo ""
          echo "===== room_1.json ====="
          $SSH "cat $BASE/photo/data/room_1.json"

          echo ""
          echo "===== images directory ====="
          $SSH "ls -la $BASE/photo/images/ 2>/dev/null || echo 'NO IMAGES DIR'"

          echo ""
          echo "===== data directory ====="
          $SSH "ls -la $BASE/photo/data/ 2>/dev/null || echo 'NO DATA DIR'"

          echo ""
          echo "===== all files in photo ====="
          $SSH "ls -la $BASE/photo/"

          echo ""
          echo "===== login.html ====="
          $SSH "cat $BASE/photo/login.html"

          echo ""
          echo "===== index.html ====="
          $SSH "cat $BASE/photo/index.html"

          echo ""
          echo "===== select.html ====="
          $SSH "cat $BASE/photo/select.html 2>/dev/null || echo 'NO select.html'"

          echo ""
          echo "===== CAW_1.html ====="
          $SSH "cat $BASE/photo/CAW_1.html 2>/dev/null || echo 'NO CAW_1.html'"

          echo ""
          echo "===== SNW_1.html ====="
          $SSH "cat $BASE/photo/SNW_1.html 2>/dev/null || echo 'NO SNW_1.html'"

      - name: External access test
        run: |
          DOMAIN="xn--9d0bw2fjtyymch7de9d.info"

          echo "===== /photo/ ====="
          curl -sS -o /tmp/idx.html -w "HTTP %{http_code} | size %{size_download}\n" "https://$DOMAIN/photo/" --max-time 10
          cat /tmp/idx.html

          echo ""
          echo "===== /photo/login.html ====="
          curl -sS -w "HTTP %{http_code} | size %{size_download}\n" "https://$DOMAIN/photo/login.html" --max-time 10

          echo ""
          echo "===== /photo/CAH_1.html?ch=01 ====="
          curl -sS -w "HTTP %{http_code} | size %{size_download}\n" "https://$DOMAIN/photo/CAH_1.html?ch=01" --max-time 10

          echo ""
          echo "===== /photo/bgl.js ====="
          curl -sS -o /tmp/bgl.js -w "HTTP %{http_code} | size %{size_download}\n" "https://$DOMAIN/photo/bgl.js?t=$(date +%s)" --max-time 10
          head -3 /tmp/bgl.js
          grep -c 'gauth' /tmp/bgl.js && echo "GAUTH PRESENT" || echo "GAUTH REMOVED"

          echo ""
          echo "===== /photo/data/room_1.json ====="
          curl -sS -w "HTTP %{http_code} | size %{size_download}\n" "https://$DOMAIN/photo/data/room_1.json?t=$(date +%s)" --max-time 10

          echo ""
          echo "===== /photo/images/Live_height_kakao.gif ====="
          curl -sS -o /dev/null -w "HTTP %{http_code} | size %{size_download}\n" "https://$DOMAIN/photo/images/Live_height_kakao.gif" --max-time 10
