name: Fix TOTP for spreadsheet accounts in georgia
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths:
      - '.github/scripts/fix-totp-spreadsheet-georgia.sh'
      - '.github/workflows/fix-totp-spreadsheet-georgia.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          source: ".github/scripts/fix-totp-spreadsheet-georgia.sh"
          target: "/tmp/fix-totp-geo/"
          strip_components: 2
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            sudo bash /tmp/fix-totp-geo/fix-totp-spreadsheet-georgia.sh
            rm -rf /tmp/fix-totp-geo
