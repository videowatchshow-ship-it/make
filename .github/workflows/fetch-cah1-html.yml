name: Fetch CAH_1.html source

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch CAH_1.html via curl
        run: |
          echo "===== Fetching full HTML source ====="
          curl -sS -L --max-time 30 \
            -H "User-Agent: Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1" \
            -o /tmp/cah1.html \
            "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak"
          echo "EXIT_CODE=$?"
          echo "FILE_SIZE=$(stat -c%s /tmp/cah1.html 2>/dev/null || echo 0)"
          echo "===== BEGIN_HTML ====="
          cat /tmp/cah1.html
          echo ""
          echo "===== END_HTML ====="
