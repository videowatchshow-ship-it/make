name: photo/photo2 각각의 정확한 계정 목록 확인
on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-accounts-list-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: photo/login_check.php + photo/write_select_room.php ALL_CH 확인
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 2m
          script: |
            INNER=$(cat <<'INNEREOF'
            echo "===== photo/login_check.php ACCOUNTS ====="
            sudo grep -A 20 "ACCOUNTS = \[" /var/www/sites/chamgyo/public/photo/login_check.php 2>&1 | head -25
            echo ""
            echo "===== photo2/login_check.php ACCOUNTS (재확인) ====="
            sudo grep -A 20 "ACCOUNTS = \[" /var/www/sites/chamgyo/public/photo2/login_check.php 2>&1 | head -25
            echo ""
            echo "===== photo/data 안 sel_*.json 목록 ====="
            sudo find /var/www/sites/chamgyo/public/photo/data -iname "sel_*.json" 2>&1
            echo ""
            echo "===== photo2/data 안 sel_*.json 목록 ====="
            sudo find /var/www/sites/chamgyo/public/photo2/data -iname "sel_*.json" 2>&1
            INNEREOF
            )
            B64=$(printf '%s' "$INNER" | base64 -w0)
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command="echo $B64 | base64 -d | bash"
