name: Investigate why index.html resets
on:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-investigate.txt']

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Investigate index.html source
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            set -e
            echo "=== 1. 현재 폴더스캔 버튼 존재 여부 ==="
            sudo grep -c 'excelFolderFiles' /var/www/sites/gauth/public/index.html 2>/dev/null || echo "폴더스캔 버튼 없음"

            echo ""
            echo "=== 2. index.html 최근 수정 시각 ==="
            sudo stat /var/www/sites/gauth/public/index.html | grep -i modif

            echo ""
            echo "=== 3. gauth 서비스 설정 ==="
            sudo cat /etc/systemd/system/gauth.service 2>/dev/null || echo "서비스 파일 없음"

            echo ""
            echo "=== 4. rebrowser-login.js 에서 index.html 생성/덮어쓰기 검색 ==="
            sudo grep -n 'index\.html\|writeFile\|writeFileSync\|public\|express\.static\|sendFile\|__dirname' /opt/gauth-full/rebrowser-login.js 2>/dev/null | head -40

            echo ""
            echo "=== 5. /opt/gauth-full/ 내 index.html 관련 파일 ==="
            sudo find /opt/gauth-full/ -name "*.html" -o -name "*.ejs" -o -name "*.hbs" -o -name "*.template" 2>/dev/null | head -20

            echo ""
            echo "=== 6. cron 에서 index.html 관련 ==="
            sudo grep -r 'index\.html\|gauth' /etc/cron.d/ /etc/cron.daily/ /var/spool/cron/ 2>/dev/null | head -20

            echo ""
            echo "=== 7. gauth ExecStartPre / ExecStartPost 확인 ==="
            sudo systemctl cat gauth 2>/dev/null | head -30

            echo ""
            echo "=== 8. /opt/gauth-full/ 에 deploy/build 스크립트 ==="
            sudo ls -la /opt/gauth-full/*.sh /opt/gauth-full/deploy* /opt/gauth-full/build* /opt/gauth-full/Makefile /opt/gauth-full/package.json 2>/dev/null | head -20

            echo ""
            echo "=== 9. package.json start/build 스크립트 ==="
            sudo cat /opt/gauth-full/package.json 2>/dev/null | head -30

            echo ""
            echo "=== 10. rebrowser-login.js 에서 HTML 생성 부분 (writeFile 주변) ==="
            sudo grep -n -A5 'writeFile\|fs\.write\|generateHTML\|buildHTML\|renderHTML\|createHTML' /opt/gauth-full/rebrowser-login.js 2>/dev/null | head -60
