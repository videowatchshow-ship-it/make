name: reach info server

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-reach-info.txt']

jobs:
  reach:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check access paths to .info / tokyo box
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 70s
          script: |
            echo '=== 1. is .info served from THIS box? (docroot present) ==='
            sudo find /var/www /srv /opt -maxdepth 3 -iname '*google-auth-api*' 2>/dev/null | head || echo 'no php backend here'
            echo ''
            echo '=== 2. apache/nginx vhosts mentioning the .info punycode ==='
            sudo grep -rl 'xn--9d0bw2fjtyymch7de9d\|9d0bw2fjtyymch7de9d' /etc/apache2 /etc/nginx 2>/dev/null | head || echo 'no .info vhost here'
            echo ''
            echo '=== 3. ssh config / known_hosts entries for tokyo/my-site-1 ==='
            ls -la ~/.ssh/ 2>/dev/null || true
            sudo cat ~/.ssh/config 2>/dev/null | head -30 || echo 'no user ssh config'
            sudo cut -d' ' -f1 ~/.ssh/known_hosts 2>/dev/null | head -20 || echo 'no known_hosts'
            echo ''
            echo '=== 4. gcloud: can it see other compute instances (my-site-1)? ==='
            gcloud compute instances list 2>&1 | head -20 || echo 'no compute list access'
            echo ''
            echo '=== 5. any ssh private keys on box that could reach tokyo ==='
            sudo find /root /home -maxdepth 3 -name 'id_*' ! -name '*.pub' 2>/dev/null | head || echo 'none'
            echo 'done'
