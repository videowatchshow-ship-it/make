name: fix-cache-bust
on:
  push:
    paths:
      - '.github/workflows/fix-cache-bust.yml'

jobs:
  bust:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_IP: "187.53.133.145"
      VPS_PASS_B64: "LWFhMGNLMDtibzJRNkxnMg=="
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Add cache busting to HTML files
        run: |
          export SSHPASS=$(echo "$VPS_PASS_B64" | base64 -d)
          SSH="sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@$VPS_IP"
          STAMP=$(date +%s)

          echo "===== Before ====="
          $SSH "grep 'bgl.js' /var/www/sites/chamgyo/public/photo/CAH_1.html"

          echo "===== Applying cache bust ====="
          $SSH "cd /var/www/sites/chamgyo/public && find photo photo2 photo3 -name '*.html' -exec grep -l 'bgl.js' {} \; | while read f; do sed -i 's|bgl\.js[^\"]*|bgl.js?v=$STAMP|g' \"\$f\"; echo \"Updated: \$f\"; done"

          echo "===== After ====="
          $SSH "grep 'bgl.js' /var/www/sites/chamgyo/public/photo/CAH_1.html"

      - name: Purge CF cache
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/7e5faed2d3d4d6da7aceb4ddde81a62b/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' | python3 -c "import sys,json;d=json.load(sys.stdin);print('CF Purge:', 'OK' if d.get('success') else d)"

      - name: Verify
        run: |
          sleep 5
          DOMAIN="xn--9d0bw2fjtyymch7de9d.info"
          echo "===== CAH_1.html bgl.js line ====="
          curl -sS "https://$DOMAIN/photo/CAH_1.html" | grep 'bgl.js'
          echo ""
          echo "===== bgl.js ====="
          curl -sS -o /dev/null -w "HTTP %{http_code} | size %{size_download}\n" "https://$DOMAIN/photo/bgl.js?t=$(date +%s)"
          echo "===== room_1.json ====="
          curl -sS -o /dev/null -w "HTTP %{http_code} | size %{size_download}\n" "https://$DOMAIN/photo/data/room_1.json?t=$(date +%s)"
