name: cf-update-dns

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cf-update-dns.yml']

jobs:
  update-dns:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      ZONE_ID: "7e5faed2d3d4d6da7aceb4ddde81a62b"
      NEW_IP: "187.53.133.145"
    steps:
      - name: List current DNS records
        run: |
          echo "== Current DNS records =="
          curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?per_page=100" \
            | jq '.result[] | {id, name, type, content, proxied}'

      - name: Update A records to new VPS IP
        run: |
          echo "== Fetching A records =="
          RECORDS=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=A&per_page=100")
          echo "$RECORDS" | jq '.result[] | {id, name, content, proxied}'

          for RECORD_ID in $(echo "$RECORDS" | jq -r '.result[] | select(.type=="A") | .id'); do
            RECORD_NAME=$(echo "$RECORDS" | jq -r ".result[] | select(.id==\"$RECORD_ID\") | .name")
            echo "Updating $RECORD_NAME ($RECORD_ID) -> $NEW_IP"
            curl -sS -X PATCH \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID" \
              -d "{\"content\":\"$NEW_IP\",\"proxied\":true}" \
              | jq '{success, result: {name: .result.name, content: .result.content, proxied: .result.proxied}}'
          done

      - name: Verify DNS
        run: |
          sleep 5
          echo "== Verify A records =="
          curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=A&per_page=100" \
            | jq '.result[] | {name, content, proxied}'
          echo "== dig check =="
          dig +short xn--9d0bw2fjtyymch7de9d.info A
