name: Fix photo3 rendering for PRISM iOS

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix photo3 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 34.104.233.35
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 120s
          script: |
            set -euo pipefail
            P3="/var/www/sites/chamgyo/public/photo3"
            P2="/var/www/sites/chamgyo/public/photo2"
            P1="/var/www/sites/chamgyo/public/photo"
            echo "===== DIAGNOSE ====="
            for f in bgl.js dragon_fx.js; do
              [ -e "$P3/$f" ] && echo "OK: $f" || echo "MISSING: $f"
            done
            [ -d "$P3/images" ] && echo "OK: images/" || echo "MISSING: images/"
            echo "===== FIX SYMLINKS ====="
            cd "$P3"
            for f in bgl.js dragon_fx.js; do
              if [ ! -e "$f" ]; then
                if [ -e "$P2/$f" ]; then
                  sudo ln -sfn "$P2/$f" "$f" && echo "Linked $f from photo2"
                elif [ -e "$P1/$f" ]; then
                  sudo ln -sfn "$P1/$f" "$f" && echo "Linked $f from photo"
                else
                  echo "WARN: $f not in photo2 or photo"
                fi
              else
                echo "$f OK"
              fi
            done
            if [ ! -e "images" ]; then
              if [ -d "$P2/images" ]; then
                sudo ln -sfn "$P2/images" images && echo "Linked images/ from photo2"
              elif [ -d "$P1/images" ]; then
                sudo ln -sfn "$P1/images" images && echo "Linked images/ from photo"
              fi
            else
              echo "images/ OK"
            fi
            [ ! -e data ] && sudo ln -sfn "$P2/data" data && echo "Linked data/" || echo "data/ OK"
            [ ! -e hot-patch.js ] && sudo ln -sfn "$P2/hot-patch.js" hot-patch.js && echo "Linked hot-patch.js" || echo "hot-patch.js OK"
            [ ! -e modules ] && sudo ln -sfn "$P2/modules" modules && echo "Linked modules/" || echo "modules/ OK"
            for api in api_hot_patch.php api_heartbeat.php api_selected_room.php; do
              [ ! -e "$api" ] && [ -e "$P2/$api" ] && sudo ln -sfn "$P2/$api" "$api" && echo "Linked $api" || echo "$api OK"
            done
            echo "===== FIX CSS ====="
            CAH="$P3/CAH_1.html"
            if [ -f "$CAH" ]; then
              sudo cp "$CAH" "${CAH}.bak"
              sudo sed -i 's/body{height:auto !important/body{height:100vh !important/g' "$CAH"
              sudo sed -i 's/background:transparent !important/background:#000 !important/g' "$CAH"
              sudo sed -i 's/\.full_box{height:auto !important;min-height:0 !important/\.full_box{height:100vh !important;min-height:100vh !important/g' "$CAH"
              echo "CSS patched"
              grep -o 'body{[^}]*}' "$CAH" | head -2
              grep -o '\.full_box{[^}]*}' "$CAH" | head -2
            fi
            echo "===== HTACCESS ====="
            sudo tee "$P3/.htaccess" > /dev/null << 'HTEOF'
            Options +FollowSymLinks
            <IfModule mod_headers.c>
              Header set Access-Control-Allow-Origin "*"
              Header set Access-Control-Allow-Methods "GET, OPTIONS"
            </IfModule>
            <FilesMatch "\.(json|php)$">
              <IfModule mod_headers.c>
                Header set Cache-Control "no-cache, no-store, must-revalidate"
                Header set Pragma "no-cache"
                Header set Expires "0"
              </IfModule>
            </FilesMatch>
            HTEOF
            echo "===== RELOAD ====="
            sudo apachectl configtest 2>&1 || true
            sudo systemctl reload apache2 2>&1 || echo "reload failed"
            echo "===== VERIFY ====="
            for f in bgl.js dragon_fx.js images data modules hot-patch.js CAH_1.html; do
              [ -e "$P3/$f" ] && echo "OK: $f" || echo "MISSING: $f"
            done
            curl -sI "http://localhost/photo3/bgl.js" 2>/dev/null | head -3
            curl -sI "http://localhost/photo3/dragon_fx.js" 2>/dev/null | head -3
            curl -sI "http://localhost/photo3/images/Live_height_kakao.gif" 2>/dev/null | head -3
            curl -sI "http://localhost/photo3/CAH_1.html?ch=tak" 2>/dev/null | head -3
            echo "DONE"

      - name: Purge Cloudflare cache
        if: always()
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_TOKEN2: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          TOKEN="${CF_TOKEN:-$CF_TOKEN2}"
          ZONE="${CF_ZONE:-7e5faed2d3d4d6da7aceb4ddde81a62b}"
          if [ -z "$TOKEN" ]; then
            echo "No CF token"
            exit 0
          fi
          curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/purge_cache" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' || echo "purge failed"

      - name: Verify endpoints
        if: always()
        run: |
          sleep 5
          for path in "photo3/CAH_1.html?ch=tak" "photo3/bgl.js" "photo3/dragon_fx.js" "photo3/data/sel_tak.json"; do
            STATUS=$(curl -so /dev/null -w '%{http_code}' "https://xn--9d0bw2fjtyymch7de9d.info/$path" 2>/dev/null || echo "FAIL")
            echo "$path -> HTTP $STATUS"
          done
