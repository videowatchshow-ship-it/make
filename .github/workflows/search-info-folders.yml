name: search info folders

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-search-info.txt']

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: gcloud compute ssh my-site-1 and grep google auth config
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 250s
          script: |
            PROJECT=quantum-bonus-455522-b4
            ZONE=asia-northeast1-a
            RC='sudo grep -roiE "GOCSPX-[A-Za-z0-9_-]{10,}" /var/www /opt /etc /home /root 2>/dev/null | sort -u | head -10; echo ---REDIRECTS---; sudo grep -rhoiE "redirect_uri[^,;\"]{0,160}" /var/www 2>/dev/null | sort -u | head -20; echo ---AUTHFILES---; sudo find /var/www -maxdepth 5 -iname "google-auth-api.php" 2>/dev/null | head; echo ---CLIENTID---; sudo grep -rhoiE "[0-9]{10,}-[a-z0-9]+\.apps\.googleusercontent\.com" /var/www 2>/dev/null | sort -u | head'
            echo '=== ssh into my-site-1 and run remote grep ==='
            timeout 200 gcloud compute ssh my-site-1 --zone=$ZONE --project=$PROJECT --tunnel-through-iap --command="$RC" 2>&1 | tail -60 || \
            timeout 120 gcloud compute ssh my-site-1 --zone=$ZONE --project=$PROJECT --command="$RC" 2>&1 | tail -60 || echo 'ssh to my-site-1 failed'
            echo 'done'
