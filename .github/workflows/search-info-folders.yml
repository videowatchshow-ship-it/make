name: search info folders

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-search-info.txt']

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fast targeted grep on my-site-1
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 220s
          script: |
            IP=34.104.233.35
            KEY=~/.ssh/google_compute_engine
            U=$(whoami)
            RC='F=$(sudo find /var/www /home /srv -maxdepth 6 -iname "google-auth-api.php" 2>/dev/null | head -1); echo "AUTHPHP=$F"; D=$(dirname "$F"); echo "DIR=$D"; PARENT=$(dirname "$D"); echo "--- grep GOCSPX in core/config dirs ---"; sudo grep -rhoiE "GOCSPX-[A-Za-z0-9_-]{10,}" "$PARENT" 2>/dev/null | sort -u | head -5; echo "--- redirect_uri lines in auth dir ---"; sudo grep -rhoiE "redirect_uri[^\n]{0,180}" "$PARENT" 2>/dev/null | grep -i http | sort -u | head -10; echo "--- handler/callback strings ---"; sudo grep -rhoiE "__/auth/handler|/auth/[a-z]*callback|oauth2callback|firebaseapp" "$PARENT" 2>/dev/null | sort -u | head -10; echo "--- client id ---"; sudo grep -rhoiE "[0-9]{10,}-[a-z0-9]+\.apps\.googleusercontent\.com" "$D/google-auth-api.php" 2>/dev/null | sort -u | head'
            timeout 120 ssh -i $KEY -o StrictHostKeyChecking=no -o ConnectTimeout=12 -o BatchMode=yes ${U}@${IP} "$RC" 2>&1 | tail -50
            echo 'done'
