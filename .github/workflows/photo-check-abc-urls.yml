name: photo write.php 이미지 슬롯 구조 확인

on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-check-abc-urls.yml'

jobs:
  imgs:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 120s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='bash -s' << "REMOTE"
            set -uo pipefail
            P1="/var/www/sites/chamgyo/public/photo"

            echo "===== [1] photo/images 폴더 (공용 이미지 슬롯) ====="
            sudo ls -la "$P1/images/" 2>/dev/null | head -50

            echo ""
            echo "===== [2] 아바타 가인 관련 이미지 파일 검색 ====="
            sudo find "$P1" -type f \( -iname "*gain*" -o -iname "*아바타*" -o -iname "*side*banner*" -o -iname "*h_side*" \) 2>/dev/null | head -20

            echo ""
            echo "===== [3] write.php 이미지 슬롯 정의 ($slots_shared) ====="
            sudo grep -nA20 "slots_shared\|slots_b_only\|slots_all\|slots_by_user" "$P1/write.php" | head -60

            echo ""
            echo "===== [4] 각 계정별 이미지 있는지 - 계정별 slot 구조? ====="
            sudo grep -nE "sel_[a-z]|per.user|user.image|이미지.*계정|계정.*이미지|slot.*ch|ch.*slot|__id.*image" "$P1/write.php" | head -20

            echo ""
            echo "===== [5] 지금 cent 화면에 뜨는 h_side_banner.png 이미지 위치 + 파일 실체 ====="
            sudo ls -la "$P1/images/h_side_banner"* 2>/dev/null

            echo ""
            echo "===== [6] cent 계정의 CAH_1.html이 참조하는 실제 이미지 (box_R, side banner) ====="
            sudo grep -oE "images/[a-zA-Z0-9_.-]+" "$P1/CAH_1.html" 2>/dev/null | sort -u | head -20

            echo ""
            echo "===== [7] SNW_1.html (파랑 메신저 화면) 이 참조하는 이미지 ====="
            sudo grep -oE "images/[a-zA-Z0-9_.-]+" "$P1/SNW_1.html" 2>/dev/null | sort -u | head -20

            echo ""
            echo "===== [8] write.php - 아바타 가인 배너 표시하는 로직 grep ====="
            sudo grep -nE "gain|아바타|casino7942|ccm7979|가인" "$P1/"*.php "$P1/"*.html 2>/dev/null | head -20

            echo ""
            echo "===== DONE ====="
            REMOTE
