name: denny 계정 삭제 (photo + photo2 실체)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-check-abc-urls.yml'

jobs:
  delete_denny:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 120s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='bash -s' << "REMOTE"
            set -uo pipefail
            TS=$(date +%s)

            echo "===== BEFORE ====="
            for D in photo photo2; do
              F="/var/www/sites/chamgyo/public/$D/data/sel_denny.json"
              if [ -f "$F" ]; then
                sudo ls -la "$F"
                sudo cat "$F"; echo ""
              else
                echo "$D/data/sel_denny.json: 이미 없음"
              fi
            done

            echo ""
            echo "===== 백업 후 삭제 ====="
            for D in photo photo2; do
              F="/var/www/sites/chamgyo/public/$D/data/sel_denny.json"
              if [ -f "$F" ]; then
                sudo cp "$F" "/tmp/sel_denny_${D}_${TS}.bak"
                echo "backup: /tmp/sel_denny_${D}_${TS}.bak"
                sudo rm -f "$F"
                echo "$D/data/sel_denny.json 삭제 완료"
              fi
            done

            echo ""
            echo "===== heartbeat_denny.info 도 있으면 삭제 ====="
            for D in photo photo2; do
              HB="/var/www/sites/chamgyo/public/$D/data/heartbeat_denny.info"
              if [ -f "$HB" ]; then
                sudo rm -f "$HB"
                echo "$D/data/heartbeat_denny.info 삭제"
              fi
            done

            echo ""
            echo "===== AFTER — denny 완전 사라짐 확인 ====="
            for D in photo photo2; do
              F="/var/www/sites/chamgyo/public/$D/data/sel_denny.json"
              [ -f "$F" ] && echo "$D: 아직 있음!" || echo "$D: 삭제됨 ✓"
            done

            echo ""
            echo "===== photo/data 남은 계정 리스트 ====="
            sudo ls "/var/www/sites/chamgyo/public/photo/data/"sel_*.json 2>/dev/null | xargs -I {} basename {} .json | sed "s/^sel_//"
            echo "총: $(sudo ls "/var/www/sites/chamgyo/public/photo/data/"sel_*.json 2>/dev/null | wc -l) 개"

            echo ""
            echo "===== photo2/data 남은 계정 리스트 ====="
            sudo ls "/var/www/sites/chamgyo/public/photo2/data/"sel_*.json 2>/dev/null | xargs -I {} basename {} .json | sed "s/^sel_//"
            echo "총: $(sudo ls "/var/www/sites/chamgyo/public/photo2/data/"sel_*.json 2>/dev/null | wc -l) 개"

            echo ""
            echo "===== DONE ====="
            REMOTE
