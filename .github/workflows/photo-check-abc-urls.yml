name: photo write.php 경고 안내문 반짝 삽입

on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-check-abc-urls.yml'

jobs:
  add_notice:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 300s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='bash -s' << "REMOTE"
            set -uo pipefail
            P1="/var/www/sites/chamgyo/public/photo"
            TS=$(date +%s)

            echo "===== [1] "프리즘에 넣을 URL" 문구가 있는 파일 찾기 ====="
            sudo grep -rln "프리즘에 넣을\|프리즘 넣을\|프리즘에 넣는\|cent 님\|님 — 프리즘\|님 - 프리즘\|세로 URL 복사\|가로 URL 복사\|싱지뉴 URL 복사" "$P1" 2>/dev/null | head -10

            echo ""
            echo "===== [2] write.php 안의 텍스트 grep ====="
            sudo grep -n "프리즘\|세로 URL\|가로 URL\|싱지뉴 URL\|님\s*—" "$P1/write.php" 2>/dev/null | head -30

            echo ""
            echo "===== [3] write.php 파일 크기 + 첫 15줄 ====="
            sudo ls -la "$P1/write.php"
            sudo head -15 "$P1/write.php"

            echo ""
            echo "===== [4] write.php에서 "님 — 프리즘" 패턴 정확 위치 ====="
            sudo grep -nE "님\s*—|님\s*-|프리즘|세로 URL 복사" "$P1/write.php" 2>/dev/null | head -20
            echo ""
            echo "===== [5] write_url.php (있으면) ====="
            [ -f "$P1/write_url.php" ] && sudo ls -la "$P1/write_url.php" && sudo grep -n "프리즘\|세로 URL\|가로 URL" "$P1/write_url.php" | head -20 || echo "write_url.php 없음"

            echo ""
            echo "===== [6] photo/ 폴더 안에 있는 모든 PHP 파일 (관리자 페이지 후보) ====="
            sudo ls -la "$P1/"*.php | awk "{print \$5, \$6, \$7, \$8, \$9}" | head -30
            REMOTE
