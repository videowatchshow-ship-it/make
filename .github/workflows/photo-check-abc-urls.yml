name: photo write.php 반짝 경고 안내문 삽입

on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-check-abc-urls.yml'

jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 180s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='bash -s' << "REMOTE"
            set -uo pipefail
            F="/var/www/sites/chamgyo/public/photo/write.php"
            TS=$(date +%s)

            echo "===== [1] 백업 ====="
            sudo cp "$F" "$F.bak.notice.$TS"
            echo "backup: $F.bak.notice.$TS"

            echo ""
            echo "===== [2] 이미 삽입돼 있는지 확인 (중복 방지) ====="
            if sudo grep -q "warn-blink-user-guide" "$F"; then
              echo "이미 삽입됨. 삭제 후 재삽입."
              sudo TARGET="$F" python3 -c "
            import re, os
            p = os.environ[\"TARGET\"]
            s = open(p).read()
            s = re.sub(r\"<style id=\\\"warn-blink-css\\\">.*?</style>\\s*\", \"\", s, flags=re.DOTALL)
            s = re.sub(r\"<div class=\\\"warn-blink-user-guide\\\".*?</div>\\s*\", \"\", s, flags=re.DOTALL)
            open(p, \"w\").write(s)
            "
            fi

            echo ""
            echo "===== [3] line 116 (제목 라인) 위치 확인 ====="
            sudo grep -n "님 — 프리즘에 넣을 URL" "$F"

            echo ""
            echo "===== [4] Python으로 line 116 뒤에 <style> + <div> 삽입 ====="
            sudo TARGET="$F" python3 <<'PYEOF'
            import os
            p = os.environ["TARGET"]
            with open(p, "r", encoding="utf-8") as f:
                s = f.read()

            # blink CSS + 경고 박스
            css = """<style id="warn-blink-css">
            @keyframes warnBlink {
              0%,100% { background:#ff2b2b; color:#fff; box-shadow:0 0 24px #ff2b2b; border-color:#fff; }
              50%     { background:#ffdb2b; color:#000; box-shadow:0 0 34px #ffdb2b; border-color:#000; }
            }
            .warn-blink-user-guide {
              animation: warnBlink 1.4s ease-in-out infinite;
              padding: 18px 22px;
              margin: 16px 0 20px;
              border-radius: 12px;
              font-size: 1.05rem;
              font-weight: 700;
              line-height: 1.75;
              border: 4px solid #fff;
              letter-spacing: -0.3px;
            }
            .warn-blink-user-guide .warn-title {
              display:block;
              font-size:1.35rem;
              margin-bottom:8px;
              text-shadow: 0 2px 4px rgba(0,0,0,.55);
            }
            .warn-blink-user-guide .warn-step {
              display:block;
              margin-top:4px;
            }
            </style>"""

            box = """<div class="warn-blink-user-guide">
              <span class="warn-title">⚠️ 경고 — 반드시 두 기기 모두 로그인해 주세요!</span>
              프리즘이 연결된 모바일과 픽을 올리는 모바일, 이렇게 <b>두 기기 모두</b> 이 계정으로 로그인하신 뒤,
              <span class="warn-step">① 프리즘 웹(Web)에 넣을 URL을 골라 복사하여 삽입해 주시고,</span>
              <span class="warn-step">② 반대편(픽을 올리는 기기)에서는 같은 계정으로 로그인해 주시고,</span>
              <span class="warn-step">③ 아래 테이블을 골라 <b>&#39;선택&#39;</b> 버튼을 눌러 주시면 해당 테이블이 화면에 실시간으로 활성화됩니다.</span>
            </div>"""

            # 제목 라인 뒤에 삽입 - `님 — 프리즘에 넣을 URL</div>` 다음
            marker = "님 — 프리즘에 넣을 URL</div>"
            if marker not in s:
                print("marker NOT FOUND — 삽입 못 함")
                exit(1)
            new = s.replace(marker, marker + "\n" + css + "\n" + box, 1)
            with open(p, "w", encoding="utf-8") as f:
                f.write(new)
            print(f"before={len(s)}B  after={len(new)}B  diff={len(new)-len(s)}B")
            PYEOF

            sudo chown www-data:www-data "$F"
            sudo chmod 644 "$F"

            echo ""
            echo "===== [5] 삽입 후 확인 (line 116 근처 30줄) ====="
            sudo grep -n "warn-blink-user-guide\|warnBlink\|경고 — 반드시" "$F" | head -10

            echo ""
            echo "===== DONE ====="
            REMOTE
