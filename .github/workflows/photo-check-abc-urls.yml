name: photo abc01 실체 + CAH/CAW/SNW 3개 URL 데이터 소스 확인

on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-check-abc-urls.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 120s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='bash -s' << "REMOTE"
            set -uo pipefail
            P1="/var/www/sites/chamgyo/public/photo"

            echo "===== [1] photo/data 실제 파일 (sel_ 만 필터) ====="
            sudo ls -la "$P1/data/"sel_*.json 2>/dev/null | awk "{print \$5, \$6, \$7, \$8, \$9}"
            echo ""
            echo "총 sel_ 파일 수: $(sudo ls "$P1/data/"sel_*.json 2>/dev/null | wc -l)"

            echo ""
            echo "===== [2] abc01 관련 실제 검색 (혹시 다른 위치에?) ====="
            echo "-- sel_abc01.json --"
            sudo ls -la "$P1/data/sel_abc01.json" 2>&1
            sudo cat "$P1/data/sel_abc01.json" 2>&1
            echo ""
            echo "-- 전체 서버에서 abc01 검색 --"
            sudo grep -rln "abc01" /var/www/sites/chamgyo/public/photo /var/www/sites/chamgyo/public/photo2 2>/dev/null | head -10

            echo ""
            echo "===== [3] CAH_1 / CAW_1 / SNW_1 이 fetch 하는 데이터 소스 (URL 패턴) ====="
            for F in CAH_1.html CAW_1.html SNW_1.html; do
              echo "--- $F ---"
              sudo grep -nE "api_selected_room|/data/sel_|/data/room_|api_all_rooms|fetch\(.*(sel|room)" "$P1/$F" 2>/dev/null | head -15
            done

            echo ""
            echo "===== [4] api_selected_room.php 소스 (URL 파라미터로 라우팅?) ====="
            sudo cat "$P1/api_selected_room.php"

            echo ""
            echo "===== [5] 3개 URL 실제 HTTP GET (같은 컨텐츠 반환하는지) ====="
            for F in CAH_1.html CAW_1.html SNW_1.html; do
              SZ=$(curl -sS "http://localhost/photo/$F?ch=cent" 2>/dev/null | wc -c)
              SHA=$(curl -sS "http://localhost/photo/$F?ch=cent" 2>/dev/null | sha256sum | cut -c1-16)
              echo "$F?ch=cent: size=${SZ}B sha256=${SHA}"
            done

            echo ""
            echo "===== [6] 세로/가로/싱지뉴 각각의 실제 fetch endpoint 확인 (bgl.js/signal.js/bundle.js 안) ====="
            for JS in bgl.js signal.js signal_common.js modules/dist/bundle.js; do
              echo "--- $JS 안의 sel/room fetch ---"
              sudo grep -oE "sel_[a-z_]+|/data/sel[^\"'\` ]{0,30}|api_selected_room[^\"'\` ]{0,30}" "$P1/$JS" 2>/dev/null | sort -u | head -10
            done

            echo ""
            echo "===== DONE ====="
            REMOTE
