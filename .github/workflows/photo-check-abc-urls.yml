name: photo images/ch 계정별 이미지 폴더 전수 조사

on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-check-abc-urls.yml'

jobs:
  ch_imgs:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 180s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='bash -s' << "REMOTE"
            set +u
            P1="/var/www/sites/chamgyo/public/photo"

            echo "===== [1] images/ch/ 하위 계정별 폴더 전체 리스팅 ====="
            sudo ls -la "$P1/images/ch/" 2>/dev/null

            echo ""
            echo "===== [2] 각 계정 폴더 안의 파일 (있으면) ====="
            for U in aass0707 abc01 abc02 abc03 abc04 abc05 abc06 abc07 cent gain jay otuki tak; do
              D="$P1/images/ch/$U"
              if [ -d "$D" ]; then
                CNT=$(sudo ls "$D" 2>/dev/null | wc -l)
                echo "--- $U/ ($CNT 파일) ---"
                sudo ls -la "$D" | awk "\$5>0 {print \$5, \$6, \$7, \$8, \$9}"
              else
                echo "$U/ : 폴더 없음 (공용 이미지 폴백)"
              fi
            done

            echo ""
            echo "===== [3] data/img_ver_*.json (계정별 이미지 버전 관리) ====="
            sudo ls -la "$P1/data/"img_ver_*.json 2>/dev/null

            echo ""
            echo "===== [4] write.php - images/ch 관련 코드 (계정별 이미지 로드 로직) ====="
            sudo grep -nE "images/ch|images/\\\$|img.*ch|ch.*img|user_img|user.*image" "$P1/write.php" | head -30

            echo ""
            echo "===== [5] write_upload.php 소스 (이미지 업로드 로직 - 어디로 저장?) ====="
            sudo cat "$P1/write_upload.php"

            echo ""
            echo "===== [6] api_img_ver.php 소스 (계정별 이미지 버전 조회?) ====="
            sudo cat "$P1/api_img_ver.php"

            echo ""
            echo "===== [7] CAH_1 / CAW_1 / SNW_1 이 images/ch 참조하는지 (없으면 공용만 씀) ====="
            for F in CAH_1.html CAW_1.html SNW_1.html; do
              echo "--- $F ---"
              sudo grep -nE "images/ch|images/\\\$|__ch|ch.*images" "$P1/$F" | head -10
            done

            echo ""
            echo "===== DONE ====="
            REMOTE
