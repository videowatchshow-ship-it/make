name: Find CF token from claude-mem-sync
on:
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Find cloudflare-api-token memory file and all cfut_ tokens
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 3m
          script: |
            echo "=== 1. Find cloudflare-api-token file in claude-mem-sync ==="
            sudo find /opt/claude-mem-sync/ -name "*cloudflare*" -o -name "*cf-token*" -o -name "*cf_token*" 2>/dev/null

            echo ""
            echo "=== 2. Read all cloudflare-related files ==="
            for f in $(sudo find /opt/claude-mem-sync/ -name "*cloudflare*" -o -name "*cf-token*" -o -name "*cf_token*" 2>/dev/null); do
              echo "--- FILE: $f ---"
              sudo cat "$f" 2>/dev/null
              echo ""
            done

            echo ""
            echo "=== 3. Search cfut_ in claude-mem-sync ==="
            sudo grep -r "cfut_" /opt/claude-mem-sync/ 2>/dev/null

            echo ""
            echo "=== 4. Search cfut_ in /root/ ==="
            sudo grep -r "cfut_" /root/ 2>/dev/null | head -20

            echo ""
            echo "=== 5. Search cfut_ in all .env files ==="
            sudo find / -name ".env" -not -path "*/node_modules/*" 2>/dev/null | while read f; do
              sudo grep -l "cfut_" "$f" 2>/dev/null && sudo grep "cfut_" "$f" 2>/dev/null
            done

            echo ""
            echo "=== 6. Search cfut_ in /etc/ ==="
            sudo grep -r "cfut_" /etc/ 2>/dev/null | head -10

            echo ""
            echo "=== 7. Certbot/secrets dir ==="
            sudo ls -la /root/.secrets/ 2>/dev/null
            sudo cat /root/.secrets/cloudflare.ini 2>/dev/null

            echo ""
            echo "=== DONE ==="
