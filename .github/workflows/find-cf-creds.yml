name: Check DNS records and wildcard
on:
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Check DNS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 30s
          script: |
            CF_TOKEN=$(sudo awk -F' = ' '{print $2}' /root/.secrets/cloudflare.ini 2>/dev/null)

            echo "=== 1. List ALL DNS records (token has zone:read) ==="
            curl -s "https://api.cloudflare.com/client/v4/zones/2601d4f4ab75c910f8d858ca036ff344/dns_records?per_page=100" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" 2>/dev/null | python3 -c "import sys,json; [print(f'{r[\"type\"]:6} {r[\"name\"]:40} -> {r[\"content\"]}') for r in json.load(sys.stdin).get('result',[])]" 2>/dev/null

            echo ""
            echo "=== 2. Resolve second.cent-solution.online ==="
            dig +short second.cent-solution.online A 2>/dev/null || nslookup second.cent-solution.online 2>/dev/null

            echo ""
            echo "=== 3. Resolve wildcard ==="
            dig +short '*.cent-solution.online' A 2>/dev/null
            dig +short random-test-xyz.cent-solution.online A 2>/dev/null

            echo ""
            echo "=== DONE ==="
