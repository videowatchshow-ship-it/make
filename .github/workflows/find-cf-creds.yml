name: Check GCP for CF credentials
on:
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Check GCP secrets and metadata
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== 1. gcloud secrets list ==="
            sudo gcloud secrets list --project=quantum-bonus-455522-b4 2>&1 | head -20

            echo ""
            echo "=== 2. gcloud secrets versions access (any cf-related) ==="
            for s in $(sudo gcloud secrets list --project=quantum-bonus-455522-b4 --format='value(name)' 2>/dev/null | grep -i 'cloud\|cf\|dns\|token' 2>/dev/null); do
              echo "--- Secret: $s ---"
              sudo gcloud secrets versions access latest --secret="$s" --project=quantum-bonus-455522-b4 2>&1
            done

            echo ""
            echo "=== 3. VM metadata ==="
            curl -s -H "Metadata-Flavor: Google" "http://metadata.google.internal/computeMetadata/v1/instance/attributes/" 2>/dev/null
            echo ""
            for attr in $(curl -s -H "Metadata-Flavor: Google" "http://metadata.google.internal/computeMetadata/v1/instance/attributes/" 2>/dev/null | tr '\n' ' '); do
              echo "--- $attr ---"
              curl -s -H "Metadata-Flavor: Google" "http://metadata.google.internal/computeMetadata/v1/instance/attributes/$attr" 2>/dev/null
              echo ""
            done

            echo ""
            echo "=== 4. Project metadata ==="
            curl -s -H "Metadata-Flavor: Google" "http://metadata.google.internal/computeMetadata/v1/project/attributes/" 2>/dev/null
            echo ""
            for attr in $(curl -s -H "Metadata-Flavor: Google" "http://metadata.google.internal/computeMetadata/v1/project/attributes/" 2>/dev/null | tr '\n' ' '); do
              echo "--- $attr ---"
              curl -s -H "Metadata-Flavor: Google" "http://metadata.google.internal/computeMetadata/v1/project/attributes/$attr" 2>/dev/null
              echo ""
            done

            echo ""
            echo "=== 5. Check all env files for cloudflare ==="
            sudo grep -ri "cloudflare\|cfut_\|dns_cloudflare" /opt/gauth-full/.env /var/www/sites/*/.env 2>/dev/null | head -10

            echo ""
            echo "=== 6. Check certbot renewal conf ==="
            sudo cat /etc/letsencrypt/renewal/*.conf 2>/dev/null | grep -i "cloudflare\|authenticator\|dns" | head -10

            echo ""
            echo "=== 7. pip/certbot cloudflare plugin credentials ==="
            sudo find /etc/letsencrypt/ -name "*.ini" -o -name "*.cfg" 2>/dev/null | head -10
            for f in $(sudo find /etc/letsencrypt/ -name "*.ini" -o -name "*.cfg" 2>/dev/null); do
              echo "--- $f ---"
              sudo cat "$f" 2>/dev/null
            done

            echo ""
            echo "=== DONE ==="
