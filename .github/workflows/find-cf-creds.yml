name: Find CF credentials v3
on:
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Read CF-related files for tokens
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 4m
          script: |
            echo "=== 1. auto_deploy.js cloudflare lines ==="
            sudo grep -in 'cloudflare\|CF_TOKEN\|CF_API\|dns_cloud\|api_token\|apitoken\|api.cloudflare\|cfut_' /opt/gauth-full/auto_deploy.js 2>/dev/null | head -20

            echo ""
            echo "=== 2. auto_deploy.js.bak2 cloudflare lines ==="
            sudo grep -in 'cloudflare\|CF_TOKEN\|CF_API\|dns_cloud\|api_token\|apitoken\|api.cloudflare\|cfut_' /opt/gauth-full/auto_deploy.js.bak2 2>/dev/null | head -20

            echo ""
            echo "=== 3. claude-mem-sync files ==="
            sudo grep -rn 'cloudflare\|CF_TOKEN\|CF_API\|api_token\|cfut_' /opt/claude-mem-sync/ 2>/dev/null | grep -iv 'node_modules\|\.git' | head -30

            echo ""
            echo "=== 4. SERVER_README.md cloudflare lines ==="
            sudo grep -in 'cloudflare\|CF_TOKEN\|CF_API\|dns\|token\|api_key\|zone' /root/SERVER_README.md 2>/dev/null | head -20

            echo ""
            echo "=== 5. All .env files ==="
            for f in $(sudo find / -maxdepth 5 -name '.env' -o -name '*.env' 2>/dev/null | grep -v node_modules | head -20); do
              MATCH=$(sudo grep -i 'cloudflare\|CF_\|dns_cloud\|api_token\|zone_id' "$f" 2>/dev/null)
              [ -n "$MATCH" ] && echo "--- $f ---" && echo "$MATCH"
            done

            echo ""
            echo "=== 6. migrate_udongka.sh ==="
            sudo grep -in 'cloudflare\|CF_\|dns\|token\|zone' /opt/gauth-full/scripts/migrate_udongka.sh 2>/dev/null | head -10

            echo ""
            echo "=== 7. letsencrypt renewal configs ==="
            sudo cat /etc/letsencrypt/renewal/*.conf 2>/dev/null | grep -i 'cloudflare\|dns_\|authenticator\|credential' | head -10

            echo ""
            echo "=== 8. Search for ANY token pattern cfut_ or 37-hex anywhere ==="
            sudo grep -rhoP 'cfut_[A-Za-z0-9_-]{20,}' /root /opt/gauth-full /var/www/sites /etc/letsencrypt 2>/dev/null | sort -u

            echo ""
            echo "=== 9. Check DOCS/md files for zone/token info ==="
            sudo grep -rn 'zone_id\|api_token\|CF_TOKEN\|CLOUDFLARE' /opt/claude-mem-sync/proj1/*.md 2>/dev/null | head -20

            echo ""
            echo "=== DONE ==="
