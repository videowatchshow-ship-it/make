name: Find ALL CF tokens everywhere
on:
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Exhaustive token search
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 240s
          script: |
            echo "=== 1. ALL files containing cfut_ (no extension filter) ==="
            sudo grep -rl 'cfut_' / --exclude-dir=proc --exclude-dir=sys --exclude-dir=dev --exclude-dir=run 2>/dev/null | head -50

            echo ""
            echo "=== 2. Read every match ==="
            for f in $(sudo grep -rl 'cfut_' / --exclude-dir=proc --exclude-dir=sys --exclude-dir=dev --exclude-dir=run 2>/dev/null | head -50); do
              echo "--- $f ---"
              sudo grep 'cfut_' "$f" 2>/dev/null
            done

            echo ""
            echo "=== 3. Bash history ==="
            sudo cat /root/.bash_history 2>/dev/null | grep -i 'cloudflare\|cfut_\|dns_record\|CF_TOKEN\|CF_API' | tail -30
            for u in $(ls /home/ 2>/dev/null); do
              sudo cat "/home/$u/.bash_history" 2>/dev/null | grep -i 'cloudflare\|cfut_\|CF_TOKEN' | tail -10
            done

            echo ""
            echo "=== 4. Environment variables ==="
            sudo cat /etc/environment 2>/dev/null | grep -i 'cf\|cloud'
            sudo cat /root/.bashrc 2>/dev/null | grep -i 'cf\|cloudflare\|token'
            sudo cat /root/.profile 2>/dev/null | grep -i 'cf\|cloudflare\|token'

            echo ""
            echo "=== 5. Systemd service envs ==="
            sudo grep -r 'cfut_\|CLOUDFLARE\|CF_TOKEN\|CF_API' /etc/systemd/ 2>/dev/null | head -10
            sudo grep -r 'cfut_\|CLOUDFLARE\|CF_TOKEN\|CF_API' /etc/default/ 2>/dev/null | head -10

            echo ""
            echo "=== 6. Docker configs ==="
            sudo grep -r 'cfut_\|CLOUDFLARE' /var/lib/docker/ 2>/dev/null | head -10
            sudo docker inspect $(sudo docker ps -aq 2>/dev/null) 2>/dev/null | grep -i 'cfut_\|cloudflare' | head -10

            echo ""
            echo "=== 7. Crontabs ==="
            sudo cat /var/spool/cron/crontabs/* 2>/dev/null | grep -i 'cloudflare\|cfut_'
            sudo cat /etc/cron.d/* 2>/dev/null | grep -i 'cloudflare\|cfut_'

            echo ""
            echo "=== 8. Git repos on server ==="
            sudo find / -name '.git' -type d -not -path '*/proc/*' -not -path '*/sys/*' 2>/dev/null | head -20
            for g in $(sudo find / -name '.git' -type d -not -path '*/proc/*' -not -path '*/sys/*' 2>/dev/null | head -20); do
              REPO=$(dirname "$g")
              echo "--- Checking $REPO ---"
              cd "$REPO" && sudo git log --oneline -5 2>/dev/null | grep -i 'cloudflare\|token\|dns' | head -3
              sudo git log -p --all -S 'cfut_' -- 2>/dev/null | grep 'cfut_' | head -5
            done

            echo ""
            echo "=== 9. Journal logs ==="
            sudo journalctl --no-pager -g 'cfut_' 2>/dev/null | tail -10

            echo ""
            echo "=== 10. Apache/Nginx logs ==="
            sudo grep -r 'cfut_' /var/log/ 2>/dev/null | head -10

            echo ""
            echo "=== 11. Node/npm global configs ==="
            sudo cat /root/.npmrc 2>/dev/null | grep -i 'cf\|cloudflare'
            sudo find /root/ /home/ -name '.wrangler' -type d 2>/dev/null
            sudo find /root/ /home/ -name 'wrangler.toml' 2>/dev/null

            echo ""
            echo "=== 12. Python/pip configs ==="
            sudo find /root/ /home/ -name '.cloudflare.cfg' -o -name 'cloudflare.cfg' 2>/dev/null

            echo ""
            echo "=== 13. All .secrets dir ==="
            sudo ls -la /root/.secrets/ 2>/dev/null
            sudo cat /root/.secrets/* 2>/dev/null

            echo ""
            echo "=== 14. Temp files ==="
            sudo grep -r 'cfut_' /tmp/ 2>/dev/null | head -10

            echo ""
            echo "=== DONE ==="
