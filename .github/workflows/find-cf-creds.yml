name: Find cfut_0JOs token
on:
  workflow_dispatch:

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Deep search for second CF token
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 25s
          script: |
            echo "=== 1. Bash history for cfut_0JOs ==="
            sudo grep -i "cfut_0JOs\|cfut_0j" /root/.bash_history 2>/dev/null | head -10 || echo "not in root history"
            sudo grep -i "cfut_0JOs\|cfut_0j" /home/*/.bash_history 2>/dev/null | head -10 || echo "not in user history"

            echo ""
            echo "=== 2. Bash history for cloudflare token ==="
            sudo grep -i "cloudflare\|cf_token\|dns_cloudflare" /root/.bash_history 2>/dev/null | head -20 || echo "none"

            echo ""
            echo "=== 3. Global API Key check ==="
            sudo grep -ri "X-Auth-Key\|x-auth-key\|global.api\|api.key" /root/ /opt/ /var/www/ --include='*.sh' --include='*.php' --include='*.env' --include='*.conf' --include='*.ini' --include='*.json' --include='*.py' 2>/dev/null | head -20 || echo "none"

            echo ""
            echo "=== 4. certbot renewal conf ==="
            sudo cat /etc/letsencrypt/renewal/*.conf 2>/dev/null | head -50

            echo ""
            echo "=== 5. Claude memory files ==="
            sudo find /opt/claude-mem-sync/ -name '*.md' -type f 2>/dev/null | head -20
            sudo grep -l "cfut_0JOs" /opt/claude-mem-sync/ -r 2>/dev/null | head -5

            echo ""
            echo "=== 6. Full line with cfut_0JOs ==="
            sudo grep -r "cfut_0JOs" /opt/claude-mem-sync/ 2>/dev/null || echo "only partial ref found"

            echo ""
            echo "=== 7. Try existing token with DNS list (full error) ==="
            CF_TOKEN=$(sudo awk -F' = ' '{print $2}' /root/.secrets/cloudflare.ini 2>/dev/null)
            curl -s "https://api.cloudflare.com/client/v4/zones/2601d4f4ab75c910f8d858ca036ff344/dns_records?per_page=5" \
              -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" 2>/dev/null

            echo ""
            echo "=== DONE ==="
