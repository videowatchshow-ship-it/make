name: Read gucci cloudflare config files
on:
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Read CF config files
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 30s
          script: |
            echo "=== 1. cloudflare-config.php ==="
            sudo cat /var/www/sites/gucci/config/cloudflare-config.php 2>/dev/null

            echo ""
            echo "=== 2. cloudflare-waf-config.php ==="
            sudo cat /var/www/sites/gucci/config/cloudflare-waf-config.php 2>/dev/null

            echo ""
            echo "=== 3. All config files in gucci/config/ ==="
            ls -la /var/www/sites/gucci/config/ 2>/dev/null

            echo ""
            echo "=== 4. gucci .env full ==="
            sudo cat /var/www/sites/gucci/.env 2>/dev/null

            echo ""
            echo "=== 5. migrate_udongka.sh CF section ==="
            sudo cat /opt/gauth-full/scripts/migrate_udongka.sh 2>/dev/null | grep -A2 -B2 "CF_TOKEN\|ZONE\|cloudflare\|cfut_"

            echo ""
            echo "=== 6. Token permissions check ==="
            CF_TOKEN=$(sudo awk -F' = ' '{print $2}' /root/.secrets/cloudflare.ini 2>/dev/null)
            curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" \
              -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" 2>/dev/null

            echo ""
            echo "=== 7. List all Cloudflare API tokens (account level) ==="
            curl -s "https://api.cloudflare.com/client/v4/user/tokens" \
              -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" 2>/dev/null

            echo ""
            echo "=== DONE ==="
