name: Deep search chamgyo server for CF token
on:
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Search chamgyo and all sites for CF tokens
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 90s
          script: |
            echo "=== 1. All cfut_ tokens on server (excluding node_modules) ==="
            sudo grep -r "cfut_" /var/www/ /opt/ /etc/ /root/ --include="*.js" --include="*.json" --include="*.env" --include="*.ini" --include="*.cfg" --include="*.conf" --include="*.md" --include="*.txt" --include="*.sh" --include="*.yaml" --include="*.yml" 2>/dev/null | grep -v node_modules | head -30

            echo ""
            echo "=== 2. Cloudflare config files anywhere ==="
            sudo find /var/www/ /opt/ /root/ /home/ -name "*.cloudflare*" -o -name "*cloudflare*" -o -name ".cf" 2>/dev/null | grep -v node_modules | head -20

            echo ""
            echo "=== 3. chamgyo site structure ==="
            ls -la /var/www/sites/chamgyo/ 2>/dev/null
            ls -la /var/www/sites/chamgyo/public/ 2>/dev/null | head -10

            echo ""
            echo "=== 4. All .env and config files in /var/www/sites/ ==="
            sudo find /var/www/sites/ -maxdepth 3 -name ".env" -o -name "*.ini" -o -name "*.cfg" 2>/dev/null | head -20
            for f in $(sudo find /var/www/sites/ -maxdepth 3 -name ".env" 2>/dev/null); do
              echo "--- $f ---"
              sudo cat "$f" 2>/dev/null
            done

            echo ""
            echo "=== 5. Cloudflare in bash history ==="
            sudo grep -i "cloudflare\|cfut_\|dns_record" /root/.bash_history /home/*/.bash_history 2>/dev/null | tail -20

            echo ""
            echo "=== 6. All tokens in claude-mem-sync cent-solution file ==="
            sudo cat /opt/claude-mem-sync/proj1/cent-solution-on-gcp.md 2>/dev/null

            echo ""
            echo "=== DONE ==="
