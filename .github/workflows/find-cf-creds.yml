name: Create DNS record for second
on:  
  workflow_dispatch:

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Final DNS attempt
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== 1. Certbot renewal configs ==="
            sudo find /etc/letsencrypt/ -name '*.conf' -path '*/renewal/*' 2>/dev/null | while read f; do
              echo "--- $f ---"
              sudo grep -i 'cloudflare\|authenticator\|credential' "$f" 2>/dev/null
            done

            echo ""
            echo "=== 2. All credential files referenced by certbot ==="
            sudo grep -rh 'credentials' /etc/letsencrypt/renewal/ 2>/dev/null

            echo ""
            echo "=== 3. Wrangler and .cloudflare configs ==="
            sudo find /root/ /home/ -name 'wrangler.toml' -o -name '.cloudflare' -o -name 'cloudflare.toml' 2>/dev/null | head -10
            sudo ls -la /root/.cloudflare/ 2>/dev/null || echo "no /root/.cloudflare/"

            echo ""
            echo "=== 4. Try direct DNS creation with token from file ==="
            SERVER_IP=$(curl -s ifconfig.me)
            TOKEN_RAW=$(sudo cat /root/.secrets/cloudflare.ini 2>/dev/null | grep -oP '=\s*\K\S+')
            echo "Token starts with: $(echo $TOKEN_RAW | cut -c1-10)"
            echo "Token length: ${#TOKEN_RAW}"

            echo ""
            echo "=== 5. Create via curl ==="
            RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/2601d4f4ab75c910f8d858ca036ff344/dns_records" \
              -H "Authorization: Bearer $TOKEN_RAW" \
              -H "Content-Type: application/json" \
              -d "{\"type\":\"A\",\"name\":\"second\",\"content\":\"$SERVER_IP\",\"ttl\":1,\"proxied\":true}")
            echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print('success:', d.get('success')); [print('err:', e) for e in d.get('errors',[])]" 2>&1

            echo ""
            echo "=== 6. Check all tokens in ALL ini/cfg/env files ==="
            sudo grep -rh 'cfut_\|cloudflare.*token\|CF_API' /root/ /opt/ /etc/ /home/ /var/www/ --include='*.ini' --include='*.cfg' --include='*.env' --include='*.conf' --include='*.php' --include='*.json' --include='*.toml' 2>/dev/null | grep -v node_modules | sort -u | head -20

            echo ""
            echo "=== DONE ==="
