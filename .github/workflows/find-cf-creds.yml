name: Find alternate CF tokens
on:
  workflow_dispatch:

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Search for CF tokens
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 25s
          script: |
            echo "=== 1. /root/.secrets/ contents ==="
            sudo ls -la /root/.secrets/ 2>/dev/null || echo "NOT FOUND"

            echo ""
            echo "=== 2. All files in /root/.secrets/ ==="
            for f in $(sudo find /root/.secrets/ -type f 2>/dev/null); do
              echo "--- $f ---"
              sudo cat "$f" 2>/dev/null
              echo ""
            done

            echo ""
            echo "=== 3. cfut_ tokens in /opt/ ==="
            sudo grep -r "cfut_" /opt/ 2>/dev/null | head -10 || echo "none"

            echo ""
            echo "=== 4. CF tokens in /root/ ==="
            sudo grep -r "cfut_\|cloudflare" /root/ --include='*.env' --include='*.ini' --include='*.conf' --include='*.sh' --include='*.txt' --include='*.json' 2>/dev/null | head -20 || echo "none"

            echo ""
            echo "=== 5. Cloudflare wrangler or other CF tools ==="
            which wrangler 2>/dev/null || echo "no wrangler"
            ls ~/.wrangler/ 2>/dev/null || echo "no .wrangler"
            sudo ls /root/.wrangler/ 2>/dev/null || echo "no root .wrangler"

            echo ""
            echo "=== DONE ==="
