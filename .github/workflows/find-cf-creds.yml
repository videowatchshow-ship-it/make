name: Find CF credentials everywhere
on:
  workflow_dispatch:

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Read CF token sources
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== 1. Search for cloudflare-api-token memory node ==="
            sudo find /opt/claude-mem-sync/ -name '*cloudflare*' -o -name '*api-token*' -o -name '*cf-token*' 2>/dev/null
            sudo grep -rl 'cfut_' /opt/claude-mem-sync/ 2>/dev/null

            echo ""
            echo "=== 2. Read ALL claude memory files that mention cloudflare ==="
            for f in $(sudo grep -rl -i 'cloudflare\|cfut_\|cf_token' /opt/claude-mem-sync/ 2>/dev/null); do
              echo "--- $f ---"
              sudo cat "$f" 2>/dev/null
              echo ""
            done

            echo ""
            echo "=== 3. Gucci cloudflare-config.php ==="
            sudo cat /var/www/sites/gucci/config/cloudflare-config.php 2>/dev/null || echo "NOT FOUND"

            echo ""
            echo "=== 4. Gucci cloudflare-waf-config.php ==="
            sudo cat /var/www/sites/gucci/config/cloudflare-waf-config.php 2>/dev/null || echo "NOT FOUND"

            echo ""
            echo "=== 5. cloudflare.ini full content ==="
            sudo cat /root/.secrets/cloudflare.ini 2>/dev/null

            echo ""
            echo "=== 6. Search ALL files for cfut_0JOs (full token) ==="
            sudo grep -r 'cfut_0JOs' /opt/ /root/ /var/www/ /etc/ /home/ --include='*.md' --include='*.txt' --include='*.json' --include='*.env' --include='*.ini' --include='*.conf' --include='*.php' --include='*.sh' --include='*.yaml' --include='*.yml' --include='*.toml' 2>/dev/null | head -30

            echo ""
            echo "=== 7. Try certbot DNS cloudflare plugin token ==="
            sudo cat /etc/letsencrypt/dns-cloudflare-credentials.ini 2>/dev/null || echo "not found"
            sudo find /etc/letsencrypt/ -name '*cloudflare*' 2>/dev/null
            sudo find /root/ -name '*credentials*' -o -name '*cloudflare*.ini' -o -name '*cloudflare*.cfg' 2>/dev/null

            echo ""
            echo "=== DONE ==="
