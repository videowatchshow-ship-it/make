name: Setup second DNS + SSL
on:
  workflow_dispatch:
    inputs:
      cf_token:
        description: 'Cloudflare API Token (DNS:Edit). Leave empty to auto-create via API'
        required: false
        type: string
        default: ''

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: List tokens and create DNS token or use provided
        uses: appleboy/ssh-action@v1.0.3
        env:
          CF_DNS_TOKEN: ${{ github.event.inputs.cf_token }}
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          envs: CF_DNS_TOKEN
          command_timeout: 180s
          script: |
            SERVER_IP=$(curl -s ifconfig.me)
            echo "Server IP: $SERVER_IP"
            CF_EXISTING=$(sudo grep -oP 'dns_cloudflare_api_token\s*=\s*\K\S+' /root/.secrets/cloudflare.ini 2>/dev/null | head -1)

            if [ -z "$CF_DNS_TOKEN" ]; then
              echo "No token provided, trying to list and create via API"
              echo ""
              echo "=== 1. List all API tokens on account ==="
              LIST=$(curl -s "https://api.cloudflare.com/client/v4/user/tokens" \
                -H "Authorization: Bearer $CF_EXISTING" -H "Content-Type: application/json")
              echo "$LIST" | python3 -c "
import sys,json
d=json.load(sys.stdin)
if d.get('success'):
  for t in d.get('result',[]):
    print(f\"ID: {t['id']}, Name: {t['name']}, Status: {t['status']}\")
    for p in t.get('policies',[]):
      pgroups = [pg.get('name','?') for pg in p.get('permission_groups',[])]
      print(f\"  Permissions: {', '.join(pgroups)}\")
else:
  print('List failed:', json.dumps(d.get('errors',[])))
" 2>&1

              echo ""
              echo "=== 2. Get DNS Edit permission group ID ==="
              PERMS=$(curl -s "https://api.cloudflare.com/client/v4/user/tokens/permission_groups" \
                -H "Authorization: Bearer $CF_EXISTING" -H "Content-Type: application/json")
              DNS_PERM_ID=$(echo "$PERMS" | python3 -c "
import sys,json
d=json.load(sys.stdin)
if d.get('success'):
  for p in d.get('result',[]):
    n = p.get('name','').lower()
    if 'dns' in n and 'edit' in n:
      print(p['id'])
      break
" 2>/dev/null)
              echo "DNS Edit perm ID: $DNS_PERM_ID"

              echo ""
              echo "=== 3. Create new DNS token ==="
              ZONE="2601d4f4ab75c910f8d858ca036ff344"
              if [ -n "$DNS_PERM_ID" ]; then
                PERM_TO_USE="$DNS_PERM_ID"
              else
                PERM_TO_USE="4755a26eedb94da69e1066d98aa820be"
                echo "Using fallback perm ID"
              fi
              CREATE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/user/tokens" \
                -H "Authorization: Bearer $CF_EXISTING" -H "Content-Type: application/json" \
                -d "{\"name\":\"DNS Edit auto\",\"policies\":[{\"effect\":\"allow\",\"resources\":{\"com.cloudflare.api.account.zone.$ZONE\":\"*\"},\"permission_groups\":[{\"id\":\"$PERM_TO_USE\"}]}]}")
              echo "$CREATE" | python3 -c "
import sys,json
d=json.load(sys.stdin)
if d.get('success'):
  val = d['result'].get('value','???')
  print(f'NEW TOKEN: {val}')
  print(f'Token ID: {d[\"result\"].get(\"id\")}')
else:
  print('Create failed:', json.dumps(d.get('errors',[])))
" 2>&1

              echo ""
              echo "=== 4. Check Global API Key files ==="
              for f in /root/.cloudflare /root/.cloudflare.cfg; do
                if [ -f "$f" ]; then echo "Found: $f"; sudo head -5 "$f"; fi
              done
              echo "=== Token ops done ==="
            else
              echo "Using provided token"
              echo ""
              echo "=== 1. Verify token ==="
              VERIFY=$(curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" \
                -H "Authorization: Bearer $CF_DNS_TOKEN" -H "Content-Type: application/json")
              echo "$VERIFY" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Token status:', d.get('result',{}).get('status','unknown'))" 2>&1

              echo ""
              echo "=== 2. Create DNS A record ==="
              ZONE="2601d4f4ab75c910f8d858ca036ff344"
              EXISTING=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?name=second.cent-solution.online&type=A" \
                -H "Authorization: Bearer $CF_DNS_TOKEN" -H "Content-Type: application/json")
              HAS=$(echo "$EXISTING" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('result',[])))" 2>/dev/null)

              if [ "$HAS" = "0" ]; then
                echo "Creating A record..."
                RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records" \
                  -H "Authorization: Bearer $CF_DNS_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "{\"type\":\"A\",\"name\":\"second\",\"content\":\"$SERVER_IP\",\"ttl\":1,\"proxied\":true}")
                echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Success:', d.get('success'), d.get('result',{}).get('name',''))" 2>&1
              else
                echo "DNS record already exists"
              fi

              echo ""
              echo "=== 3. Save token to server ==="
              echo "dns_cloudflare_api_token = $CF_DNS_TOKEN" | sudo tee /root/.secrets/cloudflare-dns.ini > /dev/null
              sudo chmod 600 /root/.secrets/cloudflare-dns.ini
              echo "Saved to /root/.secrets/cloudflare-dns.ini"

              echo ""
              echo "=== 4. Wait for DNS ==="
              sleep 15
              RESOLVE=$(dig +short second.cent-solution.online 2>/dev/null)
              echo "DNS resolve: $RESOLVE"

              echo ""
              echo "=== 5. SSL certificate ==="
              if [ ! -f /etc/letsencrypt/live/second.cent-solution.online/fullchain.pem ]; then
                if [ -n "$RESOLVE" ]; then
                  echo "Getting SSL cert..."
                  sudo certbot --apache -d second.cent-solution.online --non-interactive --agree-tos --email videowatch.show@gmail.com --redirect 2>&1 || echo "Certbot failed"
                else
                  echo "DNS not ready, skip SSL"
                fi
              else
                echo "SSL cert exists"
              fi

              echo ""
              echo "=== 6. Final check ==="
              curl -sI "https://second.cent-solution.online/" --max-time 5 2>&1 | head -5 || echo "Not reachable yet"
            fi

            echo "=== DONE ==="
