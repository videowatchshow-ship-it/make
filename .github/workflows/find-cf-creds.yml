name: Find CF credentials everywhere
on:
  workflow_dispatch:

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Final CF credential search
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 90s
          script: |
            echo "=== 1. Python cloudflare config files ==="
            sudo cat /root/.cloudflare.cfg 2>/dev/null || echo "no root cfg"
            sudo find / -name '.cloudflare.cfg' -not -path '*/proc/*' -not -path '*/sys/*' 2>/dev/null | head -5 || echo "none"

            echo ""
            echo "=== 2. Memory nodes with token ==="
            sudo find /opt/claude-mem-sync/ -name '*token*' -type f 2>/dev/null
            sudo find /opt/claude-mem-sync/ -name '*cloudflare*' -type f 2>/dev/null

            echo ""
            echo "=== 3. Read token memory nodes ==="
            for f in $(sudo find /opt/claude-mem-sync/ -name '*token*' -type f 2>/dev/null); do
              echo "--- $f ---"
              sudo cat "$f" 2>/dev/null
              echo ""
            done

            echo ""
            echo "=== 4. Global API Key refs ==="
            sudo grep -r 'CLOUDFLARE_EMAIL\|CF_API_KEY\|CLOUDFLARE_API_KEY' /root/ /opt/ /home/ --include='*.env' --include='*.cfg' --include='*.ini' --include='*.conf' --include='*.md' 2>/dev/null | grep -v node_modules | grep -v venv | head -20 || echo "none"

            echo ""
            echo "=== 5. gucci parent .env ==="
            sudo cat /var/www/sites/.env 2>/dev/null || echo "no /var/www/sites/.env"
            sudo cat /var/www/.env 2>/dev/null || echo "no /var/www/.env"

            echo ""
            echo "=== 6. Python CF module test ==="
            CF_TOKEN=$(sudo awk -F' = ' '{print $2}' /root/.secrets/cloudflare.ini 2>/dev/null)
            sudo python3 -c "import CloudFlare; cf=CloudFlare.CloudFlare(token='${CF_TOKEN}'); print(cf.zones.get(params={'name':'cent-solution.online'}))" 2>&1 || echo "python cf failed"

            echo ""
            echo "=== DONE ==="
