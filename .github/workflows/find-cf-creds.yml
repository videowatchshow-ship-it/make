name: Find ALL CF tokens fast
on:
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fast targeted search
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 240s
          script: |
            echo "=== 1. /root/ ==="
            sudo grep -rl --binary-files=without-match 'cfut_' /root/ 2>/dev/null | head -20
            echo "---matches---"
            for f in $(sudo grep -rl --binary-files=without-match 'cfut_' /root/ 2>/dev/null | head -20); do
              echo "FILE: $f"
              sudo grep 'cfut_' "$f" 2>/dev/null
            done

            echo ""
            echo "=== 2. /opt/ ==="
            sudo grep -rl --binary-files=without-match 'cfut_' /opt/ 2>/dev/null | head -20
            echo "---matches---"
            for f in $(sudo grep -rl --binary-files=without-match 'cfut_' /opt/ 2>/dev/null | head -20); do
              echo "FILE: $f"
              sudo grep 'cfut_' "$f" 2>/dev/null
            done

            echo ""
            echo "=== 3. /home/ ==="
            sudo grep -rl --binary-files=without-match 'cfut_' /home/ 2>/dev/null | head -20
            echo "---matches---"
            for f in $(sudo grep -rl --binary-files=without-match 'cfut_' /home/ 2>/dev/null | head -20); do
              echo "FILE: $f"
              sudo grep 'cfut_' "$f" 2>/dev/null
            done

            echo ""
            echo "=== 4. /var/www/ ==="
            sudo grep -rl --binary-files=without-match 'cfut_' /var/www/ 2>/dev/null | head -20
            echo "---matches---"
            for f in $(sudo grep -rl --binary-files=without-match 'cfut_' /var/www/ 2>/dev/null | head -20); do
              echo "FILE: $f"
              sudo grep 'cfut_' "$f" 2>/dev/null
            done

            echo ""
            echo "=== 5. /etc/ ==="
            sudo grep -rl --binary-files=without-match 'cfut_' /etc/ 2>/dev/null | head -10
            echo "---matches---"
            for f in $(sudo grep -rl --binary-files=without-match 'cfut_' /etc/ 2>/dev/null | head -10); do
              echo "FILE: $f"
              sudo grep 'cfut_' "$f" 2>/dev/null
            done

            echo ""
            echo "=== 6. /tmp/ and /var/tmp/ ==="
            sudo grep -rl --binary-files=without-match 'cfut_' /tmp/ /var/tmp/ 2>/dev/null | head -10
            for f in $(sudo grep -rl --binary-files=without-match 'cfut_' /tmp/ /var/tmp/ 2>/dev/null | head -10); do
              echo "FILE: $f"
              sudo grep 'cfut_' "$f" 2>/dev/null
            done

            echo ""
            echo "=== 7. Bash history (all users) ==="
            sudo cat /root/.bash_history 2>/dev/null | grep -i 'cloudflare\|cfut_\|dns_record\|CF_TOKEN\|CF_API' | tail -30
            for u in $(ls /home/ 2>/dev/null); do
              H="/home/$u/.bash_history"
              if sudo test -f "$H"; then
                echo "--- $H ---"
                sudo cat "$H" 2>/dev/null | grep -i 'cloudflare\|cfut_\|CF_TOKEN' | tail -10
              fi
            done

            echo ""
            echo "=== 8. All .secrets files ==="
            sudo ls -la /root/.secrets/ 2>/dev/null
            for f in $(sudo ls /root/.secrets/ 2>/dev/null); do
              echo "--- /root/.secrets/$f ---"
              sudo cat "/root/.secrets/$f" 2>/dev/null
            done

            echo ""
            echo "=== 9. Systemd + env ==="
            sudo grep -rl --binary-files=without-match 'CLOUDFLARE\|CF_TOKEN\|cfut_' /etc/systemd/ /etc/default/ /etc/environment 2>/dev/null | head -10
            sudo cat /etc/environment 2>/dev/null

            echo ""
            echo "=== 10. Git history on server ==="
            for d in /opt/gauth-full /var/www/sites/gucci /var/www/sites/chamgyo; do
              if sudo test -d "$d/.git"; then
                echo "--- $d git log ---"
                cd "$d" && sudo git log -p --all -S 'cfut_' 2>/dev/null | grep -A1 -B1 'cfut_' | head -20
              fi
            done

            echo ""
            echo "=== DONE ==="
