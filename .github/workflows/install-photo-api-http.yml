name: photo API 설치 (HTTP — SSH 없음)

on:
  workflow_dispatch:
  push:
    branches: [claude/chamgyo-casino-docs-deploy-qweddg]
    paths:
      - '.github/workflows/install-photo-api-http.yml'
      - 'gauth/auto_deploy.js'

jobs:
  deploy-auto-deploy:
    name: auto_deploy.js → gauth 서버
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.deploy.outputs.ok }}
    steps:
      - name: /api/deploy 호출 (photo-install 엔드포인트 포함 버전 배포)
        id: deploy
        env:
          GAUTH_API_TOKEN: ${{ secrets.GAUTH_API_TOKEN }}
        run: |
          BRANCH="claude/chamgyo-casino-docs-deploy-qweddg"
          HTTP=$(curl -sf -o /tmp/resp.txt -w "%{http_code}" \
            -X POST https://gauth.cent-solution.online/api/deploy \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${GAUTH_API_TOKEN}" \
            -d "{\"branch\":\"${BRANCH}\"}" \
            --connect-timeout 15 --max-time 180)
          echo "HTTP $HTTP"
          cat /tmp/resp.txt || true
          if [ "$HTTP" = "200" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  install-photo-api:
    name: /api/photo-install 호출
    needs: deploy-auto-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: photo API 설치
        env:
          GAUTH_API_TOKEN: ${{ secrets.GAUTH_API_TOKEN }}
        run: |
          sleep 5
          HTTP=$(curl -sf -o /tmp/resp2.txt -w "%{http_code}" \
            -X POST https://gauth.cent-solution.online/api/photo-install \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${GAUTH_API_TOKEN}" \
            --connect-timeout 15 --max-time 120)
          echo "HTTP $HTTP"
          cat /tmp/resp2.txt || true
          [ "$HTTP" = "200" ] || exit 1

      - name: 동작 확인
        run: |
          echo "=== api_selected_room ==="
          curl -sf "https://gauth.cent-solution.online/photo/api_selected_room.php?ch=cent" || echo "FAIL"
          echo ""
          echo "=== room_10.json ==="
          curl -sf "https://gauth.cent-solution.online/photo/data/room_10.json" | python3 -c "import json,sys; d=json.load(sys.stdin); print('nums:', len(d.get('nums',[])), 'entries')" || echo "FAIL"
