name: photo+photo2 SNW_1.html fit() 불필요한 1초 재적용 제거 (떨림/움직임 원인 수정)
on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-photo2-fit-jitter-fix.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: fit() 변경 감지 없이 매초 DOM 재작성하던 부분 수정 (photo + photo2)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 3m
          script: |
            INNER=$(cat <<'INNEREOF'
            F1=/var/www/sites/chamgyo/public/photo/SNW_1.html
            F2=/var/www/sites/chamgyo/public/photo2/SNW_1.html
            echo "===== 수정 전 fit() 라인 ====="
            grep -o "function fit(){[^}]*}[^<]*" "$F1"
            grep -o "function fit(){[^}]*}[^<]*" "$F2"
            sudo cp "$F1" "${F1}.bak_$(date +%s)"
            sudo cp "$F2" "${F2}.bak_$(date +%s)"
            sudo python3 << 'PYEOF'
            old = "function fit(){var sc=Math.min(window.innerWidth/W,window.innerHeight/H);st.style.transform='scale('+sc+')';wr.style.width=(W*sc)+'px';wr.style.height=(H*sc)+'px';}"
            new = "var __lastSc=null;function fit(){var sc=Math.min(window.innerWidth/W,window.innerHeight/H);if(sc===__lastSc)return;__lastSc=sc;st.style.transform='scale('+sc+')';wr.style.width=(W*sc)+'px';wr.style.height=(H*sc)+'px';}"
            for path in [
                "/var/www/sites/chamgyo/public/photo/SNW_1.html",
                "/var/www/sites/chamgyo/public/photo2/SNW_1.html",
            ]:
                with open(path, "r", encoding="utf-8") as f:
                    content = f.read()
                if old not in content:
                    print("OLD_NOT_FOUND:", path)
                    raise SystemExit(1)
                content = content.replace(old, new, 1)
                with open(path, "w", encoding="utf-8") as f:
                    f.write(content)
                print("FIXED_OK:", path)
            PYEOF
            sudo chown --reference="${F1}.bak_"* "$F1" 2>/dev/null || true
            sudo chown --reference="${F2}.bak_"* "$F2" 2>/dev/null || true
            echo "===== 수정 후 fit() 라인 ====="
            grep -o "function fit(){[^}]*}[^<]*" "$F1"
            grep -o "function fit(){[^}]*}[^<]*" "$F2"
            echo "===== 두 파일 SHA256 (여전히 동일해야 정상) ====="
            sha256sum "$F1" "$F2"
            INNEREOF
            )
            B64=$(printf '%s' "$INNER" | base64 -w0)
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command="echo $B64 | base64 -d | bash"

      - name: 라이브 실측 (200 응답 + 크기)
        run: |
          sleep 3
          for u in "https://xn--9d0bw2fjtyymch7de9d.info/photo/SNW_1.html?ch=cent" "https://xn--9d0bw2fjtyymch7de9d.info/photo2/SNW_1.html?ch=cent"; do
            echo "===== $u ====="
            curl -sS -o /tmp/out.html -w "HTTP %{http_code}, size %{size_download}\n" "$u"
          done
