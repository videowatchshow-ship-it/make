name: gauth gsi realtime status

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-gsi-realtime.txt']

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Restore raw GSI + realtime status panel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 120s
          script: |
            set -e
            F=/var/www/sites/gauth/public/index.html
            EX=/opt/gauth-full/rebrowser-login.js
            CID='956283750273-do3ebgq60vbi585r62ffpk0cqts8l634.apps.googleusercontent.com'
            sudo cp "$F" "$F.bak.gsirt.$(date +%s)"

            echo '=== 1. remove firebase/older widgets, inject official GSI widget + realtime status ==='
            sudo python3 - <<'PYEOF'
            import re
            f='/var/www/sites/gauth/public/index.html'
            s=open(f,encoding='utf-8').read()
            for pat in [r'<!-- fb-login start -->.*?<!-- fb-login end -->\n',
                        r'<!-- gsi-widget start -->.*?<!-- gsi-widget end -->\n',
                        r'<!-- ginfo-login start -->.*?<!-- ginfo-login end -->\n',
                        r'<!-- gsi-rt start -->.*?<!-- gsi-rt end -->\n']:
                s=re.sub(pat,'',s,flags=re.S)
            w=(
              '<!-- gsi-rt start -->\n'
              '<script src="https://accounts.google.com/gsi/client" async defer></script>\n'
              '<div id="gsi-rt" style="position:fixed;top:12px;right:14px;z-index:100000;display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-family:sans-serif">'
              '<div style="display:flex;align-items:center;gap:8px;background:#161a20;border:1px solid #22282f;border-radius:999px;padding:6px 12px;font-size:13px;color:#e8ecef;min-height:34px">'
              '<span id="grt-msg" style="color:#8a95a5">…</span><div id="grt-btn"></div>'
              '<img id="grt-av" style="display:none;width:26px;height:26px;border-radius:50%;object-fit:cover">'
              '<span id="grt-name" style="display:none;color:#3ddc84;font-weight:700"></span>'
              '<a id="grt-out" href="#" style="display:none;color:#9fb3c8;font-size:12px;text-decoration:none;margin-left:4px">로그아웃</a></div>'
              '<div id="grt-status" style="display:none;background:#0d1218;border:1px solid #22282f;border-radius:10px;padding:8px 12px;font-size:12px;color:#cbd5e1;max-width:320px;line-height:1.6"></div>'
              '</div>\n'
              '<script>\n'
              '(function(){\n'
              '  var msg=document.getElementById("grt-msg"),btn=document.getElementById("grt-btn"),av=document.getElementById("grt-av"),nm=document.getElementById("grt-name"),out=document.getElementById("grt-out"),st=document.getElementById("grt-status");\n'
              '  var timer=null;\n'
              '  function fmt(d){ if(!d)return "-"; try{return new Date(d).toLocaleString("ko-KR");}catch(e){return d;} }\n'
              '  function renderStatus(s){ if(!s){st.style.display="none";return;} st.style.display="block";\n'
              '    st.innerHTML="<b style=\\"color:#7dabff\\">실시간 계정 상태</b><br>"+\n'
              '      "이메일: "+(s.email||"-")+"<br>"+\n'
              '      "마지막 로그인: "+fmt(s.last_login)+"<br>"+\n'
              '      "가입일: "+fmt(s.created_at)+"<br>"+\n'
              '      "상태: <b style=\\"color:#3ddc84\\">활성(로그인됨)</b> · 서버 시각 "+fmt(s.server_time); }\n'
              '  function show(u){ msg.style.display="none"; btn.style.display="none"; av.style.display="inline-block"; av.src=u.picture||""; nm.style.display="inline"; nm.textContent=u.name||u.email||""; out.style.display="inline"; startPoll(); }\n'
              '  function signedOut(){ av.style.display="none"; nm.style.display="none"; out.style.display="none"; st.style.display="none"; if(timer){clearInterval(timer);timer=null;} }\n'
              '  function poll(){ fetch("/api/account-status",{credentials:"include",cache:"no-store"}).then(function(r){return r.json();}).then(function(d){ if(d&&d.user){ renderStatus(d); } }).catch(function(){}); }\n'
              '  function startPoll(){ poll(); if(timer)clearInterval(timer); timer=setInterval(poll,5000); }\n'
              '  function onCred(res){ fetch("/api/auth/google",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"include",body:JSON.stringify({credential:res.credential})}).then(function(r){return r.json();}).then(function(d){ if(d&&d.user){show(d.user);} else {msg.textContent="실패: "+(d&&d.error||"?");} }).catch(function(e){msg.textContent="오류: "+e.message;}); }\n'
              '  function renderBtn(cid){ if(!window.google||!google.accounts||!google.accounts.id){setTimeout(function(){renderBtn(cid);},200);return;} google.accounts.id.initialize({client_id:cid,callback:onCred,auto_select:true,itp_support:true}); google.accounts.id.renderButton(btn,{theme:"filled_blue",size:"medium",shape:"pill",text:"signin_with",locale:"ko"}); msg.style.display="none"; btn.style.display="block"; }\n'
              '  out.addEventListener("click",function(e){e.preventDefault(); fetch("/api/auth/logout",{method:"POST",credentials:"include"}).finally(function(){ signedOut(); msg.style.display="inline"; renderBtn(window.__cid); }); });\n'
              '  fetch("/api/auth/me",{credentials:"include",cache:"no-store"}).then(function(r){return r.json();}).then(function(d){ if(d&&d.user){show(d.user);return;} fetch("/api/auth/config",{cache:"no-store"}).then(function(r){return r.json();}).then(function(c){ window.__cid=c.client_id||""; if(!c.client_id){msg.textContent="client_id 미설정";return;} renderBtn(c.client_id); }); }).catch(function(){msg.textContent="서버 확인 필요";});\n'
              '})();\n'
              '</script>\n'
              '<!-- gsi-rt end -->\n'
            )
            s=s.replace('<body>','<body>\n'+w,1) if '<body>' in s else w+s
            open(f,'w',encoding='utf-8').write(s)
            print('gsi-rt widget injected')
            PYEOF

            echo ''
            echo '=== 2. add /api/account-status + /api/auth/logout if missing ==='
            sudo cp "$EX" "$EX.bak.gsirt.$(date +%s)"
            sudo python3 - <<'PYEOF'
            f='/opt/gauth-full/rebrowser-login.js'
            s=open(f,encoding='utf-8').read()
            if '/api/account-status' not in s:
                marker="app.get('/api/subsite-counts'"
                idx=s.index(marker)
                route=r'''
            app.get('/api/account-status', (req, res) => {
              try {
                const fs=require('fs');
                function ck(h){ var o={}; (h||'').split(';').forEach(function(p){ var i=p.indexOf('='); if(i>0)o[p.slice(0,i).trim()]=decodeURIComponent(p.slice(i+1).trim()); }); return o; }
                const sub=ck(req.headers.cookie).gauth_uid;
                if(!sub) return res.json({ user:null });
                let users=[]; try{users=JSON.parse(fs.readFileSync('/opt/gauth-full/google_users.json','utf8'));}catch(e){}
                const u=(users||[]).find(function(x){return x.sub===sub;});
                if(!u) return res.json({ user:null });
                res.json({ user:true, email:u.email, name:u.name, picture:u.picture, created_at:u.created_at, last_login:u.last_login, server_time:new Date().toISOString() });
              } catch(e){ res.status(500).json({ error:String(e&&e.message||e) }); }
            });
            app.post('/api/auth/logout', (_req,res)=>{ res.setHeader('Set-Cookie','gauth_uid=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax'); res.json({ok:true}); });
            '''
                s=s[:idx]+route+'\n'+s[idx:]
                open(f,'w',encoding='utf-8').write(s)
                print('account-status route inserted')
            else:
                print('account-status present')
            PYEOF

            echo ''
            echo '=== 3. ensure GOOGLE_OAUTH_CLIENT_ID env set, syntax, restart ==='
            sudo node -c "$EX" && echo 'syntax OK'
            sudo mkdir -p /etc/systemd/system/gauth.service.d
            printf '[Service]\nEnvironment="GOOGLE_OAUTH_CLIENT_ID=%s"\n' "$CID" | sudo tee /etc/systemd/system/gauth.service.d/google-oauth.conf > /dev/null
            sudo systemctl daemon-reload
            sudo systemctl restart gauth
            sleep 2
            sudo systemctl is-active gauth

            echo ''
            echo '=== 4. verify ==='
            curl -s --max-time 10 http://localhost:4000/api/auth/config
            echo ''
            curl -s -o /dev/null -w 'main: %{http_code}\n' https://gauth.cent-solution.online/ --max-time 10
            echo 'gsi-rt present:'; curl -s --max-time 10 https://gauth.cent-solution.online/ | grep -c 'gsi-rt start' || echo 0
