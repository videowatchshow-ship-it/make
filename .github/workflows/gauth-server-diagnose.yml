name: Diagnose and bootstrap gauth server
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check server status
        run: |
          echo "=== 1. Root page ==="
          curl -sv https://gauth.cent-solution.online/ 2>&1 | head -30
          echo ""
          echo "=== 2. /api/upload-excels OPTIONS ==="
          curl -sv -X OPTIONS https://gauth.cent-solution.online/api/upload-excels 2>&1 | head -20
          echo ""
          echo "=== 3. /api/parse-report ==="
          curl -s https://gauth.cent-solution.online/api/parse-report 2>&1 | head -5
          echo ""
          echo "=== 4. /api/deploy ==="
          curl -s -o /tmp/deploy.txt -w "HTTP %{http_code}" -X POST https://gauth.cent-solution.online/api/deploy -H "Content-Type: application/json"
          echo ""
          cat /tmp/deploy.txt
          echo ""
          echo "=== 5. Known Express routes ==="
          for ep in "/" "/api/accounts" "/api/stats" "/api/conflicts" "/api/parse-report" "/api/upload-excels" "/api/deploy" "/api/health"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://gauth.cent-solution.online${ep}" --max-time 5)
            echo "  ${ep} => HTTP ${CODE}"
          done
          echo ""
          echo "=== 6. Server headers ==="
          curl -sI https://gauth.cent-solution.online/ | head -15

      - name: Try bootstrap via inline script delivery
        run: |
          echo "=== Attempting to deliver auto_deploy.js via POST body ==="
          SCRIPT_CONTENT=$(cat gauth/auto_deploy.js | base64 -w0)
          INDEX_CONTENT=$(cat gauth/index.html | base64 -w0)
          PARSER_CONTENT=$(cat gauth/upload_excels.js | base64 -w0)

          echo "auto_deploy.js: $(echo $SCRIPT_CONTENT | wc -c) bytes (base64)"
          echo "index.html: $(echo $INDEX_CONTENT | wc -c) bytes (base64)"
          echo "upload_excels.js: $(echo $PARSER_CONTENT | wc -c) bytes (base64)"

          echo ""
          echo "=== Server needs SSH access to bootstrap ==="
          echo "Set these GitHub Secrets:"
          echo "  GAUTH_HOST = gauth.cent-solution.online"
          echo "  GAUTH_USER = (SSH username)"
          echo "  GAUTH_SSH_KEY = (SSH private key)"
