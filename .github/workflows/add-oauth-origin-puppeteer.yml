name: Add OAuth authorized origins via server gcloud

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-add-origin.txt']

jobs:
  add-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add authorized JS origins + redirect URIs to OAuth client
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 120s
          script: |
            set -e
            PROJECT="quantum-bonus-455522-b4"
            CID="956283750273-do3ebgq60vbi585r62ffpk0cqts8l634.apps.googleusercontent.com"
            TOKEN=$(gcloud auth print-access-token 2>/dev/null)
            echo "token length: ${#TOKEN}"

            ORIGINS='["https://gauth.cent-solution.online","https://jump.cent-solution.online"]'
            REDIRECTS='["https://gauth.cent-solution.online/","https://jump.cent-solution.online/"]'

            echo "=== 1. GET current client config ==="
            CURRENT=$(curl -s \
              "https://clientauthconfig.googleapis.com/v1/brands/-/clients/$CID" \
              -H "Authorization: Bearer $TOKEN")
            echo "$CURRENT" | head -c 600
            echo ""

            echo "=== 2. attempt PATCH with new origins ==="
            PATCH_BODY=$(cat <<JSONEOF
            {
              "javascript_origins": $ORIGINS,
              "redirect_uris": $REDIRECTS
            }
            JSONEOF
            )
            RESULT=$(curl -s -X PATCH \
              "https://clientauthconfig.googleapis.com/v1/brands/-/clients/$CID" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PATCH_BODY")
            echo "$RESULT" | head -c 800
            echo ""

            if echo "$RESULT" | grep -q "error"; then
              echo ""
              echo "=== 3. fallback: try via identitytoolkit config ==="
              curl -s -X PATCH \
                "https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT/config?updateMask=authorizedDomains" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -d '{"authorizedDomains":["gauth.cent-solution.online","jump.cent-solution.online","localhost"]}'
              echo ""

              echo ""
              echo "=== 4. try setting via cloud-platform scope ==="
              TOKEN2=$(gcloud auth print-access-token --scopes=https://www.googleapis.com/auth/cloud-platform 2>/dev/null)
              curl -s -X PATCH \
                "https://clientauthconfig.googleapis.com/v1/brands/-/clients/$CID?updateMask=javascript_origins,redirect_uris" \
                -H "Authorization: Bearer $TOKEN2" \
                -H "Content-Type: application/json" \
                -d "$PATCH_BODY" | head -c 800
              echo ""
            fi

            echo ""
            echo "=== 5. verify identity platform authorized domains ==="
            curl -s \
              "https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT/config" \
              -H "Authorization: Bearer $TOKEN" | python3 -c "
import sys,json
d=json.load(sys.stdin)
for domain in d.get('authorizedDomains',[]):
  print(' ',domain)
"
            echo "DONE"
