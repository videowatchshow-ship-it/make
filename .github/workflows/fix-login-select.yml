name: fix-login-select
on:
  push:
    paths:
      - '.github/workflows/fix-login-select.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_IP: "187.53.133.145"
      VPS_PASS_B64: "LWFhMGNLMDtibzJRNkxnMg=="
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Read current files
        run: |
          export SSHPASS=$(echo "$VPS_PASS_B64" | base64 -d)
          SSH="sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@$VPS_IP"
          BASE="/var/www/sites/chamgyo/public"

          echo "===== login.html ====="
          $SSH "cat $BASE/photo/login.html"

          echo ""
          echo "===== select.html ====="
          $SSH "cat $BASE/photo/select.html"

          echo ""
          echo "===== data dir ====="
          $SSH "ls -la $BASE/photo/data/"

      - name: Fix login redirect and select.html
        run: |
          export SSHPASS=$(echo "$VPS_PASS_B64" | base64 -d)
          SSH="sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@$VPS_IP"
          BASE="/var/www/sites/chamgyo/public"

          echo "===== Fix login.html -> select.html ====="
          for dir in photo photo2 photo3; do
            $SSH "if [ -f $BASE/$dir/login.html ]; then sed -i 's|CAH_1\.html|select.html|g' $BASE/$dir/login.html && echo 'Fixed $dir/login.html'; else echo 'no $dir/login.html'; fi"
          done

          echo ""
          echo "===== Verify login.html redirect target ====="
          $SSH "grep -o 'select\.html\|CAH_1\.html' $BASE/photo/login.html | head -5"

          echo ""
          echo "===== Create tables.json ====="
          $SSH "python3 -c \"
          import json
          tables = {'tables': [{'id': i, 'name': str(i), 'status': 'open'} for i in range(1, 11)]}
          with open('$BASE/photo/data/tables.json', 'w') as f:
              json.dump(tables, f)
          print('Created tables.json')
          \""
          $SSH "chown www-data:www-data $BASE/photo/data/tables.json"
          $SSH "cat $BASE/photo/data/tables.json"

          echo ""
          echo "===== Fix select.html API references ====="
          for dir in photo photo2 photo3; do
            $SSH "if [ -f $BASE/$dir/select.html ]; then sed -i \"s|const API = .*|const API = '.';\"|g $BASE/$dir/select.html && echo 'Fixed $dir'; fi"
          done

          echo ""
          echo "===== Verify no gauth ====="
          $SSH "grep -c 'gauth' $BASE/photo/select.html && echo 'GAUTH STILL PRESENT' || echo 'GAUTH CLEAN'"

      - name: Purge CF cache
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/7e5faed2d3d4d6da7aceb4ddde81a62b/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' | python3 -c "import sys,json;d=json.load(sys.stdin);print('CF Purge:', 'OK' if d.get('success') else d)"

      - name: Verify live
        run: |
          sleep 5
          DOMAIN="xn--9d0bw2fjtyymch7de9d.info"

          echo "===== login.html redirect target ====="
          curl -sS "https://$DOMAIN/photo/login.html" --max-time 10 | grep -o 'select\.html\|CAH_1\.html' | head -5

          echo "===== select.html ====="
          curl -sS -o /dev/null -w "select.html: HTTP %{http_code} | size %{size_download}\n" "https://$DOMAIN/photo/select.html" --max-time 10

          echo "===== tables.json ====="
          curl -sS "https://$DOMAIN/photo/data/tables.json" --max-time 10

          echo ""
          echo "===== gauth check ====="
          curl -sS "https://$DOMAIN/photo/select.html" --max-time 10 | grep -c 'gauth' && echo "GAUTH STILL PRESENT" || echo "GAUTH CLEAN"
