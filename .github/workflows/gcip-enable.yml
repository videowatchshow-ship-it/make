name: gcip enable + authorizedDomains

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-gcip-enable.txt']

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Enable identitytoolkit, getConfig, add gauth authorizedDomain
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 300s
          script: |
            PROJECT=quantum-bonus-455522-b4
            DOMAIN=gauth.cent-solution.online
            echo '=== 1. enable Identity Toolkit API (Service Usage) ==='
            gcloud services enable identitytoolkit.googleapis.com --project=$PROJECT 2>&1 | head -5 || echo 'enable failed'
            echo 'waiting 30s for propagation...'
            sleep 30

            TOKEN=$(gcloud auth print-access-token 2>/dev/null)
            echo ''
            echo '=== 2. getConfig (may need to initialize) ==='
            CFG=$(curl -s -X GET "https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT/config" -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $PROJECT")
            echo "$CFG" | head -c 1500
            echo ''
            echo ''
            if echo "$CFG" | grep -q 'CONFIGURATION_NOT_FOUND'; then
              echo '=== 2b. initialize default config ==='
              curl -s -X POST "https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT/identityPlatform:initializeAuth" -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $PROJECT" -H 'Content-Type: application/json' -d '{}' | head -c 600
              echo ''
              sleep 5
              CFG=$(curl -s -X GET "https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT/config" -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $PROJECT")
            fi

            echo ''
            echo '=== 3. build new authorizedDomains list (existing + gauth) ==='
            NEWDOMAINS=$(echo "$CFG" | python3 -c "import sys,json; d=json.load(sys.stdin); ad=d.get('authorizedDomains',[]) or ['localhost','$PROJECT.firebaseapp.com','$PROJECT.web.app']; ad=list(dict.fromkeys(ad+['$DOMAIN'])); print(json.dumps(ad))" 2>/dev/null)
            echo "new domains: $NEWDOMAINS"

            echo ''
            echo '=== 4. PATCH updateConfig?updateMask=authorizedDomains (official) ==='
            curl -s -X PATCH "https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT/config?updateMask=authorizedDomains" \
              -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $PROJECT" -H 'Content-Type: application/json' \
              -d "{\"authorizedDomains\": $NEWDOMAINS}" | head -c 1200
            echo ''
            echo ''
            echo '=== 5. verify authorizedDomains now includes gauth ==='
            curl -s -X GET "https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT/config" -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $PROJECT" | python3 -c "import sys,json; d=json.load(sys.stdin); print('authorizedDomains:', d.get('authorizedDomains'))" 2>/dev/null || echo 'parse fail'
