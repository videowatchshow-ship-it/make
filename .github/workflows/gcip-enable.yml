name: gcip enable + authorizedDomains

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-gcip-enable.txt']

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: initializeAuth (correct path) + add gauth authorizedDomain
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 200s
          script: |
            PROJECT=quantum-bonus-455522-b4
            DOMAIN=gauth.cent-solution.online
            TOKEN=$(gcloud auth print-access-token 2>/dev/null)

            echo '=== 1. initializeAuth (official /v2/projects/{p}/identityPlatform:initializeAuth) ==='
            curl -s -X POST "https://identitytoolkit.googleapis.com/v2/projects/$PROJECT/identityPlatform:initializeAuth" \
              -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $PROJECT" -H 'Content-Type: application/json' -d '{}' | head -c 800
            echo ''
            echo 'sleep 8...'
            sleep 8

            echo ''
            echo '=== 2. getConfig ==='
            CFG=$(curl -s -X GET "https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT/config" -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $PROJECT")
            echo "$CFG" | head -c 1200
            echo ''

            echo ''
            echo '=== 3. build + PATCH authorizedDomains ==='
            NEWDOMAINS=$(echo "$CFG" | python3 -c "import sys,json; d=json.load(sys.stdin); ad=d.get('authorizedDomains') or ['localhost','$PROJECT.firebaseapp.com','$PROJECT.web.app']; ad=list(dict.fromkeys(ad+['$DOMAIN'])); print(json.dumps(ad))" 2>/dev/null)
            echo "new domains: $NEWDOMAINS"
            [ -z "$NEWDOMAINS" ] && NEWDOMAINS='["localhost","'$PROJECT'.firebaseapp.com","'$PROJECT'.web.app","'$DOMAIN'"]'
            curl -s -X PATCH "https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT/config?updateMask=authorizedDomains" \
              -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $PROJECT" -H 'Content-Type: application/json' \
              -d "{\"authorizedDomains\": $NEWDOMAINS}" | head -c 1000
            echo ''

            echo ''
            echo '=== 4. verify ==='
            curl -s -X GET "https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT/config" -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $PROJECT" | python3 -c "import sys,json; d=json.load(sys.stdin); print('authorizedDomains:', d.get('authorizedDomains')); print('signIn:', list((d.get('signIn') or {}).keys()))" 2>/dev/null || echo 'parse fail'
