name: probe-luzhu-src
on:
  push:
    paths:
      - '.github/workflows/probe-luzhu-src.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: fetch luzhu pc.html + assets
        run: |
          set +e
          B="https://gs.xtd6688.com/luzhu/en"; UA="Mozilla/5.0"
          mkdir -p out
          curl -sS --max-time 20 -A "$UA" -o out/pc.html -w "pc.html HTTP %{http_code} size %{size_download}\n" "$B/pc.html?tableId=18"
          for a in $(grep -oE '(src|href)="[^"]+"' out/pc.html | sed -E 's/^[a-z]+="//;s/"$//' | grep -v '^http' | sort -u); do
            n=$(echo "$a" | tr '/?' '__'); curl -sS --max-time 20 -A "$UA" -o "out/$n" -w "$a HTTP %{http_code} size %{size_download}\n" "$B/$a"
          done
          # css 안 이미지 목록
          grep -ohE 'url\([^)]+\)' out/* 2>/dev/null | sort -u | head -60
          ls -la out
      - name: dump all
        run: |
          for f in out/*; do
            echo; echo "==================== $f ($(stat -c%s "$f") bytes)"
            case "$f" in *.png|*.jpg|*.gif|*.ico|*.woff*|*.ttf) echo "(binary)";; *) head -c 60000 "$f"; echo;; esac
          done
      - name: sample api data table 18
        run: |
          curl -sS --max-time 10 -H "Origin: https://gs.xtd6688.com" -H "Referer: https://gs.xtd6688.com/luzhu/zh/pc.html" -A "Mozilla/5.0" "https://api.xtd6688.com/api/diantou/table/getData/gameType/3/tableId/18/xue/null"; echo
          grep -ohE 'https?://[a-z0-9.]+xtd6688[^"'"'"' )]*|/api/[A-Za-z0-9/_${}+]+' out/* | sort -u
