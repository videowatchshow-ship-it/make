name: List all sub-sites
on:
  workflow_dispatch:

jobs:
  list-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scan all sites on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 5m
          script: |
            echo "=== All sites in /var/www/sites/ ==="
            ls -la /var/www/sites/
            echo ""

            echo "=== All listening ports (Node/Express) ==="
            sudo ss -tlnp | grep node || sudo netstat -tlnp 2>/dev/null | grep node || echo "no node ports"
            echo ""

            echo "=== All systemd services with 'site' or custom names ==="
            systemctl list-units --type=service --state=running | grep -v systemd | head -40
            echo ""

            echo "=== PM2 process list ==="
            pm2 list 2>/dev/null || echo "pm2 not found"
            echo ""

            echo "=== Apache vhosts ==="
            sudo apache2ctl -S 2>/dev/null | head -40 || sudo httpd -S 2>/dev/null | head -40 || echo "no apache"
            echo ""

            echo "=== accounts.json in each site ==="
            for dir in /var/www/sites/*/; do
              name=$(basename "$dir")
              if [ -f "$dir/accounts.json" ]; then
                count=$(sudo node -e "try{const d=JSON.parse(require('fs').readFileSync('${dir}accounts.json','utf8'));const a=Array.isArray(d)?d:(d.accounts||[]);console.log(a.length)}catch(e){console.log('ERR:'+e.message)}")
                echo "$name: $count accounts"
              elif [ -f "$dir/public/accounts.json" ]; then
                count=$(sudo node -e "try{const d=JSON.parse(require('fs').readFileSync('${dir}public/accounts.json','utf8'));const a=Array.isArray(d)?d:(d.accounts||[]);console.log(a.length)}catch(e){console.log('ERR:'+e.message)}")
                echo "$name (public/): $count accounts"
              else
                echo "$name: no accounts.json"
              fi
            done
            echo ""

            echo "=== server.js in each site ==="
            for dir in /var/www/sites/*/; do
              name=$(basename "$dir")
              if [ -f "$dir/server.js" ]; then
                port=$(grep -oP 'listen\(\s*\K\d+' "$dir/server.js" 2>/dev/null | head -1)
                echo "$name: server.js (port $port)"
              else
                echo "$name: no server.js"
              fi
            done
