name: CF list and create DNS token
on:
  workflow_dispatch:

jobs:
  token-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: List and create CF tokens via server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            CF_TOKEN=$(sudo grep -oP 'dns_cloudflare_api_token\s*=\s*\K\S+' /root/.secrets/cloudflare.ini 2>/dev/null | head -1)
            ZONE="2601d4f4ab75c910f8d858ca036ff344"

            echo "=== 1. List all API tokens on account ==="
            LIST=$(curl -s "https://api.cloudflare.com/client/v4/user/tokens" \
              -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json")
            echo "$LIST" | python3 -c "
import sys,json
d=json.load(sys.stdin)
if d.get('success'):
  for t in d.get('result',[]):
    print(f\"ID: {t['id']}, Name: {t['name']}, Status: {t['status']}\")
    for p in t.get('policies',[]):
      pgroups = [pg.get('name','?') for pg in p.get('permission_groups',[])]
      print(f\"  Permissions: {', '.join(pgroups)}\")
else:
  print('Failed:', d.get('errors'))
" 2>&1

            echo ""
            echo "=== 2. Get DNS Edit permission group ID ==="
            PERMS=$(curl -s "https://api.cloudflare.com/client/v4/user/tokens/permission_groups" \
              -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json")
            DNS_PERM_ID=$(echo "$PERMS" | python3 -c "
import sys,json
d=json.load(sys.stdin)
if d.get('success'):
  for p in d.get('result',[]):
    if 'dns' in p.get('name','').lower() and 'edit' in p.get('name','').lower():
      print(p['id'])
      break
" 2>/dev/null)
            echo "DNS Edit permission group ID: $DNS_PERM_ID"

            echo ""
            echo "=== 3. Create new DNS token ==="
            if [ -n "$DNS_PERM_ID" ]; then
              CREATE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/user/tokens" \
                -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
                -d "{
                  \"name\": \"DNS Edit - second site auto\",
                  \"policies\": [{
                    \"effect\": \"allow\",
                    \"resources\": {\"com.cloudflare.api.account.zone.$ZONE\": \"*\"},
                    \"permission_groups\": [{\"id\": \"$DNS_PERM_ID\"}]
                  }]
                }")
              echo "$CREATE" | python3 -c "
import sys,json
d=json.load(sys.stdin)
if d.get('success'):
  print('NEW TOKEN VALUE:', d['result'].get('value','???'))
  print('Token ID:', d['result'].get('id'))
else:
  print('Create failed:', d.get('errors'))
" 2>&1
            else
              echo "Could not find DNS Edit permission ID, trying known ID"
              CREATE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/user/tokens" \
                -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
                -d "{
                  \"name\": \"DNS Edit - second site auto\",
                  \"policies\": [{
                    \"effect\": \"allow\",
                    \"resources\": {\"com.cloudflare.api.account.zone.$ZONE\": \"*\"},
                    \"permission_groups\": [{\"id\": \"4755a26eedb94da69e1066d98aa820be\"}]
                  }]
                }")
              echo "$CREATE" | python3 -c "
import sys,json
d=json.load(sys.stdin)
if d.get('success'):
  print('NEW TOKEN VALUE:', d['result'].get('value','???'))
  print('Token ID:', d['result'].get('id'))
else:
  print('Create failed:', d.get('errors'))
" 2>&1
            fi

            echo ""
            echo "=== 4. Also check Global API Key ==="
            python3 -c "
import configparser, os
for f in ['/root/.cloudflare', '/root/.cloudflare.cfg', os.path.expanduser('~/.cloudflare'), os.path.expanduser('~/.cloudflare.cfg')]:
  try:
    with open(f) as fh:
      print(f'Found: {f}')
      print(fh.read()[:200])
  except: pass
" 2>/dev/null || echo "No global key files"

            echo "=== DONE ==="
