name: deploy-venue-system
on:
  push:
    paths:
      - '.github/workflows/deploy-venue-system.yml'
      - 'photo/select.html'
      - 'photo/bgl.js'
      - 'photo/collector.py'
      - 'photo/selapi.py'
      - 'photo/view.js'
      - 'photo/admin.html'
      - 'photo/login.html'
      - 'photo/CAW_1.html'
      - 'photo/CAH_1.html'
      - 'photo/CAH_2.html'
      - 'photo/luzhu.html'
      - 'photo/luzhu.js'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_IP: "187.53.133.145"
      VPS_PASS_B64: "LWFhMGNLMDtibzJRNkxnMg=="
      BASE: "/var/www/sites/chamgyo/public"
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Build tables.json (성천지 live rooms 1..300 + 싱지 20)
        run: |
          set +e
          python3 - <<'PY'
          import json, urllib.request, concurrent.futures
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36'
          H={'User-Agent':UA,'Origin':'https://fcj6.oqogyf.com','Referer':'https://fcj6.oqogyf.com/'}
          def probe(rid):
              try:
                  req=urllib.request.Request(f'https://xjh.liveview2024.vip/api/pub/get_room?room_id={rid}',headers=H)
                  d=json.loads(urllib.request.urlopen(req,timeout=8).read())
                  if isinstance(d,dict) and d.get('room_name') is not None:
                      return rid, {'room_name': str(d.get('room_name')).replace('桌','').strip(), 'bet': d.get('is_bet_room')}
              except Exception: pass
              return None
          live=[]
          with concurrent.futures.ThreadPoolExecutor(16) as ex:
              for r in ex.map(probe, range(1,301)):
                  if r: live.append(r)
          live.sort()
          print('fcj6/xjh live rooms:', [r for r,_ in live], 'count', len(live))
          for r,x in live[:3]: print(' sample', r, json.dumps(x, ensure_ascii=False)[:300])
          # fcj6.oqogyf.com/?room_id=N (xjh API) = 싱지 (뉴싱지 통합)
          sj_rooms=[{'id':r,'name':x['room_name'] or str(r)} for r,x in live]
          # 캄보디아빈.com 그림장 = gs.xtd6688.com luzhu tableId  → 성천지
          xtd_map={"10":10,"11":11,"12":12,"15":15,"16":16,"17":87,"18":18,"19":89,"20":20,"21":21,"22":22,"23":23,"25":25,"26":26,"27":27,"55":31,"66":32,"77":33,"88":34,"99":35}
          xtd_kind={"10":"21점","16":"용호"}
          xtd_rooms=[{'id':int(k),'api':v,'name':k,'kind':xtd_kind.get(k,'')} for k,v in xtd_map.items()]
          tables={'venues':[
            {'key':'xtd','name':'성천지','source':'xtd','rooms':xtd_rooms},
            {'key':'sj','name':'싱지','source':'sc','rooms':sj_rooms}]}
          json.dump(tables, open('tables.json','w'), ensure_ascii=False, indent=1)
          PY
          echo "--- tables.json ---"; head -c 1500 tables.json; echo

      - name: Fetch original assets (캄보디아빈 images + css)
        run: |
          set +e
          B="https://xn--2z1b92mg3alyphom.com"; UA="Mozilla/5.0"
          mkdir -p orig/images orig/include
          curl -sS --max-time 20 -A "$UA" -o orig/include/live_style.css "$B/include/live_style.css"
          for i in Live_width_01_banner.gif board_nextPB_2023_4.png nextPB_A4.png muback_h_title.png Live_height_banner_scj.gif live03_next_PB.png h_side_banner_sedol.png h_side_banner.png boardA3_nextPB.png Live_height_kakao.gif Live_width_01_banner_kakao.gif Live_width_04_kakao.gif clock_cambodia.png; do
            curl -sS --max-time 180 -A "$UA" -o "orig/images/$i" -w "$i HTTP %{http_code} size %{size_download}\n" "$B/images/$i"
            [ -s "orig/images/$i" ] && head -c 4 "orig/images/$i" | grep -q '<' && { echo "  not image → drop"; rm -f "orig/images/$i"; }
          done
          ls -la orig/images orig/include; sha256sum orig/images/* | head -20
          # 원본 그림장(gs.xtd6688 luzhu) 이미지 세트 그대로 복사
          L="https://gs.xtd6688.com/luzhu/en/static/img"
          mkdir -p orig/luzhu_img/zhuzi orig/luzhu_img/dalu orig/luzhu_img/xiaolu orig/luzhu_img/dayan orig/luzhu_img/xiaoqiang orig/luzhu_img/sanxing orig/luzhu_img/wenlu_static
          curl -sS --max-time 20 -A "$UA" -o orig/luzhu_img/top_bg.png "$L/top_bg.png"
          for i in $(seq 1 16); do curl -sS --max-time 20 -A "$UA" -o "orig/luzhu_img/zhuzi/$i.png" "$L/zhuzi/$i.png"; done
          for i in $(seq 1 8); do curl -sS --max-time 20 -A "$UA" -o "orig/luzhu_img/dalu/$i.png" "$L/dalu/$i.png"; done
          for d in xiaolu dayan xiaoqiang sanxing; do for c in red blue; do curl -sS --max-time 20 -A "$UA" -o "orig/luzhu_img/$d/$c.png" "$L/$d/$c.png"; done; done
          for d in dayan xiaolu xiaoqiang; do for c in red blue no_find; do curl -sS --max-time 20 -A "$UA" -o "orig/luzhu_img/wenlu_static/${c}_$d.png" "$L/wenlu_static/${c}_$d.png"; done; done
          # 이미지가 아닌(404 html) 파일 제거 + 결과 목록
          for f in $(find orig/luzhu_img -type f); do head -c 4 "$f" | grep -q 'PNG' || { echo "NOT PNG → drop: $f ($(head -c 60 $f | tr '\n' ' '))"; rm -f "$f"; }; done
          echo "--- luzhu images fetched ---"; find orig/luzhu_img -type f | sort | xargs -I{} sh -c 'printf "%-45s %s\n" {} $(stat -c%s {})'

      - name: Upload files
        run: |
          export SSHPASS=$(echo "$VPS_PASS_B64" | base64 -d)
          SCP="sshpass -e scp -o StrictHostKeyChecking=no -o ConnectTimeout=30"
          SSH="sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@$VPS_IP"
          # SSH 재시도 (러너→VPS 간헐 타임아웃)
          for i in 1 2 3 4 5 6; do $SSH "echo ssh-ok" && break; echo "ssh retry $i"; sleep 20; done
          $SSH "mkdir -p /opt/chulmok $BASE/photo/data $BASE/photo/images $BASE/photo/include"
          $SCP photo/collector.py photo/selapi.py photo/install_services.py root@$VPS_IP:/opt/chulmok/
          $SCP tables.json root@$VPS_IP:$BASE/photo/data/tables.json
          $SCP -r orig/images/. root@$VPS_IP:$BASE/photo/images/
          $SCP orig/include/live_style.css root@$VPS_IP:$BASE/photo/include/
          $SSH "mkdir -p $BASE/photo/luzhu_img" && $SCP -r orig/luzhu_img/. root@$VPS_IP:$BASE/photo/luzhu_img/
          for d in photo photo2 photo3; do
            $SSH "mkdir -p $BASE/$d/include"
            $SCP photo/select.html photo/bgl.js photo/view.js photo/admin.html photo/login.html photo/CAW_1.html photo/CAH_1.html photo/CAH_2.html photo/luzhu.html photo/luzhu.js root@$VPS_IP:$BASE/$d/
            $SSH "rm -f $BASE/$d/CAH_3.html $BASE/$d/roads.js"
            [ "$d" != photo ] && $SSH "cp -f $BASE/photo/include/live_style.css $BASE/$d/include/ && cp -n $BASE/photo/images/* $BASE/$d/images/ 2>/dev/null; rm -rf $BASE/$d/luzhu_img && cp -r $BASE/photo/luzhu_img $BASE/$d/luzhu_img; true"
          done
          $SSH "chown -R www-data:www-data $BASE/photo $BASE/photo2 $BASE/photo3; chmod 755 /opt/chulmok/*.py; rm -f $BASE/photo/api_selected_room.php $BASE/photo/data/room_1.json $BASE/photo/data/room_sn_*.json $BASE/photo/data/room_sc_*.json $BASE/photo/data/room_nsj_*.json $BASE/photo/data/room_fd_*.json $BASE/photo/select.html.bak.*"
          echo "--- server sha256 (images) ---"; $SSH "sha256sum $BASE/photo/images/* | head -20"

      - name: Install services (systemd) + nginx proxy
        run: |
          export SSHPASS=$(echo "$VPS_PASS_B64" | base64 -d)
          SSH="sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@$VPS_IP"
          $SSH "python3 /opt/chulmok/install_services.py"
          $SSH "systemctl daemon-reload && systemctl enable --now chulmok-selapi chulmok-collector && systemctl restart chulmok-selapi chulmok-collector && nginx -t && systemctl reload nginx"
          echo "--- run collector once (foreground) ---"
          $SSH "sudo -u www-data python3 /opt/chulmok/collector.py once 2>&1 | tail -20"
          $SSH "systemctl is-active chulmok-selapi chulmok-collector; ls -la $BASE/photo/data | head -60; ls $BASE/photo/data | wc -l"
          echo "--- local api test ---"
          $SSH "curl -sS 'http://127.0.0.1:4002/photo/api_selected_room.php?ch=01'; echo; curl -sS 'http://127.0.0.1/photo/api_selected_room.php?ch=01' -H 'Host: xn--9d0bw2fjtyymch7de9d.info'; echo"   # 읽기만 (사용자 선택 덮어쓰기 금지)

      - name: Purge CF cache
        run: |
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/7e5faed2d3d4d6da7aceb4ddde81a62b/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_TOKEN }}" -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' | python3 -c "import sys,json; print('Purge success:', json.load(sys.stdin).get('success'))"

      - name: Verify live
        run: |
          sleep 4
          D="https://xn--9d0bw2fjtyymch7de9d.info/photo"
          for p in select.html bgl.js data/tables.json "api_selected_room.php?ch=01" CAH_1.html; do
            curl -sS -o /tmp/o -D /tmp/h "$D/$p"; printf "%-32s HTTP %s size %s cf=%s\n" "$p" "$(head -1 /tmp/h | cut -d' ' -f2)" "$(stat -c%s /tmp/o)" "$(grep -i cf-cache-status /tmp/h | awk '{print $2}' | tr -d '\r')"
          done
          echo "--- tables.json venues ---"; curl -sS "$D/data/tables.json" | python3 -c "import sys,json; [print(v['name'], len(v['rooms'])) for v in json.load(sys.stdin)['venues']]"
          echo "--- sample room jsons ---"
          for k in $(curl -sS "$D/data/tables.json" | python3 -c "import sys,json; t=json.load(sys.stdin); print(' '.join(f\"{v['key']}_{r['id']}\" for v in t['venues'] for r in v['rooms'][:2]))"); do
            printf "%s → " "$k"; curl -sS -o /tmp/r -w "HTTP %{http_code} " "$D/data/room_$k.json"; python3 -c "import json;d=json.load(open('/tmp/r'));print('nums',len(d.get('nums',[])),d.get('server_time'))" 2>/dev/null || echo
          done
          echo "--- select.html venues ---"; curl -sS "$D/select.html" | grep -c 'venue-tab'
          echo "--- 특수 결과(용8/용7/2장6/3장6) 데이터 존재 확인: 접미어 있는 nums ---"
          for k in $(curl -sS "$D/data/tables.json" | python3 -c "import sys,json; t=json.load(sys.stdin); print(' '.join(f\"{v['key']}_{r['id']}\" for v in t['venues'] for r in v['rooms']))"); do
            curl -sS -o /tmp/r "$D/data/room_$k.json" && python3 -c "import json,sys;d=json.load(open('/tmp/r'));sp=[x for x in d.get('nums',[]) if len(x)>3];print('$k', len(d.get('nums',[])), 'special', sp) if sp else None" 2>/dev/null
          done
          echo "--- root alias pages: <base href> + assets the browser will actually request ---"
          R="https://xn--9d0bw2fjtyymch7de9d.info"
          for p in CAW_1.php CAH_1.php CAH_2.php; do printf "%-10s HTTP %s base=%s\n" "$p" "$(curl -sS -o /tmp/o -w '%{http_code}' "$R/$p")" "$(grep -o '<base[^>]*>' /tmp/o)"; done
          for a in photo/view.js photo/bgl.js photo/luzhu.html photo/luzhu.js photo/images/nextPB_A4.png photo/images/h_side_banner.png photo/images/Live_height_banner_scj.gif photo/include/live_style.css "photo/api_settings.php?ch=01" photo/luzhu_img/zhuzi/1.png photo/luzhu_img/dalu/1.png; do
            printf "%-45s HTTP %s size %s\n" "$a" "$(curl -sS -o /tmp/o -w '%{http_code}' "$R/$a")" "$(stat -c%s /tmp/o)"; done
