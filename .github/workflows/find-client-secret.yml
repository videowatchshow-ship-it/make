name: find google client secret

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-find-secret.txt']

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Scoped grep (fast, no full-fs walk)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo '=== 1. gauth dirs only ==='
            sudo grep -roiE 'GOCSPX-[A-Za-z0-9_-]{10,}' /opt/gauth-full 2>/dev/null | sort -u | head || echo 'none in /opt/gauth-full'
            echo ''
            echo '=== 2. is .info (google-auth-api.php) hosted on THIS box? ==='
            sudo find /var/www -maxdepth 4 -iname 'google-auth-api.php' 2>/dev/null | head || echo 'not on this box'
            echo ''
            echo '=== 3. any php or env under /var/www with GOCSPX (maxdepth limited) ==='
            sudo find /var/www -maxdepth 5 -type f \( -name '*.php' -o -name '*.env' -o -name '*.json' -o -name '*.ini' \) 2>/dev/null | head -300 | while read f; do
              if sudo grep -qiE 'GOCSPX|client_secret' "$f" 2>/dev/null; then echo "HIT: $f"; sudo grep -oiE 'GOCSPX-[A-Za-z0-9_-]{10,}' "$f" | head -1; fi
            done
            echo ''
            echo '=== 4. gcloud secret manager (maybe stored there) ==='
            gcloud secrets list --project=quantum-bonus-455522-b4 2>/dev/null | head -20 || echo 'no secret manager access / none'
            echo 'done'
