name: find google client secret

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-find-secret.txt']

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Grep GOCSPX everywhere reachable
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 200s
          script: |
            echo '=== 1. search whole /opt /var/www /etc /home /root for GOCSPX / client_secret ==='
            sudo grep -roiE 'GOCSPX-[A-Za-z0-9_-]{10,}' /opt /var/www /etc /home /root 2>/dev/null | sort -u | head -20 || echo 'none in local fs'
            echo ''
            echo '=== 2. search for client_secret json files ==='
            sudo find /opt /var/www /root /home /etc -iname '*client_secret*' -o -iname '*oauth*json*' 2>/dev/null | head -20 || true
            echo ''
            echo '=== 3. does .info backend live on THIS box too? (multi-site server) ==='
            sudo find /var/www -iname 'google-auth-api.php' 2>/dev/null | head -10 || echo 'not on this box'
            echo ''
            echo '=== 4. any php config with google + secret ==='
            sudo grep -rliE 'google.*secret|client_secret|GOCSPX' /var/www 2>/dev/null | head -20 || echo 'none'
            echo ''
            echo '=== 5. can this box ssh to my-site-1 tokyo (where .info lives)? ==='
            sudo cat /root/.ssh/config 2>/dev/null | grep -iE 'host|hostname' | head -20 || echo 'no ssh config'
            for h in my-site-1 tokyo 34 35; do true; done
            echo ''
            echo '=== 6. gcloud: list oauth brands/clients if any org path works ==='
            gcloud auth print-access-token >/dev/null 2>&1 && echo 'token ok'
