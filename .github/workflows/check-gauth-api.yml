name: check-gauth-api
on:
  push:
    paths:
      - '.github/workflows/check-gauth-api.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check gauth API endpoints
        run: |
          echo "===== gauth main page ====="
          curl -sS -o /dev/null -w "HTTP %{http_code} | size %{size_download} | time %{time_total}s\n" "https://gauth.cent-solution.online/" || echo "FAILED"

          echo ""
          echo "===== api_selected_room.php?ch=01 ====="
          curl -sS -o /tmp/room.json -w "HTTP %{http_code} | size %{size_download} | time %{time_total}s\n" "https://gauth.cent-solution.online/photo/api_selected_room.php?ch=01" --max-time 10 || echo "TIMEOUT/FAILED"
          cat /tmp/room.json 2>/dev/null || true

          echo ""
          echo "===== api_selected_room.php?ch=cent ====="
          curl -sS -o /tmp/room2.json -w "HTTP %{http_code} | size %{size_download} | time %{time_total}s\n" "https://gauth.cent-solution.online/photo/api_selected_room.php?ch=cent" --max-time 10 || echo "TIMEOUT/FAILED"
          cat /tmp/room2.json 2>/dev/null || true

          echo ""
          echo "===== api_img_ver.php?ch=01 ====="
          curl -sS -o /tmp/img.json -w "HTTP %{http_code} | size %{size_download} | time %{time_total}s\n" "https://gauth.cent-solution.online/photo/api_img_ver.php?ch=01" --max-time 10 || echo "TIMEOUT/FAILED"
          cat /tmp/img.json 2>/dev/null || true

          echo ""
          echo "===== data/room_10.json (sample) ====="
          curl -sS -o /tmp/r10.json -w "HTTP %{http_code} | size %{size_download} | time %{time_total}s\n" "https://gauth.cent-solution.online/photo/data/room_10.json" --max-time 10 || echo "TIMEOUT/FAILED"
          cat /tmp/r10.json 2>/dev/null | head -5 || true

          echo ""
          echo "===== gauth Express port 4000 ====="
          curl -sS -o /dev/null -w "HTTP %{http_code} | size %{size_download}\n" "https://gauth.cent-solution.online:4000/" --max-time 10 2>&1 || echo "NOT ACCESSIBLE"
