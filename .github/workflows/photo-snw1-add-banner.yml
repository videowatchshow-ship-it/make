name: SNW_1.html 세로A 배너(참교육) 실제 표시 추가
on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-snw1-add-banner.yml'
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 180s
          envs: CF_TOKEN,CF_ZONE
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command="bash -s -- '$CF_TOKEN' '$CF_ZONE'" << 'REMOTE'
            set +u
            CF_TOKEN="$1"
            CF_ZONE="$2"
            P1="/var/www/sites/chamgyo/public/photo"
            TS=$(date +%s)

            echo "===== [1] SNW_1.html 구조 파악 (검정 우측 영역 찾기) ====="
            sudo grep -n "signal\|banner\|CAH\|BG\|bg\|background\|Live_" "$P1/SNW_1.html" | head -30

            echo ""
            echo "===== [2] SNW_1.html 백업 ====="
            sudo cp "$P1/SNW_1.html" "$P1/SNW_1.html.bak.$TS"
            echo "  백업: SNW_1.html.bak.$TS"

            echo ""
            echo "===== [3] SNW_1.html body 끝에 배너 오버레이 CSS/HTML 주입 ====="
            # 계정 파라미터 읽어서 알맞은 URL 만드는 <script>
            sudo python3 << "PYEOF"
            fp = "/var/www/sites/chamgyo/public/photo/SNW_1.html"
            with open(fp, 'r', encoding='utf-8') as f:
                html = f.read()

            SNIPPET = '''
            <!-- CHAMGYO_BANNER_INJECTED -->
            <style id="chamgyoBannerCss">
            #chamgyoBanner{position:fixed;top:0;right:0;width:50vw;max-width:1080px;height:266px;background-image:var(--chamgyo-bg);background-size:cover;background-position:center;background-repeat:no-repeat;pointer-events:none;z-index:9999;opacity:1;transition:opacity .2s;}
            @media (max-width:1200px){#chamgyoBanner{width:100vw;top:auto;bottom:0;height:120px;background-size:contain;background-color:#000;}}
            </style>
            <div id="chamgyoBanner"></div>
            <script>
            (function(){
              try{
                var q=new URLSearchParams(location.search);
                var ch=(q.get('ch')||'').replace(/[^a-zA-Z0-9_]/g,'');
                var v=Date.now();
                var url = ch ? ('/photo/images/ch/'+ch+'/Live_height_kakao.gif?v='+v)
                             : ('/photo/images/Live_height_kakao.gif?v='+v);
                document.documentElement.style.setProperty('--chamgyo-bg','url("'+url+'")');
              }catch(e){}
            })();
            </script>
            <!-- /CHAMGYO_BANNER_INJECTED -->
            '''

            if 'CHAMGYO_BANNER_INJECTED' in html:
                # 기존 주입 삭제 후 재삽입
                import re
                html = re.sub(r'\n?<!-- CHAMGYO_BANNER_INJECTED -->.*?<!-- /CHAMGYO_BANNER_INJECTED -->\n?',
                              '', html, flags=re.DOTALL)

            if '</body>' in html:
                html = html.replace('</body>', SNIPPET + '\n</body>')
            else:
                html += SNIPPET

            with open(fp, 'w', encoding='utf-8') as f:
                f.write(html)
            print('  주입 완료')
            PYEOF

            sudo chown www-data:www-data "$P1/SNW_1.html"
            sudo chmod 644 "$P1/SNW_1.html"

            echo ""
            echo "===== [4] 주입 검증 ====="
            sudo grep -n "CHAMGYO_BANNER_INJECTED\|chamgyoBanner" "$P1/SNW_1.html" | head -10

            echo ""
            echo "===== [5] Cloudflare purge (SNW_1.html) ====="
            if [ -n "$CF_TOKEN" ] && [ -n "$CF_ZONE" ]; then
              DOM="xn--9d0bw2fjtyymch7de9d.info"
              URLS='["https://'$DOM'/photo/SNW_1.html","https://'$DOM'/photo/SNW_1.html?ch=cent","https://'$DOM'/photo/SNW_1.html?ch=tak","https://'$DOM'/photo/SNW_1.html?ch=aass0707","https://'$DOM'/photo/SNW_1.html?ch=jay","https://'$DOM'/photo/SNW_1.html?ch=otuki","https://'$DOM'/photo/SNW_1.html?ch=abc01","https://'$DOM'/photo/SNW_1.html?ch=abc02","https://'$DOM'/photo/SNW_1.html?ch=abc03","https://'$DOM'/photo/SNW_1.html?ch=abc04","https://'$DOM'/photo/SNW_1.html?ch=abc05","https://'$DOM'/photo/SNW_1.html?ch=abc06","https://'$DOM'/photo/SNW_1.html?ch=abc07"]'
              curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
                -H "Authorization: Bearer $CF_TOKEN" \
                -H "Content-Type: application/json" \
                --data "{\"files\":$URLS}" 2>&1 | head -5
              echo ""
              curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
                -H "Authorization: Bearer $CF_TOKEN" \
                -H "Content-Type: application/json" \
                --data '{"purge_everything":true}' 2>&1 | head -5
            fi

            echo ""
            echo "===== DONE ====="
            REMOTE

      - name: GH러너 실측 - SNW_1.html 안에 chamgyoBanner 있나
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          sleep 20
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | python3 -m json.tool | head -5
          echo ""
          sleep 5
          DOM="xn--9d0bw2fjtyymch7de9d.info"
          for U in cent tak abc01 aass0707; do
            echo "--- $U ---"
            RESP=$(curl -sS -H "Cache-Control: no-cache" "https://$DOM/photo/SNW_1.html?ch=$U&_=$(date +%s%N)" 2>&1)
            echo "$RESP" | grep -o "chamgyoBanner\|CHAMGYO_BANNER_INJECTED" | sort -u
          done
