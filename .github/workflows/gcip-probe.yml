name: gcip probe getConfig

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-gcip-probe.txt']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: getConfig + api keys
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 90s
          script: |
            PROJECT=quantum-bonus-455522-b4
            TOKEN=$(gcloud auth print-access-token 2>/dev/null)
            echo '=== 1. GCIP admin getConfig (official /admin/v2/projects/{p}/config) ==='
            curl -s -X GET \
              "https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT/config" \
              -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $PROJECT" | head -c 2500
            echo ''
            echo ''
            echo '=== 2. browser (BROWSER-restricted) API keys with keyString ==='
            for k in $(curl -s "https://apikeys.googleapis.com/v2/projects/$PROJECT/locations/global/keys" -H "Authorization: Bearer $TOKEN" | python3 -c "import sys,json; d=json.load(sys.stdin); [print(x['name']) for x in d.get('keys',[])]" 2>/dev/null); do
              echo "key: $k"
              curl -s "https://apikeys.googleapis.com/v2/$k/keyString" -H "Authorization: Bearer $TOKEN" | head -c 200
              echo ''
            done
            echo ''
            echo '=== 3. is identitytoolkit + Identity Platform enabled? ==='
            gcloud services list --enabled --project=$PROJECT 2>/dev/null | grep -iE 'identitytoolkit|identity' || echo 'not enabled'
