name: Fix cha (restart) + win (find real service and restart)
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diag hae subsite-accounts
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 4m
          script: |
            echo '=== subsite-accounts handler in rebrowser-login.js ==='
            sudo grep -n "subsite-accounts\|subsite\|SITES\|siteDirs\|accounts\.json\|hae" /opt/gauth-full/rebrowser-login.js | head -40

            echo '=== hae site check ==='
            ls /var/www/sites/hae/ 2>/dev/null || echo 'no /var/www/sites/hae'
            echo "hae accounts count: $(sudo cat /var/www/sites/hae/accounts.json 2>/dev/null | sudo node -e "var d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{var j=JSON.parse(d);console.log(Array.isArray(j)?j.length:Object.keys(j).length)}catch(e){console.log('err')}})")"

            echo '=== /api/subsite-accounts sample ==='
            curl -sf http://localhost:4000/api/subsite-accounts 2>/dev/null | sudo node -e "var d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{var j=JSON.parse(d);console.log('sites:',j.sites?j.sites.map(s=>s.site).join(', '):JSON.stringify(j).slice(0,300))}catch(e){console.log('parse err:',d.slice(0,200))}})" || echo 'API failed (maybe auth required)'
