name: Fix cha (restart) + win (find real service and restart)
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/gauth-frontend-backend-fixes-cg2icv
      - name: Deploy jump frontend to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 4m
          script: |
            echo '=== jump frontend path ==='
            ls /var/www/sites/jump/ 2>/dev/null | head -10 || echo 'no /var/www/sites/jump'
            ls /var/www/jump/ 2>/dev/null | head -10 || echo 'no /var/www/jump'

      - name: Copy jump files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          source: "jump/index.html,jump/accounts.html"
          target: /tmp/jump-deploy/
          strip_components: 1

      - name: Move files to correct location
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo '=== deploying jump files ==='
            # Find jump public dir
            JUMP_DIR=""
            for d in /var/www/sites/jump/public /var/www/sites/jump /var/www/jump/public /var/www/jump; do
              if [ -d "$d" ]; then JUMP_DIR="$d"; break; fi
            done
            echo "Jump dir: $JUMP_DIR"
            if [ -n "$JUMP_DIR" ]; then
              sudo cp /tmp/jump-deploy/index.html "$JUMP_DIR/" && echo 'index.html deployed'
              sudo cp /tmp/jump-deploy/accounts.html "$JUMP_DIR/" && echo 'accounts.html deployed'
            else
              echo 'ERROR: jump dir not found'
            fi
            rm -rf /tmp/jump-deploy
