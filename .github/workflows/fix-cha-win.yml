name: Fix cha (restart) + win (find real service and restart)
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose bacad port and test
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 4m
          script: |
            echo '=== bacad service port ==='
            sudo systemctl cat bacad 2>/dev/null | grep -i port
            sudo grep -E 'listen|PORT' /var/www/sites/bacad/server.js | head -5
            echo '=== all node ports ==='
            sudo ss -tlnp | grep node
            echo '=== bacad PID ==='
            sudo systemctl show bacad -p MainPID
            BACAD_PID=$(sudo systemctl show bacad -p MainPID | cut -d= -f2)
            echo "bacad PID: $BACAD_PID"
            sudo ss -tlnp | grep "pid=$BACAD_PID"
            echo '=== curl test ==='
            PORT=$(sudo ss -tlnp | grep "pid=$BACAD_PID" | grep -oP ':\K[0-9]+' | head -1)
            echo "bacad PORT: $PORT"
            if [ -n "$PORT" ]; then
              curl -v http://localhost:$PORT/api/win/login-issues 2>&1 | tail -20
            fi
