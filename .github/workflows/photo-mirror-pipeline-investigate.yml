name: photo2 미러 파이프라인 실제 구조 확인 (chamgyo-p2-mirror 등)
on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-mirror-pipeline-investigate.yml'
jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 180s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='bash -s' << "REMOTE"
            set +u

            echo "===== [1] chamgyo-p2-mirror / disc / xtd / sinji lock 을 만드는 스크립트/서비스/크론 전부 검색 ====="
            sudo grep -rl "chamgyo-p2-mirror\|chamgyo-p2-disc\|chamgyo-p2-xtd\|chamgyo-p2-sinji" /etc/cron.d /etc/systemd/system /var/www/sites/chamgyo 2>/dev/null

            echo ""
            echo "===== [2] 위에서 찾은 스크립트 내용 전체 출력 ====="
            for f in $(sudo grep -rl "chamgyo-p2-mirror\|chamgyo-p2-disc\|chamgyo-p2-xtd\|chamgyo-p2-sinji" /etc/cron.d /etc/systemd/system /var/www/sites/chamgyo 2>/dev/null); do
              echo "----- $f -----"
              sudo cat "$f" 2>&1
              echo ""
            done

            echo ""
            echo "===== [3] photo, photo2, photo3 심볼릭 링크 구조 실제 확인 (data, images 전부) ====="
            sudo ls -la /var/www/sites/chamgyo/public/photo/data 2>&1 | head -3
            sudo ls -la /var/www/sites/chamgyo/public/photo2/data 2>&1 | head -3
            sudo ls -la /var/www/sites/chamgyo/public/photo3/data 2>&1 | head -3
            sudo ls -la /var/www/sites/chamgyo/public/photo/images 2>&1 | head -3
            sudo ls -la /var/www/sites/chamgyo/public/photo2/images 2>&1 | head -3
            sudo ls -la /var/www/sites/chamgyo/public/photo3/images 2>&1 | head -3
            echo "readlink 결과:"
            sudo readlink -f /var/www/sites/chamgyo/public/photo/data 2>&1
            sudo readlink -f /var/www/sites/chamgyo/public/photo2/data 2>&1
            sudo readlink -f /var/www/sites/chamgyo/public/photo3/data 2>&1

            echo ""
            echo "===== [4] photo/CAH_1.html 이 이미지 src 를 어디서 읽는지(images 상대경로) 재확인 ====="
            sudo grep -n "kakao_banner" -A2 /var/www/sites/chamgyo/public/photo/CAH_1.html 2>&1 | head -10

            echo ""
            echo "===== [5] photo 폴더가 어떤 계정 지원하는지 - CAH_1.html 내 계정분기/otuki cent jay tak 하드코딩 검색 ====="
            sudo grep -n "otuki\|cent\|jay\|tak" /var/www/sites/chamgyo/public/photo/CAH_1.html 2>&1 | head -20

            echo ""
            echo "===== [6] write.php (계정별 업로드 폼 진입점) 안에서 photo/photo2/photo3 분기 로직 ====="
            sudo grep -n "photo2\|photo3\|write_upload" /var/www/sites/chamgyo/public/photo/write.php 2>&1 | head -30
            REMOTE
