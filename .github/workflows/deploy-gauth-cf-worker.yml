name: Deploy gauth frontend via Cloudflare Worker
on:
  workflow_dispatch:
  push:
    branches: [claude/auto-test-debugging-local-n0xjkg, claude/gauth-frontend-backend-fixes-cg2icv]
    paths:
      - 'gauth/index.html'

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Cloudflare account ID from zone
        id: cf_account
        run: |
          ACCOUNT_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_TOKEN }}" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['result']['account']['id'])")
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "Got account ID: ${ACCOUNT_ID:0:8}..."

      - name: Build Worker script
        run: |
          ENCODED_HTML=$(python3 -c "
          import base64
          with open('gauth/index.html','rb') as f:
              print(base64.b64encode(f.read()).decode())
          ")
          cat > /tmp/worker.js << 'WORKER_EOF'
          const HTML_B64 = `__HTML_B64__`;
          const html = atob(HTML_B64);
          export default {
            async fetch(request) {
              const url = new URL(request.url);
              if (url.pathname === '/' || url.pathname === '/index.html') {
                return new Response(html, {
                  headers: {
                    'content-type': 'text/html; charset=utf-8',
                    'cache-control': 'no-cache',
                    'x-deployed-by': 'github-actions',
                    'x-deploy-time': new Date().toISOString(),
                  },
                });
              }
              return fetch(request);
            },
          };
          WORKER_EOF
          sed -i "s|__HTML_B64__|${ENCODED_HTML}|" /tmp/worker.js
          echo "Worker script built ($(wc -c < /tmp/worker.js) bytes)"

      - name: Deploy Worker to Cloudflare
        run: |
          ACCOUNT_ID="${{ steps.cf_account.outputs.account_id }}"
          WORKER_NAME="gauth-frontend"

          echo "=== Uploading Worker script ==="
          UPLOAD=$(curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_TOKEN }}" \
            -H "Content-Type: application/javascript" \
            --data-binary @/tmp/worker.js)

          echo "$UPLOAD" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if d.get('success'):
            print('Worker uploaded successfully')
          else:
            print('Upload failed:', json.dumps(d.get('errors',[])))
            sys.exit(1)
          "

      - name: Set up Worker route
        run: |
          ZONE_ID="${{ secrets.CLOUDFLARE_ZONE_ID }}"
          WORKER_NAME="gauth-frontend"

          echo "=== Checking existing routes ==="
          ROUTES=$(curl -s "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_TOKEN }}")

          EXISTING=$(echo "$ROUTES" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for r in d.get('result',[]):
            if 'gauth.cent-solution.online' in r.get('pattern','') and r.get('script')=='${WORKER_NAME}':
              print(r['id'])
              break
          " 2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            echo "Route already exists: $EXISTING"
          else
            echo "=== Creating Worker route ==="
            ROUTE=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"pattern\":\"gauth.cent-solution.online/\",\"script\":\"${WORKER_NAME}\"}")

            echo "$ROUTE" | python3 -c "
            import json,sys
            d=json.load(sys.stdin)
            if d.get('success'):
              print('Route created:', d['result']['id'])
            else:
              print('Route creation failed:', json.dumps(d.get('errors',[])))
              print('(May need Workers plan)')
            "
          fi

      - name: Verify deployment
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://gauth.cent-solution.online/)
          echo "Site status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            HEADER=$(curl -sI https://gauth.cent-solution.online/ | grep -i x-deployed-by || true)
            if [ -n "$HEADER" ]; then
              echo "Cloudflare Worker serving new frontend"
            else
              echo "Site is up but Worker may not be active yet"
            fi
          fi
          echo "=== Deploy complete ==="
