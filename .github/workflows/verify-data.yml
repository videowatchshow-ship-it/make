name: Verify data.json state

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch data.json
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" --quiet \
              --command="sudo cat /var/www/sites/chamgyo/settlement-data/data.json"
