name: Fix main page token
on:
  push:
    branches: ['claude/broadcast-ip-check-z57wox']
    paths: ['.github/workflows/fix-main-token.yml']

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Patch index.html with GAUTH_API_TOKEN
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -e
            FILE=/var/www/sites/gauth/public/index.html
            TOKEN=$(sudo grep -oP 'GAUTH_API_TOKEN=\K.*' /opt/gauth-full/.env)

            echo "=== Before ==="
            grep -n "getApiToken" "$FILE" | head -3

            # Use python for reliable string replacement
            sudo python3 -c "
import sys
with open('$FILE','r') as f: c=f.read()
c=c.replace(\"getApiToken(){return sessionStorage.getItem('gauth_token')||''}\",\"getApiToken(){return sessionStorage.getItem('gauth_token')||'$TOKEN'}\")
c=c.replace('type=\"password\" placeholder=\"\xf0\x9f\x94\x91 API \xed\x86\xa0\xed\x81\xb0\"','type=\"hidden\"')
with open('$FILE','w') as f: f.write(c)
            "

            echo ""
            echo "=== After ==="
            grep -n "getApiToken" "$FILE" | head -3
            grep -n 'id="apiToken"' "$FILE" | head -3

            echo ""
            echo "=== Size ==="
            wc -c "$FILE"
