name: Fix main page token
on:
  push:
    branches: ['claude/broadcast-ip-check-z57wox']
    paths: ['.github/workflows/fix-main-token.yml']

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Patch index.html with GAUTH_API_TOKEN
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -e
            TOKEN=$(sudo grep -oP 'GAUTH_API_TOKEN=\K.*' /opt/gauth-full/.env)
            FILE=/var/www/sites/gauth/public/index.html

            echo "=== Before ==="
            grep -c "gauth_token" "$FILE"

            cat > /tmp/patch_token.py << 'PYEOF'
            import sys
            token = sys.argv[1]
            fpath = sys.argv[2]
            with open(fpath, 'r') as f:
                c = f.read()
            old = "getApiToken(){return sessionStorage.getItem('gauth_token')||''}"
            new = "getApiToken(){return sessionStorage.getItem('gauth_token')||'" + token + "'}"
            c = c.replace(old, new)
            c = c.replace('type="password" placeholder=', 'type="hidden" data-old-placeholder=')
            with open(fpath, 'w') as f:
                f.write(c)
            print('Patched OK')
            PYEOF

            sudo python3 /tmp/patch_token.py "$TOKEN" "$FILE"
            rm -f /tmp/patch_token.py

            echo ""
            echo "=== After ==="
            grep -n "getApiToken" "$FILE" | head -3
            grep -n 'id="apiToken"' "$FILE" | head -3
            wc -c "$FILE"
