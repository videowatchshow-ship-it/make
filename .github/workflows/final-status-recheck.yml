name: 최종 상태 재확인 (cent 110번 + photo/photo2 SNW_1.html 디자인 동일 여부)
on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/final-status-recheck.yml'
jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: sel_cent.json + SHA256 재확인
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 2m
          script: |
            INNER=$(cat <<'INNEREOF'
            echo "===== photo2 cent room_id ====="
            sudo cat /var/www/sites/chamgyo/public/photo2/data/sel_cent.json
            echo ""
            echo "===== photo vs photo2 SNW_1.html SHA256 ====="
            sha256sum /var/www/sites/chamgyo/public/photo/SNW_1.html /var/www/sites/chamgyo/public/photo2/SNW_1.html
            INNEREOF
            )
            B64=$(printf '%s' "$INNER" | base64 -w0)
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command="echo $B64 | base64 -d | bash"

      - name: 라이브 실측 (curl)
        run: |
          sleep 2
          echo "===== photo ?ch=cent ====="
          curl -sS "https://xn--9d0bw2fjtyymch7de9d.info/photo/SNW_1.html?ch=cent" -o /tmp/photo.html
          sha256sum /tmp/photo.html
          echo "===== photo2 ?ch=cent ====="
          curl -sS "https://xn--9d0bw2fjtyymch7de9d.info/photo2/SNW_1.html?ch=cent" -o /tmp/photo2.html
          sha256sum /tmp/photo2.html
