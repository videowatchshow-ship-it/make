name: gauth firebase login

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-fb-login.txt']

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Replace GSI with Firebase Auth SDK widget + verify route
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 120s
          script: |
            set -e
            F=/var/www/sites/gauth/public/index.html
            EX=/opt/gauth-full/rebrowser-login.js
            sudo cp "$F" "$F.bak.fb.$(date +%s)"

            echo '=== 1. remove old login blocks, inject Firebase module widget ==='
            sudo python3 - <<'PYEOF'
            import re
            f='/var/www/sites/gauth/public/index.html'
            s=open(f,encoding='utf-8').read()
            for pat in [r'<!-- gsi-widget start -->.*?<!-- gsi-widget end -->\n',
                        r'<!-- ginfo-login start -->.*?<!-- ginfo-login end -->\n',
                        r'<!-- fb-login start -->.*?<!-- fb-login end -->\n']:
                s=re.sub(pat,'',s,flags=re.S)
            widget=(
              '<!-- fb-login start -->\n'
              '<div id="fb-signin" style="position:fixed;top:12px;right:14px;z-index:100000;display:flex;align-items:center;gap:8px;background:#161a20;border:1px solid #22282f;border-radius:999px;padding:6px 12px;font-family:sans-serif;font-size:13px;color:#e8ecef;min-height:34px">'
              '<span id="fb-msg" style="color:#8a95a5">…</span>'
              '<img id="fb-av" style="display:none;width:26px;height:26px;border-radius:50%;object-fit:cover">'
              '<span id="fb-name" style="display:none;color:#3ddc84;font-weight:700"></span>'
              '<a id="fb-logout" href="#" style="display:none;color:#9fb3c8;font-size:12px;text-decoration:none;margin-left:4px">로그아웃</a>'
              '</div>\n'
              '<script type="module">\n'
              'import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";\n'
              'import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, setPersistence, browserLocalPersistence, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";\n'
              'const firebaseConfig = {\n'
              '  apiKey: "AIzaSyBahECe4THRJVR1h8bfRyTEvWHgz3Jqn9Y",\n'
              '  authDomain: "quantum-bonus-455522-b4.firebaseapp.com",\n'
              '  projectId: "quantum-bonus-455522-b4"\n'
              '};\n'
              'const app = initializeApp(firebaseConfig);\n'
              'const auth = getAuth(app);\n'
              'await setPersistence(auth, browserLocalPersistence);\n'
              'const provider = new GoogleAuthProvider();\n'
              'const msg=document.getElementById("fb-msg"), av=document.getElementById("fb-av"), nm=document.getElementById("fb-name"), lo=document.getElementById("fb-logout");\n'
              'function renderSignedOut(){ av.style.display="none"; nm.style.display="none"; lo.style.display="none"; msg.style.display="inline"; msg.textContent="Google 로그인"; msg.style.cursor="pointer"; }\n'
              'function renderSignedIn(u){ msg.style.display="none"; av.style.display="inline-block"; av.src=u.photoURL||""; nm.style.display="inline"; nm.textContent=u.displayName||u.email||""; lo.style.display="inline"; }\n'
              'msg.addEventListener("click", async function(){ try{ const r=await signInWithPopup(auth, provider); const idt=await r.user.getIdToken(); await fetch("/api/auth/firebase",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"include",body:JSON.stringify({idToken:idt})}); }catch(e){ msg.textContent="실패: "+(e.code||e.message); } });\n'
              'lo.addEventListener("click", async function(ev){ ev.preventDefault(); await signOut(auth); await fetch("/api/auth/firebase-logout",{method:"POST",credentials:"include"}); renderSignedOut(); });\n'
              'onAuthStateChanged(auth, async function(u){ if(u){ renderSignedIn(u); try{ const idt=await u.getIdToken(); fetch("/api/auth/firebase",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"include",body:JSON.stringify({idToken:idt})}); }catch(e){} } else { renderSignedOut(); } });\n'
              '</script>\n'
              '<!-- fb-login end -->\n'
            )
            s=s.replace('<body>','<body>\n'+widget,1) if '<body>' in s else widget+s
            open(f,'w',encoding='utf-8').write(s)
            print('firebase widget injected')
            PYEOF

            echo ''
            echo '=== 2. add /api/auth/firebase verify route (Google tokeninfo, persistent cookie) ==='
            sudo cp "$EX" "$EX.bak.fb.$(date +%s)"
            sudo python3 - <<'PYEOF'
            f='/opt/gauth-full/rebrowser-login.js'
            s=open(f,encoding='utf-8').read()
            if "/api/auth/firebase'" in s or '/api/auth/firebase"' in s:
                print('firebase route present, skipping')
            else:
                marker="app.get('/api/subsite-counts'"
                idx=s.index(marker)
                route=r'''
            // === Firebase Auth id_token verification (Identity Platform) ===
            app.post('/api/auth/firebase', async (req, res) => {
              try {
                const fs=require('fs'); const https=require('https');
                let body=req.body; if(!body||typeof body!=='object'){ body=await new Promise(function(rs){ let d=''; req.on('data',function(c){d+=c;}); req.on('end',function(){ try{rs(JSON.parse(d||'{}'));}catch(e){rs({});} }); }); }
                const idToken=body.idToken; if(!idToken) return res.status(400).json({error:'missing idToken'});
                // verify via Google tokeninfo (Firebase id_tokens are Google-signed JWTs; aud=projectId)
                const info=await new Promise(function(resolve,reject){ https.get('https://oauth2.googleapis.com/tokeninfo?id_token='+encodeURIComponent(idToken),function(r){ let d=''; r.on('data',function(c){d+=c;}); r.on('end',function(){ try{resolve(JSON.parse(d));}catch(e){reject(e);} }); }).on('error',reject); });
                if(info.error||info.error_description) return res.status(401).json({error:'token invalid'});
                if(info.aud!=='quantum-bonus-455522-b4') return res.status(401).json({error:'aud mismatch'});
                let users=[]; try{users=JSON.parse(fs.readFileSync('/opt/gauth-full/google_users.json','utf8'));}catch(e){}
                if(!Array.isArray(users)) users=[];
                const sub=info.sub||info.user_id;
                let u=users.find(function(x){return x.sub===sub;});
                if(!u){ u={sub:sub, email:info.email||'', name:info.name||'', picture:info.picture||'', created_at:new Date().toISOString(), last_login:new Date().toISOString()}; users.push(u); }
                else { u.last_login=new Date().toISOString(); if(info.email)u.email=info.email; if(info.name)u.name=info.name; if(info.picture)u.picture=info.picture; }
                fs.writeFileSync('/opt/gauth-full/google_users.json', JSON.stringify(users,null,2));
                res.setHeader('Set-Cookie','gauth_uid='+encodeURIComponent(sub)+'; Path=/; Max-Age=315360000; HttpOnly; Secure; SameSite=Lax');
                res.json({ok:true, user:{sub:u.sub,email:u.email,name:u.name,picture:u.picture}});
              } catch(e){ res.status(500).json({error:String(e&&e.message||e)}); }
            });
            app.post('/api/auth/firebase-logout', (_req,res)=>{ res.setHeader('Set-Cookie','gauth_uid=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax'); res.json({ok:true}); });
            '''
                s=s[:idx]+route+'\n'+s[idx:]
                open(f,'w',encoding='utf-8').write(s)
                print('firebase route inserted')
            PYEOF

            echo ''
            echo '=== 3. syntax + restart ==='
            sudo node -c "$EX" && echo 'syntax OK'
            sudo systemctl restart gauth
            sleep 2
            sudo systemctl is-active gauth

            echo ''
            echo '=== 4. verify ==='
            curl -s -o /dev/null -w 'main: %{http_code}\n' https://gauth.cent-solution.online/ --max-time 10
            echo 'firebase widget present:'
            curl -s --max-time 10 https://gauth.cent-solution.online/ | grep -c 'fb-login start' || echo 0
            echo 'old gsi/ginfo removed (should be 0):'
            curl -s --max-time 10 https://gauth.cent-solution.online/ | grep -c 'gsi-widget start\|ginfo-login start' || echo 0
