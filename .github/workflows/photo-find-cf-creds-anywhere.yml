name: Cloudflare 자격증명 서버 전역 재검색 (재발급 없이 기존 것 찾기)
on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-find-cf-creds-anywhere.yml'
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 100s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='bash -s' << "REMOTE"
            set +u
            echo "===== [1] my-site-1 서버 안 cloudflare 관련 env/config 파일 검색 (값 노출 안 함, 파일 경로만) ====="
            timeout 10 sudo grep -rl "CLOUDFLARE\|cf_token\|CF_API" /etc/environment /root/.bashrc /root/.profile /home/*/.bashrc /etc/apache2 2>/dev/null
            timeout 10 sudo find / -maxdepth 4 -iname "*.env" -o -iname "cloudflare*.json" -o -iname "cf_config*" 2>/dev/null | grep -v "/proc/"

            echo ""
            echo "===== [2] crontab/systemd 안에 이미 동작 중인 CF API 호출 스크립트가 있는지 (있으면 그 자격증명 재사용 가능) ====="
            timeout 10 sudo grep -rl "api.cloudflare.com" /etc/cron.d /etc/systemd/system /usr/local/sbin /var/www/sites/chamgyo/bin 2>/dev/null

            echo ""
            echo "===== [3] wrangler/cloudflared 같은 CLI 도구가 설치돼 있고 이미 인증돼 있는지 ====="
            which wrangler cloudflared 2>&1
            timeout 5 sudo find /root /home -maxdepth 3 -iname ".wrangler" -o -iname ".cloudflared" 2>/dev/null
            REMOTE

      - name: gauth 서버(같은 SSH 세션 경유) 안 CF 자격증명 검색
        env:
          GAUTH_HOST: ${{ secrets.GAUTH_HOST }}
          GAUTH_USER: ${{ secrets.GAUTH_USER }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "===== gauth 서버 자체(SSH 홉의 첫 서버) 안 CF 관련 파일 검색 ====="
            timeout 10 sudo grep -rl "CLOUDFLARE\|CF_API_TOKEN" /etc/environment /root/.bashrc /opt/gauth-full 2>/dev/null
            timeout 10 find / -maxdepth 4 \( -iname "*.env" -o -iname "cloudflare*.json" \) 2>/dev/null | grep -v "/proc/"
