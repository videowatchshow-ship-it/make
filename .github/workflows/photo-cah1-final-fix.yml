name: CAH_1.html CSS 확인 + 캐시 purge + 실제 스크린샷 검증
on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-cah1-final-fix.yml'
jobs:
  finalfix:
    runs-on: ubuntu-latest
    steps:
      - name: 서버 CSS 확인 + CAH_1.html 터치
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 180s
          envs: CF_TOKEN,CF_ZONE
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='bash -s' << "REMOTE"
            set +u
            P1="/var/www/sites/chamgyo/public/photo"

            echo "===== [1] box_B / kakao_banner CSS 확인 ====="
            sudo grep -n "box_B\|kakao_banner" "$P1/CAH_1.html" | head -20

            echo ""
            echo "===== [2] 파일 시각 강제 touch (Last-Modified 갱신) ====="
            sudo touch "$P1/CAH_1.html"
            sudo chown www-data:www-data "$P1/CAH_1.html"

            echo ""
            echo "===== [3] 다른 계정들도 CAH_1 계열 파일 있는지 확인 ====="
            sudo find "$P1" -maxdepth 1 -iname "CAH_1*.html" -o -iname "*_CAH_1.html" 2>/dev/null
            sudo find "$P1/images/ch" -maxdepth 1 -type d 2>/dev/null | head -15

            echo ""
            echo "===== [4] 현재 공용 배너 파일 재확인 ====="
            sudo stat "$P1/images/Live_height_kakao.gif" | grep Modify
            sudo sha256sum "$P1/images/Live_height_kakao.gif"
            REMOTE

      - name: CF 전체 purge + Playwright 스크린샷으로 실제 확인
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | python3 -m json.tool | head -5
          sleep 8

          echo "===== CAH_1.html 실제 응답 크기/헤더 확인 ====="
          DOM="xn--9d0bw2fjtyymch7de9d.info"
          curl -sS -I -H "Cache-Control: no-cache" "https://$DOM/photo/CAH_1.html?ch=cent&_=$(date +%s)"

          echo ""
          echo "===== Node + Playwright 설치 및 스크린샷 ====="
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

          cat > shot.js << 'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1400, height: 900 } });
            const url = 'https://xn--9d0bw2fjtyymch7de9d.info/photo/CAH_1.html?ch=cent&_=' + Date.now();
            console.log('Navigating to: ' + url);
            await page.goto(url, { waitUntil: 'networkidle', timeout: 30000 });
            await page.waitForTimeout(3000);
            await page.screenshot({ path: 'cah1_screenshot.png', fullPage: false });
            const imgInfo = await page.evaluate(() => {
              const img = document.querySelector('.kakao_banner img');
              if (!img) return { found: false };
              const rect = img.getBoundingClientRect();
              return {
                found: true,
                src: img.src,
                naturalWidth: img.naturalWidth,
                naturalHeight: img.naturalHeight,
                complete: img.complete,
                rect: { x: rect.x, y: rect.y, w: rect.width, h: rect.height },
                display: getComputedStyle(img).display,
                visibility: getComputedStyle(img).visibility,
                opacity: getComputedStyle(img).opacity
              };
            });
            console.log('IMG INFO:', JSON.stringify(imgInfo, null, 2));
            await browser.close();
          })();
          EOF
          node shot.js 2>&1

          echo ""
          echo "===== 스크린샷 파일 확인 ====="
          ls -la cah1_screenshot.png 2>&1
          echo "SCREENSHOT_BASE64_START"
          base64 -w0 cah1_screenshot.png 2>/dev/null | head -c 100
          echo ""
          echo "SCREENSHOT_BASE64_END (length below)"
          base64 -w0 cah1_screenshot.png 2>/dev/null | wc -c

      - name: 스크린샷 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: cah1-screenshot
          path: cah1_screenshot.png
          retention-days: 3
