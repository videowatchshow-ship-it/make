name: Server menu scan
on: workflow_dispatch
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH extract server HTML files
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "========== index.html.bak =========="
            FILE=/var/www/sites/gauth/public/index.html.bak
            echo "Size: $(wc -cl $FILE)"
            echo "--- menus/tabs/nav ---"
            grep -n -iE 'menu|tab-bar|nav-bar|sidebar|toggle|메뉴|탭|섹션' $FILE 2>/dev/null | head -30
            echo "--- buttons ---"
            grep -noE '<button[^>]*>[^<]*</button>' $FILE 2>/dev/null | head -30
            echo "--- h2/h3 ---"
            grep -n '<h[23]' $FILE 2>/dev/null | head -20

            echo ""
            echo "========== dashboard.html =========="
            for f in /opt/gauth-full/webroot/gauth/dashboard.html /opt/gauth-full/public/gauth/dashboard.html; do
              echo "--- $f ---"
              wc -cl "$f" 2>/dev/null
              grep -n -iE 'menu|tab|nav|toggle|메뉴|탭|섹션' "$f" 2>/dev/null | head -20
              grep -noE '<button[^>]*>[^<]*</button>' "$f" 2>/dev/null | head -20
              grep -n '<h[23]' "$f" 2>/dev/null | head -10
            done

            echo ""
            echo "========== sessions.html =========="
            for f in /opt/gauth-full/webroot/gauth/sessions.html /opt/gauth-full/public/gauth/sessions.html; do
              echo "--- $f ---"
              wc -cl "$f" 2>/dev/null
              grep -n -iE 'menu|tab|nav|toggle|메뉴|탭|섹션' "$f" 2>/dev/null | head -20
              grep -noE '<button[^>]*>[^<]*</button>' "$f" 2>/dev/null | head -20
            done

            echo ""
            echo "========== admin/index.html =========="
            f=/opt/gauth-full/webroot/admin/index.html
            wc -cl "$f" 2>/dev/null
            grep -n -iE 'menu|tab|nav|toggle|메뉴|탭|섹션' "$f" 2>/dev/null | head -20
            grep -noE '<button[^>]*>[^<]*</button>' "$f" 2>/dev/null | head -20

            echo ""
            echo "========== credential_manager.html =========="
            f=/opt/gauth-full/public/credential_manager.html
            wc -cl "$f" 2>/dev/null
            grep -n -iE 'menu|tab|nav|toggle|메뉴|탭|섹션' "$f" 2>/dev/null | head -20

            echo ""
            echo "========== real-browser.html =========="
            f=/opt/gauth-full/public/real-browser.html
            wc -cl "$f" 2>/dev/null
            grep -n -iE 'menu|tab|nav|toggle|메뉴|탭|섹션' "$f" 2>/dev/null | head -20

            echo ""
            echo "========== /tmp/gauth_index_fixed.html =========="
            f=/tmp/gauth_index_fixed.html
            wc -cl "$f" 2>/dev/null
            grep -n -iE 'menu|tab-bar|nav-bar|toggle|메뉴|탭|섹션' "$f" 2>/dev/null | head -30
            grep -noE '<button[^>]*>[^<]*</button>' "$f" 2>/dev/null | head -30

            echo ""
            echo "========== webroot/gauth/index.html =========="
            f=/opt/gauth-full/webroot/gauth/index.html
            wc -cl "$f" 2>/dev/null
            grep -n -iE 'menu|tab|nav|toggle|메뉴|탭|섹션' "$f" 2>/dev/null | head -20
            grep -noE '<button[^>]*>[^<]*</button>' "$f" 2>/dev/null | head -20
