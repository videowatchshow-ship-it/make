name: Server menu scan
on: workflow_dispatch
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dump live server files
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "===== LIVE INDEX.HTML TOP 200 LINES ====="
            head -200 /var/www/sites/gauth/public/index.html

            echo ""
            echo "===== LIVE INDEX.HTML LINE COUNT ====="
            wc -l /var/www/sites/gauth/public/index.html

            echo ""
            echo "===== ALL HTML FILES UNDER /var/www/sites/gauth/ ====="
            find /var/www/sites/gauth/ -name '*.html' -type f 2>/dev/null

            echo ""
            echo "===== ALL HTML FILES UNDER /opt/gauth-full/ ====="
            find /opt/gauth-full/ -name '*.html' -type f 2>/dev/null

            echo ""
            echo "===== DIFF: live vs git-deployed (md5) ====="
            md5sum /var/www/sites/gauth/public/index.html 2>/dev/null
            md5sum /opt/gauth-full/webroot/gauth/index.html 2>/dev/null
            md5sum /opt/gauth-full/public/gauth/dashboard.html 2>/dev/null

            echo ""
            echo "===== LIVE INDEX: ALL BUTTONS ====="
            grep -noE '<button[^>]*>[^<]*</button>' /var/www/sites/gauth/public/index.html 2>/dev/null

            echo ""
            echo "===== LIVE INDEX: ALL DIV IDs ====="
            grep -oE 'id="[^"]*"' /var/www/sites/gauth/public/index.html 2>/dev/null | sort -u

            echo ""
            echo "===== LIVE INDEX: ALL H2/H3 ====="
            grep -n '<h[23]' /var/www/sites/gauth/public/index.html 2>/dev/null

            echo ""
            echo "===== LIVE INDEX: LINES 550-650 (controls area) ====="
            sed -n '550,650p' /var/www/sites/gauth/public/index.html 2>/dev/null
