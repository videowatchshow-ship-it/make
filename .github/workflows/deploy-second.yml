name: Deploy second sub-site
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['sub-sites/second/**']

jobs:
  cf-token-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: CF token ops via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 120s
          script: |
            set -e
            CF_TOKEN=$(sudo grep -oP 'dns_cloudflare_api_token\s*=\s*\K\S+' /root/.secrets/cloudflare.ini 2>/dev/null | head -1)
            ZONE="2601d4f4ab75c910f8d858ca036ff344"
            SERVER_IP=$(curl -s ifconfig.me)
            echo "Server IP: $SERVER_IP"
            echo "Token prefix: ${CF_TOKEN:0:10}"
            echo ""
            echo "=== 1. LIST ALL TOKENS ==="
            curl -s "https://api.cloudflare.com/client/v4/user/tokens" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json"
            echo ""
            echo "=== 2. PERMISSION GROUPS ==="
            curl -s "https://api.cloudflare.com/client/v4/user/tokens/permission_groups" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" | head -c 5000
            echo ""
            echo "=== 3. CREATE DNS TOKEN ==="
            curl -s -X POST "https://api.cloudflare.com/client/v4/user/tokens" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" -d '{"name":"DNS-Edit-auto","policies":[{"effect":"allow","resources":{"com.cloudflare.api.account.zone.'"$ZONE"'":"*"},"permission_groups":[{"id":"4755a26eedb94da69e1066d98aa820be"}]}]}'
            echo ""
            echo "=== 4. DIRECT DNS CREATE ==="
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" -d '{"type":"A","name":"second","content":"'"$SERVER_IP"'","ttl":1,"proxied":true}'
            echo ""
            echo "=== DONE ==="
