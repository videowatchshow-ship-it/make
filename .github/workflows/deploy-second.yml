name: Deploy second sub-site
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['sub-sites/second/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          source: "sub-sites/second/server.js,sub-sites/second/public/index.html"
          target: "/tmp/second-deploy"
          strip_components: 2

      - name: Setup and start second sub-site
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 8m
          script: |
            SITE_DIR="/var/www/sites/second"
            echo "=== Deploying second sub-site ==="

            sudo mkdir -p "$SITE_DIR/public"
            sudo cp /tmp/second-deploy/server.js "$SITE_DIR/server.js"
            sudo cp /tmp/second-deploy/public/index.html "$SITE_DIR/public/index.html"
            rm -rf /tmp/second-deploy

            echo "=== Installing express if needed ==="
            cd "$SITE_DIR"
            if [ ! -d "node_modules/express" ]; then
              sudo npm init -y 2>/dev/null
              sudo npm install express --save 2>/dev/null
            fi

            echo "=== Creating systemd service ==="
            printf '[Unit]\nDescription=second sub-site\nAfter=network.target\n\n[Service]\nType=simple\nUser=root\nWorkingDirectory=/var/www/sites/second\nEnvironment=YOUTUBE_OAUTH_CLIENT_ID=\nEnvironmentFile=-/var/www/sites/second/.env\nExecStart=/usr/bin/node server.js\nRestart=always\nRestartSec=5\n\n[Install]\nWantedBy=multi-user.target\n' | sudo tee /etc/systemd/system/second.service > /dev/null

            sudo systemctl daemon-reload
            sudo systemctl enable second
            sudo systemctl restart second
            sleep 2
            systemctl is-active second && echo "=== second is running ===" || echo "=== second FAILED ==="
            curl -s --max-time 3 http://localhost:3023/api/second/accounts || echo "API not reachable yet"

            echo "=== Configuring Apache reverse proxy ==="
            sudo a2enmod proxy proxy_http ssl rewrite headers 2>/dev/null || true
            sudo a2dissite second second-le-ssl 2>/dev/null || true
            sudo rm -f /etc/apache2/sites-available/second.conf /etc/apache2/sites-available/second-le-ssl.conf /etc/apache2/sites-enabled/second.conf /etc/apache2/sites-enabled/second-le-ssl.conf
            printf '<VirtualHost *:80>\n    ServerName second.cent-solution.online\n    ProxyPreserveHost On\n    ProxyPass / http://127.0.0.1:3023/\n    ProxyPassReverse / http://127.0.0.1:3023/\n    Header always set X-Content-Type-Options "nosniff"\n    Header always set X-Frame-Options "SAMEORIGIN"\n</VirtualHost>\n' | sudo tee /etc/apache2/sites-available/second.conf > /dev/null
            sudo a2ensite second 2>/dev/null
            sudo apache2ctl configtest 2>&1 && sudo systemctl reload apache2 && echo "Apache configured (HTTP)" || echo "Apache config test failed"

            echo "=== Cloudflare DNS ==="
            CF_TOKEN=""
            CF_ZONE=""

            echo "--- Searching for CLOUDFLARE_TOKEN in targeted locations ---"

            for f in /opt/gauth-full/.env /var/www/sites/gauth/.env /root/.env /etc/default/gauth /etc/environment; do
              if [ -f "$f" ]; then
                T=$(sudo grep -oP '(?:CLOUDFLARE_TOKEN|CF_TOKEN)=\K\S+' "$f" 2>/dev/null | head -1)
                Z=$(sudo grep -oP '(?:CLOUDFLARE_ZONE_ID|CF_ZONE_ID)=\K\S+' "$f" 2>/dev/null | head -1)
                [ -n "$T" ] && CF_TOKEN="$T" && echo "Found token in $f"
                [ -n "$Z" ] && CF_ZONE="$Z" && echo "Found zone in $f"
              fi
            done

            echo "--- Checking systemd gauth service ---"
            for svc in gauth gauth-full; do
              SVC_FILE="/etc/systemd/system/${svc}.service"
              [ -f "$SVC_FILE" ] || continue
              echo "Found $SVC_FILE"
              T=$(sudo grep -oP '(?:CLOUDFLARE_TOKEN|CF_TOKEN)=\K\S+' "$SVC_FILE" 2>/dev/null | head -1)
              Z=$(sudo grep -oP '(?:CLOUDFLARE_ZONE_ID|CF_ZONE_ID)=\K\S+' "$SVC_FILE" 2>/dev/null | head -1)
              [ -n "$T" ] && CF_TOKEN="$T" && echo "Found token in $SVC_FILE"
              [ -n "$Z" ] && CF_ZONE="$Z" && echo "Found zone in $SVC_FILE"
              EF=$(sudo grep -oP 'EnvironmentFile[=-]+\K\S+' "$SVC_FILE" 2>/dev/null)
              if [ -n "$EF" ]; then
                EF_CLEAN=$(echo "$EF" | sed 's/^-//')
                if [ -f "$EF_CLEAN" ]; then
                  echo "Checking EnvironmentFile: $EF_CLEAN"
                  T=$(sudo grep -oP '(?:CLOUDFLARE_TOKEN|CF_TOKEN)=\K\S+' "$EF_CLEAN" 2>/dev/null | head -1)
                  Z=$(sudo grep -oP '(?:CLOUDFLARE_ZONE_ID|CF_ZONE_ID)=\K\S+' "$EF_CLEAN" 2>/dev/null | head -1)
                  [ -n "$T" ] && CF_TOKEN="$T" && echo "Found token in $EF_CLEAN"
                  [ -n "$Z" ] && CF_ZONE="$Z" && echo "Found zone in $EF_CLEAN"
                fi
              fi
            done

            echo "--- Checking gauth runtime environment ---"
            GAUTH_PID=$(pgrep -f 'rebrowser-login' | head -1)
            if [ -n "$GAUTH_PID" ]; then
              echo "gauth PID: $GAUTH_PID"
              T=$(sudo cat /proc/$GAUTH_PID/environ 2>/dev/null | tr '\0' '\n' | grep -oP 'CLOUDFLARE_TOKEN=\K.*' | head -1)
              Z=$(sudo cat /proc/$GAUTH_PID/environ 2>/dev/null | tr '\0' '\n' | grep -oP 'CLOUDFLARE_ZONE_ID=\K.*' | head -1)
              [ -n "$T" ] && CF_TOKEN="$T" && echo "Found token in gauth process env"
              [ -n "$Z" ] && CF_ZONE="$Z" && echo "Found zone in gauth process env"
            fi

            echo "--- List all .env files ---"
            sudo find /opt/gauth-full /var/www/sites /root -maxdepth 2 -name '.env' -o -name '*.env' 2>/dev/null | while read f; do
              echo "  .env: $f"
              sudo grep -iP 'CLOUDFLARE|CF_TOKEN|CF_ZONE' "$f" 2>/dev/null | head -3
            done

            echo "--- Checking certbot token permissions ---"
            CERTBOT_TOKEN=$(sudo grep -oP 'dns_cloudflare_api_token\s*=\s*\K\S+' /root/.secrets/cloudflare.ini 2>/dev/null)
            if [ -n "$CERTBOT_TOKEN" ] && [ -z "$CF_TOKEN" ]; then
              CF_TOKEN="$CERTBOT_TOKEN"
              echo "Using certbot token as fallback"
            fi

            if [ -n "$CF_TOKEN" ]; then
              echo "--- Token permissions check ---"
              PERMS=$(curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" \
                -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json")
              echo "Verify: $PERMS"

              if [ -z "$CF_ZONE" ]; then
                ZONE_RESP=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=cent-solution.online" \
                  -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json")
                CF_ZONE=$(echo "$ZONE_RESP" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{const j=JSON.parse(d);const r=j.result||[];console.log(r.length?r[0].id:"")}catch(e){console.log("")}})' 2>/dev/null)
              fi

              if [ -n "$CF_ZONE" ]; then
                echo "Zone: $CF_ZONE"
                EXISTING=$(curl -s "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/dns_records?name=second.cent-solution.online&type=A" \
                  -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json")
                COUNT=$(echo "$EXISTING" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{const j=JSON.parse(d);console.log((j.result||[]).length)}catch(e){console.log("0")}})' 2>/dev/null || echo "0")

                if [ "$COUNT" != "0" ]; then
                  echo "DNS A record already exists"
                else
                  SERVER_IP=$(curl -s ifconfig.me)
                  echo "Creating A record: second -> $SERVER_IP"
                  DNS_RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/dns_records" \
                    -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
                    --data "{\"type\":\"A\",\"name\":\"second\",\"content\":\"$SERVER_IP\",\"ttl\":1,\"proxied\":true}")
                  echo "DNS result: $DNS_RESULT"

                  DNS_OK=$(echo "$DNS_RESULT" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{console.log(JSON.parse(d).success)}catch(e){console.log("false")}})' 2>/dev/null)

                  if [ "$DNS_OK" != "true" ]; then
                    echo "--- Bearer failed, trying as TXT to test write permission ---"
                    TXT_TEST=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/dns_records" \
                      -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
                      --data "{\"type\":\"TXT\",\"name\":\"_test-second\",\"content\":\"test\",\"ttl\":1}")
                    echo "TXT test: $TXT_TEST"
                    TXT_OK=$(echo "$TXT_TEST" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{console.log(JSON.parse(d).success)}catch(e){console.log("false")}})' 2>/dev/null)
                    if [ "$TXT_OK" = "true" ]; then
                      echo "Token CAN create TXT but NOT A records - permission issue"
                      TXT_ID=$(echo "$TXT_TEST" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{console.log(JSON.parse(d).result.id)}catch(e){console.log("")}})' 2>/dev/null)
                      [ -n "$TXT_ID" ] && curl -s -X DELETE "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/dns_records/${TXT_ID}" \
                        -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" > /dev/null 2>&1
                    else
                      echo "Token cannot create any DNS records"
                    fi
                  fi
                fi
              fi
            else
              echo "No CF token found anywhere"
            fi

            echo "=== SSL via certbot dns-cloudflare ==="
            if [ ! -f /etc/letsencrypt/live/second.cent-solution.online/fullchain.pem ]; then
              if command -v certbot >/dev/null 2>&1 && [ -f /root/.secrets/cloudflare.ini ]; then
                echo "Running certbot dns-cloudflare..."
                sudo certbot certonly --dns-cloudflare --dns-cloudflare-credentials /root/.secrets/cloudflare.ini \
                  -d second.cent-solution.online --non-interactive --agree-tos --email videowatch.show@gmail.com 2>&1
                if [ -f /etc/letsencrypt/live/second.cent-solution.online/fullchain.pem ]; then
                  echo "SSL cert obtained!"
                  printf '<VirtualHost *:443>\n    ServerName second.cent-solution.online\n    SSLEngine on\n    SSLCertificateFile /etc/letsencrypt/live/second.cent-solution.online/fullchain.pem\n    SSLCertificateKeyFile /etc/letsencrypt/live/second.cent-solution.online/privkey.pem\n    ProxyPreserveHost On\n    ProxyPass / http://127.0.0.1:3023/\n    ProxyPassReverse / http://127.0.0.1:3023/\n    Header always set X-Content-Type-Options "nosniff"\n    Header always set X-Frame-Options "SAMEORIGIN"\n</VirtualHost>\n' | sudo tee /etc/apache2/sites-available/second-le-ssl.conf > /dev/null
                  sudo a2ensite second-le-ssl 2>/dev/null
                  sudo apache2ctl configtest 2>&1 && sudo systemctl reload apache2 && echo "Apache HTTPS configured"
                else
                  echo "Certbot failed"
                fi
              fi
            else
              echo "SSL cert already exists"
            fi

            echo "=== Deploy complete ==="
