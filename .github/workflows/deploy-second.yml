name: Deploy second sub-site
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['sub-sites/second/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          source: "sub-sites/second/server.js,sub-sites/second/public/index.html"
          target: "/tmp/second-deploy"
          strip_components: 2

      - name: Debug GitHub Secrets availability
        run: |
          echo "CLOUDFLARE_TOKEN length: ${#CF_TK}"
          echo "CLOUDFLARE_ZONE_ID length: ${#CF_ZN}"
          if [ -n "$CF_TK" ]; then echo "CLOUDFLARE_TOKEN is SET"; else echo "CLOUDFLARE_TOKEN is EMPTY"; fi
          if [ -n "$CF_ZN" ]; then echo "CLOUDFLARE_ZONE_ID is SET"; else echo "CLOUDFLARE_ZONE_ID is EMPTY"; fi
        env:
          CF_TK: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ZN: ${{ secrets.CLOUDFLARE_ZONE_ID }}

      - name: Setup server, DNS, SSL
        uses: appleboy/ssh-action@v1.0.3
        env:
          CF_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ZONE_SECRET: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 8m
          envs: CF_TOKEN_SECRET,CF_ZONE_SECRET
          script: |
            SITE_DIR="/var/www/sites/second"
            echo "=== Deploying second sub-site ==="

            sudo mkdir -p "$SITE_DIR/public"
            sudo cp /tmp/second-deploy/server.js "$SITE_DIR/server.js"
            sudo cp /tmp/second-deploy/public/index.html "$SITE_DIR/public/index.html"
            rm -rf /tmp/second-deploy

            echo "=== Setting YouTube OAuth in .env ==="
            echo "YOUTUBE_OAUTH_CLIENT_ID=623586529607-j8o758hs32rn669o2v6bsr02us1jn6rm.apps.googleusercontent.com" | sudo tee "$SITE_DIR/.env" > /dev/null
            echo ".env written"

            echo "=== Installing express if needed ==="
            cd "$SITE_DIR"
            if [ ! -d "node_modules/express" ]; then
              sudo npm init -y 2>/dev/null
              sudo npm install express --save 2>/dev/null
            fi

            echo "=== Creating systemd service ==="
            printf '[Unit]\nDescription=second sub-site\nAfter=network.target\n\n[Service]\nType=simple\nUser=root\nWorkingDirectory=/var/www/sites/second\nEnvironmentFile=-/var/www/sites/second/.env\nExecStart=/usr/bin/node server.js\nRestart=always\nRestartSec=5\n\n[Install]\nWantedBy=multi-user.target\n' | sudo tee /etc/systemd/system/second.service > /dev/null

            sudo systemctl daemon-reload
            sudo systemctl enable second
            sudo systemctl restart second
            sleep 2
            systemctl is-active second && echo "=== second is running ===" || echo "=== second FAILED ==="
            curl -s --max-time 3 http://localhost:3023/api/second/accounts || echo "API not reachable yet"

            echo "=== Configuring Apache reverse proxy ==="
            sudo a2enmod proxy proxy_http ssl rewrite headers 2>/dev/null || true
            sudo a2dissite second second-le-ssl 2>/dev/null || true
            sudo rm -f /etc/apache2/sites-available/second.conf /etc/apache2/sites-available/second-le-ssl.conf /etc/apache2/sites-enabled/second.conf /etc/apache2/sites-enabled/second-le-ssl.conf
            printf '<VirtualHost *:80>\n    ServerName second.cent-solution.online\n    ProxyPreserveHost On\n    ProxyPass / http://127.0.0.1:3023/\n    ProxyPassReverse / http://127.0.0.1:3023/\n    Header always set X-Content-Type-Options "nosniff"\n    Header always set X-Frame-Options "SAMEORIGIN"\n</VirtualHost>\n' | sudo tee /etc/apache2/sites-available/second.conf > /dev/null
            sudo a2ensite second 2>/dev/null
            sudo apache2ctl configtest 2>&1 && sudo systemctl reload apache2 && echo "Apache configured (HTTP)" || echo "Apache config test failed"

            echo "=== Cloudflare DNS ==="
            CF_TOKEN="${CF_TOKEN_SECRET}"
            CF_ZONE="${CF_ZONE_SECRET}"
            echo "CF_TOKEN_SECRET length: ${#CF_TOKEN}"
            echo "CF_ZONE_SECRET length: ${#CF_ZONE}"

            if [ -z "$CF_TOKEN" ]; then
              echo "GitHub secret CLOUDFLARE_TOKEN is empty, falling back to server token"
              CF_TOKEN=$(sudo cat /root/.secrets/cloudflare.ini 2>/dev/null | grep -oP 'dns_cloudflare_api_token\s*=\s*\K\S+' | head -1)
              echo "Server token length: ${#CF_TOKEN}"
            fi

            if [ -z "$CF_ZONE" ]; then
              CF_ZONE="2601d4f4ab75c910f8d858ca036ff344"
              echo "Using hardcoded zone ID"
            fi

            if [ -n "$CF_TOKEN" ]; then
              echo "=== Verifying token ==="
              VERIFY=$(curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" \
                -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json")
              echo "Verify: $VERIFY"

              echo "=== Checking existing DNS ==="
              EXISTING=$(curl -s "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/dns_records?name=second.cent-solution.online&type=A" \
                -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json")
              HAS_RECORD=$(echo "$EXISTING" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{console.log((JSON.parse(d).result||[]).length)}catch(e){console.log("0")}})' 2>/dev/null)
              echo "Existing records: $HAS_RECORD"

              if [ "$HAS_RECORD" = "0" ]; then
                SERVER_IP=$(curl -s ifconfig.me)
                echo "Creating DNS A record: second -> $SERVER_IP"
                DNS_RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/dns_records" \
                  -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
                  --data "{\"type\":\"A\",\"name\":\"second\",\"content\":\"$SERVER_IP\",\"ttl\":1,\"proxied\":true}")
                echo "DNS result: $DNS_RESULT"
              else
                echo "DNS record already exists"
              fi
            else
              echo "No CF token available, skipping DNS"
            fi

            echo "=== SSL certificate ==="
            if [ ! -f /etc/letsencrypt/live/second.cent-solution.online/fullchain.pem ]; then
              echo "Checking if second.cent-solution.online resolves..."
              RESOLVE=$(dig +short second.cent-solution.online 2>/dev/null || nslookup second.cent-solution.online 2>/dev/null | grep -oP 'Address:\s*\K[0-9.]+' | tail -1)
              echo "DNS resolve: $RESOLVE"
              if [ -n "$RESOLVE" ]; then
                echo "Domain resolves, trying certbot --apache (HTTP challenge)..."
                sudo certbot --apache -d second.cent-solution.online --non-interactive --agree-tos --email videowatch.show@gmail.com --redirect 2>&1 || echo "Certbot failed"
              else
                echo "Domain does not resolve yet, skipping SSL"
              fi
            else
              echo "SSL cert already exists"
            fi

            echo "=== DONE ==="
