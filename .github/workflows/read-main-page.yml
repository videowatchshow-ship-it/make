name: Read main page
on:
  push:
    branches: ['claude/broadcast-ip-check-z57wox']
    paths: ['.github/workflows/read-main-page.yml']

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read current index.html from server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "=== index.html size ==="
            wc -c /var/www/sites/gauth/public/index.html

            FILE=/var/www/sites/gauth/public/index.html

            echo "=== token still present? ==="
            grep -c '279c85fff45d' "$FILE"

            echo ""
            echo "=== getApiToken line ==="
            grep -n 'getApiToken' "$FILE" | head -3

            echo ""
            echo "=== curl page as browser ==="
            BODY=$(curl -sS https://gauth.cent-solution.online/)
            echo "Page size: $(echo "$BODY" | wc -c)"
            echo "Has token: $(echo "$BODY" | grep -c '279c85fff45d')"
            echo "getApiToken: $(echo "$BODY" | grep -o "getApiToken(){[^}]*}" | head -1)"

            echo ""
            echo "=== API test from browser perspective ==="
            TOKEN=$(echo "$BODY" | grep -oP "getApiToken\(\)\{return sessionStorage\.getItem\('gauth_token'\)\|\|'\K[^']+" || echo "NO_TOKEN")
            echo "Extracted token: ${TOKEN:0:20}..."
            curl -sS -o /dev/null -w "API HTTP %{http_code}" https://gauth.cent-solution.online/api/normalized-accounts -H "Authorization: Bearer $TOKEN"

            echo ""
            echo "=== check if gauth service rewrote file ==="
            ls -la --time=ctime "$FILE"
            sudo journalctl -u gauth --since "1 hour ago" --no-pager | tail -10
