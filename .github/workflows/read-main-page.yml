name: Read main page
on:
  push:
    branches: ['claude/broadcast-ip-check-z57wox']
    paths: ['.github/workflows/read-main-page.yml']

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read current index.html from server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "=== index.html size ==="
            wc -c /var/www/sites/gauth/public/index.html

            FILE=/var/www/sites/gauth/public/index.html

            echo "=== header section (line 530-560) ==="
            sed -n '530,560p' "$FILE"

            echo ""
            echo "=== type=hidden replacements ==="
            grep -n 'type="hidden"' "$FILE"

            echo ""
            echo "=== type=password ==="
            grep -n 'type="password"' "$FILE"

            echo ""
            echo "=== all links/anchors ==="
            grep -n '<a ' "$FILE" | head -20

            echo ""
            echo "=== accounts.html reference ==="
            grep -n 'accounts' "$FILE" | head -20

            echo ""
            echo "=== JS errors test ==="
            TOKEN=$(sudo grep -oP 'GAUTH_API_TOKEN=\K.*' /opt/gauth-full/.env)
            RESP=$(curl -sS http://localhost:4000/api/normalized-accounts -H "Authorization: Bearer $TOKEN")
            echo "$RESP" | head -c 500

            echo ""
            echo "=== data-old-placeholder count ==="
            grep -c 'data-old-placeholder' "$FILE"
