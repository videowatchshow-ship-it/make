name: Read main page
on:
  push:
    branches: ['claude/broadcast-ip-check-z57wox']
    paths: ['.github/workflows/read-main-page.yml']

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read current index.html from server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "=== index.html size ==="
            wc -c /var/www/sites/gauth/public/index.html

            echo "=== accounts.html on server ==="
            ls -la /var/www/sites/gauth/public/accounts.html 2>&1
            wc -c /var/www/sites/gauth/public/accounts.html 2>&1

            echo ""
            echo "=== accounts.html token ==="
            grep -o "getApiToken(){[^}]*}" /var/www/sites/gauth/public/accounts.html | head -1

            echo ""
            echo "=== curl accounts.html ==="
            curl -sS -o /dev/null -w "HTTP %{http_code}, size: %{size_download}" https://gauth.cent-solution.online/accounts.html

            echo ""
            echo "=== curl API with token ==="
            TOKEN=$(grep -oP "getApiToken\(\)\{return sessionStorage\.getItem\('gauth_token'\)\|\|'\K[^']+" /var/www/sites/gauth/public/accounts.html || echo "NONE")
            echo "Token: ${TOKEN:0:20}..."
            curl -sS -o /dev/null -w "normalized-accounts: HTTP %{http_code}\n" http://localhost:4000/api/normalized-accounts -H "Authorization: Bearer $TOKEN"
            curl -sS -o /dev/null -w "profiles: HTTP %{http_code}\n" http://localhost:4000/api/profiles -H "Authorization: Bearer $TOKEN"
            curl -sS -o /dev/null -w "subsite-accounts: HTTP %{http_code}\n" http://localhost:4000/api/subsite-accounts -H "Authorization: Bearer $TOKEN"

            echo ""
            echo "=== index.html nav menu ==="
            grep -c 'main-nav' /var/www/sites/gauth/public/index.html

            echo ""
            echo "=== status-bar element in accounts.html ==="
            grep -n 'status-bar' /var/www/sites/gauth/public/accounts.html
