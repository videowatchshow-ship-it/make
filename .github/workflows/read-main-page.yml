name: Read main page
on:
  push:
    branches: ['claude/broadcast-ip-check-z57wox']
    paths: ['.github/workflows/read-main-page.yml']

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read current index.html from server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "=== index.html size ==="
            wc -c /var/www/sites/gauth/public/index.html

            echo ""
            echo "=== getApiToken ==="
            grep -n 'getApiToken' /var/www/sites/gauth/public/index.html | head -5

            echo ""
            echo "=== menu/nav/tab ==="
            grep -n -i 'nav\|menu\|tab-btn\|header\|class="tabs"' /var/www/sites/gauth/public/index.html | head -30

            echo ""
            echo "=== API calls status ==="
            curl -sS -o /dev/null -w "HTTP %{http_code}" http://localhost:4000/api/accounts -H "Authorization: Bearer $(sudo grep -oP 'GAUTH_API_TOKEN=\K.*' /opt/gauth-full/.env)"

            echo ""
            echo "=== systemd gauth ==="
            sudo systemctl is-active gauth

            echo ""
            echo "=== head 100 ==="
            head -100 /var/www/sites/gauth/public/index.html
