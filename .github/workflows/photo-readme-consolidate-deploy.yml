name: photo README 통합 배포 (photo2/photo3 README 삭제 + 메인 README 갱신)
on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-readme-consolidate-deploy.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 90s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='bash -s' << "REMOTE"
            set +u
            P="/var/www/sites/chamgyo/public"
            TS=$(date +%s)

            echo "===== [1] 백업 (원본 보존, 삭제 아님) ====="
            timeout 5 sudo cp "$P/photo/README.md" "$P/photo/README.md.bak.$TS" 2>&1
            timeout 5 sudo cp "$P/photo2/README.md" "$P/photo2/README.md.bak.$TS" 2>&1
            timeout 5 sudo cp "$P/photo3/README.md" "$P/photo3/README.md.bak.$TS" 2>&1
            timeout 5 sudo ls -la "$P/photo/README.md.bak.$TS" "$P/photo2/README.md.bak.$TS" "$P/photo3/README.md.bak.$TS" 2>&1

            echo ""
            echo "===== [2] 새 통합 README.md 작성 (base64 디코드 후 저장) ====="
            echo "" | base64 -d | sudo tee "$P/photo/README.md" > /dev/null
            timeout 5 sudo chown www-data:www-data "$P/photo/README.md"
            timeout 5 sudo chmod 644 "$P/photo/README.md"

            echo ""
            echo "===== [3] photo2/photo3 README.md 삭제 (중복 문서 정리, 백업 이미 존재) ====="
            timeout 5 sudo rm -f "$P/photo2/README.md"
            timeout 5 sudo rm -f "$P/photo3/README.md"

            echo ""
            echo "===== [4] 검증: README.md 개수 (public 전체에서 photo* 하위, maxdepth 1) ====="
            timeout 8 sudo find "$P/photo" "$P/photo2" "$P/photo3" -maxdepth 1 -iname "README.md" 2>/dev/null

            echo ""
            echo "===== [5] 새 photo/README.md 크기 및 SHA256 ====="
            timeout 5 sudo ls -la "$P/photo/README.md" 2>&1
            timeout 5 sudo sha256sum "$P/photo/README.md" 2>&1

            echo ""
            echo "===== [6] 새 README.md 앞부분 확인 (__all__ 변경사항 반영 여부) ====="
            timeout 5 sudo head -10 "$P/photo/README.md" 2>&1
            echo "..."
            timeout 5 sudo grep -n "2026-08-20 변경\|11. 폴더 구조\|유일한 README" "$P/photo/README.md" 2>&1
            REMOTE
