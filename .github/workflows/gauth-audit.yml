name: gauth · full DB integrity audit

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-audit.txt']

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Full account audit
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 90s
          script: |
            sudo python3 - <<'PYEOF'
            import json, re
            DB = '/opt/gauth-full/accounts_normalized.json'
            d = json.load(open(DB, encoding='utf-8'))
            arr = d if isinstance(d, list) else d.get('accounts', [])
            n = len(arr)

            EMAIL   = re.compile(r'^[^@\s]+@[^@\s]+\.[^@\s]+$')
            APP_PW  = re.compile(r'^([a-z0-9]{4}\s+){3,}[a-z0-9]{4}$', re.I)
            YT_URL  = re.compile(r'(?:https?://)?(?:www\.|m\.)?(?:youtube\.com|youtu\.be)/', re.I)
            URL_ANY = re.compile(r'^https?://', re.I)
            TOTP_B32 = re.compile(r'^[A-Z2-7]{16,128}$')  # base32 secret
            OTP_CODE = re.compile(r'^\d{6}$')             # a 6-digit code, not a secret
            KO_ONLY = re.compile(r'^[가-힣\s]+$')
            MOJIBAKE_MARK = re.compile(r'[À-ÿ]{2,}')  # multi latin1 highchars in a row

            def has(v): return v is not None and str(v).strip() != ''

            buckets = {
              'email_missing_or_invalid': [],
              'password_missing': [],
              'password_is_korean_nickname': [],
              'password_is_a_url': [],
              'password_is_apppw_ok': [],
              'yturl_missing': [],
              'yturl_is_apppw_STILL_SWAPPED': [],
              'yturl_is_not_youtube': [],
              'totp_missing': [],
              'totp_invalid_format': [],
              'totp_is_6digit_code_not_secret': [],
              'source_file_mojibake_remaining': [],
              'duplicate_email': [],
            }
            seen_email = {}

            for a in arr:
                if not isinstance(a, dict): continue
                email = (a.get('email') or '').strip()
                pw    = (a.get('password') or '').strip()
                yurl  = (a.get('youtube_url') or '').strip()
                totp  = (a.get('totp_secret') or '').strip()
                sf    = (a.get('source_file') or '').strip()

                if not EMAIL.match(email):
                    buckets['email_missing_or_invalid'].append(email or '(empty)')
                else:
                    seen_email.setdefault(email.lower(), []).append(email)

                if not has(pw):
                    buckets['password_missing'].append(email)
                elif KO_ONLY.match(pw):
                    buckets['password_is_korean_nickname'].append(f'{email} ← {pw!r}')
                elif URL_ANY.match(pw):
                    buckets['password_is_a_url'].append(f'{email} ← {pw!r}')
                elif APP_PW.match(pw):
                    buckets['password_is_apppw_ok'].append(email)

                if not has(yurl):
                    buckets['yturl_missing'].append(email)
                elif APP_PW.match(yurl):
                    buckets['yturl_is_apppw_STILL_SWAPPED'].append(f'{email} ← {yurl!r}')
                elif not YT_URL.search(yurl):
                    buckets['yturl_is_not_youtube'].append(f'{email} ← {yurl!r}')

                if not has(totp):
                    buckets['totp_missing'].append(email)
                elif OTP_CODE.match(totp):
                    buckets['totp_is_6digit_code_not_secret'].append(f'{email} ← {totp!r}')
                elif not TOTP_B32.match(totp.upper().replace(' ','').replace('-','')):
                    buckets['totp_invalid_format'].append(f'{email} ← {totp!r}')

                if MOJIBAKE_MARK.search(sf):
                    buckets['source_file_mojibake_remaining'].append(f'{email} ← {sf!r}')

            for e, entries in seen_email.items():
                if len(entries) > 1:
                    buckets['duplicate_email'].append(f'{e} x{len(entries)}')

            print(f'total accounts: {n}')
            print('')
            print('=== bucket sizes ===')
            for k, v in buckets.items():
                print(f'  {k}: {len(v)}')
            print('')
            for k, v in buckets.items():
                if not v: continue
                print(f'\n--- {k} ({len(v)}) ---')
                for row in v[:25]:
                    print(f'  {row}')
                if len(v) > 25:
                    print(f'  … and {len(v)-25} more')
            PYEOF
