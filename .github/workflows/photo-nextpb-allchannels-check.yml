name: photo SNW_1.html 전체 채널(otuki/cent/jay/tak) 렌더링 확인
on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-nextpb-allchannels-check.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Playwright 설치
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: 채널별 렌더링 + 스크린샷
        run: |
          cat > shotall.js << 'EOF'
          const { chromium } = require('playwright');
          const channels = ['otuki', 'cent', 'jay', 'tak'];
          (async () => {
            const browser = await chromium.launch();
            for (const ch of channels) {
              const page = await browser.newPage({ viewport: { width: 1920, height: 1080 } });
              const errors = [];
              page.on('pageerror', e => errors.push('pageerror: ' + e.message));
              page.on('console', msg => { if (msg.type() === 'error') errors.push('console: ' + msg.text()); });
              try {
                await page.goto(`https://xn--9d0bw2fjtyymch7de9d.info/photo/SNW_1.html?ch=${ch}`, { waitUntil: 'domcontentloaded', timeout: 40000 });
                await page.waitForTimeout(4000);
                const info = await page.evaluate(() => {
                  function rectOf(id) {
                    const el = document.getElementById(id);
                    if (!el) return null;
                    const r = el.getBoundingClientRect();
                    return { x: r.x, y: r.y, w: r.width, h: r.height };
                  }
                  function topElementAtCenter(id) {
                    const el = document.getElementById(id);
                    if (!el) return 'NO_ELEMENT';
                    const r = el.getBoundingClientRect();
                    const cx = r.x + r.width / 2, cy = r.y + r.height / 2;
                    const top = document.elementFromPoint(cx, cy);
                    if (!top) return 'NOTHING_AT_POINT';
                    return top.id || top.className || top.tagName;
                  }
                  return {
                    cAskP: rectOf('cAskP'),
                    cAskB: rectOf('cAskB'),
                    topAtP: topElementAtCenter('cAskP'),
                    topAtB: topElementAtCenter('cAskB'),
                  };
                });
                console.log(`===== [${ch}] 실측 정보 =====`);
                console.log(JSON.stringify(info));
                console.log(`===== [${ch}] 에러 =====`);
                console.log(errors.length ? errors.join('\n') : '(없음)');
                const buf = await page.screenshot({ clip: { x: 950, y: 0, width: 970, height: 420 }, type: 'jpeg', quality: 65 });
                console.log(`===== [${ch}]_SHOT_START =====`);
                console.log(buf.toString('base64'));
                console.log(`===== [${ch}]_SHOT_END =====`);
              } catch (err) {
                console.log(`===== [${ch}] ERROR =====`);
                console.log(String(err));
              }
              await page.close();
            }
            await browser.close();
          })();
          EOF
          timeout 120 node shotall.js
