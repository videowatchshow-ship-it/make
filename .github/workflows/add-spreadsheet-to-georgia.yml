name: Add spreadsheet accounts to georgia
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths:
      - '.github/scripts/add-spreadsheet-to-georgia.sh'
      - '.github/workflows/add-spreadsheet-to-georgia.yml'
jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          source: ".github/scripts/add-spreadsheet-to-georgia.sh"
          target: "/tmp/geo-ss/"
          strip_components: 2
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            sudo bash /tmp/geo-ss/add-spreadsheet-to-georgia.sh
            rm -rf /tmp/geo-ss
