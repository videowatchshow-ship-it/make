name: Rename subsites (potential→poten, soktv→woodong2)
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths:
      - '.github/workflows/rename-subsites.yml'
      - '.github/scripts/rename-subsites.sh'

jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Cloudflare DNS create for new slugs (BEFORE certbot)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          [ -z "$CF_TOKEN" ] && exit 0
          ZONE=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=cent-solution.online&status=active" \
            -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
            | grep -oP '"id"\s*:\s*"\K[a-f0-9]{32}' | head -1)
          [ -z "$ZONE" ] && exit 0
          for site in poten woodong2; do
            EXISTS=$(curl -s "https://api.cloudflare.com/client/v4/zones/${ZONE}/dns_records?name=${site}.cent-solution.online" \
              -H "Authorization: Bearer ${CF_TOKEN}" | grep -oP '"id"\s*:\s*"\K[a-f0-9]{32}' | head -1)
            if [ -n "$EXISTS" ]; then echo "$site DNS exists"; continue; fi
            curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE}/dns_records" \
              -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
              --data "{\"type\":\"CNAME\",\"name\":\"${site}\",\"content\":\"cent-solution.online\",\"ttl\":1,\"proxied\":true}" \
              -o /dev/null -w "$site DNS create %{http_code}\n"
          done
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          source: ".github/scripts/rename-subsites.sh"
          target: "/tmp/renamesites/"
          strip_components: 2
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 480s
          script: |
            sudo bash /tmp/renamesites/rename-subsites.sh
            rm -rf /tmp/renamesites
      - name: Cloudflare DNS delete old + purge
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          [ -z "$CF_TOKEN" ] && exit 0
          ZONE=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=cent-solution.online&status=active" \
            -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
            | grep -oP '"id"\s*:\s*"\K[a-f0-9]{32}' | head -1)
          for old in potential soktv; do
            REC=$(curl -s "https://api.cloudflare.com/client/v4/zones/${ZONE}/dns_records?name=${old}.cent-solution.online" \
              -H "Authorization: Bearer ${CF_TOKEN}" | grep -oP '"id"\s*:\s*"\K[a-f0-9]{32}' | head -1)
            if [ -n "$REC" ]; then
              curl -sS -X DELETE "https://api.cloudflare.com/client/v4/zones/${ZONE}/dns_records/${REC}" \
                -H "Authorization: Bearer ${CF_TOKEN}" -o /dev/null -w "delete $old DNS %{http_code}\n"
            fi
          done
          curl -sS -o /dev/null -w "purge %{http_code}\n" -X POST \
            "https://api.cloudflare.com/client/v4/zones/${ZONE}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
