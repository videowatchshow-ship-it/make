name: photo SNW_1.html 에 Next.P/B 마크업 이식 (JS/CSS 는 이미 존재)
on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-add-nextpb-to-snw1.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: my-site-1 SNW_1.html 에 정확 문자열 매칭으로 마크업 삽입
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 3m
          script: |
            INNER=$(cat <<'INNEREOF'
            F=/var/www/sites/chamgyo/public/photo/SNW_1.html
            if [ ! -f "$F" ]; then
              echo "파일 없음: $F"
              sudo find /var/www/sites -maxdepth 4 -iname "SNW_1.html" 2>/dev/null
              exit 1
            fi
            sudo cp "$F" "${F}.bak_$(date +%s)"
            sudo python3 << 'PYEOF'
            path = "/var/www/sites/chamgyo/public/photo/SNW_1.html"
            with open(path, "r", encoding="utf-8") as f:
                content = f.read()
            anchor = '<div id="chamgyoBanner" style="position:absolute;left:980px;top:20px;width:920px;height:227px;background:#000;overflow:hidden;z-index:50;"><img id="chamgyoImg" src="" alt="" style="width:100%;height:100%;object-fit:contain;display:block;"></div>'
            if anchor not in content:
                print("ANCHOR_NOT_FOUND")
                raise SystemExit(1)
            if 'id="cAskP"' in content:
                print("ALREADY_HAS_NEXTPB_SKIP")
                raise SystemExit(0)
            insertion = '<div class="next_row" style="position:absolute;left:980px;top:267px;width:920px;height:104px;"><div class="pill"><span class="lbl p">Next.<span class="dot">●</span></span><canvas id="cAskP" width="236" height="68"></canvas></div><div class="pill"><span class="lbl b">Next.<span class="dot">●</span></span><canvas id="cAskB" width="236" height="68"></canvas></div></div>'
            new_content = content.replace(anchor, anchor + insertion, 1)
            with open(path, "w", encoding="utf-8") as f:
                f.write(new_content)
            print("PATCHED_OK")
            PYEOF
            sudo chown --reference="${F}.bak_"* "$F" 2>/dev/null || true
            echo "===== 패치 후 canvas 확인 ====="
            grep -oE '<canvas id="[^"]*"' "$F"
            INNEREOF
            )
            B64=$(printf '%s' "$INNER" | base64 -w0)
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command="echo $B64 | base64 -d | bash"

      - name: 라이브 실측 확인
        run: |
          sleep 3
          curl -sS "https://xn--9d0bw2fjtyymch7de9d.info/photo/SNW_1.html?ch=cent" | grep -oE '<canvas id="[^"]*"'
