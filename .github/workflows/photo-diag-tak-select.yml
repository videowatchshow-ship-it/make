name: Live_height_kakao.gif 원본 공용으로 즉시 원복 (12계정)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-diag-tak-select.yml'

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 120s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='bash -s' << "REMOTE"
            set -uo pipefail
            P1="/var/www/sites/chamgyo/public/photo"
            TS=$(date +%s)

            SRC="$P1/images/Live_height_kakao.gif"
            echo "===== [1] 원본 공용 이미지 정보 ====="
            sudo ls -la "$SRC"
            sudo file "$SRC"

            echo ""
            echo "===== [2] 12계정 Live_height_kakao.gif 원본으로 즉시 덮어쓰기 ====="
            ACCTS="aass0707 abc01 abc02 abc03 abc04 abc05 abc06 abc07 cent jay otuki tak"
            for U in $ACCTS; do
              DIR="$P1/images/ch/$U"
              if [ ! -d "$DIR" ]; then continue; fi
              # 지금 파일 백업 (검은 판때기)
              [ -f "$DIR/Live_height_kakao.gif" ] && sudo cp "$DIR/Live_height_kakao.gif" "$DIR/Live_height_kakao.gif.blackbak.$TS"
              # 원본으로 덮어쓰기
              sudo cp "$SRC" "$DIR/Live_height_kakao.gif"
              sudo chown www-data:www-data "$DIR/Live_height_kakao.gif"
              sudo chmod 644 "$DIR/Live_height_kakao.gif"
              SZ=$(sudo stat -c %s "$DIR/Live_height_kakao.gif")
              echo "  $U: 복구 완료 (${SZ}B)"
            done

            echo ""
            echo "===== [3] img_ver 타임스탬프 갱신 (즉시 브라우저 캐시 폭발) ====="
            for U in $ACCTS; do
              VF="$P1/data/img_ver_$U.json"
              sudo tee "$VF" > /dev/null << VJEOF
            {"Live_height_kakao.gif":$TS,"_all":$TS}
            VJEOF
              sudo chown www-data:www-data "$VF"
              sudo chmod 644 "$VF"
            done
            echo "  img_ver_*.json 12개 갱신 (ts=$TS)"

            echo ""
            echo "===== [4] gain 확인 (건드리지 말 것) ====="
            sudo ls -la "$P1/images/ch/gain/" | head -5

            echo ""
            echo "===== [5] https 실측 - 파일 크기 재확인 ====="
            DOM="xn--9d0bw2fjtyymch7de9d.info"
            for U in cent tak abc01 aass0707 gain; do
              SZ=$(curl -sSk --resolve "$DOM:443:127.0.0.1" -o /dev/null -w "%{size_download}" "https://$DOM/photo/images/ch/$U/Live_height_kakao.gif?v=$TS")
              printf "  %-10s | %sB\n" "$U" "$SZ"
            done

            echo ""
            echo "===== DONE ====="
            REMOTE
