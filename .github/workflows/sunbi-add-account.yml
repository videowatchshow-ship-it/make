name: Add account to sunbi
on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email to look up in gauth DB and add to sunbi'
        required: true
        default: 'dun23315@gmail.com'

jobs:
  add-account:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query gauth DB and add to sunbi
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 5m
          script: |
            EMAIL="${{ github.event.inputs.email }}"

            echo "=== STEP 1: Query account from gauth DB ==="
            ACCOUNT_JSON=$(node -e "
              const fs = require('fs');
              const d = JSON.parse(fs.readFileSync('/opt/gauth-full/accounts_normalized.json','utf8'));
              const accs = Array.isArray(d) ? d : (d.accounts || []);
              const t = accs.find(a => (a.email||'').toLowerCase() === '$EMAIL'.toLowerCase());
              if (!t) { console.log('NOT_FOUND'); process.exit(0); }
              console.log(JSON.stringify(t));
            ")

            if [ "$ACCOUNT_JSON" = "NOT_FOUND" ]; then
              echo "Account not found in gauth DB: $EMAIL"
              exit 1
            fi

            echo "Found account:"
            echo "$ACCOUNT_JSON" | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));console.log(JSON.stringify(d,null,2))"

            echo ""
            echo "=== STEP 2: Check sunbi site structure ==="
            SUNBI_DIR="/var/www/sites/sunbi/public"
            echo "Files in sunbi:"
            ls -la "$SUNBI_DIR/" 2>/dev/null || echo "Directory not found"
            echo ""

            # Check for data files
            echo "Data files:"
            find "$SUNBI_DIR" -name "*.json" -o -name "*.js" -o -name "*.html" 2>/dev/null | head -20
            echo ""

            # Check index.html for data structure hints
            if [ -f "$SUNBI_DIR/index.html" ]; then
              echo "=== index.html structure (first 100 lines) ==="
              head -100 "$SUNBI_DIR/index.html"
              echo ""
              echo "=== Looking for data/accounts references ==="
              grep -n -i "account\|data\|json\|email\|fetch\|api" "$SUNBI_DIR/index.html" | head -30
            fi

            # Check for any JS data files
            for f in $(find "$SUNBI_DIR" -name "*.json" 2>/dev/null); do
              echo "=== JSON file: $f ==="
              head -50 "$f"
              echo ""
            done

            for f in $(find "$SUNBI_DIR" -name "*.js" 2>/dev/null | grep -v node_modules); do
              echo "=== JS file: $f ==="
              head -50 "$f"
              echo ""
            done
