name: Add account to sunbi
on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email to add to sunbi'
        required: true
        default: 'dun23315@gmail.com'
      action:
        description: 'inspect (check server) or add (add account)'
        required: false
        default: 'inspect'

jobs:
  add-account:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect or add account to sunbi
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 5m
          script: |
            EMAIL="${{ github.event.inputs.email }}"
            ACTION="${{ github.event.inputs.action }}"

            if [ "$ACTION" = "inspect" ]; then
              echo "=== Checking rebrowser-login.js for sunbi routes ==="
              grep -n -i 'sunbi' /opt/gauth-full/rebrowser-login.js 2>/dev/null | head -50
              echo ""
              echo "=== Checking for sunbi data files ==="
              find /opt/gauth-full -name '*sunbi*' 2>/dev/null
              find /var/www/sites/sunbi -type f 2>/dev/null
              echo ""
              echo "=== Checking sunbi API route code ==="
              grep -n -A 20 'sunbi/accounts' /opt/gauth-full/rebrowser-login.js 2>/dev/null | head -60
              echo ""
              echo "=== Checking for sunbi allocation/assign logic ==="
              grep -n -A 10 'sunbi' /opt/gauth-full/rebrowser-login.js 2>/dev/null | head -100
              echo ""
              echo "=== Check if there is a sunbi JSON data file ==="
              ls -la /opt/gauth-full/sunbi* 2>/dev/null || echo "No sunbi files in /opt/gauth-full/"
              ls -la /opt/gauth-full/data/sunbi* 2>/dev/null || echo "No sunbi files in /opt/gauth-full/data/"
              echo ""
              echo "=== Test API endpoint ==="
              curl -s http://localhost:4000/api/sunbi/accounts 2>/dev/null | head -500
            fi

            if [ "$ACTION" = "add" ]; then
              echo "=== Adding $EMAIL to sunbi ==="
              # First get account data from gauth DB
              ACCOUNT_JSON=$(node -e "
                const fs = require('fs');
                const d = JSON.parse(fs.readFileSync('/opt/gauth-full/accounts_normalized.json','utf8'));
                const accs = Array.isArray(d) ? d : (d.accounts || []);
                const t = accs.find(a => (a.email||'').toLowerCase() === '$EMAIL'.toLowerCase());
                if (!t) { console.log('NOT_FOUND'); process.exit(0); }
                console.log(JSON.stringify(t));
              ")
              if [ "$ACCOUNT_JSON" = "NOT_FOUND" ]; then
                echo "Account not found in gauth DB: $EMAIL"
                exit 1
              fi
              echo "Account found: $ACCOUNT_JSON"
              echo ""
              # Try adding via API
              curl -s -X POST http://localhost:4000/api/sunbi/add \
                -H 'Content-Type: application/json' \
                -d "{\"email\":\"$EMAIL\"}" 2>/dev/null || echo "POST /api/sunbi/add failed"
              echo ""
              # Verify
              echo "=== Verify ==="
              curl -s http://localhost:4000/api/sunbi/accounts 2>/dev/null | node -e "
                const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
                const accs = d.accounts || d || [];
                const found = accs.find(a => (a.email||'').toLowerCase() === '$EMAIL'.toLowerCase());
                console.log(found ? 'FOUND in sunbi: ' + JSON.stringify(found, null, 2) : 'NOT in sunbi yet');
              " 2>/dev/null
            fi
