name: Add account to sunbi
on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email to add to sunbi'
        required: true
        default: 'dun23315@gmail.com'
      action:
        description: 'inspect or add'
        required: false
        default: 'inspect'

jobs:
  add-account:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sunbi operation
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 5m
          script: |
            EMAIL="${{ github.event.inputs.email }}"
            ACTION="${{ github.event.inputs.action }}"
            SUNBI_DIR="/var/www/sites/sunbi"

            if [ "$ACTION" = "inspect" ]; then
              echo "=== sunbi server.js ==="
              cat "$SUNBI_DIR/server.js"
              echo ""
              echo "=== sunbi accounts.json (first 100 lines) ==="
              sudo head -100 "$SUNBI_DIR/accounts.json" 2>/dev/null || echo "file not found"
              echo ""
              echo "=== sunbi accounts.json line count ==="
              sudo wc -l "$SUNBI_DIR/accounts.json" 2>/dev/null || echo "0"
              echo ""
              echo "=== Test sunbi API on port 3013 ==="
              curl -s http://localhost:3013/api/sunbi/accounts 2>/dev/null | head -200
              echo ""
              echo "=== systemctl status ==="
              systemctl status sunbi 2>/dev/null | head -20 || echo "no sunbi service"
              echo ""
              echo "=== pm2 list ==="
              pm2 list 2>/dev/null | grep -i sunbi || echo "not in pm2"
            fi

            if [ "$ACTION" = "add" ]; then
              echo "=== Getting account from gauth DB ==="
              ACCOUNT_JSON=$(node -e "
                const fs = require('fs');
                const d = JSON.parse(fs.readFileSync('/opt/gauth-full/accounts_normalized.json','utf8'));
                const accs = Array.isArray(d) ? d : (d.accounts || []);
                const t = accs.find(a => (a.email||'').toLowerCase() === process.argv[1].toLowerCase());
                if (!t) { console.log('NOT_FOUND'); process.exit(0); }
                console.log(JSON.stringify(t));
              " "$EMAIL")

              if [ "$ACCOUNT_JSON" = "NOT_FOUND" ]; then
                echo "Account not found: $EMAIL"
                exit 1
              fi
              echo "Found in gauth: $ACCOUNT_JSON"

              echo ""
              echo "=== Adding to sunbi accounts.json ==="
              echo "$ACCOUNT_JSON" > /tmp/sunbi_new_account.json

              sudo node -e "
                const fs = require('fs');
                const acctFile = '$SUNBI_DIR/accounts.json';
                let accounts = [];
                try { accounts = JSON.parse(fs.readFileSync(acctFile, 'utf8')); } catch(e) { console.log('Creating new file'); }
                if (!Array.isArray(accounts)) accounts = accounts.accounts || [];
                const newAcct = JSON.parse(fs.readFileSync('/tmp/sunbi_new_account.json', 'utf8'));
                const exists = accounts.find(a => (a.email||'').toLowerCase() === (newAcct.email||'').toLowerCase());
                if (exists) {
                  console.log('Already exists in sunbi, updating...');
                  Object.assign(exists, newAcct);
                } else {
                  console.log('Adding new account to sunbi...');
                  accounts.push(newAcct);
                }
                fs.writeFileSync(acctFile, JSON.stringify(accounts, null, 2));
                console.log('Done. Total accounts in sunbi:', accounts.length);
                console.log('Verify:', accounts.find(a => (a.email||'').toLowerCase() === (newAcct.email||'').toLowerCase()).email);
              "
              rm -f /tmp/sunbi_new_account.json

              echo ""
              echo "=== Restarting sunbi service ==="
              sudo systemctl restart sunbi 2>/dev/null || sudo pm2 restart sunbi 2>/dev/null || echo "No sunbi service manager found"
              sleep 2

              echo ""
              echo "=== Verify on sunbi API ==="
              curl -s http://localhost:3013/api/sunbi/accounts 2>/dev/null | node -e "
                let d = '';
                process.stdin.on('data', c => d += c);
                process.stdin.on('end', () => {
                  try {
                    const j = JSON.parse(d);
                    const accs = j.accounts || j || [];
                    const found = accs.find(a => (a.email||'').toLowerCase() === process.argv[1].toLowerCase());
                    console.log(found ? 'VERIFIED in sunbi API' : 'Not found in API - may need server restart');
                  } catch(e) { console.log('API parse error:', e.message); }
                });
              " "$EMAIL"
            fi
