name: photo/SNW_1.html 디자인을 photo2/SNW_1.html과 동일하게 복사
on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-copy-photo2-design.yml'
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: photo2/SNW_1.html 을 photo/SNW_1.html 에 그대로 복사 (백업 후)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 3m
          script: |
            INNER=$(cat <<'INNEREOF'
            SRC=/var/www/sites/chamgyo/public/photo2/SNW_1.html
            DST=/var/www/sites/chamgyo/public/photo/SNW_1.html
            if [ ! -f "$SRC" ]; then
              echo "원본 없음: $SRC"
              exit 1
            fi
            if [ ! -f "$DST" ]; then
              echo "대상 없음: $DST"
              exit 1
            fi
            echo "===== 복사 전 SHA256 ====="
            sha256sum "$SRC" "$DST"
            sudo cp "$DST" "${DST}.bak_$(date +%s)"
            sudo cp "$SRC" "$DST"
            sudo chown --reference="${DST}.bak_"* "$DST" 2>/dev/null || true
            echo "===== 복사 후 SHA256 (SRC와 DST 동일해야 정상) ====="
            sha256sum "$SRC" "$DST"
            INNEREOF
            )
            B64=$(printf '%s' "$INNER" | base64 -w0)
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command="echo $B64 | base64 -d | bash"

      - name: 라이브 실측 확인 (photo vs photo2 SHA256 동일한지)
        run: |
          sleep 3
          echo "===== photo (?ch=cent) ====="
          curl -sS "https://xn--9d0bw2fjtyymch7de9d.info/photo/SNW_1.html?ch=cent" -o /tmp/photo.html
          sha256sum /tmp/photo.html
          wc -c /tmp/photo.html
          echo "===== photo2 (?ch=cent) ====="
          curl -sS "https://xn--9d0bw2fjtyymch7de9d.info/photo2/SNW_1.html?ch=cent" -o /tmp/photo2.html
          sha256sum /tmp/photo2.html
          wc -c /tmp/photo2.html
