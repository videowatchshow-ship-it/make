name: Fix camstouch redirect vhost
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths:
      - '.github/workflows/find-ssl-cert-and-fix-vhosts.yml'
      - '.github/scripts/fix-camstouch-vhost.sh'

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Upload script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          source: ".github/scripts/fix-camstouch-vhost.sh"
          target: "/tmp/fix-vhost/"
          strip_components: 2
      - name: Run
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 180s
          script: |
            sudo bash /tmp/fix-vhost/fix-camstouch-vhost.sh
            rm -rf /tmp/fix-vhost
      - name: CF cache purge
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          [ -z "$CF_TOKEN" ] && exit 0
          ZONE=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=cent-solution.online&status=active" \
            -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
            | grep -oP '"id"\s*:\s*"\K[a-f0-9]{32}' | head -1)
          curl -sS -o /dev/null -w "purge %{http_code}\n" -X POST \
            "https://api.cloudflare.com/client/v4/zones/${ZONE}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
