name: verify client id

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-verify-cid.txt']

jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: check config
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 40s
          script: |
            sudo systemctl is-active gauth
            echo 'local config:'; curl -s --max-time 10 http://localhost:4000/api/auth/config; echo ''
            echo 'https config:'; curl -s --max-time 10 https://gauth.cent-solution.online/api/auth/config; echo ''
            echo 'expect suffix 30t6q00h...'
