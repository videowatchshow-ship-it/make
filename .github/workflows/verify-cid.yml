name: verify client id

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-verify-cid.txt']

jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: check /api/auth/config client_id
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 40s
          script: |
            echo 'live /api/auth/config:'
            curl -s --max-time 10 http://localhost:4000/api/auth/config
            echo ''
            echo 'client_id used by front (from HTML widget, if any):'
            curl -s --max-time 10 https://gauth.cent-solution.online/ | grep -oE '956283750273-[a-z0-9]+\.apps\.googleusercontent\.com' | sort -u | head
            echo 'gsi-rt widget present:'
            curl -s --max-time 10 https://gauth.cent-solution.online/ | grep -c 'gsi-rt start' || echo 0
