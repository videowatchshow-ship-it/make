name: Restore cham + diagnose API HTML response

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-restore-cham.txt']

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ship URL list
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          source: ".github/smm-urls.txt"
          target: "/tmp"
          strip_components: 1
      - name: Restore cham + diag
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 120s
          script: |
            set -e
            echo "=== 1. gauth service status ==="
            sudo systemctl is-active gauth || true
            sudo systemctl status gauth --no-pager -l | tail -15 || true
            echo ""
            echo "=== 2. probe /api endpoints directly on Express :4000 ==="
            curl -s -o /tmp/counts.out -w "counts status=%{http_code} type=%{content_type} size=%{size_download}\n" http://127.0.0.1:4000/api/subsite-counts --max-time 5
            head -c 200 /tmp/counts.out; echo
            curl -s -o /tmp/accts.out -w "accts  status=%{http_code} type=%{content_type} size=%{size_download}\n" http://127.0.0.1:4000/api/subsite-accounts --max-time 5
            head -c 200 /tmp/accts.out; echo
            echo ""
            echo "=== 3. probe through jump vhost ==="
            curl -sk -o /tmp/j.out -w "jump counts status=%{http_code} type=%{content_type}\n" https://jump.cent-solution.online/api/subsite-counts --max-time 5
            head -c 200 /tmp/j.out; echo
            curl -sk -o /tmp/j2.out -w "jump accts  status=%{http_code} type=%{content_type}\n" https://jump.cent-solution.online/api/subsite-accounts --max-time 5
            head -c 200 /tmp/j2.out; echo
            echo ""
            echo "=== 4. restore cham/accounts.json with 17 matched gmails from master ==="
            sudo python3 - <<'PYEOF'
            import json, os, re, urllib.parse, time, shutil
            URLS_FILE = "/tmp/smm-urls.txt"
            MASTER = "/opt/gauth-full/accounts_normalized.json"
            CHAM = "/var/www/sites/cham/accounts.json"
            def norm(u):
                if not u: return ""
                u = urllib.parse.unquote(u.strip())
                u = re.sub(r'^https?://', '', u, flags=re.I).rstrip('/')
                u = re.sub(r'^www\.', '', u, flags=re.I)
                u = u.split('?')[0].split('|')[0]
                u = re.sub(r'/(videos|featured|about|shorts|streams|community)$', '', u, flags=re.I)
                return u.lower()
            wanted=set(); wh=set(); wc=set()
            for L in open(URLS_FILE):
                n = norm(L.strip())
                if not n: continue
                wanted.add(n)
                m = re.search(r'youtube\.com/@([^/]+)', n)
                if m: wh.add(m.group(1).lower())
                m = re.search(r'youtube\.com/channel/([^/|]+)', n)
                if m: wc.add(m.group(1).lower())
            def matches(y):
                n = norm(y)
                if not n: return False
                if n in wanted: return True
                m = re.search(r'youtube\.com/@([^/]+)', n)
                if m and m.group(1).lower() in wh: return True
                m = re.search(r'youtube\.com/channel/([^/|]+)', n)
                if m and m.group(1).lower() in wc: return True
                return False
            master = json.load(open(MASTER, encoding='utf-8'))
            arr = master if isinstance(master, list) else master.get('accounts', [])
            picks = []; seen=set()
            for a in arr:
                if not isinstance(a, dict): continue
                e = (a.get('email') or a.get('gmail') or '').strip().lower()
                if not e.endswith('@gmail.com'): continue
                if e in seen: continue
                if not matches(a.get('youtube_url') or a.get('youtube') or a.get('channel_url') or ''): continue
                seen.add(e); picks.append(a)
            if os.path.exists(CHAM):
                shutil.copy(CHAM, CHAM + f'.bak.{int(time.time())}')
            with open(CHAM, 'w', encoding='utf-8') as fh:
                json.dump(picks, fh, ensure_ascii=False, indent=2)
            print(f"cham restored: {len(picks)} accounts")
            PYEOF
            echo ""
            echo "=== 5. verify cham count ==="
            sudo python3 -c "import json; print('cham accounts.json has', len(json.load(open('/var/www/sites/cham/accounts.json'))), 'entries')"
            echo ""
            echo "=== 6. if API returned HTML above, restart gauth + retry ==="
            sudo systemctl restart gauth
            sleep 3
            sudo systemctl is-active gauth
            curl -s -o /tmp/counts2.out -w "after restart counts status=%{http_code} type=%{content_type}\n" http://127.0.0.1:4000/api/subsite-counts --max-time 5
            head -c 300 /tmp/counts2.out; echo
