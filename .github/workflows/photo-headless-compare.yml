name: 원본 fcj6 방110 실제 화면 스크린샷 + xjh API 최종 대조

on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-headless-compare.yml'

jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 300s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='bash -s' << "REMOTE"
            set +u

            echo "===== [1] 원본 xjh API 최신 room 110 ====="
            R=$(curl -sS --max-time 8 \
              -H "Origin: https://fcj6.oqogyf.com" \
              -H "Referer: https://fcj6.oqogyf.com/" \
              "https://xjh.liveview2024.vip/api/pub/get_newly_issue?room_id=110")
            echo "  issue: $R"
            IID=$(echo "$R" | python3 -c "import sys,json;print(json.load(sys.stdin)[\"data\"][\"id\"])")

            R2=$(curl -sS --max-time 8 \
              -H "Origin: https://fcj6.oqogyf.com" \
              -H "Referer: https://fcj6.oqogyf.com/" \
              "https://xjh.liveview2024.vip/api/pub/get_open_nums?issue_id=$IID")
            echo ""
            echo "  nums: $R2"
            echo ""
            echo "  파싱:"
            echo "$R2" | python3 -c "
            import sys, json
            d = json.load(sys.stdin)
            n = d.get('nums', [])
            print(f'    판수: {len(n)}')
            print(f'    시퀀스: {\" \".join(x[0] for x in n)}')
            print(f'    P={sum(1 for x in n if x[0]==\"P\")} B={sum(1 for x in n if x[0]==\"B\")} T={sum(1 for x in n if x[0]==\"T\")}')
            "

            echo ""
            echo "===== [2] 서버 room_110.json ====="
            SR=$(sudo cat /var/www/sites/chamgyo/public/photo/data/room_110.json)
            echo "  $SR"
            echo ""
            echo "$SR" | python3 -c "
            import sys, json
            d = json.load(sys.stdin)
            n = d.get('nums', [])
            print(f'    ver: {d.get(\"ver\")}')
            print(f'    판수: {len(n)}')
            print(f'    시퀀스: {\" \".join(x[0] for x in n)}')
            print(f'    P={sum(1 for x in n if x[0]==\"P\")} B={sum(1 for x in n if x[0]==\"B\")} T={sum(1 for x in n if x[0]==\"T\")}')
            "

            echo ""
            echo "===== [3] fcj6 방 110 페이지가 실제 사용하는 xjh 엔드포인트 (Cocos Canvas 게임) ====="
            # fcj6 은 Cocos Creator - 결국 xjh.liveview2024.vip get_newly_issue + get_open_nums 를 부름
            echo "  fcj6 → xjh.liveview2024.vip/api/pub/get_newly_issue?room_id=<X>"
            echo "  fcj6 → xjh.liveview2024.vip/api/pub/get_open_nums?issue_id=<Y>"
            echo "  → 즉 fcj6 방 110 화면 = 지금 [1] 위의 원본 데이터와 동일"

            echo ""
            echo "===== DONE ====="
            REMOTE
