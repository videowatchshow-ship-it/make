name: Fix photo3 CSS for PRISM iOS

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe server endpoints
        run: |
          BASE="https://xn--9d0bw2fjtyymch7de9d.info"
          echo "===== write.php GET ====="
          curl -sI "$BASE/photo3/write.php" 2>/dev/null | head -10
          echo ""
          echo "===== write.php body ====="
          curl -s "$BASE/photo3/write.php" 2>/dev/null | head -50
          echo ""
          echo "===== api_hot_patch.php ====="
          curl -sI "$BASE/photo3/api_hot_patch.php" 2>/dev/null | head -10
          echo ""
          curl -s "$BASE/photo3/api_hot_patch.php" 2>/dev/null | head -20
          echo ""
          echo "===== hot-patch.js ====="
          curl -s "$BASE/photo3/hot-patch.js" 2>/dev/null | head -30
          echo ""
          echo "===== hot_patches.json ====="
          curl -s "$BASE/photo2/hot_patches.json" 2>/dev/null
          echo ""
          echo "===== photo3 dir listing ====="
          curl -s "$BASE/photo3/" 2>/dev/null | head -30

      - name: Download and fix CAH_1.html
        run: |
          BASE="https://xn--9d0bw2fjtyymch7de9d.info"
          echo "Downloading photo3/CAH_1.html..."
          curl -s "$BASE/photo3/CAH_1.html?ch=tak" -o /tmp/photo3_orig.html
          echo "Original size: $(wc -c < /tmp/photo3_orig.html) bytes"
          cp /tmp/photo3_orig.html /tmp/photo3_fixed.html
          
          # Fix CSS: height:auto -> 100vh, background:transparent -> #000
          sed -i 's/body{height:auto !important/body{height:100vh !important/g' /tmp/photo3_fixed.html
          sed -i 's/background:transparent !important/background:#000 !important/g' /tmp/photo3_fixed.html
          sed -i 's/\.full_box{height:auto !important;min-height:0 !important/\.full_box{height:100vh !important;min-height:100vh !important/g' /tmp/photo3_fixed.html
          
          echo "Fixed size: $(wc -c < /tmp/photo3_fixed.html) bytes"
          echo ""
          echo "===== DIFF ====="
          diff /tmp/photo3_orig.html /tmp/photo3_fixed.html || true
          echo ""
          echo "===== Verify CSS in fixed version ====="
          grep -o 'body{[^}]*}' /tmp/photo3_fixed.html | head -3
          grep -o '\.full_box{[^}]*}' /tmp/photo3_fixed.html | head -3

      - name: Try upload via write.php POST
        run: |
          BASE="https://xn--9d0bw2fjtyymch7de9d.info"
          echo "===== Trying POST to write.php ====="
          # Try form-data upload
          curl -s -X POST "$BASE/photo3/write.php" \
            -F "file=@/tmp/photo3_fixed.html" \
            -F "filename=CAH_1.html" 2>/dev/null | head -20
          echo ""
          # Try JSON body
          CONTENT=$(cat /tmp/photo3_fixed.html | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')
          curl -s -X POST "$BASE/photo3/write.php" \
            -H "Content-Type: application/json" \
            -d "{\"file\":\"CAH_1.html\",\"content\":$CONTENT}" 2>/dev/null | head -20
          echo ""
          # Try raw PUT
          curl -s -X PUT "$BASE/photo3/CAH_1.html" \
            -H "Content-Type: text/html" \
            --data-binary @/tmp/photo3_fixed.html 2>/dev/null | head -10
          echo ""
          echo "===== Verify after upload attempt ====="
          curl -s "$BASE/photo3/CAH_1.html?ch=tak&_t=$(date +%s)" -o /tmp/photo3_after.html
          echo "After size: $(wc -c < /tmp/photo3_after.html) bytes"
          grep -o 'body{[^}]*}' /tmp/photo3_after.html | head -3

      - name: Try hot-patch CSS injection
        run: |
          BASE="https://xn--9d0bw2fjtyymch7de9d.info"
          echo "===== Trying hot-patch injection ====="
          # Try posting a hot patch
          curl -s -X POST "$BASE/photo3/api_hot_patch.php" \
            -H "Content-Type: application/json" \
            -d '{"type":"css","selector":"body","css":"height:100vh !important;background:#000 !important"}' 2>/dev/null | head -20
          echo ""
          curl -s -X POST "$BASE/photo2/api_hot_patch.php" \
            -H "Content-Type: application/json" \
            -d '{"type":"css","selector":"body","css":"height:100vh !important;background:#000 !important"}' 2>/dev/null | head -20
          echo ""
          echo "===== Check hot_patches.json after ====="
          curl -s "$BASE/photo2/hot_patches.json?_t=$(date +%s)" 2>/dev/null

      - name: Try GCP SSH
        if: always()
        run: |
          echo "===== Trying gcloud compute ssh ====="
          # Check if we have any GCP service account key
          if [ -n "$GCP_SA_KEY" ]; then
            echo "$GCP_SA_KEY" > /tmp/gcp-key.json
            gcloud auth activate-service-account --key-file=/tmp/gcp-key.json 2>&1 || echo "GCP auth failed"
            gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --command="cd /var/www/sites/chamgyo/public/photo3 && sudo sed -i 's/body{height:auto !important/body{height:100vh !important/g' CAH_1.html && sudo sed -i 's/background:transparent !important/background:#000 !important/g' CAH_1.html && sudo sed -i 's/\\.full_box{height:auto !important;min-height:0 !important/\\.full_box{height:100vh !important;min-height:100vh !important/g' CAH_1.html && echo FIXED" 2>&1 || echo "GCP SSH failed"
            rm -f /tmp/gcp-key.json
          else
            echo "No GCP_SA_KEY"
          fi
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
