name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exhaustive date search in archived excel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 90s
          script: |
            sudo node -e "
            const XLSX = require('/opt/gauth-full/node_modules/xlsx');
            const fs = require('fs');
            const dir = '/opt/gauth-full/uploads/archive';
            const files = fs.readdirSync(dir).filter(f=>f.toLowerCase().endsWith('.xlsx'));
            console.log('files:', files);
            for (const fname of files) {
              const fp = dir + '/' + fname;
              console.log('');
              console.log('===== FILE:', fname, '=====');
              const wb = XLSX.readFile(fp, {cellDates:true, bookProps:true});
              console.log('--- Workbook Props (core.xml metadata) ---');
              console.log(JSON.stringify(wb.Props, null, 2));
              console.log('--- Custom Props ---');
              console.log(JSON.stringify(wb.Custprops || {}, null, 2));
              console.log('--- Sheet names ---');
              console.log(wb.SheetNames);
              for (const sn of wb.SheetNames) {
                const sh = wb.Sheets[sn];
                console.log('--- Sheet:', sn, 'range:', sh['!ref'], '---');
                const rows = XLSX.utils.sheet_to_json(sh, {header:1, raw:true, defval:''});
                console.log('total rows:', rows.length);
                console.log('first 3 rows:', JSON.stringify(rows.slice(0,3)));
                console.log('last 3 rows:', JSON.stringify(rows.slice(-3)));
                for (let r=0;r<Math.min(rows.length,30);r++){
                  for (let c=0;c<(rows[r]||[]).length;c++){
                    const v = rows[r][c];
                    if (v && typeof v === 'number' && v>=36526 && v<=54789) {
                      console.log('  DATE-LIKE at row', r, 'col', c, ':', v, '=', new Date((v-25569)*86400000).toISOString());
                    }
                    if (v && typeof v === 'string' && /\d{1,2}[.\/월]\s*\d{0,2}/.test(v) && v.length<20) {
                      console.log('  KOREAN-DATE-LIKE at row', r, 'col', c, ':', JSON.stringify(v));
                    }
                  }
                }
              }
            }
            " 2>&1
            echo "=== DONE ==="
