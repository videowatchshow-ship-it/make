name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify current state
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== account_date stats now ==="
            sudo node -e "
            const d=JSON.parse(require('fs').readFileSync('/opt/gauth-full/accounts_normalized.json','utf8'));
            const arr=Array.isArray(d)?d:(d.accounts||[]);
            console.log('total:', arr.length);
            console.log('with account_date:', arr.filter(a=>a.account_date).length);
            console.log('without account_date:', arr.filter(a=>!a.account_date).length);
            " 2>&1
            echo ""
            echo "=== systemctl + health ==="
            sudo systemctl is-active gauth
            curl -s -o /dev/null -w 'health: %{http_code}\n' http://localhost:4000/api/normalized-accounts
            echo "=== DONE ==="
