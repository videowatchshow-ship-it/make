name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check whether CLOUDFLARE_TOKEN / CLOUDFLARE_ZONE_ID secrets are actually set (lengths only)
        run: |
          echo "CLOUDFLARE_TOKEN length: ${#CF_TOKEN}"
          echo "CLOUDFLARE_ZONE_ID length: ${#CF_ZONE}"
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}

  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find what got globally-installed / misplaced under chamgyo photo folders
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== locate the chamgyo site root ==="
            sudo find /var/www/sites -maxdepth 3 -iname "*chamgyo*" -o -iname "*photo*" 2>/dev/null
            echo ""
            echo "=== photo / photo2 / photo3 top-level listing ==="
            for d in /var/www/sites/chamgyo/public/photo /var/www/sites/chamgyo/public/photo2 /var/www/sites/chamgyo/public/photo3; do
              echo "--- $d ---"
              ls -la "$d" 2>/dev/null || echo "(not found)"
            done
            echo ""
            echo "=== anything recently modified (last 2 days) under chamgyo public/ ==="
            sudo find /var/www/sites/chamgyo/public -maxdepth 4 -mtime -2 -printf '%T@ %p\n' 2>/dev/null | sort -n | tail -50
            echo ""
            echo "=== any node_modules or global-looking installs misplaced under photo dirs ==="
            sudo find /var/www/sites/chamgyo/public -iname "node_modules" -o -iname "package.json" 2>/dev/null
