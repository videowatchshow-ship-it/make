name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
    inputs:
      cf_token:
        description: 'one-time cloudflare token, not stored in repo'
        required: false
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check whether CLOUDFLARE_TOKEN / CLOUDFLARE_ZONE_ID secrets are actually set (lengths only)
        run: |
          echo "CLOUDFLARE_TOKEN length: ${#CF_TOKEN}"
          echo "CLOUDFLARE_ZONE_ID length: ${#CF_ZONE}"
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}

  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Strip login/action proxy endpoints from jump - display mirror only, gauth stays the only login/API surface
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            set -e
            echo "=== current jump.conf before edit ==="
            sudo cat /etc/apache2/sites-available/jump.conf

            echo "=== remove /codes /tok /totp proxy blocks (action/credential endpoints) - keep /api (needed for the account list display) ==="
            sudo python3 -c "
            import re
            content = open('/etc/apache2/sites-available/jump.conf').read()
            for path in ['codes', 'tok', 'totp']:
                content = re.sub(r'^\s*ProxyPass(Reverse)? /' + path + r'/?\s+http://127\.0\.0\.1:4000/' + path + r'/?\s*\n', '', content, flags=re.MULTILINE)
            open('/tmp/jump_display_only.conf', 'w').write(content)
            "
            echo "--- new jump.conf (display-only) ---"
            sudo cat /tmp/jump_display_only.conf

            sudo cp /tmp/jump_display_only.conf /etc/apache2/sites-available/jump.conf
            sudo apache2ctl configtest
            sudo systemctl reload apache2
            echo "jump.cent-solution.online is now display-only: /api stays (for the account list), /codes /tok /totp removed (login/action stays gauth-only)"

            echo "=== verify jump still serves the page, and that /totp is now blocked ==="
            curl -s -o /dev/null -w "jump / -> %{http_code}\n" https://jump.cent-solution.online/
            curl -s -o /dev/null -w "jump /totp -> %{http_code} (should NOT be 200 proxied)\n" https://jump.cent-solution.online/totp
