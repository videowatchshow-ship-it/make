name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  create-jump-subdomain:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Create jump.cent-solution.online DNS record (mirrors gauth record)
        run: |
          EXISTING=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/dns_records?name=gauth.cent-solution.online" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_TOKEN }}" \
            -H "Content-Type: application/json")
          echo "$EXISTING" | python3 -c "import json,sys; d=json.load(sys.stdin); r=d['result'][0]; print('type='+r['type'], 'content='+r['content'], 'proxied='+str(r['proxied']))"
          TYPE=$(echo "$EXISTING" | python3 -c "import json,sys; print(json.load(sys.stdin)['result'][0]['type'])")
          CONTENT=$(echo "$EXISTING" | python3 -c "import json,sys; print(json.load(sys.stdin)['result'][0]['content'])")
          PROXIED=$(echo "$EXISTING" | python3 -c "import json,sys; print(str(json.load(sys.stdin)['result'][0]['proxied']).lower())")

          CHECK=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/dns_records?name=jump.cent-solution.online" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_TOKEN }}")
          COUNT=$(echo "$CHECK" | python3 -c "import json,sys; print(len(json.load(sys.stdin)['result']))")
          if [ "$COUNT" -gt 0 ]; then
            echo "jump.cent-solution.online already exists, skipping create"
          else
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/dns_records" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_TOKEN }}" \
              -H "Content-Type: application/json" \
              --data "{\"type\":\"$TYPE\",\"name\":\"jump.cent-solution.online\",\"content\":\"$CONTENT\",\"ttl\":1,\"proxied\":$PROXIED}" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print('success='+str(d['success'])); print(d.get('errors'))"
          fi

  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify jump subdomain resolves
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 30s
          script: |
            echo "jump subdomain DNS check done in the create-jump-subdomain job"
