name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Full mojibake sweep across every field including raw_values
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            sudo node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('/opt/gauth-full/accounts_normalized.json','utf8'));
            const arr = Array.isArray(d) ? d : (d.accounts||[]);
            console.log('total accounts:', arr.length);

            // mojibake signatures: UTF-8 bytes misread as Latin-1/CP1252 (Ã.., â.., ì.., ê..),
            // or URL-percent-encoding leftovers (%XX), or the literal replacement char.
            const isMojibake = s => /[�]|Ã[\x80-\xBF]|â[\x80-\xBF]{2}|ì[\x80-\xBF]|ê[\x80-\xBF]|%[0-9A-Fa-f]{2}/.test(s);

            let totalHits = 0;
            const byField = {};
            const bySourceFile = {};
            const samples = [];

            function scanValue(f, v, sourceFile) {
              if (v === undefined || v === null) return;
              const s = String(v);
              if (isMojibake(s)) {
                totalHits++;
                byField[f] = (byField[f]||0) + 1;
                bySourceFile[sourceFile] = (bySourceFile[sourceFile]||0) + 1;
                if (samples.length < 20) samples.push({field:f, source_file: sourceFile, sample: s.slice(0,50)});
              }
            }

            arr.forEach(a => {
              Object.keys(a).forEach(f => {
                if (f === 'raw_values' && a[f] && typeof a[f] === 'object') {
                  Object.keys(a[f]).forEach(rk => scanValue('raw_values.'+rk, a[f][rk], a.source_file));
                } else {
                  scanValue(f, a[f], a.source_file);
                }
              });
            });

            console.log('');
            console.log('=== TOTAL mojibake/broken-encoding hits across ALL fields:', totalHits, '===');
            console.log('by field:', JSON.stringify(byField));
            console.log('by source_file:', JSON.stringify(bySourceFile));
            console.log('');
            console.log('=== sample (up to 20, non-PII fields only shown truncated) ===');
            samples.forEach(x => console.log(x.field, '|', JSON.stringify(x.source_file), '|', JSON.stringify(x.sample)));

            fs.writeFileSync('/opt/gauth-full/mojibake_full_report.json', JSON.stringify({totalHits, byField, bySourceFile}, null, 2));
            "
