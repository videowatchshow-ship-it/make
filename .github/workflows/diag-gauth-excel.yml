name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check whether CLOUDFLARE_TOKEN / CLOUDFLARE_ZONE_ID secrets are actually set (lengths only)
        run: |
          echo "CLOUDFLARE_TOKEN length: ${#CF_TOKEN}"
          echo "CLOUDFLARE_ZONE_ID length: ${#CF_ZONE}"
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}

  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find vhost config + any cloudflare creds already on the server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 30s
          script: |
            echo "=== apache2 sites ==="
            ls /etc/apache2/sites-available/ 2>/dev/null || echo "no apache2"
            echo "=== nginx sites ==="
            ls /etc/nginx/sites-available/ 2>/dev/null || echo "no nginx"
            echo "=== gauth vhost content ==="
            sudo grep -rl "gauth.cent-solution.online" /etc/apache2/sites-available/ 2>/dev/null | xargs -r sudo cat
            sudo grep -rl "gauth.cent-solution.online" /etc/nginx/sites-available/ 2>/dev/null | xargs -r sudo cat
            echo "=== any cloudflare env file on this server? (filenames only) ==="
            sudo find / -maxdepth 4 -iname "*.env*" 2>/dev/null | xargs -r sudo grep -li "cloudflare" 2>/dev/null
