name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
    inputs:
      cf_token:
        description: 'one-time cloudflare token, not stored in repo'
        required: false
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check whether CLOUDFLARE_TOKEN / CLOUDFLARE_ZONE_ID secrets are actually set (lengths only)
        run: |
          echo "CLOUDFLARE_TOKEN length: ${#CF_TOKEN}"
          echo "CLOUDFLARE_ZONE_ID length: ${#CF_ZONE}"
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}

  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Count accounts allocated to each sub-site (gain, woodong/우동카, etc)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            set -e
            echo "=== discover sub-sites (same logic as add-account-all-sites.yml) ==="
            for sjs in /var/www/sites/*/server.js; do
              [ -f "$sjs" ] || continue
              dir=$(dirname "$sjs")
              name=$(basename "$dir")
              [ "$name" = "gauth" ] && continue
              if [ -f "$dir/accounts.json" ]; then
                sudo node -e "
                const d = JSON.parse(require('fs').readFileSync('$dir/accounts.json','utf8'));
                const a = Array.isArray(d) ? d : (d.accounts||[]);
                console.log('$name'.padEnd(12), a.length);
                "
              else
                echo "$(printf '%-12s' "$name") 0 (no accounts.json)"
              fi
            done
