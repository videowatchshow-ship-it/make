name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify server file hashes vs repo
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 30s
          script: |
            echo "=== SERVER hashes ==="
            md5sum /var/www/sites/gauth/public/index.html
            md5sum /opt/gauth-full/upload_excels.js
            md5sum /opt/gauth-full/auto_deploy.js
            echo "=== DONE ==="

      - name: Verify raw_values date patterns
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== raw_values samples across many accounts (looking for date-like values) ==="
            sudo node -e "
            const d=JSON.parse(require('fs').readFileSync('/opt/gauth-full/accounts_normalized.json','utf8'));
            const arr=Array.isArray(d)?d:(d.accounts||[]);
            const bySrc = {};
            for (const a of arr) { const s=a.source_file||'?'; if(!bySrc[s]) bySrc[s]=a; }
            let n=0;
            for (const [src,a] of Object.entries(bySrc)) {
              if (n>=15) break;
              console.log('--- file:', src, '---');
              console.log('raw_values:', JSON.stringify(a.raw_values));
              n++;
            }
            " 2>&1
            echo ""
            echo "=== isDateLike function body ==="
            sudo sed -n '333,347p' /opt/gauth-full/upload_excels.js 2>/dev/null
            echo "=== DONE ==="
