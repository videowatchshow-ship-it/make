name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find accounts missing a password
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            sudo node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('/opt/gauth-full/accounts_normalized.json','utf8'));
            const arr = Array.isArray(d) ? d : (d.accounts||[]);

            console.log('total accounts:', arr.length);
            console.log('sample record keys:', Object.keys(arr[0]||{}));

            const pwKeys = Object.keys(arr[0]||{}).filter(k => /pass|pw/i.test(k));
            console.log('password-like fields detected:', pwKeys);

            const missing = arr.filter(a => {
              return pwKeys.length ? pwKeys.every(k => !a[k] || String(a[k]).trim()==='') : true;
            });

            console.log('');
            console.log('=== accounts missing password: count =', missing.length, '===');
            fs.writeFileSync('/opt/gauth-full/missing_password_report.json', JSON.stringify(missing.map(a=>({email:a.email, source_file:a.source_file})), null, 2));
            console.log('full list written to /opt/gauth-full/missing_password_report.json on server (not printed to CI log)');
            "
