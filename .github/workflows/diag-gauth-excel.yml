name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find real today upload events (not archive mtime)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== 1. systemd journal for gauth service, today, upload-related lines ==="
            sudo journalctl -u gauth --since "today" 2>/dev/null | grep -iE "upload|excel|parse" | tail -60

            echo ""
            echo "=== 2. uploads/ dir (pre-archive, not yet processed) ==="
            sudo ls -la /opt/gauth-full/uploads/ 2>/dev/null | head -20

            echo ""
            echo "=== 3. archive/ dir sorted by ctime (creation/move time), today only ==="
            sudo find /opt/gauth-full/uploads/archive -iname "*.xlsx" -newermt "today 00:00" 2>/dev/null -exec sudo stat -c '%Y %n' {} \; | sort -rn

            echo ""
            echo "=== 4. accounts_normalized.json - accounts with source_file matching today's archive file, count + upload-related meta fields ==="
            sudo node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('/opt/gauth-full/accounts_normalized.json','utf8'));
            const arr = Array.isArray(d) ? d : (d.accounts||[]);
            const bySource = {};
            for (const a of arr) {
              const sf = a.source_file || '(none)';
              bySource[sf] = (bySource[sf]||0)+1;
            }
            const sorted = Object.entries(bySource).sort((a,b)=>b[1]-a[1]).slice(0,10);
            console.log('Top source_file counts:', JSON.stringify(sorted,null,2));
            const sample = arr.find(a => (a.email||'')==='fovehuzomisu37067@gmail.com');
            console.log('Sample account full record:', JSON.stringify(sample,null,2));
            "

            echo ""
            echo "=== 5. Apache/nginx access log for POST to upload endpoint today ==="
            sudo grep -iE "upload" /var/log/apache2/*access*.log 2>/dev/null | grep "$(date +%d/%b/%Y)" | tail -20 || echo "no apache log match"
            sudo grep -iE "upload" /var/log/nginx/*access*.log 2>/dev/null | grep "$(date +%d/%b/%Y)" | tail -20 || echo "no nginx log match"
