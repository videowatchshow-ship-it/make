name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
    inputs:
      cf_token:
        description: 'one-time cloudflare token, not stored in repo'
        required: false
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check whether CLOUDFLARE_TOKEN / CLOUDFLARE_ZONE_ID secrets are actually set (lengths only)
        run: |
          echo "CLOUDFLARE_TOKEN length: ${#CF_TOKEN}"
          echo "CLOUDFLARE_ZONE_ID length: ${#CF_ZONE}"
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}

  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Issue SSL for jump.cent-solution.online using the working DNS-Edit token
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 90s
          envs: CF_TOKEN
          script: |
            set -e
            echo "dns_cloudflare_api_token = $CF_TOKEN" | sudo tee /root/.secrets/cloudflare-jump.ini > /dev/null
            sudo chmod 600 /root/.secrets/cloudflare-jump.ini

            sudo certbot certonly --dns-cloudflare --dns-cloudflare-credentials /root/.secrets/cloudflare-jump.ini \
              -d jump.cent-solution.online --non-interactive --agree-tos -m admin@cent-solution.online \
              --cert-name jump.cent-solution.online || echo "CERTBOT_FAILED"

            sudo shred -u /root/.secrets/cloudflare-jump.ini 2>/dev/null || sudo rm -f /root/.secrets/cloudflare-jump.ini

            if [ -f /etc/letsencrypt/live/jump.cent-solution.online/fullchain.pem ]; then
              echo "=== cert issued, swap in the full (HTTP+SSL) vhost ==="
              sudo cp /tmp/jump_full.conf /etc/apache2/sites-available/jump.conf
              sudo apache2ctl configtest && sudo systemctl reload apache2
              echo "SSL vhost active for jump.cent-solution.online"
            else
              echo "certbot still failed - see log above"
            fi

            echo "=== verify ==="
            curl -s -o /dev/null -w "https status: %{http_code}\n" https://jump.cent-solution.online/ || true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
