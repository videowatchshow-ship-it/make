name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sample raw_values for date patterns
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== 1. raw_values samples across many accounts (looking for date-like values) ==="
            sudo node -e "
            const d=JSON.parse(require('fs').readFileSync('/opt/gauth-full/accounts_normalized.json','utf8'));
            const arr=Array.isArray(d)?d:(d.accounts||[]);
            const bySrc = {};
            for (const a of arr) { const s=a.source_file||'?'; if(!bySrc[s]) bySrc[s]=a; }
            let n=0;
            for (const [src,a] of Object.entries(bySrc)) {
              if (n>=15) break;
              console.log('--- file:', src, '---');
              console.log('raw_values:', JSON.stringify(a.raw_values));
              n++;
            }
            " 2>&1

            echo ""
            echo "=== 2. isDateLike function body ==="
            sudo sed -n '333,347p' /opt/gauth-full/upload_excels.js 2>/dev/null

            echo ""
            echo "=== 3. Any archived excel files right now? Dump raw sheet ==="
            sudo node -e "
            const XLSX = require('/opt/gauth-full/node_modules/xlsx');
            const fs = require('fs');
            const dir = '/opt/gauth-full/uploads/archive';
            let files = [];
            try { files = fs.readdirSync(dir).filter(f=>f.toLowerCase().endsWith('.xlsx')); } catch(e) { console.log('no dir'); }
            console.log('archive files:', files.length);
            if(files.length){
              const fp = dir + '/' + files[0];
              console.log('Sample:', files[0]);
              const wb = XLSX.readFile(fp);
              const sh = wb.Sheets[wb.SheetNames[0]];
              const rows = XLSX.utils.sheet_to_json(sh, {header:1, raw:true});
              console.log(JSON.stringify(rows.slice(0,10)));
            }
            " 2>&1

            echo "=== DONE ==="
