name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 15th account from today's excel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== 1. Row 15 directly from raw excel (0-indexed row 14) ==="
            sudo node -e "
            const XLSX = require('/opt/gauth-full/node_modules/xlsx');
            const fs = require('fs');
            const dir = '/opt/gauth-full/uploads/archive';
            const files = fs.readdirSync(dir).filter(f=>f.toLowerCase().endsWith('.xlsx'));
            const fp = dir + '/' + files[0];
            console.log('File:', files[0]);
            const wb = XLSX.readFile(fp);
            const sh = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sh, {header:1, raw:true, defval:''});
            console.log('Row 15 (index 14):', JSON.stringify(rows[14]));
            console.log('Row 16 (index 15) for context:', JSON.stringify(rows[15]));
            " 2>&1

            echo ""
            echo "=== 2. 15th account in accounts_normalized.json for this source_file ==="
            sudo node -e "
            const d=JSON.parse(require('fs').readFileSync('/opt/gauth-full/accounts_normalized.json','utf8'));
            const arr=Array.isArray(d)?d:(d.accounts||[]);
            const fromFile = arr.filter(a=>(a.source_file||'').includes('8.15'));
            console.log('Total accounts from this file:', fromFile.length);
            console.log('15th account (index 14):', JSON.stringify(fromFile[14], null, 2));
            " 2>&1
            echo "=== DONE ==="
