name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
    inputs:
      cf_token:
        description: 'one-time cloudflare token, not stored in repo'
        required: false
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check whether CLOUDFLARE_TOKEN / CLOUDFLARE_ZONE_ID secrets are actually set (lengths only)
        run: |
          echo "CLOUDFLARE_TOKEN length: ${#CF_TOKEN}"
          echo "CLOUDFLARE_ZONE_ID length: ${#CF_ZONE}"
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}

  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find insertion point in rebrowser-login.js for a new /api/subsite-counts route
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 30s
          script: |
            echo "=== app.listen location ==="
            sudo grep -n "app.listen" /opt/gauth-full/rebrowser-login.js
            echo ""
            echo "=== a sample existing app.get('/api/...') route, for style reference ==="
            sudo grep -n "app.get('/api" /opt/gauth-full/rebrowser-login.js | head -5
            echo ""
            echo "=== express app variable name (app.get vs router.get etc) ==="
            sudo grep -n "^const app\|^let app\|= express()" /opt/gauth-full/rebrowser-login.js | head -3
