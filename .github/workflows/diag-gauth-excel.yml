name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-validate using the ACTUAL deployed parser function (no retyping)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            sudo node -e "
            const fs = require('fs');
            const html = fs.readFileSync('/var/www/sites/gauth/public/index.html', 'utf8');
            const start = html.indexOf('function _parseFilenameDate');
            const end = html.indexOf('function _sortByExcelDate');
            const fnSrc = html.slice(start, end);
            eval(fnSrc);

            const d = JSON.parse(fs.readFileSync('/opt/gauth-full/accounts_normalized.json','utf8'));
            const arr = Array.isArray(d) ? d : (d.accounts||[]);
            const uniqueFiles = [...new Set(arr.map(a => a.source_file || '(none)'))];
            console.log('=== TOTAL UNIQUE FILENAMES:', uniqueFiles.length, '===');
            let parsed = 0, unparsed = 0;
            const results = uniqueFiles.map(f => {
              const dt = _parseFilenameDate(f);
              if(dt) parsed++; else unparsed++;
              return { file: f, parsedDate: dt ? new Date(dt).toISOString().slice(0,10) : null };
            });
            results.sort((a,b) => (a.parsedDate||'0000') < (b.parsedDate||'0000') ? 1 : -1);
            console.log('=== PARSED:', parsed, '/ UNPARSED:', unparsed, '(using ACTUAL deployed function) ===');
            results.forEach(r => console.log((r.parsedDate||'NULL').padEnd(12), r.file));
            "
