name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Full hash comparison
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 30s
          script: |
            echo "=== SERVER hashes ==="
            md5sum /var/www/sites/gauth/public/index.html
            md5sum /opt/gauth-full/upload_excels.js
            md5sum /opt/gauth-full/auto_deploy.js
            md5sum /var/www/sites/gauth/public/xlsx.core.min.js
            md5sum /var/www/sites/gauth/public/manifest.json
            md5sum /var/www/sites/gauth/public/sw.js
            md5sum /opt/gauth-full/advanced-google-login-v2.js
            md5sum /opt/gauth-full/package.json
            echo "=== DONE ==="
