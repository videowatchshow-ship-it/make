name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dump raw rows 15/16 from today's most recent uploaded excel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            cd /opt/gauth-full
            echo "=== Most recently modified excel files (any dir) ==="
            sudo find /opt/gauth-full -iname "*.xlsx" -o -iname "*.xls" 2>/dev/null | xargs -I{} sudo stat -c '%Y %n' {} 2>/dev/null | sort -rn | head -10

            LATEST=$(sudo find /opt/gauth-full -iname "*.xlsx" -o -iname "*.xls" 2>/dev/null | xargs -I{} sudo stat -c '%Y {}' {} 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)
            echo ""
            echo "=== Using latest file: $LATEST ==="
            sudo stat "$LATEST" 2>&1

            sudo node -e "
            const XLSX = require('/opt/gauth-full/node_modules/xlsx');
            const path = '$LATEST';
            const wb = XLSX.readFile(path);
            for (const sn of wb.SheetNames) {
              const sheet = wb.Sheets[sn];
              const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:''});
              console.log('--- sheet:', sn, 'total rows:', rows.length, '---');
              [14,15].forEach(idx => {
                if (rows[idx]) {
                  console.log('Row ' + (idx+1) + ' (0-idx ' + idx + '):', JSON.stringify(rows[idx]));
                } else {
                  console.log('Row ' + (idx+1) + ': (none)');
                }
              });
            }
            "
