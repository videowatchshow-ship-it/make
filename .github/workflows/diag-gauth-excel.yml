name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Today uploads + service health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== Server date/time ==="
            date -u
            echo ""
            echo "=== Archive dir (all files with mtime) ==="
            sudo ls -la --time-style=full-iso /opt/gauth-full/uploads/archive/ 2>/dev/null
            echo ""
            echo "=== accounts_normalized.json source_mtime for most recent uploads (top 20) ==="
            sudo node -e "
            const d=JSON.parse(require('fs').readFileSync('/opt/gauth-full/accounts_normalized.json','utf8'));
            const arr=Array.isArray(d)?d:(d.accounts||[]);
            const bySrc = {};
            for (const a of arr) { const s=a.source_file||'?'; if(!bySrc[s]||a.source_mtime>bySrc[s]) bySrc[s]=a.source_mtime; }
            const sorted = Object.entries(bySrc).sort((a,b)=>b[1]-a[1]).slice(0,20);
            for (const [f,m] of sorted) console.log(new Date(m).toISOString(), '-', f);
            " 2>&1
            echo ""
            echo "=== gauth service status ==="
            sudo systemctl status gauth --no-pager -l 2>&1 | tail -20
            echo ""
            echo "=== Health check retry ==="
            for i in 1 2 3; do
              HTTP=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/api/normalized-accounts 2>/dev/null || echo 000)
              echo "attempt $i: HTTP $HTTP"
              [ "$HTTP" = "200" ] && break
              sleep 2
            done
            echo "=== DONE ==="
