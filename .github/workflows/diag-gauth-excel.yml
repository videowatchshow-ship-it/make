name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find accounts missing 2FA + scan for display/rendering bugs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            sudo node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('/opt/gauth-full/accounts_normalized.json','utf8'));
            const arr = Array.isArray(d) ? d : (d.accounts||[]);
            console.log('total accounts:', arr.length);

            const no2fa = arr.filter(a => !a.totp_secret || String(a.totp_secret).trim()==='');
            console.log('=== accounts missing totp_secret (2FA): count =', no2fa.length, '===');
            fs.writeFileSync('/opt/gauth-full/missing_2fa_report.json', JSON.stringify(no2fa.map(a=>({email:a.email, source_file:a.source_file})), null, 2));
            console.log('full list written to /opt/gauth-full/missing_2fa_report.json (not printed here)');

            console.log('');
            console.log('=== scanning for display/rendering anomalies in each field ===');
            const fields = ['email','password','totp_secret','recovery_email','recovery_phone','youtube_url','login_method','channel_status','channel_status_reason','channel_status_label'];
            const isMojibake = s => /[�]|Ã.|â..|ì..|ê../.test(s);
            const isSuspicious = s => /\bundefined\b|\bnull\b|\bNaN\b|\[object Object\]/i.test(s);
            const issues = { mojibake: [], literalNull: [], badEmail: [], newlineOrTab: [], tooLong: [] };
            arr.forEach(a => {
              fields.forEach(f => {
                const v = a[f];
                if (v === undefined || v === null) return;
                const s = String(v);
                if (isMojibake(s)) issues.mojibake.push({field:f, email:a.email});
                if (isSuspicious(s)) issues.literalNull.push({field:f, email:a.email, value:s.slice(0,60)});
                if (/[\n\t\r]/.test(s)) issues.newlineOrTab.push({field:f, email:a.email});
                if (s.length > 300) issues.tooLong.push({field:f, email:a.email, len:s.length});
              });
              if (a.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(a.email)) issues.badEmail.push(a.email);
            });
            Object.keys(issues).forEach(k => console.log(k+':', issues[k].length));
            fs.writeFileSync('/opt/gauth-full/display_bugs_report.json', JSON.stringify(issues, null, 2));
            console.log('full details written to /opt/gauth-full/display_bugs_report.json (not printed here)');

            console.log('');
            console.log('=== mojibake detail (field + garbled sample, no email) ===');
            issues.mojibake.forEach(x => {
              const rec = arr.find(a=>a.email===x.email);
              const raw = String(rec[x.field]||'');
              console.log('field:', x.field, '| sample:', JSON.stringify(raw.slice(0,40)));
            });
            console.log('');
            console.log('=== badEmail detail (masked, structure only) ===');
            issues.badEmail.forEach(e => {
              const masked = e.replace(/^(.{2}).*(@.*)$/, (m,a,b)=>a+'***'+b);
              console.log(masked);
            });
            "
