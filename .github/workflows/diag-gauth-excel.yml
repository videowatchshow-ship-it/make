name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check what /api/normalized-accounts actually returns (frontend source)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== 1. find the route handler for /api/normalized-accounts ==="
            sudo grep -rn "normalized-accounts" /opt/gauth-full/*.js 2>/dev/null

            echo ""
            echo "=== 2. actual live API response length (need auth - check route code first for auth requirement) ==="
            sudo grep -n "app.get.*normalized-accounts" -A 30 /opt/gauth-full/rebrowser-login.js /opt/gauth-full/auto_deploy.js 2>/dev/null | head -60
