name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
    inputs:
      cf_token:
        description: 'one-time cloudflare token, not stored in repo'
        required: false
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check whether CLOUDFLARE_TOKEN / CLOUDFLARE_ZONE_ID secrets are actually set (lengths only)
        run: |
          echo "CLOUDFLARE_TOKEN length: ${#CF_TOKEN}"
          echo "CLOUDFLARE_ZONE_ID length: ${#CF_ZONE}"
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}

  delete-jump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove jump.cent-solution.online entirely (DNS + vhost + cert)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 90s
          script: |
            set -e
            CF_TOKEN="${{ secrets.CLOUDFLARE_TOKEN }}"
            ZONE="2601d4f4ab75c910f8d858ca036ff344"

            echo "=== 1. delete Cloudflare DNS record for jump ==="
            REC_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?name=jump.cent-solution.online" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result',[]); print(r[0]['id'] if r else '')")
            if [ -n "$REC_ID" ]; then
              curl -s -X DELETE "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records/$REC_ID" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json"
              echo "DNS record $REC_ID deleted"
            else
              echo "no DNS record found for jump"
            fi
            echo ""

            echo "=== 2. find and remove apache vhost block(s) for jump ==="
            for conf in /etc/apache2/sites-available/*.conf; do
              [ -f "$conf" ] || continue
              if sudo grep -q "jump.cent-solution.online" "$conf"; then
                echo "found in $conf"
                sudo cp "$conf" "$conf.bak.$(date +%s)"
                sudo python3 - "$conf" <<'PYEOF'
            import re, sys
            path = sys.argv[1]
            with open(path, "r", encoding="utf-8") as fh:
                src = fh.read()
            blocks = re.findall(r"<VirtualHost[^>]*>.*?</VirtualHost>", src, flags=re.S)
            kept = []
            removed = 0
            for b in blocks:
                if "jump.cent-solution.online" in b:
                    removed += 1
                    continue
                kept.append(b)
            if removed:
                new_src = src
                for b in blocks:
                    if "jump.cent-solution.online" in b:
                        new_src = new_src.replace(b, "")
                with open(path, "w", encoding="utf-8") as fh:
                    fh.write(new_src)
                print(f"removed {removed} VirtualHost block(s) from {path}")
            else:
                print(f"no matching VirtualHost block in {path}")
            PYEOF
              fi
            done

            echo ""
            echo "=== 3. disable jump site config + reload apache ==="
            sudo a2dissite jump.conf 2>/dev/null || true
            sudo a2dissite jump-le-ssl.conf 2>/dev/null || true
            sudo apachectl configtest && sudo systemctl reload apache2

            echo ""
            echo "=== 4. remove jump documentroot + certbot cert ==="
            sudo rm -rf /var/www/sites/jump 2>/dev/null || true
            sudo certbot delete --cert-name jump.cent-solution.online --non-interactive 2>&1 || echo "no cert named jump.cent-solution.online (or already removed)"

            echo ""
            echo "=== 5. verify ==="
            curl -s -o /dev/null -w "jump http status: %{http_code}\n" https://jump.cent-solution.online/ --max-time 5 || echo "jump unreachable (expected)"
            curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?name=jump.cent-solution.online" -H "Authorization: Bearer $CF_TOKEN" | python3 -c "import sys,json; d=json.load(sys.stdin); print('remaining DNS records:', len(d.get('result',[])))"

  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify subsite-counts route + frontend widget are live
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 30s
          script: |
            echo "=== 1. server-side route present? ==="
            sudo grep -c "subsite-counts" /opt/gauth-full/rebrowser-login.js || echo 0
            echo ""
            echo "=== 2. gauth service status ==="
            sudo systemctl is-active gauth
            echo ""
            echo "=== 3. live API response (localhost) ==="
            curl -s --max-time 5 http://localhost:4000/api/subsite-counts
            echo ""
            echo "=== 4. live API response (public https) ==="
            curl -s --max-time 8 https://gauth.cent-solution.online/api/subsite-counts
            echo ""
            echo "=== 5. frontend widget present in served index.html? ==="
            curl -s --max-time 8 https://gauth.cent-solution.online/ | grep -o 'subsite-counts' | head -3
