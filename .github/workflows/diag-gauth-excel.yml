name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-verify sort fix + live service health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== 1. systemd service status ==="
            sudo systemctl is-active gauth
            sudo systemctl status gauth --no-pager | head -10

            echo ""
            echo "=== 2. deployed file content check ==="
            sudo grep -n "noDate.sort\|withDate.sort\|function _sortByExcelDate" /var/www/sites/gauth/public/index.html

            echo ""
            echo "=== 3. md5 compare ==="
            sudo md5sum /var/www/sites/gauth/public/index.html

            echo ""
            echo "=== 4. live HTTPS response check ==="
            curl -sI --max-time 8 https://gauth.cent-solution.online/ | head -5

            echo ""
            echo "=== 5. live content grep via https ==="
            curl -s --max-time 8 https://gauth.cent-solution.online/ | grep -o "noDate.sort[^}]*}" | head -1

            echo ""
            echo "=== 6. local backend direct check ==="
            curl -s --max-time 8 http://localhost:4000/ | grep -o "noDate.sort[^}]*}" | head -1
