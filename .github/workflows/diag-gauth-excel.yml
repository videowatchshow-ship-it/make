name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
    inputs:
      cf_token:
        description: 'one-time cloudflare token, not stored in repo'
        required: false
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check whether CLOUDFLARE_TOKEN / CLOUDFLARE_ZONE_ID secrets are actually set (lengths only)
        run: |
          echo "CLOUDFLARE_TOKEN length: ${#CF_TOKEN}"
          echo "CLOUDFLARE_ZONE_ID length: ${#CF_ZONE}"
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}

  create-jump:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Ensure remote dir exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 20s
          script: |
            sudo mkdir -p /var/www/sites/jump/public
            sudo chown -R ${{ secrets.GAUTH_USER }}:${{ secrets.GAUTH_USER }} /var/www/sites/jump
      - name: Copy new jump design (index.html, manifest.json, sw.js)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          source: "jump/index.html,jump/manifest.json,jump/sw.js"
          target: "/var/www/sites/jump/public"
          strip_components: 1
      - name: Create DNS record + static vhost + cert + enable
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 90s
          script: |
            set -e
            CF_TOKEN="${{ secrets.CLOUDFLARE_TOKEN }}"
            ZONE="2601d4f4ab75c910f8d858ca036ff344"
            SERVER_IP=$(curl -s ifconfig.me)

            echo "=== 1. create/ensure Cloudflare DNS record for jump ==="
            EXISTING=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?name=jump.cent-solution.online" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result',[]); print(r[0]['id'] if r else '')")
            if [ -n "$EXISTING" ]; then
              echo "DNS record already exists ($EXISTING), skipping create"
            else
              curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" -d '{"type":"A","name":"jump","content":"'"$SERVER_IP"'","ttl":1,"proxied":true}'
              echo "DNS record created"
            fi
            echo ""

            sudo chown -R www-data:www-data /var/www/sites/jump/public

            echo "=== 2. write plain static apache vhost (no proxy — display only) ==="
            sudo tee /etc/apache2/sites-available/jump.conf > /dev/null <<'VHOSTEOF'
            <VirtualHost *:80>
                ServerName jump.cent-solution.online
                DocumentRoot /var/www/sites/jump/public
                <Directory /var/www/sites/jump/public>
                    AllowOverride All
                    Require all granted
                </Directory>
            </VirtualHost>
            VHOSTEOF
            sudo a2ensite jump.conf
            sudo apachectl configtest && sudo systemctl reload apache2

            echo ""
            echo "=== 3. issue Let's Encrypt cert via dns-cloudflare ==="
            sudo mkdir -p /root/.secrets
            echo "dns_cloudflare_api_token = $CF_TOKEN" | sudo tee /root/.secrets/cloudflare-jump.ini > /dev/null
            sudo chmod 600 /root/.secrets/cloudflare-jump.ini
            sudo certbot --apache -d jump.cent-solution.online \
              --dns-cloudflare --dns-cloudflare-credentials /root/.secrets/cloudflare-jump.ini \
              --non-interactive --agree-tos -m admin@cent-solution.online --redirect \
              || echo "certbot failed or already has cert, continuing"
            sudo shred -u /root/.secrets/cloudflare-jump.ini 2>/dev/null || sudo rm -f /root/.secrets/cloudflare-jump.ini

            sudo apachectl configtest && sudo systemctl reload apache2

            echo ""
            echo "=== 4. verify ==="
            sleep 3
            curl -s -o /dev/null -w "jump https status: %{http_code}\n" https://jump.cent-solution.online/ --max-time 10
            curl -s --max-time 10 https://jump.cent-solution.online/ | grep -o "참교육 스트리밍" | head -1

  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Insert /api/subsite-accounts (full detail) route and restart gauth
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            set -e
            F=/opt/gauth-full/rebrowser-login.js
            sudo cp "$F" "$F.bak.$(date +%s)"
            sudo python3 - <<'PYEOF'
            import re
            f = "/opt/gauth-full/rebrowser-login.js"
            with open(f, "r", encoding="utf-8") as fh:
                src = fh.read()
            if "/api/subsite-accounts" in src:
                print("route already present, skipping insert")
            else:
                marker = "app.get('/api/subsite-counts'"
                idx = src.index(marker)
                route = (
                    "app.get('/api/subsite-accounts', (_req, res) => {\n"
                    "  try {\n"
                    "    const fs = require('fs');\n"
                    "    const path = require('path');\n"
                    "    const base = '/var/www/sites';\n"
                    "    const out = [];\n"
                    "    for (const name of fs.readdirSync(base)) {\n"
                    "      if (name === 'gauth') continue;\n"
                    "      const p = path.join(base, name, 'accounts.json');\n"
                    "      if (!fs.existsSync(p)) continue;\n"
                    "      try {\n"
                    "        const d = JSON.parse(fs.readFileSync(p, 'utf8'));\n"
                    "        const arr = Array.isArray(d) ? d : (d.accounts || []);\n"
                    "        out.push({\n"
                    "          site: name,\n"
                    "          accounts: arr.map(a => ({\n"
                    "            email: a.email || '',\n"
                    "            status: a.status || '',\n"
                    "            allocated_date: a.allocated_date || '',\n"
                    "            youtube_url: a.youtube_url || ''\n"
                    "          }))\n"
                    "        });\n"
                    "      } catch (e) {}\n"
                    "    }\n"
                    "    out.sort((a, b) => a.site.localeCompare(b.site));\n"
                    "    res.json({ sites: out });\n"
                    "  } catch (e) {\n"
                    "    res.status(500).json({ error: e.message });\n"
                    "  }\n"
                    "})\n"
                )
                src = src[:idx] + route + src[idx:]
                with open(f, "w", encoding="utf-8") as fh:
                    fh.write(src)
                print("route inserted")
            PYEOF
            sudo node -c /opt/gauth-full/rebrowser-login.js && echo "syntax OK"
            sudo systemctl restart gauth
            sleep 2
            sudo systemctl is-active gauth
            echo ""
            echo "=== live test ==="
            curl -s --max-time 5 http://localhost:4000/api/subsite-accounts | head -c 500
