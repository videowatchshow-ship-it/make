name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check whether CLOUDFLARE_TOKEN / CLOUDFLARE_ZONE_ID secrets are actually set (lengths only)
        run: |
          echo "CLOUDFLARE_TOKEN length: ${#CF_TOKEN}"
          echo "CLOUDFLARE_ZONE_ID length: ${#CF_ZONE}"
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}

  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find what got globally-installed / misplaced under chamgyo photo folders
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== does /var/www/sites even exist here, and what is in it? ==="
            ls -la /var/www/sites 2>/dev/null || echo "no /var/www/sites"
            echo ""
            echo "=== broad search across whole filesystem for chamgyo / photo3 / my-site-1 ==="
            sudo find / -maxdepth 6 \( -iname "*chamgyo*" -o -iname "*my-site-1*" -o -iname "photo3" \) 2>/dev/null
            echo ""
            echo "=== all vhosts on this box (server names only) ==="
            sudo grep -rh "ServerName" /etc/apache2/sites-available/ 2>/dev/null | sort -u
            sudo grep -rh "server_name" /etc/nginx/sites-available/ 2>/dev/null | sort -u
