name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate filename-date parser against every real source_file in DB
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            sudo node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('/opt/gauth-full/accounts_normalized.json','utf8'));
            const arr = Array.isArray(d) ? d : (d.accounts||[]);

            function _parseFilenameDate(name){
              if(!name) return null;
              var y = new Date().getFullYear();
              var m;
              m = name.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
              if(m) return new Date(y, parseInt(m[1],10)-1, parseInt(m[2],10)).getTime();
              m = name.match(/\(?(\d{1,2})\.(\d{1,2})\)?/);
              if(m){
                var mo = parseInt(m[1],10), da = parseInt(m[2],10);
                if(mo>=1 && mo<=12 && da>=1 && da<=31) return new Date(y, mo-1, da).getTime();
              }
              return null;
            }

            const uniqueFiles = [...new Set(arr.map(a => a.source_file || '(none)'))];
            console.log('=== TOTAL UNIQUE FILENAMES IN DB:', uniqueFiles.length, '===');
            let parsed = 0, unparsed = 0;
            const results = uniqueFiles.map(f => {
              const dt = _parseFilenameDate(f);
              if(dt) parsed++; else unparsed++;
              return { file: f, parsedDate: dt ? new Date(dt).toISOString().slice(0,10) : null };
            });
            results.sort((a,b) => (a.parsedDate||'0000') < (b.parsedDate||'0000') ? 1 : -1);
            console.log('=== PARSED:', parsed, '/ UNPARSED:', unparsed, '===');
            results.forEach(r => console.log((r.parsedDate||'NULL').padEnd(12), r.file));

            const withDate = arr.filter(a => a.account_date);
            const noDate = arr.filter(a => !a.account_date);
            console.log('');
            console.log('=== account_date present:', withDate.length, '/ account_date null (uses filename sort):', noDate.length, '===');
            "
