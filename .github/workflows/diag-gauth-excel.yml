name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare byte encoding of real DB filename vs literal string (NFC/NFD check)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            sudo node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('/opt/gauth-full/accounts_normalized.json','utf8'));
            const arr = Array.isArray(d) ? d : (d.accounts||[]);
            const cand = arr.map(a=>a.source_file).filter(f => f && f.replace(/[^0-9]/g,'')==='723');
            cand.forEach(f => {
              console.log('FOUND:', JSON.stringify(f));
              console.log('  raw bytes:', Buffer.from(f,'utf8').toString('hex'));
              console.log('  NFC bytes:', Buffer.from(f.normalize('NFC'),'utf8').toString('hex'));
              console.log('  NFD bytes:', Buffer.from(f.normalize('NFD'),'utf8').toString('hex'));
              const re = /(\d{1,2})\s*월\s*(\d{1,2})\s*일/;
              console.log('  raw match:', f.match(re));
              console.log('  NFC match:', f.normalize('NFC').match(re));
            });
            const literal = '7월23일.xlsx';
            console.log('literal bytes:', Buffer.from(literal,'utf8').toString('hex'));
            "
