name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify sort fix deployed on live server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== live file check ==="
            sudo grep -n "noDate.sort" /var/www/sites/gauth/public/index.html
            sudo md5sum /var/www/sites/gauth/public/index.html
            echo "=== curl localhost check ==="
            curl -s http://localhost:4000/ 2>/dev/null | grep -o "noDate.sort[^}]*}" | head -1
