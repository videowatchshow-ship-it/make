name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check for automated re-upload sources (cron, scripts, bots)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== 1. all cron jobs (system + user) ==="
            sudo crontab -l 2>/dev/null
            echo "--- /etc/cron.d ---"
            sudo ls -la /etc/cron.d/ 2>/dev/null
            for f in /etc/cron.d/*; do echo ">>> $f"; sudo cat "$f" 2>/dev/null; done
            echo "--- /etc/crontab ---"
            sudo cat /etc/crontab 2>/dev/null

            echo ""
            echo "=== 2. systemd timers ==="
            sudo systemctl list-timers --all 2>/dev/null | head -30

            echo ""
            echo "=== 3. full request details for the 00:11:50 upload - IP, user agent, referer ==="
            sudo grep "00:11:5" /var/log/apache2/gauth_access.log 2>/dev/null

            echo ""
            echo "=== 4. any other upload-excels POSTs today (full day) ==="
            sudo grep "upload-excels" /var/log/apache2/gauth_access.log 2>/dev/null | grep "20/Aug/2026"

            echo ""
            echo "=== 5. IP geolocation hint - reverse check if 172.70.143.216 is Cloudflare edge (expected) or something else ==="
            echo "172.70.143.216 is a known Cloudflare anycast IP range if proxied=true"

            echo ""
            echo "=== 6. check for any script/cron that calls upload-excels programmatically ==="
            sudo grep -rl "upload-excels" /opt/gauth-full/*.js /opt/gauth-full/*.sh 2>/dev/null
            sudo grep -rn "upload-excels\|POST.*upload" /etc/cron.d/ /etc/systemd/system/*.timer /etc/systemd/system/*.service 2>/dev/null
