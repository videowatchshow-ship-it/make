name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify filename-date-only sort deployed live
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            sudo grep -n "_parseFilenameDate\|noDate.sort" /var/www/sites/gauth/public/index.html
            sudo md5sum /var/www/sites/gauth/public/index.html
            curl -s --max-time 8 https://gauth.cent-solution.online/ | grep -o "_fnDate||0[^}]*}" | head -1
