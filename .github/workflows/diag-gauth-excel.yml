name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recheck merge result + account 5211/5212 after merge completes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== 1. Merge log for the most recent upload ==="
            sudo journalctl -u gauth --since "-15 min" 2>/dev/null | grep -iE "upload-excels|merge done" | tail -20

            echo ""
            echo "=== 2. Current total count + accounts 5211/5212 (1-indexed) ==="
            sudo node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('/opt/gauth-full/accounts_normalized.json','utf8'));
            const arr = Array.isArray(d) ? d : (d.accounts||[]);
            console.log('Total accounts NOW:', arr.length);
            console.log('=== Account #5211 (index 5210) ===');
            console.log(JSON.stringify(arr[5210], null, 2));
            console.log('=== Account #5212 (index 5211) ===');
            console.log(JSON.stringify(arr[5211], null, 2));
            "
