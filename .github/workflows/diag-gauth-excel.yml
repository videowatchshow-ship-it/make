name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect gauth server files part 2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== 1. account_date extraction logic in upload_excels.js ==="
            sudo grep -n "account_date\|parseDate\|extractDate\|Date(" /opt/gauth-full/upload_excels.js 2>/dev/null | head -60

            echo ""
            echo "=== 2. account_date stats ==="
            sudo node -e "
            const d=JSON.parse(require('fs').readFileSync('/opt/gauth-full/accounts_normalized.json','utf8'));
            const arr=Array.isArray(d)?d:(d.accounts||[]);
            const withDate = arr.filter(a=>a.account_date);
            const noDate = arr.filter(a=>!a.account_date);
            console.log('total:', arr.length, 'withDate:', withDate.length, 'noDate:', noDate.length);
            console.log('sample withDate:', JSON.stringify(withDate.slice(0,5).map(a=>({email:a.email, account_date:a.account_date, source_file:a.source_file}))));
            " 2>&1

            echo ""
            echo "=== 3. _fixMojibake function definition in index.html ==="
            sudo grep -n "_fixMojibake" -A 15 /var/www/sites/gauth/public/index.html 2>/dev/null | head -40

            echo ""
            echo "=== 4. mojibake filenames - hex dump of one ==="
            sudo node -e "
            const d=JSON.parse(require('fs').readFileSync('/opt/gauth-full/accounts_normalized.json','utf8'));
            const arr=Array.isArray(d)?d:(d.accounts||[]);
            const bad = arr.find(a=>a.source_file && a.source_file.includes('ë'));
            if(bad){ console.log('filename:', bad.source_file); console.log('bytes:', Buffer.from(bad.source_file,'utf8').toString('hex')); }
            " 2>&1

            echo ""
            echo "=== 5. Which endpoint serves accounts to frontend (grep app.get accounts) ==="
            sudo grep -n "app.get.*account\|app.get.*/api/" /opt/gauth-full/rebrowser-login.js 2>/dev/null | head -30

            echo ""
            echo "=== 6. multer/busboy filename encoding handling ==="
            sudo grep -n "originalname\|latin1\|utf8\|encoding" /opt/gauth-full/rebrowser-login.js 2>/dev/null | head -30

            echo "=== DONE ==="
