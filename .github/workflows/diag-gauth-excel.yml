name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check whether CLOUDFLARE_TOKEN / CLOUDFLARE_ZONE_ID secrets are actually set (lengths only)
        run: |
          echo "CLOUDFLARE_TOKEN length: ${#CF_TOKEN}"
          echo "CLOUDFLARE_ZONE_ID length: ${#CF_ZONE}"
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}

  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check for existing SSH access from this box to my-site-1 (34.104.233.35)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 30s
          script: |
            echo "=== ssh keys present on this box (filenames only) ==="
            sudo find / -maxdepth 6 -iname "google_compute_engine*" 2>/dev/null
            find ~ -maxdepth 3 -iname "*.pem" -o -iname "id_*" 2>/dev/null
            echo ""
            echo "=== known_hosts entries mentioning the my-site-1 IP ==="
            grep -l "34.104.233.35\|34.85.126.48" ~/.ssh/known_hosts /root/.ssh/known_hosts 2>/dev/null
            echo ""
            echo "=== try a quick reachability test (3s timeout, no auth attempt) ==="
            timeout 3 bash -c "echo > /dev/tcp/34.104.233.35/22" && echo "port 22 reachable from this box" || echo "NOT reachable from this box"
