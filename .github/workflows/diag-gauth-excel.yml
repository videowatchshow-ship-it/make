name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find all accounts with corrupted password/2FA fields
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            sudo node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('/opt/gauth-full/accounts_normalized.json','utf8'));
            const arr = Array.isArray(d) ? d : (d.accounts||[]);
            console.log('total accounts:', arr.length);

            // Ground truth only: does the raw excel row (raw_values) actually contain this exact
            // password / totp string? If raw_values exists and the stored value is NOT among the
            // raw cells, it was corrupted during merge/parse. No length/regex guessing.
            const withRaw = arr.filter(a => Array.isArray(a.raw_values) && a.raw_values.length);
            const noRaw = arr.filter(a => !Array.isArray(a.raw_values) || !a.raw_values.length);
            console.log('records WITH raw_values (verifiable):', withRaw.length);
            console.log('records WITHOUT raw_values (unverifiable, older ingestion):', noRaw.length);

            function norm(s) { return String(s).trim().toLowerCase().replace(/\s+/g, ''); }
            function inRaw(a, val) {
              if (!val) return true; // empty is not 'corrupted'
              const nv = norm(val);
              return a.raw_values.some(c => norm(c) === nv || norm(c).includes(nv) || nv.includes(norm(c)) && norm(c).length > 4);
            }

            const confirmedBadPw = withRaw.filter(a => !inRaw(a, a.password));
            const confirmedBadTotp = withRaw.filter(a => !inRaw(a, a.totp_secret));

            console.log('');
            console.log('=== CONFIRMED corrupted password (value not found in its own raw excel row): count =', confirmedBadPw.length, '===');
            confirmedBadPw.forEach((a,i) => console.log((i+1)+'.', a.email, '| source_file:', a.source_file, '| row:', a.source_row));

            console.log('');
            console.log('=== CONFIRMED corrupted 2FA (value not found in its own raw excel row): count =', confirmedBadTotp.length, '===');
            confirmedBadTotp.forEach((a,i) => console.log((i+1)+'.', a.email, '| source_file:', a.source_file, '| row:', a.source_row));

            const union = new Set([...confirmedBadPw.map(a=>a.email), ...confirmedBadTotp.map(a=>a.email)]);
            console.log('');
            console.log('=== CONFIRMED union (either broken), verifiable subset only: count =', union.size, '===');
            console.log('(', noRaw.length, 'more accounts have no raw_values to verify against and are NOT included here)');

            fs.writeFileSync('/opt/gauth-full/confirmed_corrupted_report.json', JSON.stringify({
              confirmedBadPassword: confirmedBadPw.map(a=>({email:a.email, source_file:a.source_file, source_row:a.source_row})),
              confirmedBadTotp: confirmedBadTotp.map(a=>({email:a.email, source_file:a.source_file, source_row:a.source_row})),
              unverifiableCount: noRaw.length
            }, null, 2));
            console.log('full report saved to /opt/gauth-full/confirmed_corrupted_report.json');
            "
