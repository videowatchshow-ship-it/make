name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get full upload_excels.js head + busboy config
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== 1. upload_excels.js lines 1-100 (imports, isDateLike, classifyValue) ==="
            sudo sed -n '1,100p' /opt/gauth-full/upload_excels.js 2>/dev/null

            echo ""
            echo "=== 2. upload_excels.js lines 330-460 (parseDateValue, isDateLike, column extraction) ==="
            sudo sed -n '330,460p' /opt/gauth-full/upload_excels.js 2>/dev/null

            echo ""
            echo "=== 3. upload_excels.js lines 580-630 (bruteForceExtract date handling) ==="
            sudo sed -n '580,630p' /opt/gauth-full/upload_excels.js 2>/dev/null

            echo ""
            echo "=== 4. upload_excels.js lines 690,730 (label-value extract date handling) ==="
            sudo sed -n '690,730p' /opt/gauth-full/upload_excels.js 2>/dev/null

            echo ""
            echo "=== 5. busboy init - filename/encoding config ==="
            sudo grep -n "busboy\|Busboy\|new bb\|require('busboy')\|require(\"busboy\")" /opt/gauth-full/upload_excels.js 2>/dev/null

            echo ""
            echo "=== 6. actual raw excel cell sample - dump first sheet of a real file to see date format ==="
            sudo node -e "
            const XLSX = require('/opt/gauth-full/node_modules/xlsx');
            const fs = require('fs');
            const dir = '/opt/gauth-full/uploads/archive';
            const files = fs.readdirSync(dir).filter(f=>f.toLowerCase().endsWith('.xlsx'));
            if(files.length){
              const fp = dir + '/' + files[0];
              console.log('Sample file:', files[0]);
              const wb = XLSX.readFile(fp);
              const sh = wb.Sheets[wb.SheetNames[0]];
              const rows = XLSX.utils.sheet_to_json(sh, {header:1, raw:true});
              console.log(JSON.stringify(rows.slice(0,8)));
            } else { console.log('no archive files'); }
            " 2>&1

            echo "=== DONE ==="
