name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hex-dump the regex line + test regex directly against known filename
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            sudo grep -n "월" /var/www/sites/gauth/public/index.html | head -3
            echo "--- hex of the regex line ---"
            sudo sed -n '649p' /var/www/sites/gauth/public/index.html | xxd | head -5
            echo "--- node direct regex test ---"
            sudo node -e "
            const s = '7월23일.xlsx';
            console.log('test string bytes:', Buffer.from(s,'utf8').toString('hex'));
            const re = /(\d{1,2})\s*월\s*(\d{1,2})\s*일/;
            console.log('unicode-escape regex match:', s.match(re));
            const fs = require('fs');
            const html = fs.readFileSync('/var/www/sites/gauth/public/index.html','utf8');
            const lineStart = html.indexOf('function _parseFilenameDate');
            const snippet = html.slice(lineStart, lineStart+400);
            console.log('deployed fn source bytes (first 400 chars):');
            console.log(JSON.stringify(snippet));
            "
