name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check whether CLOUDFLARE_TOKEN / CLOUDFLARE_ZONE_ID secrets are actually set (lengths only)
        run: |
          echo "CLOUDFLARE_TOKEN length: ${#CF_TOKEN}"
          echo "CLOUDFLARE_ZONE_ID length: ${#CF_ZONE}"
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}

  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create jump.cent-solution.online using the cloudflare.ini token already on this server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            set -e
            CF_TOKEN=$(sudo grep -oP 'dns_cloudflare_api_token\s*=\s*\K\S+' /root/.secrets/cloudflare.ini 2>/dev/null | head -1)
            ZONE="2601d4f4ab75c910f8d858ca036ff344"
            echo "token found: $([ -n "$CF_TOKEN" ] && echo yes || echo no)"

            echo "=== verify token identity ==="
            curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" -H "Authorization: Bearer $CF_TOKEN"
            echo ""
            echo "=== list zones this token can see ==="
            curl -s "https://api.cloudflare.com/client/v4/zones" -H "Authorization: Bearer $CF_TOKEN" | python3 -c "import json,sys; d=json.load(sys.stdin); print([{'id':z['id'],'name':z['name']} for z in d.get('result',[])]); print('errors:', d.get('errors'))"

            EXISTING=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?name=gauth.cent-solution.online" \
              -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json")
            echo "raw EXISTING response: $EXISTING"
            TYPE=$(echo "$EXISTING" | python3 -c "import json,sys; print(json.load(sys.stdin)['result'][0]['type'])")
            CONTENT=$(echo "$EXISTING" | python3 -c "import json,sys; print(json.load(sys.stdin)['result'][0]['content'])")
            PROXIED=$(echo "$EXISTING" | python3 -c "import json,sys; print(str(json.load(sys.stdin)['result'][0]['proxied']).lower())")
            echo "gauth record: type=$TYPE content=$CONTENT proxied=$PROXIED"

            CHECK=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?name=jump.cent-solution.online" \
              -H "Authorization: Bearer $CF_TOKEN")
            COUNT=$(echo "$CHECK" | python3 -c "import json,sys; print(len(json.load(sys.stdin)['result']))")
            if [ "$COUNT" -gt 0 ]; then
              echo "jump.cent-solution.online already exists, skipping create"
            else
              curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records" \
                -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
                --data "{\"type\":\"$TYPE\",\"name\":\"jump.cent-solution.online\",\"content\":\"$CONTENT\",\"ttl\":1,\"proxied\":$PROXIED}" \
                | python3 -c "import json,sys; d=json.load(sys.stdin); print('success='+str(d['success'])); print(d.get('errors'))"
            fi
