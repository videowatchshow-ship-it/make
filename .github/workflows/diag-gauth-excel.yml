name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Locate column-mapping bug for the 6 contaminated records
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            sudo node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('/opt/gauth-full/accounts_normalized.json','utf8'));
            const arr = Array.isArray(d) ? d : (d.accounts||[]);

            const badEmail = arr.filter(a => a.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(a.email));
            const badPw = arr.filter(a => a.password && /%[0-9A-Fa-f]{2}/.test(String(a.password)));

            console.log('=== bad-email records: source_file + source_row + raw_values keys ===');
            badEmail.forEach(a => {
              console.log(JSON.stringify(a.source_file), '| row', a.source_row, '| raw_values keys:', a.raw_values ? Object.keys(a.raw_values) : 'none');
            });

            console.log('');
            console.log('=== bad-password records: source_file + source_row + raw_values keys ===');
            badPw.forEach(a => {
              console.log(JSON.stringify(a.source_file), '| row', a.source_row, '| raw_values keys:', a.raw_values ? Object.keys(a.raw_values) : 'none');
            });

            console.log('');
            console.log('=== raw_values for ONE bad-email record (full, to see real column layout) ===');
            if (badEmail[0]) console.log(JSON.stringify(badEmail[0].raw_values, null, 2));

            console.log('');
            console.log('=== raw_values for ONE bad-password record (full) ===');
            if (badPw[0]) console.log(JSON.stringify(badPw[0].raw_values, null, 2));

            console.log('');
            console.log('=== broad grep for literal %7C or old_totp across ALL .js in /opt/gauth-full ===');
            const { execSync } = require('child_process');
            try {
              const out = execSync(\"grep -rn '%7C\\|old_totp' /opt/gauth-full --include='*.js' 2>/dev/null || true\").toString();
              console.log(out || '(no matches found in any .js file)');
            } catch(e) { console.log('grep error:', e.message); }

            console.log('');
            console.log('=== recheck raw record (password/totp masked, structure only) ===');
            const badPw2 = arr.find(a => a.email === 'GalissaZo.hir@gmail.com');
            if (badPw2) {
              const masked = Object.assign({}, badPw2);
              ['password','totp_secret'].forEach(k => { if (masked[k]) masked[k] = '[MASKED len='+String(masked[k]).length+']'; });
              if (masked.password_alts) masked.password_alts = masked.password_alts.map(v=>'[MASKED len='+String(v).length+']');
              console.log(JSON.stringify(masked, null, 2));
            }
            "
