name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find all accounts with corrupted password/2FA fields
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            sudo node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('/opt/gauth-full/accounts_normalized.json','utf8'));
            const arr = Array.isArray(d) ? d : (d.accounts||[]);
            console.log('total accounts:', arr.length);

            // valid TOTP secret: base32 alphabet, typically 16-64 chars, no @ / % / spaces
            const isValidTotp = s => !s || /^[A-Z2-7]{8,64}$/.test(String(s).replace(/\s+/g,''));
            // corrupted password: contains url-encoding, an embedded email, or a pipe char
            const isCorruptPw = s => !!s && (/%[0-9A-Fa-f]{2}/.test(s) || /@/.test(s) || /\|/.test(s));
            // corrupted totp: non-empty but fails base32 shape, or contains url-encoding/email
            const isCorruptTotp = s => !!s && (!isValidTotp(s) || /%[0-9A-Fa-f]{2}/.test(s) || /@/.test(s));

            const badPw = arr.filter(a => isCorruptPw(a.password));
            const badTotp = arr.filter(a => isCorruptTotp(a.totp_secret));

            console.log('');
            console.log('=== accounts with corrupted password: count =', badPw.length, '===');
            badPw.forEach((a,i) => console.log((i+1)+'.', a.email, '| source_file:', a.source_file, '| pw_len:', String(a.password).length));

            console.log('');
            console.log('=== accounts with corrupted 2FA (totp_secret): count =', badTotp.length, '===');
            badTotp.forEach((a,i) => console.log((i+1)+'.', a.email, '| source_file:', a.source_file, '| totp_len:', String(a.totp_secret).length));

            const union = new Set([...badPw.map(a=>a.email), ...badTotp.map(a=>a.email)]);
            console.log('');
            console.log('=== union (either password or 2FA broken): count =', union.size, '===');

            fs.writeFileSync('/opt/gauth-full/corrupted_credentials_report.json', JSON.stringify({
              badPassword: badPw.map(a=>({email:a.email, source_file:a.source_file, source_row:a.source_row})),
              badTotp: badTotp.map(a=>({email:a.email, source_file:a.source_file, source_row:a.source_row}))
            }, null, 2));
            console.log('full report (with source_row for fixing) saved to /opt/gauth-full/corrupted_credentials_report.json');
            "
