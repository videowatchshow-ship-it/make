name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check whether CLOUDFLARE_TOKEN / CLOUDFLARE_ZONE_ID secrets are actually set (lengths only)
        run: |
          echo "CLOUDFLARE_TOKEN length: ${#CF_TOKEN}"
          echo "CLOUDFLARE_ZONE_ID length: ${#CF_ZONE}"
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}

  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find what got globally-installed / misplaced under chamgyo photo folders
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== read the chamgyo-photo memory note ==="
            sudo cat /opt/claude-mem-sync/proj1/chamgyo-photo-baccarat.md 2>/dev/null || echo "(not found)"
            echo ""
            echo "=== /home/chamgyo contents ==="
            sudo ls -la /home/chamgyo 2>/dev/null
            echo ""
            echo "=== gain vhost config (user typo'd 'gain' for this?) ==="
            sudo grep -rl "gain.cent-solution.online" /etc/apache2/sites-available/ 2>/dev/null | xargs -r sudo cat
