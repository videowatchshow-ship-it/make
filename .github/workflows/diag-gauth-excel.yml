name: Diagnose gauth excel encoding + sort
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-diag-gauth.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find accounts ending with 781@gmail.com or 433@gmail.com
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            sudo node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('/opt/gauth-full/accounts_normalized.json','utf8'));
            const arr = Array.isArray(d) ? d : (d.accounts||[]);
            const matches781 = arr.filter(a => (a.email||'').endsWith('781@gmail.com'));
            const matches433 = arr.filter(a => (a.email||'').endsWith('433@gmail.com'));
            console.log('=== ending with 781@gmail.com ===', matches781.length, 'found');
            matches781.forEach((a,i) => console.log(i+1, JSON.stringify(a, null, 2)));
            console.log('=== ending with 433@gmail.com ===', matches433.length, 'found');
            matches433.forEach((a,i) => console.log(i+1, JSON.stringify(a, null, 2)));
            "
