name: Diag photo3 vs photo diff

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deep diff via gauth gcloud SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 180s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='
            P3="/var/www/sites/chamgyo/public/photo3"
            P2="/var/www/sites/chamgyo/public/photo2"
            P1="/var/www/sites/chamgyo/public/photo"

            echo "===== [1] FULL photo3 DIR ====="
            ls -la "$P3/" 2>/dev/null

            echo "===== [2] FULL photo DIR ====="
            ls -la "$P1/" 2>/dev/null

            echo "===== [3] FIND write.php ANYWHERE ====="
            find /var/www/sites/chamgyo/public -name "write*.php" -type f 2>/dev/null
            find /var/www/sites/chamgyo/public -name "write*.php" -type l 2>/dev/null

            echo "===== [4] photo3 HEAD section (first 50 lines) ====="
            head -50 "$P3/CAH_1.html"

            echo "===== [5] photo HEAD section (first 50 lines) ====="
            head -50 "$P1/CAH_1.html"

            echo "===== [6] photo3 viewport meta ====="
            grep -i "viewport" "$P3/CAH_1.html" || echo "NO VIEWPORT META"

            echo "===== [7] photo viewport meta ====="
            grep -i "viewport" "$P1/CAH_1.html" || echo "NO VIEWPORT META"

            echo "===== [8] photo3 tak guard / channel check ====="
            grep -n "ch=\|ch ===\|ch !==\|URLSearchParams\|__ch\|channel" "$P3/CAH_1.html" | head -20

            echo "===== [9] photo tak guard / channel check ====="
            grep -n "ch=\|ch ===\|ch !==\|URLSearchParams\|__ch\|channel" "$P1/CAH_1.html" | head -20

            echo "===== [10] photo3 style blocks (all) ====="
            grep -n "<style\|</style\|body{\|full_box\|height:\|canvas\|#cBead\|#cBox\|width:" "$P3/CAH_1.html" | head -40

            echo "===== [11] photo style blocks (all) ====="
            grep -n "<style\|</style\|body{\|full_box\|height:\|canvas\|#cBead\|#cBox\|width:" "$P1/CAH_1.html" | head -40

            echo "===== [12] photo3 script src tags ====="
            grep -n "script src\|<script" "$P3/CAH_1.html" | head -30

            echo "===== [13] photo script src tags ====="
            grep -n "script src\|<script" "$P1/CAH_1.html" | head -30

            echo "===== [14] photo3 canvas elements ====="
            grep -n "canvas\|cBead\|cBox" "$P3/CAH_1.html" | head -20

            echo "===== [15] photo3 BOTTOM CSS overrides (last 100 lines) ====="
            tail -100 "$P3/CAH_1.html"

            echo "===== [16] photo BOTTOM CSS overrides (last 100 lines) ====="
            tail -100 "$P1/CAH_1.html"

            echo "===== [17] Apache error log (photo3 related) ====="
            sudo tail -30 /var/log/apache2/error.log 2>/dev/null | grep -i "photo3\|error\|fatal" | head -10

            echo "===== [18] PHP error log ====="
            sudo tail -20 /var/log/php*.log 2>/dev/null | head -10 || echo "no PHP log"

            echo "===== [19] write.php via curl ====="
            curl -s "http://localhost/photo3/write.php" | head -30
            echo "---STATUS---"
            curl -sI "http://localhost/photo3/write.php" | head -5

            echo "===== DONE ====="
            '
