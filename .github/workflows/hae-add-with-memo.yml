name: Add account to hae with memo
on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email to add'
        required: true
      memo:
        description: 'Memo to attach'
        required: false
        default: ''

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 3m
          script: |
            EMAIL="${{ github.event.inputs.email }}"
            MEMO="${{ github.event.inputs.memo }}"
            ACCT_FILE="/var/www/sites/hae/accounts.json"

            # gauth DB에서 조회
            ACCOUNT_JSON=$(node -e "
              const fs=require('fs');
              const d=JSON.parse(fs.readFileSync('/opt/gauth-full/accounts_normalized.json','utf8'));
              const accs=Array.isArray(d)?d:(d.accounts||[]);
              const t=accs.find(a=>(a.email||'').toLowerCase()==='$EMAIL'.toLowerCase());
              if(!t){console.log('NOT_FOUND');process.exit(0);}
              if(!t.status) t.status='active';
              if(!t.allocated_date) t.allocated_date=new Date().toISOString().slice(0,10);
              if(t.totp_secret&&!t.twofa_secret) t.twofa_secret=t.totp_secret;
              console.log(JSON.stringify(t));
            ")

            if [ "$ACCOUNT_JSON" = "NOT_FOUND" ]; then
              echo "gauth DB에 없음: $EMAIL"
              exit 1
            fi

            echo "$ACCOUNT_JSON" > /tmp/hae_memo_acct.json

            sudo node -e "
              const fs=require('fs');
              let data={};
              try{data=JSON.parse(fs.readFileSync('$ACCT_FILE','utf8'))}catch(e){}
              let accounts=Array.isArray(data)?data:(data.accounts||[]);
              const newAcct=JSON.parse(fs.readFileSync('/tmp/hae_memo_acct.json','utf8'));
              if('$MEMO') newAcct.memo='$MEMO';
              const idx=accounts.findIndex(a=>(a.email||'').toLowerCase()===(newAcct.email||'').toLowerCase());
              if(idx>=0){Object.assign(accounts[idx],newAcct);console.log('Updated');}
              else{accounts.unshift(newAcct);console.log('Added');}
              fs.writeFileSync('$ACCT_FILE',JSON.stringify({accounts},null,2));
              console.log('Total:',accounts.length);
            "

            rm -f /tmp/hae_memo_acct.json
            sudo chown www-data:www-data "$ACCT_FILE"
            sudo systemctl restart hae
            sleep 2
            sudo systemctl is-active hae && echo "hae OK" || echo "hae FAIL"
