name: 계정별 sel room_id 에 해당하는 room_<n>.json 실체 존재 확인

on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-check-room-files.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 120s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='bash -s' << "REMOTE"
            set +u
            P1="/var/www/sites/chamgyo/public/photo"

            echo "===== [1] 모든 room_*.json 파일 리스팅 ====="
            sudo ls "$P1/data/"room_*.json 2>/dev/null | xargs -n1 basename | sort -V

            echo ""
            echo "===== [2] 각 계정 sel → room_id → data/room_<id>.json 존재 여부 + 데이터 상태 ====="
            for U in aass0707 abc01 abc02 abc03 abc04 abc05 abc06 abc07 cent gain jay otuki tak; do
              F="$P1/data/sel_$U.json"
              [ ! -f "$F" ] && continue
              RID=$(sudo cat "$F" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get(\"room_id\",\"?\"))" 2>/dev/null)
              RF="$P1/data/room_${RID}.json"
              if [ -f "$RF" ]; then
                MT=$(sudo stat -c "%y" "$RF" | cut -d. -f1)
                NUMS=$(sudo cat "$RF" 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); n=d.get(\"nums\",[]); print(f'len={len(n)} tail={n[-3:] if n else []}')" 2>/dev/null)
                printf "  %-10s | room=%-6s | ✅ room_%s.json | mtime=%s | %s\n" "$U" "$RID" "$RID" "$MT" "$NUMS"
              else
                printf "  %-10s | room=%-6s | ❌ room_%s.json 없음\n" "$U" "$RID" "$RID"
              fi
            done

            echo ""
            echo "===== [3] tables.json xtd 목록 vs 계정들이 실제 요구하는 room_id ====="
            sudo cat "$P1/data/tables.json" | python3 -c "
            import sys, json, os
            d = json.load(sys.stdin)
            xtd = set(d.get(\"xtd\", []))
            print(f\"  xtd 배열: {sorted(xtd)}\")
            # 계정별 요구 room 수집
            base = \"/var/www/sites/chamgyo/public/photo/data\"
            need = set()
            for U in os.listdir(base):
                if U.startswith(\"sel_\") and U.endswith(\".json\"):
                    try:
                        obj = json.load(open(os.path.join(base, U)))
                        rid = obj.get(\"room_id\")
                        if rid: need.add(int(rid))
                    except: pass
            print(f\"  계정들이 요구하는 room_id: {sorted(need)}\")
            missing = need - xtd
            print(f\"  ❌ xtd 에 없어서 크롤링 안 되는 room: {sorted(missing)}\")
            "

            echo ""
            echo "===== [4] api_selected_room.php + api 통한 실시간 응답 (cent 기준) ====="
            DOM="xn--9d0bw2fjtyymch7de9d.info"
            for U in cent tak abc01 gain aass0707; do
              A=$(curl -sSk --resolve "$DOM:443:127.0.0.1" "https://$DOM/photo/api_selected_room.php?ch=$U")
              # room_id 추출
              RID=$(echo "$A" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get(\"room_id\",\"?\"))" 2>/dev/null)
              # data/room_<rid>.json 도 https 로
              RD=$(curl -sSk --resolve "$DOM:443:127.0.0.1" "https://$DOM/photo/data/room_${RID}.json" -o /tmp/r.json -w "%{http_code}")
              NUMS_LEN=$(cat /tmp/r.json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get(\"nums\",[])))" 2>/dev/null)
              printf "  %-10s | api=%s | room_%s.json HTTP=%s nums_len=%s\n" "$U" "$A" "$RID" "$RD" "$NUMS_LEN"
            done

            echo ""
            echo "===== DONE ====="
            REMOTE
