name: Register 16 accounts + add folder scan button
on:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-register-patch.txt']

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Copy accounts file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          source: ".github/16-channels-accounts.json"
          target: "/tmp/gauth-upload"
          strip_components: 1
      - name: Register accounts + patch index.html
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 120s
          script: |
            set -e
            echo "=== 16 계정 등록 ==="

            sudo node -e "
              const fs = require('fs');
              const newFile = '/tmp/gauth-upload/16-channels-accounts.json';
              const dbFile = '/opt/gauth-full/accounts_normalized.json';

              const newAccounts = JSON.parse(fs.readFileSync(newFile, 'utf8'));
              let db = [];
              try { db = JSON.parse(fs.readFileSync(dbFile, 'utf8')); } catch(e) { console.log('DB 새로 생성'); }
              if (!Array.isArray(db)) db = db.accounts || [];

              console.log('기존 DB: ' + db.length + '개');
              console.log('신규: ' + newAccounts.length + '개');

              const byEmail = new Map();
              const byYt = new Map();
              db.forEach((a,i) => {
                byEmail.set(a.email, i);
                if (a.youtube_url) byYt.set(a.youtube_url, i);
              });

              let updated = 0, added = 0;
              for (const na of newAccounts) {
                let existIdx = -1;
                if (na.youtube_url && byYt.has(na.youtube_url)) {
                  existIdx = byYt.get(na.youtube_url);
                }
                if (existIdx === -1 && byEmail.has(na.email)) {
                  existIdx = byEmail.get(na.email);
                }

                if (existIdx >= 0) {
                  db[existIdx] = na;
                  updated++;
                } else {
                  db.push(na);
                  added++;
                }
                byEmail.set(na.email, existIdx >= 0 ? existIdx : db.length - 1);
                if (na.youtube_url) byYt.set(na.youtube_url, existIdx >= 0 ? existIdx : db.length - 1);
              }

              fs.writeFileSync(dbFile, JSON.stringify(db, null, 2));
              console.log('완료: 갱신 ' + updated + '개, 추가 ' + added + '개, 총 ' + db.length + '개');
            "

            echo ""
            echo "=== 폴더 전체 스캔 버튼 추가 ==="
            INDEXFILE="/var/www/sites/gauth/public/index.html"

            # Check if folder scan already exists
            if sudo grep -q 'excelFolderFiles' "$INDEXFILE"; then
              echo "폴더 스캔 버튼 이미 존재"
            else
              # Add folder scan input right after the existing file input
              sudo node -e "
                const fs = require('fs');
                const f = '$INDEXFILE';
                let html = fs.readFileSync(f, 'utf8');

                // Find the excelFiles input and add folder scan after it
                const oldInput = '<input type=\"file\" id=\"excelFiles\" multiple accept=\".xlsx,.xls,.csv\"';
                const folderHTML = oldInput + ' style=\"color:#e8ecef;font-size:13px\">' +
                  '<div style=\"margin-top:8px\">' +
                  '<button id=\"excelFolderBtn\" style=\"background:#1e3a5f;color:#7dabff;border:1px solid #2b6cff;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;margin-right:8px\" ' +
                  'onclick=\"document.getElementById(\\\\\"excelFolderFiles\\\\\").click()\">' +
                  '📂 폴더 전체 스캔</button>' +
                  '<input type=\"file\" id=\"excelFolderFiles\" webkitdirectory directory multiple accept=\".xlsx,.xls,.csv\" style=\"display:none\">' +
                  '<span id=\"excelFolderInfo\" style=\"font-size:12px;color:#9fb3e0\"></span>' +
                  '</div>';

                html = html.replace(
                  '<input type=\"file\" id=\"excelFiles\" multiple accept=\".xlsx,.xls,.csv\" style=\"color:#e8ecef;font-size:13px\">',
                  folderHTML
                );

                // Add JS handler for folder scan - find the excelUpBtn handler
                const folderJS = \`
            /* 폴더 전체 스캔 핸들러 */
            (function(){
              var folderInput = document.getElementById('excelFolderFiles');
              var fileInput = document.getElementById('excelFiles');
              var info = document.getElementById('excelFolderInfo');
              if(!folderInput) return;
              folderInput.addEventListener('change', function(){
                var files = Array.from(this.files).filter(function(f){
                  return /\\\\.(xlsx|xls|csv)\$/i.test(f.name);
                });
                if(!files.length){
                  info.textContent = '❌ 엑셀 파일 없음';
                  return;
                }
                info.innerHTML = '📁 <b style=\"color:#3ddc84\">' + files.length + '</b>개 엑셀 파일 발견';
                // Transfer to main file input via DataTransfer
                var dt = new DataTransfer();
                files.forEach(function(f){ dt.items.add(f); });
                fileInput.files = dt.files;
                fileInput.dispatchEvent(new Event('change'));
              });
            })();
            \`;

                // Insert the folder JS before the closing </body> or at the end
                if(html.includes('</body>')) {
                  html = html.replace('</body>', '<script>' + folderJS + '<\/script></body>');
                } else {
                  html += '<script>' + folderJS + '<\/script>';
                }

                fs.writeFileSync(f, html);
                console.log('폴더 스캔 버튼 추가 완료');
              "
            fi

            echo ""
            echo "=== gauth 서비스 재시작 ==="
            sudo systemctl restart gauth || echo "restart warning"
            sleep 2
            sudo systemctl is-active gauth && echo "gauth 실행 중" || echo "gauth 실패"

            # Cleanup
            rm -rf /tmp/gauth-upload

            echo ""
            echo "=== 완료 ==="
