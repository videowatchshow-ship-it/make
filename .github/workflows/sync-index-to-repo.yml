name: Sync server index.html to repo
on:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-sync-index.txt']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/gauth-frontend-backend-fixes-cg2icv
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch index.html from server and push to repo
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          envs: GH_TOKEN
          script: |
            FILE="/var/www/sites/gauth/public/index.html"
            SIZE=$(wc -c < "$FILE")
            echo "index.html size: $SIZE bytes"
            if [ "$SIZE" -lt 1000 ]; then
              echo "ERROR: file too small"
              exit 1
            fi
            grep -c 'excelFolderFiles' "$FILE" && echo "폴더스캔 있음" || echo "WARNING: 폴더스캔 없음"

            CONTENT=$(base64 -w 0 "$FILE")

            SHA=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/videowatchshow-ship-it/make/contents/gauth-public/index.html?ref=claude/gauth-frontend-backend-fixes-cg2icv" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")

            echo "Existing SHA: $SHA"

            TMPJSON=$(mktemp)
            if [ -n "$SHA" ]; then
              python3 -c "
import json
with open('$TMPJSON','w') as f:
    json.dump({'message':'Sync server index.html (single source of truth)','content':'$CONTENT','branch':'claude/gauth-frontend-backend-fixes-cg2icv','sha':'$SHA'},f)
"
            else
              python3 -c "
import json
with open('$TMPJSON','w') as f:
    json.dump({'message':'Sync server index.html (single source of truth)','content':'$CONTENT','branch':'claude/gauth-frontend-backend-fixes-cg2icv'},f)
"
            fi

            RESULT=$(curl -s -w "\n%{http_code}" -X PUT \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/json" \
              -d @"$TMPJSON" \
              "https://api.github.com/repos/videowatchshow-ship-it/make/contents/gauth-public/index.html")

            rm -f "$TMPJSON"

            HTTP_CODE=$(echo "$RESULT" | tail -1)
            echo "HTTP response: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
              echo "=== 동기화 완료 ==="
            else
              echo "$RESULT" | head -5
              exit 1
            fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
