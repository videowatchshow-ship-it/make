name: Sync server index.html to repo
on:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-sync-index.txt']

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/gauth-frontend-backend-fixes-cg2icv
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GAUTH_SSH_KEY }}

      - name: Download index.html from server
        env:
          SSH_HOST: ${{ secrets.GAUTH_HOST }}
          SSH_USER: ${{ secrets.GAUTH_USER }}
        run: |
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Copy on server (needs sudo)
          ssh "$SSH_USER@$SSH_HOST" \
            "sudo cp /var/www/sites/gauth/public/index.html /tmp/gauth_index_download.html && sudo chmod 644 /tmp/gauth_index_download.html && wc -c < /tmp/gauth_index_download.html"

          # Download via scp
          scp "$SSH_USER@$SSH_HOST:/tmp/gauth_index_download.html" ./gauth_index_download.html

          # Cleanup server
          ssh "$SSH_USER@$SSH_HOST" "rm -f /tmp/gauth_index_download.html"

      - name: Validate and commit
        run: |
          ls -la gauth_index_download.html
          mkdir -p gauth-public
          mv gauth_index_download.html gauth-public/index.html
          SIZE=$(wc -c < gauth-public/index.html)
          echo "index.html size: $SIZE bytes"
          if [ "$SIZE" -lt 1000 ]; then
            echo "ERROR: file too small ($SIZE bytes)"
            exit 1
          fi
          grep -c 'excelFolderFiles' gauth-public/index.html && echo "폴더스캔 있음" || echo "WARNING: 폴더스캔 없음"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add gauth-public/index.html
          git diff --cached --stat
          git commit -m "Sync server index.html to repo (single source of truth)" || echo "No changes"
          git push origin claude/gauth-frontend-backend-fixes-cg2icv
