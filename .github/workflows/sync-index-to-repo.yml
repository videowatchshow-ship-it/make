name: Sync server index.html to repo
on:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-sync-index.txt']

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/gauth-frontend-backend-fixes-cg2icv
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch index.html base64 from server
        id: fetch
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 30s
          script: |
            echo "B64_START"
            sudo base64 -w0 /var/www/sites/gauth/public/index.html
            echo ""
            echo "B64_END"
      - name: Extract and commit
        env:
          SSH_OUTPUT: ${{ steps.fetch.outputs.stdout }}
        run: |
          echo "$SSH_OUTPUT" | sed -n '/^B64_START$/,/^B64_END$/p' | grep -v 'B64_START\|B64_END' | base64 -d > gauth-public/index.html
          SIZE=$(wc -c < gauth-public/index.html)
          echo "index.html size: $SIZE bytes"
          if [ "$SIZE" -lt 1000 ]; then
            echo "ERROR: file too small, aborting"
            exit 1
          fi
          grep -c 'excelFolderFiles' gauth-public/index.html && echo "폴더스캔 버튼 있음" || echo "WARNING: 폴더스캔 없음"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add gauth-public/index.html
          git diff --cached --stat
          git commit -m "Sync server index.html to repo (single source of truth)" || echo "No changes"
          git push origin claude/gauth-frontend-backend-fixes-cg2icv
