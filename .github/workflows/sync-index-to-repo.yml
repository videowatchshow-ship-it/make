name: Sync server index.html to repo
on:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-sync-index.txt']

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/gauth-frontend-backend-fixes-cg2icv
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch index.html from server and push to repo
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          envs: GH_TOKEN
          script: |
            FILE="/var/www/sites/gauth/public/index.html"
            SIZE=$(wc -c < "$FILE")
            echo "index.html size: $SIZE bytes"
            if [ "$SIZE" -lt 1000 ]; then
              echo "ERROR: file too small"
              exit 1
            fi
            grep -c 'excelFolderFiles' "$FILE" && echo "폴더스캔 있음" || echo "WARNING: 폴더스캔 없음"

            # Base64 encode
            CONTENT=$(base64 -w 0 "$FILE")

            # Get current file SHA (if exists)
            SHA=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/videowatchshow-ship-it/make/contents/gauth-public/index.html?ref=claude/gauth-frontend-backend-fixes-cg2icv" \
              | grep '"sha"' | head -1 | sed 's/.*"sha": *"\(.*\)".*/\1/')

            echo "Existing SHA: $SHA"

            # Build JSON payload
            if [ -n "$SHA" ] && [ "$SHA" != "" ]; then
              PAYLOAD=$(printf '{"message":"Sync server index.html (single source of truth)","content":"%s","branch":"claude/gauth-frontend-backend-fixes-cg2icv","sha":"%s"}' "$CONTENT" "$SHA")
            else
              PAYLOAD=$(printf '{"message":"Sync server index.html (single source of truth)","content":"%s","branch":"claude/gauth-frontend-backend-fixes-cg2icv"}' "$CONTENT")
            fi

            # Push to GitHub
            RESULT=$(curl -s -w "\n%{http_code}" -X PUT \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "https://api.github.com/repos/videowatchshow-ship-it/make/contents/gauth-public/index.html")

            HTTP_CODE=$(echo "$RESULT" | tail -1)
            echo "HTTP response: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
              echo "=== 동기화 완료 ==="
            else
              echo "$RESULT" | head -5
              exit 1
            fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
