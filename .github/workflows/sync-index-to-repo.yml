name: Sync server index.html to repo
on:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-sync-index.txt']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/gauth-frontend-backend-fixes-cg2icv
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push server index.html to repo via GitHub API
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          envs: GH_TOKEN
          script: |
            set -e
            FILE="/var/www/sites/gauth/public/index.html"
            SIZE=$(wc -c < "$FILE")
            echo "size: $SIZE bytes"
            test "$SIZE" -gt 1000
            base64 -w 0 "$FILE" > /tmp/b64.txt
            SHA=$(curl -sf -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/videowatchshow-ship-it/make/contents/gauth-public/index.html?ref=claude/gauth-frontend-backend-fixes-cg2icv" \
              2>/dev/null | grep -o '"sha":"[^"]*"' | head -1 | cut -d'"' -f4 || true)
            echo "sha: $SHA"
            export FILE_SHA="$SHA"
            python3 -c '
            import json, os
            with open("/tmp/b64.txt") as f:
                content = f.read().strip()
            d = {"message":"Sync server index.html","content":content,"branch":"claude/gauth-frontend-backend-fixes-cg2icv"}
            sha = os.environ.get("FILE_SHA","")
            if sha:
                d["sha"] = sha
            with open("/tmp/payload.json","w") as f:
                json.dump(d, f)
            print("payload built, content length:", len(content))
            '
            HTTP=$(curl -s -o /tmp/api_result.txt -w "%{http_code}" -X PUT \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/json" \
              -d @/tmp/payload.json \
              "https://api.github.com/repos/videowatchshow-ship-it/make/contents/gauth-public/index.html")
            echo "HTTP: $HTTP"
            if [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ]; then
              echo "=== done ==="
            else
              cat /tmp/api_result.txt | head -3
              exit 1
            fi
            rm -f /tmp/b64.txt /tmp/payload.json /tmp/api_result.txt
