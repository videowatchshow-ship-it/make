name: Stream edit - download YouTube section to server

on:
  push:
    branches: [claude/youtube-video-edit-stream-r4ftcx]
    paths: ['.github/workflows/stream-edit-download.yml']
  workflow_dispatch:
    inputs:
      video_id:
        description: 'YouTube video ID'
        default: 'Bz8z1_pj-Lk'
        required: true
      start:
        description: 'Start time (HH:MM:SS)'
        default: '00:02:00'
        required: true
      end:
        description: 'End time (HH:MM:SS)'
        default: '00:28:00'
        required: true

jobs:
  download-and-ship:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VID: ${{ github.event.inputs.video_id || 'Bz8z1_pj-Lk' }}
      START: ${{ github.event.inputs.start || '00:02:00' }}
      END: ${{ github.event.inputs.end || '00:28:00' }}
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pipx install "yt-dlp[default]" || pip install --user -U "yt-dlp[default]"
          pipx inject yt-dlp bgutil-ytdlp-pot-provider || pip install --user -U bgutil-ytdlp-pot-provider
          curl -fsSL https://deno.land/install.sh | DENO_INSTALL="$HOME/.deno" sh -s -- -y
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Start PO token provider
        run: |
          git clone --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider /tmp/bgutil-pot
          cd /tmp/bgutil-pot/server
          npm install --no-audit --no-fund --silent
          npx tsc
          nohup node build/main.js > /tmp/bgutil-pot.log 2>&1 &
          for i in $(seq 1 15); do
            sleep 2
            curl -fsS -m 3 http://127.0.0.1:4416/ping >/dev/null 2>&1 && { echo provider up; exit 0; }
          done
          echo "provider failed"; tail -40 /tmp/bgutil-pot.log; exit 1

      - name: Download and cut section
        run: |
          OUT="/tmp/${VID}_${START//:/-}_${END//:/-}.mp4"
          yt-dlp -v \
            --download-sections "*${START}-${END}" \
            -f "bv*[height<=1080]+ba/b" \
            --merge-output-format mp4 \
            --force-keyframes-at-cuts \
            -o "$OUT" \
            "https://www.youtube.com/watch?v=${VID}" 2> >(tail -80 >&2)
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          ls -lh "$OUT"
          sha256sum "$OUT" | tee /tmp/sha_runner.txt
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$OUT"

      - name: Copy to server /opt/stream
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          source: ${{ env.OUT }}
          target: /tmp/stream-incoming/
          strip_components: 1

      - name: Move into place and verify on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            sudo mkdir -p /opt/stream
            sudo mv /tmp/stream-incoming/*.mp4 /opt/stream/
            echo "=== SERVER RESULT ==="
            ls -lh /opt/stream/
            sha256sum /opt/stream/*.mp4
