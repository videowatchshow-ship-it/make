name: fix-login-cache
on:
  push:
    paths:
      - '.github/workflows/fix-login-cache.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_IP: "187.53.133.145"
      VPS_PASS_B64: "LWFhMGNLMDtibzJRNkxnMg=="
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Dump login.html
        run: |
          export SSHPASS=$(echo "$VPS_PASS_B64" | base64 -d)
          SSH="sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@$VPS_IP"
          BASE="/var/www/sites/chamgyo/public"
          echo "===== login.html ====="
          $SSH "cat $BASE/photo/login.html"
          echo ""
          echo "===== index.html ====="
          $SSH "cat $BASE/photo/index.html"

      - name: Fix login and add no-cache
        run: |
          export SSHPASS=$(echo "$VPS_PASS_B64" | base64 -d)
          SSH="sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@$VPS_IP"
          BASE="/var/www/sites/chamgyo/public"

          for dir in photo photo2 photo3; do
            $SSH "sed -i 's|CAH_1\.html|select.html|g' $BASE/$dir/login.html 2>/dev/null; echo done-$dir"
          done

          echo "===== Add no-cache meta ====="
          for dir in photo photo2 photo3; do
            $SSH "grep -q 'no-cache' $BASE/$dir/login.html 2>/dev/null || sed -i 's|<head>|<head><meta http-equiv=\"Cache-Control\" content=\"no-cache\"><meta http-equiv=\"Pragma\" content=\"no-cache\">|' $BASE/$dir/login.html 2>/dev/null; echo nocache-$dir"
          done

          echo "===== Create .htaccess via python3 ====="
          $SSH "python3 -c \"
          ht = '<FilesMatch \\\"\\\\.(html|js|json)\\$\\\">\\nHeader set Cache-Control \\\"no-cache, no-store, must-revalidate\\\"\\nHeader set Pragma \\\"no-cache\\\"\\n</FilesMatch>\\n'
          for d in ['photo','photo2','photo3']:
              p = '$BASE/' + d + '/.htaccess'
              open(p,'w').write(ht)
              print('Created ' + p)
          \""

          echo "===== Verify ====="
          $SSH "grep -o 'select\.html\|CAH_1\.html' $BASE/photo/login.html | head -5"
          $SSH "grep -c 'CAH_1' $BASE/photo/login.html && echo 'STILL HAS CAH_1' || echo 'CAH_1 GONE'"

      - name: Purge CF
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/7e5faed2d3d4d6da7aceb4ddde81a62b/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' | python3 -c "import sys,json;d=json.load(sys.stdin);print('CF Purge:', 'OK' if d.get('success') else d)"

      - name: Verify live
        run: |
          sleep 5
          DOMAIN="xn--9d0bw2fjtyymch7de9d.info"
          echo "===== login.html redirect ====="
          curl -sS "https://$DOMAIN/photo/login.html?v=$(date +%s)" --max-time 10 | grep -o 'select\.html\|CAH_1\.html' | head -5
          echo "===== select.html ====="
          curl -sS -o /dev/null -w "select.html: HTTP %{http_code} | size %{size_download}\n" "https://$DOMAIN/photo/select.html?v=$(date +%s)" --max-time 10
