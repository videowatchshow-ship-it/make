name: Fix DNS + SSL for win/second
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths:
      - '.github/workflows/fix-dns-and-ssl.yml'
      - '.github/scripts/create-second-ssl-vhost.sh'
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Get server IP and Cloudflare zone ID, add DNS records
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          # Get server IP via SSH host secret — we need the IP separately
          # Get Cloudflare zone for cent-solution.online
          ZONE_RESP=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=cent-solution.online" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json")
          echo "Zone response: $ZONE_RESP"
          ZONE_ID=$(echo "$ZONE_RESP" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['result'][0]['id'])" 2>/dev/null)
          echo "Zone ID: $ZONE_ID"
          if [ -z "$ZONE_ID" ]; then
            echo "Failed to get zone ID — aborting DNS step"
            exit 0
          fi

          # Get server IP from existing A record (e.g. gauth.cent-solution.online which works)
          IP_RESP=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=A&name=gauth.cent-solution.online" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json")
          SERVER_IP=$(echo "$IP_RESP" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['result'][0]['content'])" 2>/dev/null)
          echo "Server IP (from gauth A record): $SERVER_IP"

          if [ -z "$SERVER_IP" ]; then
            echo "Could not determine server IP — aborting DNS step"
            exit 0
          fi

          # Add DNS records for win and second (proxied = true)
          for SUBDOMAIN in win second; do
            FQDN="${SUBDOMAIN}.cent-solution.online"
            # Check if record exists
            EXISTING=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=A&name=$FQDN" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json")
            EXISTING_ID=$(echo "$EXISTING" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['result'][0]['id'])" 2>/dev/null)

            if [ -n "$EXISTING_ID" ]; then
              echo "$FQDN: 기존 레코드 있음 (id=$EXISTING_ID), 업데이트"
              RESULT=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$EXISTING_ID" \
                -H "Authorization: Bearer $CF_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"type\":\"A\",\"name\":\"$FQDN\",\"content\":\"$SERVER_IP\",\"proxied\":true,\"ttl\":1}")
            else
              echo "$FQDN: 신규 레코드 추가"
              RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
                -H "Authorization: Bearer $CF_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"type\":\"A\",\"name\":\"$FQDN\",\"content\":\"$SERVER_IP\",\"proxied\":true,\"ttl\":1}")
            fi
            echo "$FQDN 결과: $(echo $RESULT | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('success'), d.get('result',{}).get('id',''))" 2>/dev/null)"
          done

          # Also ensure SSL/TLS mode is Full (not strict) for the zone
          SSL_RESP=$(curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/ssl" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"value":"full"}')
          echo "SSL 모드 설정: $(echo $SSL_RESP | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('success'))" 2>/dev/null)"

      - name: Wait for DNS to propagate
        run: sleep 30

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          source: ".github/scripts/create-second-ssl-vhost.sh"
          target: "/tmp/css/"
          strip_components: 2

      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 120s
          script: |
            sudo bash /tmp/css/create-second-ssl-vhost.sh
            rm -rf /tmp/css

      - name: Verify endpoints
        run: |
          sleep 10
          for site in win second; do
            echo -n "$site: "
            curl -sk --max-time 10 "https://${site}.cent-solution.online/codes/UW6E7MNML5TB3PXCVWRLJV2W2PIBKB2L" -w " http=%{http_code}\n" 2>/dev/null
          done
