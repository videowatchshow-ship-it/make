name: deploy accounts.html + nav menu

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['gauth-public/accounts.html', 'jump/accounts.html', 'gauth-public/subsites.html']

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Copy accounts.html to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          source: "gauth-public/accounts.html,gauth-public/subsites.html,jump/accounts.html"
          target: "/tmp/gauth-accounts-deploy"
          strip_components: 0
          overwrite: true

      - name: Install and add nav
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            set -e
            GPUB=/var/www/sites/gauth/public
            JPUB=/var/www/sites/jump/public

            echo "=== 1. Deploy gauth accounts.html + subsites.html ==="
            sudo cp /tmp/gauth-accounts-deploy/gauth-public/accounts.html "$GPUB/accounts.html"
            sudo cp /tmp/gauth-accounts-deploy/gauth-public/subsites.html "$GPUB/subsites.html"
            sudo chown www-data:www-data "$GPUB/accounts.html" "$GPUB/subsites.html" 2>/dev/null || true

            echo "=== 2. Deploy jump accounts.html ==="
            sudo cp /tmp/gauth-accounts-deploy/jump/accounts.html "$JPUB/accounts.html"
            sudo chown www-data:www-data "$JPUB/accounts.html" 2>/dev/null || true

            rm -rf /tmp/gauth-accounts-deploy

            echo "=== 3. Verify ==="
            for f in accounts.html subsites.html; do
              echo "gauth/$f: $(wc -c < "$GPUB/$f") bytes"
            done
            echo "jump/accounts.html: $(wc -c < "$JPUB/accounts.html") bytes"
            echo "DONE"
