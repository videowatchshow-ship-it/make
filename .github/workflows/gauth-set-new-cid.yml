name: gauth set new client id

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-new-cid.txt']

jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set GOOGLE_OAUTH_CLIENT_ID to new client + restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            CID='956283750273-30t6q00h5idrl9olghtr1lm8bsum2tpq.apps.googleusercontent.com'
            echo '=== save to .env ==='
            sudo sed -i '/^GOOGLE_OAUTH_CLIENT_ID=/d' /opt/gauth-full/.env 2>/dev/null || true
            echo "GOOGLE_OAUTH_CLIENT_ID=$CID" | sudo tee -a /opt/gauth-full/.env > /dev/null
            echo '=== systemd drop-in ==='
            sudo mkdir -p /etc/systemd/system/gauth.service.d
            printf '[Service]\nEnvironment=\"GOOGLE_OAUTH_CLIENT_ID=%s\"\n' "$CID" | sudo tee /etc/systemd/system/gauth.service.d/google-oauth.conf > /dev/null
            sudo systemctl daemon-reload
            sudo systemctl restart gauth
            sleep 2
            sudo systemctl is-active gauth
            echo '=== verify /api/auth/config now returns new client ==='
            curl -s --max-time 10 http://localhost:4000/api/auth/config
            echo ''
            echo 'front page client_id:'
            curl -s --max-time 10 https://gauth.cent-solution.online/ | grep -oE '956283750273-[a-z0-9]+\.apps\.googleusercontent\.com' | sort -u | head
