name: Test photo3 verify 20

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Server 20-item test
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 180s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='
            P3="/var/www/sites/chamgyo/public/photo3"
            P1="/var/www/sites/chamgyo/public/photo"
            PASS=0; FAIL=0

            t(){ if [ "$1" = "OK" ]; then PASS=$((PASS+1)); echo "✅ [$2] $3"; else FAIL=$((FAIL+1)); echo "❌ [$2] $3 — $4"; fi; }

            echo "========== photo3 검증 20항목 =========="

            # 1. CAH_1.html 존재
            [ -f "$P3/CAH_1.html" ] && t OK 1 "CAH_1.html 존재" || t FAIL 1 "CAH_1.html 존재" "파일 없음"

            # 2. 파일 크기 > 10KB (photo 8KB 복사본 아님)
            SZ=$(stat -c%s "$P3/CAH_1.html" 2>/dev/null || echo 0)
            [ "$SZ" -gt 10000 ] && t OK 2 "파일 크기 ${SZ}B (>10KB)" || t FAIL 2 "파일 크기 확인" "${SZ}B — photo 복사본 의심"

            # 3. photo3 != photo (MD5 다름)
            M3=$(md5sum "$P3/CAH_1.html" 2>/dev/null | cut -d" " -f1)
            M1=$(md5sum "$P1/CAH_1.html" 2>/dev/null | cut -d" " -f1)
            [ "$M3" != "$M1" ] && t OK 3 "photo3 != photo (MD5 다름)" || t FAIL 3 "photo3 != photo" "MD5 동일 — photo 복사본"

            # 4. DOCTYPE html
            head -1 "$P3/CAH_1.html" | grep -qi "doctype html" && t OK 4 "DOCTYPE html" || t FAIL 4 "DOCTYPE html" "없음"

            # 5. viewport meta
            grep -qi "viewport" "$P3/CAH_1.html" && t OK 5 "viewport meta" || t FAIL 5 "viewport meta" "없음"

            # 6. title 태그
            TITLE=$(grep -oP "(?<=<title>)[^<]+" "$P3/CAH_1.html" | head -1)
            [ -n "$TITLE" ] && t OK 6 "title 태그: $TITLE" || t FAIL 6 "title 태그" "없음"

            # 7. bgl.js 상대경로 (절대경로 /photo/ 아님)
            grep -q "src=\"bgl.js" "$P3/CAH_1.html" && t OK 7 "bgl.js 상대경로" || t FAIL 7 "bgl.js 상대경로" "절대경로 사용"

            # 8. dragon_fx.js 상대경로
            grep -q "src=\"dragon_fx.js" "$P3/CAH_1.html" && t OK 8 "dragon_fx.js 상대경로" || t FAIL 8 "dragon_fx.js 상대경로" "절대경로 사용"

            # 9. body CSS (margin:0)
            grep -q "margin.*:.*0" "$P3/CAH_1.html" && t OK 9 "body margin:0" || t FAIL 9 "body margin:0" "없음"

            # 10. .htaccess CORS 없음
            if [ -f "$P3/.htaccess" ]; then
              grep -qi "Access-Control" "$P3/.htaccess" && t FAIL 10 ".htaccess CORS 없음" "CORS 헤더 발견" || t OK 10 ".htaccess CORS 없음"
            else
              t FAIL 10 ".htaccess CORS 없음" ".htaccess 파일 없음"
            fi

            # 11. .htaccess 커스텀 헤더 없음
            if [ -f "$P3/.htaccess" ]; then
              grep -qi "X-Photo3" "$P3/.htaccess" && t FAIL 11 "커스텀 헤더 없음" "X-Photo3 발견" || t OK 11 "커스텀 헤더 없음"
            else
              t FAIL 11 "커스텀 헤더 없음" ".htaccess 없음"
            fi

            # 12. .htaccess FollowSymLinks
            if [ -f "$P3/.htaccess" ]; then
              grep -q "FollowSymLinks" "$P3/.htaccess" && t OK 12 "FollowSymLinks" || t FAIL 12 "FollowSymLinks" "없음"
            else
              t FAIL 12 "FollowSymLinks" ".htaccess 없음"
            fi

            # 13. bgl.js HTTP 200
            S=$(curl -so /dev/null -w "%{http_code}" "http://localhost/photo3/bgl.js")
            [ "$S" = "200" ] && t OK 13 "bgl.js HTTP $S" || t FAIL 13 "bgl.js HTTP" "$S"

            # 14. dragon_fx.js HTTP 200
            S=$(curl -so /dev/null -w "%{http_code}" "http://localhost/photo3/dragon_fx.js")
            [ "$S" = "200" ] && t OK 14 "dragon_fx.js HTTP $S" || t FAIL 14 "dragon_fx.js HTTP" "$S"

            # 15. data/sel_tak.json HTTP 200
            S=$(curl -so /dev/null -w "%{http_code}" "http://localhost/photo3/data/sel_tak.json")
            [ "$S" = "200" ] && t OK 15 "data/sel_tak.json HTTP $S" || t FAIL 15 "data/sel_tak.json HTTP" "$S"

            # 16. data 심볼릭 → photo2/data
            if [ -L "$P3/data" ]; then
              TGT=$(readlink "$P3/data")
              echo "$TGT" | grep -q "photo2" && t OK 16 "data 심볼릭 → $TGT" || t FAIL 16 "data 심볼릭" "→ $TGT (photo2 아님)"
            else
              t FAIL 16 "data 심볼릭" "심볼릭 아님"
            fi

            # 17. hot-patch.js HTTP 200
            S=$(curl -so /dev/null -w "%{http_code}" "http://localhost/photo3/hot-patch.js")
            [ "$S" = "200" ] && t OK 17 "hot-patch.js HTTP $S" || t FAIL 17 "hot-patch.js HTTP" "$S"

            # 18. write.php HTTP 200
            S=$(curl -so /dev/null -w "%{http_code}" "http://localhost/photo3/write.php")
            [ "$S" = "200" ] && t OK 18 "write.php HTTP $S" || t FAIL 18 "write.php HTTP" "$S"

            # 19. CAH_1.html HTTP 200
            S=$(curl -so /dev/null -w "%{http_code}" "http://localhost/photo3/CAH_1.html?ch=tak")
            [ "$S" = "200" ] && t OK 19 "CAH_1.html HTTP $S" || t FAIL 19 "CAH_1.html HTTP" "$S"

            # 20. photo3 경로 독립 (photo 응답과 크기 다름)
            SZ3=$(curl -s "http://localhost/photo3/CAH_1.html?ch=tak" | wc -c)
            SZ1=$(curl -s "http://localhost/photo/CAH_1.html?ch=tak" | wc -c)
            [ "$SZ3" != "$SZ1" ] && t OK 20 "응답 크기 독립 (photo3:${SZ3} != photo:${SZ1})" || t FAIL 20 "응답 크기 독립" "photo3:${SZ3} = photo:${SZ1}"

            echo ""
            echo "========================================="
            echo "결과: ✅ $PASS / ❌ $FAIL / 총 $((PASS+FAIL))"
            echo "========================================="

            echo ""
            echo "===== 추가 정보 ====="
            echo "photo3 파일 크기: $(stat -c%s "$P3/CAH_1.html")B"
            echo "photo3 title: $(grep -oP "(?<=<title>)[^<]+" "$P3/CAH_1.html" | head -1)"
            echo "photo3 .htaccess:"
            cat "$P3/.htaccess" 2>/dev/null || echo "(없음)"
            echo "===== CSS layout ====="
            grep -n "full_box\|container\|width.*100\|height.*100\|가로\|세로" "$P3/CAH_1.html" | head -15
            echo "===== canvas ====="
            grep -n "canvas\|cBead\|cBox" "$P3/CAH_1.html" | head -10
            echo "===== DONE ====="
            '

      - name: External verify
        if: always()
        run: |
          echo "===== 외부 접근 검증 ====="
          S=$(curl -so /dev/null -w '%{http_code}' "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak&_t=$(date +%s)" 2>/dev/null)
          SZ=$(curl -s "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak&_t=$(date +%s)" 2>/dev/null | wc -c)
          echo "HTTP: $S, Size: ${SZ}B"
          H=$(curl -sI "https://xn--9d0bw2fjtyymch7de9d.info/photo3/CAH_1.html?ch=tak&_t=$(date +%s)" 2>/dev/null)
          echo "$H" | grep -i "access-control" && echo "❌ CORS 발견" || echo "✅ CORS 없음"
          echo "$H" | grep -i "x-photo3" && echo "❌ 커스텀 헤더 발견" || echo "✅ 커스텀 헤더 없음"
          echo ""
          echo "===== 리소스 접근 ====="
          for r in bgl.js dragon_fx.js data/sel_tak.json hot-patch.js; do
            RS=$(curl -so /dev/null -w '%{http_code}' "https://xn--9d0bw2fjtyymch7de9d.info/photo3/$r" 2>/dev/null)
            [ "$RS" = "200" ] && echo "✅ $r → $RS" || echo "❌ $r → $RS"
          done
