name: room_110.json 실제 데이터 vs 뷰 표시 대조

on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-check-room110.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 120s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='bash -s' << "REMOTE"
            set +u
            P1="/var/www/sites/chamgyo/public/photo"

            echo "===== [1] room_110.json 전체 실제 데이터 ====="
            sudo cat "$P1/data/room_110.json"
            echo ""
            echo "  파일 mtime: $(sudo stat -c %y "$P1/data/room_110.json")"
            echo "  파일 크기: $(sudo stat -c %s "$P1/data/room_110.json") bytes"

            echo ""
            echo "===== [2] nums 배열 P/B/T 개수 파싱 ====="
            sudo cat "$P1/data/room_110.json" | python3 -c "
            import sys, json
            d = json.load(sys.stdin)
            nums = d.get('nums', [])
            print(f'  ver: {d.get(\"ver\")}')
            print(f'  server_time: {d.get(\"server_time\")}')
            print(f'  nums 개수: {len(nums)}')
            print(f'  nums 전체: {nums}')
            p = sum(1 for n in nums if n and n[0]=='P')
            b = sum(1 for n in nums if n and n[0]=='B')
            t = sum(1 for n in nums if n and n[0]=='T')
            print(f'  P(플레이어)={p}  B(뱅커)={b}  T(타이)={t}')
            # bp/pp 페어 카운트
            bp = sum(1 for n in nums if len(n)>=2 and n[1]=='1')
            pp = sum(1 for n in nums if len(n)>=3 and n[2]=='1')
            print(f'  뱅커페어={bp}  플레이어페어={pp}')
            "

            echo ""
            echo "===== [3] api_selected_room + api_all_rooms 응답 (참고) ====="
            DOM="xn--9d0bw2fjtyymch7de9d.info"
            curl -sSk --resolve "$DOM:443:127.0.0.1" "https://$DOM/photo/data/room_110.json?t=$(date +%s)" | head -300

            echo ""
            echo "===== [4] collector 로그 - 최근 110 크롤링 ====="
            sudo tail -n 200 /var/log/chamgyo-photo3-collector.log 2>/dev/null | grep "110\|room_110" | tail -20 || echo "  (로그 없음)"

            echo ""
            echo "===== [5] xtd6688 원본 API 응답 (방 apiId=110 이면 자체, 그 외 매핑) ====="
            # tables.json 에서 110 매핑 확인
            sudo cat "$P1/data/tables.json" | python3 -c "
            import sys, json
            d = json.load(sys.stdin)
            xm = d.get('xtd_map', {})
            print(f'  xtd_map 에 110 매핑: {xm.get(\"110\", \"없음\")}')
            xtd = d.get('xtd', [])
            print(f'  xtd 배열 안 110 있음? {110 in xtd}')
            "

            echo ""
            echo "===== [6] room_110 원본 upstream (신천지 성천지) 확인 ====="
            # 100번대는 성천지 계열
            echo "  100번대 방들 (성천지 계열) 파일 mtime:"
            for R in 101 102 103 105 106 107 108 109 110; do
              F="$P1/data/room_$R.json"
              if [ -f "$F" ]; then
                MT=$(sudo stat -c "%y" "$F" | cut -d. -f1)
                NL=$(sudo cat "$F" 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);print(len(d.get('nums',[])))" 2>/dev/null)
                printf "  room_%s.json | mtime=%s | nums=%s\n" "$R" "$MT" "$NL"
              fi
            done

            echo ""
            echo "===== [7] cron 크롤러 파일 목록 (누가 100번대 크롤링?) ====="
            sudo ls -la /etc/cron.d/chamgyo* 2>/dev/null
            for CF in /etc/cron.d/chamgyo*; do
              [ -f "$CF" ] && echo "--- $CF ---" && sudo cat "$CF"
            done

            echo ""
            echo "===== DONE ====="
            REMOTE
