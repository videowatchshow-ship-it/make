name: Fix CAH_1 room selection bug

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose and fix via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 34.104.233.35
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            set -euo pipefail
            PHOTO="/var/www/sites/chamgyo/public/photo"
            DATA="$PHOTO/data"
            echo "===== [1/7] 파일 구조 ====="
            ls -la "$PHOTO/" 2>/dev/null || echo "photo dir not found"
            ls -la "$DATA/" 2>/dev/null | head -20 || echo "data dir not found"
            echo ""
            echo "===== [2/7] sel_cent.json ====="
            cat "$DATA/sel_cent.json" 2>/dev/null || echo "not found"
            echo ""
            echo "===== [3/7] api_selected_room.php 원본 ====="
            cat "$PHOTO/api_selected_room.php" 2>/dev/null || echo "NOT FOUND"
            echo ""
            echo "===== [4/7] CAH_1.html 폴링 관련 줄 ====="
            grep -n -i 'selected\|room_id\|setInterval\|fetch.*api_selected\|loadRoom\|\.json' "$PHOTO/CAH_1.html" 2>/dev/null | head -60 || echo "not found"
            echo ""
            echo "===== [5/7] api_selected_room.php 캐시 헤더 패치 ====="
            API="$PHOTO/api_selected_room.php"
            if [ -f "$API" ]; then
              cp "$API" "${API}.bak"
              if grep -q 'Cache-Control' "$API"; then
                echo "Cache-Control already present"
              else
                sudo sed -i '/<\?php/a header("Cache-Control: no-cache, no-store, must-revalidate"); header("Pragma: no-cache"); header("Expires: 0");' "$API"
                echo "added no-cache headers"
              fi
              if ! grep -q 'clearstatcache' "$API"; then
                sudo sed -i '/file_get_contents/i clearstatcache(true);' "$API" 2>/dev/null || true
                echo "added clearstatcache"
              fi
              echo "--- patched file ---"
              cat "$API"
            fi
            echo ""
            echo "===== [6/7] CAH_1.html fetch cache-busting ====="
            CAH="$PHOTO/CAH_1.html"
            if [ -f "$CAH" ]; then
              cp "$CAH" "${CAH}.bak"
              if grep -q '_t=.*Date.now' "$CAH"; then
                echo "cache-busting already exists"
              else
                sudo sed -i "s|fetch(\(['\"].*api_selected_room[^)]*\))|fetch(\1, {cache:'no-store'})|g" "$CAH" 2>/dev/null || true
                sudo sed -i "s|api_selected_room\.php?ch=|api_selected_room.php?ch='+ch+'\&_t='+Date.now()+'|g" "$CAH" 2>/dev/null || true
                echo "added cache-busting to fetch"
              fi
              if grep -q 'room_.*\.json' "$CAH"; then
                sudo sed -i "s|fetch(\(['\"].*room_[^)]*\.json[^)]*\))|fetch(\1, {cache:'no-store'})|g" "$CAH" 2>/dev/null || true
                echo "added no-store to room_N.json fetch"
              fi
              echo "--- patched fetch lines ---"
              grep -n 'fetch\|api_selected_room\|room_.*json' "$CAH" | head -30
            fi
            echo ""
            echo "===== [7/7] .htaccess cache rules ====="
            HT="$PHOTO/.htaccess"
            if [ -f "$HT" ] && grep -q 'api_selected_room' "$HT"; then
              echo "htaccess rules already exist"
            else
              printf '\n<FilesMatch "api_selected_room\\.php$">\n  Header set Cache-Control "no-cache, no-store, must-revalidate"\n  Header set Pragma "no-cache"\n  Header set Expires "0"\n</FilesMatch>\n<FilesMatch "sel_.*\\.json$">\n  Header set Cache-Control "no-cache, no-store, must-revalidate"\n  Header set Pragma "no-cache"\n  Header set Expires "0"\n</FilesMatch>\n<FilesMatch "room_.*\\.json$">\n  Header set Cache-Control "no-cache, no-store, must-revalidate"\n  Header set Pragma "no-cache"\n  Header set Expires "0"\n</FilesMatch>\n' | sudo tee -a "$HT"
              echo "added htaccess cache rules"
            fi
            sudo apachectl configtest 2>&1 || true
            sudo systemctl reload apache2 2>&1 || echo "apache reload failed"
            echo "DONE"

      - name: Purge Cloudflare cache
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_TOKEN2: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          TOKEN="${CF_TOKEN:-$CF_TOKEN2}"
          ZONE="${CF_ZONE:-7e5faed2d3d4d6da7aceb4ddde81a62b}"
          if [ -z "$TOKEN" ]; then
            echo "No Cloudflare token found"
            exit 0
          fi
          echo "Purging cache..."
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/purge_cache" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | jq .
          echo "Cache purged"
