name: denny 최종 제거 (login_check.php + write_url.php 잔재)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-fix-master-dropdown.yml'

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 180s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='bash -s' << "REMOTE"
            set -uo pipefail
            P1="/var/www/sites/chamgyo/public/photo"
            TS=$(date +%s)

            echo "===== [1] BEFORE - denny 참조 grep ====="
            for F in login_check.php write_url.php; do
              echo "--- $F ---"
              sudo grep -n "denny" "$P1/$F" 2>/dev/null | head -20
            done

            echo ""
            echo "===== [2] login_check.php 소스 앞 60줄 (\$ACCOUNTS 확인) ====="
            sudo head -60 "$P1/login_check.php"

            echo ""
            echo "===== [3] Python 으로 login_check.php + write_url.php 에서 denny 제거 ====="
            for F in login_check.php write_url.php; do
              sudo cp "$P1/$F" "$P1/$F.bak.denny.$TS"
              sudo TARGET="$P1/$F" python3 << "PYEOF"
            import os, re
            p = os.environ["TARGET"]
            s = open(p).read()
            before = len(s)
            # 케이스: 배열 안에 "denny" => "..." 라인, 'denny' => 'xxx' 라인 (PHP), 그리고 "denny" 단독 리스트 항목
            # PHP array key: "denny" => "value",  또는  'denny' => 'value',
            s = re.sub(r'[\'"]denny[\'"]\s*=>\s*[\'"][^\'"]*[\'"]\s*,?\s*\n?', '', s)
            # PHP array item: "denny",  또는 'denny',
            s = re.sub(r'[\'"]denny[\'"]\s*,\s*', '', s)
            # JS/HTML option: <option value="denny">...</option>
            s = re.sub(r'<option value="denny">[^<]*</option>', '', s)
            # Comma cleanup: trailing comma before ] or )
            s = re.sub(r',(\s*[\]\)])', r'\1', s)
            open(p, "w").write(s)
            print(f"{p}: before={before}B after={len(s)}B diff={before-len(s)}B")
            PYEOF
              sudo chown www-data:www-data "$P1/$F"
              sudo chmod 644 "$P1/$F"
            done

            echo ""
            echo "===== [4] AFTER - denny 참조 재확인 ====="
            for F in login_check.php write_url.php; do
              echo "--- $F ---"
              CNT=$(sudo grep -c "denny" "$P1/$F" 2>/dev/null)
              echo "  denny 잔존: $CNT (기대: 0)"
              sudo grep -n "denny" "$P1/$F" 2>/dev/null | head -5
            done

            echo ""
            echo "===== [5] 전체 photo/ 하위 denny grep 최종 스캔 ====="
            sudo grep -rl "denny" "$P1"/*.php "$P1"/*.html 2>/dev/null || echo "  (denny 참조 완전 제거)"

            echo ""
            echo "===== [6] PHP 문법 검사 (혹시 정규식이 깨뜨렸으면 감지) ====="
            for F in login_check.php write_url.php write.php write_select_room.php; do
              echo "--- $F ---"
              sudo /usr/bin/php -l "$P1/$F" 2>&1 | head -3
            done

            echo ""
            echo "===== DONE ====="
            REMOTE
