name: write_select_room.php $ALL_CH 리스트 동기화 (denny 제거 + abc01~07 추가)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-fix-master-dropdown.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 180s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='bash -s' << "REMOTE"
            set -uo pipefail
            P1="/var/www/sites/chamgyo/public/photo"
            TS=$(date +%s)

            echo "===== [1] BEFORE - write_select_room.php \$ALL_CH ====="
            sudo grep -n '\$ALL_CH' "$P1/write_select_room.php"

            sudo cp "$P1/write_select_room.php" "$P1/write_select_room.php.bak.$TS"

            echo ""
            echo "===== [2] Python 으로 \$ALL_CH 배열 교체 ====="
            sudo TARGET="$P1/write_select_room.php" python3 << "PYEOF"
            import os, re
            p = os.environ["TARGET"]
            s = open(p).read()
            # 새 리스트: 13계정 (aass0707 제외 - 자기가 마스터니 sel_aass0707.json 도 같이 갱신 or 제외 - 배치는 12개로)
            # 마스터는 __all__ 로 다른 12개 계정에 동시 지정 (자기 sel_aass0707.json 은 별도로 안 씀)
            new_arr = '$ALL_CH = ["abc01","abc02","abc03","abc04","abc05","abc06","abc07","cent","gain","jay","otuki","tak"];'
            pat = re.compile(r'\$ALL_CH\s*=\s*\[[^\]]*\]\s*;')
            n = pat.subn(new_arr, s)
            if n[1] > 0:
                open(p, "w").write(n[0])
                print(f"OK: \$ALL_CH 교체됨 ({n[1]}건). before={len(s)}B after={len(n[0])}B")
            else:
                print("FAIL: \$ALL_CH 배열 못 찾음")
            PYEOF

            sudo chown www-data:www-data "$P1/write_select_room.php"
            sudo chmod 644 "$P1/write_select_room.php"

            echo ""
            echo "===== [3] AFTER - write_select_room.php \$ALL_CH ====="
            sudo grep -n '\$ALL_CH' "$P1/write_select_room.php"

            echo ""
            echo "===== [4] 프론트 write.php 드롭다운 재확인 (14개 옵션) ====="
            sudo grep -oE '<option value="[^"]*">[^<]*</option>' "$P1/write.php" | head -20

            echo ""
            echo "===== [5] denny 잔재 최종 확인 (모든 파일에서) ====="
            sudo grep -rl "denny" "$P1"/*.php "$P1"/*.html 2>/dev/null | head -10 || echo "  (denny 참조 없음)"

            echo ""
            echo "===== DONE ====="
            REMOTE
