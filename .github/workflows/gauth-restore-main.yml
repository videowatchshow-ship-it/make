name: gauth · revert to admin panel + only strip subsite tab

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-restore-main.txt']

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore from before-restore, then only strip subsite tab UI
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 90s
          script: |
            F=/var/www/sites/gauth/public/index.html

            echo '=== 1. list before-restore snapshots ==='
            sudo ls -1t $F.before-restore.* 2>/dev/null | head -5 || echo 'none'

            echo ''
            echo '=== 2. find the newest before-restore that contains real admin markers ==='
            NEWEST=''
            for b in $(sudo ls -1t $F.before-restore.* 2>/dev/null); do
              if sudo grep -q '엑셀\|마스터\|excel\|master\|4875\|업로드' "$b" 2>/dev/null; then
                NEWEST="$b"; break
              fi
            done
            if [ -z "$NEWEST" ]; then
              # fall back to any recent .bak with those markers
              for b in $(sudo ls -1t $F.bak.* 2>/dev/null); do
                if sudo grep -q '엑셀\|마스터\|excel\|master\|4875\|업로드' "$b" 2>/dev/null; then
                  NEWEST="$b"; break
                fi
              done
            fi
            echo "chosen: $NEWEST"
            if [ -z "$NEWEST" ]; then
              echo 'FATAL: no admin-panel snapshot found; aborting'; exit 1
            fi

            echo ''
            echo '=== 3. copy that snapshot back to index.html ==='
            sudo cp "$F" "$F.dashboard-mistake.$(date +%s)"
            sudo cp "$NEWEST" "$F"

            echo ''
            echo '=== 4. strip subsite tab UI + shims (conservative, marker-based) ==='
            sudo python3 - <<'PYEOF'
            import re
            f = '/var/www/sites/gauth/public/index.html'
            s = open(f, encoding='utf-8').read()
            before = len(s)
            # strip various shims I added
            s = re.sub(r'<script>\n// auth-broad-shim start.*?// auth-broad-shim end\n</script>\n', '', s, flags=re.S)
            s = re.sub(r'<script>\n// fetch-shim start.*?// fetch-shim end\n</script>\n', '', s, flags=re.S)
            s = re.sub(r'<script>\n// authQuery shim.*?</script>\n', '', s, flags=re.S)
            # strip 하위 사이트 계정 tab section — based on visible label found in user screenshot
            # Strip a card whose text contains "하위 사이트별 계정" together with the surrounding <div class="card">...</div>
            def strip_card_around(text, needle):
                out = text
                while True:
                    idx = out.find(needle)
                    if idx < 0: break
                    # find preceding <div class="card"> tag
                    start = out.rfind('<div class="card"', 0, idx)
                    if start < 0:
                        # try any <div ... class="card"...>
                        m = re.search(r'<div[^>]*class="[^"]*card[^"]*"[^>]*>', out[:idx][::-1])
                        # give up if not found
                        break
                    # find matching </div> by depth counting
                    depth = 0
                    i = start
                    end = -1
                    while i < len(out):
                        if out.startswith('<div', i): depth += 1; i += 4
                        elif out.startswith('</div>', i):
                            depth -= 1; i += 6
                            if depth == 0: end = i; break
                        else: i += 1
                    if end < 0: break
                    out = out[:start] + out[end:]
                return out
            for nd in ('하위 사이트별 계정', '하위 사이트 계정', 'subsite-accounts-body', 'tab-subsite'):
                s = strip_card_around(s, nd)
            # strip tab-nav buttons if they only tabbed to subsite
            s = re.sub(r'<button[^>]*tab-subsite[^>]*>.*?</button>\s*', '', s, flags=re.S)
            after = len(s)
            print(f'stripped {before-after} bytes')
            # add tiny nav link to /subsites.html if not present
            if 'id="nav-subsites"' not in s and '<body>' in s:
                nav = ('<a id="nav-subsites" href="/subsites.html" '
                       'style="position:fixed;top:12px;right:14px;z-index:9999;'
                       'background:#161a20;color:#7dabff;border:1px solid #22282f;'
                       'border-radius:999px;padding:6px 14px;font-size:12px;'
                       'text-decoration:none;font-weight:700;font-family:sans-serif">'
                       '📦 하위 계정 →</a>\n')
                s = s.replace('<body>', '<body>\n' + nav, 1)
            open(f, 'w', encoding='utf-8').write(s)
            print('done')
            PYEOF

            echo ''
            echo '=== 5. verify ==='
            curl -s -o /dev/null -w 'main: %{http_code}\n' https://gauth.cent-solution.online/ --max-time 10
            echo 'admin markers present (업로드적):'
            curl -s --max-time 10 https://gauth.cent-solution.online/ | grep -oE '엑셀|마스터|업로드|4875' | sort -u
            echo 'subsite tab present (should be 0):'
            curl -s --max-time 10 https://gauth.cent-solution.online/ | grep -c '하위 사이트별 계정\|tab-subsite\|subsite-accounts-body' || echo 0
            echo 'nav link present (1):'
            curl -s --max-time 10 https://gauth.cent-solution.online/ | grep -c 'nav-subsites' || echo 0
