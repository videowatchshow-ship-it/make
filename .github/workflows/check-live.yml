name: check-live-site
on:
  push:
    branches: [claude/sleepy-goodall-per69w]
    paths: ['.github/workflows/check-live.yml']
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: DNS 진단 (A/AAAA — 34.104.233.35 직결 여부)
        run: |
          echo "=== A 레코드 ==="
          dig +short A cent-solutions.info || true
          dig +short A www.cent-solutions.info || true
          echo "=== AAAA 레코드(있으면 클라우드플레어 프록시 의심) ==="
          dig +short AAAA cent-solutions.info || true
          echo "=== NS ==="
          dig +short NS cent-solutions.info || true

      - name: HTTPS 인증서 진단
        run: |
          echo | openssl s_client -connect cent-solutions.info:443 -servername cent-solutions.info 2>/dev/null | openssl x509 -noout -subject -issuer -dates || echo "TLS 연결 실패"

      - name: 페이지/API 응답 진단
        run: |
          echo "=== studio.html 헤더 ==="
          curl -sSI --max-time 15 https://cent-solutions.info/studio.html || echo FAILED
          echo "=== api/health ==="
          curl -sS --max-time 15 https://cent-solutions.info/api/health || echo FAILED
          echo
          echo "=== 서버 IP로 직접(Host 헤더) — DNS 문제와 서버 문제 분리 ==="
          curl -sSI --max-time 15 -k --resolve cent-solutions.info:443:34.104.233.35 https://cent-solutions.info/studio.html || echo "DIRECT-443 FAILED"
          curl -sS --max-time 15 --resolve cent-solutions.info:80:34.104.233.35 http://cent-solutions.info/api/health || echo "DIRECT-80 FAILED"
          echo
          echo "=== studio.html 버전 확인(직결) ==="
          curl -sS --max-time 15 -k --resolve cent-solutions.info:443:34.104.233.35 https://cent-solutions.info/studio.html -o /tmp/p.html || true
          wc -l /tmp/p.html 2>/dev/null || true
          grep -o '<title>[^<]*</title>' /tmp/p.html 2>/dev/null || true
          grep -c 'loginGate\|drawer-grip\|danger-bg' /tmp/p.html 2>/dev/null || true
