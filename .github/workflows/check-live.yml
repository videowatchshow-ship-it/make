name: check-live-site
on:
  push:
    branches: [claude/sleepy-goodall-per69w]
    paths:
      - '.github/workflows/check-live.yml'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: curl studio.html (헤더 + 앞부분)
        run: |
          echo "=== HTTP 상태/헤더 ==="
          curl -sSI https://panda-avata.cc/studio.html || echo "FAILED"
          echo
          echo "=== HTML title/버전 표시 검색 ==="
          curl -sS https://panda-avata.cc/studio.html -o /tmp/page.html || echo "FAILED"
          wc -l /tmp/page.html
          grep -o '<title>[^<]*</title>' /tmp/page.html || true
          grep -n 'verTag\|v1\.0\.0\|APP_VERSION\|addbar-main\|h.widgets' /tmp/page.html | head -10 || true

      - name: API health
        run: curl -sS https://panda-avata.cc/api/health || echo "API FAILED"

      - name: destinations (tak 아바타, 서버가 실제로 뭐을 갖고 있는지 — 키는 서버가 자체 마스킹 안 하니 여기선 platform/enabled만 추출)
        run: |
          curl -sS https://panda-avata.cc/api/destinations/tak -o /tmp/dest.json || echo "FAILED"
          python3 -c "
import json
try:
  d=json.load(open('/tmp/dest.json'))
  for x in d:
    key=x.get('streamKey','')
    masked=(key[:3]+'...'+key[-2:]) if len(key)>6 else ('(없음)' if not key else '***')
    print(f\"platform={x.get('platform')} name={x.get('name')} enabled={x.get('enabled', True)} locked={x.get('locked', False)} fullUrl={x.get('fullUrl', False)} streamKey={masked}\")
except Exception as e:
  print('파싱 실패:', e, open('/tmp/dest.json').read()[:300])
"

      - name: Playwright 스크린샷 (실제 렌더링 확인)
        run: |
          pip install --quiet playwright 2>/dev/null || npm install -g playwright@1.48.0 --silent
          npx --yes playwright@1.48.0 install --with-deps chromium >/dev/null 2>&1
          cat > /tmp/shot.mjs << 'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          const errs = [];
          page.on('pageerror', e => errs.push(e.message));
          page.on('console', m => { if (m.type()==='error') errs.push(m.text()); });
          await page.goto('https://panda-avata.cc/studio.html', { waitUntil: 'networkidle', timeout: 20000 });
          await page.waitForTimeout(1500);
          await page.screenshot({ path: '/tmp/live-shot.png' });
          console.log('콘솔 에러:', errs.length ? errs.join(' | ') : '없음');
          await browser.close();
          EOF
          node /tmp/shot.mjs || echo "playwright 실패"
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-check
          path: |
            /tmp/live-shot.png
            /tmp/page.html
          if-no-files-found: ignore
