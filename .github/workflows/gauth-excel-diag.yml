name: gauth · excel diag (mojibake + wrong columns)

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-excel-diag.txt']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Show raw record + parser column mapping + filename encoding
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo '=== 1. raw record for hinashinde77@gmail.com in accounts_normalized.json ==='
            sudo python3 -c "import json; d=json.load(open('/opt/gauth-full/accounts_normalized.json',encoding='utf-8')); arr=d if isinstance(d,list) else d.get('accounts',[]); hits=[a for a in arr if isinstance(a,dict) and (a.get('email','').lower()=='hinashinde77@gmail.com')]; print(json.dumps(hits[:1], ensure_ascii=False, indent=2)) if hits else print('NOT FOUND')"
            echo ''
            echo '=== 2. all excel filenames stored in DB (unique, first 30) ==='
            sudo python3 -c "import json; d=json.load(open('/opt/gauth-full/accounts_normalized.json',encoding='utf-8')); arr=d if isinstance(d,list) else d.get('accounts',[]); ss=sorted({(a.get('source') or a.get('source_file') or '') for a in arr if isinstance(a,dict)}); print(chr(10).join(ss[:30]))"
            echo ''
            echo '=== 3. parser column mapping (upload_excels.js) ==='
            sudo grep -nE 'row\[|columns|COLUMNS|password|youtube|totp|nickname|source|filename|originalname' /opt/gauth-full/upload_excels.js | head -60
            echo ''
            echo '=== 4. multer/express filename handling (mojibake usually from originalname latin1 bytes) ==='
            sudo grep -nE 'originalname|filename|multer|latin1|utf8|Buffer\.from|iconv' /opt/gauth-full/upload_excels.js /opt/gauth-full/rebrowser-login.js 2>/dev/null | head -40
            echo ''
            echo '=== 5. show first data row from any recent xlsx (to see column layout raw) ==='
            LATEST=$(sudo ls -1t /opt/gauth-full/uploads/*.xlsx 2>/dev/null | head -1)
            echo "latest xlsx: $LATEST"
            if [ -n "$LATEST" ]; then
              sudo python3 -c "import openpyxl; wb=openpyxl.load_workbook(r'$LATEST', data_only=True); ws=wb.active; print('columns count:', ws.max_column); [print(i, [c.value for c in row]) for i,row in enumerate(ws.iter_rows(min_row=1, max_row=3))]" 2>&1 | head -20 || echo 'openpyxl unavailable'
            fi
