name: photo README 한장으로 통합 + 현재 상태 반영

on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-readme-fix.yml'

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 180s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='bash -s' << "REMOTE"
            set -uo pipefail
            P1="/var/www/sites/chamgyo/public/photo"
            P2="/var/www/sites/chamgyo/public/photo2"
            P3="/var/www/sites/chamgyo/public/photo3"
            TS=$(date +%s)

            echo "===== [1] BEFORE - 모든 README 파일 (photo/photo2/photo3) ====="
            for D in "$P1" "$P2" "$P3"; do
              echo "--- $D ---"
              sudo ls -la "$D"/README* 2>/dev/null
            done

            echo ""
            echo "===== [2] photo2/photo3 README* 전부 완전 삭제 (rm -f, .removed 도 정리) ====="
            for D in "$P2" "$P3"; do
              for f in "$D"/README* "$D"/README*.removed.* "$D"/README*.bak.*; do
                [ -f "$f" ] || continue
                sudo rm -f "$f"
                echo "DELETED: $f"
              done
            done

            echo ""
            echo "===== [3] photo/README* 백업/구버전 파일들 완전 삭제 ====="
            for f in "$P1"/README.md.bak.* "$P1"/README.md.removed.* "$P1"/README_PHOTO.md* "$P1"/README_*.md.bak.*; do
              [ -f "$f" ] || continue
              sudo rm -f "$f"
              echo "DELETED: $f"
            done

            echo ""
            echo "===== [4] photo/README.md 새로 작성 (현재 상태 반영) ====="
            sudo tee "$P1/README.md" > /dev/null << "README_EOF"
            # 참교육카지노 photo 폴더 · 단일 README (2026-08-19 갱신)

            > 이 파일이 참교육카지노 photo/photo2/photo3 전체 시스템의 유일한 README 입니다.
            > (규칙: README 는 한 장만 유지)

            ---

            ## 1. 폴더 구조 (my-site-1 · /var/www/sites/chamgyo/public/)

            | 폴더    | 역할                          | data/ 실체 여부 |
            |---------|-------------------------------|-----------------|
            | photo/  | 대표 폴더 (otuki/cent/jay/tak/aass0707/abc01~07/gain 노출) | 실체 디렉토리 |
            | photo2/ | 원본 (모든 채널)              | 실체 디렉토리 |
            | photo3/ | tak 전용                      | data → photo2/data 심볼릭 |

            ## 2. 계정 목록 (13개, denny 삭제 완료)

            aass0707 (마스터), abc01, abc02, abc03, abc04, abc05, abc06, abc07,
            cent, gain, jay, otuki, tak

            ## 3. 계정별 URL (세로 · 가로 · 싱지뉴)

            도메인: https://xn--9d0bw2fjtyymch7de9d.info

            - 세로 : /photo/CAH_1.html?ch=<계정>
            - 가로 : /photo/CAW_1.html?ch=<계정>
            - 싱지뉴: /photo/SNW_1.html?ch=<계정>

            ## 4. 데이터 파일

            - sel_<계정>.json : 계정별 선택 방(room_id / board)
            - selected_room.json : 공용 폴백
            - tables.json : xtd 방 라벨 및 매핑 (아래 [5])
            - room_<label>.json : 라벨별 xtd6688 크롤 결과
            - img_ver.json / img_ver_<계정>.json : 이미지 캐시버스팅 버전

            ## 5. tables.json (xtd 매핑 확정)

            - xtd: [10,11,12,15,16,17,18,19,20,21,22,23,25,26,27,55,66,77,88,99]
            - xtd_map: 17→87, 19→89, 55→31, 66→32, 77→33, 88→34, 99→35 (그 외 self)
            - xtd_kind: 10→"21점", 16→"용호"

            ## 6. 크롤러

            - /etc/cron.d/chamgyo-photo3-collector (매분 실행)
            - collector_xtd.php : api.xtd6688.com 폴링 (Origin: gs.xtd6688.com)
            - tables.json 의 xtd 배열 기준으로 방 목록 결정 (누락 시 [11] 폴백)

            ## 7. 이미지 (계정별 독립 구조)

            - 공용 : /photo/images/<파일>
            - 계정별: /photo/images/ch/<계정>/<파일>
            - 업로드: write_upload.php 가 계정별로 자동 저장
              - 마스터 aass0707 만 ch=__all__ 로 공용 저장 가능
              - 그 외는 세션 계정 폴더로 강제
            - **현 상태**: write_upload.php 는 계정별 저장 지원 완료.
              프론트(CAH_1 / CAW_1 / SNW_1)는 아직 공용 images/ 만 참조 중 →
              계정별 이미지 표시는 프론트 수정 후 활성화.

            ## 8. 기타

            - hot-patch : /photo2/hot_patches.json (2초 폴링)
            - Apache 로그 : /chamgyo_access.log
            - write.php 상단에 "두 기기 모두 로그인" 붉은/노랑 깜빡임 경고 배치 완료
            - SNW_1.html 하단 ban_wrap (메신저/채팅 창) 통째 제거 완료

            ## 9. 배포 규칙 (필수)

            - 사용자에게 터미널 명령 지시 금지
            - 모든 배포는 GitHub Actions 로 자동화
            - README 는 이 파일 하나만 유지 (photo2/photo3 에는 두지 않음)
            README_EOF

            sudo chown www-data:www-data "$P1/README.md"
            sudo chmod 644 "$P1/README.md"

            echo ""
            echo "===== [5] AFTER - README 파일 상태 최종 확인 ====="
            for D in "$P1" "$P2" "$P3"; do
              echo "--- $D ---"
              sudo ls -la "$D"/README* 2>/dev/null || echo "  (README 없음)"
            done

            echo ""
            echo "===== [6] photo/README.md 크기 및 첫 20줄 ====="
            sudo wc -c "$P1/README.md"
            sudo head -20 "$P1/README.md"

            echo ""
            echo "===== [7] 전체 서버에서 chamgyo public 하위 README 개수 ====="
            CNT=$(sudo find /var/www/sites/chamgyo/public -maxdepth 3 -iname "README*" -not -name "*.removed.*" -not -name "*.bak.*" -type f 2>/dev/null | wc -l)
            echo "활성 README 총 개수: $CNT (기대값: 1)"
            sudo find /var/www/sites/chamgyo/public -maxdepth 3 -iname "README*" -not -name "*.removed.*" -not -name "*.bak.*" -type f 2>/dev/null

            echo ""
            echo "===== DONE ====="
            REMOTE
