name: fix-photo-local-api
on:
  push:
    paths:
      - '.github/workflows/fix-photo-local-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_IP: "187.53.133.145"
      VPS_PASS_B64: "LWFhMGNLMDtibzJRNkxnMg=="
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Create and deploy bgl.js
        run: |
          cat > /tmp/bgl.js << 'JSEOF'
          (function(){
            var BASE = location.origin + '/photo';
            var GAUTH = 'https://gauth.cent-solution.online/photo';
            var POLL_MS = 3000;
            var TIMEOUT = 5000;
            var roomEl = document.getElementById('bgl-room');
            var roadEl = document.querySelector('.bgl-road');
            var failCount = 0;
            var MAX_ROWS = 6;

            function showOffline(){
              if(roomEl) roomEl.textContent='서버 점검중';
              if(roadEl) roadEl.innerHTML='<div style="text-align:center;padding:40px;color:#999;font-size:14px;">데이터 서버 점검중입니다.<br>잠시 후 자동 재연결됩니다.</div>';
            }

            function renderRoad(results){
              if(!roadEl) return;
              roadEl.innerHTML='';
              if(!results||!results.length){
                roadEl.innerHTML='<div style="text-align:center;padding:20px;color:#999;">데이터 없음</div>';
                return;
              }
              var cols=[];
              var col=[];
              var prev=null;
              for(var i=0;i<results.length;i++){
                var r=results[i];
                var w=r.winner||r.w||'p';
                if(prev&&w!==prev){cols.push(col);col=[];}
                col.push(r);
                prev=w;
              }
              if(col.length) cols.push(col);

              var tbl=document.createElement('table');
              tbl.className='bgl-table';
              for(var row=0;row<MAX_ROWS;row++){
                var tr=document.createElement('tr');
                for(var c=0;c<cols.length;c++){
                  var td=document.createElement('td');
                  if(cols[c][row]){
                    var d=cols[c][row];
                    var w=d.winner||d.w||'p';
                    var div=document.createElement('div');
                    div.className=w==='b'?'bgl-b':'bgl-p';
                    if(d.pp){var pp=document.createElement('i');pp.className='pp';div.appendChild(pp);}
                    if(d.bp){var bp=document.createElement('i');bp.className='bp';div.appendChild(bp);}
                    if(d.tie||d.t){var s=document.createElement('s');s.textContent=d.tie||d.t||'';div.appendChild(s);}
                    td.appendChild(div);
                  }
                  tr.appendChild(td);
                }
                tbl.appendChild(tr);
              }
              roadEl.appendChild(tbl);
            }

            function numsToResults(nums){
              if(!nums||!nums.length) return [];
              var results=[];
              for(var i=0;i<nums.length;i++){
                var n=nums[i];
                var w,pp=false,bp=false,tie=0;
                if(n>=50){w='b';var rem=n-50;if(rem>=20){bp=true;rem-=20;}if(rem>=10){pp=true;rem-=10;}tie=rem;}
                else if(n>=10){w='p';var rem=n-10;if(rem>=20){bp=true;rem-=20;}if(rem>=10){pp=true;}tie=0;}
                else{w='p';tie=n;}
                var r={w:w};
                if(pp) r.pp=true;
                if(bp) r.bp=true;
                if(tie>0) r.t=tie;
                results.push(r);
              }
              return results;
            }

            function loadData(){
              var ctrl=new AbortController();
              var timer=setTimeout(function(){ctrl.abort();},TIMEOUT);
              fetch(BASE+'/data/room_1.json?t='+Date.now(),{signal:ctrl.signal})
                .then(function(r){clearTimeout(timer);return r.json();})
                .then(function(d){
                  failCount=0;
                  if(roomEl) roomEl.textContent='방 1';
                  if(d&&d.results) renderRoad(d.results);
                  else if(d&&d.nums) renderRoad(numsToResults(d.nums));
                  else renderRoad([]);
                })
                .catch(function(){
                  clearTimeout(timer);
                  var ctrl2=new AbortController();
                  var timer2=setTimeout(function(){ctrl2.abort();},TIMEOUT);
                  fetch(GAUTH+'/data/room_1.json?t='+Date.now(),{signal:ctrl2.signal})
                    .then(function(r){clearTimeout(timer2);return r.json();})
                    .then(function(d){
                      failCount=0;
                      if(roomEl) roomEl.textContent='방 1';
                      if(d&&d.results) renderRoad(d.results);
                      else if(d&&d.nums) renderRoad(numsToResults(d.nums));
                      else renderRoad([]);
                    })
                    .catch(function(){
                      clearTimeout(timer2);
                      failCount++;
                      if(failCount>=3) showOffline();
                    });
                });
            }

            loadData();
            setInterval(loadData,POLL_MS);
          })();
          JSEOF

          sha256sum /tmp/bgl.js
          wc -c /tmp/bgl.js

          export SSHPASS=$(echo "$VPS_PASS_B64" | base64 -d)
          SSH="sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@$VPS_IP"
          BASE="/var/www/sites/chamgyo/public"

          echo "===== Deploy bgl.js ====="
          sshpass -e scp -o StrictHostKeyChecking=no /tmp/bgl.js root@$VPS_IP:$BASE/photo/bgl.js
          sshpass -e scp -o StrictHostKeyChecking=no /tmp/bgl.js root@$VPS_IP:$BASE/photo2/bgl.js
          sshpass -e scp -o StrictHostKeyChecking=no /tmp/bgl.js root@$VPS_IP:$BASE/photo3/bgl.js
          $SSH "chown www-data:www-data $BASE/photo/bgl.js $BASE/photo2/bgl.js $BASE/photo3/bgl.js"

          echo "===== Deploy room_1.json with proper results format ====="
          cat > /tmp/room_1.json << 'JSONEOF'
          {"results":[{"w":"p"},{"w":"b"},{"w":"p"},{"w":"p","pp":true},{"w":"b"},{"w":"b","bp":true},{"w":"p"},{"w":"b"},{"w":"p","t":1},{"w":"b"},{"w":"b"},{"w":"p"},{"w":"p"},{"w":"b","pp":true},{"w":"b"},{"w":"p"},{"w":"b"},{"w":"p"},{"w":"p"},{"w":"b"},{"w":"b"},{"w":"b"},{"w":"p"},{"w":"p","bp":true},{"w":"b"},{"w":"p"},{"w":"b"},{"w":"b"},{"w":"p"},{"w":"p"},{"w":"b","t":1},{"w":"p"},{"w":"b"},{"w":"b"},{"w":"p"},{"w":"p"},{"w":"b"},{"w":"p"},{"w":"b"},{"w":"b"},{"w":"p"},{"w":"p"},{"w":"b"},{"w":"b"},{"w":"p"},{"w":"b"},{"w":"p"},{"w":"p"},{"w":"b"},{"w":"p"},{"w":"b"},{"w":"b"},{"w":"p"},{"w":"b"},{"w":"p"},{"w":"p"}],"source":"local"}
          JSONEOF
          sshpass -e scp -o StrictHostKeyChecking=no /tmp/room_1.json root@$VPS_IP:$BASE/photo/data/room_1.json
          $SSH "chown www-data:www-data $BASE/photo/data/room_1.json"

          echo "===== Verify ====="
          $SSH "sha256sum $BASE/photo/bgl.js $BASE/photo2/bgl.js $BASE/photo3/bgl.js"

      - name: Purge CF cache
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/7e5faed2d3d4d6da7aceb4ddde81a62b/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' | python3 -c "import sys,json;d=json.load(sys.stdin);print('CF Purge:', 'OK' if d.get('success') else d)"

      - name: Verify live
        run: |
          sleep 5
          DOMAIN="xn--9d0bw2fjtyymch7de9d.info"
          echo "===== bgl.js ====="
          curl -sS -o /tmp/bgl.js -w "HTTP %{http_code} | size %{size_download} | cf-cache: %{header.cf-cache-status}\n" "https://$DOMAIN/photo/bgl.js?t=$(date +%s)"
          sha256sum /tmp/bgl.js
          grep -c 'bgl-p\|bgl-b\|bgl-table' /tmp/bgl.js && echo "PROPER CSS CLASSES OK" || echo "MISSING CSS CLASSES"

          echo ""
          echo "===== room_1.json ====="
          curl -sS -o /tmp/room.json -w "HTTP %{http_code} | size %{size_download} | cf-cache: %{header.cf-cache-status}\n" "https://$DOMAIN/photo/data/room_1.json?t=$(date +%s)"
          python3 -c "import json;d=json.load(open('/tmp/room.json'));print('results count:', len(d.get('results',d.get('nums',[]))))" 2>/dev/null || cat /tmp/room.json

          echo ""
          echo "===== CAH_1.html ====="
          curl -sS -o /dev/null -w "HTTP %{http_code} | size %{size_download}\n" "https://$DOMAIN/photo/CAH_1.html"

          echo ""
          echo "===== login.html ====="
          curl -sS -o /dev/null -w "HTTP %{http_code} | size %{size_download}\n" "https://$DOMAIN/photo/login.html"
