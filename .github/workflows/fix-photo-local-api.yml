name: fix-photo-local-api
on:
  push:
    paths:
      - '.github/workflows/fix-photo-local-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_IP: "187.53.133.145"
      VPS_PASS_B64: "LWFhMGNLMDtibzJRNkxnMg=="
      BGL_B64: ""
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Deploy bgl.js to all photo dirs
        run: |
          export SSHPASS=$(echo "$VPS_PASS_B64" | base64 -d)
          SSH="sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@$VPS_IP"
          BASE="/var/www/sites/chamgyo/public"

          echo "===== Current state ====="
          $SSH "sha256sum $BASE/photo/bgl.js 2>/dev/null; cat $BASE/photo/data/room_1.json 2>/dev/null | head -1"

          echo ""
          echo "===== Deploy bgl.js ====="
          echo "$BGL_B64" | base64 -d > /tmp/bgl.js
          sha256sum /tmp/bgl.js
          wc -c /tmp/bgl.js

          sshpass -e scp -o StrictHostKeyChecking=no /tmp/bgl.js root@$VPS_IP:$BASE/photo/bgl.js
          sshpass -e scp -o StrictHostKeyChecking=no /tmp/bgl.js root@$VPS_IP:$BASE/photo2/bgl.js
          sshpass -e scp -o StrictHostKeyChecking=no /tmp/bgl.js root@$VPS_IP:$BASE/photo3/bgl.js

          $SSH "chown www-data:www-data $BASE/photo/bgl.js $BASE/photo2/bgl.js $BASE/photo3/bgl.js"

          echo ""
          echo "===== Deployed SHA ====="
          $SSH "sha256sum $BASE/photo/bgl.js $BASE/photo2/bgl.js $BASE/photo3/bgl.js"

      - name: Ensure room_1.json exists
        run: |
          export SSHPASS=$(echo "$VPS_PASS_B64" | base64 -d)
          SSH="sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@$VPS_IP"
          BASE="/var/www/sites/chamgyo/public"

          $SSH "mkdir -p $BASE/photo/data && test -f $BASE/photo/data/room_1.json && echo 'room_1.json exists' || (echo '{\"nums\":[23,45,12,67,34,89,56,11,78,43,22,55,31,66,14,88,42,19,71,33,57,25,63,18,84,47,29,61,15,73,38,52,26,69,41,83,17,59,36,72,28,64,21,76,44,91,13,58,35,82,27,65,19,74,46,87],\"source\":\"local\"}' > $BASE/photo/data/room_1.json && chown www-data:www-data $BASE/photo/data/room_1.json && echo 'room_1.json created')"

      - name: Purge CF cache
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/7e5faed2d3d4d6da7aceb4ddde81a62b/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' | python3 -c "import sys,json;d=json.load(sys.stdin);print('CF Purge:', 'OK' if d.get('success') else d)"

      - name: Verify live
        run: |
          sleep 5
          DOMAIN="xn--9d0bw2fjtyymch7de9d.info"
          echo "===== bgl.js ====="
          curl -sS -o /tmp/bgl.js -w "HTTP %{http_code} | size %{size_download} | cf-cache: %{header.cf-cache-status}\n" "https://$DOMAIN/photo/bgl.js?t=$(date +%s)"
          sha256sum /tmp/bgl.js
          grep -c 'room_1.json' /tmp/bgl.js && echo "DIRECT JSON LOAD OK" || echo "MISSING"

          echo ""
          echo "===== room_1.json ====="
          curl -sS -o /tmp/room.json -w "HTTP %{http_code} | size %{size_download} | cf-cache: %{header.cf-cache-status}\n" "https://$DOMAIN/photo/data/room_1.json?t=$(date +%s)"
          python3 -c "import json;d=json.load(open('/tmp/room.json'));print('nums count:', len(d.get('nums',[])))" 2>/dev/null || cat /tmp/room.json
