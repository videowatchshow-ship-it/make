name: Update ledger to per-person

on:
  workflow_dispatch:
  push:
    branches: [claude/jeongsan-page-management-evm5h3]
    paths:
      - '.github/workflows/update-ledger.yml'
      - 'jeongsan-import/ledger_update.py'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SCP ledger_update.py to bastion
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          source: "jeongsan-import/ledger_update.py"
          target: "/tmp/"
          overwrite: true

      - name: Run ledger_update on my-site-1
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 180s
          script: |
            set -e
            /snap/bin/gcloud compute scp /tmp/jeongsan-import/ledger_update.py \
              videowatch_show@my-site-1:/tmp/ledger_update.py \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --scp-flag="-o StrictHostKeyChecking=no" \
              --quiet
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='
            set -e
            SD="/var/www/sites/chamgyo/settlement-data"
            TS=$(date +%s)
            sudo cp "$SD/data.json" "$SD/backups/data.pre-ledger-${TS}.json"
            echo "backup size: $(sudo wc -c < $SD/backups/data.pre-ledger-${TS}.json)"
            echo ""
            echo "===== RUN ledger_update ====="
            sudo python3 /tmp/ledger_update.py
            sudo chown www-data:www-data "$SD/data.json"
            sudo chmod 644 "$SD/data.json"
            sudo rm -f /tmp/ledger_update.py
            echo ""
            echo "===== HTTP VERIFY (cent 로그인) ====="
            CJ=$(mktemp)
            curl -si -c "$CJ" -X POST --data-urlencode "id=cent" --data-urlencode "passwd=1147" \
              "http://localhost/%ec%a0%95%ec%82%b0%ed%91%9c/login_check.php" | head -3
            LEDGER=$(curl -s -b "$CJ" "http://localhost/%ec%a0%95%ec%82%b0%ed%91%9c/data.php" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(\" \",r) for r in d.get(\"ledger\",[])]")
            echo "$LEDGER"
            rm -f "$CJ"
            echo "===== DONE ====="
            '

      - name: Cloudflare purge
        if: success()
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ZONE:  ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_everything" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | head -c 300
          echo ""
