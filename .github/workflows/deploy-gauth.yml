name: Deploy gauth to server
on:
  workflow_dispatch:
  push:
    branches: [claude/auto-test-debugging-local-n0xjkg, claude/gauth-frontend-backend-fixes-cg2icv]
    paths:
      - 'gauth/index.html'
      - 'gauth/upload_excels.js'
      - 'gauth/auto_deploy.js'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via API
        env:
          GAUTH_TOKEN: ${{ secrets.GAUTH_API_TOKEN }}
        run: |
          echo "=== Triggering server-side deploy ==="
          BRANCH="${GITHUB_REF_NAME}"
          RESPONSE=$(curl -sf -X POST https://gauth.cent-solution.online/api/deploy \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${GAUTH_TOKEN}" \
            -d "{\"branch\":\"${BRANCH}\"}" \
            --connect-timeout 15 \
            --max-time 180 \
            2>&1) || {
            echo "::warning::API deploy failed, falling back to SSH deploy"
            exit 1
          }
          echo "$RESPONSE" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if d.get('ok'):
            print('Deployed:', ', '.join(d.get('deployed',[])))
          else:
            print('Error:', d.get('error','unknown'))
            sys.exit(1)
          "

      - name: Deploy via SSH (fallback)
        if: failure()
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          source: "gauth/index.html,gauth/upload_excels.js,gauth/auto_deploy.js"
          target: "/tmp/gauth-deploy/"
          strip_components: 1

      - name: Apply SSH deploy + restart (fallback)
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          script: |
            [ -f /tmp/gauth-deploy/index.html ] && cp /tmp/gauth-deploy/index.html /var/www/sites/gauth/public/index.html
            [ -f /tmp/gauth-deploy/upload_excels.js ] && cp /tmp/gauth-deploy/upload_excels.js /opt/gauth-full/upload_excels.js
            [ -f /tmp/gauth-deploy/auto_deploy.js ] && cp /tmp/gauth-deploy/auto_deploy.js /opt/gauth-full/auto_deploy.js
            sudo systemctl restart gauth
            sleep 2
            sudo systemctl status gauth --no-pager | head -5
            echo "=== Deploy complete ==="
            rm -rf /tmp/gauth-deploy
