name: Deploy gauth to server
on:
  workflow_dispatch:
  push:
    branches: [claude/gauth-frontend-backend-fixes-cg2icv, claude/gauth-frontend-backend-fixes-cg2icv]
    paths:
      - 'gauth/index.html'
      - 'gauth/upload_excels.js'
      - 'gauth/xlsx.core.min.js'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Try API deploy
        id: api_deploy
        continue-on-error: true
        run: |
          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            -X POST https://gauth.cent-solution.online/api/deploy \
            -H "Content-Type: application/json" \
            --connect-timeout 15 --max-time 90)
          echo "HTTP $HTTP_CODE"
          cat /tmp/resp.txt 2>/dev/null || true
          if [ "$HTTP_CODE" = "200" ]; then
            echo "deploy_ok=true" >> "$GITHUB_OUTPUT"
            python3 -c "import json; d=json.load(open('/tmp/resp.txt')); print('Deployed:', d.get('deployed',[])); assert d.get('ok')"
          else
            echo "deploy_ok=false" >> "$GITHUB_OUTPUT"
            echo "API deploy returned HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Try SSH deploy
        if: steps.api_deploy.outputs.deploy_ok != 'true'
        id: ssh_deploy
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          script: |
            cd /opt/gauth-full
            curl -sL "https://raw.githubusercontent.com/videowatchshow-ship-it/make/claude/gauth-frontend-backend-fixes-cg2icv/gauth/upload_excels.js" -o upload_excels.js
            curl -sL "https://raw.githubusercontent.com/videowatchshow-ship-it/make/claude/gauth-frontend-backend-fixes-cg2icv/gauth/auto_deploy.js" -o auto_deploy.js
            curl -sL "https://raw.githubusercontent.com/videowatchshow-ship-it/make/claude/gauth-frontend-backend-fixes-cg2icv/gauth/index.html" -o /var/www/sites/gauth/public/index.html
            curl -sL "https://raw.githubusercontent.com/videowatchshow-ship-it/make/claude/gauth-frontend-backend-fixes-cg2icv/gauth/xlsx.core.min.js" -o /var/www/sites/gauth/public/xlsx.core.min.js
            grep -q "auto_deploy" rebrowser-login.js || echo "require('./auto_deploy.js')(app);" >> rebrowser-login.js
            sudo systemctl restart gauth
            sleep 2
            curl -s http://localhost:4000/api/deploy -X POST | python3 -c "import json,sys; d=json.load(sys.stdin); print('OK' if d.get('ok') else 'FAIL')"
            echo "=== Deploy complete ==="

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.api_deploy.outputs.deploy_ok }}" = "true" ]; then
            echo "## Deploy SUCCESS via API" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.ssh_deploy.outcome }}" = "success" ]; then
            echo "## Deploy SUCCESS via SSH" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Deploy FAILED" >> $GITHUB_STEP_SUMMARY
            echo "- API: /api/deploy returned non-200" >> $GITHUB_STEP_SUMMARY
            echo "- SSH: secrets not configured or connection failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### To fix: set GitHub Secrets" >> $GITHUB_STEP_SUMMARY
            echo "GAUTH_HOST, GAUTH_USER, GAUTH_SSH_KEY" >> $GITHUB_STEP_SUMMARY
          fi
