name: Deploy gauth to server
on:
  workflow_dispatch:
  push:
    branches: [claude/gauth-frontend-backend-fixes-cg2icv, claude/gauth-frontend-backend-fixes-cg2icv]
    paths:
      - 'gauth/index.html'
      - 'gauth/upload_excels.js'
      - 'gauth/xlsx.core.min.js'
      - 'advanced-google-login-v2.js'
      - 'package.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Try API deploy
        id: api_deploy
        continue-on-error: true
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            -X POST https://gauth.cent-solution.online/api/deploy \
            -H "Content-Type: application/json" \
            -d "{\"branch\":\"${BRANCH}\"}" \
            --connect-timeout 15 --max-time 180)
          echo "HTTP $HTTP_CODE"
          cat /tmp/resp.txt 2>/dev/null || true
          if [ "$HTTP_CODE" = "200" ]; then
            echo "deploy_ok=true" >> "$GITHUB_OUTPUT"
            python3 -c "import json; d=json.load(open('/tmp/resp.txt')); print('Deployed:', d.get('deployed',[])); assert d.get('ok')"
          else
            echo "deploy_ok=false" >> "$GITHUB_OUTPUT"
            echo "API deploy returned HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Try SSH deploy
        if: steps.api_deploy.outputs.deploy_ok != 'true'
        id: ssh_deploy
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          script_stop: false
          command_timeout: 5m
          script: |
            set -eo pipefail
            BRANCH="claude/gauth-frontend-backend-fixes-cg2icv"
            RAW="https://raw.githubusercontent.com/videowatchshow-ship-it/make/${BRANCH}"

            # ===== 1. 시스템 패키지 (Xvfb + Google Chrome + 한글폰트) =====
            echo "=== [1/6] System packages ==="
            if ! command -v xvfb-run >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb fonts-noto-cjk >/dev/null 2>&1
              echo "Xvfb installed"
            else
              echo "Xvfb already installed"
            fi

            if ! command -v google-chrome-stable >/dev/null 2>&1; then
              cd /tmp
              wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ./google-chrome-stable_current_amd64.deb >/dev/null 2>&1 || sudo apt-get -f install -y -qq >/dev/null 2>&1
              rm -f google-chrome-stable_current_amd64.deb
              echo "Google Chrome installed: $(google-chrome-stable --version)"
            else
              echo "Chrome already installed: $(google-chrome-stable --version)"
            fi

            # ===== 2. Xvfb 가상 디스플레이 (서버에 모니터 없음) =====
            echo "=== [2/6] Xvfb virtual display ==="
            if ! pgrep -f "Xvfb :99" >/dev/null 2>&1; then
              Xvfb :99 -screen 0 1920x1080x24 -ac &
              sleep 1
              echo "Xvfb started on :99"
            else
              echo "Xvfb already running"
            fi

            # systemd 서비스에 DISPLAY 환경변수 추가
            if ! grep -q "DISPLAY=:99" /etc/systemd/system/gauth.service 2>/dev/null; then
              if [ -f /etc/systemd/system/gauth.service ]; then
                sudo sed -i '/\[Service\]/a Environment=DISPLAY=:99' /etc/systemd/system/gauth.service
                sudo systemctl daemon-reload
                echo "DISPLAY=:99 added to gauth.service"
              fi
            fi

            # Xvfb 자동 시작 서비스
            if [ ! -f /etc/systemd/system/xvfb.service ]; then
              sudo tee /etc/systemd/system/xvfb.service > /dev/null << 'XVFB'
            [Unit]
            Description=Xvfb virtual display
            After=network.target

            [Service]
            ExecStart=/usr/bin/Xvfb :99 -screen 0 1920x1080x24 -ac
            Restart=always

            [Install]
            WantedBy=multi-user.target
            XVFB
              sudo systemctl enable xvfb --now 2>/dev/null || true
              echo "xvfb.service created and enabled"
            fi

            # ===== 2.5 시간 동기화 (TOTP 필수) =====
            echo "=== [2.5/6] NTP time sync ==="
            echo "현재 서버 시간: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            sudo timedatectl set-ntp true 2>/dev/null || true
            if command -v ntpdate >/dev/null 2>&1; then
              sudo ntpdate -u pool.ntp.org 2>/dev/null || true
            elif command -v chronyd >/dev/null 2>&1; then
              sudo chronyc makestep 2>/dev/null || true
            else
              sudo apt-get install -y -qq ntpdate >/dev/null 2>&1 && sudo ntpdate -u pool.ntp.org 2>/dev/null || true
            fi
            echo "동기화 후 서버 시간: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

            # ===== 3. Node.js 확인 =====
            echo "=== [3/6] Node.js ==="
            node -v || {
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash - >/dev/null 2>&1
              sudo apt-get install -y -qq nodejs >/dev/null 2>&1
            }
            echo "Node: $(node -v), npm: $(npm -v)"

            # ===== 4. 코드 배포 =====
            echo "=== [4/6] Deploy code ==="
            sudo mkdir -p /opt/gauth-full /var/www/sites/gauth/public
            sudo chown -R $(whoami) /opt/gauth-full /var/www/sites/gauth/public
            cd /opt/gauth-full
            curl -sfL "${RAW}/gauth/upload_excels.js" -o upload_excels.js && echo "  upload_excels.js OK" || echo "  upload_excels.js FAIL"
            curl -sfL "${RAW}/gauth/auto_deploy.js" -o auto_deploy.js && echo "  auto_deploy.js OK" || echo "  auto_deploy.js FAIL"
            curl -sfL "${RAW}/gauth/index.html" -o /var/www/sites/gauth/public/index.html && echo "  index.html OK" || echo "  index.html FAIL"
            curl -sfL "${RAW}/gauth/xlsx.core.min.js" -o /var/www/sites/gauth/public/xlsx.core.min.js && echo "  xlsx.core.min.js OK" || echo "  xlsx.core.min.js FAIL"
            curl -sfL "${RAW}/advanced-google-login-v2.js" -o advanced-google-login-v2.js && echo "  advanced-google-login-v2.js OK" || echo "  advanced-google-login-v2.js FAIL"
            curl -sfL "${RAW}/package.json" -o package.json && echo "  package.json OK" || echo "  package.json FAIL"
            echo "Files downloaded"

            # ===== 5. npm install =====
            echo "=== [5/6] npm install ==="
            PUPPETEER_SKIP_BROWSER_DOWNLOAD=1 PUPPETEER_SKIP_DOWNLOAD=1 npm install --production 2>&1 | tail -10
            # Force install rebrowser-puppeteer + archiver if missing
            node -e "require('rebrowser-puppeteer')" 2>/dev/null || npm install rebrowser-puppeteer 2>&1 | tail -5
            node -e "require('archiver')" 2>/dev/null || npm install archiver 2>&1 | tail -5
            mkdir -p profiles failed_logins

            # auto_deploy 모듈 등록
            grep -q "auto_deploy" rebrowser-login.js || echo "require('./auto_deploy.js')(app);" >> rebrowser-login.js

            # ===== 5.5 TOTP 디버깅 + 패치 =====
            echo "=== [5.5/6] TOTP debug & patch ==="

            # 1. rebrowser-login.js에서 /codes/ 관련 코드 덤프
            echo "--- /codes/ endpoint code ---"
            grep -n -A10 "codes" rebrowser-login.js | head -40 || echo "  no /codes/ found"
            echo "--- generateTOTP function ---"
            grep -n -A10 "function generateTOTP" rebrowser-login.js || echo "  no generateTOTP found"
            echo "--- authenticator usage ---"
            grep -n "authenticator" rebrowser-login.js || echo "  no authenticator usage"

            # 2. bb01055781838 계정의 시크릿 확인
            echo "--- bb01055781838 account secret ---"
            node -e "
              const d = require('/opt/gauth-full/accounts_normalized.json');
              const accs = Array.isArray(d) ? d : (d.accounts || []);
              const a = accs.find(x => x.email && x.email.includes('bb01055781838'));
              if(a) { console.log('email:', a.email); console.log('totp_secret:', a.totp_secret); console.log('twoFA:', a.twoFA); console.log('secret length:', (a.totp_secret||'').length); }
              else console.log('account not found');
            " 2>&1 || echo "  failed to read accounts"

            # 3. TOTP 코드 생성 테스트
            echo "--- TOTP generation test ---"
            node -e "
              const { authenticator } = require('otplib');
              const d = require('/opt/gauth-full/accounts_normalized.json');
              const accs = Array.isArray(d) ? d : (d.accounts || []);
              const a = accs.find(x => x.email && x.email.includes('bb01055781838'));
              if(!a) { console.log('no account'); process.exit(0); }
              const raw = a.totp_secret || a.twoFA || '';
              console.log('raw secret:', JSON.stringify(raw));
              console.log('raw secret hex:', Buffer.from(raw).toString('hex'));

              // Method 1: as-is
              try { console.log('code (as-is):', authenticator.generate(raw)); } catch(e) { console.log('as-is error:', e.message); }

              // Method 2: strip spaces/hyphens only
              const s2 = raw.replace(/[\s-]/g, '').toUpperCase();
              try { console.log('code (strip ws):', authenticator.generate(s2)); } catch(e) { console.log('strip-ws error:', e.message); }

              // Method 3: full Base32 normalize
              const s3 = raw.toUpperCase().replace(/[\s\-_=]/g, '').replace(/[^A-Z2-7]/g, '');
              console.log('normalized:', JSON.stringify(s3), 'len:', s3.length);
              try { console.log('code (base32):', authenticator.generate(s3)); } catch(e) { console.log('base32 error:', e.message); }

              console.log('server time:', new Date().toISOString());
              console.log('epoch:', Math.floor(Date.now()/1000));
              console.log('totp step:', Math.floor(Math.floor(Date.now()/1000)/30));
            " 2>&1 || echo "  TOTP test failed"

            # 4. /codes/ 엔드포인트 실제 응답 확인
            echo "--- /codes/ API test ---"
            node -e "
              const d = require('/opt/gauth-full/accounts_normalized.json');
              const accs = Array.isArray(d) ? d : (d.accounts || []);
              const a = accs.find(x => x.email && x.email.includes('bb01055781838'));
              if(!a || !a.totp_secret) { console.log('no secret'); process.exit(0); }
              const http = require('http');
              http.get('http://localhost:4000/codes/'+a.totp_secret, r => {
                let b=''; r.on('data',c=>b+=c); r.on('end',()=>console.log('/codes/ response:', b));
              }).on('error', e => console.log('/codes/ error:', e.message));
            " 2>&1 || echo "  /codes/ test failed"

            # 5. generateTOTP 패치 (서버 rebrowser-login.js)
            cat > /tmp/patch_totp.js << 'PATCHEOF'
            const fs = require('fs');
            let code = fs.readFileSync('rebrowser-login.js','utf8');
            if (!/function generateTOTP/.test(code)) { console.log('no generateTOTP found'); process.exit(0); }
            if (/\[^A-Z2-7\]/.test(code)) { console.log('already patched'); process.exit(0); }
            const newFn = [
              'function generateTOTP(secret) {',
              '    try {',
              '        secret = String(secret).toUpperCase().replace(/[\\s\\-_=]/g, "").replace(/[^A-Z2-7]/g, "");',
              '        if (secret.length < 16) return null;',
              '        return authenticator.generate(secret);',
              '    } catch (error) {',
              '        return null;',
              '    }',
              '}'
            ].join('\n');
            code = code.replace(/function generateTOTP\(secret\)\s*\{[\s\S]*?\n\}/m, newFn);
            fs.writeFileSync('rebrowser-login.js', code);
            console.log('generateTOTP patched');
            PATCHEOF
            node /tmp/patch_totp.js 2>&1 || echo "  patch failed"

            # ===== 6. 서비스 재시작 =====
            echo "=== [6/6] Restart gauth ==="
            export DISPLAY=:99
            sudo systemctl restart gauth
            sleep 3
            # List ALL require() calls in rebrowser-login.js and check which are missing
            echo "=== Module dependency check ==="
            grep -oP "require\(\s*['\"]([^'\"]+)" /opt/gauth-full/rebrowser-login.js | sed "s/require(['\"]//g" | sort -u | while read mod; do
              # skip relative paths and node builtins
              case "$mod" in
                ./*|../*|path|fs|http|https|crypto|os|child_process|url|stream|util|events|net|tls|zlib|querystring|readline|assert|buffer|dns|cluster|dgram|domain|module|punycode|string_decoder|timers|tty|v8|vm|worker_threads)
                  echo "  [builtin/local] $mod"
                  ;;
                *)
                  node -e "require('$mod')" 2>/dev/null && echo "  [OK] $mod" || echo "  [MISSING] $mod"
                  ;;
              esac
            done
            echo "=== End module check ==="

            # Health check with retries
            for i in 1 2 3 4 5; do
              HTTP=$(curl -s -o /tmp/hc.txt -w "%{http_code}" http://localhost:4000/api/accounts 2>/dev/null || echo "000")
              if [ "$HTTP" = "200" ]; then
                python3 -c "import json; d=json.load(open('/tmp/hc.txt')); print('API OK — accounts:', len(d) if isinstance(d,list) else d.get('total','?'))" 2>/dev/null
                break
              fi
              echo "  Health check attempt $i: HTTP $HTTP"
              sleep 3
            done

            # Show service status and recent logs for debugging
            sudo systemctl status gauth --no-pager -l 2>/dev/null | tail -20 || true
            sudo journalctl -u gauth --no-pager -n 30 2>/dev/null || true
            echo "=== Deploy complete ==="

      - name: Cloudflare security level
        if: always()
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ZONE_ID }}" ]; then
            echo "CLOUDFLARE_TOKEN or CLOUDFLARE_ZONE_ID not set — skipping"
          else
            curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/settings/security_level" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_TOKEN }}" \
              -H "Content-Type: application/json" \
              --data '{"value":"essentially_off"}' | python3 -c "import json,sys; d=json.load(sys.stdin); print('Security level:', d.get('result',{}).get('value','?'), '— success' if d.get('success') else '— FAILED:', d.get('errors'))" || true
          fi
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" https://gauth.cent-solution.online/ --max-time 10)
          echo "Site HTTP: $HTTP"

      - name: SSH Cloudflare check
        if: always()
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          script: |
            # Check if Apache/Nginx is proxying correctly to port 4000
            echo "=== Port 4000 check ==="
            curl -s -o /dev/null -w "localhost:4000 HTTP %{http_code}\n" http://localhost:4000/ || echo "localhost:4000 unreachable"
            curl -s -o /dev/null -w "localhost:4000/api/accounts HTTP %{http_code}\n" http://localhost:4000/api/accounts || echo "API unreachable"
            echo "=== Apache/Nginx config ==="
            sudo apache2ctl -S 2>/dev/null | grep -i gauth || true
            sudo nginx -T 2>/dev/null | grep -A5 gauth || true
            cat /etc/apache2/sites-enabled/*gauth* 2>/dev/null || true
            cat /etc/nginx/sites-enabled/*gauth* 2>/dev/null || true
            echo "=== DNS check ==="
            host gauth.cent-solution.online 2>/dev/null || dig gauth.cent-solution.online +short 2>/dev/null || echo "DNS tools not available"
            echo "=== Done ==="

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.api_deploy.outputs.deploy_ok }}" = "true" ]; then
            echo "## Deploy SUCCESS via API" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.ssh_deploy.outcome }}" = "success" ]; then
            echo "## Deploy SUCCESS via SSH" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Deploy FAILED" >> $GITHUB_STEP_SUMMARY
            echo "- API: /api/deploy returned non-200" >> $GITHUB_STEP_SUMMARY
            echo "- SSH: secrets not configured or connection failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### To fix: set GitHub Secrets" >> $GITHUB_STEP_SUMMARY
            echo "GAUTH_HOST, GAUTH_USER, GAUTH_SSH_KEY" >> $GITHUB_STEP_SUMMARY
          fi
