name: Deploy gauth to server
on:
  workflow_dispatch:
  push:
    branches: [claude/auto-test-debugging-local-n0xjkg, claude/gauth-frontend-backend-fixes-cg2icv]
    paths:
      - 'gauth/index.html'
      - 'gauth/upload_excels.js'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via API (no SSH needed)
        run: |
          echo "=== Triggering server-side deploy ==="
          HTTP_CODE=$(curl -s -o /tmp/deploy_response.txt -w "%{http_code}" \
            -X POST https://gauth.cent-solution.online/api/deploy \
            -H "Content-Type: application/json" \
            --connect-timeout 15 \
            --max-time 90)
          echo "HTTP status: $HTTP_CODE"
          echo "Response body:"
          cat /tmp/deploy_response.txt || true
          echo ""
          if [ "$HTTP_CODE" = "200" ]; then
            cat /tmp/deploy_response.txt | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if d.get('ok'):
            print('Deployed:', ', '.join(d.get('deployed',[])))
            print(d.get('message',''))
          else:
            print('Error:', d.get('error','unknown'))
            sys.exit(1)
          "
          else
            echo "::warning::API deploy failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Deploy via SSH (fallback)
        if: failure()
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          source: "gauth/index.html,gauth/upload_excels.js"
          target: "/tmp/gauth-deploy/"
          strip_components: 1

      - name: Apply SSH deploy + restart (fallback)
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          script: |
            cp /tmp/gauth-deploy/index.html /var/www/sites/gauth/public/index.html
            cp /tmp/gauth-deploy/upload_excels.js /opt/gauth-full/upload_excels.js
            sudo systemctl restart gauth
            sleep 2
            sudo systemctl status gauth --no-pager | head -5
            echo "=== Deploy complete ==="
            rm -rf /tmp/gauth-deploy
