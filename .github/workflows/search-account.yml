name: Search account info on server
on:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-search-account.txt']

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Search account in all server DBs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            set -e
            KW="nguyennam2023qn"
            echo "=== $KW 검색 ==="

            echo "--- accounts_normalized.json + accounts_subsites.json ---"
            sudo node -e "
              const fs = require('fs');
              const files = [
                '/opt/gauth-full/accounts_normalized.json',
                '/opt/gauth-full/accounts_subsites.json'
              ];
              const kw = '$KW'.toLowerCase();
              for (const f of files) {
                try {
                  const raw = fs.readFileSync(f,'utf8');
                  const data = JSON.parse(raw);
                  const arr = Array.isArray(data) ? data : (data.accounts || []);
                  const found = arr.filter(a => JSON.stringify(a).toLowerCase().includes(kw));
                  if (found.length) {
                    console.log(f + ': ' + found.length + '건');
                    found.forEach(a => console.log(JSON.stringify(a)));
                  } else {
                    console.log(f + ': 없음');
                  }
                } catch(e) { console.log(f + ': ' + e.message); }
              }
            "

            echo ""
            echo "--- 하위 사이트 accounts.json ---"
            sudo node -e "
              const fs = require('fs');
              const kw = '$KW'.toLowerCase();
              const sites = fs.readdirSync('/var/www/sites').filter(d => {
                try { return fs.statSync('/var/www/sites/'+d+'/accounts.json').isFile(); } catch(e){return false;}
              });
              for (const s of sites) {
                const f = '/var/www/sites/'+s+'/accounts.json';
                try {
                  const raw = fs.readFileSync(f,'utf8');
                  const data = JSON.parse(raw);
                  const arr = Array.isArray(data) ? data : (data.accounts || []);
                  const found = arr.filter(a => JSON.stringify(a).toLowerCase().includes(kw));
                  if (found.length) {
                    console.log(s + ': ' + found.length + '건');
                    found.forEach(a => console.log(JSON.stringify(a)));
                  }
                } catch(e) {}
              }
            "

            echo ""
            echo "--- grep 원본 파일 ---"
            sudo grep -rl '$KW' /opt/gauth-full/*.json /opt/gauth-full/*.xlsx 2>/dev/null || echo "grep: 없음"
