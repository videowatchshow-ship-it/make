name: photo2 로그인 리다이렉트 실측 검증 (도메인 변수 계산 로직 + 결과 시뮬레이션)
on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo2-login-redirect-live-verify.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: auth_check.php / login_check.php 전체 로직 확인 + PHP 시뮬레이션
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 2m
          script: |
            INNER=$(cat <<'INNEREOF'
            echo "===== login_check.php 전문 (도메인 계산 로직 확인) ====="
            sudo cat -n /var/www/sites/chamgyo/public/photo2/login_check.php
            echo ""
            echo "===== auth_check.php 전문 (도메인 계산 로직 확인) ====="
            sudo cat -n /var/www/sites/chamgyo/public/photo2/auth_check.php
            echo ""
            echo "===== id='cent' 로 실제 리다이렉트 결과 시뮬레이션 (login_check.php 로직 그대로 실행) ====="
            sudo php -r '
              $_SERVER["HTTP_HOST"] = "xn--9d0bw2fjtyymch7de9d.info";
              $id = "cent";
              include "/var/www/sites/chamgyo/public/photo2/login_check.php";
            ' 2>&1 | head -5 || true
            INNEREOF
            )
            B64=$(printf '%s' "$INNER" | base64 -w0)
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command="echo $B64 | base64 -d | bash"
