name: probe-xjh-regex
on:
  push:
    paths: ['.github/workflows/probe-xjh-regex.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: addRoadFromString + ResultConvertor definitions
        run: |
          curl -sS --max-time 30 -A "Mozilla/5.0" -o m.js "https://fcj6.oqogyf.com/assets/main/index.js"
          python3 - <<'PY'
          s=open('m.js',encoding='utf-8',errors='replace').read()
          def ctx(key,b=300,a=2500,n=3):
              i=0;c=0
              while c<n:
                  i=s.find(key,i)
                  if i<0: break
                  print(f'\n===== {key} @{i} =====\n'+s[max(0,i-b):i+a]); i+=len(key); c+=1
          for k in ['addRoadFromString=function','ResultConvertor','specialFromNumber','ResultOtherHanlder',
                    'GIVE_UP','zhuangdui=','xiandui=','%10','/10']:
              ctx(k)
          PY
