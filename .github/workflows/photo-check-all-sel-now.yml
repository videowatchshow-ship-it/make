name: 지금 13계정 sel_.json 실제 상태 즉시 확인

on:
  workflow_dispatch:
  push:
    branches:
      - claude/photo2-folder-management-94knx8
    paths:
      - '.github/workflows/photo-check-all-sel-now.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 60s
          script: |
            /snap/bin/gcloud compute ssh videowatch_show@my-site-1 \
              --zone=asia-northeast1-a \
              --project=quantum-bonus-455522-b4 \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet \
              --command='bash -s' << "REMOTE"
            set +u
            P1="/var/www/sites/chamgyo/public/photo"

            echo "===== 13계정 sel_.json 지금 상태 (mtime 기준 최신순) ====="
            printf "  %-10s | %-19s | %s\n" "계정" "마지막 저장 시간" "내용"
            for U in aass0707 abc01 abc02 abc03 abc04 abc05 abc06 abc07 cent gain jay otuki tak; do
              F="$P1/data/sel_$U.json"
              if [ -f "$F" ]; then
                MT=$(sudo stat -c "%y" "$F" | cut -d. -f1)
                CT=$(sudo cat "$F")
                printf "  %-10s | %s | %s\n" "$U" "$MT" "$CT"
              else
                printf "  %-10s | MISSING\n" "$U"
              fi
            done

            echo ""
            echo "===== 방 110 인 계정 카운트 ====="
            N=0
            for U in aass0707 abc01 abc02 abc03 abc04 abc05 abc06 abc07 cent gain jay otuki tak; do
              F="$P1/data/sel_$U.json"
              [ -f "$F" ] && grep -q '"room_id":110' "$F" && N=$((N+1))
            done
            echo "  방 110 저장된 계정: $N개"

            echo ""
            echo "===== room_110.json 최신 데이터 (지금 실측) ====="
            R=$(sudo cat "$P1/data/room_110.json")
            echo "$R"
            echo ""
            echo "$R" | python3 -c "
            import sys, json
            d = json.load(sys.stdin)
            nums = d.get('nums', [])
            p = sum(1 for n in nums if n and n[0]=='P')
            b = sum(1 for n in nums if n and n[0]=='B')
            t = sum(1 for n in nums if n and n[0]=='T')
            print(f'  총 판수 = {len(nums)}')
            print(f'  P = {p} / B = {b} / T = {t}')
            print(f'  시퀀스: {\" > \".join(n[0] for n in nums)}')
            "

            echo ""
            echo "===== DONE ====="
            REMOTE
