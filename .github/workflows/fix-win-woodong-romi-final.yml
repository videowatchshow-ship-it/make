name: Fix win/woodong/romi final
on:
  workflow_dispatch:
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths:
      - '.github/workflows/fix-win-woodong-romi-final.yml'
      - '.github/scripts/fix-win-woodong-romi-final.sh'
jobs:
  f:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          source: ".github/scripts/fix-win-woodong-romi-final.sh"
          target: "/tmp/fwr/"
          strip_components: 2
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 180s
          script: |
            sudo bash /tmp/fwr/fix-win-woodong-romi-final.sh
            rm -rf /tmp/fwr
