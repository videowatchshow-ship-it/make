name: gauth · Google Identity Services signup (official, top-right, no-logout)

on:
  workflow_dispatch: {}
  push:
    branches: ['claude/gauth-frontend-backend-fixes-cg2icv']
    paths: ['.github/trigger-gsi-topright.txt']

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inject GIS widget + backend routes + systemd env
        uses: appleboy/ssh-action@v1.0.3
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        with:
          host: ${{ secrets.GAUTH_HOST }}
          username: ${{ secrets.GAUTH_USER }}
          key: ${{ secrets.GAUTH_SSH_KEY }}
          command_timeout: 180s
          envs: GOOGLE_OAUTH_CLIENT_ID
          script: |
            set -e
            F=/var/www/sites/gauth/public/index.html
            EX=/opt/gauth-full/rebrowser-login.js
            USERS=/opt/gauth-full/google_users.json
            [ -f "$USERS" ] || echo '[]' | sudo tee "$USERS" > /dev/null

            echo '=== 1. patch index.html: top-right GIS widget (idempotent) ==='
            sudo cp "$F" "$F.bak.$(date +%s)"
            sudo python3 - <<'PYEOF'
            import re
            f = '/var/www/sites/gauth/public/index.html'
            s = open(f, encoding='utf-8').read()
            s = re.sub(r'<!-- gsi-widget start -->.*?<!-- gsi-widget end -->\n', '', s, flags=re.S)
            widget = (
              '<!-- gsi-widget start -->\n'
              '<script src="https://accounts.google.com/gsi/client" async defer></script>\n'
              '<div id="gsi-widget" style="position:fixed;top:12px;right:14px;z-index:10000;display:flex;align-items:center;gap:8px;background:#161a20;border:1px solid #22282f;border-radius:999px;padding:6px 10px;font-family:-apple-system,BlinkMacSystemFont,\'Apple SD Gothic Neo\',sans-serif;font-size:12px;color:#e8ecef;min-height:34px">'
              '<span id="gsi-msg" style="color:#8a95a5">로그인 준비중…</span>'
              '<div id="gsi-btn"></div>'
              '<img id="gsi-avatar" style="display:none;width:26px;height:26px;border-radius:50%;object-fit:cover">'
              '<span id="gsi-name" style="display:none;color:#3ddc84;font-weight:700"></span>'
              '</div>\n'
              '<script>\n'
              '(function(){\n'
              '  var msg=document.getElementById("gsi-msg"),btn=document.getElementById("gsi-btn"),av=document.getElementById("gsi-avatar"),nm=document.getElementById("gsi-name");\n'
              '  function show(user){ msg.style.display="none"; btn.style.display="none"; av.style.display="inline-block"; nm.style.display="inline"; av.src=user.picture||""; nm.textContent=user.name||user.email||""; }\n'
              '  function onCred(res){ fetch("/api/auth/google",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"include",body:JSON.stringify({credential:res.credential})}).then(function(r){return r.json();}).then(function(d){ if(d && d.user){ show(d.user); } else { msg.textContent="로그인 실패: "+(d && d.error || "?"); }}).catch(function(e){ msg.textContent="오류: "+e.message; }); }\n'
              '  function renderBtn(cid){ if(!window.google||!google.accounts||!google.accounts.id){ setTimeout(function(){renderBtn(cid);},200); return; } google.accounts.id.initialize({client_id:cid, callback:onCred, auto_select:true, itp_support:true, use_fedcm_for_prompt:true}); google.accounts.id.renderButton(btn,{theme:"filled_blue",size:"medium",shape:"pill",text:"signin_with",locale:"ko"}); msg.style.display="none"; btn.style.display="block"; }\n'
              '  fetch("/api/auth/me",{credentials:"include",cache:"no-store"}).then(function(r){return r.json();}).then(function(d){ if(d && d.user){ show(d.user); return; } fetch("/api/auth/config",{cache:"no-store"}).then(function(r){return r.json();}).then(function(c){ if(!c.client_id){ msg.textContent="GOOGLE_OAUTH_CLIENT_ID 미설정"; return; } renderBtn(c.client_id); }); }).catch(function(){ msg.textContent="/api/auth/me 서버 상태 확인 필요"; });\n'
              '})();\n'
              '</script>\n'
              '<!-- gsi-widget end -->\n'
            )
            if '<body>' in s:
                s = s.replace('<body>', '<body>\n' + widget, 1)
                open(f, 'w', encoding='utf-8').write(s)
                print('widget injected')
            PYEOF

            echo ''
            echo '=== 2. inject Express routes if missing ==='
            sudo cp "$EX" "$EX.bak.$(date +%s)"
            sudo python3 - <<'PYEOF'
            f = '/opt/gauth-full/rebrowser-login.js'
            s = open(f, encoding='utf-8').read()
            if '/api/auth/google' in s:
                print('routes present, skipping')
            else:
                marker = "app.get('/api/subsite-counts'"
                idx = s.index(marker)
                route = r'''
            // --- Google Identity Services (official id_token flow, persistent cookie) ---
            function _gsi_parse_cookies(h){ var out={}; (h||'').split(';').forEach(function(p){ var i=p.indexOf('='); if(i>0){ out[p.slice(0,i).trim()]=decodeURIComponent(p.slice(i+1).trim()); } }); return out; }
            app.get('/api/auth/config', (_req, res) => { res.json({ client_id: process.env.GOOGLE_OAUTH_CLIENT_ID || '' }); });
            app.get('/api/auth/me', (req, res) => {
              try {
                const fs = require('fs');
                const c = _gsi_parse_cookies(req.headers.cookie);
                const sub = c.gauth_uid;
                if (!sub) return res.json({ user: null });
                let users = [];
                try { users = JSON.parse(fs.readFileSync('/opt/gauth-full/google_users.json','utf8')); } catch(e){}
                const u = users.find(x => x.sub === sub);
                if (!u) return res.json({ user: null });
                res.json({ user: { sub: u.sub, email: u.email, name: u.name, picture: u.picture } });
              } catch (e) { res.status(500).json({ error: String(e && e.message || e) }); }
            });
            app.post('/api/auth/google', async (req, res) => {
              try {
                const fs = require('fs');
                const https = require('https');
                let body = req.body;
                if (!body || typeof body !== 'object') {
                  body = await new Promise((resolve) => {
                    let d = '';
                    req.on('data', c => d += c);
                    req.on('end', () => { try { resolve(JSON.parse(d||'{}')); } catch(e){ resolve({}); } });
                  });
                }
                const credential = body.credential;
                if (!credential) return res.status(400).json({ error: 'missing credential' });
                const CID = process.env.GOOGLE_OAUTH_CLIENT_ID || '';
                if (!CID) return res.status(500).json({ error: 'GOOGLE_OAUTH_CLIENT_ID not set' });
                const info = await new Promise((resolve, reject) => {
                  const url = 'https://oauth2.googleapis.com/tokeninfo?id_token=' + encodeURIComponent(credential);
                  https.get(url, r => { let d=''; r.on('data', c => d += c); r.on('end', () => { try { resolve(JSON.parse(d)); } catch(e){ reject(e); } }); }).on('error', reject);
                });
                if (info.error || info.error_description) return res.status(401).json({ error: 'token invalid: ' + (info.error_description||info.error) });
                if (info.aud !== CID) return res.status(401).json({ error: 'aud mismatch' });
                if (info.iss !== 'https://accounts.google.com' && info.iss !== 'accounts.google.com') return res.status(401).json({ error: 'iss invalid' });
                if (parseInt(info.exp,10)*1000 < Date.now()) return res.status(401).json({ error: 'token expired' });
                let users = [];
                try { users = JSON.parse(fs.readFileSync('/opt/gauth-full/google_users.json','utf8')); } catch(e){}
                if (!Array.isArray(users)) users = [];
                let existing = users.find(u => u.sub === info.sub);
                let is_new = false;
                if (!existing) {
                  is_new = true;
                  existing = { sub: info.sub, email: info.email, email_verified: info.email_verified==='true' || info.email_verified===true, name: info.name || '', picture: info.picture || '', created_at: new Date().toISOString(), last_login: new Date().toISOString() };
                  users.push(existing);
                } else { existing.last_login = new Date().toISOString(); if (info.picture) existing.picture = info.picture; if (info.name) existing.name = info.name; }
                fs.writeFileSync('/opt/gauth-full/google_users.json', JSON.stringify(users, null, 2));
                // 10-year persistent cookie, httpOnly, SameSite=Lax, Secure
                const maxAge = 315360000; // seconds (~10y)
                res.setHeader('Set-Cookie', 'gauth_uid=' + encodeURIComponent(existing.sub) + '; Path=/; Max-Age=' + maxAge + '; HttpOnly; Secure; SameSite=Lax');
                res.json({ ok: true, new_user: is_new, user: { sub: existing.sub, email: existing.email, name: existing.name, picture: existing.picture } });
              } catch (e) { res.status(500).json({ error: String(e && e.message || e) }); }
            });
            '''
                s = s[:idx] + route + '\n' + s[idx:]
                open(f, 'w', encoding='utf-8').write(s)
                print('routes inserted')
            PYEOF

            echo ''
            echo '=== 3. syntax check ==='
            sudo node -c /opt/gauth-full/rebrowser-login.js && echo 'syntax OK'

            echo ''
            echo '=== 4. write systemd env drop-in ==='
            if [ -n "$GOOGLE_OAUTH_CLIENT_ID" ]; then
              sudo mkdir -p /etc/systemd/system/gauth.service.d
              sudo tee /etc/systemd/system/gauth.service.d/google-oauth.conf > /dev/null <<EOF
            [Service]
            Environment="GOOGLE_OAUTH_CLIENT_ID=$GOOGLE_OAUTH_CLIENT_ID"
            EOF
              sudo systemctl daemon-reload
              echo 'env drop-in written'
            else
              echo 'NOTICE: GOOGLE_OAUTH_CLIENT_ID github secret is empty; widget will show 미설정 message'
            fi

            echo ''
            echo '=== 5. restart gauth ==='
            sudo systemctl restart gauth
            sleep 2
            sudo systemctl is-active gauth

            echo ''
            echo '=== 6. live tests ==='
            curl -s --max-time 10 http://localhost:4000/api/auth/config
            echo ''
            curl -s --max-time 10 http://localhost:4000/api/auth/me
            echo ''
            curl -s -o /dev/null -w 'main HTTPS: %{http_code}\n' https://gauth.cent-solution.online/ --max-time 10
            echo 'widget present in HTML:'
            curl -s --max-time 10 https://gauth.cent-solution.online/ | grep -c 'gsi-widget start' || echo 0
