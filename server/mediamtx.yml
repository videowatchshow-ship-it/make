# CENTBEAM relay — MediaMTX 설정
logLevel: info
rtmp: yes
rtmpAddress: :1935
hls: yes
hlsAddress: :8888
webrtc: yes
webrtcAddress: :8889     # WHIP 인제스트: http://<host>:8889/<avatar>/whip
srt: no

# ── 인증 (MediaMTX internal auth) ──────────────────────────────────────────
# publish(송출)에는 사용자/비번을, read(재생)는 공개. WHIP은 Authorization: Bearer
# (user:pass) 또는 URL 쿼리로 전달.
# ⚠️ MediaMTX 는 YAML 안의 ${VAR} 치환을 지원하지 않는다(리터럴 문자열로 읽힘).
#    비밀은 반드시 환경변수 오버라이드로 주입한다 (MediaMTX 문서: MTX_ 접두어):
#      MTX_AUTHINTERNALUSERS_0_USER=<publisher>
#      MTX_AUTHINTERNALUSERS_0_PASS=<강한 비밀>
#    아래 값은 env 미설정 시의 로컬 기본값일 뿐, 프로덕션은 반드시 env 로 덮어쓸 것.
authMethod: internal
authInternalUsers:
  - user: publisher
    pass: change-me-via-MTX_AUTHINTERNALUSERS_0_PASS
    ips: []
    permissions:
      - action: publish
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
      - action: playback

paths:
  all_others:
    runOnReady: /opt/centbeam/server/fanout.sh $MTX_PATH
    runOnReadyRestart: yes
    runOnNotReady: pkill -f "fanout-$MTX_PATH" || true
