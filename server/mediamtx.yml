# CENTBEAM relay — MediaMTX 설정
logLevel: info
rtmp: yes
rtmpAddress: :1935
hls: yes
hlsAddress: :8888
webrtc: yes
webrtcAddress: :8889     # WHIP 인제스트: http://<host>:8889/<avatar>/whip
srt: no

# ── 인증 (MediaMTX 외부 HTTP 인증) ──────────────────────────────────────────
# 릴레이 API(/api/mediamtx/auth)가 매 publish/read/playback 요청을 세션 발급 토큰으로
# 허용/거부한다(응답 2xx=허용). 시청·송출 모두 인증됨 = 공개 아님(감사 CRITICAL #2 해소).
# api/metrics/pprof 만 제외. 내부 fanout(로컬 루프백)의 read 는 API 가 IP 로 허용.
# 활성화: MediaMTX 를 이 설정으로 (재)시작. 롤백은 authMethod: internal 로 되돌리면 됨.
authMethod: http
authHTTPAddress: http://127.0.0.1:3000/api/mediamtx/auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

paths:
  all_others:
    runOnReady: /opt/centbeam/server/fanout.sh $MTX_PATH
    runOnReadyRestart: yes
    runOnNotReady: pkill -f "fanout-$MTX_PATH" || true
